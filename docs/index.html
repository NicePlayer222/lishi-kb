陆进主持召开省政府常务会议》（9月30日，重温习近平总书记关于河南工作的重要讲话精神等），2026-09-30（转载，原发河南日报客户端），https://www.sohu.com/a/1082845431_121106991\n- [SE164] 大河报·豫视频（腾讯新闻发布）《10时19分！首发列车从商丘站开出，京港高铁雄商段正式开通，商丘站成为\"双十字\"枢纽》，2026-09-28，https://news.qq.com/rain/a/20260928A06J7P00\n- [SE165] 中新网（东方财富网转载）《京港高铁雄商段开通运营 河南商丘至北京行程缩短近1小时》，2026-09-28，http://finance.eastmoney.com/a/202609283885477751.html\n- [SE166] 正观新闻/郑州市人民政府网（转郑州日报）《国庆假期高速公路通行免费》（河南省交通运输厅2026年国庆假期高速出行提示），2026-09-29，https://www.zhengzhou.gov.cn/news1/10273014.jhtml\n- [SE167] 开封市人民政府网（转河南日报口径）《全省4A级及以上重点景区共接待游客1833.3万人次 实现营业收入11.6亿元》，2026-10-07（假期结束后通报），http://221.176.159.209:9001/kfsrmzfwz/zwyw/pc/content/content_2107995559500115968.html\n- [SE168] 郑州市人民政府网（转郑州日报）《全省消费市场繁荣有序》（省商务厅国庆假期消费数据），2026-10-09（假期结束后通报），https://www.zhengzhou.gov.cn/news1/10283329.jhtml\n- [SE169] 河南日报网《\"团圆经济\"更多元》（中秋假期消费数据对照）+ 河南日报《活动丰富 政策加力 场景焕新》（金秋消费季约900场），2026-09-28，https://www.henandaily.cn/news/2026/0928/1253539.html\n- [SE170] 国家粮食和物资储备局网站（地方动态）《2026年河南省秋粮收购工作会议召开》，2026-09-29（会议2026-09-24召开），https://www.lswz.gov.cn/html/dfdt2026year/2026-09/29/content_295493.shtml\n\n## 关联专题\n\n- [[W13]]\n- [[W12]]\n- [[D09]]\n- [[D12]]\n- [[D16]]\n- [[D17]]\n", "W15-周报-2026-10-11.md": "\n# W15 · 河南时政周报（2026-10-05 — 2026-10-11）\n\n## ⚡ 快速知识卡\n\n本周（10月5日—11日）横跨国庆假期收尾与节后复工，河南时政主线是\"新班子首调研+假日经济收官+三秋收尾\"。人事与治理线：10月6日省委书记周祖翼、代省长王陆进履新后首次共同外出调研，赴南阳淅川检查南水北调中线工程，强调\"扛稳一泓清水永续北上政治责任\"。经济线：省文旅厅数据显示全省4A级及以上重点景区国庆假期接待游客1833.3万人次、营业收入11.6亿元；雄商高铁开通后首个假期，商丘站发送旅客36.9万人次、同比增长25.2%。农业线：截至10月1日全省已收粮食作物4895万亩，全国秋粮收获10月8日过四成、10日过半，麦播在豫北陆续展开，专家建议播期较往年推迟7—10天。此周是\"省级新班子施政方向+假日消费数据+粮食安全韧性\"三条考线的交汇点。\n\n## 📖 本周要闻十条\n\n### 1. 10月6日周祖翼、王陆进南阳调研：新班子首次共同外出调研\n\n10月6日（国庆假期内），省委书记周祖翼，省委副书记、代省长王陆进到南阳市部分县区，调研检查南水北调中线工程高质量发展、乡村振兴、移民安置后续帮扶、中医药传承创新等工作。这是两人9月下旬履新后首次共同外出调研，调研首站选在南水北调，政治信号明确。在淅川县陶岔渠首枢纽工程，两人察看大坝、引水闸，强调坚持\"节水优先、空间均衡、系统治理、两手发力\"治水思路，加快构建现代化水网体系，切实维护南水北调工程安全、供水安全、水质安全；在丹江口水库现场察看水质检测情况，强调确保\"一泓清水永续北上\"。（来源[SE171]）\n\n### 2. 南阳调研的第二层：移民村振兴与中医药传承创新\n\n同次调研中，周祖翼、王陆进走进渠首附近淅川县九重镇邹庄村——南水北调移民村，察看丹江绿色果蔬园基地，了解移民就业、增收情况，强调发挥基层党组织战斗堡垒作用，落实好\"四议两公开\"，以产业振兴推动乡村全面振兴；还走进移民户邹新曾家中询问家庭收入、生产生活情况。随后两人到张仲景博物馆、医圣大殿，强调\"中医药是河南的一张名片\"，要守正创新、传承发展，推进中医药现代化、产业化。调研中周祖翼还要求当前做好安全生产、项目建设、民生保障，强化文旅市场管理运营，抓好秋粮收储、秋冬种及田间管护——直接点题本周\"三秋\"与假日经济两条主线。（来源[SE171]）\n\n### 3. 国庆假期河南文旅成绩单：1833.3万人次、11.6亿元\n\n10月7日记者从省文化和旅游厅获悉，今年国庆假期全省4A级及以上重点景区共接待游客1833.3万人次，实现营业收入11.6亿元。接待游客量前五景区为清明上河园、万岁山武侠城、云台山、龙门石窟、银基国际旅游度假区；旅游收入前五为云台山、万岁山武侠城、清明上河园、只有河南·戏剧幻城、银基国际旅游度假区。全省博物馆、纪念馆进馆481.4万人次，线上线下惠民活动4973场、参与群众126万人次。注意口径：1833.3万人次是\"4A级及以上重点景区\"的游客量，非全省全口径旅游接待人数，引用时不得扩大表述。（来源[SE172]）\n\n### 4. 雄商高铁首个假期检验：商丘站36.9万人次、同比增长25.2%\n\n国庆假期，商丘站累计发送旅客36.9万人次，较2025年同比增长25.2%。9月28日京港高铁雄商段开通后迎来首个长假，商丘枢纽区位优势持续放大，交通流量加速转化为跨区域文旅客流。此条与W13\"台前东站成为高铁进豫第一站\"的报道形成完整闭环：从官宣（9月25日）到开通（9月28日）再到首个假日数据（本周期公布），是\"重大基础设施建成→运营效益显现\"的完整证据链，也是\"高铁+假日经济+区域协调\"复合考题的现成数据。（来源[SE173]）\n\n### 5. 秋粮收获进度：10月8日全国过四成、10日过半\n\n据农业农村部农情调度，10月8日全国秋粮收获过四成，其中黄淮海收获过半；10月10日全国秋粮收获过半。驻马店西平县老王坡高标准农田示范区10月8日仍在收割成熟高粱。需注意区分：全国\"过半\"与河南\"黄淮海地区过半\"是区域口径；W13记录的\"河南7600多万亩秋粮收获进度过半\"是9月26日时点数，本周期河南全省收获面积暂未见官方单独汇总数（后续10月15日中新社报道的7267万亩为秋收基本结束口径，超出本周，仅作进度参照、不作为本周数据引用）。（来源[SE174]）\n\n### 6. \"三秋\"农机与烘干体系：400万台（套）农机与滑县样本\n\n新华社10月3日（假期内）报道：据河南省农业农村厅介绍，今年\"三秋\"期间河南计划投入各类农机400万台（套）以上，其中收获类机械21.4万台；截至10月1日，全省已收获粮食作物4895万亩，日收获进度达187万亩。产粮大县滑县投入玉米收割机1978台、烘干机41台、日烘干能力6480吨，预计\"十一\"假期期间全县秋粮基本收获完毕；濮阳准备烘干设备271台、日烘干能力超1.2万吨，打造\"收、烘、运、储\"闭环链条。400万台（套）与21.4万台是计划投入数，4895万亩是10月1日时点完成数——目标值与已完成值必须分开表述。（来源[SE175]）\n\n### 7. 麦播启动与\"适度晚播\"技术导向\n\n假期后豫北等地陆续进入麦播。滑县白马坡村种粮实践中\"10月8日左右即可播种小麦\"；新乡卫辉烘干点玉米亩产1200至1500斤。中国农业农村部小麦专家指导组顾问、河南农业大学教授郭天财提示（其系统观点经中新社10月15日报道传播）：当前气温整体偏高，结合超强厄尔尼诺事件预计暖冬，建议小麦播期较往年推迟7天至10天、部分地区可推迟15天，通过适度晚播抑制旺长、确保安全越冬。此条延续W12\"麦播不抢早、适期看墒情\"、W13\"寒露种麦正当时\"的线索：暖冬背景下\"晚播\"从权宜之计上升为技术导向。（来源[SE174][SE176]）\n\n### 8. 郑州公积金\"一键打包\"提取与体育消费券：假期收尾的民生小切口\n\n郑州住房公积金管理中心9月29日出台通知，新增物业费、取暖费、车位管理费及购房契税提取业务；10月8日（节后首个工作日）公布办理细则，市民可通过郑好办APP线上办理。同日，河南体育消费券第二期第三轮10月8日10时开抢，第二期共分3轮、发放时间为9月25日至10月15日，券面为满90减30、满150减50、满300减100。两条均为\"节后首日\"落地的惠民政策细节，是\"民生实事+促消费\"的基层素材；体量大、易出题的是时间节点（10月8日）与发放平台（云闪付、美团）。（来源[SE173]）\n\n### 9. 老君山\"一元午餐\"收官：25122份、多出3194元\n\n10月7日，洛阳老君山景区\"1元午餐\"活动收官：共售出25122份午餐，收回款项28316元，多出3194元，投币箱内还有游客留下的千元红包及留言。该活动已持续十年，从免费提供演化为\"1元自助、自觉投币\"，成为河南文旅诚信服务与景区品牌营销的标志性案例。此条与要闻3的全省文旅数据并读：硬数据（1833.3万人次）之外，老君山代表的是\"服务体验型\"文旅竞争力，可用于\"流量与留量\"\"诚信经营\"等案例分析。（来源[SE173]）\n\n### 10. 郑州跻身全国消费力城市TOP10：假日经济的河南坐标\n\n据抖音生活服务2026中秋国庆消费报告，北京、郑州入围消费力城市TOP10（媒体报道口径，10月10日前后发布）。这与要闻3、4共同构成本周假日经济证据链：景区收入（11.6亿元）、铁路客流（商丘站36.9万人次）、平台消费榜（郑州TOP10）三个维度。另据新华社10月2日报道，河南多地\"十一\"假期统筹农机调度、应急烘干保障秋收——文旅消费与农业抢收同框，正是\"中原粮仓+消费大省\"双重身份的写照。（来源[SE177][SE175]）\n\n## 📖 深度案例：南阳调研——新班子首站为何选南水北调渠首\n\n**主体与事件**：河南省委书记周祖翼、代省长王陆进，10月6日赴南阳市淅川县等地调研检查南水北调中线工程高质量发展、乡村振兴、移民安置后续帮扶、中医药传承创新等工作（[SE171]）。\n\n**背景与问题**：其一，两人履新仅约两周（9月23日全省领导干部会议宣布任命、9月24日代理省长任命），首次共同外出调研的选址是外界研判新班子施政重心的第一信号。其二，河南是南水北调中线工程核心水源地和渠首所在地，淅川县为此累计动迁移民数十万，\"守着水库不能富\"曾是长期矛盾；水质保护与库区发展的平衡是政治责任与民生诉求的双重考题。其三，2026年正值省级领导班子换届后的施政开局之年，\"十五五\"规划纲要已印发，新班子需要拿出贯穿未来五年的工作主线。\n\n**做法与机制（三个层面）**：一是政治责任具象化。在陶岔渠首枢纽察看大坝、引水闸，重申\"节水优先、空间均衡、系统治理、两手发力\"十六字治水思路，把\"一泓清水永续北上\"从口号落到工程安全、供水安全、水质安全三项具体维护要求（[SE171]）。二是库区发展闭环化。在移民村邹庄村看果蔬园基地、进移民户家中问收入，把\"保水质\"与\"促增收\"放在同一调研动线中，要求落实\"四议两公开\"、延伸农业产业链条——即生态责任不以牺牲库区民生为代价，而是以产业振兴对冲（[SE171]）。三是地域优势名牌化。在医圣祠强调\"中医药是河南的一张名片\"，推进中医药现代化、产业化，把南阳的历史文化资源（张仲景）转化为产业叙事（[SE171]）。\n\n**成效与数据（区分已完成与方向性表述）**：已完成口径——调研本身（10月6日完成）；南水北调中线工程通水以来持续向北方供水的既有事实。方向性表述——\"建设现代化省域副中心城市\"\"确保一泓清水永续北上\"均为要求性表述，本周无新增量化指标；调研未发布水质数据、移民收入数据，不作虚构引用。（[SE171]）\n\n**局限与观察点**：其一，调研提出的要求如何转化为政策文件，需观察后续省政府常务会议与专项方案（10月17日王陆进已主持召开省政府常务会议研究统筹推进高质量发展和高水平保护等工作，超出本周范围，仅作跟踪线索）；其二，库区移民增收的产业路径（果蔬园、乡村旅游）规模有限，能否形成可复制模式待检验；其三，中医药\"名片\"涉及南阳、焦作、新乡等多地竞争性布局，省级统筹机制尚未见文件。\n\n**可迁移点与评价**：其一，\"新任领导班子首站调研\"是分析地方施政重心的通用方法论：选址（水源地）→主题（生态+民生+产业）→提法（沿用十六字治水思路）三层信息可以拆解作答。其二，\"保水质与促增收同框\"是\"绿水青山就是金山银山\"在水源地的具体化，可与D10防返贫监测、D12粮食安全并读——河南的生态责任、粮食责任、发展诉求三线合一。其三，移民村\"四议两公开\"是基层治理标准化工具，与D03基层矛盾纠纷多元化解、D06网格化治理同属\"党建引领基层治理\"工具箱。\n\n**可考角度**：常识——南水北调中线工程渠首位于淅川县陶岔、总干渠自丹江口水库引水；案例分析——新班子首站调研的信号意义与\"生态+民生\"调研动线设计；材料写作——从\"一泓清水永续北上\"看跨区域生态补偿与水源地可持续发展。\n\n**金句（适用主题：生态保护、责任担当、区域协调）**：\n1. 渠首一泓清水，映照的是\"国之大者\"的分量，丈量的是一方主政者的担当。\n2. 守好水源地，不是让库区群众守着清水过穷日子，而是让好生态长出好产业。\n3. 调研的第一站，就是施政的宣言书。\n\n## 复盘与下周关注\n\n- 本周复盘：主线有三——新班子首次共同外出调研落子南阳南水北调（生态责任+移民民生+中医药产业三层议程）、国庆假期经济数据密集发布（重点景区1833.3万人次/11.6亿元、商丘站36.9万人次）、\"三秋\"进入秋收扫尾与麦播启动的换挡期（全省已收4895万亩@10月1日、农机400万台套计划、\"晚播7—10天\"技术导向）。假期内省级重大会议节奏放缓属正常，调研选择本身即是施政表态。\n- 下周关注：省政府常务会议复会后的政策部署（研究统筹推进高质量发展和高水平保护等）；全省秋收完成面积与麦播进度的官方汇总口径；周祖翼、王陆进后续调研是否覆盖其余省辖市、形成调研版图；\"开局起步'十五五'\"系列后续发布；体育消费券10月15日发放截止后的促消费效果数据。\n\n## 来源与证据\n\n- [SE171] 河南政协网（转河南日报客户端，记者刘婵、张笑闻）《周祖翼王陆进在南阳调研检查有关工作时强调 扛稳一泓清水永续北上政治责任 奋力建设现代化省域副中心城市》，2026-10-06，https://www.hnzx.gov.cn/2026/10-06/4371874.html\n- [SE172] 河南一百度（转大河网-河南日报，记者郭歌）《国庆假期 活力满满丨全省4A级及以上重点景区共接待游客1833.3万人次 实现营业收入11.6亿元 中原文旅繁荣向好》，2026-10-08，https://m.henan100.com/news/2026/1244176.shtml\n- [SE173] 河南日报网《手机报·早报 2026年10月09日》（含商丘站36.9万人次、郑州公积金细则、体育消费券、老君山一元午餐等条目），2026-10-09，https://www.henandaily.cn/news/2026/1009/1254865.html\n- [SE174] 新华网《全国秋粮收获过四成》（10月8日农情调度），2026-10-08，https://www.news.cn/20261008/928b355c9ef840369622b3513ed5ccb1/c.html ；另见新华网《全国秋粮收获过半》，2026-10-10，https://www.news.cn/20261010/bfdb3b5f03f841ada2779dff7dfae275/c.html\n- [SE175] 新华网（新华社记者马意翀等）《粮食大省秋收忙丨河南多措并举力保秋粮丰收》，2026-10-02，https://www.news.cn/local/20261002/a249734d94f74106a154e6d800bb54d3/c.html\n- [SE176] 中新网（中新社记者韩章云）《河南秋收基本结束 收获7267万亩粮食作物》（含郭天财\"播期推迟7至10天\"建议，发布于10月15日，超出本周、作技术导向参照），2026-10-15，https://www.chinanews.com.cn/cj/2026/10-15/10714935.shtml\n- [SE177] 腾讯新闻（转抖音生活服务）《抖音生活服务2026中秋国庆消费报告：北京、郑州入围消费力城市TOP10》（媒体报道口径），2026-10-10，https://news.qq.com/rain/a/20261010A05TV000\n\n## 关联专题\n\n- [[W13]]\n- [[W12]]\n- [[P01]]\n- [[D10]]\n- [[D12]]\n- [[D16]]\n", "W16-周报-2026-10-18.md": "\n# W16 · 河南时政周报（2026-10-12 — 2026-10-18）\n\n## ⚡ 快速知识卡\n\n本周（10月12日—18日）河南时政主线是\"调研定调+经济冲刺+秋收扫尾+节会开跑\"。治理线：10月14日至15日省委书记周祖翼、代省长王陆进赴信阳新县、光山县调研，瞻仰鄂豫皖苏区首府烈士陵园，强调弘扬大别山精神、落实\"两个更好\"；14日两人还走访中央驻豫新闻单位。经济线：10月18日四季度全省经济运行工作推进会在郑州召开，部署促消费扩投资、强创新兴产业等六个\"精准发力\"。农业线：截至10月12日全省已收秋作物10920万亩、占93.3%，至10月14日达11159万亩、粮食7267万亩，秋收基本结束、麦播接续。文旅线：开封第44届菊花文化节10月17日晚启幕、全城布菊330万盆；10月18日约2.5万名跑者参加2026郑州马拉松。\n\n## 📖 本周要闻十条\n\n### 1. 10月14日至15日周祖翼、王陆进信阳调研：弘扬大别山精神，加快革命老区振兴\n\n省委书记周祖翼，省委副书记、代省长王陆进到信阳市新县、光山县，调研红色文化传承弘扬、乡村振兴、产业发展等工作。两人冒雨瞻仰鄂豫皖苏区首府烈士陵园并敬献花篮，参观鄂豫皖苏区首府革命博物馆、刘邓大军千里跃进大别山纪念馆，提出用数字化技术加强文献档案库、线上数据库建设，深挖精神内核、活化红色记忆。周祖翼强调，大力弘扬大别山精神，扛牢实现\"两个更好\"的政治责任和历史担当，推进乡村全面振兴，培育壮大特色产业，加快推动革命老区振兴发展。这是继10月6日南阳调研之后，新班子的又一次市外集体调研，选址从\"水源地\"转向\"革命老区\"，施政议程中的红色基因与乡村振兴分量进一步显性化。（来源[SE181]）\n\n### 2. 信阳调研的产业与民生触点：田铺大塆、羚锐制药、司马光油茶园\n\n在同次调研中，两人在新县田铺大塆察看创客小店，了解农文旅融合发展情况，鼓励依托绿色生态、红色文化资源，保护乡土风貌、守护绿色生态，让红色文化更好赋能乡村振兴；在河南羚锐制药强调扎根老区、聚焦主业，推动中医药传承创新发展，促进科技成果转化，并要求强化安全生产意识。在光山县司马光油茶园，提出坚持绿色发展、推广\"公司+农户\"模式、建立健全利益联动机制，让油茶树成为老区群众的\"摇钱树\"；在文殊乡东岳村看望中办派驻光山县挂职干部，强调把基层党组织建设成坚强战斗堡垒。调研同时要求各地各部门抓实抓细安全稳定工作，为党的二十届五中全会和省第十二次党代会胜利召开营造良好环境。（来源[SE181]）\n\n### 3. 10月18日四季度全省经济运行工作推进会：六个\"精准发力\"冲刺收官\n\n10月18日，2026年四季度全省经济运行工作推进会在郑州召开。周祖翼出席并讲话，王陆进主持。会议总结前三季度经济工作，认为全省经济运行保持总体平稳、向新向优态势，要求扛稳经济大省挑大梁责任，跑出四季度高质量发展加速度。部署集中在六个\"精准发力\"：促消费、扩投资（惠民生和促消费、投资于物和投资于人紧密结合）；强创新、兴产业（贯彻《中共中央国务院关于发展新质生产力的意见》，构建现代化产业体系）；抓改革、促开放（融入全国统一大市场建设，稳住外贸外资基本盘）；稳粮食、促振兴（高质高效推进\"三秋\"生产，抓牢常态化精准帮扶）；惠民生、兜底线（稳就业、强化大气污染防治）；防风险、护稳定（抓好安全生产，以高水平安全护航高质量发展）。会上省委常委、常务副省长张敏通报经济运行情况，省发改委、省工信厅、省商务厅和郑州、洛阳、南阳市发言。（来源[SE182]）\n\n### 4. 10月14日周祖翼、王陆进看望中央驻豫新闻单位：党代会前的舆论动员\n\n在党的二十届五中全会和省第十二次党代会即将召开之际，10月14日，周祖翼、王陆进到部分中央驻豫新闻单位走访调研，看望慰问新闻工作者，希望充分发挥主流媒体舆论引导作用，为谱写新篇章广泛凝聚合力。此条与信阳调研中\"为五中全会和省第十二次党代会营造良好环境\"的表述相互印证：本周省级主要领导行程明显围绕党代会前夕的政治准备展开，省第十二次党代会筹备进入窗口期（10月19日下午党代会预备会议举行，超出本周、作后续跟踪线索）。（来源[SE190]）\n\n### 5. 秋收进入扫尾：10920万亩（93.3%）到基本结束\n\n据河南省农业农村厅数据，截至10月12日，全省已收获秋作物10920万亩、占93.3%，其中粮食作物7129万亩、占93.8%；玉米收获基本结束，花生收获大头落地，水稻、大豆、瓜菜收获过八成，日收获进度166万亩。至10月14日，全省已收获秋作物11159万亩、占95.4%，其中粮食作物7267万亩、占95.6%，除部分沿黄水稻、再生稻外秋收基本结束（10月15日中新社报道口径）。数据链条连续可查：10月1日4895万亩（W15已录）→10月12日10920万亩→10月14日11159万亩，口径均为\"秋作物总面积占比\"，引用时注意\"秋作物\"与\"粮食作物\"两个分母不可混用。（来源[SE185][SE186]）\n\n### 6. 中国开封第44届菊花文化节启幕：330万盆菊花与\"宋韵开封，菊香中国\"\n\n10月17日上午10时，中国开封第44届菊花文化节线上开幕式举行；当晚8时，赏菊启动仪式在龙亭景区举行。本届菊花文化节以\"宋韵开封，菊香中国\"为主题，为期一个月、持续至11月17日，全城布展菊花330万盆，推出6条菊花文化节专属主题旅游线路。龙亭景区作为核心主会场，节会期间推出60余场昼夜轮番上演的演艺活动，《芙蓉锦鸡图》《孔雀琵琶图》等古画景观复原亮相。此节会为商务部备案的国家级节会品牌（文化和旅游部2026年9月8日同意备案），是\"文旅文创融合\"战略下古都节会经济的年度样本。（来源[SE183]）\n\n### 7. 10月18日2026郑州马拉松开跑：约2.5万跑者与\"最有文化的马拉松\"\n\n10月18日上午，2026郑州马拉松在郑州如意湖畔鸣枪开跑，来自天南海北的约25000名跑者参赛。该赛事为中国田径协会认证的A类赛事，以打造\"最有文化的马拉松\"为目标：设诗词长廊、诗词氛围赛道、古装诗人NPC巡游、姓氏旗手与姓氏完赛奖牌、豫剧与少林功夫展演等文化环节。本届姓氏旗手报名通道共收到全国3979份申请、汇聚489个姓氏，最终148个姓氏进入旗手名单。赛事期间郑州部分道路实施临时交通管制，管制区域最大时间跨度从5时至14时，80条公交线路临时调整，选手、志愿者可免费乘车。马拉松全长42.195公里，赛道涵盖人民路、金水路、平安大道等城市主干道。（来源[SE184][SE189]）\n\n### 8. \"2026世界市长对话·洛阳\"收官报道：10余国90余名市长共话古都焕新\n\n10月9日至11日，由国务院新闻办公室指导、以\"赓续古都文脉 互鉴城市文明\"为主题的\"2026世界市长对话·洛阳\"活动在洛阳举行，来自中国、英国、意大利、阿根廷、阿尔及利亚等10余个国家的90余名市长、市长代表、国际组织代表和专家学者，围绕文化遗产保护传承、产业转型升级、城市更新等议题深入交流（《人民日报》10月12日刊发报道，收束在本周信息周期内）。洛阳以龙门石窟、隋唐洛阳城等世界文化遗产为场景承接国际对话，是\"行走河南·读懂中国\"品牌国际化传播的又一实例，可作\"文化走出去+城市更新\"复合考题素材。（来源[SE187]）\n\n### 9. 河南34个饮用水水源地入选《全国重要饮用水水源地名录》\n\n《全国重要饮用水水源地名录》近日发布（10月12日河南日报手机报报道），河南共有34个饮用水水源地入选，其中黄河流域重要饮用水水源地在全省数量最多，包括郑州市黄河水源地（邙山、花园口）、郑州市尖岗水库水源地、开封市黄河黑岗口水源地等。此条与W15\"南阳调研扛稳一泓清水永续北上政治责任\"形成呼应：从政治表态到名录落地，水源地保护是河南生态考线的常设题点，注意区分\"入选名录\"（已完成事实）与\"水质达标率\"（本周期未发布新数据，不作虚构引用）。（来源[SE187]）\n\n### 10. 郑州8526面国庆国旗回收循环使用：精细治理小切口\n\n10月12日，郑州市城管局就国庆期间悬挂国旗的后续处理及循环使用问题回应：城区各街道悬挂的8526面国旗已基本回收完毕，清洗维修后入库，明年国庆循环使用。同日河南日报手机报还报道郑州多部门联合治理超限超载。国旗\"回收—清洗—入库—复用\"的闭环是城市精细化管理与厉行节约的基层素材；数据仅限郑州城区口径，不能扩大为\"全省\"。（来源[SE188]）\n\n## 📖 深度案例：信阳调研——新班子为何把第二站放在大别山革命老区\n\n**主体与事件**：10月14日至15日，省委书记周祖翼、省委副书记、代省长王陆进赴信阳市新县、光山县，调研红色文化传承弘扬、乡村振兴、产业发展等工作，并要求为党的二十届五中全会和省第十二次党代会营造良好环境（[SE181]）。\n\n**背景与问题**：其一，信阳地处大别山革命老区核心区域，鄂豫皖苏区是土地革命战争时期全国第二大革命根据地，\"两个更好\"（把革命老区建设得更好、让老区人民过上更好生活）是习近平总书记对老区的殷殷嘱托，调研是对这一政治责任的现场重申。其二，这是新班子履新后第二次市外调研：首站南阳（10月6日）落子南水北调水源地，主打生态与\"国之大者\"；第二站信阳转向红色基因与乡村振兴，两天内覆盖\"红色—绿色—产业\"三个维度，调研版图的选点逻辑值得拆解。其三，调研时点紧邻五中全会与省党代会，带有明确的政治仪式与动员属性。\n\n**做法与机制（三个层面）**：一是红色资源活化。瞻仰烈士陵园、敬献花篮之外，明确提出\"利用数字化技术加强文献档案库、线上数据库等建设，深挖精神内核、活化红色记忆\"——把红色基因传承从瞻仰仪式推进到数字化基础设施建设的操作层面（[SE181]）。二是文旅赋能振兴。在田铺大塆察看创客小店，肯定\"老家寒舍\"民宿等农文旅融合路径，要求保护乡土风貌、守护绿色生态，即\"红色文化+绿色生态\"双资源变现（[SE181]）。三是特色产业联农。在司马光油茶园推广\"公司+农户\"模式、建立健全利益联动机制；在羚锐制药强调中医药传承创新与科技成果转化；在东岳村肯定中办挂职干部与常态化帮扶，要求建强基层党组织——\"龙头企业+农户+帮扶机制+基层堡垒\"构成完整的联农带农链条（[SE181]）。\n\n**成效与数据（区分已完成与方向性表述）**：已完成口径——调研本身（10月14日至15日完成）；田铺大塆创客小店、羚锐制药、司马光油茶园等为既有存续业态，报道提及\"生意兴隆、游客众多\"\"油茶果挂满枝头\"，无新增量化数据。方向性表述——\"两个更好\"\"让油茶树成为摇钱树\"\"生态美、产业兴、百姓富的有机统一\"均为要求性表述，本周未发布老区收入、油茶产业规模等新数据，不作虚构引用。（[SE181]）\n\n**局限与观察点**：其一，调研提出的要求如何转化为省级政策文件（如老区振兴专项方案、油茶产业扶持政策），需跟踪省政府常务会议与省党代会报告表述；其二，\"公司+农户\"利益联动机制在油茶这类长周期产业中如何防违约、保收益，尚待实证；其三，红色资源数字化建设的投入规模与运营主体未见披露。\n\n**可迁移点与评价**：其一，\"新班子调研版图\"是研判施政重心的方法论：南阳（生态+移民+中医药）→信阳（红色+老区+乡村振兴），两站均含中医药元素，可预判中医药产业链是省级持续议程。其二，\"红色文化赋能乡村振兴\"是老区振兴的标准答题框架：资源（红色+绿色）→转化（文旅融合、创客经济）→机制（公司+农户、利益联动）→保障（基层党建、驻村帮扶），四段式结构可直接迁移到申论写作。其三，数字化活化红色记忆是\"文化+科技\"的交叉点，与D16文旅文创融合、D18人才引育并读。\n\n**可考角度**：常识——鄂豫皖苏区首府位于新县、大别山精神的内涵（坚守信念、胸怀全局、团结奋进、勇当前锋）、\"两个更好\"的出处；案例分析——从调研动线看老区振兴的资源转化逻辑；材料写作——以\"红色基因+绿色发展\"为主线的老区振兴倡议或评论。\n\n**金句（适用主题：红色基因、乡村振兴、责任担当）**：\n1. 大别山的红旗二十八年不倒，靠的是与群众想在一起、站在一起、干在一起。\n2. 老区振兴，不是等来的救济，而是把红色资源、绿色生态变成富民产业。\n3. 一棵油茶树连着一家人的日子，也连着\"两个更好\"的答卷。\n\n## 复盘与下周关注\n\n- 本周复盘：主线有四——省级新班子完成第二次市外调研并完成党代会前舆论走访（信阳\"红色+老区\"、中央驻豫新闻单位）；四季度经济运行推进会以六个\"精准发力\"定调收官冲刺；\"三秋\"完成秋收到麦播的换挡（秋作物11159万亩@10月14日、粮食7267万亩）；文旅节会密集启幕（开封菊花文化节330万盆、郑马约2.5万跑者），叠加世界市长对话·洛阳的国际传播余温。与W15相比，省级议程从\"假期经济+三秋\"切换到\"党代会筹备+全年目标冲刺\"。\n- 下周关注：省第十二次党代会开幕与报告全文（10月19日预备会议已举行，属下一周期核心事件）；党的二十届五中全会对河南工作的部署映射；全省麦播进度与小麦播期\"适度晚播\"的官方口径；菊花文化节、郑马之后的文旅消费数据发布；四季度经济推进会六个\"精准发力\"对应的省级配套文件。\n\n## 来源与证据\n\n- [SE181] 新华网河南频道（转河南日报，全媒体记者刘婵、张笑闻）《周祖翼王陆进在信阳调研时强调 牢记殷殷嘱托 弘扬大别山精神 加快推动革命老区振兴发展》，2026-10-16，http://www.ha.xinhuanet.com/20261016/bc7c20d0f2ea477e860b40ffd46c3bd1/c.html\n- [SE182] 河南政协网（转河南日报客户端，记者刘婵、张笑闻）《2026年四季度全省经济运行工作推进会召开 周祖翼出席并讲话 王陆进主持》，2026-10-18，https://www.hnzx.gov.cn/2026/10-18/4372465.html\n- [SE183] 新华网《开封第44届菊花文化节开幕》（全城布展菊花330万盆、6条主题旅游线路），2026-10-18，http://www.xinhuanet.com/photo/20261018/e7f3616ae7994a6b9057eae6a21a3d76/c.html\n- [SE184] 新华网（新华社记者刘金辉、袁月明、郑家宝）《追光丨诗词作伴，姓氏为旗 郑州马拉松还能这么玩？》（约25000名跑者、3979份旗手申请、489个姓氏、148个姓氏旗手），2026-10-18，https://www.news.cn/sports/20261018/5c0a3a87cea949ac82870bc549a4f41f/c.html\n- [SE185] 网易号（转河南省农业农村厅数据）《截至10月12日，河南省已收获秋作物10920万亩》（10920万亩、93.3%，粮食7129万亩、93.8%），2026-10-13，https://www.163.com/dy/article/L92ED7UB0550B6IS.html\n- [SE186] 东方财富网（转中新社）《河南秋收基本结束 收获7267万亩粮食作物》（截至10月14日秋作物11159万亩、95.4%，粮食7267万亩、95.6%），2026-10-15，https://finance.eastmoney.com/a/202610153896767730.html\n- [SE187] 河南日报网《手机报·早报 2026年10月12日》（含河南34个水源地入选国家级名录、\"2026世界市长对话·洛阳\"等条目；市长对话事实另见《人民日报》2026-10-12 https://paper.people.com.cn/rmrb/pc/content/202610/12/content_30185072.html ），2026-10-12，https://www.henandaily.cn/news/2026/1012/1255554.html\n- [SE188] 河南日报网《手机报·早报 2026年10月13日》（含郑州8526面国庆国旗回收循环使用、河南已收获秋作物10920万亩等条目），2026-10-13，https://www.henandaily.cn/news/2026/1013/1255901.html\n- [SE189] 河南日报网《手机报·早报 2026年10月18日》（含郑马交通管制5时至14时、42.195公里赛道、下周最低气温跌至个位数等条目），2026-10-18，https://www.henandaily.cn/2026/1018/1257361.html\n- [SE190] 新华网河南频道（转河南日报）《周祖翼王陆进看望慰问部分中央驻豫新闻单位》，2026-10-14，http://www.ha.xinhuanet.com/20261014/948c88b0a3a242e989514f7119464a48/c.html\n\n## 关联专题\n\n- [[W15]]\n- [[W13]]\n- [[P01]]\n- [[D10]]\n- [[D12]]\n- [[D16]]\n- [[D18]]\n", "W17-周报-2026-10-25.md": "\n# W17 · 河南时政周报（2026-10-19 — 2026-10-25）\n\n## ⚡ 快速知识卡\n\n本周（10月19日—25日）河南时政头条是省第十二次党代会：10月18日十一届省委十二次全会决定大会20日在郑州召开，19日举行预备会议（应到代表919名、出席888名）并产生110人主席团，20日大会开幕。这是\"十五五\"开局之年、河南\"扬长补短、全面崛起\"关键阶段的一次换届大会。经济面：国家统计局10月19日公布前三季度全国GDP同比增长4.6%。农业面：秋收基本结束（已收7267万亩），全省进入麦播高峰，《2026年小麦秋播生产技术明白纸》给出门经纬度分区播期。文旅面：开封第44届菊花文化节开幕，全城布展菊花330万盆。此周是\"换届政治+宏观数据+秋冬种衔接\"三线交汇。\n\n## 📖 本周要闻十条\n\n### 1. 10月18日十一届省委十二次全会：为党代会定盘\n\n10月18日，中国共产党河南省第十一届委员会第十二次全体会议在郑州举行，出席者为省委委员80人、省委候补委员2人，会议由省委常委会主持，省委书记周祖翼讲话。全会决定，省第十二次党代会于10月20日在郑州召开；讨论并通过了十一届省委向省十二次党代会的报告、省十一届纪委向大会的工作报告，决定将两份文件提请大会审查，周祖翼就报告讨论稿向全会作了说明。全会总结了省第十一次党代会以来5年的工作，概括为围绕\"两个确保\"深入实施\"十大战略\"、推进\"1+2+4+N\"目标任务体系。全会同时要求：加力做好重大项目实施、促进消费、培育外贸新动能等工作，加强秋播和田间管理，冲刺四季度，确保\"十五五\"实现良好开局。（来源[SE191]）\n\n### 2. 10月19日党代会预备会议与主席团第一次会议：程序要件齐备\n\n10月19日下午，省第十二次党代会预备会议在省人民会堂举行。大会应到代表919名，出席预备会议代表888名，符合规定人数；张巍汇报大会筹备情况。会议表决通过由110人组成的主席团成员名单，通过张巍为大会秘书长，通过由13人组成的代表资格审查委员会成员名单；通过大会议程四项——听取和审查十一届省委的报告、审查十一届省纪委的工作报告、选举十二届省委、选举十二届省纪委。同日下午，大会主席团举行第一次会议，通过主席团常务委员会委员名单（周祖翼、王陆进、张巍、安伟、秦国文、王刚、张雷明、张敏、王崧、陈春江、李涛11人）。当天上午，周祖翼、王陆进、张巍等省领导分别前往各代表团驻地看望代表；代表已于10月18日起陆续报到。（来源[SE192][SE200]）\n\n### 3. 10月20日省第十二次党代会开幕：换届大会启幕\n\n10月20日，中国共产党河南省第十二次代表大会在郑州开幕（郑州发布\"小布播报\"当日播发\"省第十二次党代会今日在郑州召开\"；三门峡日报当日社论亦以\"今天，省十二次党代会在郑州隆重开幕\"表述）。开幕在即，河南日报10月19日头版推出何言文章《奋力谱写新篇章》，系统梳理\"十五五\"开局之年的河南答卷：工业经济总量稳居中西部第一，装备制造、现代食品、新型材料三个万亿级产业撑起家底；全省主要农作物良种覆盖率超过97%；我国首个全国产10万卡国家超算互联网核心节点在郑州建成投用。注意边界：截至本篇编制，大会报告全文及新一届省委选举结果未见权威公开文本，相关内容不作引用，待官方发布后补记。（来源[SE193][SE200]）\n\n### 4. 前三季度全国GDP同比增长4.6%：宏观大盘的河南底色\n\n国家统计局10月19日发布：初步核算，前三季度国内生产总值1071071亿元，按不变价格计算同比增长4.6%，符合全年经济预期增长目标。河南省前三季度经济数据截至本篇编制未见省统计局公开汇总，具体增速不引用。从既有线索看全国数据对河南的意义：全国秋粮收获10月上旬过半、全年粮食有望再获丰收（国家统计局10月19日发布口径），河南作为粮食产量常年稳定在1300亿斤以上的产粮大省，秋粮收获与麦播进度直接关系全国大盘；党代会前夕省委全会专门部署\"冲刺四季度\"，把重大项目、促消费、外贸新动能列为收官重点。（来源[SE194][SE191]）\n\n### 5. 开封第44届菊花文化节开幕：330万盆菊花重塑\"全城赏菊\"\n\n中国开封第44届菊花文化节于10月17日以线上形式宣布开幕，18日在龙亭景区举行线下赏菊启动仪式，会期10月18日至11月17日。本届以\"宋韵开封，菊香中国\"为主题，持续放大\"全城赏菊、全域成景\"特色，全城共布展菊花330万盆，其中社会面布展200万盆、景区布展130万盆，并推出6条菊花主题游线。配套动作上，10月15日清明上河园第十五届国际菊花展先行启幕；手机报当日报道显示，节会期间乘坐火车抵达开封站的旅客凭当日购票凭证可享相关优惠。此条延续W15\"老君山一元午餐\"的文旅服务型竞争力线索，是\"节会经济+古都IP\"的现成案例。（来源[SE195][SE198]）\n\n### 6. 秋收收官与麦播高峰：明白纸划定\"三个播期窗口\"\n\n秋收方面，河南省农业农村厅10月15日通报，全省秋收基本结束，已收获7267万亩粮食作物（此为上一周期公布的时点数，作进度参照）。麦播方面，《河南省2026年小麦秋播生产技术明白纸》给出的适宜播期为：豫北麦区半冬性品种10月10日—20日，豫中、豫东麦区半冬性品种10月15日—25日，豫南麦区半冬性品种10月22日—30日，弱春性品种10月25日—11月上旬；若因天气条件不适导致播期推迟，应实施晚播小麦\"四补一促\"应变栽培技术。此条与W15\"播期较往年推迟7—10天\"的技术导向衔接：暖冬背景下，播期窗口、播量红线与应变技术构成今年麦播的三层政策设计。省委全会亦专门要求\"加强秋播和田间管理\"。（来源[SE196][SE197][SE191]）\n\n### 7. 冷空气接力：21—22日多地气温创入秋后新低\n\n据省气象台消息，受20日冷空气影响，21—22日全省多地气温陆续创今年入秋后新低：最高气温降至20℃以下，最低气温降至个位数，西部山区或将降至0℃上下；20日全省风力加大至偏北风4级左右、阵风7级左右，两天内降温幅度可达12℃（\"小布播报\"表述为\"2天降12℃\"）。省级层面在寒潮叠加党代会会期的时间点上，全会公报专门要求\"抓好各类风险防控和安全生产，确保全省社会大局稳定\"。此条可用于\"极端天气应对+安全生产责任\"的材料题：预警信息发布、农业设施防风、能源保供三个落点。（来源[SE198][SE193][SE191]）\n\n### 8. 天安门广场国旗交由河南保管：国防教育的实物载体\n\n10月16日下午，北京市人民政府天安门地区管理委员会国旗赠予仪式在天安门地区运行调度中心举行。河南省全民国防教育中心获赠的五星红旗，是2026年9月19日第26个全民国防教育日当天在天安门广场升挂的国旗，将作为开展爱国主义教育和全民国防教育的特殊实物载体。同批民生条目：10月19日起，2026年郑州市第八批公租房启动配租，本批次共135个项目3338套房源，10月19日—23日可登录\"郑好办\"APP线上选房，全程免费办理；10月22日，大中城市联合招聘高校毕业生秋季专场招聘会在郑州市二七区零工市场举行，提供2200余个就业岗位，重点面向应往届及离校未就业高校毕业生。（来源[SE199]）\n\n### 9. 医保钱包升级2.0版：个人账户跨省共济全面落地\n\n记者10月19日从国家医疗保障局获悉，医保钱包迭代升级到2.0版，自2026年10月16日起在全国各省份及新疆生产建设兵团全部上线运行，医保个人账户资金跨省共济给近亲属在全国全面落地。2.0版强化身份核验、共济关系绑定、共济额度管控等功能，严格限定共济对象为近亲属、额度不可再次共济；使用范围由就医购药扩展至支持城乡居民医保、长期护理保险参保缴费，并支持国家医保服务平台App、支付宝小程序及线下经办窗口多渠道办理。此条是\"一老一小一小账\"民生治理的数字化样本，与郑州公租房配租（要闻8）并读，构成本周\"兜底民生+数字政务\"组合。（来源[SE199]）\n\n### 10. 郑州百岁老人688位与安阳南太行立法：民生与治理的两个切片\n\n郑州市民政局数据显示，目前郑州有百岁老人688位，男性182人、女性506人（女性约占73%），较去年增加103位，其中中牟县114岁的李永安为最高龄。立法方面，《安阳市南太行山区旅游发展促进条例》正式公布，2027年1月1日起施行：针对地域分割制约文旅发展的痛点，明确安阳联合鹤壁、新乡、焦作、济源建立协调工作机制，在规划编制、设施联通、市场开发、信用监管、应急救援、联合执法等领域深化合作，推动旅游交通一体化，逐步落地南太行旅游一码通、年票一卡通。前者是健康河南与老龄治理的数据切片，后者是\"跨市域文旅协同立法\"的稀疏样本，可与D16文旅文创融合并读。（来源[SE198]）\n\n## 📖 深度案例：省第十二次党代会的召开程序——从全会定盘到大会开幕\n\n**主体与事件**：中共河南省委及全省919名党代会代表。10月18日十一届省委十二次全会决定省十二次党代会20日召开（[SE191]）；10月19日举行预备会议与主席团第一次会议（[SE192]）；10月20日大会开幕（[SE193]）。\n\n**背景与问题**：其一，会期定位特殊——大会召开于\"十五五\"开局之年，河南发展处于\"扬长补短、全面崛起\"的关键阶段（[SE192]），报告将确定未来五年全省发展蓝图；其二，人事背景叠加——省委书记周祖翼、代省长王陆进9月下旬履新，本届大会是新班子首次完整主导的换届大会，W15记录的南阳首站调研（生态+民生+产业三层议程）为理解新班子的报告取向提供了参照系；其三，组织纪律要求高——换届选举涉及全省各级领导班子衔接，会风会纪被置于突出位置。\n\n**做法与机制（程序链条三层）**：一是\"定盘\"层。十一届省委最后一次全会（十二次全会）完成三项动作：决定会期、通过拟提请大会审查的省委报告与纪委工作报告、总结十一届省委五年工作——\"两个确保\"\"十大战略\"\"1+2+4+N\"目标任务体系被确认为五年工作主线（[SE191]）。二是\"准备\"层。预备会议完成代表资格确认（919名应到、888名出席）、110人主席团产生、秘书长与13人资格审查委员会确定、四项议程通过，把\"谁开会、开什么、怎么选\"一次落定（[SE192]）。三是\"推进\"层。主席团第一次会议产生11人常务委员会，作为大会期间的领导中枢（[SE192]）；同期通过看望代表、代表报到、正面宣传与舆论引导等环节营造会期环境（[SE191][SE200]）。\n\n**成效与数据（区分已完成与方向性表述）**：已完成口径——全会、预备会议、主席团第一次会议均按期举行；919名代表、888名出席预备会议、110人主席团、13人资格审查委员会、11人主席团常委为已公布数字。方向性表述——大会报告提出的目标任务、新一届省委选举结果，截至本篇编制未见权威公开文本，均不作引用（[SE193]）。背景数据可采用何言文章披露的五年答卷口径：工业经济总量稳居中西部第一，装备制造、现代食品、新型材料三个万亿级产业，主要农作物良种覆盖率超97%（[SE200]）。\n\n**局限与观察点**：其一，本篇成稿时大会正在进行，报告内容与选举结果只能留待下期补记，属时间性局限而非数据缺失；其二，十一届省委五年总结以定性概括为主，\"标志性成果\"的量化口径（如五年GDP、粮食产量序列）需待报告全文发布后核对，避免引用媒体演绎数字；其三，党代会后接续的人大、政府换届安排（代省长王陆进转正程序等）尚未见官方时间表，不作推测。\n\n**可迁移点与评价**：其一，\"全会定盘→预备会议→主席团→大会\"是党的地方代表大会的通用程序模板，各省通用，可整体迁移作答党建与政治制度常识题。其二，把\"十五五开局之年+全面崛起关键阶段+新班子首个换届大会\"三层背景叠加，是分析会议定位的通用框架——任何省级党代会的意义论证都可拆为\"时点、阶段、人事\"三要素。其三，预备会议通过的\"四项议程\"（听审党委报告、审查纪委报告、选举党委、选举纪委）是记忆锚点，可用来快速区分党代会与人代会的职权差异。\n\n**可考角度**：常识——党的地方各级代表大会每五年举行一次，预备会议的主要任务是产生主席团、通过议程、确认代表资格；案例分析——从全会\"冲刺四季度\"部署看\"开大会与稳大盘\"的统筹逻辑；材料写作——以\"接力棒\"或\"新答卷\"为线索，把五年总结与未来蓝图写成一篇政论文。\n\n**金句（适用主题：换届接力、蓝图落地、实干开局）**：\n1. 蓝图写在纸上只是规划，落在田里、车间和账本上，才是答卷。\n2. 换届换的是届次，不换的是责任；开会开的是议程，不开掉的是落实。\n3. 开局之年的第一粒扣子，扣在报告里，更扣在四季度冲刺的每一组数据里。\n\n## 复盘与下周关注\n\n- 本周复盘：主线有三——省第十二次党代会按程序紧凑推进（18日全会定盘、19日预备会议与主席团产生、20日开幕），宏观与农业数据同步收口（全国前三季度GDP增长4.6%、河南秋收7267万亩收官、麦播按明白纸三个播期窗口展开），文旅与民生多点开花（菊花文化节330万盆布展、公租房3338套配租、医保钱包2.0跨省共济）。党代会报告全文与选举结果缺位是本周唯一重大留白，处理原则是只记程序与既公布数字。\n- 下周关注：省十二次党代会报告全文与新一届省委、省纪委选举结果（含书记、副书记名单）；党代会后省政府层面的贯彻落实部署与四季度经济收官动作；麦播进度官方汇总口径与是否出现晚播面积扩大；菊花文化节客流与消费数据（会期至11月17日，属下一周期）；21—22日降温过程对农业生产与能源保供的影响通报。\n\n## 来源与证据\n\n- [SE191] 河南政协网（转河南日报）《中国共产党河南省第十一届委员会第十二次全体会议公报》，2026-10-18，https://www.hnzx.gov.cn/2026/10-18/4372463.html ；另见郑州市人民政府网转载版，2026-10-19，https://www.zhengzhou.gov.cn/news1/10301263.jhtml\n- [SE192] 河南日报网《省第十二次党代会举行预备会议 周祖翼主持并讲话》，2026-10-20，https://www.henandaily.cn/news/2026/1020/1257854.html ；主席团第一次会议内容见河南日报客户端报道（搜狐分发口径，2026-10-19，https://www.sohu.com/a/1089860139_121123521 ）\n- [SE193] 郑州发布（搜狐分发口径）《小布播报｜省第十二次党代会今日在郑州召开；2天降12℃！河南气温创入秋新低》，2026-10-20，https://www.sohu.com/a/1089959767_120575855 ；另见三门峡日报《社论丨奋力谱写中原大地推进中国式现代化新篇章——热烈祝贺省十二次党代会隆重召开》，2026-10-20，https://www.ismx.cn/content-27-122760-1.html\n- [SE194] 中国政府网（转新华社）《前三季度我国GDP同比增长4.6%》，2026-10-19，https://www.gov.cn/lianbo/202610/content_7083662.htm\n- [SE195] 新华网河南频道《中国开封第44届菊花文化节开幕》，2026-10-18，http://www.ha.xinhuanet.com/20261018/5807db5f1a644ac689a9da3964ec5da6/c.html ；另见新华网《这个秋天 来开封赏菊》，2026-10-18，https://www.news.cn/local/20261018/de01e7beefd14a65a10c1ad97c66bf5c/c.html\n- [SE196] 南阳市农业农村局（转载）《河南省2026年小麦秋播生产技术明白纸》，2026-10-12，https://nyj.nanyang.gov.cn/2026/10-12/1444944.html\n- [SE197] 中新网（中新社记者韩章云）《河南秋收基本结束 收获7267万亩粮食作物》，2026-10-15，https://www.jwview.com/jingwei/html/m/10-15/692607.shtml （发布于上一周期，作秋收进度参照）\n- [SE198] 河南日报网《手机报·早报 2026年10月19日》（含气温创入秋新低、郑州百岁老人688位、安阳南太行条例），2026-10-19，https://www.henandaily.cn/news/2026/1019/1257429.html\n- [SE199] 河南日报网《手机报·早报 2026年10月20日》（含天安门广场国旗赠豫、郑州第八批公租房配租、秋季专场招聘会、医保钱包2.0跨省共济），2026-10-20，https://www.henandaily.cn/news/2026/1020/1257743.html\n- [SE200] 大河财立方（转河南日报）《何言：奋力谱写新篇章——写在中国共产党河南省第十二次代表大会召开之际》，2026-10-19，https://app.dahecube.com/nweb/news/20261019/290167nc96c91501d4.htm?artid=290167\n\n## 关联专题\n\n- [[W15]]\n- [[W13]]\n- [[W12]]\n- [[P01]]\n- [[D12]]\n- [[D16]]\n- [[D18]]\n"};

/* ---------- Markdown 渲染 ---------- */
function md(src){
  let lines=esc(src).split("\n"),out=[],inCode=false,inList=false,listType=null,inQuote=false,tableBuf=[];
  const inline=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[\[([^\]]+)\]\]/g,(m,id)=>{const t=DATA.topics.find(t=>t.id===id);return t?`<a href="javascript:void(0)" onclick="openTopic('${id}');return false">${t.id} ${t.title}</a>`:id})
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushTable=()=>{if(!tableBuf.length)return;
    let rows=tableBuf.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)&&r.trim());
    if(!rows.length){tableBuf=[];return}
    let h=`<table><thead><tr>${rows[0].replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<th>"+inline(c.trim())+"</th>").join("")}</tr></thead><tbody>`;
    for(const r of rows.slice(1))h+="<tr>"+r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>";
    out.push(h+"</tbody></table>");tableBuf=[]};
  const closeAll=()=>{if(tableBuf.length)flushTable();if(inList){out.push(listType==="ul"?"</ul>":"</ol>");inList=false}if(inQuote){out.push("</blockquote>");inQuote=false}};
  for(let ln of lines){
    if(/^```/.test(ln)){closeAll();out.push(inCode?"</pre>":"<pre>");inCode=!inCode;continue}
    if(inCode){out.push(ln);continue}
    let m;
    if(/^\s*\|/.test(ln)){tableBuf.push(ln);continue}
    closeAll();
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){
      const lv=m[1].length;
      if(lv<=3){const hid="h"+HEADING_IDS.length;HEADING_IDS.push({id:hid,level:lv,text:inline(m[2])});
        out.push(`<h${lv} id="${hid}">`+inline(m[2])+`</h${lv}>`)}
      else out.push("<h4>"+inline(m[2])+"</h4>");
    }
    else if(/^\s*[-*]\s/.test(ln)){
      if(!inList){out.push("<ul>");inList=true;listType="ul"}
      out.push("<li>"+inline(ln.replace(/^\s*[-*]\s/,""))+"</li>");
    }
    else if(/^\s*\d+[.、)]\s/.test(ln)){
      if(!inList){out.push("<ol>");inList=true;listType="ol"}
      out.push("<li>"+inline(ln.replace(/^\s*\d+[.、)]\s/,""))+"</li>");
    }
    else if(/^>\s?/.test(ln)){
      if(!inQuote){out.push("<blockquote>");inQuote=true}
      out.push(inline(ln.replace(/^>\s?/,"")));
    }
    else{
      if(/^\s*$/.test(ln))out.push("");
      else out.push("<p>"+inline(ln)+"</p>");
    }
  }
  closeAll();
  return out.join("\n");
}

/* 将“可考角度”“金句/对策”两节包成彩色卡片
   兼容两种写法：
   A) 标题形式：## 五、可考角度 / ### 六、金句/对策
   B) 行内加粗形式：**可考角度**：... / **金句（适用主题：…）**：…
*/
function wrapSpecialSections(html){
  // ---------- A. 标题形式 ----------
  const wrapHeading=(src,titleRe,cls)=>{
    const re=new RegExp('<h[23][^>]*>([^<]*(?:'+titleRe+')[^<]*)</h[23]>','i');
    const m=src.match(re);
    if(!m)return src;
    const start=m.index, afterStart=start+m[0].length;
    const rest=src.slice(afterStart);
    const nextM=rest.match(/<h[23][\s>]/i);
    const end=nextM?afterStart+nextM.index:src.length;
    const header=src.slice(start,afterStart), body=src.slice(afterStart,end);
    return src.slice(0,start)+`<div class="${cls}">${header}<div class="cardbody">${body}</div></div>`+src.slice(end);
  };
  // ---------- B. 行内加粗形式 ----------
  // 从 <p><strong>可考角度</strong>... 开始，直到下一个“复盘/来源/关联”标题或段落结束
  const wrapInline=(src,titleRe,cls)=>{
    // 找到包含关键字的 <p> 开头
    const re=new RegExp('<p><strong>([^<]*(?:'+titleRe+')[^<]*)</strong>','i');
    const m=src.match(re);
    if(!m)return src;
    const start=m.index;
    // 结尾：下一个 h2/h3，或下一个 <p><strong>（可能是别的加粗段）
    const rest=src.slice(start+m[0].length);
    const stopM=rest.match(/<h[23][\s>]|<p><strong>(?!.*?(?:'+titleRe+'))/i);
    let end=stopM?start+m[0].length+stopM.index:src.length;
    const seg=src.slice(start,end);
    return src.slice(0,start)+`<div class="${cls} cardin"><div class="cardbody">${seg}</div></div>`+src.slice(end);
  };
  // 先试标题形式，没有再试行内形式
  const apply=(html,titleRe,cls)=>{
    const r1=wrapHeading(html,titleRe,cls);
    if(r1!==html)return r1;
    return wrapInline(html,titleRe,cls);
  };
  html=apply(html,'可考角度','sec-card sec-exam');
  html=apply(html,'金句','sec-card sec-quote');
  return html;
}

let SITEMS=null,SR_HITS=[];
function searchItems(){
  return DATA.topics.map(t=>{

    return {t,text:(t.id+" "+t.title+" "+t.tags.join(" ")+" "+((CATS[t.category]||{}).name||"")+" "+(t.card||"")+" "+mdtext).toLowerCase()};

function doSearch(q){
  const box=document.getElementById("searchresults");
  if(!box)return;
  if(!SITEMS)SITEMS=searchItems();
  q=q.trim().toLowerCase();
  const sb=box.parentNode.querySelector(".searchbox");
  if(sb)sb.classList.toggle("hasval",!!q);
  if(!q){box.style.display="none";box.innerHTML="";SR_HITS=[];return}
  const words=q.split(/\s+/);
  SR_HITS=SITEMS.filter(it=>words.every(w=>it.text.includes(w))).slice(0,10);
  box.innerHTML=`<div class="sr-cap">搜索结果 · ${SR_HITS.length} 条</div>`+(SR_HITS.length?SR_HITS.map((it,i)=>{
    const t=it.t;
    return `<div class="sr-item${i===0?" sel":""}" data-id="${t.id}" onclick="event.stopPropagation();srOpen('${t.id}')">
      <div class="t"><span class="badge">${t.id}</span><span>${esc(t.title)}</span></div>
      <div class="d">${esc((t.card||t.tags.join(" · ")).slice(0,90))}</div></div>`}).join("")
    :`<div class="sr-empty">未找到与「${esc(q)}」相关的专题</div>`);
  box.style.display="block";
}
/* 修复：等当前点击事件结束（rAF）再销毁首页 DOM，避免访问已销毁节点导致 JS 异常 */
function srOpen(id){hideSearch();requestAnimationFrame(()=>openTopic(id))}
function hideSearch(){const b=document.getElementById("searchresults");if(!b)return;b.style.display="none";b.innerHTML="";SR_HITS=[]}
function clearSearch(){const i=document.getElementById("searchinput");if(i){i.value="";i.focus()}doSearch("")}
function srKey(e){
  const box=document.getElementById("searchresults");
  if(!box||box.style.display==="none")return;
  const items=[...box.querySelectorAll(".sr-item")];
  if(!items.length){if(e.key==="Escape")box.style.display="none";return}
  let i=items.findIndex(x=>x.classList.contains("sel"));
  if(e.key==="ArrowDown"){e.preventDefault();i=(i+1)%items.length}
  else if(e.key==="ArrowUp"){e.preventDefault();i=(i-1+items.length)%items.length}
  else if(e.key==="Enter"){e.preventDefault();const id=items[Math.max(i,0)].dataset.id;hideSearch();openTopic(id);return}
  else if(e.key==="Escape"){hideSearch();return}
  else return;
  items.forEach((x,j)=>x.classList.toggle("sel",j===i));
  items[i].scrollIntoView({block:"nearest"});
}

  window.__currentTopic = id;
  const mdtext=MDS[t.file]||"（未找到正文）";
  const sp=splitCard(mdtext);
  HEADING_IDS=[];TOC_IDS=[];
  const rendered=stripTailSections(wrapSpecialSections(md(sp.body)));
  TOC_IDS=HEADING_IDS.map(x=>x.id);
  const srcs=t.sources.map(sid=>{const s=DATA.sources.find(s=>s.id===sid);
    return s?`<div class="srcitem">[${s.id}] ${esc(s.title)} — <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>（${s.type}，核实 ${s.checked_date}）</div>`:""}).join("");
  const rel=t.related.map(r=>{const rt=DATA.topics.find(x=>x.id===r);
    return rt?`<button onclick="openTopic('${r}')"><span class="rid">${r}</span><span class="rt">${esc(rt.title)}</span></button>`:""}).join("");
  let h=`<div class="page-article">
  <div id="articlecol">
    <button class="backtop" onclick="go('${t.category}')">← 返回${(CATS[t.category]||{}).name||"列表"}</button>
    <div class="artmeta"><span class="pill">${t.id}</span><span class="pill dim">证据等级：${t.evidence_level}</span><span class="pill dim">${t.status}</span><span>更新 ${t.updated}</span></div>
    <div class="readbar" id="readbar">
      <button class="rb-btn${PROG.isRead(t.id)?' on':''}" id="rb-read" onclick="toggleRead('${t.id}')">
        ${PROG.isRead(t.id)?'✓ 已读':'标记已读'}</button>
      <button class="rb-btn${PROG.isFav(t.id)?' fav-on':''}" id="rb-fav" onclick="toggleFav('${t.id}')">
        ${PROG.isFav(t.id)?'★ 已收藏':'☆ 收藏'}</button>
      <span class="rb-sep"></span>
      <span class="rb-stat" id="rb-stat"></span>
    </div>
    ${sp.card?`<div class="kcard"><div class="kcap">${ICONS.zap} 快速知识卡</div><div class="md">${md(sp.card)}</div></div>`:""}
    <article class="md">${rendered}</article>
    <details class="tailbox"><summary><span class="chev">${ICONS.chev}</span>本专题来源（${t.sources.length} 条）</summary><div class="tbc">${srcs}</div></details>
    ${rel?`<details class="tailbox"><summary><span class="chev">${ICONS.chev}</span>关联专题（${t.related.length} 篇）</summary><div class="tbc relbtns">${rel}</div></details>`:""}
    <button class="backtop" onclick="go('home')">← 返回首页</button>
  </div>
  <div id="toccol"><div class="toccap">本页目录</div><nav id="toc">${buildTOC()}</nav></div>
  </div>`;
  document.getElementById("content").innerHTML=h;
  highlightNav(id);window.scrollTo(0,0);
  setupTOCSpy();
  setTimeout(updateReadTrack, 80);
  // 进度：自动标记已读，更新统计，并恢复阅读位置
  setTimeout(()=>{
    PROG.markRead(id);
    const b = document.getElementById('rb-read');
    if (b) { b.textContent='✓ 已读'; b.classList.add('on'); }
    updateReadStat();
    syncListMarks();
    const saved = PROG.getPos(id);
    if (saved > 60 && saved < document.body.scrollHeight - window.innerHeight - 40) {
      // 有位置记录且不在底部：提示用户可跳回
      showResumeTip(saved, id);
    }
  }, 120);
}
/* 阅读位置恢复提示：去掉文字，只留两个按钮 */
function showResumeTip(y, id){
  const old = document.getElementById('resume-tip');
  if (old) old.remove();
  const d = document.createElement('div');
  d.id = 'resume-tip';
  d.innerHTML = '<button class="ok">继续</button><button class="no">从头</button>';
  document.body.appendChild(d);
  d.querySelector('button.ok').onclick = () => {
    window.scrollTo({top:y, behavior:'smooth'});
    PROG.setPos(id, y);
    d.remove();
  };
  d.querySelector('button.no').onclick = () => {
    PROG.setPos(id, 0);
    window.scrollTo({top:0, behavior:'smooth'});
    d.remove();
  };
  requestAnimationFrame(()=>d.classList.add('show'));
  setTimeout(()=>{ if(d.parentNode) d.remove(); }, 10000);
}
function setupTOCSpy(){
  const links=TOC_IDS.map(i=>({id:i,el:document.getElementById(i),a:document.getElementById("toclink-"+i)})).filter(x=>x.el);
  if(!links.length)return;
  const onScroll=()=>{
    let cur=links[0].id;
    for(const l of links){if(l.el.getBoundingClientRect().top<100)cur=l.id}
    links.forEach(l=>l.a.classList.toggle("active",l.id===cur));
  };
  window.removeEventListener("scroll",window.__tocspy||(()=>{}));
  window.__tocspy=onScroll;window.addEventListener("scroll",onScroll,{passive:true});onScroll();
}

// 同一天只展示一次；直接访问具体专题时跳过
function initSplash(){
  const sp=document.getElementById('splash');
  if(!sp)return;
  const d=new Date();
  const dtEl=document.getElementById('splash-date');
  if(dtEl)dtEl.textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  const cntEl=document.getElementById('splash-count');
  if(cntEl&&typeof DATA!=='undefined'&&DATA)cntEl.textContent=`${DATA.topics.length} 专题 · ${DATA.sources.length} 来源`;
  document.body.classList.add('splash-lock');
  // 记录当前滚动位置，关闭后恢复
  window.__splashScrollY = window.scrollY || 0;
  window.scrollTo(0,0);
  // 阻止触摸滑动穿透到下层内容
  const stop = e => {
    // 允许点击“进入”按钮
    if(e.target.closest('.splash-enter')) return;
    if(e.cancelable) e.preventDefault();
  };
  sp.addEventListener('touchmove', stop, {passive:false});
  sp.addEventListener('wheel', stop, {passive:false});
  window.__splashStop = stop;
}
function enterSite(){
  const sp=document.getElementById('splash');
  if(!sp)return;
  // 移除事件拦截
  if(window.__splashStop){
    sp.removeEventListener('touchmove', window.__splashStop);
    sp.removeEventListener('wheel', window.__splashStop);
  }
  sp.classList.add('hide');
  document.body.classList.remove('splash-lock');
  // 恢复滚动能力
  const y = window.__splashScrollY || 0;
  setTimeout(()=>{ document.body.style.position=''; window.scrollTo(0,y); },50);
  setTimeout(()=>{ if(sp&&sp.parentNode) sp.style.display='none'; },700);
}

let __deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  __deferredInstall = e;
  const b = document.getElementById('installbtn');
  if (b) b.style.display = 'inline-flex';
});
window.addEventListener('appinstalled', () => {
  __deferredInstall = null;
  const b = document.getElementById('installbtn');
  if (b) { b.textContent = '已安装到桌面'; b.disabled = true; }
});
async function doInstall(){
  const b = document.getElementById('installbtn');
  if (!__deferredInstall) {
    // 浏览器未提供自动安装接口：给出手动指引
    if (b) b.textContent = '请在浏览器菜单里选择「安装应用」';
    return;
  }
  __deferredInstall.prompt();
  const { outcome } = await __deferredInstall.userChoice;
  if (outcome === 'accepted' && b) { b.textContent = '已安装'; b.disabled = true; }
  __deferredInstall = null;
}

/* ========== 学习进度（本地存储） ========== */
const PROG_KEY = 'lishi_progress_v1';
const PROG = {
  data: { read: {}, fav: [], pos: {}, firstUse: null, days: [] },
  load(){
    try {
      const raw = localStorage.getItem(PROG_KEY);
      if (raw) { const o = JSON.parse(raw); this.data = Object.assign(this.data, o); }
    } catch(e) {}
    if (!this.data.firstUse) { this.data.firstUse = new Date().toISOString().slice(0,10); }
    const today = new Date().toISOString().slice(0,10);
    if (!this.data.days.includes(today)) this.data.days.push(today);
  },
  save(){
    try { localStorage.setItem(PROG_KEY, JSON.stringify(this.data)); } catch(e) {}
  },
  isRead(id){ return !!this.data.read[id]; },
  markRead(id){
    if (!this.data.read[id]) {
      this.data.read[id] = new Date().toISOString();
    } else {
      // 已读过也更新最近阅读时间
      this.data.read[id] = new Date().toISOString();
    }
    this.save();
  },
  favIds(){ return this.data.fav.slice(); },
  isFav(id){ return this.data.fav.includes(id); },
  toggleFav(id){
    const i = this.data.fav.indexOf(id);
    if (i >= 0) this.data.fav.splice(i,1); else this.data.fav.push(id);
    this.save();
    return this.isFav(id);
  },
  setPos(id, y){ this.data.pos[id] = Math.round(y); this.save(); },
  getPos(id){ return this.data.pos[id] || 0; },
  readCount(){ return Object.keys(this.data.read).length; },
  stats(){
    const total = DATA.topics.length;
    const read = this.readCount();
    return {
      total, read,
      fav: this.data.fav.length,
      days: this.data.days.length,
      percent: total ? Math.round(read/total*100) : 0
    };
  }
};

/* 请求持久化存储（让浏览器不自动清除数据） */
async function requestPersist(){
  try {
    if (navigator.storage && navigator.storage.persist) {
      const already = await navigator.storage.persisted();
      if (already) return true;
      const ok = await navigator.storage.persist();
      return ok;
    }
  } catch(e) {}
  return false;
}

/* 从正文里剔掉「来源与证据」「关联专题」两节，改用卡片呈现，避免重复 */
function stripTailSections(html){
  // 找 <h2> 包含“来源与证据”或“关联专题”的位置，从那里截到末尾（或下一个 h2）
  const cutAt = (src, kw) => {
    const re = new RegExp('<h2[^>]*>([^<]*' + kw + '[^<]*)</h2>', 'i');
    const m = src.match(re);
    if (!m) return src;
    const start = m.index;
    const rest = src.slice(start + m[0].length);
    const next = rest.match(/<h2[\s>]/i);
    const end = next ? start + m[0].length + next.index : src.length;
    return src.slice(0, start) + src.slice(end);
  };
  html = cutAt(html, '来源与证据');
  html = cutAt(html, '关联专题');
  return html;
}

/* ---------- 进度功能交互 ---------- */
function toggleRead(id){
  const was = PROG.isRead(id);
  if (was) { delete PROG.data.read[id]; PROG.save(); }
  else PROG.markRead(id);
  const b = document.getElementById('rb-read');
  if (b) { b.textContent = PROG.isRead(id) ? '✓ 已读' : '标记已读';
           b.classList.toggle('on', PROG.isRead(id)); }
  updateReadStat();
  syncListMarks();
}
function toggleFav(id){
  const on = PROG.toggleFav(id);
  const b = document.getElementById('rb-fav');
  if (b) { b.textContent = on ? '★ 已收藏' : '☆ 收藏';
           b.classList.toggle('fav-on', on); }
  updateReadStat();
  syncListMarks();
}
function updateReadStat(){
  const s = document.getElementById('rb-stat');
  if (s) { const st = PROG.stats();
           s.textContent = `已读 ${st.read}/${st.total} · ${st.percent}%`; }
}
/* 同步列表上的已读/收藏标记 */
function syncListMarks(){
  document.querySelectorAll('.trow').forEach(r=>{
    const id = (r.querySelector('.tid')||{}).textContent;
    if (!id) return;
    r.classList.toggle('isread', PROG.isRead(id));
    r.classList.toggle('isfav', PROG.isFav(id));
  });
  document.querySelectorAll('.topiccard').forEach(c=>{
    const id = (c.querySelector('.tid')||{}).textContent;
    if (id) c.classList.toggle('isread', PROG.isRead(id));
  });
}
/* 首页进度面板 */
function renderProgress(){
  const box = document.getElementById('progpanel');
  if (!box) return;
  const st = PROG.stats();
  const last = lastActiveTopic();
  let h = '<div class="phead"><h3>学习进度</h3>';
  if (last) h += `<span class="pcurl" onclick="openTopic('${last.id}')">继续阅读：${last.id} →</span>`;
  else h += '<span class="pcurl" onclick="go(\'D\')">去读第一篇 →</span>';
  h += '</div>';
  h += `<div class="progbar"><i style="width:${st.percent}%"></i></div>`;
  h += `<div class="progstats">
    <div class="ps"><b>${st.read}<span style="font-size:13px;opacity:.5">/${st.total}</span></b><span>已读专题</span></div>
    <div class="ps"><b>${st.percent}%</b><span>完成度</span></div>
    <div class="ps" onclick="showFavList()"><b>${st.fav}</b><span>收藏</span></div>
  </div>`;
  if (st.read === 0) {
    h += '<div class="progempty" style="margin-top:14px">还没有阅读记录。打开任意专题后，会自动标记已读并记录阅读位置。</div>';
  }
  box.innerHTML = h;
}
/* 最近阅读的一篇：按 read 记录的时间倒序 */
function lastActiveTopic(){
  const entries = Object.entries(PROG.data.read || {});
  if (!entries.length) return null;
  entries.sort((a,b) => String(b[1]).localeCompare(String(a[1])));
  for (const [id] of entries) {
    const t = DATA.topics.find(x => x.id === id);
    if (t) return {id, title:t.title};
  }
  return null;
}
/* 收藏列表 */
function showFavList(){
  const ids = PROG.favIds();
  if (!ids.length) { toast('还没有收藏任何专题'); return; }
  const items = ids.map(id => DATA.topics.find(t=>t.id===id)).filter(Boolean);
  openListPage('我的收藏', items);
}
/* 通用列表页 */
function openListPage(title, items){
  let h = `<div class="crumb"><a onclick="go('home')">首页</a>${ICONS.chev}<span>${title}</span></div>
  <div class="catview-head"><div><h1>${title}</h1><p class="sub">共 ${items.length} 篇</p></div></div>
  <div class="topiclist">`;
  h += items.map(t => `<div class="topiccard${PROG.isRead(t.id)?' isread':''}" onclick="openTopic('${t.id}')">
      <div class="row1"><span class="tid">${t.id}</span><h3>${esc(t.title)}</h3></div>
      <div class="tags">${esc(t.tags.join(' · '))}</div>
      <div class="meta2"><span>${t.category==='W'?'时政周报':t.category==='D'?'河南案例':'政策摘要'}</span><span>更新 ${t.updated}</span></div>
    </div>`).join('');
  h += '</div>';
  document.getElementById('content').innerHTML = h;
  highlightNav(null); window.scrollTo(0,0);
  syncListMarks();
}
/* 轻提示 */
function toast(msg){
  const old = document.getElementById('toast');
  if (old) old.remove();
  const d = document.createElement('div');
  d.id = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show'));
  setTimeout(()=>{ d.classList.remove('show'); setTimeout(()=>d.remove(), 320); }, 2200);
}

/* 阅读进度条 */
function updateReadTrack(){
  const track = document.getElementById('readtrack');
  const pctEl = document.getElementById('readpct');
  if (!track || !pctEl) return;
  if (!window.__currentTopic) { track.classList.remove('on'); pctEl.classList.remove('on'); return; }
  // 用文章列的实际高度算，比整页更准
  const col = document.getElementById('articlecol') || document.documentElement;
  const rect = col.getBoundingClientRect();
  const colTop = window.scrollY + rect.top;
  const colH = col.offsetHeight || rect.height;
  const viewBottom = window.scrollY + window.innerHeight;
  let p = (viewBottom - colTop) / colH;
  p = Math.min(1, Math.max(0, p));
  track.querySelector('i').style.height = (p*100).toFixed(1) + '%';
  pctEl.textContent = Math.round(p*100) + '%';
  track.classList.add('on'); pctEl.classList.add('on');
}
window.addEventListener('scroll', updateReadTrack, {passive:true});
window.addEventListener('resize', updateReadTrack, {passive:true});

document.getElementById("tstat").textContent=``;

window.addEventListener('scroll', () => {
  if (__posTimer) return;
  __posTimer = setTimeout(() => {
    __posTimer = null;
    const cur = window.__currentTopic;
    if (cur && !document.body.classList.contains('splash-lock')) {
      PROG.setPos(cur, window.scrollY);
    }
  }, 900);
}, {passive:true});
