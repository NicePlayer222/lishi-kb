3939.3亿元、增长30%，贡献全省超八成外贸增量。对东盟进出口增长26.8%，对拉美、非洲、中亚五国分别增长18.2%、31%、25%，对共建\"一带一路\"国家进出口增长15.5%。（来源[SE41]）\n\n### 3. 7月16日起进入\"七下八上\"防汛关键期，河南启动防汛四级应急响应\n7月16日，我国进入\"七下八上\"防汛关键期，中央气象台当日继续发布暴雨黄色预警，黄淮等地有大到暴雨。经会商研判，根据《河南省防汛应急预案》有关规定，省防指决定于7月16日14时30分启动防汛四级应急响应，要求各有关单位加强值班值守，密切监测雨情水情汛情变化，滚动会商研判，聚焦水库、河道堤防、南水北调等重点部位落实巡查防守措施。（来源[SE42][SE43]）\n\n### 4. 河南小麦产销合作洽谈会签约200万吨、金额50亿元\n7月9日，省粮食和物资储备局联合国家粮食和物资储备局粮食交易协调中心（国家粮食交易中心）在郑州举办2026年河南小麦产销合作洽谈会，全省涉粮企业与全国购销企业共签订小麦购销合同及意向协议200万吨、金额达50亿元（河南日报7月13日报道）。省粮食和物资储备局提出四套\"组合拳\"：建平台——支持郑州粮食批发市场建设小麦大数据中心，编制发布小麦\"郑州价格\"，打造全国小麦价格指数中心；畅流通——发展粮食多式联运，构建\"产区—枢纽—销区\"三级网络；强产业——擦亮\"美豫粮油\"金字招牌；立标准——完善全产业链标准体系。（来源[SE44]）\n\n### 5. 郑州国际陆港包件库投用首月入库破万吨，上半年班列开行1859列\n7月16日，郑州国际陆港东作业区包件库交出启用首月答卷：自6月17日投用以来累计入库货物量突破1万吨。该包件库可租赁面积5.3万平方米，东作业区规划8束16条铁路作业线、具备年处理200万吨包件的综合能力；\"列车直入库区、卸货即入库\"模式使单批货物作业时间缩短1至2天。数据显示，2026年1至6月河南中欧（亚）班列累计开行1859列、同比增长22%；目前有超4000台国产空调正搭乘河南班列发往德国，依托15至20天的稳定时效服务欧洲高温下的家电补供需求。（来源[SE45]）\n\n### 6. 高招普通本科批进入投档冲刺，7月21日正式投档\n经过多轮模拟投档，7月21日2026年河南普通高校招生将迎来录取重头戏——普通本科批正式投档（新华网河南频道7月20日刊发预告，属本周期收尾节点）。录取期间考生可查询电子档案运转状态及专业组志愿平行志愿投档分数线；7月21日至25日进行普通本科批和高水平运动队录取，普通本科批实行\"分数优先、遵循志愿、一轮投档\"的平行志愿投档模式。（来源[SE46]）\n\n### 7. 农业生产总体向好与高温伏旱压力并存\n省统计局\"半年报\"对农业的定性判断是\"农业生产总体向好\"（上半年第一产业增加值增长4.0%），但7月中旬正值夏玉米抽雄吐丝等关键生长期，高温干旱成为现实压力。7月21日农业农村部和中国气象局联合发布农业高温干旱风险预警：7月以来陕西中南部、河南西南部等地35℃以上高温日数达11—15天、较常年同期偏多8—14天，预计7月22—24日河南等地仍有35℃以上高温天气（该预警发布于下一周期，此处作背景引用）。粮食生产防灾减灾与本周发布的豫政办〔2026〕27号文件（见W02周报）形成呼应。（来源[SE40][SE41][SE47]）\n\n### 8. 全省汛期形势呈现\"降水偏少、旱涝并存\"特点\n省应急管理、水利部门在后续在线访谈（7月30日刊发，作背景引用）中介绍：今年入汛以来全省平均降水量较多年平均值偏少一成多，7月以来偏少六成多，持续高温少雨下部分地块表层土壤失墒较快；汛期形势呈气温整体偏高、降水分布极度不均等特点，中南部更易出现持续性重度伏旱。本周\"四级应急响应\"与\"伏旱发展\"并存，体现河南防汛抗旱\"双线作战\"格局。（来源[SE49]）[存疑：7月13—19日当周河南雨情水情的分日官方数据未检索到白名单原文，暂不引具体数字]\n\n### 9. 郑州国际陆港西作业区二期建设提速，开放枢纽硬件配套完善\n据河南日报报道，郑州国际陆港西作业区二期项目正在有序推进，主要建设1栋综合楼、2栋宿舍楼及配套附属设施，目前两栋宿舍楼已完成主体封顶、正开展主体验收。项目建成后进一步完善郑州国际陆港服务配套、提升片区综合承载能力，与东作业区包件库、航空港片区新郑站图定线路扩容（7月1日新增3条）共同构成\"通道＋枢纽＋配套\"的开放体系。（来源[SE45]）\n\n### 10. 上半年经济运行的总体定性与政策衔接\n省统计局将上半年经济特征概括为\"结构向优、动能向新、质效向好\"，认为全省\"切实扛起了经济大省挑大梁责任\"（大河网稿，平顶山市发改委7月20日转载）；围绕\"1+2+4+N\"目标任务体系，持续扩大内需、优化供给，纵深推进融入服务全国统一大市场、因地制宜发展新质生产力。此表述与省政府7月21日\"推动2026年下半年进一步巩固拓展经济稳中向好势头\"新闻发布会（见W02周报SE38）直接衔接。（来源[SE48]）\n\n## 📖 深度案例：河南经济\"半年报\"——经济大省如何\"挑大梁\"\n\n**主体与事件**：河南省统计局、国家统计局河南调查总队于7月17日发布2026年上半年全省经济运行情况。这是观察河南作为经济大省稳增长能力、衔接2026年省政府工作报告年度目标的半年度\"成绩单\"，也是下半年政策部署（7月21日省政府新闻发布会）的数据底座。\n\n**背景与问题**：2026年是\"十五五\"开局之年，外部环境不确定性上升、全国社会消费品零售总额上半年仅增长1.3%（国家统计局7月15日发布，全国口径），稳增长压力传导至地方。河南肩负\"经济大省挑大梁\"责任，核心问题有三：内需如何稳住、新动能能否对冲传统产业压力、外贸能否在高基数上继续放量。\n\n**做法与机制（从数据结构看施策逻辑）**：一是产业支撑上\"二产挑头、三产护航\"——第二产业增加值增长5.4%，快于GDP整体增速0.4个百分点，工业生产保持较快增长，对应全省因地制宜发展新质生产力、交通运输结构调整（W01周报）等供给端部署；三是外需发力——进出口增长26%，民营企业贡献超八成增量，对东盟、中亚等新兴市场增速显著高于整体，呼应中欧班列扩容（1—6月开行1859列、增长22%）与郑州—卢森堡\"双枢纽\"等开放通道建设，形成\"班列开行—外贸放量\"的联动；三是流通与产销衔接——小麦产销会200万吨签约、\"郑州价格\"建设，把粮食大省的农业优势（一产增长4.0%）转化为全国统一大市场中的定价与流通影响力。\n\n**成效与数据**：上半年GDP 33521.58亿元、增长5.0%；三次产业增加值分别为2279.18亿、13006.22亿、18236.18亿元，增速4.0%、5.4%、4.9%；进出口5203.6亿元、增长26%，历史同期首破5000亿元，其中出口3194.8亿元（+14.6%）、进口2008.8亿元（+49.8%）；外贸实绩企业1.59万家、同比增加4170家；民营企业进出口3939.3亿元（+30%）。河南经济运行定性为\"总体平稳、稳中有进\"，呈\"结构向优、动能向新、质效向好\"。（来源[SE39][SE40][SE41][SE48]）\n\n**局限与数据边界**：其一，河南上半年社零、规上工业、固定资产投资等分项增速在本轮写作中未能从省统计局页面（直接访问受限）逐项核实，仅掌握GDP与外贸口径数据[存疑：分项数据以省统计局原文为准，暂不引具体数字]；其二，5.0%的增速是与年度目标对比的\"进度数据\"而非\"已完成年度任务\"，引用时须区分；其三，进口增速（49.8%）远高于出口（14.6%），外贸结构变化的原因（大宗商品价格、产业配套进口等）官方报道未展开，不宜过度解读。\n\n**可迁移点与评价**：其一，\"经济大省挑大梁\"是中央对经济大省的定位要求，河南以\"1+2+4+N\"目标任务体系落实，可作\"地方落实国家战略\"的案例框架。其二，\"班列扩容→外贸放量→民企增量\"的链条，是\"开放通道建设转化为发展动能\"的完整证据链。其三，粮食产销会与\"郑州价格\"，体现从\"卖原粮\"向\"定价权、产业链\"升级，可迁移到\"统一大市场\"\"粮食安全\"申论主题。\n\n**可考角度**：常识——上半年GDP总量33521.58亿元、增速5.0%，进出口首次破5000亿元，防汛四级应急响应启动时间（7月16日14时30分）；案例分析——\"结构向优、动能向新、质效向好\"如何从三次产业与外贸数据中读出；材料写作——经济大省的担当：稳增长、保粮安、扩开放三位一体。\n\n**金句（适用主题：经济大省担当、高质量发展）**：\n1. 半年报的分量，不在增速的数字里，而在\"结构向优、动能向新、质效向好\"的走势中。\n2. 班列跑出的每一公里，都在把内陆腹地变成开放前沿。\n3. 挑大梁，既要稳得住基本盘，更要蹚得出新路子。\n\n## 复盘与下周关注\n\n- 下周关注：普通本科批正式投档及投档线公布（7月21—25日）；省政府新闻办\"巩固拓展经济稳中向好势头\"发布会（7月21日）与下半年消费品以旧换新国补详情；农业高温干旱风险预警后续（7月22—24日高温过程）；伏旱发展与抗旱浇灌动态。\n\n## 来源与证据\n\n- [SE39] 河南省政府门户网《2026年河南经济\"半年报\"出炉》，2026-07-17，https://www.henan.gov.cn/2026/07-17/3376766.html\n- [SE40] 河南省统计局《2026年上半年全省经济运行情况》（与国家统计局河南调查总队联合发布），2026-07-17，https://tjj.henan.gov.cn/2026/07-17/3376629.html\n- [SE41] 中国新闻网《2026年河南经济\"半年报\"出炉 GDP同比增5%》，2026-07-17，https://www.chinanews.com.cn/cj/2026/07-17/10661596.shtml\n- [SE42] 河南省政府门户网《河南启动防汛四级应急响应》，2026-07-16，https://www.henan.gov.cn/2026/07-16/3376291.html\n- [SE43] 河南省政府门户网《暴雨大暴雨！\"七下八上\"防汛关键期来了》，2026-07-16，https://www.henan.gov.cn/2026/07-16/3376103.html\n- [SE44] 河南日报网《河南200万吨夏粮销往全国》，2026-07-13，https://www.henandaily.cn/news/2026/0713/1240088.html\n- [SE45] 国际在线河南频道（转河南日报）《郑州国际陆港包件库投用首月破万吨 河南中欧（亚）班列跑出开放加速度》，2026-07-17，https://hn.cri.cn/20260717/be5daac5-e421-46d0-b8a0-b5ad2d4c5700.html （转载；河南日报原文见 https://newpaper.dahe.cn/hnrb/html/2026-07/17/content_11_1802367.htm ）\n- [SE46] 新华网河南频道（转郑州日报）《河南高招普通本科批21日正式投档》，2026-07-20，http://www.ha.xinhuanet.com/20260720/c1427644d8744629be4791d34d5f0d9b/c.html\n- [SE47] 人民日报（中国共产党新闻网转载）《两部门联合发布农业高温干旱风险预警》，2026-07-21，http://cpc.people.com.cn/n1/2026/0722/c64387-40765493.html\n- [SE48] 平顶山市发展和改革委员会（转大河网）《GDP增长5%！2026年河南经济\"半年报\"出炉》，2026-07-20，https://fgw.pds.gov.cn/contents/22243/750315.html\n- [SE49] 洛阳市人民政府网在线访谈《\"七下八上\"关键期，河南这样守护汛期安全》，2026-07-30，https://www.ly.gov.cn/2026/07-30/1076560.html （作汛期背景引用，发布于本周期之后）\n\n## 关联专题\n\n- [[W02]]\n- [[P01]]\n- [[D10]]\n", "W04-周报-2026-07-26.md": "\n# W04 · 河南时政周报（2026-07-20 — 2026-07-26）\n\n## ⚡ 快速知识卡\n\n\n本周（7月20—26日）河南时政主线有三：一是7月21日省政府新闻办发布会，五部门解读下半年攻坚举措，公布促消费“大礼包”（汽车报废最高补2万元、6类家电最高1500元、4类数码最高500元）与城镇新增就业110万人以上目标，是“半年报”（见W03）向“施工图”的传导；二是7月21—25日高招普通本科批集中录取，26日公布征集志愿；三是“七下八上”关键期高温伏旱发展，21日农业农村部与中国气象局联合发布农业高温干旱风险预警，河南防汛抗旱“双线作战”。考法以常识（补贴标准、就业目标、投档与征集志愿时间）与案例分析（政策落地、抗旱保秋）为主。\n\n## 📖 本周要闻十条\n\n### 1. 省政府新闻办发布会部署下半年经济工作：\"时间过半、任务过半\"\n7月21日，河南省政府新闻办举行\"河南省推动2026年下半年进一步巩固拓展经济稳中向好势头\"新闻发布会，省发展改革委主任马健介绍总体情况，工信、财政、人社、商务部门负责人答问。发布会通报：上半年全省GDP达3.35万亿元、同比增长5%，高于全国0.3个百分点，在全国、经济大省和中部六省中位次前移；规上工业增加值、固定资产投资、社会消费品零售总额分别增长8.1%、0.3%、2.7%，分别高于全国2.7个、6个、1.4个百分点。下半年从投资、工业、财政、就业、商务五大领域部署攻坚。（来源[SE38][SE50][SE51][SE54]）\n\n### 2. 下半年促消费\"大礼包\"：以旧换新补贴标准公布\n省商务厅副厅长宋玉哲在发布会上介绍下半年促消费举措：对汽车报废更新、置换更新的个人消费者，按比例分别最高给予2万元、1.5万元补贴；对购买补贴范围内冰箱、洗衣机、电视、空调、电脑、热水器等6类家电最高补贴1500元；手机、平板、智能手表手环、智能眼镜等4类数码智能产品最高补贴500元，预计再惠及消费者超千万人次。同时部署郑州、洛阳消费新业态试点、\"豫鉴美食\"餐饮促消费、部分地市有奖发票试点等。（以上为政策目标值，实际兑付数据以后续通报为准。）（来源[SE52][SE53]）\n\n### 3. 财政数据：以旧换新已下达资金77.6亿元、带动消费759亿元\n省财政厅副厅长王崴介绍（上半年已完成数据）：全省财政收支实现时间过半、任务过半，民生支出占一般公共预算支出比重达75.8%；消费品以旧换新已下达相关资金77.6亿元，带动消费759亿元、惠及群众1260万人次。下半年安排：加快超长期特别国债\"两重\"、中央预算内投资资金拨付（累计调拨182亿元）；用好全年剩余约800亿元专项债额度；24只省级政府投资基金累计直投项目1731个、投资金额905.6亿元；适时提高低保、城乡居民基础养老金、医保财政补助标准。（来源[SE50][SE54]）\n\n### 4. 就业目标：全年城镇新增就业110万人以上\n发布会明确下半年稳就业主线是\"以稳就业为主线，着力拓岗位、优服务、抓重点、兜底线\"，目标为确保实现全年城镇新增就业110万人以上。上半年已完成数为71.54万人（一说71.5万人，口径同一）、完成年度目标的65%——引用时须区分\"目标值110万\"与\"已完成71.5万\"。（来源[SE50][SE54]）\n\n### 5. 高招普通本科批正式投档录取（7月21日—25日）\n本周高招进入\"重头戏\"：7月21日起普通本科批和高水平运动队正式投档录取（投档安排为上周W03所报道节点的落地，不重复展开），实行\"分数优先、遵循志愿、一轮投档\"平行志愿模式。平行志愿一次性投档录取后，未完成的招生计划于7月26日向符合条件的考生公开征集志愿，当日省教育考试院公布征集志愿信息，9:00—18:00上网选报；征集志愿投档以当次征集志愿为依据。（来源[SE46][SE55]）\n\n### 6. 农业高温干旱风险预警发布，\"双线作战\"转入抗旱\n7月21日，农业农村部和中国气象局联合发布农业高温干旱风险预警：7月以来陕西中南部、河南西南部等地35℃以上高温日数达11—15天、较常年同期偏多8—14天，预计7月22—24日河南等地仍有35℃以上高温天气。此时正值夏玉米抽雄吐丝等关键生长期，高温干旱对秋粮生产构成现实压力，河南进入防汛与抗旱\"双线作战\"状态。（来源[SE47]）\n\n### 7. 汛期\"旱涝并存\"特征进一步显性化\n据河南省水利部门后续在线访谈（7月30日刊发，作本周形势的权威背景引用）：今年入汛以来全省平均降水量较多年平均值偏少一成多，7月以来偏少六成多，持续高温少雨下部分地块表层土壤失墒较快；今年汛期呈气温整体偏高、降水分布极度不均、旱涝急转风险突出、极端降雨突发性增强四个特点，中南部更易出现持续性重度伏旱。与上周（W03）防汛四级应急响应对照，本周工作重心向抗旱侧倾斜。[存疑：7月20—26日当周河南逐日雨情、受旱面积的分日官方数据未检索到白名单原文，暂不引具体数字]（来源[SE49]）\n\n### 8. 稳投资：重大项目清单与民间投资落地\n省发改委副主任李新国表示，投资仍是\"十五五\"时期稳增长核心抓手，下半年从四方面扩大有效投资：用好全年剩余约800亿元专项债额度，推动新型政策性金融工具落地；以\"一项目、一清单、一台账\"推进\"双百工程\"，加快京港高铁阜阳至黄冈段、焦济洛平高铁、豫东水资源配置工程等项目开工建设；落实促进民间投资高质量发展20条硬核举措（见W01/W02）；动态更新能源、水利、交通、算力等\"六张网\"项目储备库。上半年已完成数据：民间投资占固定资产投资比重达60.6%、较一季度提高0.4个百分点。（来源[SE50][SE54]）\n\n### 9. 工业\"压舱石\"：上半年规上工业增加值增速居十大工业大省第2位\n发布会通报（上半年已完成数据）：全省规上工业增加值增长8.1%、位列十大工业大省第2位，制造业增长9.6%；70.7%的工业行业实现增长，重点产业链群增加值增长9.8%、对工业增长贡献率达75.4%；规上高技术制造业、战略性新兴产业增加值分别增长26.1%、13.2%，连续36个月、18个月保持两位数增长；新能源汽车、智能手机产量分别增长28.5%、23.9%。下半年稳工业举措包括推动奇瑞乘用车技改、比亚迪皮卡、中州时代三期四期等项目投产提产、实施\"人工智能+\"行动等。（来源[SE50][SE54]）\n\n### 10. 稳外贸与开放平台：\"千企百展\"拓市场、办好中博会\n省商务厅部署下半年稳外贸：出台稳住外贸基本盘系列政策；开展\"千企百展拓市场\"行动、组织企业参加300场国际性专业展会；办好第三届郑州—卢森堡\"空中丝绸之路\"国际合作论坛、第十四届中国中部投资贸易博览会；深化\"跨境电商+产业带\"模式，发展数字贸易、绿色贸易，坚持外贸外资外经\"三外联动\"。背景数据（上半年已完成）：全省进出口总值5203.6亿元、增长26%，半年首次突破5000亿元、创同期历史新高（见W03）。同时推动郑州汽车流通消费改革试点城市建设，开展新能源汽车下乡、拉力赛、车展等活动。（来源[SE52][SE54]）\n\n## 📖 深度案例：从\"半年报\"到\"施工图\"——7·21发布会看省级政策传导机制\n\n**主体与事件**：7月21日，省政府新闻办举行\"河南省推动2026年下半年进一步巩固拓展经济稳中向好势头\"新闻发布会，省发改委牵头、工信厅、财政厅、人社厅、商务厅参加，一揽子通报上半年成绩并解读下半年五大领域攻坚方案。（来源[SE38][SE50][SE51]）\n\n**背景与问题**：7月17日省统计局公布上半年\"半年报\"（GDP 33521.58亿元、增长5.0%，见W03）后，留出的政策窗口很窄：一方面全国外部环境不确定性上升、内需不足，另一方面河南自身固投增速仅0.3%、明显回落（受房地产调整等影响），下半年\"十五五\"开局能否站稳，取决于政策衔接速度。发布会要回答的核心问题是：数据\"过半\"之后，缺口在哪里、工具是什么。\n\n**做法与机制（政策传导的四个环节）**：一是\"数据对账\"——先公布总量与分项完成情况（工业8.1%、社零2.7%、进出口5203.6亿元），把\"半年报\"数字转为政策叙事，明确\"扛稳经济大省挑大梁责任\"。二是\"缺口识别\"——不回避投资回落问题，直面\"投资增速较一季度有所回落、稳投资仍面临一定压力\"，将投资定为下半年核心抓手。三是\"工具匹配\"——财政端（剩余约800亿元专项债、新型政策性金融工具、182亿元\"两重\"资金调拨）、产业端（奇瑞、比亚迪皮卡、中州时代等具体项目清单）、需求端（以旧换新补贴标准、千企百展300场展会）、民生端（全年新增就业110万人以上目标、适时提高三项保障标准）分别对应各自缺口。四是\"责任到人\"——五部门负责人逐一认领任务，形成\"一部门一清单\"的公开承诺机制。\n\n**成效与数据**：制度运行的数据支撑以上半年已完成值为准——民生支出占比75.8%、以旧换新带动消费759亿元惠及1260万人次、民间投资占比60.6%、城镇新增就业71.54万人（完成65%）；下半年指标（110万人就业、千万人次以旧换新受益等）均为目标值，验收要等年度数据。此区分是引用本案例时最容易出错的地方。（来源[SE50][SE54]）\n\n**局限与争议**：其一，固投增速0.3%、社零2.7%虽高于全国，但绝对水平不高，政策对冲效果尚待验证；其二，发布会未披露房地产领域专项安排，\"投资回落\"的结构性原因着墨有限；其三，促消费补贴属延续性政策，边际拉动效应递减的风险官方报道未讨论。\n\n**可迁移点与评价**：其一，\"数据对账→缺口识别→工具匹配→责任到人\"四环节，可作为\"政策落实闭环\"的通用分析框架，适用于申论\"抓落实\"主题。其二，\"区分目标值与完成值\"本身就是材料题的常设陷阱：题干给110万人就业目标，材料里给71.54万人完成数，二者混用即错。其三，\"不回避缺口\"（公开承认投资回落）体现实事求是的施策风格，可迁移到\"政府诚信与预期管理\"角度。\n\n**可考角度**：常识——发布会时间（7月21日）、全年城镇新增就业目标（110万人以上）、汽车报废更新最高补贴（2万元）；案例分析——五大部门攻坚如何对应上半年数据缺口；材料写作——经济大省挑大梁，既要\"半年红\"更要\"全年稳\"。\n\n**金句（适用主题：政策落实、经济大省担当）**：\n1. 半年报讲清\"成绩单\"，发布会亮出\"施工图\"，一报一会之间，是政策从部署到落地的完整闭环。\n2. 承认缺口不是示弱，把工具摆上台面才是担当。\n3. 挑大梁不靠喊出来的数据，靠一项项对得上账的落实。\n\n## 复盘与下周关注\n\n- 下周关注：普通本科批征集志愿录取结果与专科批启动（8月上旬）；高温伏旱发展与秋粮抗旱浇灌进展；以旧换新补贴兑付与暑期消费季数据；郑州—卢森堡\"空中丝绸之路\"论坛筹备动态。\n\n## 来源与证据\n\n- [SE50] 国务院新闻办公室网站《河南举行推动2026年下半年进一步巩固拓展经济稳中向好势头新闻发布会》（实录），2026-07-24，http://www.scio.gov.cn/xwfb/dfxwfb/gssfbh/hn_13841/202607/t20260724_1000700.html\n- [SE51] 河南省发展和改革委员会《河南省推动2026年下半年进一步巩固拓展经济稳中向好势头新闻发布会举行》，2026-07-21，https://fgw.henan.gov.cn/2026/07-21/3377708.html\n- [SE52] 平顶山市商务局（转载）《河南下半年促消费\"大礼包\"来了！》，2026-07-23，http://swj.pds.gov.cn/contents/20087/750681.html\n- [SE53] 大河财立方（新浪财经转载）《河南下半年补贴继续，购车最高补2万》，2026-07-21，https://finance.sina.com.cn/wm/2026-07-21/doc-iniiptrf2608107.shtml\n- [SE54] 中国工业新闻网（中国工业报）《外贸创新高、夏粮增产全国第一！河南经济多点发力年中答卷任务过半》，2026-07-21，https://www.cinn.cn/2026/07-21/brY09vW1.html\n- [SE55] 大河网《河南高招迎来\"重头戏\" 普通本科批明日正式投档》（新浪河南转载稿），2026-07-21，https://henan.sina.cn/news/z/2026-07-21/detail-iniiphzq8194377.d.html\n- [SE38] 河南省政府门户网《河南省推动2026年下半年进一步巩固拓展经济稳中向好势头新闻发布会》直播实录，2026-07-21，https://www.henan.gov.cn/2026/07-21/3377621.html （复用W03/W02已建编号，非新增）\n- [SE46] 新华网河南频道（转郑州日报）《河南高招普通本科批21日正式投档》，2026-07-20，http://www.ha.xinhuanet.com/20260720/c1427644d8744629be4791d34d5f0d9b/c.html （复用W03已建编号）\n- [SE47] 人民日报（中国共产党新闻网转载）《两部门联合发布农业高温干旱风险预警》，2026-07-21，http://cpc.people.com.cn/n1/2026/0722/c64387-40765493.html （复用W03已建编号）\n- [SE49] 洛阳市人民政府网在线访谈《\"七下八上\"关键期，河南这样守护汛期安全》，2026-07-30，https://www.ly.gov.cn/2026/07-30/1076560.html （复用W03已建编号；作汛期/伏旱背景引用，发布于本周期之后）\n\n## 关联专题\n\n- [[W03]]\n- [[W02]]\n- [[P01]]\n", "W05-周报-2026-08-02.md": "\n# W05 · 河南时政周报（2026-07-27 — 2026-08-02）\n\n## ⚡ 快速知识卡\n\n\n本周（7月27—8月2日）河南时政主线有三：一是7月28日省长王凯主持省政府常务会议，部署“人工智能+”与数智强省、城市更新三年行动、下半年稳增长重点任务，研究郑州航空港国家级零碳园区规划，是7月21日“施工图”发布会（见W04）后首次省级决策层调度；二是省政府门户网7月31日盘点7月五项重要政策，含长期护理保险制度实施方案、民间投资促进措施、推进服务业扩能提质实施意见（豫政〔2026〕10号，2030年服务业规模4.6万亿元左右），可作“政策月度清单”掌握；三是高招进入专科批录取，本科批两轮征集志愿（7月27、29日）后收尾（承接W04）。此外7月下旬高温伏旱持续，秋粮田管进入抽雄关键期。考法以常识（会议时间、4.6万亿目标、征集志愿时间）与案例分析（零碳园区、长护险制度设计）为主。\n\n## 📖 本周要闻十条\n\n### 1. 7月28日省政府常务会议：部署\"人工智能+\"行动与下半年经济调度\n7月28日，省长王凯主持召开省政府常务会议。会议传达学习习近平总书记在2026世界人工智能大会暨人工智能全球治理高级别会议开幕式上的主旨讲话、在上海考察时重要讲话精神和关于基础教育的重要指示精神，强调深入实施\"人工智能+\"行动，以主导产业需求为牵引强化技术攻关、以优质主体引育为抓手壮大产业链群、以赋能实体经济为导向打造应用场景，培育壮大智能经济新形态，加快建设数智强省；同时部署高质量推进城市更新重点工程三年行动计划，抓好郑州、洛阳中央财政支持城市更新行动工作，健全与人口变化相适应的教育资源配置机制。（来源[SE56][SE57]）\n\n### 2. 会议听取上半年集中督查汇报、研究下半年重点任务举措\n同一会议上，省政府听取上半年集中督查情况汇报，要求压实属地和部门整改责任，聚焦共性问题举一反三，对工作成效好的地方加大激励力度；研究下半年进一步巩固拓展经济稳中向好势头重点任务举措，强调加强监测调度、强化精准施策，提高政策穿透性、快速直达经营主体，更大力度释放政策效应——这是对7月21日省政府新闻办发布会（见W04）五大领域攻坚方案的决策层再确认，形成\"发布会部署—常务会议调度\"的闭环。（来源[SE56][SE57][SE50]）\n\n### 3. 常务会议研究郑州航空港国家级零碳园区规划建设\n会议研究郑州航空港国家级零碳园区规划建设工作，强调立足资源禀赋和产业基础，科学推进开发区存量降碳、增量控碳；加快用能结构调整，因地制宜发展绿电直供模式；调整优化产业结构，大力发展绿色低碳新兴产业；强化科技创新支撑，打造示范应用场景。郑州航空港高新技术产业开发区（园中园）已入选国家发展改革委首批国家级零碳园区建设名单。背景数据（上半年已完成，见W03\"半年报\"）：全省\"新三样\"（电动汽车、锂电池、光伏产品）合计出口252.3亿元、同比增长78.3%，绿色产业成为新增长引擎。（来源[SE56][SE57]）\n\n### 4. 会议审议《河南省自然保护地整合优化方案》\n省政府常务会议审议了《河南省自然保护地整合优化方案》，并邀请华东政法大学教授郝铁川就\"学习习近平法治思想，走中国式法治现代化道路\"作专题讲座。自然保护地整合优化是国土空间治理与生态文明建设的常规动作，与本周零碳园区议题同属\"绿色\"主线，可在生态文明主题答题中组合引用。（来源[SE56][SE57]）\n\n### 5. 省政府门户网盘点：7月出台五项重要政策\n7月31日，河南省政府门户网刊发《2026年7月，河南省政府出台了这些重要政策》，集中列出五项文件：河南省交通运输结构调整专项行动方案（2026—2028年）、河南省普通干线公路穿城路段改建行动方案（2026—2028年）、河南省建立长期护理保险制度实施方案、河南省进一步促进民间投资高质量发展若干政策措施、关于推进服务业扩能提质的实施意见。其中交通运输结构调整与民间投资政策分别呼应W01周报的交通运输大省部署与W02周报的民间投资20条，可按\"月度政策清单\"整体复习。（来源[SE58]）\n\n### 6. 豫政〔2026〕10号：推进服务业扩能提质，2030年规模达4.6万亿元左右\n《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号，2026年7月1日印发）提出：聚焦生产性、生活性服务业两个方向，围绕支撑型、赋能型、成长型服务业构建\"3×4\"服务业发展新格局，到2030年全省服务业规模达到4.6万亿元左右（此为规划目标值）。文件落实《国务院关于推进服务业扩能提质的意见》（国发〔2026〕7号）关于2030年全国服务业总规模迈上100万亿元台阶的部署；具体安排包括推动现代物流降本增效、推广郑州—卢森堡\"双枢纽\"经验、完善县乡村三级养老服务网络、推广胖东来经验培育品质型零售骨干企业、实施品牌提升工程选树\"美豫名品\"服务业企业等。（来源[SE59]）\n\n### 7. 长护险实施方案印发：社保\"第六险\"从试点走向全面建制\n《河南省人民政府办公厅关于印发河南省建立长期护理保险制度实施方案的通知》（2026年6月18日成文）近日公开发布，国家医保局网站7月26日转发。方案明确：长期护理保险为独立险种，从市级统筹起步，用3年左右时间在全省全面建立；2026年各统筹地区启动实施就业人员长护险制度，2027年洛阳、鹤壁、新乡、焦作、三门峡、南阳、商丘、济源8个统筹地区启动未就业城乡居民参保，2028年实现全省参保全覆盖。7月22日省政府新闻办已就方案召开新闻发布会进行解读（该发布会属上一周期节点，本周随政策盘点进入落地关注期；制度要点详见本期深度案例）。（来源[SE60][SE61]）\n\n### 8. 高招：本科批两轮征集志愿收尾，专科提前批8月1—2日录取\n高招录取本周从本科批收尾转入专科批次：7月27日进行普通本科批再次征集志愿，7月29日进行第三次征集志愿；8月1—2日进行普通高职（专科）提前批（含定向培养军士、医学类、航海类）录取，8月2日省教育考试院发布普通高职（专科）提前批、艺术高职（专科）批和体育高职（专科）批征集志愿通知。普通高职（专科）批将于8月5—7日录取。投档规则延续\"分数优先、遵循志愿、一轮投档\"，征集志愿以当次填报为投档依据。（来源[SE62]）[存疑：本科批各轮征集志愿的院校数量、投档线等分项数据未检索到省教育考试院原文明细，暂不引具体数字]\n\n### 9. 高温伏旱持续，秋粮田管进入抽雄关键期\n7月下旬河南高温伏旱延续。农业农村部、中国气象局7月21日联合发布的农业高温干旱风险预警（见W04）预计7月22—24日河南等地仍有35℃以上高温天气，南阳、驻马店等地可能出现旱情；河南省农业科学院粮作所7月13日发布的田管技术意见指出，当前正值夏玉米拔节孕穗关键期，大部地区受37℃以上高温持续影响、部分地区旱情显现，且临近\"七下八上\"防汛关键期，\"旱涝并存、旱涝急转\"风险上升，要求抗旱防汛两手抓。本周抗旱保秋工作重心仍在\"一喷多促\"、科学灌溉与辅助授粉。（来源[SE88][SE64]）[存疑：7月27日—8月2日当周全省逐日雨情、受旱面积及浇灌进度的官方分日数据未检索到白名单原文，暂不引具体数字]\n\n### 10. 郑州\"十五五\"规划纲要发布：GDP已破1.52万亿、锚定2030年2万亿\n7月29日，河南省\"开局起步'十五五'奋力谱写新篇章\"系列郑州专场新闻发布会上，郑州市委副书记、市长庄建球介绍郑州\"十五五\"规划纲要编制情况：\"十四五\"期间郑州地区生产总值连续跨越四个千亿台阶、突破1.52万亿元（已完成数据），稳居北方省会城市首位，经济首位度达22.9%；\"十五五\"锚定2030年GDP突破2万亿元目标（目标值）。同期郑州市发改委动态还显示，中欧班列累计开行量已突破13万列（全国口径数据，非郑州单列数据，引用时须注意口径）。（来源[SE63]）[存疑：中欧班列\"累计13万列\"的统计主体与口径（全国/郑州）未从原文核实，引用需谨慎]\n\n## 📖 深度案例：河南建立长期护理保险制度——社保\"第六险\"如何从试点走向全面建制\n\n**主体与事件**：河南省政府办公厅印发《河南省建立长期护理保险制度实施方案》（2026年6月18日成文），7月22日省政府新闻办召开新闻发布会解读，7月下旬方案全文经国家医保局网站（7月26日）与省政府门户7月政策盘点（7月31日）集中公开。这是河南应对人口老龄化、健全社会保障体系的标志性制度安排，也是本期最完整的\"制度设计类\"可考素材。（来源[SE60][SE61][SE58]）\n\n**背景与问题**：长期护理保险被称为社保\"第六险\"，为失能人员提供基本生活照料及与之密切相关的医疗护理服务。河南是人口大省，老龄化程度加深、家庭小型化背景下，重度失能家庭普遍面临\"照护人手不够、护理费用偏高\"的双重压力；此前长护险仅在国家试点城市局部探索，缺乏全省统一的制度框架。核心问题：一个近亿人口省份如何\"分步、可持续\"地把独立险种建起来，既兜住失能群体底线，又不拖垮基金。\n\n**做法与机制（四个制度设计要点）**：一是\"独立险种＋市级统筹起步\"——建立就业人员和未就业人员共同基金账户，市级统筹地区内政策统一、基金统收统支，待全省全面建制后逐步推向省级统筹。二是\"三年分步扩面\"——2026年覆盖全省就业人员（含职工、退休人员、灵活就业人员），2027年洛阳、鹤壁等8个统筹地区纳入未就业城乡居民，2028年全省参保全覆盖；开封市2028年年底前完成政策过渡。三是\"多元筹资、分类负担\"——费率控制在0.3%左右：单位职工由单位和个人各担0.15%左右；退休人员个人缴纳、可由医保个人账户代扣；未就业城乡居民个人缴费与政府补助按1∶1左右分担，费率从0.15%起步、5年过渡到0.3%；特困人员全额资助、低保对象等定额资助不低于个人缴费的50%，困难群体政府兜底。四是\"闭环管理\"——执行国家统一失能等级评估标准，失能持续6个月以上经评估认定为重度失能方可享受待遇；全省统一执行国家36项护理服务项目目录（20项生活照护＋16项医疗护理）；支持机构、社区、居家三种护理方式，支付比例向居家、社区倾斜；基金入财政专户单独管理，常态化运用飞行检查、远程监控等手段。\n\n**成效与数据（区分目标值与制度参数）**：制度目标——2026年底覆盖全省就业人员、2028年全省参保全覆盖；待遇参数——就业人员类基金支付比例70%左右、未就业城乡居民类50%左右，不设起付线，年度最高支付限额不超过统筹地区上年度城乡居民人均可支配收入的50%；服务目录36项。注意：这些是制度设计参数与时间表，不是\"已保障X万人\"的运行数据；制度刚进入启动实施阶段，实际参保与待遇兑付数据尚未产生，引用时严禁把参数当作成果数据。（来源[SE60][SE61]）\n\n**局限与争议**：其一，城乡居民费率从0.15%起步、5年过渡到0.3%，政府补助具体办法\"另行制定\"，长期筹资可持续性有待观察；其二，农村地区护理服务资源不足，方案虽提出支持乡镇卫生院申请长护险定点、开展长期照护师职业技能等级认定，但服务供给能力建设见效需要时间；其三，失能评估机构、护理服务机构的定点管理办法尚为试行版本，实操层面规范化程度待检验。（来源[SE60][SE61]）\n\n**可迁移点与评价**：其一，\"独立险种、分步扩面、多元筹资、闭环监管\"四要素，可作\"社会保障制度改革\"类案例的通用分析框架；其二，\"区分制度参数与运行数据\"同样是申论材料题常设陷阱；其三，对居家、社区护理的支付倾斜与对困难人群的财政兜底，体现\"保基本、兜底线\"的制度伦理，可迁移到\"民生保障\"\"共同富裕\"\"积极应对人口老龄化\"等申论主题。\n\n**可考角度**：常识——长护险被称为社保\"第六险\"，河南目标2028年实现全省参保全覆盖，职工类基金支付比例70%左右；案例分析——河南\"3年三步走\"扩面路径如何平衡公平与可持续；材料写作——从\"老有所养\"到\"失能有护\"：一张保障网的社会温度与制度精度。\n\n**金句（适用主题：民生保障、人口老龄化应对）**：\n1. 长护险补的不是一块钱的缺口，而是一个家庭扛不动的照护之重。\n2. 制度的成色，不在文件厚度里，在重度失能老人床边的服务里。\n3. 分步走不是走得慢，而是把每一分基金、每一项服务都走得扎实。\n\n## 复盘与下周关注\n\n- 下周关注：普通高职（专科）批8月5—7日录取及后续征集志愿（8月8日）；长护险各统筹地区实施细则出台与参保启动动态；伏旱发展与秋粮\"一喷多促\"进展；服务业扩能提质实施意见配套政策；零碳园区规划建设后续举措。\n\n## 来源与证据\n\n- [SE56] 人民网河南频道（转河南日报）《王凯主持召开河南省政府常务会议》，2026-07-29，http://henan.people.com.cn/n2/2026/0729/c351638-41652789.html\n- [SE57] 河南省地方金融监督管理局（转载河南日报）《王凯主持召开省政府常务会议》，2026-07-28，https://www.hnswjrb.gov.cn/2026/07-28/3654312.html （转载；与SE56同稿）\n- [SE58] 河南省政府门户网《2026年7月，河南省政府出台了这些重要政策》，2026-07-31，https://www.henan.gov.cn/2026/07-31/3381194.html\n- [SE59] 南阳市人民政府网（转载河南发布）《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号），2026-07-08，https://www.nanyang.gov.cn/2026/07-08/1418283.html （转载；文件成文日期2026-07-01）\n- [SE60] 国家医疗保障局网站（转河南省政府官网）《河南省人民政府办公厅关于印发河南省建立长期护理保险制度实施方案的通知》，2026-07-26，http://www.nhsa.gov.cn/art/2026/7/26/art_14_21558.html （转载；文件成文日期2026-06-18）\n- [SE61] 大河报（新浪河南转载）《河南\"第六险\"全面启动 2026年底覆盖全省就业人员》，2026-07-23，https://henan.sina.cn/news/m/2026-07-24/detail-iniitzpf1486339.d.html （转载）\n- [SE62] 河南省教育考试院（河南高考信息网转载）《关于普通本科批再次征集志愿的通知》（2026-07-27）、《关于普通本科批第三次征集志愿的通知》（2026-07-29）、《关于普通高职（专科）提前批、艺术高职（专科）批和体育高职（专科）批征集志愿的通知》（2026-08-02），见相关阅读列表，https://gaokao.haedu.cn/501/552/2026/0624/155630.html （页面转载；通知原文载河南省教育考试院网站）\n- [SE63] 郑州市发展和改革委员会网站工作动态（大河网稿）《郑州：奋力实现\"十五五\"良好开局》等，2026-07-29，https://fgw.zhengzhou.gov.cn/work/index_7.jhtml （栏目页；发布会内容为大河网报道转载）\n- [SE64] 河南省农业科学院粮食作物研究所《防汛抗旱齐抓共管，做好玉米孕穗期管理》，2026-07-13，https://www.hnagri.org.cn/article-113419.html （作秋粮田管技术背景引用）\n- [SE88] 中国新闻网《农业农村部和中国气象局联合发布农业高温干旱风险预警》，2026-07-21，https://www.chinanews.com/sh/2026/07-21/10663706.shtml （与SE47同事件不同媒体报道，非同一来源）\n- [SE50] 国务院新闻办公室网站《河南举行推动2026年下半年进一步巩固拓展经济稳中向好势头新闻发布会》（实录），2026-07-24，http://www.scio.gov.cn/xwfb/dfxwfb/gssfbh/hn_13841/202607/t20260724_1000700.html （复用W04已建编号）\n\n## 关联专题\n\n- [[W04]]\n- [[W03]]\n- [[P01]]\n- [[D05]]\n", "W06-周报-2026-08-09.md": "\n# W06 · 河南时政周报（2026-08-03 — 2026-08-09）\n\n## ⚡ 快速知识卡\n\n\n本周（8月3—9日）河南时政主线有三：一是8月3日省委十一届十一次全会在郑州举行，决定省第十二次党代会2026年10月下旬召开，聚焦“1+2+4+N”目标任务体系；次日省长王凯主持省政府常务会议传达全会精神，研究郑州市要素市场化配置综合改革试点，形成“全会部署—政府落实”接力。二是防汛转入台风防御：8月8日刘宁、王凯在郑州督导防汛备汛，同日省气象局与省农业农村厅联合发布农田渍涝风险预警，提示受台风“白海豚”影响10—13日全省大部存在渍涝风险——本期深度案例即以此为主线。三是民生节点：普通高职（专科）批8月5—7日录取、8日征集志愿；8月8日为第18个全民健身日。考法以常识（全会与党代会时间、录取时间）与案例分析（防汛“四个宁可”、要素市场化改革）为主。\n\n## 📖 本周要闻十条\n\n### 1. 8月3日省委十一届十一次全会在郑州举行：决定省十二次党代会10月下旬召开\n中国共产党河南省第十一届委员会第十一次全体会议于2026年8月3日在郑州举行，出席省委委员84人、省委候补委员2人。全会由省委常委会主持，省委书记刘宁讲话。全会听取和讨论了省委常委会工作报告，审议通过《关于召开中国共产党河南省第十二次代表大会的决议》，决定省第十二次党代会于2026年10月下旬在郑州召开；全会同时就做好下半年工作作出部署，强调聚焦\"1+2+4+N\"目标任务体系，着力促发展、强治理、惠民生、防风险、抓党建。（来源[SE65]）\n\n### 2. 全会部署：高质量发展高效能治理，奋力谱写中国式现代化新篇章\n全会公报对下半年工作给出明确框架：稳定经济运行，纵深推进融入服务全国统一大市场；加快建设农业强省、推进乡村全面振兴；推动文化繁荣兴盛、加强污染防治和生态文明建设、加强社会治理；以更高标准更实举措推进全面从严治党，加快建设清廉河南，\"以脱贫攻坚精神大纵深推进群众身边不正之风和腐败问题集中整治\"。全会还把学习贯彻习近平党建思想列为当前和今后一个时期的重要政治任务，要求持续抓好树立和践行正确政绩观学习教育。（来源[SE65]）\n\n### 3. 8月4日省政府常务会议：传达贯彻全会精神，研究郑州要素市场化配置综合改革试点\n8月4日，省长王凯主持召开省政府常务会议，传达学习习近平总书记重要讲话重要文章精神（含在中央政治局会议、党外人士座谈会上的重要讲话精神及《求是》重要文章《加快建设健康中国》），研究省委十一届十一次全会精神贯彻落实工作。会议强调聚焦\"1+2+4+N\"目标任务体系，统筹抓发展、促改革、强治理、惠民生、防风险，坚决打好经济发展夏秋季战役；扎实做好国防动员工作；深入实施健康优先发展战略，加快建设健康河南。会议专门研究郑州市要素市场化配置综合改革试点工作，要求破除阻碍要素自由流动和高效配置的体制机制障碍，探索形成可复制可推广的制度性创新成果，为全省纵深推进融入服务全国统一大市场积累经验。（来源[SE66][SE67]）\n\n### 4. 8月5日王凯在洛阳调研城市更新：完整社区、工业遗产、大遗址保护三线并进\n8月5日，省长王凯到洛阳市调研城市更新工作并检查防汛措施落实：在洛龙区关林街道石油社区察看老旧小区改造与社区治理，强调推动资源、服务、管理下沉；在古洛渠以北排水防涝项目现场察看低洼易涝点治理；在天心产业园探讨老旧厂区改造与业态升级；在隋唐洛阳城玄武门遗址保护展示工程现场强调统筹文物保护和城市风貌提升。座谈会上王凯要求洛阳用好中央财政支持实施城市更新行动的政策机遇，因地制宜推进完整社区建设，加大地下管网改造力度，健全多元化投融资方式。此条是W05周报7月28日常务会议\"城市更新三年行动\"部署在省辖市层面的落地观察点。（来源[SE68]）\n\n### 5. 8月8日刘宁王凯在郑州督导调研防汛备汛：常庄水库现场会提五点要求\n当前正值防汛关键期，8月8日，省委书记刘宁、省长王凯在郑州市督导调研防汛备汛工作，先后察看荥阳市丁店水库、中原区常庄水库和南水北调中线郑州段贾峪河倒虹吸。刘宁在常庄水库运行中心主持召开工作现场会，指出持续增强的厄尔尼诺气候事件增加极端天气风险，近日受台风\"白海豚\"影响我省部分地区预计有大到暴雨，要求深入践行\"四个宁可\"理念，并从提升预警精度、持续排险除患、科学管护水库（严格落实水库防汛\"三个责任人\"和\"三个重点环节\"）、强化力量预置及早避险转移、拧紧责任链条五个方面作出部署；同时强调安全生产\"三管三必须\"。（来源[SE69][SE70]）\n\n### 6. 8月8日省气象局、省农业农村厅联合发布农田渍涝灾害风险预警\n受台风\"白海豚\"影响，预计8月10日至13日河南东南部、中东部和北部部分县（市、区）有暴雨、大暴雨，其他县（市、区）中到大雨；与前期土壤偏湿地块叠加，全省大部存在农田渍涝风险，其中豫北东部、中东部及豫南大部风险高，降水伴7至8级阵风、局地玉米有倒伏风险。本周全省秋粮田管的重心已从W04—W05周期的\"抗旱保秋\"切换为\"防渍涝、防倒伏\"，旱涝急转特征进一步显性化。（来源[SE71]）\n\n### 7. 农业农村部全国秋粮生产现场推进会：奋战100天夺秋粮丰收\n新华社8月3日电，农业农村部近日在山东德州召开全国秋粮生产现场推进会，要求扎实推进\"奋战100天强田管抗灾害夺秋粮丰收行动\"，分作物分区域落实肥水管理、\"一喷多促\"等措施；盯牢暴雨洪涝、干旱、高温热害、台风等灾害；盯紧玉米螟和南方锈病等重大病虫害，推进统防统治。河南作为13个作重点交流发言的粮食主产省之一，本周田管部署与上条渍涝预警直接衔接。（来源[SE72]）\n\n### 8. 高招：普通高职（专科）批8月5—7日录取，8月8日征集志愿\n本周高招进入专科普通批：按7月8日公布的批次安排，普通高职（专科）批8月5日至7日录取；8月8日9:00—18:00进行普通高职（专科）批征集志愿填报（未完成计划面向符合条件考生征集，投档以当次征集志愿为依据），承接W05专科提前批（8月1—2日）的录取节奏。后续节点：8月10日省教育考试院发布普通高职（专科）批再次征集志愿通知，8月12日9:00—13日18:00填报，涉及高校136所（此为下一周期节点，作衔接引用）。（来源[SE74][SE76]）\n\n### 9. 8月7日省委常委会会议召开\n8月7日，省委书记刘宁主持召开省委常委会会议（载于河南政协\"每日要闻速览\"8月7日期\"省内要闻\"栏）。[存疑：该次会议的具体议题、审议文件未检索到白名单媒体的公开报道原文，暂不引具体内容，仅记录会议发生的时间与主持人]\n\n### 10. 第18个全民健身日：《全民健身计划（2026—2030年）》后的第一个全民健身日\n8月8日是我国第18个全民健身日。国务院日前印发《全民健身计划（2026—2030年）》，对\"十五五\"时期全民健身作出部署：到2030年人均体育场地面积达到4平方米左右，每千人拥有社会体育指导员3.3名左右，经常参加体育锻炼人数比例达到40%左右（以上均为规划目标值，非已完成数据）；部署运用人工智能赋能全民健身、实施学生体质强健计划、扩大体卫融合服务供给等10个方面任务。河南专家解读指出，少林武术、太极拳扎根民间是河南普及全民健身的文化优势，但城乡之间科学健身指导资源不均衡仍是短板。（来源[SE73][SE75]）\n\n## 📖 深度案例：台风\"白海豚\"来袭前的河南防汛备汛——\"四个宁可\"如何落到水库、农田与基层网格\n\n**主体与事件**：8月8日，省委书记刘宁、省长王凯在郑州市督导调研防汛备汛工作并在常庄水库运行中心主持召开工作现场会；同日省气象局、省农业农村厅联合发布农田渍涝灾害风险预警。此时距台风\"白海豚\"对河南的主要降雨过程（8月10—13日）仅两三天，本周构成\"临灾备汛\"的完整观察窗口。（来源[SE69][SE70][SE71]）\n\n**背景与问题**：河南地处南北气候过渡带，\"七下八上\"防汛关键期后段仍面临台风北上带来的极端降雨风险，历史上特大暴雨灾害教训深刻。本周的特殊性在于：前期高温伏旱使部分地区土壤偏湿，旱涝急转条件下，台风降雨叠加土壤饱和，极易形成农田渍涝、山洪地质灾害与城市内涝的复合风险。核心问题：一个体量近亿人口、水库密布、秋粮在田的省份，如何在两三天窗口期内把防御体系从\"备战\"切换到\"迎战\"。\n\n**做法与机制（四个抓手）**：一是\"理念先行\"——刘宁强调深入践行\"四个宁可\"理念（宁可十防九空、不可失防万一），深刻汲取历史上特大暴雨灾害教训，做到思想不松、标准不降、力度不减。二是\"责任到库\"——在丁店水库、常庄水库要求全面压实水库安全责任，健全责任机制、调度机制、管护机制，逐水库完善雨水情监测预报系统、调度运行方案和防汛应急预案，严格落实水库防汛\"三个责任人\"和\"三个重点环节\"；对南水北调中线贾峪河倒虹吸强调工程安全、供水安全、水质安全\"三个安全\"。三是\"部门联动预警\"——气象与农业农村两部门联合发布农田渍涝灾害风险预警，把气象预报直接转译为分区域的农田风险等级（豫北东部、中东部及豫南大部风险高），并给出针对性防范提示（排涝散墒、防倒伏）。四是\"指挥体系与转移预案\"——建强直达一线的防汛应急指挥体系，紧盯山洪地质灾害风险点、城市低洼易涝点、人口密集区等重点部位深化排查整治，强化力量预置、及早避险转移，常态化开展实战演练。（来源[SE69][SE70][SE71]）\n\n**成效与数据（区分部署要求与实际结果）**：本周内可确认的是部署与预警层面的动作——现场会五点要求、联合预警及风险分区、逐水库责任机制要求；台风降雨及其应对结果（响应等级、转移人数、灾情）发生在8月10日之后，属下一周期，本文不引任何\"已转移X人\"\"已排涝X亩\"之类的数据。同期可引用的正面背景是：刘宁后来在批示中回顾，入汛以来全省成功应对了9次大范围强对流天气和5次暴雨天气过程（该表述出自8月10日省防指台风防范应对会议报道，为已完成的阶段性总结，引用时注意时间口径在8月10日）。（来源[SE69][SE70][SE71]）\n\n**局限与观察点**：其一，预警精度与\"叫应\"机制是历次极端降雨应对的薄弱环节，直达基层的应急指挥体系能否在夜间、断电断网条件下生效，有待实战检验；其二，农田渍涝风险的防范主体是千家万户小农户，预警到田块、措施到人之间存在\"最后一公里\"落差，局地玉米倒伏风险的处置窗口极短；其三，\"三个责任人\"等制度在部分地区存在挂名现象，责任压实程度只能通过巡查暗访间接验证。（来源[SE69][SE70]）\n\n**可迁移点与评价**：其一，\"理念—责任—预警—转移\"四层递进可作为应急治理类案例分析通用框架；其二，气象与农业部门\"联合发布分区域风险预警\"是跨部门协同（对应A05专题）的河南样本；其三，常庄水库本身是\"75·8\"洪水的标志性地点，选择在此召开现场会具有强烈的警示意义，答题时可用\"从历史教训到制度防范\"的叙事。（来源[SE69][SE70][SE71]）\n\n**可考角度**：常识——水库防汛\"三个责任人\"\"三个重点环节\"，\"四个宁可\"理念；案例分析——河南如何在一周内完成从抗旱保秋到防涝防台风的\"旱涝急转\"切换；材料写作——宁可十防九空，不可失防万一：防汛答卷上的责任刻度。\n\n**金句（适用主题：应急治理、人民至上、基层治理）**：\n1. 防汛的账，宁可白算九次，不能少算一次。\n2. 预警跑在洪水前面，责任落在堤坝之上，干部守在群众身边。\n3. 把隐患当险情防，把险情当灾情打，才是对生命真正的敬畏。\n\n## 复盘与下周关注\n\n- 下周关注：台风\"白海豚\"降雨过程（8月10—13日）应对与灾情、应急响应等级变化；普通高职（专科）批再次征集志愿（8月12—13日）及高招收尾；农田渍涝灾害应对与秋粮\"一喷多促\"进展；省委十一届十一次全会精神在各领域的落实动态。\n\n## 来源与证据\n\n- [SE65] 人民网河南频道（转河南日报）《中国共产党河南省第十一届委员会第十一次全体会议公报》，2026-08-04，http://henan.people.com.cn/n2/2026/0804/c351638-41658137.html\n- [SE66] 河南省地方金融监督管理局（转载河南日报）《王凯主持召开省政府常务会议 传达贯彻省委十一届十一次全会精神》，2026-08-04，https://www.hnswjrb.gov.cn/2026/08-04/3655074.html （转载；页面经搜索引擎检索核验标题与日期，正文抓取受限，细节以SE67同稿互证）\n- [SE67] 商丘新闻网（转载河南日报客户端）《王凯主持召开省政府常务会议 传达贯彻省委十一届十一次全会精神》，2026-08-04，http://www.sqxww.com/news/zhengwu/300935.html （转载；与SE66同稿）\n- [SE68] 洛阳市人民政府网（转载河南日报）《王凯在洛阳调研城市更新工作》，2026-08-06，https://www.ly.gov.cn/2026/08-06/1077906.html （转载；调研日期2026-08-05）\n- [SE69] 河南省政协网（转河南日报）《刘宁王凯在郑州市督导调研防汛备汛工作时强调 绷紧防汛安全之弦 守牢安全生产底线 坚决维护人民群众生命财产安全》，2026-08-08，https://www.hnzx.gov.cn/2026/08-08/4369356.html （转载）\n- [SE70] 新华网河南频道（转河南日报）《刘宁王凯在郑州市督导调研防汛备汛工作》，2026-08-09，http://ha.news.cn/20260809/eb74b222d705450d9248b9713a630a63/c.html （转载；与SE69同稿）\n- [SE71] 新华网（新华社郑州8月8日电）《河南发布农田渍涝灾害风险预警》，2026-08-08，https://www.news.cn/20260808/62991c3c86bc4f61aade72f6612d3606/c.html\n- [SE72] 中国农业农村信息网（农业农村部种植业管理司）《农业农村部召开全国秋粮生产现场推进会 强调统筹抓好田间管理和农业防灾减灾救灾》，2026-08-03，https://www.agri.cn/zx/nyyw/202608/t20260803_8861026.htm\n- [SE73] 新华网河南频道（来源大河健康报）《全民健身日：从\"会运动\"到\"懂健康\"》，2026-08-08，http://www.ha.xinhuanet.com/20260808/a4c263d9b4f1448cac8aaea333220789/c.html （转载）\n- [SE74] 郑州日报（新华网河南频道转载）《河南高招录取今起开始 今年至少进行5次征集志愿》，2026-07-08，http://ha.news.cn/20260708/e5542255862d43beb5436f239f0c126d/c.html （转载；取其批次时间表作为8月5—7日录取、8月8日征集志愿的依据）\n- [SE75] 河南省政协网《河南政协\"每日要闻速览\"（8月7日）》，2026-08-07，https://hnzx.gov.cn/2026/08-07/4369348.html （载8月7日省委常委会会议信息及第18个全民健身日背景）\n- [SE76] 华禹教育网（转河南省教育考试院）《河南：关于普通高职（专科）批再次征集志愿的通知》，2026-08-10，http://huaue.com/gkao2026/2026810101241.htm （转载；属下一周期节点，仅作衔接引用）\n\n## 关联专题\n\n- [[W05]]\n- [[W04]]\n- [[P01]]\n- [[D08]]\n-\n", "W07-周报-2026-08-16.md": "\n# W07 · 河南时政周报（2026-08-10 — 2026-08-16）\n\n## ⚡ 快速知识卡\n\n\n本周（8月10—16日）河南时政被一条主线贯穿：台风“白海豚”残余环流带来的强降雨及全省应对。8月10日13时省防指启动防汛四级应急响应；11—12日中东部暴雨到大暴雨、平顶山和洛阳局地特大暴雨；12日国家防总、应急管理部将河南响应由四级提升至三级；随后全省转入“排涝、防倒伏、防病虫害”秋粮抢救阶段——截至13日投入农机具2.9万余台、排除农田积水21万亩；16日11时省防指调整响应等级，仅许昌、漯河、周口维持四级，完成“预警—响应—抢险—退出”闭环，构成深度案例。非防汛线：高招专科批再次征集志愿（136所高校）收官；河南10条公路入选全国“2026年度美丽公路”。考法以常识（响应等级时间线、台风生命周期）与案例分析（跨部门协同、灾后农业管理）为主。\n\n## 📖 本周要闻十条\n\n### 1. 8月10日省防指启动防汛四级应急响应\n\n8月10日9时30分，河南省气象台发布暴雨黄色预警：预计10日14时至11日14时，郑州东南部、开封南部、商丘、平顶山东部、许昌、漯河、周口、南阳东部、驻马店、信阳部分县（市、区）有暴雨，其中商丘东部、平顶山东部、周口、南阳东部、驻马店、信阳部分县（市、区）有大暴雨，局地特大暴雨（个别点200到300毫米），并伴有短时强降水（最大小时降水量60到100毫米）、局地雷暴大风（8到10级）等强对流天气。经会商研判，根据《河南省防汛应急预案》有关规定，省防指决定于8月10日13时启动防汛四级应急响应，要求聚焦水库、河道堤防、南水北调、高速公路等重点部位落实巡查防守，紧盯涵洞、隧道、地铁、地下空间、漫水路面等薄弱环节，突出景区、学校、养老机构、医疗机构、施工营地等重点场所提前组织避险转移。（来源[SE77]）\n\n### 2. 台风\"白海豚\"登陆减弱，残余环流持续影响河南\n\n今年第13号台风\"白海豚\"于8月9日17时30分前后以强台风级在浙江台州玉环沿海登陆（W06周报已作备汛铺垫），随后深入内陆持续减弱。8月11日8时，减弱为热带风暴级的\"白海豚\"中心位于湖北黄冈境内；河南省气象台首席预报员介绍，台风在鄂豫皖交界处与西风带系统结合，预计11日至12日河南有强风雨天气，并伴有短时强降水、雷暴大风等强对流天气。中国气象局8月11日8时处于台风、暴雨、强对流二级应急响应。此条考点在于\"台风本体登陆不等于影响结束\"——残余环流与冷空气结合反而制造更大范围降雨。（来源[SE85][SE86]）\n\n### 3. 8月11日—12日河南中东部暴雨到大暴雨，国家防总将河南响应提升至三级\n\n8月11日，河南省中东部等地出现暴雨或大暴雨，平顶山、洛阳等局地特大暴雨。据气象部门预报，12日至15日黄淮中西部和南部、华北南部等地有暴雨或大暴雨，河南中部和西部沿山等地部分地区有特大暴雨。国家防总、应急管理部12日将针对河南省的防汛四级应急响应提升至三级；同日中央气象台继续发布暴雨橙色预警，水利部召开专题会商会研判\"白海豚\"残余环流影响（其时台风虽已停止编号，残余环流仍持续影响淮河流域西部南部、黄河中游小花区间等）。[存疑：据非白名单聚合页面检索，河南省防指亦于8月12日将省级响应提升至二级，未检索到白名单媒体的直接报道原文，暂不采信为正文事实]。（来源[SE78][SE85]）\n\n### 4. 农业农村部、中国气象局8月10日继续发布农田渍涝风险预警：河南中北部风险很高\n\n8月10日，农业农村部和中国气象局继续发布农田渍涝风险预警：受台风\"白海豚\"残余环流和北方降雨系统共同影响，10日至15日河南等地有暴雨到大暴雨，低洼农田渍涝风险高；其中河南中北部部分地区有特大暴雨，农田渍涝风险很高。预警建议相关地区及时清沟理渠、做好排涝机具物资准备、雨后及时排涝散墒、适时喷药追肥。此条与W06第6条（8月8日豫省两部门联合预警）构成\"国家—省级\"两级预警衔接，可作跨部门、跨层级协同的连续性素材。（来源[SE80]）\n\n### 5. 全省农田排涝：40多万亩短时积水，截至8月13日已排除21万亩\n\n据河南省农业农村厅粮食作物处一级调研员8月13日介绍，8月10日以来全省有40多万亩农田出现短时积水，部分玉米地块倒伏（倒伏面积有几万亩），积水集中周口、开封、许昌、漯河、平顶山等降水量较大的市。截至8月13日下午，全省已组织投入各类农机具2.9万余台抢险排涝，累计排除农田积水21万亩；省农业农村厅派出6个专家指导组赶赴降雨量偏大的6个省辖市，市县两级约1.2万人次农技人员深入田间。专家口径：玉米等高秆作物三天之内排除积水对产量影响有限，超过一周长期积水可能造成损失。（来源[SE79]）\n\n### 6. 8月12日省农业农村厅：农业防汛救灾进入关键时期，各级部门全面进入应急状态\n\n8月12日，省农业农村厅厅长孙巍峰在相关会议中指出，农业防汛救灾已经到了关键时期，各级农业农村部门要全面进入应急状态：重点排查农田积水、沟渠堵点等情况，防止农田长时间大面积积水；发挥信息化手段作用，推动线上快速调度核查与线下快速核实处置协同联动；密切关注雨后生产恢复，组织专家和农技人员深入一线，指导应急排涝、开沟散墒、\"一喷多促\"、雨后补肥等关键措施，为夺取秋粮和全年粮食丰产丰收提供支撑。此条承接W06\"全国秋粮生产现场推进会奋战100天\"的部署，是省级层面的战时落实。（来源[SE79]）\n\n### 7. 市域样本：商丘组建33支农业防汛专业服务队，前期已疏浚沟渠1.83万公里\n\n作为本轮农田应对的市域观察样本：商丘市农业农村局8月9日联合气象部门发布农田渍涝预警，10日启动农业防汛四级应急响应、12日提升至三级，落实24小时值班值守，联动气象、水利、应急等部门会商研判；全市组建33支共198人的农业防汛专业服务队下沉一线；此前全域推进农田沟渠疏浚，累计疏通沟渠1.83万公里、修缮渠系建筑物1535座，拉网式排查加固大棚、畜禽圈舍等农业设施5720余座，储备抽水、发电、开沟设备上万台套。农技专家提出倒伏作物\"分类施策\"：轻度倾斜不强行扶正，避免根系二次损伤。（来源[SE87]）\n\n### 8. 高招收官：专科批再次征集志愿8月12日—13日填报，涉及136所高校\n\n按8月10日河南省教育考试院通知，普通高职（专科）批再次征集志愿于8月12日9:00至13日18:00填报，涉及高校136所，承接W06记录的8月8日首次征集志愿，为2026年河南高招集中录取阶段的收尾节点。至此，自7月8日启动的河南高招录取进入尾声。此条可与W01—W06的批次时间线连缀成完整考点链：7月8日启动—7月21—25日本科批—8月5—7日专科批—8月8日征集—8月12—13日再次征集。（来源[SE83]）\n\n### 9. 河南10条公路入选全国\"2026年度美丽公路\"，沿太行高速安阳段为全省唯一高速公路项目\n\n中国公路学会旅游交通工作委员会近日公布\"2026年度美丽公路\"评选结果，全国共143个项目入选，河南10条公路上榜：生态伏牛一号旅游公路栾川段石张线、淅川县环库公路、济源南山产业旅游路等6条入选农村公路类别，黄河古都一号旅游公路济源段等3条入选普通国省干线类别，沿太行高速公路安阳段（S33）入选高速公路类别、系本年度全省唯一。沿太行高速安阳段全线位于红旗渠精神发源地林州市，全长84.88公里，纵贯9个乡镇61个行政村，北接河北太行高速、南联台辉高速，2024年12月28日通车。此条可关联\"交通＋文旅＋红色资源\"复合考点。（来源[SE81][SE82]）\n\n### 10. 8月16日省防指调整防汛应急响应等级：许昌、漯河、周口调为四级，其他省辖市终止响应\n\n8月16日，据省应急管理厅\"河南应急\"公众号消息：台风\"白海豚\"对河南省的影响已结束，大范围降雨过程已停止，河道、水库水位明显下降，各地险情得到有效控制，经会商研判，按照《河南省防汛应急预案》有关规定，省防指决定自8月16日11时将针对许昌市、漯河市、周口市的防汛应急响应等级调整为四级，其他省辖市（区）终止防汛应急响应；同时要求严密防范地质灾害滞后性风险，及时开展雨后复查，围绕退水期堤防坍塌、滑坡等风险严格落实堤防巡查防守，加快城乡、农田排涝，认真查灾、核灾、报灾。（来源[SE84]）\n\n## 📖 深度案例：从四级到终止——河南应对台风\"白海豚\"残余环流的七天闭环\n\n**主体与事件**：河南省防汛抗旱指挥部（省防指）及各成员单位、各省辖市。台风\"白海豚\"8月9日登陆浙江后深入内陆减弱停编，但其残余环流与冷空气结合，8月10日至15日给河南带来持续强降雨；省防指8月10日13时启动防汛四级响应，8月16日11时调整降级，历时约六天完成一个完整的应急响应周期。（来源[SE77][SE78][SE84]）\n\n**背景与问题**：本轮降雨有三个放大风险的因素。其一，雨带叠加：台风残余环流本就携带充足水汽，遇太行山、伏牛山地形抬升增幅，且与北方降雨系统结合，中央气象台8月10日预警\"河南中北部部分地区有特大暴雨，农田渍涝风险很高\"（[SE80]）。其二，前期土壤偏湿：W04—W05周期刚经历\"抗旱保秋\"，8月上旬高温伏旱与局地降雨使部分地块土壤饱和，旱涝急转。其三，秋粮在田：夏玉米普遍进入灌浆期，植株高大、重心上移，抗逆性下降，是决定粒重和产量的关键窗口。核心问题：一个近亿人口、秋粮在田的农业大省，如何在台风\"本体已走\"的麻痹风险下，对\"残余环流＋冷空气\"这种非典型致灾源保持足够响应强度。\n\n**做法与机制（四个环节）**：一是\"分级递进响应\"。8月10日省气象台暴雨黄色预警后省防指当日启动四级响应；11—12日雨情证实极端性（中东部暴雨大暴雨、平顶山洛阳局地特大暴雨）后，国家防总12日将针对河南的响应提升至三级，形成\"省级预警先手、国家层面加码\"的层级联动（[SE77][SE78]）。二是\"农田风险的专业化转译\"。农业农村部与中国气象局连续发布农田渍涝风险预警，把气象预报直接转译为\"低洼农田渍涝风险高/很高\"的分区分级表述；省级层面8月8日两部门联合预警（W06已述）与国家预警衔接，市县再落到具体地块（商丘8月9日发布、10日启动响应）（[SE80][SE87]）。三是\"到田到机具的抢险动员\"。截至8月13日全省投入农机具2.9万余台、排除积水21万亩，6个省级专家指导组赴重灾市，商丘单市即有33支198人专业服务队；技术路线清晰——\"排、扶、补、防\"四字法：抢排积水、倒伏分类处置（轻度不扶）、补施速效肥与\"一喷多促\"、防南方锈病等雨后高发病害（[SE79][SE87]）。四是\"退出机制与灾后管理并重\"。8月16日降级终止的同时，省防指明确要求防范地质灾害滞后性风险、退水期堤防巡查、查灾核灾报灾——把\"响应终止\"定义为\"灾后管理开始\"而非工作结束（[SE84]）。\n\n**成效与数据（区分已完成与持续中）**：截至8月13日下午可确认的已完成数据：投入农机具2.9万余台，排除农田积水21万亩，全省短时积水面积约40多万亩、倒伏几万亩（初步统计口径）；商丘前期疏浚沟渠1.83万公里、修缮渠系建筑物1535座、加固农业设施5720余座。专家评估\"短时积水（三天以内）对产量影响有限\"。整个降雨过程的人员伤亡、直接经济损失等灾情数据本周内未检索到白名单媒体发布的汇总数字，不作引用；8月16日降级后各地排涝、核灾仍在进行，属持续中事项。（来源[SE79][SE84][SE87]）\n\n**局限与观察点**：其一，非典型致灾源的认知难度——台风8月11日减弱、停编后，公众与基层易产生\"影响已过\"的松懈，而残余环流降雨的极端性恰恰在登陆之后显现，这对预警传播和\"叫应\"机制提出更高要求。其二，农田排涝的\"最后一公里\"依赖千家万户自组织与机具调度，低洼地块、断头沟是历年短板，商丘\"两年前提前疏浚\"的经验反证了平时投入的稀缺性。其三，灾情数据发布滞后于抢险节奏，查灾核灾的准确性直接影响后续救灾资金与保险理赔，退水期的时间窗口内如何平衡\"快报\"与\"核准\"值得跟踪。（来源[SE79][SE84]）\n\n**可迁移点与评价**：其一，\"预警—响应—抢险—退出\"四段式可作为应急管理类案例的通用分析框架，本周河南案例链条完整、节点清晰，适合直接引用。其二，\"国家—省—市\"三级预警与响应的传导（国家三级响应与省级响应叠加）是央地协同（对应A05、A02专题）的鲜活素材。其三，倒伏作物\"分类施策、避免盲目扶正造成二次伤害\"体现精准治理思维，可迁移到政策执行\"精细化\"议题。其四，与W06深度案例（临灾备汛）对照，两周构成\"备—战—复\"完整叙事，答题时可用\"上周的五个现场会要求，本周都变成了田间地头的抽水泵\"这类实证句式。（来源[SE77]—[SE87]）\n\n**可考角度**：常识——防汛应急响应四级至一级的等级序列与启动主体、\"一喷多促\"含义、台风生命史概念；案例分析——河南如何应对\"台风停编后\"的残余环流极端降雨；材料写作——从\"宁可十防九空\"到\"退水不退责\"：一场跨越两周的防汛答卷。\n\n**金句（适用主题：应急治理、粮食安全、基层落实）**：\n1. 台风走了，警报不能走；雨停了，责任不能停。\n2. 响应升级看雨情，响应降级看险情，核灾报灾看民情。\n3. 排涝抢的是三天窗口，丰收保的是全年盘子。\n\n## 复盘与下周关注\n\n- 下周关注：全省查灾核灾与灾后恢复重建动态、省级层面的灾情汇总发布；秋粮\"一喷多促\"集中作业与南方锈病防控进展；许昌、漯河、周口四级响应的退出时点；省委十一届十一次全会精神与下半年经济部署的落实动态；高招录取全面收官后各省辖市录取数据发布。\n\n## 来源与证据\n\n- [SE77] 大河网（中新网河南转载）《河南启动防汛四级应急响应》，2026-08-10，http://www.ha.chinanews.com.cn/news/hnxw/2026/0810/70115.shtml （转载大河网，记者王怡潇）\n- [SE78] 新华网（新华社北京8月12日电）《国家防总、应急管理部对河南启动防汛三级应急响应》，2026-08-12，https://www.news.cn/20260812/340d190f0d1c4119bc305281f15951ba/c.html\n- [SE79] 央广网（总台中国之声《新闻纵横》）《河南各地抓紧排除农田积水 最大限度减轻强降雨对农业生产的影响》，2026-08-14，https://china.cnr.cn/yaowen/20260814/t20260814_527761927.shtml\n- [SE80] 中国经济网（转中央气象台网站）《农业农村部和中国气象局继续发布农田渍涝风险预警》，2026-08-10，http://www.ce.cn/xwzx/gnsz/gdxw/202608/t20260810_3139184.shtml （转载）\n- [SE81] 河南日报（中共河南省委宣传部党建网转载）《跻身全国美丽公路标杆行列 沿太行高速公路安阳段究竟有多美》，2026-08-10，http://www.hnswxcb.com/2026/08-10/465461.html （转载）\n- [SE82] 河南交通投资集团网站《沿太行高速公路安阳段入选2026年度美丽公路项目展示交流活动名单》，2026-08-05，https://www.hnjttz.com/new/show-68561.html\n- [SE83] 河南省教育考试院（河南日报网\"要闻\"栏目转载）《136所！8月12日9:00-13日18:00普通高职（专科）批再次征集志愿的通知》，2026-08-10，https://www.henandaily.cn/news/2026-08 （栏目列表页核验标题与日期）\n- [SE84] 河南省应急管理厅\"河南应急\"公众号（财联社新浪财经转载）《河南调整防汛应急响应等级》，2026-08-16，https://finance.sina.com.cn/jjxw/2026-08-16/doc-ininnqpu9901165.shtml （转载）\n- [SE85] 新华网（新华社北京8月11日电）《台风\"白海豚\"致强降雨 多地积极应对》，2026-08-11，https://www.news.cn/politics/20260811/4da31b6135064119a0aac25470821780/c.html\n- [SE86] 科技日报《逐渐深入内陆 多地有大风暴雨 台风\"白海豚\"最新情况》，2026-08-11，https://www.stdaily.com/web/gdxw/2026-08/11/content_562243.html\n- [SE87] 商丘市人民政府网（转商丘日报）《暴雨过后 秋粮田间咋管理》，2026-08-14，https://www.shangqiu.gov.cn/hd/hygq/content_310621 （转载）\n\n## 关联专题\n\n- [[W06]]\n- [[W05]]\n- [[D10]]\n- [[D08]]\n-\n-\n", "W08-周报-2026-08-23.md": "\n# W08 · 河南时政周报（2026-08-17 — 2026-08-23）\n\n## ⚡ 快速知识卡\n\n\n本周（8月17—23日）河南时政主线从“战时”转向“战后”：台风“白海豚”抢险取得阶段性胜利，重心转向灾后恢复重建。8月18日刘宁赴周口、漯河督导防汛和灾后重建，同日王凯主持省政府常务会议研究灾后恢复、新型储能产业；8月21日省委常委会学习《提高防灾减灾救灾能力》并研究经济工作，全省实现“无因灾死亡”、各市终止防汛四级响应，构成“应急—重建”衔接的深度案例。经济线：8月19日省统计局公布1—7月数据（规上工业增加值增7.5%、进出口增25.8%）；开放线：豫台经贸洽谈会鹤壁开幕、签约27个项目；产业线：郑州、平顶山、濮阳入选国家氢能综合应用试点；平漯周高铁转体成功；省运会在安阳开幕。考法以案例分析（灾后重建系统性）与常识（经济指标、氢能试点）为主。\n\n## 📖 本周要闻十条\n\n### 1. 8月21日省委常委会会议：学习防灾减灾救灾重要文章，研究经济工作\n\n8月21日，省委书记刘宁主持召开省委常委会会议。会议认真学习习近平总书记在纪念江泽民同志诞辰100周年大会上的重要讲话；学习贯彻习近平总书记在《求是》杂志发表的重要文章《提高防灾减灾救灾能力》，强调树牢\"四个宁可\"理念，落实预警叫应响应联动和管控措施，在毫不松懈抓好防汛的同时统筹推进\"白海豚\"台风暴雨洪水防御和灾后恢复重建，做好复工复产和就业帮扶。会议研究经济工作，要求聚焦\"1+2+4+N\"目标任务体系，着力用好政策、扩大内需，聚力建强枢纽、筑牢支点，坚决打好打赢经济发展夏秋季战役；当前正值秋粮产量形成关键时期，要加紧推进受灾地区农业生产恢复，科学开展改种补种，确保全年粮食丰产丰收。会议还部署持续深化主流媒体系统性变革。（来源[SE89]）\n\n### 2. 8月18日省政府常务会议：研究灾后恢复、新型储能产业和三部条例草案\n\n8月18日，省长王凯主持召开省政府常务会议。会议强调当前重点抓好灾后恢复：迅速组织灾情核查统计，加快排除蓄滞洪区、城市内涝、农田积水，分类实施受损住房、基础设施修复重建，加强受灾群众监测帮扶、防止因灾返贫致贫，抓紧谋划实施灾后恢复重建项目。会议传达学习国务院第十二次全体会议精神，要求抓好\"十五五\"规划落地实施、扎实推进\"六张网\"规划建设、深入实施城市更新行动。会议研究新型储能产业发展，提出坚持多元化路线布局和全产业链协同发展，培育具有特色优势的新型储能产业链群；研究《河南省内部审计条例（草案）》《河南省移动源污染防治条例（草案）》《河南省农村集体经济组织条例（草案）》。（来源[SE90]）\n\n### 3. 8月19日省统计局公布1—7月经济数据：规上工业增长7.5%，进出口增长25.8%\n\n8月19日，河南省统计局公布2026年1—7月全省经济运行情况（已完成数据）：规模以上工业增加值同比增长7.5%，其中高技术制造业增加值增长26.1%、对全省规上工业增长贡献率38.3%；锂离子电池、新能源汽车产量分别增长101.3%、32.9%。社会消费品零售总额16750.07亿元，同比增长2.6%。固定资产投资同比下降1.1%，扣除房地产开发投资后增长1.9%；高技术制造业投资增长11.5%。进出口总值6088.6亿元，同比增长25.8%，其中出口增长14.9%、进口增长47.8%。城镇新增就业83.53万人。居民消费价格同比上涨1.1%。省统计局口径指出\"稳\"的基础尚需巩固，下阶段坚决打好打赢经济发展夏秋季战役。（来源[SE91]）\n\n### 4. 前7个月增值税发票数据：工业销售收入增长9.0%，制造业增长11.0%\n\n8月20日，国家税务总局河南省税务局发布今年前7个月增值税发票数据（已完成数据）：全省工业销售收入同比增长9.0%，制造业销售收入增长11.0%，其中计算机通信和其他电子设备制造业、电气机械和器材制造业分别增长42.8%、20.1%；高技术制造业销售收入增长36.0%；住宿餐饮业销售收入增长7.2%，文化艺术业增长23.2%。高技术产业购进与固定资产投资密切相关的机械设备建筑服务不动产金额同比增长37.8%。此条与第3条统计局数据构成\"税务发票数据—统计核算数据\"的交叉印证素材，可考\"用微观交易数据观察宏观经济\"的方法论角度。（来源[SE92]）\n\n### 5. 8月18日刘宁赴周口漯河督导灾后重建：从抢险转向重建\n\n8月18日，省委书记刘宁到周口市、漯河市督导调研防汛和台风\"白海豚\"强降雨灾后重建工作，察看沙颍河茅窝险工、西华县大王庄镇积水农田、舞阳县泥河洼滞洪区纸房退水闸和北舞渡镇中心学校群众安置点，要求抢抓时机加快排涝、落实开沟散墒、\"一喷多促\"、雨后补肥等措施，因地制宜开展汛后农作物改种补种，多措并举力促\"减产不减收\"。刘宁指出全省防指系统调度下，抢险救灾取得阶段性胜利，要把工作重心逐渐转向统筹推进灾后恢复重建，全域防疫消杀、分批回迁、复工复产和就业帮扶；同时强调目前仍处于主汛期，坚持依法科学防汛。（来源[SE93]）\n\n### 6. 8月19日省运会在安阳开幕：设30个大项759个小项，首次设冬季项目\n\n8月19日晚，河南省第十五届运动会暨第九届残疾人运动会在安阳市文体中心开幕，省委书记刘宁宣布开幕，省长王凯致开幕词，邓亚萍点燃主火炬。本届省运会由省政府主办，设青少年竞技组、学生组、社会组3个组别，其中青少年竞技组设30个大项759个小项，是设置项目最多的一届，并首次设置冬季运动项目；省残运会设15个大项、370个小项，9月10日开赛、9月17日闭幕。开幕式文体展演《鼎立中原谱新篇》以甲骨文、青铜器、红旗渠精神为元素。此条可关联\"体育＋文旅＋城市营销\"复合考点。（来源[SE94]）\n\n### 7. 河南污染防治\"成绩单\"：优良天数增量居全国第一\n\n8月19日，省政府新闻办召开新闻发布会介绍污染防治攻坚成果：截至8月18日，全省今年优良天数同比增加22.5天，增量居全国第一；重污染天数2天，位次前移5位。截至今年7月底，147个国控断面水质Ⅲ类及以上占比达87.1%，同比提升9.5个百分点，位列全国第三；黄河水连续6年保持Ⅱ类，丹江水稳定保持在Ⅱ类及以上标准。今年以来立案4465件、同比上升28.4%，行刑衔接110件。全省42个县（市、区）完成美丽乡村建设任务，周口市淮阳区入选全国第一批美丽乡村先行区名单；力争2026年年底基本消除存量农村黑臭水体（目标值）。（来源[SE95]）\n\n### 8. 郑州平顶山濮阳入选国家氢能综合应用试点，黄河几字弯—中原城市群为五大试点之一\n\n记者8月20日获悉，工业和信息化部、财政部、国家发展改革委同意在京津冀、大湾区、东北（含蒙东）—长三角、新疆—成渝、黄河几字弯—中原等5个城市群开展氢能综合应用试点，河南郑州市、平顶山市、濮阳市入选。黄河几字弯—中原城市群以鄂尔多斯、郑州为\"双核\"，构建\"双核引领、双轴串联、多极联动\"空间布局；试点目标为通过4年建设推动氢气累计用量超90万吨（目标值），预计带动万亿级产业投资。平顶山已建成投产亚洲首个150万标准立方米盐穴储氢示范工程。此条承接\"新质生产力\"\"能源转型\"主线，可作产业政策布局类常识与案例素材。（来源[SE96]）\n\n### 9. 平漯周高铁成功跨越郑阜高铁，雄商高铁河南段进入运行试验\n\n8月20日凌晨，平漯周高铁站前九标郑阜上行联络线特大桥2×100米T构转体连续梁完成精准转体，成功跨越郑阜高铁干线。该转体梁全长201.5米、总重约1.5万吨，施工仅用40分钟完成25度转体就位。平漯周高铁是国家\"八纵八横\"高铁网重要联络通道，全长199.7公里、设计时速350公里，计划2027年年底建成通车（目标值）。同期雄商高铁河南段已进入运行试验阶段，向今年9月通车目标冲刺；焦济洛平高铁\"焦平一号\"盾构机始发，为世界最大直径土压平衡盾构高铁隧道。\"十五五\"期间河南将建成雄商、平漯周、焦济洛平、南信合等多条高铁。（来源[SE97]）\n\n### 10. 2026豫台经贸洽谈会在鹤壁开幕，签约项目27个\n\n8月21日，2026豫台经贸洽谈会暨两岸智能装备制造对接活动在鹤壁开幕，两岸企业家峰会大陆方面理事长郭金龙、台湾方面理事长刘兆玄出席并致辞。本次大会由国务院台办、省政府共同主办，共签约项目27个，涉及人工智能、电子信息、装备制造等领域（已完成口径）。8月20日刘宁会见了活动重要嘉宾和台商代表。此条可关联\"对台工作＋招商引资＋内陆开放高地\"复合考点，与第3条外贸数据、信阳港固始港区建设共同构成河南开放型经济的周内观察切片。（来源[SE98]）\n\n### 补充要点：三条国家级骨干流通走廊落子河南；信阳港固始港区冲刺9月底开港\n\n国家现代流通体系建设\"十五五\"规划明确，经过河南的\"国字头\"重要商品骨干流通走廊有三条：晋冀鲁豫大宗商品走廊、全国棉花棉纱走廊、豫皖苏浙大宗商品走廊，河南成为全国唯一参与三条国家级重要商品骨干流通走廊建设的省份；此前国家布局的102个现代流通战略支点城市中河南已有郑州（综合型）、洛阳（复合型）、南阳、商丘（功能型）4市入选（来源[SE99]）。8月22日报道，信阳港固始港区中心作业区一期总投资12.6亿元、18个泊位、设计年吞吐量1062万吨，8月底基本完工、预计9月底开港运营（目标值），将与信阳港·淮滨中心港形成淮河港口\"双雄\"（来源[SE100]）。\n\n## 📖 深度案例：从抢险到重建——河南灾后恢复重建的\"转段\"一周\n\n**主体与事件**：河南省委、省政府及周口、漯河等受灾市县。8月16日省防指调整防汛应急响应等级后，8月17—23日全省一周内完成从\"抢险救灾\"到\"恢复重建\"的工作重心转换：8月17日副省长李酌赴许昌调研农业灾后恢复；8月18日刘宁赴周口漯河督导、王凯主持省政府常务会议部署灾后恢复；8月21日省委常委会会议学习《提高防灾减灾救灾能力》并作出统筹部署；8月23日《河南日报》确认\"全省实现无因灾死亡、所有城市均终止防汛四级应急响应\"。（来源[SE89][SE90][SE93]）\n\n**背景与问题**：本轮任务接续W07记录的\"白海豚\"残余环流强降雨。抢险阶段的胜利成果（无因灾死亡、险情有效控制）并不自动等于灾后无忧——退水期堤防坍塌、农田积水反排、受灾群众安置回迁、因灾返贫风险、企业复工复产安全等一系列次生问题集中在同一时间窗口。核心问题：一个刚经历流域性洪涝的农业大省，如何在主汛期尚未结束的前提下，把工作重心安全地\"切换\"到重建，做到\"重建不漏防汛、救灾不误秋粮\"。\n\n**做法与机制（四个环节）**：一是\"领导一线转段\"。8月17—18日，省委书记、省长、副省长分赴许昌、周口、漯河等重灾市，把\"督导调研\"变成现场办公——刘宁在泥河洼滞洪区要求针对管涌、渗水预置抢险力量，做到险情抢早抢小；李酌在许昌主持省市县乡村五级干部座谈会听取恢复生产意见（[SE93]）。二是\"会议系统部署\"。省政府常务会议把灾后恢复拆解为灾情核查统计、转移避险群众服务保障、排涝除渍、受损住房与基础设施分类修复、环境清理消杀、复工复产安全等具体事项，并同步研究灾后恢复重建项目谋划，把\"应急\"延伸为\"工程\"（[SE90]）。三是\"农业抢救优先\"。正值秋粮产量形成关键期，省里明确\"田间排涝—改种补种—一喷多促—定损理赔\"链条，要求农业保险机构应赔尽赔、早赔快赔，聚焦独居老人、特困人员等特殊群体走访排查，把粮食安全和防止因灾返贫两条底线同时守住（[SE90][SE93]）。四是\"能力建设跟进\"。省委常委会会议学习《提高防灾减灾救灾能力》，要求强化源头管控、夯实基层基础、坚持党政共管，把抗洪救灾的斗争精神转化为高质量发展高效能治理的动能——用\"制度复盘\"承接\"实战检验\"（[SE89]）。\n\n**成效与数据（区分已完成与目标值）**：可确认的已完成口径：全省实现\"无因灾死亡\"；所有城市均终止防汛四级应急响应；抢险救灾取得阶段性胜利（[SE93]）。8月17—23日周内具体排涝面积、受损房屋修缮数量、保险已赔付金额等重建进度数据，本周未检索到省直部门发布的汇总数字，不作引用。农业恢复方面，改种补种、\"一喷多促\"等为正在推进事项；灾后恢复重建项目谋划属部署安排（目标性表述）。（来源[SE89][SE90][SE93]）\n\n**局限与观察点**：其一，主汛期未过与重建并行的资源张力——预案、队伍、物资既要保障在建工程，又要应对后续降雨，退水期堤防安全是当前最大风险点。其二，\"减产不减收\"目标高度依赖改种补种的农时窗口与保险理赔速度，定损标准、赔付时效的执行差异是基层矛盾易发环节。其三，因灾返贫监测与W04—W05周期的抗旱投入叠加，受灾县财政承受能力值得关注。（来源[SE90][SE93]）\n\n**可迁移点与评价**：其一，\"应急响应终止—工作重心转段—能力建设复盘\"三段式，可与W07\"预警—响应—抢险—退出\"闭环拼接成完整的\"防汛全周期\"分析框架，两周素材直接互证。其二，\"会议部署＋一线督导＋制度复盘\"组合体现省级治理\"闭环管理\"，可迁移到安全生产、公共卫生等应急管理议题。其三，把灾后重建与\"防止因灾返贫\"衔接，对应防返贫监测帮扶专题（D10），是\"底线思维\"的具体化素材。（来源[SE89][SE90][SE93]）\n\n**可考角度**：常识——防汛应急响应等级与退出条件、《提高防灾减灾救灾能力》刊发平台、\"四个宁可\"；案例分析——河南如何组织台风灾害后的恢复重建转段；材料写作——从\"守住生命防线\"到\"重建美好生活\"：一场灾害治理的两章答卷。\n\n**金句（适用主题：应急治理、防灾减灾、基层落实）**：\n1. 响应终止不是终点，重建转段才是答卷的下一页。\n2. 排涝抢的是农时，重建谋的是长远，复盘固的是机制。\n3. 减产不能减收，受灾不能返贫——底线思维要落到每一户。\n\n## 复盘与下周关注\n\n- 下周关注：省灾情汇总与灾后恢复重建项目清单发布；秋粮\"一喷多促\"与改种补种进度；雄商高铁通车时点（9月目标）；信阳港固始港区开港（9月底目标）；残运会9月10日开赛；氢能试点城市实施方案落地。\n\n## 来源与证据\n\n- [SE89] 河南日报 大象新闻（河南省人民政府网转载）《省委常委会召开会议 刘宁主持并讲话》，2026-08-21，https://www.henan.gov.cn/2026/08-21/3401536.html\n- [SE90] 河南政府网 大象新闻（河南省人民政府网）《王凯主持召开省政府常务会议》，2026-08-18，https://www.henan.gov.cn/2026/08-18/3400356.html\n- [SE91] 大河网（河南省人民政府网转载）《向新向优！河南1-7月经济运行情况公布》，2026-08-19，https://www.henan.gov.cn/2026/08-19/3400528.html\n- [SE92] 河南日报（河南省人民政府网转载）《制造底盘稳 消费引擎热——从1—7月增值税发票数据看全省经济运行态势》，2026-08-21，https://www.henan.gov.cn/2026/08-21/3401157.html\n- [SE93] 河南日报 大象新闻（河南省人民政府网转载）《刘宁到周口漯河督导调研防汛和灾后重建工作时强调 有力有序推进灾后恢复重建工作 加快防灾减灾救灾能力整体提升》，2026-08-18，https://www.henan.gov.cn/2026/08-18/3400359.html\n- [SE94] 河南日报 大象新闻（河南省人民政府网转载）《河南省第十五届运动会暨第九届残疾人运动会在安阳开幕 刘宁宣布开幕 王凯致开幕词》，2026-08-19，https://www.henan.gov.cn/2026/08-19/3400739.html\n- [SE95] 河南日报（河南省人民政府网转载）《河南污染防治亮出成绩单 优良天数增量居全国第一》，2026-08-20，https://www.henan.gov.cn/2026/08-20/3400769.html\n- [SE96] 河南日报（河南省人民政府网转载）《河南三市跻身国家氢能应用试点》，2026-08-23，https://www.henan.gov.cn/2026/08-23/3401578.html\n- [SE97] 河南日报（河南省人民政府网转载）《平漯周高铁成功跨越郑阜高铁 河南高铁建设持续提速》，2026-08-21，https://www.henan.gov.cn/2026/08-21/3401154.html\n- [SE98] 河南政府网（河南省人民政府网）《2026豫台经贸洽谈会暨两岸智能装备制造对接活动开幕 郭金龙出席并致辞》，2026-08-22，https://www.henan.gov.cn/2026/08-22/3401552.html\n- [SE99] 河南日报（河南省人民政府网转载）《三条\"国字头\"骨干流通走廊落子河南 连廊成网 流通中原》，2026-08-17，https://www.henan.gov.cn/2026/08-17/3399491.html\n- [SE100] 河南日报（河南省人民政府网转载）《信阳港固始港区中心作业区加力冲刺迎开港 豫货\"通江达海\"再添深水良港》，2026-08-22，https://www.henan.gov.cn/2026/08-22/3401550.html\n\n## 关联专题\n\n- [[W07]]\n- [[W06]]\n- [[P01]]\n- [[D11]]\n- [[D12]]\n", "W09-周报-2026-08-30.md": "\n# W09 · 河南时政周报（2026-08-24 — 2026-08-30）\n\n## ⚡ 快速知识卡\n\n本周（8月24—30日）河南处\"灾后重建＋新一轮防汛\"双线并行：8月26日全省防汛专题调度会议召开，刘宁主持，针对台风\"沙德尔\"部署秋汛防范，要求以防汛工作确定性应对风雨不确定性；8月28日省委常委会贯彻防灾减灾\"七个坚持\"，并研究社会工作与纪检监察；8月30日省委财经委员会部署\"夏秋季战役\"。开放线：8月26日第三届中欧班列（郑州）博览会开幕，全国首列中老泰图定快速班列、首列南通道中欧班列（郑州—巴库）提单班列同日首发；郑州片区入选国家数字贸易示范区首批创建试点。产业线：8月25日河南首场省级具身智能产业对接活动发布30项应用场景需求。考法以案例分析（防汛持久战）与常识（班列、数字贸易）为主。\n\n## 📖 本周要闻十条\n\n### 1. 8月26日全省防汛专题调度会议：部署台风\"沙德尔\"防范和灾后复工复产\n\n8月26日，全省防汛专题调度会议在省应急指挥部召开，省委书记刘宁主持并讲话，省长王凯出席并作部署。刘宁指出，当前河南仍处于主汛期，台风\"沙德尔\"路径变化大、风雨影响范围不确定性大，防汛防台风面临变数多、战线长、风险高的挑战；要贯彻落实习近平总书记关于防灾减灾救灾工作\"七个坚持\"重大要求，在做好台风\"白海豚\"防范应对工作基础上，继续锚定\"不死人、少损失\"目标。会议部署四方面：一是加强加密天气水文预警预报，坚决打好防汛度汛持久战、主动仗；二是紧盯重点部位开展排险除患，严守重点河道、水库塘坝，保障南水北调中线工程供水安全水质安全；三是加紧复工复产，加快推进救助资金发放、灾后重建项目，强化灾后田间管理，力争以丰补歉夺取秋粮丰收；四是坚持防汛与抗旱并重，严格落实党政同责等责任制度。（来源[SE101]）\n\n### 2. 8月28日省委常委会会议：落实\"七个坚持\"，研究社会工作与纪检监察工作\n\n8月28日，省委书记刘宁主持召开省委常委会会议。会议学习贯彻习近平总书记对西藏日喀则市吉隆县泥石流灾害的重要指示精神，强调当前正处防汛关键期，要聚焦南水北调中线工程、尾矿库、大中小水库、河道堤防、城市易涝点等重点部位持续开展拉网式隐患排查整治，扎实做好秋汛防范应对，确保应转尽转、应转快转，严格执行24小时值班值守和领导带班制度。会议传达学习二十届中央纪委六次全会精神，要求持续健全\"两个责任\"贯通协同机制，深化群众身边不正之风和腐败问题集中整治。会议研究全省社会工作，强调深化党建引领基层高效能治理，扎实推进\"五基四化\"，加强新就业群体服务保障，深入推进信访工作法治化。会议与省委社会治理工作领导小组会议合并召开。（来源[SE102]）\n\n### 3. 8月30日省委财经委员会会议：坚决打好打赢经济发展夏秋季战役\n\n8月30日，省委书记、省委财经委员会主任刘宁主持召开省委财经委员会会议，省长、省委财经委员会副主任王凯出席。会议强调，要聚焦\"1+2+4+N\"目标任务体系，坚持抓扭提用力、逆跨顺用策、准实效用心。具体部署：大抓项目推动投资加快止跌回稳，扎实推进\"六张网\"规划建设，统筹政府投资和民间投资；发挥优势促进消费潜能加速释放，纵深推进融入服务全国统一大市场建设，推广胖东来、蜜雪冰城等企业先进经验，打造消费新场景；分类施策培育产业新动能，深入实施\"人工智能+\"行动、\"数据要素×\"行动，夯实秋粮稳产丰产基础；深化重点产业链产融对接，引导金融机构做实金融\"五篇大文章\"，加强存量政策和增量政策集成释放。（来源[SE104]）\n\n### 4. 8月26日第三届中欧班列（郑州）博览会开幕，两趟\"全国首列\"班列双线齐发\n\n8月26日，第三届中欧班列（郑州）博览会在郑州航空港区中原国际会展中心开幕。这是全国唯一经国铁集团中欧班列品牌授权、商务部备案的中欧班列主题国家级专业展会，总展览面积2万平方米，汇聚500余家行业龙头企业，万余名专业观众参会。与开幕式同步，两趟\"全国首列\"班列从郑州国际陆港驶出：一是全国首列中老泰图定快速班列，满载汽车零配件经磨憨口岸出境直抵泰国林查班，全程运行5—6天，比一般班列缩短2—3天；二是全国首列南通道中欧班列（郑州—巴库）提单班列，搭载55组集装箱、货值约236万美元驶向阿塞拜疆巴库，创新融合CIFA国际多式联运提单与铁路货运单证，打通联合国NCD（可转让货物单证公约）规则实战应用场景，实现\"一单到底、全程可溯、金融赋能\"。截至目前中欧班列（郑州）累计开行量突破1.9万列，今年前7个月河南对东盟进出口836.3亿元、增长28.9%（已完成数据）。（来源[SE105]）\n\n### 5. 郑州片区入选国家数字贸易示范区首批创建试点\n\n8月26日记者获悉，中国（河南）自由贸易试验区郑州片区入围国家数字贸易示范区首批创建试点，是河南唯一入选单位，也是全国73个自贸片区中两个上榜片区之一。今年我国首次启动数字贸易示范区申建，开展不低于两年的创新培育。该片区自2017年挂牌以来累计形成426项制度创新成果，其中60项全国首创、125项全省首创，13项数字贸易领域创新案例在全国复制推广；首创的\"1210\"保税备货模式被世界海关组织收录为全球跨境电商参考监管范式，并打造全国首个农业数字流通跨境消费服务平台\"郑数登\"。此条承接\"制度型开放＋数字经济\"复合考点，与第4条班列开放共同构成河南开放型经济周内观察切片。（来源[SE106]）\n\n### 6. 8月25日河南首场省级具身智能产业对接活动举行：发布30项应用场景需求\n\n8月25日，河南省具身智能产业对接活动在郑州航空港经济综合实验区举行，这是河南首场省级层面的具身智能产业对接活动，吸引智元创新、云深处、优理奇及本土汉威科技、鸿元轴承等60多家具身智能上下游企业、场景需求企业参会。活动发布30项具有代表性的应用场景需求。参会企业认为，河南发布具身智能产业需求清单，将推动产业\"今年概念验证、明年小批量应用、后年规模化应用\"。此条与W08氢能试点、\"人工智能+\"行动呼应，可作新质生产力、产业政策布局类素材。（来源[SE107]）\n\n### 7. 8月25日河南省民政行业职业技能大赛开幕：240余名选手竞技养老护理等4赛项\n\n8月25日，2026年河南省民政行业职业技能大赛暨第二届全国民政行业职业技能大赛河南省选拔赛在郑州开幕，由省民政厅、省人社厅、省总工会联合主办，来自全省17个省辖市及济源示范区、郑州航空港区的240余名选手参赛。大赛设养老护理员、孤残儿童护理员、殡仪服务员、遗体防腐整容师4个赛项，8月28日闭幕，综合成绩靠前选手将入选省代表队，备战10月中下旬在郑州举行的全国决赛。省民政厅介绍，河南累计培养民政技能人才10万余人，养老护理领域创建21个省级培养基地、累计培训40万余人次（已完成口径）。此条可关联\"人人持证、技能河南\"与养老服务人才考点。（来源[SE108]）\n\n### 8. 8月24日《河南日报》聚焦濮阳金慧数谷：\"数据标注+AI文创\"双轮驱动\n\n8月24日《河南日报》报道，濮阳\"金慧数谷\"数智园区已推进建设到第二期，总建筑面积约3万平方米，由返乡发展的濮阳籍青年团队运营，业务涵盖互联网客服、IT服务、高端数据标注、AI解决方案等。数谷规划AI数据职场、自主算力中心、AIGC研发实验室、数字直播基地等六大功能板块，构建\"数据标注+AI文创\"双轮驱动格局；运营方金慧科技落地濮阳4年多，一期二期累计总投资6亿元，建成超7000座席智能职场、现有员工5000余人，并与北京大学团队合作孵化AI漫剧，已上线三部、海外播放量均突破两千万。濮阳市近期出台数字人才队伍建设专项政策，成为河南首个出台此类政策的省辖市。此条可作县域数字经济、返乡创业案例素材。（来源[SE110]）\n\n### 补充要点：台风\"沙德尔\"动态与河南秋汛防范；灾后重建进度背景\n\n台风\"沙德尔\"于8月28日8时05分前后在浙江台州玉环沿海登陆（登陆时中心附近最大风力12级），9时10分前后在温州龙湾再次登陆，此后深入内陆、29日减弱为热带低压，强降雨主要波及浙江、福建、江西、湖南等省区；河南本周主要承担\"防秋汛、防不确定性\"的部署性任务，全省未出现\"沙德尔\"重大灾情（截至8月30日未见省级灾情通报，[存疑]——河南受影响程度无省级官方汇总数据）。（来源[SE109][SE111]）背景方面，此前周口贾鲁河117米溃口已于8月15日20时29分合龙，本周会议部署的救助资金发放、灾后重建项目、田间管理恢复均以该抢险成果为前提（来源[SE112]）。\n\n## 📖 深度案例：从\"堵溃口\"到\"防秋汛\"——河南防汛持久战的机制观察\n\n**主体与事件**：河南省委、省政府及省应急指挥部、省防指各成员单位。8月15日周口贾鲁河溃口合龙后，河南进入\"灾后恢复重建\"与\"台风'沙德尔'秋汛防范\"双线并行的持久战阶段：8月26日全省防汛专题调度会议系统部署，8月28日省委常委会会议以\"七个坚持\"再动员，8月30日省委财经委员会会议把\"以丰补歉夺取秋粮丰收、加快灾后重建项目\"纳入经济调度。（来源[SE101][SE102][SE104]）\n\n**背景与问题**：W07—W08记录的台风\"白海豚\"带来入汛以来最强暴雨，沙颍河发生2026年第1号洪水，贾鲁河东岸堤防8月13日出现最长约117米溃口，8月15日成功合龙，累计安全转移群众781人（来源[SE112]）。抢险胜利并不等于风险出清：一是\"沙德尔\"接踵而至，其路径变化大、影响不确定；二是受灾地区堤防经高水位浸泡后退水期风险上升；三是秋粮生产正处于产量形成关键期，排涝、改种补种与秋汛防范在时间上高度重叠。核心问题：一个刚经历流域性洪涝的农业大省，如何在主汛期内同时守住\"重建不漏防汛、救灾不误秋粮\"两条线。\n\n**做法与机制（三个环节）**：一是\"常态化调度＋滚动作战\"。全省防汛专题调度会议要求树牢底线思维、极限思维，加强加密天气水文预报预测，以防汛工作确定性应对风雨不确定性；紧盯河道堤防、水库塘坝、城市易涝点、南水北调中线工程等重点部位排险除患，保障\"水缸\"安全（[SE101]）。二是\"制度复盘＋责任压实\"。省委常委会会议要求落实主汛期工作机制，聚焦重点部位持续开展拉网式隐患排查整治，加强跨省市、流域上下游灾害预警协同联动，坚持防汛抗旱党政同责、一岗双责，严格执行24小时值班值守和领导带班制度，用\"以确定性应对不确定性\"的方法论承接实战经验（[SE102]）。三是\"防汛与生产统筹\"。调度会议要求加紧复工复产，加快救助资金发放和灾后重建项目，强化灾后田间管理、尽快恢复耕地地力肥力；省委财经委员会会议进一步把秋粮稳产丰产、农业保险定损理赔等纳入\"夏秋季战役\"经济调度，把防灾减灾嵌入经济工作大局（[SE101][SE104]）。\n\n**成效与数据（区分已完成与目标值）**：可确认的已完成口径——贾鲁河117米溃口于8月15日20时29分合龙、累计安全转移群众781人（[SE112]）；全省此前实现\"无因灾死亡\"（W08已核）。本周为部署周，会议提出的救助资金发放进度、灾后重建项目清单、改种补种面积等均属部署性、目标性表述，截至8月30日未检索到省级部门发布的周内汇总数字，不作引用（[存疑]）。\n\n**局限与观察点**：其一，持久战的资源张力——抢险队伍、物资在\"沙德尔\"防范与灾后重建间需再平衡，退水期堤防坍塌是最大现实风险。其二，\"以丰补歉\"目标依赖农时窗口，豫北、豫西山区土壤饱和后遇新一轮降雨的次生灾害风险高。其三，因灾返贫监测与保险理赔时效的执行差异，是检验\"底线思维落到每一户\"的关键环节。\n\n**可迁移点与评价**：其一，\"抢险合龙—恢复重建—下一轮防御\"的无缝衔接，与W07\"预警—响应—抢险\"、W08\"转段重建\"拼接成完整的\"防汛全周期\"分析框架，三周素材直接互证。其二，\"七个坚持＋党政同责＋拉网排查\"体现省级应急治理的制度化复盘，可迁移到安全生产、公共卫生领域。其三，把秋粮生产与经济调度会议合并部署，体现\"统筹发展和安全\"的方法论，对应粮食安全专题（D12）。\n\n**可考角度**：常识——防灾减灾救灾\"七个坚持\"、台风命名与预警等级、贾鲁河属沙颍河支流；案例分析——河南如何在灾后重建期组织新一轮台风秋汛防范；材料写作——从\"堵住一个溃口\"到\"守住一季秋粮\"：防汛持久战里的治理韧性。\n\n**金句（适用主题：应急治理、粮食安全、统筹发展安全）**：\n1. 以防汛工作的确定性，应对风雨灾害的不确定性。\n2. 溃口合龙只是中途站，秋粮归仓才算达标卷。\n3. 防汛一寸不松，秋粮一分不让——底线思维要贯穿整个汛期。\n\n## 复盘与下周关注\n\n- 本周复盘：会议部署密集（防汛调度、省委常委会、财经委员会\"三会\"覆盖安全与经济两条线）；开放与产业动作（班列博览会、数字贸易示范区、具身智能对接）显示\"夏秋季战役\"从口号进入项目化落地。\n- 下周关注：9月开学季与省残运会（9月10日开赛）；雄商高铁河南段通车时点（9月目标）；信阳港固始港区开港（9月底目标）；灾后恢复重建项目清单与救助资金发放进度；秋粮\"一喷多促\"收尾与产量预期；\"沙德尔\"残余影响消退后的水毁工程修复。\n\n## 来源与证据\n\n- [SE101] 河南日报 新华网河南频道《全省防汛专题调度会议召开 刘宁主持并讲话 王凯出席》，2026-08-27，http://ha.news.cn/20260827/b442c5d5072b4e9dbe1a32ad6396a81f/c.html\n- [SE102] 河南日报 河南省政协网转载《省委常委会召开会议 刘宁主持并讲话》，2026-08-28，https://www.hnzx.gov.cn/2026/08-28/4370320.html\n- [SE103] 河南日报 新华网河南频道《省委常委扩大会议暨省委党的建设工作领导小组会议召开》，2026-08-29，http://ha.news.cn/20260829/8bc2481872e74296bf94e24098758199/c.html （仅确认会议名称与日期，内容细节[存疑]）\n- [SE104] 河南日报 河南一百度转载《省委财经委员会会议召开 刘宁主持并讲话 王凯出席》，2026-08-31，http://www.henan100.com/news/2026/1243801.shtml\n- [SE105] 河南日报网《两趟\"全国首列\"双线齐发》，2026-08-27，https://www.henandaily.cn/news/2026/0827/1248022.html\n- [SE106] 河南日报网《郑州片区入选国家数字贸易示范区首批创建试点》，2026-08-27，https://www.henandaily.cn/news/2026/0827/1248023.html\n- [SE107] 河南日报网《具身智能头部企业抢滩中原大市场（产需对接 豫见具身）》，2026-08-26，https://www.henandaily.cn/news/2026/0826/1247799.html\n- [SE108] 河南日报网《河南省民政行业职业技能大赛在郑开幕》，2026-08-27，https://www.henandaily.cn/news/2026/0827/1248026.html\n- [SE109] 新华网 中国天气网《台风\"沙德尔\"登陆浙江玉环 强降雨时间长影响将波及9省区》，2026-08-28，https://www.news.cn/politics/20260828/fa3b8abb0f3243a1a777f1fe57ff84d3/c.html\n- [SE110] 河南日报网《濮阳长出一座数谷》，2026-08-24，https://www.henandaily.cn/news/2026/0824/1247315.html\n- [SE111] 河南省应急管理厅（转载国家防总、应急管理部会商消息）《国家防总、应急管理部组织多部门联合会商调度部署台风\"沙德尔\"防范应对工作》，2026-08-26，https://yjglt.henan.gov.cn/2026/08-26/3407674.html\n- [SE112] 新华网《河南周口贾鲁河堤坝溃口顺利合龙》，2026-08-15，https://www.xinhuanet.com/20260815/62125c2eaae3493ea3f5fe109a023515/c.html\n\n## 关联专题\n\n- [[W08]]\n- [[W07]]\n- [[P01]]\n- [[D12]]\n- [[D11]]\n", "W10-周报-2026-09-06.md": "\n# W10 · 河南时政周报（2026-08-31 — 2026-09-06）\n\n## ⚡ 快速知识卡\n\n本周（8月31日—9月6日）河南时政主线是\"收官部署＋开学季\"。8月31日刘宁调研经济运行，强调打好打赢经济发展夏秋季战役；同日王凯主持省政府常务会议，部署秋汛防范、生态损害责任追究、财政科学管理，研究城乡融合与郑州航空港\"十五五\"规划，审议制造业高质量发展促进条例等三部法规草案；还主持党组扩大会议巩固拓展正确政绩观学习教育成果。民生线：9月1日全省1900万中小学生迎来秋季新学期；新华社走访豫南灾区关注秋粮恢复；9月5日教师节前夕刘宁赴郑州大学慰问教师。考法以案例分析（超大规模开学组织）与常识（夏秋季战役、三部条例）为主。\n\n## 📖 本周要闻十条\n\n### 1. 8月31日刘宁调研经济运行：锚定目标、强化调度，打好夏秋季战役\n\n8月31日，省委书记刘宁到省交通运输厅、国网河南省电力公司、省政府国资委调研经济运行工作。在省交通运输厅，他要求充分发挥交通运输先行引领作用，全力稳投资、抓项目、畅流通、优服务，提速推进沙颍河\"通港达园\"工程等重大交通工程建设，加强货运枢纽补链强链；在国网河南电力，他察看电力调度控制中心、能源大数据应用中心，要求加快推进电网重大项目建设，推进算电协同发展，助推河南融入全国统一电力市场建设；在省政府国资委察看穿透式监管系统，强调发挥国有企业\"顶梁柱\"作用。刘宁强调，今年是\"十五五\"规划实施第一年，要着力稳就业、稳企业、稳市场、稳预期，加强存量政策和增量政策集成释放，加快落实\"六张网\"建设实施方案，纵深推进融入服务全国统一大市场建设，毫不放松抓好安全生产、防汛抗旱等工作。（来源[SE121]）\n\n### 2. 8月31日省政府常务会议：秋汛防范、生态追责、财政科学管理与三部法规草案\n\n8月31日，省长王凯主持召开省政府常务会议。会议传达学习习近平总书记对西藏日喀则市吉隆县泥石流灾害的重要指示精神和中央政治局会议精神，强调当前我省仍处于汛期，要毫不放松抓好秋汛防范应对，持续加强南水北调中线工程、尾矿库、水库、河道堤防、城市易涝点、山洪地质灾害易发区等重点部位隐患排查整治，确保安全度汛。会议传达学习中办、国办《党政领导干部生态环境损害责任追究办法》，要求坚持对生态环境损害行为\"零容忍\"，从严从细抓好秋冬季大气污染防治，加快建设美丽河南；传达学习财政科学管理试点座谈会精神，要求涵养培育财源、优化支出结构、有效化解地方债务风险、兜牢基层\"三保\"底线。会议研究了《进一步推动城乡融合发展\"十五五\"实施方案》《郑州航空港经济综合实验区\"十五五\"发展规划》；审议了《河南省制造业高质量发展促进条例（草案）》《河南省精神卫生条例（草案）》《河南省城市更新条例（草案）》。（来源[SE122]）\n\n### 3. 8月31日省政府党组扩大会议：巩固拓展正确政绩观学习教育成果\n\n8月31日，省长、省政府党组书记王凯主持召开省政府党组扩大会议，学习贯彻习近平党建思想和习近平总书记对树立和践行正确政绩观学习教育作出的重要指示精神，总结省政府党组学习教育，研究巩固拓展学习教育成果、建立长效机制。会议要求以常学常悟夯实思想根基，大力弘扬焦裕禄精神；以深查实改校准政绩坐标，深化整治\"新官不理旧账\"等突出问题；以严管严治强化日常监督，健全权力运行制约和监督机制；以实干担当推动事业发展，聚焦\"1+2+4+N\"目标任务体系，推动经济持续向新向优向好发展，努力实现\"十五五\"良好开局。（来源[SE123]）\n\n### 4. 8月31日省人大常委会党组扩大会议：为防灾减灾和基层治理强化法治供给\n\n8月31日，省人大常委会党组召开扩大会议，党组书记、副主任李亚主持。会议认真学习习近平总书记在纪念江泽民同志诞辰100周年大会上的重要讲话；传达学习总书记对西藏日喀则市吉隆县泥石流灾害的重要指示、《求是》重要文章《提高防灾减灾救灾能力》和中央政治局会议精神，指出要强化法治供给、增强监督实效，引导各级人大代表围绕防灾减灾救灾建言献策。会议还传达学习省委书记刘宁到郑州市中原区棉纺路街道人大代表联络站参加活动时的讲话精神，研究了充分发挥代表作用、推进\"数智人大\"建设，以及高质量做好《河南省数智赋能网格建设促进基层高效能治理条例》立法等工作。（来源[SE125]）\n\n### 5. 9月1日全省1900万中小学生迎来秋季新学期\n\n9月1日，河南省1900万名中小学学生迎来2026年秋季新学期。开学前夕，全国基础教育工作会议在京召开，省教育厅要求各地各校坚持问题导向、目标导向，全方位抓好开学落实。各地\"开学第一课\"形式多样：河南省实验小学以\"传承长征精神，争做强国少年\"为主题开展红色教育；郑州市多所小学将心理健康调适融入开学第一课；新乡市第一中学邀请青年数学家回母校分享求学与前沿科技。安全方面，各地教育系统紧盯校舍、消防、食品卫生等重点领域，开学前完成一轮全覆盖隐患排查；新乡市组织专业力量拉网式排查并联合多部门整治校园周边环境。（来源[SE126]）\n\n### 6. 新华社走访豫南灾区：暴雨过后秋粮恢复进行时\n\n9月1日，新华社播发《新华视点丨暴雨过后，河南受灾地区秋粮咋样了？》：受台风\"白海豚\"影响，8月上中旬河南出现强降水过程，记者实地走访漯河、周口、平顶山多地，探访灾后农业生产恢复情况。此条承接W08记录的\"从抢险到重建\"转段：8月31日省政府常务会议部署的秋汛防范、以及此前明确的改种补种、\"一喷多促\"等措施，正处在集中落地窗口。周内省直部门未发布全省性秋粮灾损与恢复汇总数据，具体进度不作引用。[存疑：全省受灾面积与改种补种完成量尚无官方汇总口径]（来源[SE124]）\n\n### 7. 9月5日刘宁赴郑州大学慰问教师：教育科技人才一体推进\n\n教师节来临之际，9月5日，省委书记刘宁到郑州大学看望慰问教学科研一线教师代表。他察看抗病毒性传染病创新药物全国重点实验室、平原实验室建设，勉励主任常俊标院士带领团队攻克关键核心技术；察看黄河实验室（河南）建设运行情况，肯定主任王复明院士团队打造\"坝道工程医院\"品牌；在\"中华源\"考古实验室察看双槐树遗址等考古研究成果，与中国社科院学部委员刘庆柱交流，希望深入实施中华文明探源工程，挖掘黄河文化、中原文化的时代价值。刘宁强调，各级党委、政府要把教师队伍建设作为基础工作来抓，织密扎牢校园安全\"防护网\"，办好人民满意的教育。（来源[SE128]）\n\n### 8. 开学季的\"安全与健康\"底色：心理健康摸排与每天不低于2小时体育活动\n\n郑州市在开学后全面开展秋季学生心理健康状况摸排，建立\"一生一档\"动态管理档案，精准画像、分类施策；同时刚性落实每天综合体育活动不低于2小时的要求，统筹调控作业数量和时间，探索以核心素养为导向的学生发展评价体系。开封市各校开学首日以\"安全与健康\"为核心开设特色\"开学第一课\"，覆盖心理健康、用电安全、网络反诈、日常防护等内容。（来源[SE126][SE127]）\n\n### 9. \"数智赋能网格建设促进基层高效能治理条例\"立法推进\n\n省人大常委会党组扩大会议把《河南省数智赋能网格建设促进基层高效能治理条例》立法列为高质量推进事项，并同步部署\"数智人大\"建设、代表联络站建设。此条是继省级层面部署党建引领基层高效能治理之后，河南以地方立法形式固化\"网格＋数智\"治理路径的信号，可与基层治理、全过程人民民主考点拼接。（来源[SE125]）\n\n### 补充要点：夏秋季战役与\"十五五\"专项规划的衔接\n\n本周省政府层面同时研究《进一步推动城乡融合发展\"十五五\"实施方案》与《郑州航空港经济综合实验区\"十五五\"发展规划》（[SE122]），加上审议制造业高质量发展促进条例草案，形成\"规划（十五五专项方案）＋立法（促进条例）＋战役（夏秋季经济攻坚）\"三层推进结构，是观察河南如何把中长期蓝图转化为近期抓手的典型切片。\n\n## 📖 深度案例：1900万学生的开学组织——超大规模公共服务的\"开学季\"答卷\n\n**主体与事件**：河南省教育厅、各省辖市教育部门与全省中小学。9月1日，全省1900万名中小学学生同时迎来2026年秋季新学期（已完成口径，[SE126]）。围绕这一个开学日，全省在开学前完成安全排查、在开学首日铺开\"开学第一课\"、在开学后滚动推进心理健康摸排，构成一次超大规模公共服务的周期性压力测试。（来源[SE126][SE127]）\n\n**背景与问题**：河南是全国基础教育人口大省，1900万在校中小学生意味着同一时间窗口内，校舍安全、上下学交通、食品卫生、心理波动、校园周边治安等多类风险叠加暴露；叠加今年8月台风\"白海豚\"灾害后部分地市校园设施受损检修、开学与主汛期尾部重合，开学组织不能只靠\"开学第一天\"的仪式，而要靠开学前—中—后的全流程治理。核心问题：一个学期性、全省性、刚性的公共服务事件，如何做到\"零事故开学＋平稳心理过渡\"两线并进。\n\n**做法与机制（三个环节）**：一是\"会前转化\"。全国基础教育工作会议闭幕后，省教育厅迅速将会议精神转化为开学工作的\"施工图\"，要求各地各校坚持问题导向、目标导向，全方位抓好开学落实——把中央会议部署压成省级清单，是\"上下贯通\"的标准动作（[SE126]）。二是\"事前排险\"。各地教育系统紧盯校舍、消防、食品卫生等重点领域，开学前完成一轮全覆盖隐患排查；新乡市坚持\"早部署、早排查、早落实\"，对校舍围墙、水电设施、在建工地拉网式排查，坚决防止\"带病开学\"，并联合公安、市场监管、城管、交通等部门组建工作专班整治15所重点学校周边环境（[SE126]）。三是\"事中疏导与事后跟踪\"。开学首日各地以红色教育、科学精神、成长关怀为主题上好\"开学第一课\"（省实验小学\"传承长征精神，争做强国少年\"、郑州多校心理健康调适、开封各校\"安全与健康\"主题课）；郑州在开学后全面开展秋季学生心理健康摸排，建立\"一生一档\"动态档案，并刚性落实每天综合体育活动不低于2小时（[SE126][SE127]）。\n\n**成效与数据（区分已完成与目标性表述）**：可确认口径：1900万名中小学生按期开学，各地开学首日秩序平稳（媒体报道口径，[SE126]）；新乡完成15所重点学校周边专项整治（[SE126]）。\"每天综合体育活动不低于2小时\"\"一生一档\"为制度性安排（要求性表述，非周内可核验的完成数据）；全省范围内周内未发布开学季安全事故统计，不作引用。\n\n**局限与观察点**：其一，1900万量级下，心理教师、体育师资的城乡配置差距决定\"2小时体育\"\"一生一档\"能否真正落地，农村寄宿制学校是薄弱环节。其二，安全排查为周期性动作，隐患整改的闭环核验机制比排查本身更关键。其三，开学与秋汛尾部重叠，受灾地市校舍修复质量需后续验证（[SE124][SE126]）。\n\n**可迁移点与评价**：其一，\"中央会议精神—省级施工图—市县拉网排查—开学日落地—开学后跟踪\"的全链条，可与W08灾后重建\"转段\"案例共用\"闭环管理\"分析框架。其二，\"防带病开学\"与安全生产领域\"隐患排查—整改销号\"逻辑同构，可迁移到应急管理、公共卫生议题。其三，心理健康\"一生一档\"体现从\"事件处置\"到\"数据画像\"的治理升级，对应基层治理、数智治理考点。\n\n**可考角度**：常识——河南中小学在校生规模量级、全国基础教育工作会议的部署方向、\"每天综合体育活动不低于2小时\"的政策出处；案例分析——河南如何组织1900万学生的开学季公共服务；材料写作——从\"开学第一课\"到\"一生一档\"：教育治理的精度与温度。\n\n**金句（适用主题：教育民生、基层治理、公共服务）**：\n1. 开学第一课讲的是家国，一生一档护的是成长。\n2. 排查防止\"带病开学\"，关爱防止\"带病成长\"。\n3. 超大规模的平稳，来自每一个环节的精确。\n\n## 复盘与下周关注\n\n- 下周关注：教师节（9月10日）前后省领导活动与教育表彰；残运会赛事进程（9月10日开赛）；秋粮\"一喷多促\"与改种补种进度官方汇总；雄商高铁通车时点（9月目标）；《河南省制造业高质量发展促进条例（草案）》等三部法规的后续审议；灾后恢复重建项目清单发布。\n\n## 来源与证据\n\n- [SE121] 河南日报（河南政协网转载）《刘宁在调研经济运行工作时强调 锚定目标任务 强化运行调度 坚决打好打赢经济发展夏秋季战役》，2026-08-31，https://www.hnzx.gov.cn/2026/08-31/4370513.html\n- [SE122] 河南省人民政府网（驻马店市人民政府网转载）《王凯主持召开省政府常务会议》，2026-08-31（发布2026-09-03），https://www.zhumadian.gov.cn/zwyw/hnyw/202609/t20260903_723306.html\n- [SE123] 河南省人民政府网（驻马店市人民政府网转载）《王凯主持召开省政府党组扩大会议》，2026-08-31（发布2026-09-02），http://www.zhumadian.gov.cn/zwyw/hnyw/202609/t20260902_722995.html\n- [SE124] 新华社《新华视点丨暴雨过后，河南受灾地区秋粮咋样了？》，2026-09-01，https://www.news.cn/20260901/7d3eb15aaddd41afa2094e09ce6bdebf/c.html\n- [SE125] 新华社河南频道《省人大常委会党组召开扩大会议》，2026-08-31（发布2026-09-02），http://ha.xinhuanet.com/20260902/c20222e2f7574b64bc8aab8777773fd6/c.html\n- [SE126] 中国日报网河南频道（通讯员稿）《河南1900万中小学生迎来秋季新学期》，2026-09-03，https://hen.chinadaily.com.cn/a/202609/03/WS6a990f68e4b09a165c787c46.html\n- [SE127] 新华社河南频道《开学第一课开讲 河南开封多维度守护学生安全健康》，2026-09-02，http://www.ha.xinhuanet.com/20260902/94302de7e41845eaaf67507d35781005/c.html\n- [SE128] 河南日报（郑州大学党政办公室网转载）《省委书记刘宁来校看望慰问教师代表》，2026-09-05，https://www5.zzu.edu.cn/dzb/info/1221/5076.htm\n\n## 关联专题\n\n- [[W09]]\n- [[W08]]\n- [[P01]]\n- [[D10]]\n- [[D12]]\n", "W11-周报-2026-09-13.md": "\n# W11 · 河南时政周报（2026-09-07 — 2026-09-13）\n\n## ⚡ 快速知识卡\n\n本周（9月7日—13日）河南时政主线是\"开放通道＋教师节＋'十五五'省辖市规划发布\"。开放线：9月11日河南中欧（亚）班列累计开行突破20000列，从1万列到2万列仅用约三年，国际物流网络覆盖欧亚40余个国家140余个城市（已完成口径）；省委书记刘宁9月8日在全省党校（行政学院）校长（院长）会议上强调坚持党校姓党、聚焦\"1+2+4+N\"目标任务体系。教育线：9月10日第42个教师节，省委、省政府发布慰问信，主题\"大力弘扬教育家精神，共筑尊师重教风尚\"。规划线：9月10日省政府新闻办举行\"开局起步'十五五'\"系列周口专场发布会，周口提出\"五个纵深推进\"、粮食综合生产能力达190亿斤左右等目标（目标值）。产业线：9月9日省长王凯调研仲景宛西制药，把中医药定位为河南特色优势产业。\n\n## 📖 本周要闻十条\n\n### 1. 9月11日河南中欧（亚）班列累计开行突破20000列：内陆开放的重要里程碑\n\n9月11日上午10时，随着一列满载光伏玻璃的X9060次专列从郑州国际陆港航空港片区鸣笛驶出，河南中欧（亚）班列累计开行突破20000列（已完成口径）。2013年7月18日，河南首列中欧班列从郑州圃田发车经阿拉山口出境驶往德国汉堡，实现\"从无到有\"；据省商务厅介绍，目前已常态化开行跨里海、黑海南通道班列、全程时刻表班列、铁公多式联运班列，开行全国首列中老泰图定快速班列、南通道（郑州—巴库）提单班列，开通郑州—莫斯科邮快件特色班列，形成29个境外直达站点、10个出入境口岸的国际物流网络，覆盖欧亚40余个国家140余个城市，综合运营质效稳居全国第一方阵。下一步将完善口岸与物流枢纽功能，一体打造大通道、大口岸、大物流、大产业。（来源[SE131][SE132]）\n\n### 2. 班列\"加速度\"的数据口径：三年完成从万到两万跨越，2025年开行3735列\n\n口径梳理：河南中欧班列2025年全年开行3735列、同比增长38.1%（已完成数据）；2026年1—8月全省开行2630列以上（初步统计口径）；日均稳定开行10列以上。据媒体报道，班列从累计1万列到2万列仅用约三年时间，反映开行密度与集结能力的持续提升。载体方面：2022年起在郑州航空港经济综合实验区东南部规划建设郑州国际陆港，规划面积50平方公里，已建成含东、西作业区在内的10平方公里核心功能区，东作业区定位中欧班列集结中心、西作业区定位新能源汽车供应链服务中心。（来源[SE131][SE133]）\n\n### 3. 9月8日全省党校（行政学院）校长（院长）会议召开：坚持党校姓党\n\n9月8日，全省党校（行政学院）校长（院长）会议在郑州召开，省委书记刘宁出席并讲话。他强调要深入学习习近平党建思想，全面贯彻习近平总书记关于党校工作的重要论述和在河南考察时重要讲话精神，坚持党校姓党、牢记党校初心，为推进全面从严治党、建设高素质干部队伍贡献力量。刘宁肯定去年以来全省党校系统聚焦\"1+2+4+N\"目标任务体系取得的新进展，要求在学思践悟上作表率、在固本培元上下功夫、在研究阐释上求突破、在循理致用上见实效；加强党对党校工作的全面领导，坚持严以治校、严以治教、严以治学。省委常委、组织部长王刚主持会议。（来源[SE134]）\n\n### 4. 9月10日第42个教师节：省委、省政府向全省教师发布慰问信\n\n9月10日是我国第42个教师节，中共河南省委、河南省人民政府发布《慰问信》，向全省教师、教育工作者及离退休老同志致以节日祝福。慰问信指出：今年是\"十五五\"开局之年，也是教育强国建设三年行动计划承上启下的关键一年；全省高等教育综合实力稳步提升、现代职业教育体系构建走深走实、基础教育扩优提质逐步推进，科教强省建设迈出坚实步伐。慰问信要求广大教师坚守为党育人、为国育才初心使命，聚焦\"1+2+4+N\"目标任务体系，为加快建设科教强省作出新贡献；省委、省政府将坚定不移落实教育优先发展战略，依法保障教师合法权益。（来源[SE135]）\n\n### 5. 教师节主题与全省教育系统庆祝安排：\"大力弘扬教育家精神，共筑尊师重教风尚\"\n\n今年教师节主题为\"大力弘扬教育家精神，共筑尊师重教风尚\"。教育部8月印发《关于做好庆祝第42个教师节有关工作的通知》（教师厅函〔2026〕6号）作出部署；河南省教育厅办公室印发通知安排全省庆祝工作，各地各校普遍开展表彰、慰问、\"开学第一课\"延伸活动。多所在豫高校在9月10日前后举行教师节表彰大会、荣休仪式，全省教育系统推出一系列惠师举措，营造尊师重教氛围。（来源[SE136][SE137]）\n\n### 6. 9月10日省政府新闻办举行周口专场发布会：\"五个纵深推进\"与农业强市目标\n\n9月10日，省政府新闻办召开河南省\"开局起步'十五五' 奋力谱写新篇章\"系列周口专场新闻发布会。周口市委副书记、市长詹鹏介绍\"十四五\"成效：地区生产总值年均增长5.3%，经济总量由全省第五跃升至第四；周口国家农高区获国务院批复，粮食总产稳定在180亿斤以上；周口中心港百万标箱现代化集装箱码头开港运营，港口货物年吞吐量超过5500万吨，获批港口型国家物流枢纽承载城市。\"十五五\"规划《纲要》设置五大领域22项发展指标，提出\"五个纵深推进\"：农业强市（确保粮食综合生产能力达190亿斤左右——目标值）、内河航运（朝着\"1亿吨内河大港、百万标箱吞吐量、千亿级临港产业\"目标迈进——目标值）、工业强市（做大做强食品加工、纺织服装2个千亿级产业集群）、文旅融合（申报国家历史文化名城）、民生事业。（来源[SE138]）\n\n### 7. 9月9日王凯调研仲景宛西制药：中医药是河南特色优势产业\n\n9月9日，省长王凯深入南阳仲景宛西制药调研，察看中药材展示区与企业产业厅，询问西峡山茱萸产业发展状况、企业中药材基地建设和现代技术应用、科研投入等情况，对企业通过建立道地药材基地带动数十万药农增收致富的做法给予肯定。王凯指出，中医药是河南极具特色与潜力的优势产业，南阳作为医圣故里是全省中医药产业发展的重要阵地，仲景宛西制药是全省中医药行业龙头企业；各级政府要持续加大政策扶持力度，推动全省中医药产业向规模化、品牌化、现代化方向高质量迈进。（来源[SE137]）\n\n### 8. 秋粮生产与收购节点临近：9月中旬河南秋粮渐次成熟\n\n9月7日—13日正值河南秋粮灌浆成熟与局部开镰收获期。信阳市光山县等地合作社社员9月13日展示刚收获的水稻（新华社图片报道口径）；豫南稻区秋收由南向北渐次展开。此条承接W08—W10连续记录的灾后恢复线：8月台风\"白海豚\"强降水后，改种补种、\"一喷多促\"等措施进入集中落地窗口，秋粮实际产量数据周内尚无官方汇总，不作引用。[存疑：全省秋收进度与受灾减产量化数据截至本周末无官方汇总口径]（来源[SE133]）\n\n### 9. 郑州国际陆港与新郑综保区陆港片区：开放平台衔接在途\n\n据省商务厅在班列突破2万列发布中介绍：2026年10月底，郑州新郑综合保税区陆港片区封关运行后，可通过下穿通道与郑州国际陆港海关监管区实现无缝衔接，大幅提升口岸与综保区间的通关效率——这是\"目标/安排\"表述，周内尚未封关。陆港片区规划面积1.66平方公里，紧邻郑州国际陆港，定位为空港、陆港功能叠加的综合保税区扩区片区（此前媒体口径）。此条与\"空中丝绸之路\"（郑州—卢森堡\"双枢纽\"）共同构成河南\"空中、陆上\"两条丝路通道的开放格局，可与新质生产力、枢纽经济考点拼接。（来源[SE131][SE132]）\n\n### 10. 河南省领导活动时间线小结：党校、调研与\"十五五\"发布密集推进\n\n本周省级主要活动可归纳为三条线：一是党建线——9月8日全省党校（行政学院）校长（院长）会议，延续8月31日省政府党组扩大会议\"巩固拓展正确政绩观学习教育成果\"的部署（详见W10）；二是调研线——9月9日王凯赴南阳调研中医药产业，延续9月2日王凯到省文化和旅游厅调研文旅产业、文化遗产行动的方向；三是发布线——9月10日周口专场之后，\"开局起步'十五五'\"系列发布会持续举行（9月11日新华网河南频道地方动态栏目收录周口专场，后续许昌、平顶山等专场陆续召开）。[注：9月11日新华网河南频道地方动态栏目收录周口专场报道，发布日期跨至9月11日]（来源[SE134][SE138]）\n\n## 📖 深度案例：河南中欧（亚）班列突破20000列——内陆省份的\"通道经济\"跃迁\n\n**主体与事件**：河南省商务厅（业务指导部门）、河南国际陆港集团等运营主体、郑州国际陆港。9月11日，随着满载光伏玻璃的X9060次专列从郑州国际陆港航空港片区驶出，河南中欧（亚）班列累计开行突破20000列（已完成口径，[SE131][SE132]）。\n\n**背景与问题**：河南不沿边、不靠海，传统上处于开放通道的末梢。2013年7月18日首列中欧班列（郑州）从圃田站发车，打开\"陆上丝绸之路\"通道。但通道打开只是第一步，内陆开放的核心问题有三个：一是回程货源不足导致的\"去程满、回程空\"与运价倒挂；二是单一通道抗风险能力弱；三是\"过路经济\"多、\"落地经济\"少，班列开行量如果不能转化为产业集聚，通道优势就难以沉淀为枢纽优势。\n\n**做法与机制（三个层面）**：一是网络多元化。常态化开行跨里海、黑海南通道班列、全程时刻表班列、铁公多式联运班列，创新开行全国首列中老泰图定快速班列、南通道（郑州—巴库）提单班列、郑州—莫斯科邮快件特色班列，形成29个境外直达站点、10个出入境口岸的网络，覆盖欧亚40余个国家140余个城市——用\"多线路、多口岸、多业态\"对冲单通道风险（[SE131]）。二是平台枢纽化。2022年起在郑州航空港区东南部规划建设郑州国际陆港，规划面积50平方公里、已建成10平方公里核心功能区，东作业区定位中欧班列集结中心、西作业区定位新能源汽车供应链服务中心；2026年10月底新郑综保区陆港片区封关运行后，将通过下穿通道与陆港海关监管区无缝衔接（安排性表述，尚未完成）（[SE131][SE132]）。三是运贸产融合。班列货物品类从传统货物扩展到光伏玻璃等新能源产品，带动新能源汽车供应链等产业向陆港集聚，推动\"通道+枢纽+产业\"闭环；2025年开行3735列、同比增长38.1%，2026年1—8月开行2630列以上（初步统计），综合运营质效稳居全国第一方阵（[SE131][SE133]）。\n\n**成效与数据（区分已完成与目标性表述）**：已完成口径——累计开行突破20000列（9月11日）；2025年开行3735列、同比增长38.1%；2026年1—8月开行2630列以上（初步统计）；29个境外直达站点、10个出入境口岸、覆盖40余个国家140余个城市；周口方向的对照案例：周口中心港百万标箱集装箱码头开港、港口货物年吞吐量超5500万吨（\"十四五\"末口径）。目标性表述——周口提出\"1亿吨内河大港、百万标箱吞吐量、千亿级临港产业\"（[SE138]）；新郑综保区陆港片区10月底封关运行（[SE131]）。周内未发布班列货值、进出口额等完成数据，不作引用。\n\n**局限与观察点**：其一，班列开行量指标居全国第一方阵，但国际班列整体面临运价竞争与回程班列装载率问题，\"量增\"能否持续转化为\"利增\"需观察。其二，50平方公里国际陆港的建设进度决定集结中心定位能否兑现，10月底封关运行是下一个可核验节点。其三，光伏玻璃等货源本身受光伏行业周期影响，货物品类结构单一化风险值得关注。\n\n**可迁移点与评价**：其一，\"无水港\"逻辑——内陆省份以国际陆港＋多式联运再造区位，可与周口内河航运（\"1亿吨内河大港\"目标）合并为河南\"向陆、向海\"双向开放的镜像案例。其二，\"从过路到落地\"的枢纽经济路径，与自贸试验区、航空港实验区共同构成河南开放平台体系，是\"新发展格局下内陆开放高地\"题型的标准素材。其三，多通道对冲风险的网络思维，可迁移到能源安全、产业链供应链韧性议题。\n\n**可考角度**：常识——河南中欧班列首发时间（2013年7月18日）、郑州国际陆港\"东西作业区\"分工、29个境外直达站点的量级；案例分析——内陆省份如何把区位劣势转化为枢纽优势、通道经济如何升级为产业经济；材料写作——从\"20000列\"看内陆开放的\"通道—枢纽—产业\"跃迁。\n\n**金句（适用主题：内陆开放、枢纽经济、新发展格局）**：\n1. 不沿边不靠海，就把铁路线当海岸线。\n2. 班列铺出去的是钢轨，引进来的是产业。\n3. 通道的价值不在车流，而在车流停下来之后留下的产业。\n\n## 复盘与下周关注\n\n- 下周关注：新郑综保区陆港片区封关运行进度（10月底目标，10月9日已通过联合简化验收——属后续验证信息，W12周报可再核）；雄商高铁通车时点（此前明确9月目标，9月28日正式开通，W12核对确认口径）；秋粮大面积收获进度与官方汇总；\"开局起步'十五五'\"系列省辖市专场发布会（许昌、平顶山等场次）；9月14日省政府常务会议（研究安全生产、生态环境保护）等后续会议安排。\n\n## 来源与证据\n\n- [SE131] 大河网（大河网讯）《突破20000列！河南中欧（亚）班列迎来重要里程碑》，2026-09-11（新浪河南转载页发布2026-09-14），https://henan.sina.cn/news/z/2026-09-14/detail-iniruarh4012078.d.html\n- [SE132] 人民网河南频道《河南中欧班列累计开行突破20000列 织密内陆开放丝路通道》，2026-09-11，https://news.qq.com/rain/a/20260911A0DDPI00 （人民网稿腾讯分发页；标注\"人民网记者\"署名，转载口径）\n- [SE133] 央视网《第一时间》栏目《河南中欧班列累计开行突破2万列》，2026-09-12，https://tv.cctv.com/2026/09/12/VIDE9UWb0qz29RfyYzFZHlKJ260912.shtml\n- [SE134] 河南日报客户端《全省党校（行政学院）校长（院长）会议召开 刘宁出席并讲话》，2026-09-08，https://app-api.henandaily.cn/mobile/view/news/618697890583281664626088\n- [SE135] 中共河南省委、河南省人民政府《慰问信》（驻马店网刊发），2026-09-10，http://m.zmdnews.cn/article/538377\n- [SE136] 新华网《庆祝第42个教师节，教育部通知来了》，2026-08-21，https://www.xinhuanet.com/edu/20260821/35a2d2b5359d45d787a2af8bc7b60c19/c.html\n- [SE137] 仲景宛西制药官网《河南省省长王凯调研仲景宛西制药》，2026-09-10，https://www.zhongjing.cn/News_detail/414.html\n- [SE138] 新华网河南频道（河南日报稿）《河南省\"开局起步'十五五' 奋力谱写新篇章\"系列周口专场新闻发布会举行》，2026-09-11（发布会2026-09-10举行），http://ha.news.cn/20260911/88442a62af3f4dfabd89f31260356f6d/c.html\n\n## 关联专题\n\n- [[W10]]\n- [[W09]]\n- [[P01]]\n- [[D09]]\n- [[D12]]\n", "W12-周报-2026-09-20.md": "\n# W12 · 河南时政周报（2026-09-14 — 2026-09-20）\n\n## ⚡ 快速知识卡\n\n本周（9月14日—20日）河南时政主线是\"省政府常务会议+'十五五'省辖市（区）专场密集发布+县域特色产业大会\"。会议线：9月14日省长王凯主持召开省政府常务会议，研究安全生产、中央生态环境保护督察反馈问题整改，并研究《河南省加快推进\"六张网\"建设工作实施方案》《河南省化工园区规范建设和高质量发展三年行动方案》。发布线：9月14日航空港区专场、9月18日漯河与濮阳专场接连举行，围绕\"人工智能之城\"\"中国食品名城\"\"油城焕新\"亮出\"十五五\"施工图。产业线：9月17日—18日第十九届（2026）牛业发展大会在信阳光山开幕，《畜禽肉质量分级·牛肉》国家标准发布，\"光山肉牛\"全产业链产值超25亿元（已完成口径）。\n\n## 📖 本周要闻十条\n\n### 1. 9月14日省政府常务会议：安全、生态、开放、党建四线并进\n\n9月14日，省长王凯主持召开省政府常务会议，传达学习习近平总书记重要讲话重要指示精神，研究安全生产、生态环境保护等工作。会议传达学习习近平总书记对山东青岛市北海造船厂一货轮火灾事故作出的重要指示精神，强调坚持人民至上、生命至上，树牢底线思维、极限思维，严格落实\"三管三必须\"要求，紧盯重点行业领域深入开展风险隐患排查整治，扎实开展\"打非治违\"工作，坚决防范遏制重特大事故发生；要扎实做好中秋、国庆期间安全生产工作，突出抓好消防、化工、矿山、建设工程、道路交通、文化旅游等重点领域和人员密集场所安全监管。会议还传达学习习近平总书记在金砖国家领导人第十八次会晤期间的重要讲话精神和《求是》杂志重要文章《坚持落实管党治党政治责任》，要求稳步扩大制度型开放、纵深推进政府系统全面从严治党。（来源[SE141][SE142]）\n\n### 2. \"六张网\"建设实施方案上会研究：基础设施布局的省级落子\n\n本次常务会议研究《河南省加快推进\"六张网\"建设工作实施方案》。\"六张网\"（新型基础设施与新型城镇化领域的水网、电网、算力网、新一代通信网、城市地下管网、物流网等网络化布局）是\"十五五\"开局之年国家层面的重大部署：据国新办9月28日专场发布口径，国资委组织央企围绕\"六张网\"年度计划安排相关投资约2万亿元（中央层面口径，非河南数据）。河南在省级层面以实施方案承接，本周漯河、濮阳两场专场发布会均明确\"紧扣全省基础设施'六张网'总体布局\"谋划本地项目——濮阳提出抢抓\"六张网\"政策机遇加快供水、供热、燃气、排水、污水等管网建设，漯河提出建设豫中南网络枢纽和食品行业可信数据空间。此条是\"新基建+城市更新+枢纽经济\"三个考点的交叉素材。[注：\"六张网\"具体门类表述以省政府正式印发文件为准，本条按发布会及权威媒体口径整理]（来源[SE141][SE144][SE145]）\n\n### 3. 化工园区规范建设三年行动方案：安全与产业升级的衔接\n\n同一会议上，省政府常务会议研究《河南省化工园区规范建设和高质量发展三年行动方案》。河南是化工大省，濮阳、洛阳、新乡、焦作等地均布局化工园区，会议将\"规范建设\"与\"高质量发展\"并列表述，指向两个方向：一是园区安全整治提升（承接安全生产部署），二是化工新材料产业链升级（濮阳专场明确力争2030年化工新材料产业产值突破2000亿元——目标值）。方案全文周内尚未公开发布，具体指标不作引用，后续跟踪省政府官网正式印发稿。（来源[SE141][SE145]）\n\n### 4. 中央生态环境保护督察反馈问题整改：闭环管理+国企责任\n\n常务会议研究中央生态环境保护督察反馈问题整改工作，强调深入贯彻习近平生态文明思想，坚决扛牢生态环境保护责任，坚持问题导向、目标导向、结果导向相统一，健全闭环管理机制，加强日常监管执法，举一反三、标本兼治，确保各类问题改彻底改到位。会议特别点明省属国有企业要严格落实主体责任，将生态环境保护工作融入经营管理全过程，着力优化产业布局、加强节能降碳改造、加大科技创新力度、加快绿色低碳转型。此条延续W10记录的8月31日省政府常务会议\"学习贯彻《党政领导干部生态环境损害责任追究办法》\"的生态线，\"督察整改+国企责任\"是申论生态与国企改革题型的组合素材。（来源[SE141][SE142]）\n\n### 5. 9月18日漯河专场：\"中国食品名城\"的\"十五五\"施工图\n\n9月18日，省政府新闻办召开\"开局起步'十五五' 奋力谱写新篇章\"系列漯河专场新闻发布会（该系列第13场），主题\"砥砺奋进 真抓实干 奋力开创中国式现代化建设漯河新局面\"。市长乔彦强介绍：\"十四五\"时期漯河生产总值年均增长6.4%、居全省第1位，财政一般公共预算收入年均增长7.7%、居全省第2位（已完成口径）；今年是漯河建市40周年。\"十五五\"规划《纲要》围绕五大领域设置21项主要指标，概括为\"六个坚持\"。产业上构建以食品为主导、先进制造业为骨干、现代服务业为依托的现代化产业体系，动态优化现代食品、新材料、先进制造三大产业集群\"11+8+N\"产业链，发挥中原食品实验室引擎作用；落实\"人工智能+\"行动，重点围绕科技创新、工业制造、交通物流、食品产业等十大领域培育人工智能示范应用场景。（来源[SE144]）\n\n### 6. 漯河\"三农\"数据口径：粮食、畜牧与农民收入的量级\n\n漯河专场给出的\"十四五\"农业数据值得单列记忆：粮食年产量稳定在36亿斤以上（已完成口径）；农产品加工业产值与农业产值之比达4.5:1，居全省全国前列；猪牛羊禽肉总产量达40万吨，获评全省首家畜牧业高质量发展示范市；\"十四五\"末农村居民人均可支配收入达2.6万元，居全省第一方阵。\"十五五\"目标：实施绿色\"吨半粮田百千万\"提升行动，确保年粮食播种面积稳定在410万亩以上、总产保持37.6亿斤以上（目标值）；推广\"五级订单\"模式，稳固优质专用小麦130万亩、小辣椒50万亩以上种植规模；到2030年建设省级和美村150个以上、富美村300个以上（目标值）。注意区分：36亿斤是\"十四五\"完成口径，37.6亿斤是\"十五五\"目标口径。（来源[SE144]）\n\n### 7. 9月18日濮阳专场：\"油城焕新\"与制造强市目标\n\n9月18日，省政府新闻办召开系列濮阳专场新闻发布会，主题\"推动油城焕新，建设制造强市\"。市长朱良才介绍：\"十四五\"时期濮阳生产总值迈上2000亿元台阶，济郑高铁全线贯通，全国资源枯竭城市转型绩效考核实现\"四连优\"（已完成口径）。\"十五五\"规划纲要围绕五大领域设置22项主要指标，深度谋划1791个重大项目；将建设国内一流现代化工新材料基地作为转型主抓手，主攻聚碳新材料、高端聚烯烃、高端精细化工、电子化学品、绿色涂料等领域，突出抓好181个重大制造业项目，重点培育7家百亿级龙头企业，力争2030年化工新材料产业产值突破2000亿元（目标值）；深化国家氢能应用试点市建设，打造豫北地区绿氢供应中心。另据发布会消息，第四届全国危险化学品救援技能竞赛定于10月13日至16日在濮阳举办。（来源[SE145]）\n\n### 8. 9月17日第十九届（2026）牛业发展大会在光山开幕\n\n9月17日，第十九届（2026）牛业发展大会在河南省信阳市光山县开幕，会期两天（9月16日—18日配套活动），主题\"抢抓机遇筑根基、转型升级兴牛业\"，由中国畜牧业协会、河南福牛牧业有限公司共同主办。来自全国牛业养殖、屠宰加工、商贸流通、科技研发、智能装备、金融与数智化服务等全产业链的专家学者、企业代表参会。开幕式上《畜禽肉质量分级·牛肉》国家标准正式发布，中国农业科学院北京畜牧兽医研究所专家在会上作标准解读；内蒙古、河南、浙江三方企业签署肉牛产业\"北繁+中育+南销\"合作协议，贯通繁育、育肥、销售三大环节；工商银行同步发布肉牛产业金融服务成果。县域承办全国性行业盛会，是\"特色产业+革命老区振兴\"的典型组合素材。（来源[SE143]）\n\n### 9. \"光山肉牛\"全产业链量级：从上游育肥到5小时直供华东\n\n新华网河南频道报道口径：光山县地处南北气候过渡带，鲜牛肉半日可达长三角；该县肉牛饲养量达5万余头，培育千头级大型养殖企业7家、百头以上规模场66家，入选河南省养牛大县，全产业链产值超25亿元（以上为已完成口径）。上游建成2万头标准化育肥场，年收储加工饲草20万吨、年产有机肥10万吨；中游建成年屠宰能力10万头的加工厂；下游\"光山肉牛\"跻身全国名特优新农产品，自主品牌\"京沣福牛\"5小时直供华东市场。河南日报报道补充：今年1至8月十里鲜公司已屠宰3.6万头、营收7.5亿元（初步统计口径）。此条可与D09兰考共富工坊、D12粮食安全并读，构成河南县域\"土特产\"全产业链案例群。[注：1—8月屠宰与营收数据出自河南日报省媒聚焦稿，为县口径初步数据]（来源[SE143]）\n\n### 10. 秋收秋播时点与丰收节前瞻：进度数据周内无官方汇总\n\n9月14日—20日正值河南秋粮大面积收获推进期（豫南先行）与麦播准备期。国家层面：农业农村部9月9日发布会介绍，第九个中国农民丰收节定于9月23日（农历秋分）举办，全国主场活动在湖北襄阳枣阳市，主题\"丰收开新局 实干促振兴\"，\"金秋消费季\"已于9月4日启动。[存疑：本周内河南全省秋收进度、秋粮产量预估均无省级官方汇总口径；河南\"7600多万亩秋粮收获进度过半\"出自9月26日央视网/中国政府网报道，属下一周期数据，本条不引用为周内数据]。麦播方面周内媒体口径为\"麦播不抢早、适期看墒情\"的技术导向，具体进度无数据。（来源[SE146]）\n\n## 📖 深度案例：光山肉牛——革命老区县域\"土特产\"的全产业链跃迁\n\n**主体与事件**：信阳市光山县（县域政府+经营主体：福牛牧业、十里鲜公司等），事件为9月17日—18日第十九届（2026）牛业发展大会在光山举办，全国性牛业盛会首次落地该县（[SE143]）。\n\n**背景与问题**：光山是革命老区县（大别山区），传统农业县发展县域经济普遍面临三个问题：一是产业散而小，缺乏能支撑全县的主导产业；二是农产品停留在初级出售环节，增值收益外流；三是养殖业的融资难、环保难、用地难。光山的答案是把一头牛做成一条全产业链，用\"牛\"撬动县域百亿级产业生态（县口径表述）。\n\n**做法与机制（四个层面）**：一是全链条布局。上游建成2万头标准化育肥场、年收储加工饲草20万吨的农牧循环产业园（年产有机肥10万吨，实现种养循环），中游建成年屠宰能力10万头的河南十里鲜食品有限公司，下游做品牌——\"光山肉牛\"入选全国名特优新农产品，\"京沣福牛\"依托冷链体系5小时直供华东（[SE143]）。二是要素保障。县财政统筹各类涉农资金8000余万元支持重点产业发展（县口径），推动全省首创肉牛产业信用贷、全市首笔畜牧智慧贷落地，破解养殖融资难题；工商银行在本届大会发布肉牛产业金融服务成果，金融供给从政府主导扩展到银企协同（[SE143]）。三是标准与科技赋能。十里鲜参与起草中国牛肉分级标准，与河南牧业经济学院、河南省食品工业协会联合发布两项热鲜牛肉制品团体标准，填补国内热鲜牛肉精深加工领域标准空白；本届大会发布《畜禽肉质量分级·牛肉》国家标准，县域产业与国家标准接轨；养殖端应用智能耳标等数智设备，建设智慧牧场（[SE143]）。四是区域协同。内蒙古、河南、浙江三方企业签署\"北繁+中育+南销\"合作协议——内蒙古繁育、河南中部育肥、浙江及长三角销售，把县域产业嵌入全国产业分工（[SE143]）。\n\n**成效与数据（区分已完成与目标性表述）**：已完成口径——全县肉牛饲养量5万余头，千头级养殖企业7家、百头以上规模场66家；全产业链产值超25亿元；年屠宰能力10万头（产能），1—8月实际屠宰3.6万头、营收7.5亿元（初步统计）；入选河南省养牛大县、\"光山肉牛\"入选全国名特优新农产品。目标性/规划性表述——县里出台肉牛三年行动方案（行动方案的具体量化指标周内未见权威披露，不作引用）。大会本身（国家级平台落地县域）亦可视为一种\"已完成\"的制度性成效。\n\n**局限与观察点**：其一，全国肉牛行业整体面临牛价下行、产能调整周期，光山扩产能否对冲价格波动需观察；其二，屠宰产能年化利用率与跨区调运的生物安全是养殖加工业的通用风险点；其三，\"北繁中育南销\"模式依赖三方协作机制的稳定性，协议落地情况待跟踪。\n\n**可迁移点与评价**：其一，\"土特产\"三篇文章的县域模板——把资源禀赋（气候过渡带、区位枢纽）翻译成产业语言（育肥适宜区+半日达长三角），是\"因地制宜发展特色产业\"的标准素材。其二，\"全产业链\"方法论：一个单品贯通\"饲草—养殖—屠宰—加工—品牌—金融\"，可与兰考共富工坊（就业带动型）、漯河\"三链同构、农食融合\"（食品工业型）构成三个不同驱动类型的县域产业案例组。其三，金融+标准+区域协同的组合拳，可迁移到食用菌、中药材等其他河南特色产业链分析。\n\n**可考角度**：常识——第十九届牛业发展大会举办地（信阳光山）、大会主题、《畜禽肉质量分级·牛肉》国家标准发布；案例分析——革命老区如何把\"一头牛\"做成全产业链、县域特色产业如何嵌入全国分工（北繁中育南销）；材料写作——从\"光山肉牛\"看县域经济\"土特产\"增值路径与联农带农机制。\n\n**金句（适用主题：乡村振兴、县域经济、特色产业）**：\n1. 一头牛连着饲草场、屠宰线、冷链车和农户的账本，链条有多长，增值空间就有多大。\n2. 老区振兴不靠输血靠造血，造血的干细胞就藏在\"土特产\"里。\n3. 把小产品做成大产业、把土字号做成金字号，关键在标准、品牌和链条。\n\n## 复盘与下周关注\n\n- 本周复盘：主线是省政府常务会议定调（安全+生态+两份方案）与\"十五五\"省辖市（区）专场的密集发布（航空港区、漯河、濮阳），叠加县域产业大会（光山牛业）——\"省定框架、市县施工\"的层级结构清晰，适合做\"规划落地\"类综合题。\n- 下周关注：9月23日中国农民丰收节（全国主场在湖北枣阳，河南各地配套活动口径）；河南秋收进度与全年粮食产量预估的官方汇总；雄商高铁（京港高铁雄商段）通车时点确认；\"开局起步'十五五'\"系列后续专场；化工园区三年行动方案与\"六张网\"实施方案的正式印发文本。\n\n## 来源与证据\n\n- [SE141] 新华网河南频道（河南日报稿）《王凯主持召开省政府常务会议》，2026-09-15（会议2026-09-14召开），http://ha.news.cn/20260915/ff33dde554c04a47b0ba8d48fe1436d3/c.html\n- [SE142] 人民网河南频道（河南日报稿）《王凯主持召开河南省政府常务会议》，2026-09-15，http://henan.people.com.cn/n2/2026/0915/c351638-41696106.html\n- [SE143] 新华网河南频道《第十九届（2026）牛业发展大会在河南光山开幕》，2026-09-18（大会2026-09-17开幕），http://ha.news.cn/20260918/145c6964e6c44343901aae8d7b6ef39d/c.html\n- [SE144] 国务院新闻办公室网站（国新网）转载《河南省举行\"开局起步'十五五' 奋力谱写新篇章\"系列漯河专场新闻发布会》（实录），2026-09-18，http://www.scio.gov.cn/xwfb/dfxwfb/gssfbh/hn_13841/202609/t20260923_1009745.html\n- [SE145] 中原经济网（河南经济报社）《濮阳：油城焕新 建设制造强市》，2026-09-19（发布会2026-09-18举行），https://www.zyjjw.cn/article/20260919/178973730434730.html\n- [SE146] 农业农村部网站《2026年中国农民丰收节总体安排和筹备情况》（9月9日发布会实录页），2026-09-16，https://nmfsj.moa.gov.cn/xwzx_25646/ywjj/202609/t20260916_6487715.htm\n- [SE147] 光山县委宣传部（央广网河南频道刊发）《第十九届（2026）牛业发展大会在河南光山开幕》，2026-09-20，https://hn.cnr.cn/hnpdgb/hngexb/20260920/t20260920_527819404.html\n\n## 关联专题\n\n- [[W11]]\n- [[W10]]\n- [[P01]]\n- [[D09]]\n- [[D11]]\n- [[D12]]\n", "W13-周报-2026-09-27.md": "\n# W13 · 河南时政周报（2026-09-21 — 2026-09-27）\n\n## ⚡ 快速知识卡\n\n本周（9月21日—27日）河南时政主线是\"省级领导班子调整+丰收节主场+秋粮抢收\"。人事线：9月23日全省领导干部会议宣布中央决定，周祖翼任河南省委书记；9月24日省人大常委会接受王凯辞去省长职务，任命王陆进为副省长、代理省长，同场通过《河南省发展规划条例》《河南省传承弘扬红旗渠精神条例》等法规。三农线：9月23日第九个中国农民丰收节河南省主场活动在濮阳清丰县举办，首创\"赛会节\"融合模式，2027年主场交棒驻马店；9月26日央视报道河南7600多万亩秋粮收获进度过半，阴雨之下周口\"收割—转运—烘干\"无缝衔接。基建线：京港高铁雄商段官宣9月28日开通，台前东站成为高铁进豫第一站（开通属下一周期事件）。\n\n## 📖 本周要闻十条\n\n### 1. 9月23日全省领导干部会议：省委主要负责同志职务调整\n\n9月23日，河南省召开全省领导干部会议。中央组织部副部长齐家滨出席会议并宣布中央决定：周祖翼同志任河南省委委员、常委、书记，刘宁同志不再担任河南省委书记、常委、委员职务；王陆进同志任河南省委委员、常委、副书记，王凯同志不再担任河南省委副书记、常委、委员职务。刘宁主持会议并讲话，周祖翼、王凯、王陆进讲话。周祖翼1965年1月生，浙江天台人，二十届中央委员，此前任人力资源和社会保障部部长、福建省委书记；他在讲话中提出旗帜鲜明讲政治、凝心聚力促发展、矢志为民践初心、从严从实抓党建四方面要求，强调\"咬定目标不放松，一张蓝图绘到底\"，扛牢粮食安全责任，持续深化高效能治理。（来源[SE151]）\n\n### 2. 9月24日省人大常委会：王凯辞去省长职务，王陆进代理省长\n\n9月24日，省十四届人大常委会第二十六次会议在郑州闭幕。会议表决通过关于接受王凯辞去河南省人民政府省长职务请求的决定，投票决定任命王陆进为河南省人民政府副省长、代理省长职务。王陆进1968年10月生，江苏丹阳人，曾任中央纪委国家监委驻国家金融监督管理总局纪检监察组组长、河北省委副书记（后兼任省委政法委书记），到豫前任河南省委副书记、省政府党组书记。他在会上表态：聚焦\"两高四着力\"抓发展、强治理、惠民生、防风险，牢固树立和践行正确政绩观，全力建设清廉政府。此条是\"地方组织法第32条+人大常委会任免程序\"的典型常识考点，注意区分职务链条：中央任命（省委副书记）→省政府党组书记→人大任命副省长→代理省长。（来源[SE152][SE153]）\n\n### 3. 省人大常委会同场表决通过一批地方性法规\n\n同次常委会会议表决通过《河南省人民代表大会常务委员会关于加快构建现代化城市体系深入推进以人为本的新型城镇化建设的决定》《河南省发展规划条例》《河南省传承弘扬红旗渠精神条例》《河南省红十字会条例》《河南省工会劳动法律监督条例》，以及关于省十四届人大代表出缺情况的代表资格审查报告和人事任免事项；审查批准了安阳、鹤壁、新乡、焦作四市南太行山区旅游发展促进条例和洛阳、平顶山、濮阳、许昌、信阳、驻马店六市地方性法规。其中《河南省发展规划条例》可与\"十五五\"规划编制背景并读，《河南省传承弘扬红旗渠精神条例》把精神谱系写入法规，是\"精神+法治\"的新颖组合考点。（来源[SE153]）\n\n### 4. 9月23日中国农民丰收节河南省主场活动在清丰县举行\n\n9月23日（农历秋分），2026年中国农民丰收节河南省主场活动在濮阳市清丰县马庄桥镇赵家村举行，省政协副主席谢玉安出席并为2027年\"赛会节\"举办地驻马店授旗。今年是第九个中国农民丰收节，全国主场活动在湖北襄阳枣阳市，河南主场以\"丰收开新局、实干促振兴\"为主题，同步举办河南省和美乡村篮球大赛（村BA）总决赛与\"豫农优品\"丰收大集，以\"赛会节\"一体化运营串联丰收主题分享、群众文艺展演、丰收大集展销、篮球收官对决四大板块，坚持\"农民主体、农业主线、农村主场\"。河南日报报道口径明确其为\"全方位展示'中原粮仓'丰收盛景与乡村振兴丰硕成果\"的省级平台。（来源[SE155]）\n\n### 5. 河南秋粮收获进度过半：7600多万亩与\"烘干\"关键词\n\n9月26日央视《新闻联播》\"在希望的田野上\"报道：农业农村部最新农情调度显示全国秋粮收获近两成，其中河南7600多万亩秋粮收获进度过半。报道特别点名周口做法：针对阴雨天气导致田间湿度大、玉米籽粒水分偏高，农户将刚收割的潮粮第一时间运送至附近烘干塔集中烘干，实现收割、转运、烘干无缝衔接。注意口径区分：7600多万亩是秋粮面积、进度过半是9月26日时点数，均非最终产量数据；全省最终秋收完成数与全年粮食产量要到下一周期公布。秋收期间河南部分地区出现连阴雨，\"抢收+烘干+晾晒场地开放\"构成今年河南秋粮保收的关键词组。（来源[SE154]）\n\n### 6. 阴雨之年的\"三秋\"应对：烘干设施与社会化服务的实战检验\n\n把秋收细节放大看：河南官方公布全省粮食烘干中心（点）信息，破解\"晒粮难、烘干慢\"，产粮大县周口扶沟县投入83台烘干设备、日烘干能力超万吨（媒体援引河南官方口径）。因连阴雨，中国小麦生产第一大省河南的大规模麦播较往年推后，\"寒露种麦正当时\"成为技术导向，南阳唐河等地预计10月底11月初开始种小麦。此条可与W10记录的8月31日省政府常务会议\"毫不放松抓好秋汛防范应对\"、W12\"麦播不抢早、适期看墒情\"形成连续线索：从防汛到秋收到麦播，2026年河南\"三秋\"主线是极端天气下的粮食安全韧性，是\"粮食安全+应急管理\"复合题型的现成材料。[注：麦播推后为中新社报道的田间采访口径，全省性官方汇总暂未见]（来源[SE154][SE157]）\n\n### 7. 雄商高铁官宣9月28日开通：台前东站成为高铁进豫第一站\n\n9月25日国铁集团官宣：京港高铁雄安至商丘段（雄商高铁）定于9月28日开通运营。线路北起雄安站、南至商丘站，正线全长552公里，设计时速350公里，纵贯河北、山东、河南三省九市二十六县区，全线设16座车站，河南段设台前东、商丘两站，台前东站为高铁进豫第一站。雄商高铁是国家\"八纵八横\"高铁网京港（台）通道的重要组成部分，在商丘与郑徐高铁交汇，通车后任丘、肃宁、临清、阳谷、台前、梁山、郏城等十余个县市迈入高铁时代。注意时点：官宣与车票发售（9月25日）在本周内，正式开通在9月28日（下一周期），本条按\"周内官宣\"口径记录。（来源[SE156]）\n\n### 8. 雄商高铁对河南的意义：豫东北通道与第二个高铁\"十字\"\n\n雄商高铁河南段约25公里，但意义超出里程：一是在商丘站与郑徐高铁交汇，形成河南省继郑州东站之后的第二个高铁\"十字\"综合枢纽，承担分流京广高铁客流的使命；二是结束濮阳台前不通高铁的历史，这座豫东北革命老区县30年前因京九铁路成为进豫第一站，30年后再度成为高铁进豫第一站；三是构建京津冀连接中原的高速客运新通道，为豫东北高质量发展注入要素流通动能。濮阳市政府门户此前即以\"雄商高铁预计9月通车，为豫东北高质量发展注入强劲动能\"专题报道。此条是\"交通区位+革命老区+区域协调\"三重考点的叠加素材。（来源[SE156]）\n\n### 9. 周口国家农高区：全国唯一小麦主导国家级农高区的\"高\"字答卷\n\n9月21日中新网河南刊发深度报道《周口国家农高区\"高\"在何处》：2022年国务院批复设立河南周口国家农业高新技术产业示范区，落地郸城，是全国九家农高区之一、河南唯一、黄淮平原唯一以小麦为主导产业的国家级农高区。已完成的硬数据：2025年农高区总产值180亿元、同比增长8.6%；2026年周口夏粮总产量110.84亿斤，创高产纪录；农高区5000亩粮食精深加工产业园集聚89家规上企业。省政府印发的《河南周口国家农业高新技术产业示范区高质量发展三年行动计划（2026—2028年）》明确：到2028年实现高标准农田和良种推广\"两个100%\"，打造5万亩以上\"吨半粮\"示范田、推广100万亩以上专用优质小麦（目标值）。此条与W12周口专场\"粮食综合生产能力190亿斤\"目标一脉相承。（来源[SE157]）\n\n### 10. \"十五五\"全国发布节奏与河南衔接：教育强国专场等中央信号\n\n中央层面本周密集举行\"开局起步'十五五'\"系列国新办发布会：9月23日教育部专场介绍贯彻落实\"十五五\"规划、加快推进教育强国建设有关情况，9月28日国资委专场将介绍中央企业高质量发展情况（据国新办发布安排）。河南侧的衔接线索是持续推进的省政府新闻办\"开局起步'十五五'奋力谱写新篇章\"系列省辖市专场与省直部门落实动作。对本库而言，此条的作用是提供\"国家'十五五'发布节奏\"的坐标系：河南省\"六张网\"实施方案、化工园区三年行动方案等待印发文件，正处在这个国家—省级政策落地的窗口期，后续周报持续跟踪。[注：中央专场内容与河南无直接对应条目，仅作背景参照]（来源[SE157]引述背景，另见W12跟踪线）\n\n## 📖 深度案例：清丰丰收节——\"赛会节\"模式与丰收节的平台化转型\n\n**主体与事件**：濮阳市清丰县（县级政府承接省级主场），9月23日2026年中国农民丰收节河南省主场活动在该县马庄桥镇赵家村举行，并同步举办全省和美乡村篮球大赛（村BA）总决赛与\"豫农优品\"丰收大集（[SE155]）。\n\n**背景与问题**：传统节庆活动普遍面临三个问题：一是\"办节即办会\"，政府唱主角、农民成观众，仪式结束热度即散；二是庆丰收与产销脱节，展演热闹但农产品卖不动；三是单县办节缺乏全省资源，形不成持续性平台。丰收节设立九年来，如何在\"节日仪式感\"之外沉淀出可复用的机制，成为各主办地的共同课题。\n\n**做法与机制（三个层面）**：一是\"赛会节\"一体化运营。把村BA总决赛（全省19支代表队参赛、9月23日冠亚军对决）、\"豫农优品\"丰收大集（设和美乡村先导区、\"豫农优品\"、\"美豫名品\"、乡村美食、非遗新农人五大展区）、丰收节主活动三大板块串联，赛事聚人气、大集促交易、仪式定主题，农文体旅商深度融合（[SE155]）。二是产销对接机制。大集同步搭建采购商专场对接、线上直播带货，打通农产品出村进城链条，让\"丰收\"直接转化为\"增收\"（[SE155]）。三是承办地轮换机制。省政协副主席出席并现场为2027年举办地驻马店授旗——省级主场活动以\"授旗\"形式制度化轮办，把一次性活动变成跨年度的省级平台竞争机制，各县市有明确预期。（[SE155]）\n\n**成效与数据（区分已完成与目标性表述）**：已完成口径——河南省主场活动于9月23日在清丰县如期举行；全省19支村BA代表队参赛、9月23日完成冠亚军决赛；2027年举办地已确定为驻马店（授旗完成）。目标性表述——活动方案中\"探索农文体旅商深度融合的乡村振兴路径\"属于方向性表述，尚无量化考核指标；本届现场交易额、观赛人数等数据周内未见权威披露，不作引用。（[SE155]）\n\n**局限与观察点**：其一，\"赛会节\"模式的效果依赖流量转化，篮球赛事、大集的热度能否沉淀为常态化产销机制待验证；其二，县级承办省级主场对基础设施、安保、接待能力是硬约束，清丰经验向一般农业县复制的成本边界需观察；其三，与全国主场（湖北枣阳）相比，河南主场的全国性传播声量有限，品牌溢出效应待评估。\n\n**可迁移点与评价**：其一，\"赛事+市集+仪式\"的三合一结构可迁移到Any县域特色节庆（食用菌节、艾草文化节等）分析框架。其二，\"授旗轮办\"是省级平台下沉县域的制度创新，可与W12光山承办全国牛业大会并读——一个是全国性行业盛会落地县域，一个是省级节庆平台县域轮办，共同指向\"县域承接高能级活动平台\"这一乡村振兴新变量。其三，村BA、丰收大集与\"豫农优品\"品牌体系的结合，是\"农产品区域公用品牌+群众文体IP\"双轮驱动的现成案例。\n\n**可考角度**：常识——第九个中国农民丰收节日期（9月23日/农历秋分）、2026年河南主场举办地（濮阳清丰县）、2027年举办地（驻马店）、全国主场（湖北枣阳）；案例分析——\"赛会节\"模式如何解决节庆活动\"办完即散\"问题；材料写作——从丰收节平台化看\"农民主体、农业主线、农村主场\"的落实机制。\n\n**金句（适用主题：乡村振兴、农民增收、乡村治理）**：\n1. 丰收节不能只是一场仪式，要成为农产品的销路、乡村人气的入口和农民的主体舞台。\n2. 把赛事办在村里、把大集摆在田边，节庆的流量才会变成土地的增量。\n3. 一面授旗，交出的是办节接力棒，立起的是比学赶超的赛马场。\n\n## 复盘与下周关注\n\n- 本周复盘：主线有三——省级领导班子调整（9月23日全省领导干部会议+9月24日省人大常委会，\"中央决定→人大程序→代理省长\"的完整链条）、丰收节河南主场落地清丰（\"赛会节\"模式）、秋粮收获过半与阴雨抢收（7600多万亩进度数据）。人事调整周内省政府的重大政策性会议相对减少，属正常节奏，下周应关注代省长的调研动向与省政府常务会议复会。\n- 下周关注：9月28日雄商高铁正式开通运营（本周已官宣）及其对豫东北的拉动口径；河南全省秋收完成进度与全年粮食产量预估的官方汇总；新任省委书记周祖翼、代省长王陆进的首批调研主题与会议部署；\"开局起步'十五五'\"系列后续专场；丰收节活动效果的后续报道口径。\n\n## 来源与证据\n\n- [SE151] 人民网河南频道（河南日报稿）《河南省召开全省领导干部会议》，2026-09-24（会议2026-09-23召开），http://henan.people.com.cn/n2/2026/0924/c351638-41706425.html\n- [SE152] 河南人大网《河南省人民代表大会常务委员会关于王陆进代理河南省人民政府省长职务的决定》，2026-09-24，https://www.henanrd.gov.cn/2026/09-24/246366.html\n- [SE153] 腾讯新闻（转载河南日报客户端）《省十四届人大常委会第二十六次会议闭幕 会议接受王凯辞去河南省人民政府省长职务 决定任命王陆进为河南省人民政府副省长、代理省长职务》，2026-09-24，https://news.qq.com/rain/a/20260924A0DYDE00\n- [SE154] 中国政府网（转央视网《新闻联播》）《全国秋粮收获有序推进》，2026-09-26（央视首播2026-09-26），https://www.gov.cn/yaowen/liebiao/202609/content_7082160.htm\n- [SE155] 凤凰网大风号（转河南日报，记者王延辉、刘一洁）《2026年中国农民丰收节河南省主场活动在濮阳清丰举行》，2026-09-23（活动2026-09-23举行），https://feng.ifeng.com/c/8wfoVr7To6V\n- [SE156] 人民网财经《京港高铁雄商段将于9月28日开通运营》（国铁集团消息），2026-09-25，http://finance.people.com.cn/n1/2026/0925/c1004-40805649.html\n- [SE157] 中新网河南新闻《周口国家农高区\"高\"在何处？》，2026-09-21，https://www.ha.chinanews.com.cn/news/dfxw/2026/0921/70870.shtml\n\n## 关联专题\n\n- [[W12]]\n- [[W11]]\n- [[P01]]\n- [[D10]]\n- [[D11]]\n- [[D12]]\n", "W14-周报-2026-10-04.md": "\n# W14 · 河南时政周报（2026-09-28 — 2026-10-04）\n\n## ⚡ 快速知识卡\n\n本周（9月28日—10月4日）横跨\"节前收官+国庆开局\"两段，主线有三。人事新动线：新班子节前密集调研，9月27日周祖翼、王陆进赴兰考瞻仰焦裕禄纪念馆，9月29日到洛阳调研先进制造业并要求建强中原城市群副中心城市；9月30日王陆进主持省政府常务会议，重温习近平总书记关于河南工作的重要讲话精神。基建线：9月28日京港高铁雄商段正式开通，G3946次列车10时19分从商丘站首发，商丘站形成高铁、普速\"双十字\"交汇，台前东站结束不通高铁历史。假期经济线：国庆假期前段文旅消费升温，节前9月28日省交通运输厅发布高速免费7天出行提示，秋粮收购自9月下旬起有序展开。全周数字与事件口径均见文末来源，注意区分\"节前部署\"与\"假期实际数据\"。\n\n## 📖 本周要闻十条\n\n### 1. 9月27日：周祖翼、王陆进赴兰考瞻仰焦裕禄纪念馆\n\n9月27日，省委书记周祖翼，省委副书记、代省长王陆进到开封市兰考县焦裕禄纪念馆，调研传承弘扬焦裕禄精神工作。河南日报报道标题点明主旨：\"大力传承弘扬焦裕禄精神 扎扎实实推进乡村全面振兴和县域高质量发展\"。这是两位新任主政者到任后调研兰考的首站报道，把\"焦裕禄精神\"与\"乡村全面振兴、县域高质量发展\"并列提出，方向性极强。可考链条：兰考是焦裕禄精神的发源地，也是\"县域治理三起来\"（把强县和富民统一起来、把改革和发展结合起来、把城镇和乡村贯通起来）的首倡示范地；本库 D09（兰考东坝头镇共富工坊）即落地该县。此条与 W13\"省级领导班子调整\"直接衔接，是新班子施政信号的第一站。（来源[SE161]）\n\n### 2. 9月29日：周祖翼、王陆进在洛阳调研，要求建强中原城市群副中心城市\n\n9月29日，周祖翼、王陆进到洛阳市调研，其中一行到洛阳轴承集团股份有限公司了解先进制造业发展情况；河南日报报道标题为\"牢记嘱托 感恩奋进 真抓实干 加快建强中原城市群副中心城市\"。据每日经济新闻梳理，这是新任省委书记到任后首个专门调研的非省会地级市，其间洛阳的\"重要地位、重要作用\"被着重强调，并明确要求洛阳\"挑大梁、走在前\"。洛阳是\"十四五\"以来河南重点打造的中原城市群副中心城市，先进制造业（轴承、农机装备、盾构等）与文旅（隋唐洛阳城）是其两大支柱。此条是\"副中心城市+先进制造业+文旅融合\"三重考点的叠加素材。（来源[SE162]）\n\n### 3. 9月30日：王陆进主持省政府常务会议，重温习近平总书记关于河南工作的重要讲话精神\n\n9月30日，省委副书记、代省长王陆进主持召开省政府常务会议，重温习近平总书记关于河南工作的重要讲话和重要指示批示精神，传达学习习近平总书记就发展先进制造业作出的重要指示和全国先进制造业大会精神、在《求是》杂志发表的重要文章《在加强基础研究座谈会上的讲话》，研究有关工作。会议指出，习近平总书记关于河南工作的重要讲话和重要指示批示，为做好全省工作指明了前进方向、提供了根本遵循。注意：这是节前最后一次省政府常务会议公开报道，主题是\"学习+部署\"，未披露新的量化指标；10月10日的常务会议（研究统筹推进高质量发展和高水平保护等）属下一周期事件。（来源[SE163]）\n\n### 4. 9月28日：京港高铁雄商段正式开通，商丘站成为高铁、普速\"双十字\"枢纽\n\n9月28日，京港高铁雄安至商丘段（雄商高铁）正式开通运营。据中国铁路郑州局集团消息，10时19分，搭载177名旅客的G3946次列车从商丘站缓缓驶出，这是商丘首趟开往雄安方向的始发高铁。线路北起雄安站、南至商丘站，正线全长552公里，设计时速350公里，纵贯河北、山东、河南三省。在商丘站，雄商段南接已建成运营的京港高铁商丘至合肥段，并与东西向徐兰高铁及京九铁路、陇海铁路交会，商丘由此形成高铁、普速\"双十字\"交汇。中新网报道，新线开通后商丘站共增开高铁列车17列，商丘至北京行程较此前缩短近1小时，雄安至商丘最快2小时27分可达。此条与 W13 第7、8条（官宣）衔接，正式开通落在本周。（来源[SE164][SE165]）\n\n### 5. 台前东站投入使用：豫东北老区县两度成为\"进豫第一站\"\n\n雄商高铁在河南段设台前东、商丘两站。9月28日开通后，濮阳台前县结束不通高铁的历史。台前30年前因京九铁路成为\"高铁进豫第一站\"叙事的前身（京九铁路进豫第一站），如今再度以高铁进豫门户出现，\"老区+交通\"是现成的常识考点。此条数据口径沿用 W13 国铁集团官宣（正线全长552公里、全线16座车站），开通时点以9月28日国铁郑州局通报为准。（来源[SE164]）\n\n### 6. 节前部署：9月28日省交通运输厅发布国庆高速免费7天出行提示\n\n9月28日，河南省交通运输厅发布2026年国庆假期河南高速出行提示：国庆假期放假时间为10月1日（周四）至10月7日（周三）共7天；根据《交通运输部重大节假日免收小型客车通行费实施方案》，高速公路免费时段为10月1日0时至10月7日24时，免费车型为7座以下（含7座）载客车辆，以车辆驶离出口收费车道的时间为准。郑州日报、平顶山市政府网等多地政府门户同步转载提示。此条是\"重大节假日免通政策\"的年度例行应用，注意政策依据（交通运输部实施方案）与执行细节（驶离时间判定）两个考点层次。（来源[SE166]）\n\n### 7. 国庆假期文旅开局：假期前段市场升温，节后官方公布重点景区数据\n\n河南省文化和旅游厅10月7日通报（属假期结束后一周口径，此处作为本周假期效应的对应数据记录）：2026年国庆假期全省4A级及以上重点景区共接待游客1833.3万人次，实现营业收入11.6亿元；接待游客量前五景区为清明上河园、万岁山武侠城、云台山、龙门石窟、银基国际旅游度假区。注意口径边界：1833.3万人次是\"4A级及以上重点景区\"的窄口径，与2024年\"全省接待游客7991.6万人次\"的全口径不可直接比较；且通报发布于10月7日（下一周期），本周内仅可确认假期前段市场升温、开封万岁山武侠城发布限流通知等媒体报道口径。（来源[SE167]）\n\n### 8. 国庆消费：重点监测零售餐饮企业销售额22.27亿元（假期全周期口径）\n\n河南省商务厅10月8日通报（假期结束后口径，作为对应数据记录）：国庆假期全省重点监测的零售和餐饮企业累计实现销售总额（营业收入）22.27亿元；全省依托消费品以旧换新扩围提质、汽车购新补贴、有奖发票等政策组织系列促消费活动，据河南日报报道，全省联动谋划约900场金秋消费季活动。对照数据：中秋假期（9月25日—27日）同口径销售额为12.96亿元（9月27日省商务厅通报，属上一周期）。注意\"重点监测企业\"窄口径与\"全省社会消费品零售总额\"全口径的区别，勿混用。（来源[SE168][SE169]）\n\n### 9. 秋粮收购：9月24日全省秋粮收购工作会议部署，收购政策落地窗口\n\n9月24日，河南省粮食和物资储备局在郑州召开全省秋粮收购工作会议（国家粮食和物资储备局网站9月29日刊发），要求统筹市场化收购和政策性收储，坚决守住农民\"种粮卖得出\"的底线：一坚持市场化收购主导地位，二发挥中晚稻最低收购价托底作用、及时在符合条件的地区启动预案，三优化售粮服务，四强化受损粮食处置与风险防控，五严格执法监督。背景数据：国家粮储局9月21日国新办发布会介绍，全国已累计收购小麦1亿吨、早籼稻1200万吨，夏粮收购进度略快于上年。此条与 W13 秋收进度过半（7600多万亩）衔接：秋收推进的同时，\"收储政策线\"在节前完成部署，是\"粮食安全\"题型的政策闭环。（来源[SE170]）\n\n### 10. 国庆77周年：庆祝活动背景与河南假期保障主线\n\n10月1日，庆祝中华人民共和国成立77周年招待会在北京举行（中国政府网发布）。河南侧假期保障主线：节前各地政府门户密集发布出行提示与保供部署（如省交通运输厅高速免费提示、郑州交警双节出行提示），假期中文旅、商务部门的数据通报在节后集中发布。此条作为背景参照记录：77周年是2026年国庆的整数考点之一（2026—1949=77）。[注：庆祝招待会为中央层面活动，河南无对应省级专场公开报道，仅作背景]（来源[SE169]引述背景，另见[SE166]）\n\n## 📖 深度案例：雄商高铁开通——从\"官宣\"到\"首发\"的枢纽能级跃迁\n\n**主体与事件**：国铁集团、中国铁路郑州局集团（建设运营方），商丘市、濮阳市台前县（受益地方）。9月28日10时19分，搭载177名旅客的G3946次列车从商丘站驶出，京港高铁雄安至商丘段正式开通运营（[SE164][SE165]）。\n\n**背景与问题**：京港高铁是我国\"八纵八横\"高铁网的\"一纵\"，此前雄安至商丘段是通道上的关键缺口。对河南而言，问题有三层：一是豫东北（濮阳台前一带）长期不通高铁，革命老区县要素流通受限；二是商丘虽有\"高铁十字\"雏形，但京港通道未贯通前，承东启西、连南贯北的枢纽能级发挥不充分；三是京广高铁客流趋于饱和，京津冀与中原之间需要新通道分流。\n\n**做法与机制（三个层面）**：其一，贯通国家通道。雄商段正线全长552公里、设计时速350公里，北接雄安、南抵商丘，在商丘站南接已通车的京港高铁商合段，使京港（台）通道关键区段贯通（[SE164]）。其二，重构枢纽格局。商丘站与徐兰高铁及京九铁路、陇海铁路形成高铁、普速\"双十字\"交汇，成为继郑州东站之后河南省第二个高铁\"十字\"综合枢纽；新线开通后商丘站增开高铁列车17列，商丘可高铁直达全国24个省（自治区、直辖市），商丘至北京行程缩短近1小时（[SE165]）。其三，填补老区空白。河南段设台前东、商丘两站，台前东站是高铁进豫第一站，结束台前不通高铁的历史（[SE164]）。\n\n**成效与数据（区分已完成与目标性表述）**：已完成口径——9月28日开通运营、首发车开行（177名旅客）；商丘站增开17列高铁、商丘至北京缩短近1小时、雄安至商丘最快2小时27分（国铁郑州局与中新网口径）。目标性/方向性表述——\"为豫东北高质量发展注入强劲动能\"等为政策导向表述；开通初期雄安至北京西段为城际铁路、列车需降速通行（媒体报道口径），全线设计能力尚未完全释放，相关时效数据会随丰雄段建设动态调整，均不作为已完成事实引用。\n\n**局限与观察点**：其一，河南段仅约25公里，直接里程贡献有限，红利更多体现为通道与枢纽外部性，如何转化为产业承接需观察；其二，雄商段与京广高铁的客流分流效果、商丘东站城开发的实际带动，需后续运营数据验证；其三，台前等县域站的客流培育和班次密度存在不确定性，\"有站无车\"风险在同类线路已有先例。\n\n**可迁移点与评价**：其一，\"国家通道—省域枢纽—县域末梢\"的三级分析框架可迁移到任何干线铁路开通案例（如此前郑渝、济郑高铁），商丘\"双十字\"与郑州东\"十字\"的并读是\"综合交通枢纽体系\"标准材料。其二，老区县\"两度进豫第一站\"（京九铁路30年、高铁如今）是\"交通变迁见证区域发展\"的高辨识度叙事。其三，本条与 W13 第7、8条连读，可完整呈现\"规划—建设—官宣—开通\"的时间线，训练\"事件在不同周报中的口径衔接\"。\n\n**可考角度**：常识——雄商高铁开通日期（2026年9月28日）、正线全长（552公里）、设计时速（350公里）、河南段两站（台前东、商丘）、商丘首趟始发车次（G3946）；案例分析——高铁开通如何通过通道贯通与枢纽重构提升区域能级；材料写作——从\"双十字\"枢纽看商丘在承接产业转移与区域协调中的定位。\n\n**金句（适用主题：区域协调、基础设施建设、革命老区振兴）**：\n1. 一条高铁的贯通，改写的不只是运行图，更是一座城市在区域格局中的坐标。\n2. 枢纽的能级，不在于钢轨在境内延伸多少公里，而在于人流、物流、资金流在此能交汇多深。\n3. 让老区县从\"路网末梢\"变成\"通道门户\"，是基础设施均等化最直观的答卷。\n\n## 复盘与下周关注\n\n- 本周复盘：主线有三——新班子节前调研定调（9月27日兰考焦裕禄精神线、9月29日洛阳副中心与先进制造业线、9月30日省政府常务会议学习部署）、雄商高铁9月28日正式开通（衔接 W13 官宣）、国庆假期开局（节前高速免费等出行部署+假期文旅消费升温）。假期因素使本周省级会议披露明显减少，属正常节奏。\n- 下周关注：假期全周期官方数据（省文旅厅重点景区口径、省商务厅重点监测企业口径）正式发布与同比口径；节后首个省政府常务会议议题（后续为10月10日生态文明主题、10月11日省委常委会平安中国主题，均属下一周期）；雄商高铁开通后商丘枢纽运营数据；秋粮收购进度与中晚稻最低收购价预案启动情况；新班子调研下一站的选题方向。\n\n## 来源与证据\n\n- [SE161] 人民网河南频道（河南日报稿）《大力传承弘扬焦裕禄精神 扎扎实实推进乡村全面振兴和县域高质量发展》，2026-09-28（调研2026-09-27），http://henan.people.com.cn/n2/2026/0928/c351638-41709015.html\n- [SE162] 河南日报/每日经济新闻综合《中部副中心城市，被点名\"挑大梁\"》（含9月29日周祖翼、王陆进洛阳调研），2026-09-30，https://www.mrjjxw.com/articles/2026-09-30/4596022.html\n- [SE163] 搜狐网转载《王
