级；在隋唐洛阳城玄武门遗址保护展示工程现场强调统筹文物保护和城市风貌提升。座谈会上王凯要求洛阳用好中央财政支持实施城市更新行动的政策机遇，因地制宜推进完整社区建设，加大地下管网改造力度，健全多元化投融资方式。此条是W05周报7月28日常务会议\"城市更新三年行动\"部署在省辖市层面的落地观察点。（来源[SE68]）\n\n### 5. 8月8日刘宁王凯在郑州督导调研防汛备汛：常庄水库现场会提五点要求\n当前正值防汛关键期，8月8日，省委书记刘宁、省长王凯在郑州市督导调研防汛备汛工作，先后察看荥阳市丁店水库、中原区常庄水库和南水北调中线郑州段贾峪河倒虹吸。刘宁在常庄水库运行中心主持召开工作现场会，指出持续增强的厄尔尼诺气候事件增加极端天气风险，近日受台风\"白海豚\"影响我省部分地区预计有大到暴雨，要求深入践行\"四个宁可\"理念，并从提升预警精度、持续排险除患、科学管护水库（严格落实水库防汛\"三个责任人\"和\"三个重点环节\"）、强化力量预置及早避险转移、拧紧责任链条五个方面作出部署；同时强调安全生产\"三管三必须\"。（来源[SE69][SE70]）\n\n### 6. 8月8日省气象局、省农业农村厅联合发布农田渍涝灾害风险预警\n受台风\"白海豚\"影响，预计8月10日至13日河南东南部、中东部和北部部分县（市、区）有暴雨、大暴雨，其他县（市、区）中到大雨；与前期土壤偏湿地块叠加，全省大部存在农田渍涝风险，其中豫北东部、中东部及豫南大部风险高，降水伴7至8级阵风、局地玉米有倒伏风险。本周全省秋粮田管的重心已从W04—W05周期的\"抗旱保秋\"切换为\"防渍涝、防倒伏\"，旱涝急转特征进一步显性化。（来源[SE71]）\n\n### 7. 农业农村部全国秋粮生产现场推进会：奋战100天夺秋粮丰收\n新华社8月3日电，农业农村部近日在山东德州召开全国秋粮生产现场推进会，要求扎实推进\"奋战100天强田管抗灾害夺秋粮丰收行动\"，分作物分区域落实肥水管理、\"一喷多促\"等措施；盯牢暴雨洪涝、干旱、高温热害、台风等灾害；盯紧玉米螟和南方锈病等重大病虫害，推进统防统治。河南作为13个作重点交流发言的粮食主产省之一，本周田管部署与上条渍涝预警直接衔接。（来源[SE72]）\n\n### 8. 高招：普通高职（专科）批8月5—7日录取，8月8日征集志愿\n本周高招进入专科普通批：按7月8日公布的批次安排，普通高职（专科）批8月5日至7日录取；8月8日9:00—18:00进行普通高职（专科）批征集志愿填报（未完成计划面向符合条件考生征集，投档以当次征集志愿为依据），承接W05专科提前批（8月1—2日）的录取节奏。后续节点：8月10日省教育考试院发布普通高职（专科）批再次征集志愿通知，8月12日9:00—13日18:00填报，涉及高校136所（此为下一周期节点，作衔接引用）。（来源[SE74][SE76]）\n\n### 9. 8月7日省委常委会会议召开\n8月7日，省委书记刘宁主持召开省委常委会会议（载于河南政协\"每日要闻速览\"8月7日期\"省内要闻\"栏）。[存疑：该次会议的具体议题、审议文件未检索到白名单媒体的公开报道原文，暂不引具体内容，仅记录会议发生的时间与主持人]\n\n### 10. 第18个全民健身日：《全民健身计划（2026—2030年）》后的第一个全民健身日\n8月8日是我国第18个全民健身日。国务院日前印发《全民健身计划（2026—2030年）》，对\"十五五\"时期全民健身作出部署：到2030年人均体育场地面积达到4平方米左右，每千人拥有社会体育指导员3.3名左右，经常参加体育锻炼人数比例达到40%左右（以上均为规划目标值，非已完成数据）；部署运用人工智能赋能全民健身、实施学生体质强健计划、扩大体卫融合服务供给等10个方面任务。河南专家解读指出，少林武术、太极拳扎根民间是河南普及全民健身的文化优势，但城乡之间科学健身指导资源不均衡仍是短板。（来源[SE73][SE75]）\n\n## 📖 深度案例：台风\"白海豚\"来袭前的河南防汛备汛——\"四个宁可\"如何落到水库、农田与基层网格\n\n**主体与事件**：8月8日，省委书记刘宁、省长王凯在郑州市督导调研防汛备汛工作并在常庄水库运行中心主持召开工作现场会；同日省气象局、省农业农村厅联合发布农田渍涝灾害风险预警。此时距台风\"白海豚\"对河南的主要降雨过程（8月10—13日）仅两三天，本周构成\"临灾备汛\"的完整观察窗口。（来源[SE69][SE70][SE71]）\n\n**背景与问题**：河南地处南北气候过渡带，\"七下八上\"防汛关键期后段仍面临台风北上带来的极端降雨风险，历史上特大暴雨灾害教训深刻。本周的特殊性在于：前期高温伏旱使部分地区土壤偏湿，旱涝急转条件下，台风降雨叠加土壤饱和，极易形成农田渍涝、山洪地质灾害与城市内涝的复合风险。核心问题：一个体量近亿人口、水库密布、秋粮在田的省份，如何在两三天窗口期内把防御体系从\"备战\"切换到\"迎战\"。\n\n**做法与机制（四个抓手）**：一是\"理念先行\"——刘宁强调深入践行\"四个宁可\"理念（宁可十防九空、不可失防万一），深刻汲取历史上特大暴雨灾害教训，做到思想不松、标准不降、力度不减。二是\"责任到库\"——在丁店水库、常庄水库要求全面压实水库安全责任，健全责任机制、调度机制、管护机制，逐水库完善雨水情监测预报系统、调度运行方案和防汛应急预案，严格落实水库防汛\"三个责任人\"和\"三个重点环节\"；对南水北调中线贾峪河倒虹吸强调工程安全、供水安全、水质安全\"三个安全\"。三是\"部门联动预警\"——气象与农业农村两部门联合发布农田渍涝灾害风险预警，把气象预报直接转译为分区域的农田风险等级（豫北东部、中东部及豫南大部风险高），并给出针对性防范提示（排涝散墒、防倒伏）。四是\"指挥体系与转移预案\"——建强直达一线的防汛应急指挥体系，紧盯山洪地质灾害风险点、城市低洼易涝点、人口密集区等重点部位深化排查整治，强化力量预置、及早避险转移，常态化开展实战演练。（来源[SE69][SE70][SE71]）\n\n**成效与数据（区分部署要求与实际结果）**：本周内可确认的是部署与预警层面的动作——现场会五点要求、联合预警及风险分区、逐水库责任机制要求；台风降雨及其应对结果（响应等级、转移人数、灾情）发生在8月10日之后，属下一周期，本文不引任何\"已转移X人\"\"已排涝X亩\"之类的数据。同期可引用的正面背景是：刘宁后来在批示中回顾，入汛以来全省成功应对了9次大范围强对流天气和5次暴雨天气过程（该表述出自8月10日省防指台风防范应对会议报道，为已完成的阶段性总结，引用时注意时间口径在8月10日）。（来源[SE69][SE70][SE71]）\n\n**局限与观察点**：其一，预警精度与\"叫应\"机制是历次极端降雨应对的薄弱环节，直达基层的应急指挥体系能否在夜间、断电断网条件下生效，有待实战检验；其二，农田渍涝风险的防范主体是千家万户小农户，预警到田块、措施到人之间存在\"最后一公里\"落差，局地玉米倒伏风险的处置窗口极短；其三，\"三个责任人\"等制度在部分地区存在挂名现象，责任压实程度只能通过巡查暗访间接验证。（来源[SE69][SE70]）\n\n**可迁移点与评价**：其一，\"理念—责任—预警—转移\"四层递进可作为应急治理类案例分析通用框架；其二，气象与农业部门\"联合发布分区域风险预警\"是跨部门协同（对应A05专题）的河南样本；其三，常庄水库本身是\"75·8\"洪水的标志性地点，选择在此召开现场会具有强烈的警示意义，答题时可用\"从历史教训到制度防范\"的叙事。（来源[SE69][SE70][SE71]）\n\n**可考角度**：常识——水库防汛\"三个责任人\"\"三个重点环节\"，\"四个宁可\"理念；案例分析——河南如何在一周内完成从抗旱保秋到防涝防台风的\"旱涝急转\"切换；材料写作——宁可十防九空，不可失防万一：防汛答卷上的责任刻度。\n\n**金句（适用主题：应急治理、人民至上、基层治理）**：\n1. 防汛的账，宁可白算九次，不能少算一次。\n2. 预警跑在洪水前面，责任落在堤坝之上，干部守在群众身边。\n3. 把隐患当险情防，把险情当灾情打，才是对生命真正的敬畏。\n\n## 复盘与下周关注\n\n- 下周关注：台风\"白海豚\"降雨过程（8月10—13日）应对与灾情、应急响应等级变化；普通高职（专科）批再次征集志愿（8月12—13日）及高招收尾；农田渍涝灾害应对与秋粮\"一喷多促\"进展；省委十一届十一次全会精神在各领域的落实动态。\n\n## 来源与证据\n\n- [SE65] 人民网河南频道（转河南日报）《中国共产党河南省第十一届委员会第十一次全体会议公报》，2026-08-04，http://henan.people.com.cn/n2/2026/0804/c351638-41658137.html\n- [SE66] 河南省地方金融监督管理局（转载河南日报）《王凯主持召开省政府常务会议 传达贯彻省委十一届十一次全会精神》，2026-08-04，https://www.hnswjrb.gov.cn/2026/08-04/3655074.html （转载；页面经搜索引擎检索核验标题与日期，正文抓取受限，细节以SE67同稿互证）\n- [SE67] 商丘新闻网（转载河南日报客户端）《王凯主持召开省政府常务会议 传达贯彻省委十一届十一次全会精神》，2026-08-04，http://www.sqxww.com/news/zhengwu/300935.html （转载；与SE66同稿）\n- [SE68] 洛阳市人民政府网（转载河南日报）《王凯在洛阳调研城市更新工作》，2026-08-06，https://www.ly.gov.cn/2026/08-06/1077906.html （转载；调研日期2026-08-05）\n- [SE69] 河南省政协网（转河南日报）《刘宁王凯在郑州市督导调研防汛备汛工作时强调 绷紧防汛安全之弦 守牢安全生产底线 坚决维护人民群众生命财产安全》，2026-08-08，https://www.hnzx.gov.cn/2026/08-08/4369356.html （转载）\n- [SE70] 新华网河南频道（转河南日报）《刘宁王凯在郑州市督导调研防汛备汛工作》，2026-08-09，http://ha.news.cn/20260809/eb74b222d705450d9248b9713a630a63/c.html （转载；与SE69同稿）\n- [SE71] 新华网（新华社郑州8月8日电）《河南发布农田渍涝灾害风险预警》，2026-08-08，https://www.news.cn/20260808/62991c3c86bc4f61aade72f6612d3606/c.html\n- [SE72] 中国农业农村信息网（农业农村部种植业管理司）《农业农村部召开全国秋粮生产现场推进会 强调统筹抓好田间管理和农业防灾减灾救灾》，2026-08-03，https://www.agri.cn/zx/nyyw/202608/t20260803_8861026.htm\n- [SE73] 新华网河南频道（来源大河健康报）《全民健身日：从\"会运动\"到\"懂健康\"》，2026-08-08，http://www.ha.xinhuanet.com/20260808/a4c263d9b4f1448cac8aaea333220789/c.html （转载）\n- [SE74] 郑州日报（新华网河南频道转载）《河南高招录取今起开始 今年至少进行5次征集志愿》，2026-07-08，http://ha.news.cn/20260708/e5542255862d43beb5436f239f0c126d/c.html （转载；取其批次时间表作为8月5—7日录取、8月8日征集志愿的依据）\n- [SE75] 河南省政协网《河南政协\"每日要闻速览\"（8月7日）》，2026-08-07，https://hnzx.gov.cn/2026/08-07/4369348.html （载8月7日省委常委会会议信息及第18个全民健身日背景）\n- [SE76] 华禹教育网（转河南省教育考试院）《河南：关于普通高职（专科）批再次征集志愿的通知》，2026-08-10，http://huaue.com/gkao2026/2026810101241.htm （转载；属下一周期节点，仅作衔接引用）\n\n## 关联专题\n\n- [[W05]]\n- [[W04]]\n- [[P01]]\n- [[D08]]\n-\n", "W07-周报-2026-08-16.md": "\n# W07 · 河南时政周报（2026-08-10 — 2026-08-16）\n\n## ⚡ 快速知识卡\n\n\n本周（8月10—16日）河南时政被一条主线贯穿：台风“白海豚”残余环流带来的强降雨及全省应对。8月10日13时省防指启动防汛四级应急响应；11—12日中东部暴雨到大暴雨、平顶山和洛阳局地特大暴雨；12日国家防总、应急管理部将河南响应由四级提升至三级；随后全省转入“排涝、防倒伏、防病虫害”秋粮抢救阶段——截至13日投入农机具2.9万余台、排除农田积水21万亩；16日11时省防指调整响应等级，仅许昌、漯河、周口维持四级，完成“预警—响应—抢险—退出”闭环，构成深度案例。非防汛线：高招专科批再次征集志愿（136所高校）收官；河南10条公路入选全国“2026年度美丽公路”。考法以常识（响应等级时间线、台风生命周期）与案例分析（跨部门协同、灾后农业管理）为主。\n\n## 📖 本周要闻十条\n\n### 1. 8月10日省防指启动防汛四级应急响应\n\n8月10日9时30分，河南省气象台发布暴雨黄色预警：预计10日14时至11日14时，郑州东南部、开封南部、商丘、平顶山东部、许昌、漯河、周口、南阳东部、驻马店、信阳部分县（市、区）有暴雨，其中商丘东部、平顶山东部、周口、南阳东部、驻马店、信阳部分县（市、区）有大暴雨，局地特大暴雨（个别点200到300毫米），并伴有短时强降水（最大小时降水量60到100毫米）、局地雷暴大风（8到10级）等强对流天气。经会商研判，根据《河南省防汛应急预案》有关规定，省防指决定于8月10日13时启动防汛四级应急响应，要求聚焦水库、河道堤防、南水北调、高速公路等重点部位落实巡查防守，紧盯涵洞、隧道、地铁、地下空间、漫水路面等薄弱环节，突出景区、学校、养老机构、医疗机构、施工营地等重点场所提前组织避险转移。（来源[SE77]）\n\n### 2. 台风\"白海豚\"登陆减弱，残余环流持续影响河南\n\n今年第13号台风\"白海豚\"于8月9日17时30分前后以强台风级在浙江台州玉环沿海登陆（W06周报已作备汛铺垫），随后深入内陆持续减弱。8月11日8时，减弱为热带风暴级的\"白海豚\"中心位于湖北黄冈境内；河南省气象台首席预报员介绍，台风在鄂豫皖交界处与西风带系统结合，预计11日至12日河南有强风雨天气，并伴有短时强降水、雷暴大风等强对流天气。中国气象局8月11日8时处于台风、暴雨、强对流二级应急响应。此条考点在于\"台风本体登陆不等于影响结束\"——残余环流与冷空气结合反而制造更大范围降雨。（来源[SE85][SE86]）\n\n### 3. 8月11日—12日河南中东部暴雨到大暴雨，国家防总将河南响应提升至三级\n\n8月11日，河南省中东部等地出现暴雨或大暴雨，平顶山、洛阳等局地特大暴雨。据气象部门预报，12日至15日黄淮中西部和南部、华北南部等地有暴雨或大暴雨，河南中部和西部沿山等地部分地区有特大暴雨。国家防总、应急管理部12日将针对河南省的防汛四级应急响应提升至三级；同日中央气象台继续发布暴雨橙色预警，水利部召开专题会商会研判\"白海豚\"残余环流影响（其时台风虽已停止编号，残余环流仍持续影响淮河流域西部南部、黄河中游小花区间等）。[存疑：据非白名单聚合页面检索，河南省防指亦于8月12日将省级响应提升至二级，未检索到白名单媒体的直接报道原文，暂不采信为正文事实]。（来源[SE78][SE85]）\n\n### 4. 农业农村部、中国气象局8月10日继续发布农田渍涝风险预警：河南中北部风险很高\n\n8月10日，农业农村部和中国气象局继续发布农田渍涝风险预警：受台风\"白海豚\"残余环流和北方降雨系统共同影响，10日至15日河南等地有暴雨到大暴雨，低洼农田渍涝风险高；其中河南中北部部分地区有特大暴雨，农田渍涝风险很高。预警建议相关地区及时清沟理渠、做好排涝机具物资准备、雨后及时排涝散墒、适时喷药追肥。此条与W06第6条（8月8日豫省两部门联合预警）构成\"国家—省级\"两级预警衔接，可作跨部门、跨层级协同的连续性素材。（来源[SE80]）\n\n### 5. 全省农田排涝：40多万亩短时积水，截至8月13日已排除21万亩\n\n据河南省农业农村厅粮食作物处一级调研员8月13日介绍，8月10日以来全省有40多万亩农田出现短时积水，部分玉米地块倒伏（倒伏面积有几万亩），积水集中周口、开封、许昌、漯河、平顶山等降水量较大的市。截至8月13日下午，全省已组织投入各类农机具2.9万余台抢险排涝，累计排除农田积水21万亩；省农业农村厅派出6个专家指导组赶赴降雨量偏大的6个省辖市，市县两级约1.2万人次农技人员深入田间。专家口径：玉米等高秆作物三天之内排除积水对产量影响有限，超过一周长期积水可能造成损失。（来源[SE79]）\n\n### 6. 8月12日省农业农村厅：农业防汛救灾进入关键时期，各级部门全面进入应急状态\n\n8月12日，省农业农村厅厅长孙巍峰在相关会议中指出，农业防汛救灾已经到了关键时期，各级农业农村部门要全面进入应急状态：重点排查农田积水、沟渠堵点等情况，防止农田长时间大面积积水；发挥信息化手段作用，推动线上快速调度核查与线下快速核实处置协同联动；密切关注雨后生产恢复，组织专家和农技人员深入一线，指导应急排涝、开沟散墒、\"一喷多促\"、雨后补肥等关键措施，为夺取秋粮和全年粮食丰产丰收提供支撑。此条承接W06\"全国秋粮生产现场推进会奋战100天\"的部署，是省级层面的战时落实。（来源[SE79]）\n\n### 7. 市域样本：商丘组建33支农业防汛专业服务队，前期已疏浚沟渠1.83万公里\n\n作为本轮农田应对的市域观察样本：商丘市农业农村局8月9日联合气象部门发布农田渍涝预警，10日启动农业防汛四级应急响应、12日提升至三级，落实24小时值班值守，联动气象、水利、应急等部门会商研判；全市组建33支共198人的农业防汛专业服务队下沉一线；此前全域推进农田沟渠疏浚，累计疏通沟渠1.83万公里、修缮渠系建筑物1535座，拉网式排查加固大棚、畜禽圈舍等农业设施5720余座，储备抽水、发电、开沟设备上万台套。农技专家提出倒伏作物\"分类施策\"：轻度倾斜不强行扶正，避免根系二次损伤。（来源[SE87]）\n\n### 8. 高招收官：专科批再次征集志愿8月12日—13日填报，涉及136所高校\n\n按8月10日河南省教育考试院通知，普通高职（专科）批再次征集志愿于8月12日9:00至13日18:00填报，涉及高校136所，承接W06记录的8月8日首次征集志愿，为2026年河南高招集中录取阶段的收尾节点。至此，自7月8日启动的河南高招录取进入尾声。此条可与W01—W06的批次时间线连缀成完整考点链：7月8日启动—7月21—25日本科批—8月5—7日专科批—8月8日征集—8月12—13日再次征集。（来源[SE83]）\n\n### 9. 河南10条公路入选全国\"2026年度美丽公路\"，沿太行高速安阳段为全省唯一高速公路项目\n\n中国公路学会旅游交通工作委员会近日公布\"2026年度美丽公路\"评选结果，全国共143个项目入选，河南10条公路上榜：生态伏牛一号旅游公路栾川段石张线、淅川县环库公路、济源南山产业旅游路等6条入选农村公路类别，黄河古都一号旅游公路济源段等3条入选普通国省干线类别，沿太行高速公路安阳段（S33）入选高速公路类别、系本年度全省唯一。沿太行高速安阳段全线位于红旗渠精神发源地林州市，全长84.88公里，纵贯9个乡镇61个行政村，北接河北太行高速、南联台辉高速，2024年12月28日通车。此条可关联\"交通＋文旅＋红色资源\"复合考点。（来源[SE81][SE82]）\n\n### 10. 8月16日省防指调整防汛应急响应等级：许昌、漯河、周口调为四级，其他省辖市终止响应\n\n8月16日，据省应急管理厅\"河南应急\"公众号消息：台风\"白海豚\"对河南省的影响已结束，大范围降雨过程已停止，河道、水库水位明显下降，各地险情得到有效控制，经会商研判，按照《河南省防汛应急预案》有关规定，省防指决定自8月16日11时将针对许昌市、漯河市、周口市的防汛应急响应等级调整为四级，其他省辖市（区）终止防汛应急响应；同时要求严密防范地质灾害滞后性风险，及时开展雨后复查，围绕退水期堤防坍塌、滑坡等风险严格落实堤防巡查防守，加快城乡、农田排涝，认真查灾、核灾、报灾。（来源[SE84]）\n\n## 📖 深度案例：从四级到终止——河南应对台风\"白海豚\"残余环流的七天闭环\n\n**主体与事件**：河南省防汛抗旱指挥部（省防指）及各成员单位、各省辖市。台风\"白海豚\"8月9日登陆浙江后深入内陆减弱停编，但其残余环流与冷空气结合，8月10日至15日给河南带来持续强降雨；省防指8月10日13时启动防汛四级响应，8月16日11时调整降级，历时约六天完成一个完整的应急响应周期。（来源[SE77][SE78][SE84]）\n\n**背景与问题**：本轮降雨有三个放大风险的因素。其一，雨带叠加：台风残余环流本就携带充足水汽，遇太行山、伏牛山地形抬升增幅，且与北方降雨系统结合，中央气象台8月10日预警\"河南中北部部分地区有特大暴雨，农田渍涝风险很高\"（[SE80]）。其二，前期土壤偏湿：W04—W05周期刚经历\"抗旱保秋\"，8月上旬高温伏旱与局地降雨使部分地块土壤饱和，旱涝急转。其三，秋粮在田：夏玉米普遍进入灌浆期，植株高大、重心上移，抗逆性下降，是决定粒重和产量的关键窗口。核心问题：一个近亿人口、秋粮在田的农业大省，如何在台风\"本体已走\"的麻痹风险下，对\"残余环流＋冷空气\"这种非典型致灾源保持足够响应强度。\n\n**做法与机制（四个环节）**：一是\"分级递进响应\"。8月10日省气象台暴雨黄色预警后省防指当日启动四级响应；11—12日雨情证实极端性（中东部暴雨大暴雨、平顶山洛阳局地特大暴雨）后，国家防总12日将针对河南的响应提升至三级，形成\"省级预警先手、国家层面加码\"的层级联动（[SE77][SE78]）。二是\"农田风险的专业化转译\"。农业农村部与中国气象局连续发布农田渍涝风险预警，把气象预报直接转译为\"低洼农田渍涝风险高/很高\"的分区分级表述；省级层面8月8日两部门联合预警（W06已述）与国家预警衔接，市县再落到具体地块（商丘8月9日发布、10日启动响应）（[SE80][SE87]）。三是\"到田到机具的抢险动员\"。截至8月13日全省投入农机具2.9万余台、排除积水21万亩，6个省级专家指导组赴重灾市，商丘单市即有33支198人专业服务队；技术路线清晰——\"排、扶、补、防\"四字法：抢排积水、倒伏分类处置（轻度不扶）、补施速效肥与\"一喷多促\"、防南方锈病等雨后高发病害（[SE79][SE87]）。四是\"退出机制与灾后管理并重\"。8月16日降级终止的同时，省防指明确要求防范地质灾害滞后性风险、退水期堤防巡查、查灾核灾报灾——把\"响应终止\"定义为\"灾后管理开始\"而非工作结束（[SE84]）。\n\n**成效与数据（区分已完成与持续中）**：截至8月13日下午可确认的已完成数据：投入农机具2.9万余台，排除农田积水21万亩，全省短时积水面积约40多万亩、倒伏几万亩（初步统计口径）；商丘前期疏浚沟渠1.83万公里、修缮渠系建筑物1535座、加固农业设施5720余座。专家评估\"短时积水（三天以内）对产量影响有限\"。整个降雨过程的人员伤亡、直接经济损失等灾情数据本周内未检索到白名单媒体发布的汇总数字，不作引用；8月16日降级后各地排涝、核灾仍在进行，属持续中事项。（来源[SE79][SE84][SE87]）\n\n**局限与观察点**：其一，非典型致灾源的认知难度——台风8月11日减弱、停编后，公众与基层易产生\"影响已过\"的松懈，而残余环流降雨的极端性恰恰在登陆之后显现，这对预警传播和\"叫应\"机制提出更高要求。其二，农田排涝的\"最后一公里\"依赖千家万户自组织与机具调度，低洼地块、断头沟是历年短板，商丘\"两年前提前疏浚\"的经验反证了平时投入的稀缺性。其三，灾情数据发布滞后于抢险节奏，查灾核灾的准确性直接影响后续救灾资金与保险理赔，退水期的时间窗口内如何平衡\"快报\"与\"核准\"值得跟踪。（来源[SE79][SE84]）\n\n**可迁移点与评价**：其一，\"预警—响应—抢险—退出\"四段式可作为应急管理类案例的通用分析框架，本周河南案例链条完整、节点清晰，适合直接引用。其二，\"国家—省—市\"三级预警与响应的传导（国家三级响应与省级响应叠加）是央地协同（对应A05、A02专题）的鲜活素材。其三，倒伏作物\"分类施策、避免盲目扶正造成二次伤害\"体现精准治理思维，可迁移到政策执行\"精细化\"议题。其四，与W06深度案例（临灾备汛）对照，两周构成\"备—战—复\"完整叙事，答题时可用\"上周的五个现场会要求，本周都变成了田间地头的抽水泵\"这类实证句式。（来源[SE77]—[SE87]）\n\n**可考角度**：常识——防汛应急响应四级至一级的等级序列与启动主体、\"一喷多促\"含义、台风生命史概念；案例分析——河南如何应对\"台风停编后\"的残余环流极端降雨；材料写作——从\"宁可十防九空\"到\"退水不退责\"：一场跨越两周的防汛答卷。\n\n**金句（适用主题：应急治理、粮食安全、基层落实）**：\n1. 台风走了，警报不能走；雨停了，责任不能停。\n2. 响应升级看雨情，响应降级看险情，核灾报灾看民情。\n3. 排涝抢的是三天窗口，丰收保的是全年盘子。\n\n## 复盘与下周关注\n\n- 下周关注：全省查灾核灾与灾后恢复重建动态、省级层面的灾情汇总发布；秋粮\"一喷多促\"集中作业与南方锈病防控进展；许昌、漯河、周口四级响应的退出时点；省委十一届十一次全会精神与下半年经济部署的落实动态；高招录取全面收官后各省辖市录取数据发布。\n\n## 来源与证据\n\n- [SE77] 大河网（中新网河南转载）《河南启动防汛四级应急响应》，2026-08-10，http://www.ha.chinanews.com.cn/news/hnxw/2026/0810/70115.shtml （转载大河网，记者王怡潇）\n- [SE78] 新华网（新华社北京8月12日电）《国家防总、应急管理部对河南启动防汛三级应急响应》，2026-08-12，https://www.news.cn/20260812/340d190f0d1c4119bc305281f15951ba/c.html\n- [SE79] 央广网（总台中国之声《新闻纵横》）《河南各地抓紧排除农田积水 最大限度减轻强降雨对农业生产的影响》，2026-08-14，https://china.cnr.cn/yaowen/20260814/t20260814_527761927.shtml\n- [SE80] 中国经济网（转中央气象台网站）《农业农村部和中国气象局继续发布农田渍涝风险预警》，2026-08-10，http://www.ce.cn/xwzx/gnsz/gdxw/202608/t20260810_3139184.shtml （转载）\n- [SE81] 河南日报（中共河南省委宣传部党建网转载）《跻身全国美丽公路标杆行列 沿太行高速公路安阳段究竟有多美》，2026-08-10，http://www.hnswxcb.com/2026/08-10/465461.html （转载）\n- [SE82] 河南交通投资集团网站《沿太行高速公路安阳段入选2026年度美丽公路项目展示交流活动名单》，2026-08-05，https://www.hnjttz.com/new/show-68561.html\n- [SE83] 河南省教育考试院（河南日报网\"要闻\"栏目转载）《136所！8月12日9:00-13日18:00普通高职（专科）批再次征集志愿的通知》，2026-08-10，https://www.henandaily.cn/news/2026-08 （栏目列表页核验标题与日期）\n- [SE84] 河南省应急管理厅\"河南应急\"公众号（财联社新浪财经转载）《河南调整防汛应急响应等级》，2026-08-16，https://finance.sina.com.cn/jjxw/2026-08-16/doc-ininnqpu9901165.shtml （转载）\n- [SE85] 新华网（新华社北京8月11日电）《台风\"白海豚\"致强降雨 多地积极应对》，2026-08-11，https://www.news.cn/politics/20260811/4da31b6135064119a0aac25470821780/c.html\n- [SE86] 科技日报《逐渐深入内陆 多地有大风暴雨 台风\"白海豚\"最新情况》，2026-08-11，https://www.stdaily.com/web/gdxw/2026-08/11/content_562243.html\n- [SE87] 商丘市人民政府网（转商丘日报）《暴雨过后 秋粮田间咋管理》，2026-08-14，https://www.shangqiu.gov.cn/hd/hygq/content_310621 （转载）\n\n## 关联专题\n\n- [[W06]]\n- [[W05]]\n- [[D10]]\n- [[D08]]\n-\n-\n", "W08-周报-2026-08-23.md": "\n# W08 · 河南时政周报（2026-08-17 — 2026-08-23）\n\n## ⚡ 快速知识卡\n\n\n本周（8月17—23日）河南时政主线从“战时”转向“战后”：台风“白海豚”抢险取得阶段性胜利，重心转向灾后恢复重建。8月18日刘宁赴周口、漯河督导防汛和灾后重建，同日王凯主持省政府常务会议研究灾后恢复、新型储能产业；8月21日省委常委会学习《提高防灾减灾救灾能力》并研究经济工作，全省实现“无因灾死亡”、各市终止防汛四级响应，构成“应急—重建”衔接的深度案例。经济线：8月19日省统计局公布1—7月数据（规上工业增加值增7.5%、进出口增25.8%）；开放线：豫台经贸洽谈会鹤壁开幕、签约27个项目；产业线：郑州、平顶山、濮阳入选国家氢能综合应用试点；平漯周高铁转体成功；省运会在安阳开幕。考法以案例分析（灾后重建系统性）与常识（经济指标、氢能试点）为主。\n\n## 📖 本周要闻十条\n\n### 1. 8月21日省委常委会会议：学习防灾减灾救灾重要文章，研究经济工作\n\n8月21日，省委书记刘宁主持召开省委常委会会议。会议认真学习习近平总书记在纪念江泽民同志诞辰100周年大会上的重要讲话；学习贯彻习近平总书记在《求是》杂志发表的重要文章《提高防灾减灾救灾能力》，强调树牢\"四个宁可\"理念，落实预警叫应响应联动和管控措施，在毫不松懈抓好防汛的同时统筹推进\"白海豚\"台风暴雨洪水防御和灾后恢复重建，做好复工复产和就业帮扶。会议研究经济工作，要求聚焦\"1+2+4+N\"目标任务体系，着力用好政策、扩大内需，聚力建强枢纽、筑牢支点，坚决打好打赢经济发展夏秋季战役；当前正值秋粮产量形成关键时期，要加紧推进受灾地区农业生产恢复，科学开展改种补种，确保全年粮食丰产丰收。会议还部署持续深化主流媒体系统性变革。（来源[SE89]）\n\n### 2. 8月18日省政府常务会议：研究灾后恢复、新型储能产业和三部条例草案\n\n8月18日，省长王凯主持召开省政府常务会议。会议强调当前重点抓好灾后恢复：迅速组织灾情核查统计，加快排除蓄滞洪区、城市内涝、农田积水，分类实施受损住房、基础设施修复重建，加强受灾群众监测帮扶、防止因灾返贫致贫，抓紧谋划实施灾后恢复重建项目。会议传达学习国务院第十二次全体会议精神，要求抓好\"十五五\"规划落地实施、扎实推进\"六张网\"规划建设、深入实施城市更新行动。会议研究新型储能产业发展，提出坚持多元化路线布局和全产业链协同发展，培育具有特色优势的新型储能产业链群；研究《河南省内部审计条例（草案）》《河南省移动源污染防治条例（草案）》《河南省农村集体经济组织条例（草案）》。（来源[SE90]）\n\n### 3. 8月19日省统计局公布1—7月经济数据：规上工业增长7.5%，进出口增长25.8%\n\n8月19日，河南省统计局公布2026年1—7月全省经济运行情况（已完成数据）：规模以上工业增加值同比增长7.5%，其中高技术制造业增加值增长26.1%、对全省规上工业增长贡献率38.3%；锂离子电池、新能源汽车产量分别增长101.3%、32.9%。社会消费品零售总额16750.07亿元，同比增长2.6%。固定资产投资同比下降1.1%，扣除房地产开发投资后增长1.9%；高技术制造业投资增长11.5%。进出口总值6088.6亿元，同比增长25.8%，其中出口增长14.9%、进口增长47.8%。城镇新增就业83.53万人。居民消费价格同比上涨1.1%。省统计局口径指出\"稳\"的基础尚需巩固，下阶段坚决打好打赢经济发展夏秋季战役。（来源[SE91]）\n\n### 4. 前7个月增值税发票数据：工业销售收入增长9.0%，制造业增长11.0%\n\n8月20日，国家税务总局河南省税务局发布今年前7个月增值税发票数据（已完成数据）：全省工业销售收入同比增长9.0%，制造业销售收入增长11.0%，其中计算机通信和其他电子设备制造业、电气机械和器材制造业分别增长42.8%、20.1%；高技术制造业销售收入增长36.0%；住宿餐饮业销售收入增长7.2%，文化艺术业增长23.2%。高技术产业购进与固定资产投资密切相关的机械设备建筑服务不动产金额同比增长37.8%。此条与第3条统计局数据构成\"税务发票数据—统计核算数据\"的交叉印证素材，可考\"用微观交易数据观察宏观经济\"的方法论角度。（来源[SE92]）\n\n### 5. 8月18日刘宁赴周口漯河督导灾后重建：从抢险转向重建\n\n8月18日，省委书记刘宁到周口市、漯河市督导调研防汛和台风\"白海豚\"强降雨灾后重建工作，察看沙颍河茅窝险工、西华县大王庄镇积水农田、舞阳县泥河洼滞洪区纸房退水闸和北舞渡镇中心学校群众安置点，要求抢抓时机加快排涝、落实开沟散墒、\"一喷多促\"、雨后补肥等措施，因地制宜开展汛后农作物改种补种，多措并举力促\"减产不减收\"。刘宁指出全省防指系统调度下，抢险救灾取得阶段性胜利，要把工作重心逐渐转向统筹推进灾后恢复重建，全域防疫消杀、分批回迁、复工复产和就业帮扶；同时强调目前仍处于主汛期，坚持依法科学防汛。（来源[SE93]）\n\n### 6. 8月19日省运会在安阳开幕：设30个大项759个小项，首次设冬季项目\n\n8月19日晚，河南省第十五届运动会暨第九届残疾人运动会在安阳市文体中心开幕，省委书记刘宁宣布开幕，省长王凯致开幕词，邓亚萍点燃主火炬。本届省运会由省政府主办，设青少年竞技组、学生组、社会组3个组别，其中青少年竞技组设30个大项759个小项，是设置项目最多的一届，并首次设置冬季运动项目；省残运会设15个大项、370个小项，9月10日开赛、9月17日闭幕。开幕式文体展演《鼎立中原谱新篇》以甲骨文、青铜器、红旗渠精神为元素。此条可关联\"体育＋文旅＋城市营销\"复合考点。（来源[SE94]）\n\n### 7. 河南污染防治\"成绩单\"：优良天数增量居全国第一\n\n8月19日，省政府新闻办召开新闻发布会介绍污染防治攻坚成果：截至8月18日，全省今年优良天数同比增加22.5天，增量居全国第一；重污染天数2天，位次前移5位。截至今年7月底，147个国控断面水质Ⅲ类及以上占比达87.1%，同比提升9.5个百分点，位列全国第三；黄河水连续6年保持Ⅱ类，丹江水稳定保持在Ⅱ类及以上标准。今年以来立案4465件、同比上升28.4%，行刑衔接110件。全省42个县（市、区）完成美丽乡村建设任务，周口市淮阳区入选全国第一批美丽乡村先行区名单；力争2026年年底基本消除存量农村黑臭水体（目标值）。（来源[SE95]）\n\n### 8. 郑州平顶山濮阳入选国家氢能综合应用试点，黄河几字弯—中原城市群为五大试点之一\n\n记者8月20日获悉，工业和信息化部、财政部、国家发展改革委同意在京津冀、大湾区、东北（含蒙东）—长三角、新疆—成渝、黄河几字弯—中原等5个城市群开展氢能综合应用试点，河南郑州市、平顶山市、濮阳市入选。黄河几字弯—中原城市群以鄂尔多斯、郑州为\"双核\"，构建\"双核引领、双轴串联、多极联动\"空间布局；试点目标为通过4年建设推动氢气累计用量超90万吨（目标值），预计带动万亿级产业投资。平顶山已建成投产亚洲首个150万标准立方米盐穴储氢示范工程。此条承接\"新质生产力\"\"能源转型\"主线，可作产业政策布局类常识与案例素材。（来源[SE96]）\n\n### 9. 平漯周高铁成功跨越郑阜高铁，雄商高铁河南段进入运行试验\n\n8月20日凌晨，平漯周高铁站前九标郑阜上行联络线特大桥2×100米T构转体连续梁完成精准转体，成功跨越郑阜高铁干线。该转体梁全长201.5米、总重约1.5万吨，施工仅用40分钟完成25度转体就位。平漯周高铁是国家\"八纵八横\"高铁网重要联络通道，全长199.7公里、设计时速350公里，计划2027年年底建成通车（目标值）。同期雄商高铁河南段已进入运行试验阶段，向今年9月通车目标冲刺；焦济洛平高铁\"焦平一号\"盾构机始发，为世界最大直径土压平衡盾构高铁隧道。\"十五五\"期间河南将建成雄商、平漯周、焦济洛平、南信合等多条高铁。（来源[SE97]）\n\n### 10. 2026豫台经贸洽谈会在鹤壁开幕，签约项目27个\n\n8月21日，2026豫台经贸洽谈会暨两岸智能装备制造对接活动在鹤壁开幕，两岸企业家峰会大陆方面理事长郭金龙、台湾方面理事长刘兆玄出席并致辞。本次大会由国务院台办、省政府共同主办，共签约项目27个，涉及人工智能、电子信息、装备制造等领域（已完成口径）。8月20日刘宁会见了活动重要嘉宾和台商代表。此条可关联\"对台工作＋招商引资＋内陆开放高地\"复合考点，与第3条外贸数据、信阳港固始港区建设共同构成河南开放型经济的周内观察切片。（来源[SE98]）\n\n### 补充要点：三条国家级骨干流通走廊落子河南；信阳港固始港区冲刺9月底开港\n\n国家现代流通体系建设\"十五五\"规划明确，经过河南的\"国字头\"重要商品骨干流通走廊有三条：晋冀鲁豫大宗商品走廊、全国棉花棉纱走廊、豫皖苏浙大宗商品走廊，河南成为全国唯一参与三条国家级重要商品骨干流通走廊建设的省份；此前国家布局的102个现代流通战略支点城市中河南已有郑州（综合型）、洛阳（复合型）、南阳、商丘（功能型）4市入选（来源[SE99]）。8月22日报道，信阳港固始港区中心作业区一期总投资12.6亿元、18个泊位、设计年吞吐量1062万吨，8月底基本完工、预计9月底开港运营（目标值），将与信阳港·淮滨中心港形成淮河港口\"双雄\"（来源[SE100]）。\n\n## 📖 深度案例：从抢险到重建——河南灾后恢复重建的\"转段\"一周\n\n**主体与事件**：河南省委、省政府及周口、漯河等受灾市县。8月16日省防指调整防汛应急响应等级后，8月17—23日全省一周内完成从\"抢险救灾\"到\"恢复重建\"的工作重心转换：8月17日副省长李酌赴许昌调研农业灾后恢复；8月18日刘宁赴周口漯河督导、王凯主持省政府常务会议部署灾后恢复；8月21日省委常委会会议学习《提高防灾减灾救灾能力》并作出统筹部署；8月23日《河南日报》确认\"全省实现无因灾死亡、所有城市均终止防汛四级应急响应\"。（来源[SE89][SE90][SE93]）\n\n**背景与问题**：本轮任务接续W07记录的\"白海豚\"残余环流强降雨。抢险阶段的胜利成果（无因灾死亡、险情有效控制）并不自动等于灾后无忧——退水期堤防坍塌、农田积水反排、受灾群众安置回迁、因灾返贫风险、企业复工复产安全等一系列次生问题集中在同一时间窗口。核心问题：一个刚经历流域性洪涝的农业大省，如何在主汛期尚未结束的前提下，把工作重心安全地\"切换\"到重建，做到\"重建不漏防汛、救灾不误秋粮\"。\n\n**做法与机制（四个环节）**：一是\"领导一线转段\"。8月17—18日，省委书记、省长、副省长分赴许昌、周口、漯河等重灾市，把\"督导调研\"变成现场办公——刘宁在泥河洼滞洪区要求针对管涌、渗水预置抢险力量，做到险情抢早抢小；李酌在许昌主持省市县乡村五级干部座谈会听取恢复生产意见（[SE93]）。二是\"会议系统部署\"。省政府常务会议把灾后恢复拆解为灾情核查统计、转移避险群众服务保障、排涝除渍、受损住房与基础设施分类修复、环境清理消杀、复工复产安全等具体事项，并同步研究灾后恢复重建项目谋划，把\"应急\"延伸为\"工程\"（[SE90]）。三是\"农业抢救优先\"。正值秋粮产量形成关键期，省里明确\"田间排涝—改种补种—一喷多促—定损理赔\"链条，要求农业保险机构应赔尽赔、早赔快赔，聚焦独居老人、特困人员等特殊群体走访排查，把粮食安全和防止因灾返贫两条底线同时守住（[SE90][SE93]）。四是\"能力建设跟进\"。省委常委会会议学习《提高防灾减灾救灾能力》，要求强化源头管控、夯实基层基础、坚持党政共管，把抗洪救灾的斗争精神转化为高质量发展高效能治理的动能——用\"制度复盘\"承接\"实战检验\"（[SE89]）。\n\n**成效与数据（区分已完成与目标值）**：可确认的已完成口径：全省实现\"无因灾死亡\"；所有城市均终止防汛四级应急响应；抢险救灾取得阶段性胜利（[SE93]）。8月17—23日周内具体排涝面积、受损房屋修缮数量、保险已赔付金额等重建进度数据，本周未检索到省直部门发布的汇总数字，不作引用。农业恢复方面，改种补种、\"一喷多促\"等为正在推进事项；灾后恢复重建项目谋划属部署安排（目标性表述）。（来源[SE89][SE90][SE93]）\n\n**局限与观察点**：其一，主汛期未过与重建并行的资源张力——预案、队伍、物资既要保障在建工程，又要应对后续降雨，退水期堤防安全是当前最大风险点。其二，\"减产不减收\"目标高度依赖改种补种的农时窗口与保险理赔速度，定损标准、赔付时效的执行差异是基层矛盾易发环节。其三，因灾返贫监测与W04—W05周期的抗旱投入叠加，受灾县财政承受能力值得关注。（来源[SE90][SE93]）\n\n**可迁移点与评价**：其一，\"应急响应终止—工作重心转段—能力建设复盘\"三段式，可与W07\"预警—响应—抢险—退出\"闭环拼接成完整的\"防汛全周期\"分析框架，两周素材直接互证。其二，\"会议部署＋一线督导＋制度复盘\"组合体现省级治理\"闭环管理\"，可迁移到安全生产、公共卫生等应急管理议题。其三，把灾后重建与\"防止因灾返贫\"衔接，对应防返贫监测帮扶专题（D10），是\"底线思维\"的具体化素材。（来源[SE89][SE90][SE93]）\n\n**可考角度**：常识——防汛应急响应等级与退出条件、《提高防灾减灾救灾能力》刊发平台、\"四个宁可\"；案例分析——河南如何组织台风灾害后的恢复重建转段；材料写作——从\"守住生命防线\"到\"重建美好生活\"：一场灾害治理的两章答卷。\n\n**金句（适用主题：应急治理、防灾减灾、基层落实）**：\n1. 响应终止不是终点，重建转段才是答卷的下一页。\n2. 排涝抢的是农时，重建谋的是长远，复盘固的是机制。\n3. 减产不能减收，受灾不能返贫——底线思维要落到每一户。\n\n## 复盘与下周关注\n\n- 下周关注：省灾情汇总与灾后恢复重建项目清单发布；秋粮\"一喷多促\"与改种补种进度；雄商高铁通车时点（9月目标）；信阳港固始港区开港（9月底目标）；残运会9月10日开赛；氢能试点城市实施方案落地。\n\n## 来源与证据\n\n- [SE89] 河南日报 大象新闻（河南省人民政府网转载）《省委常委会召开会议 刘宁主持并讲话》，2026-08-21，https://www.henan.gov.cn/2026/08-21/3401536.html\n- [SE90] 河南政府网 大象新闻（河南省人民政府网）《王凯主持召开省政府常务会议》，2026-08-18，https://www.henan.gov.cn/2026/08-18/3400356.html\n- [SE91] 大河网（河南省人民政府网转载）《向新向优！河南1-7月经济运行情况公布》，2026-08-19，https://www.henan.gov.cn/2026/08-19/3400528.html\n- [SE92] 河南日报（河南省人民政府网转载）《制造底盘稳 消费引擎热——从1—7月增值税发票数据看全省经济运行态势》，2026-08-21，https://www.henan.gov.cn/2026/08-21/3401157.html\n- [SE93] 河南日报 大象新闻（河南省人民政府网转载）《刘宁到周口漯河督导调研防汛和灾后重建工作时强调 有力有序推进灾后恢复重建工作 加快防灾减灾救灾能力整体提升》，2026-08-18，https://www.henan.gov.cn/2026/08-18/3400359.html\n- [SE94] 河南日报 大象新闻（河南省人民政府网转载）《河南省第十五届运动会暨第九届残疾人运动会在安阳开幕 刘宁宣布开幕 王凯致开幕词》，2026-08-19，https://www.henan.gov.cn/2026/08-19/3400739.html\n- [SE95] 河南日报（河南省人民政府网转载）《河南污染防治亮出成绩单 优良天数增量居全国第一》，2026-08-20，https://www.henan.gov.cn/2026/08-20/3400769.html\n- [SE96] 河南日报（河南省人民政府网转载）《河南三市跻身国家氢能应用试点》，2026-08-23，https://www.henan.gov.cn/2026/08-23/3401578.html\n- [SE97] 河南日报（河南省人民政府网转载）《平漯周高铁成功跨越郑阜高铁 河南高铁建设持续提速》，2026-08-21，https://www.henan.gov.cn/2026/08-21/3401154.html\n- [SE98] 河南政府网（河南省人民政府网）《2026豫台经贸洽谈会暨两岸智能装备制造对接活动开幕 郭金龙出席并致辞》，2026-08-22，https://www.henan.gov.cn/2026/08-22/3401552.html\n- [SE99] 河南日报（河南省人民政府网转载）《三条\"国字头\"骨干流通走廊落子河南 连廊成网 流通中原》，2026-08-17，https://www.henan.gov.cn/2026/08-17/3399491.html\n- [SE100] 河南日报（河南省人民政府网转载）《信阳港固始港区中心作业区加力冲刺迎开港 豫货\"通江达海\"再添深水良港》，2026-08-22，https://www.henan.gov.cn/2026/08-22/3401550.html\n\n## 关联专题\n\n- [[W07]]\n- [[W06]]\n- [[P01]]\n- [[D11]]\n- [[D12]]\n"};

/* ---------- Markdown 渲染 ---------- */
function md(src){
  let lines=esc(src).split("\n"),out=[],inCode=false,inList=false,listType=null,inQuote=false,tableBuf=[];
  const inline=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[\[([^\]]+)\]\]/g,(m,id)=>{const t=DATA.topics.find(t=>t.id===id);return t?`<a href="javascript:void(0)" onclick="openTopic('${id}');return false">${t.id} ${t.title}</a>`:id})
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushTable=()=>{if(!tableBuf.length)return;
    let rows=tableBuf.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)&&r.trim());
    if(!rows.length){tableBuf=[];return}
    let h=`<table><thead><tr>${rows[0].replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<th>"+inline(c.trim())+"</th>").join("")}</tr></thead><tbody>`;
    for(const r of rows.slice(1))h+="<tr>"+r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>";
    out.push(h+"</tbody></table>");tableBuf=[]};
  const closeAll=()=>{if(tableBuf.length)flushTable();if(inList){out.push(listType==="ul"?"</ul>":"</ol>");inList=false}if(inQuote){out.push("</blockquote>");inQuote=false}};
  for(let ln of lines){
    if(/^```/.test(ln)){closeAll();out.push(inCode?"</pre>":"<pre>");inCode=!inCode;continue}
    if(inCode){out.push(ln);continue}
    let m;
    if(/^\s*\|/.test(ln)){tableBuf.push(ln);continue}
    closeAll();
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){
      const lv=m[1].length;
      if(lv<=3){const hid="h"+HEADING_IDS.length;HEADING_IDS.push({id:hid,level:lv,text:inline(m[2])});
        out.push(`<h${lv} id="${hid}">`+inline(m[2])+`</h${lv}>`)}
      else out.push("<h4>"+inline(m[2])+"</h4>");
    }
    else if(/^\s*[-*]\s/.test(ln)){
      if(!inList){out.push("<ul>");inList=true;listType="ul"}
      out.push("<li>"+inline(ln.replace(/^\s*[-*]\s/,""))+"</li>");
    }
    else if(/^\s*\d+[.、)]\s/.test(ln)){
      if(!inList){out.push("<ol>");inList=true;listType="ol"}
      out.push("<li>"+inline(ln.replace(/^\s*\d+[.、)]\s/,""))+"</li>");
    }
    else if(/^>\s?/.test(ln)){
      if(!inQuote){out.push("<blockquote>");inQuote=true}
      out.push(inline(ln.replace(/^>\s?/,"")));
    }
    else{
      if(/^\s*$/.test(ln))out.push("");
      else out.push("<p>"+inline(ln)+"</p>");
    }
  }
  closeAll();
  return out.join("\n");
}

/* ---------- 搜索 ---------- */
let SITEMS=null,SR_HITS=[];
function searchItems(){
  return DATA.topics.map(t=>{
    const mdtext=(MDS[t.file]||"").replace(/[#*`>|[\]()]/g," ");
    return {t,text:(t.id+" "+t.title+" "+t.tags.join(" ")+" "+((CATS[t.category]||{}).name||"")+" "+(t.card||"")+" "+mdtext).toLowerCase()};
  });
}
function doSearch(q){
  const box=document.getElementById("searchresults");
  if(!box)return;
  if(!SITEMS)SITEMS=searchItems();
  q=q.trim().toLowerCase();
  const sb=box.parentNode.querySelector(".searchbox");
  if(sb)sb.classList.toggle("hasval",!!q);
  if(!q){box.style.display="none";box.innerHTML="";SR_HITS=[];return}
  const words=q.split(/\s+/);
  SR_HITS=SITEMS.filter(it=>words.every(w=>it.text.includes(w))).slice(0,10);
  box.innerHTML=`<div class="sr-cap">搜索结果 · ${SR_HITS.length} 条</div>`+(SR_HITS.length?SR_HITS.map((it,i)=>{
    const t=it.t;
    return `<div class="sr-item${i===0?" sel":""}" data-id="${t.id}" onclick="event.stopPropagation();srOpen('${t.id}')">
      <div class="t"><span class="badge">${t.id}</span><span>${esc(t.title)}</span></div>
      <div class="d">${esc((t.card||t.tags.join(" · ")).slice(0,90))}</div></div>`}).join("")
    :`<div class="sr-empty">未找到与「${esc(q)}」相关的专题</div>`);
  box.style.display="block";
}
/* 修复：等当前点击事件结束（rAF）再销毁首页 DOM，避免访问已销毁节点导致 JS 异常 */
function srOpen(id){hideSearch();requestAnimationFrame(()=>openTopic(id))}
function hideSearch(){const b=document.getElementById("searchresults");if(!b)return;b.style.display="none";b.innerHTML="";SR_HITS=[]}
function clearSearch(){const i=document.getElementById("searchinput");if(i){i.value="";i.focus()}doSearch("")}
function srKey(e){
  const box=document.getElementById("searchresults");
  if(!box||box.style.display==="none")return;
  const items=[...box.querySelectorAll(".sr-item")];
  if(!items.length){if(e.key==="Escape")box.style.display="none";return}
  let i=items.findIndex(x=>x.classList.contains("sel"));
  if(e.key==="ArrowDown"){e.preventDefault();i=(i+1)%items.length}
  else if(e.key==="ArrowUp"){e.preventDefault();i=(i-1+items.length)%items.length}
  else if(e.key==="Enter"){e.preventDefault();const id=items[Math.max(i,0)].dataset.id;hideSearch();openTopic(id);return}
  else if(e.key==="Escape"){hideSearch();return}
  else return;
  items.forEach((x,j)=>x.classList.toggle("sel",j===i));
  items[i].scrollIntoView({block:"nearest"});
}

/* ---------- 文章视图 ---------- */
/* 修复：从正文中剥离"快速知识卡"小节单独前置渲染，深度正文不再重复显示 */
function splitCard(src){
  const m=src.match(/^#{2,3}\s*⚡\s*快速知识卡\s*\n([\s\S]*?)(?=\n#{1,3}\s|\s*$)/m);
  if(!m)return {card:"",body:src};
  return {card:m[1].trim(),body:src.replace(m[0],"").replace(/^\s*\n/,"").trim()};
}
function buildTOC(){
  return HEADING_IDS.map(x=>`<a class="${x.level===3?"lvl3":""}" id="toclink-${x.id}" onclick="jumpTo('${x.id}')">${x.text}</a>`).join("");
}
function jumpTo(id){const el=document.getElementById(id);if(!el)return;
  const y=el.getBoundingClientRect().top+window.scrollY-80;window.scrollTo({top:y,behavior:"smooth"})}
function topicView(id){
  const t=DATA.topics.find(t=>t.id===id);if(!t){home();return}
  const mdtext=MDS[t.file]||"（未找到正文）";
  const sp=splitCard(mdtext);
  HEADING_IDS=[];TOC_IDS=[];
  const rendered=md(sp.body);
  TOC_IDS=HEADING_IDS.map(x=>x.id);
  const srcs=t.sources.map(sid=>{const s=DATA.sources.find(s=>s.id===sid);
    return s?`<div class="srcitem">[${s.id}] ${esc(s.title)} — <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>（${s.type}，核实 ${s.checked_date}）</div>`:""}).join("");
  const rel=t.related.map(r=>{const rt=DATA.topics.find(x=>x.id===r);
    return rt?`<button onclick="openTopic('${r}')"><span class="rid">${r}</span><span class="rt">${esc(rt.title)}</span></button>`:""}).join("");
  let h=`<div class="page-article">
  <div id="articlecol">
    <button class="backtop" onclick="go('${t.category}')">← 返回${(CATS[t.category]||{}).name||"列表"}</button>
    <div class="artmeta"><span class="pill">${t.id}</span><span class="pill dim">证据等级：${t.evidence_level}</span><span class="pill dim">${t.status}</span><span>更新 ${t.updated}</span></div>
    ${sp.card?`<div class="kcard"><div class="kcap">${ICONS.zap} 快速知识卡</div><div class="md">${md(sp.card)}</div></div>`:""}
    <article class="md">${rendered}</article>
    ${srcs?`<div class="srcbox"><b>本专题来源（${t.sources.length} 条）</b>${srcs}</div>`:""}
    ${rel?`<div class="relbox"><h3>${ICONS.link} 关联专题</h3><div class="relbtns">${rel}</div></div>`:""}
    <button class="backtop" onclick="go('home')">← 返回首页</button>
  </div>
  <div id="toccol"><div class="toccap">本页目录</div><nav id="toc">${buildTOC()}</nav></div>
  </div>`;
  document.getElementById("content").innerHTML=h;
  highlightNav(id);window.scrollTo(0,0);
  setupTOCSpy();
}
function setupTOCSpy(){
  const links=TOC_IDS.map(i=>({id:i,el:document.getElementById(i),a:document.getElementById("toclink-"+i)})).filter(x=>x.el);
  if(!links.length)return;
  const onScroll=()=>{
    let cur=links[0].id;
    for(const l of links){if(l.el.getBoundingClientRect().top<100)cur=l.id}
    links.forEach(l=>l.a.classList.toggle("active",l.id===cur));
  };
  window.removeEventListener("scroll",window.__tocspy||(()=>{}));
  window.__tocspy=onScroll;window.addEventListener("scroll",onScroll,{passive:true});onScroll();
}
