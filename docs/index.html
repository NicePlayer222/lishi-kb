国政府网新华社原文；郑州实践取人民日报中原网转载。南阳、郑州成效数据均为官方自报口径，已在正文注明；未检索到针对河南清单实践的独立第三方评估，如实说明，不作推断。\n\n## 来源与证据\n\n- [SD60] 《河南南阳：紧盯关键环节 精准破解难题》，中共中央社会工作部网站，2025-04-14。[官方·自述口径]\n- [SD61] 《全国乡镇（街道）履职事项清单全部编制完成》，新华社（中国政府网），2025-07-30。[官方]\n- [SD62] 中办国办印发《关于用好乡镇（街道）履行职责事项清单的具体措施》，新华社（中国政府网），2026-05-19。[官方]\n- [SD63] 《在基层淬炼 以实干作答》，人民日报（中原网转载），2025-12-30。[官方·自报口径]\n\n## 关联专题\n\n-：清单制是权责匹配的核心制度安排。\n-：清单外摊派、\"条条干预\"是典型的政策执行偏差。\n-：基层减负类案例的作答框架。\n", "D08-全国韧性城市与城市生命线安全工程.md": "\n# D08 全国韧性城市与城市生命线安全工程：合肥模式与河南实践\n\n## ⚡ 快速知识卡\n\n韧性城市指承受适应能力强、恢复速度快的城市。2024 年 12 月中办国办《关于推进新型城市基础设施建设打造韧性城市的意见》确定目标：2027 年新型城市基础设施建设取得明显进展、2030 年建成一批高水平韧性城市，并以 CIM 平台与城市运行管理服务\"一网统管\"为技术骨架 [SD70]。城市生命线安全工程是其安全侧的先行实践：合肥 2017 年起对燃气、桥梁、管网布设物联感知设备实时监测预警，\"合肥模式\"经国务院安委办发文推广并写入国家部署 [SD73][SD74]；河南 2023 年印发三年行动方案（豫政办〔2023〕43 号），2025 年底前实现所有县（市）建成区\"三高\"区域六类监测 [SD71]；郑州\"7·20\"特大暴雨后的防洪排涝重建是河南韧性建设最直接的案例 [SD75][SD76]。考点：目标与效果的区分、监测预警的适用与局限。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n城市燃气爆炸、桥梁垮塌、管网泄漏、内涝等事故的共性是风险隐蔽在地下面与结构内部，传统\"巡查＋事故后追责\"模式看不见、防不住。2021 年郑州\"7·20\"特大暴雨暴露的正是城市生命线的脆弱性：大面积淹水断电断讯，国务院随后批复《河南郑州等地特大暴雨洪涝灾害灾后恢复重建总体规划》（规划期 2021—2024，覆盖 40 个极重和重灾县市区），明确要求按海绵城市、韧性城市要求源头减排、整治易涝点、在易涝点布设智能化感知终端 [SD75]。韧性城市理论（[A10 风险治理与韧性城市理论]）把城市能力分解为抵御、适应、恢复三重，政策上对应\"设施韧性、管理韧性、空间韧性\" [SD70]。\n\n### 核心机制\n\n**国家政策框架。** 2024 年 11 月 26 日中办国办印发《关于推进新型城市基础设施建设打造韧性城市的意见》（12 月 5 日公开发布）：到 2027 年形成一批可复制可推广经验，2030 年建成一批高水平韧性城市；重点任务包括完善城市信息模型（CIM）平台、搭建城市运行管理服务平台实现\"一网统管\"（构建国家、省、城市三级平台体系）、创新投融资机制（专项债、REITs）等 11 项；同时明确要求防止数据壁垒与重复建设、力戒形式主义 [SD70]。\n\n**城市生命线安全工程（合肥模式）。** 清华大学合肥公共安全研究院（清华、安徽省、合肥市三方共建，2016 年运行）首创\"城市生命线工程安全运行监测\"：以\"三高\"（高风险、高敏感、高后果）区域为重点布设前端感知设备，建设城市级监测中心 7×24 小时值守，联动住建、交通、应急、消防等部门形成\"精细前端感知—精准风险定位—预警协同联动\"处置流程。据建设方介绍，系统 2017 年运行以来成功预警燃气泄漏燃爆、爆管、路面塌陷、桥梁险情 6000 多起，地下管网事故发生率下降 60%、风险排查效率提高 70%；2021 年安徽省委省政府印发皖办发〔2021〕22 号在全省推广\"合肥模式\"，同年国务院安委办发文推广其经验做法 [SD73]。到 2026 年，安徽全省布设 23.6 万套感知设备、覆盖 17 万公里地下管网和 325 座桥梁，累计处置三级以上险情 3700 余起；技术已推广至全国 140 多个城市 [SD74]。\n\n**河南实施。** 2023 年 8 月省政府办公厅印发《河南省城市基础设施生命线安全工程建设三年行动方案（2023—2025年）》（豫政办〔2023〕43 号）：2023 年底前摸清风险底数、建成省市两级城市运行管理服务平台，郑州、开封、洛阳实现对中心城区\"三高\"区域燃气、排水、桥梁、热力、供水、综合管廊六类监测（其他省辖市先覆盖燃气、排水两类）；2024 年底各省辖市六类全覆盖、三分之一以上县（市）覆盖；2025 年底前所有县（市）实现对城市建成区\"三高\"区域的监测。机制上是\"市、县一体化\"，工程纳入城市运行管理服务平台同步建设，成立省长任组长的省级领导小组，并依托省属国企设立燃气、供排水桥梁供热等研究院，培育智能传感器产业链 [SD71]。\n\n**郑州暴雨后韧性建设。** 依据国函〔2022〕11 号批复的重建总体规划，郑州推进\"上拦、中蓄、下排\"防洪体系，主城区防洪标准提至 200 年一遇、金水河综合整治后防洪标准提升至 100 年一遇；建成\"郑州市防洪排涝监测预警系统一期\"（2022 年投运），汛中每分钟采集易涝点水深、流速数据，构建\"监测—预警—调度—处置—复盘\"闭环；2021 年以来实施 24 个排水管网改造项目、累计改造管网约 47.26 公里，并逐点治理 198 处易涝点 [SD75][SD76]。\n\n### 实施证据（目标／自报／独立评估分列）\n\n- **政策目标**（规范表述）：2027/2030 国家目标 [SD70]；河南 2023/2024/2025 三阶段覆盖目标 [SD71]。\n- **官方自报成效**：合肥\"预警 6000 多起、事故率降 60%\"来自清华合肥院及官方媒体，无第三方审计口径 [SD73][SD74]；郑州管网改造公里数、监测系统投运来自市政府提案答复，属自报 [SD76]。\n- **独立评估**：写作时未检索到对城市生命线工程降低事故率的严格独立因果评估（如对照城市研究）；\"地下管网事故发生率下降 60%\"为系统覆盖范围的前后对比，未排除同期其他治理投入的混杂贡献，引用时应注明口径。\n- **反面案例即原始证据**：郑州\"7·20\"灾害本身证明了\"重建设、轻韧性\"的代价，国务院灾害调查报告与重建规划构成了对原发展模式的官方反思 [SD75]。\n\n### 目标与效果的区分、数字化监测的适用与局限\n\n- **目标≠效果**：文件目标的\"显著增强风险管控能力\"尚无独立指标验证；河南方案的目标是\"监测覆盖\"，覆盖不等于预警准确、预警不等于处置闭环——监测系统若无联动处置机制与专业值守队伍，会退化为\"大屏工程\"。\n- **适用**：感知监测适用于高后果、可传感的风险（燃气泄漏、桥梁应变、管网压力、积水水位）；合肥模式有效性依赖三条件——产学研技术支撑（清华合肥院）、市政府事业单位化的监测中心（明确责任主体）、省市联动推广机制。\n- **局限**：①传感器覆盖是\"三高\"区域重点布设而非全域，非重点区域风险仍靠人工；②极端超标准事件（如\"7·20\"级别小时雨量）超过工程设防标准，监测只能提前预警、不能替代防洪工程与应急体系；③建设和运维成本高，财政弱市县可持续性存疑；④数据分散在燃气、供水等企业与部门，整合依赖打破壁垒，中央文件专门警示重复建设与数据壁垒 [SD70]。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：\"某市燃气爆炸/道路塌陷\"材料，归因用\"隐蔽风险＋被动响应＋部门数据壁垒\"，对策按\"摸清底数（风险清单）→布网监测（一张网）→联动处置（闭环机制）→产业与资金保障\"四层作答，引豫政办〔2023〕43 号 [SD71]。\n- **对策题**：\"提升城市韧性\"＝工程韧性（管网提标、行泄通道）＋管理韧性（一网统管、监测预警）＋空间韧性（留白增绿、避难场所）＋制度韧性（预案与演练）。\n- **面试**：谈\"智慧城市大屏与实效\"辩证关系——数字化是手段，\"力戒形式主义\"已写入中央文件 [SD70]；可引合肥模式说明技术＋机制＋责任主体缺一不可。\n\n**原创练习（思考题）**\n1. \"监测覆盖率\"作为生命线工程的考核指标有何失真风险？你会补充哪些结果性指标？\n2. 对比合肥模式与河南三年行动方案：政府主导推广与产学研共建各有什么优劣？\n3. \"7·20\"之后郑州的韧性建设哪些属于\"恢复\"、哪些属于\"适应与学习\"？用韧性理论分层说明。\n\n### 来源说明\n\n来源均经 2026-10-18 逐条抓取核实：起始线索（中国政府网韧性城市意见）核实成功为全文原文页；河南方案采用济源示范区官网转载的省政府办公厅全文（另经中新网河南报道交叉印证，其页面正文抓取不完整已在登记注明）；合肥数据取清华大学新闻网与科技日报，均注明为建设方/官方口径；郑州数据取国家发改委规划 PDF 与市政府提案答复原文。未检索到独立第三方效果评估，正文如实说明。\n\n## 来源与证据\n\n- [SD70] 中办国办《关于推进新型城市基础设施建设打造韧性城市的意见》，新华社（中国政府网），2024-12-05。[官方]\n- [SD71] 《河南省城市基础设施生命线安全工程建设三年行动方案（2023—2025年）》（豫政办〔2023〕43号），河南省政府办公厅（济源示范区网站全文），2023-08-20。[官方]\n- [SD72] 《河南印发城市基础设施生命线安全工程建设三年行动方案》，中国新闻网河南，2023-09-04。URL 可访问，页面正文抓取不完整，仅作交叉印证。[官方]\n- [SD73] 《清华大学合肥公共安全研究院建设全国首个城市生命线安全工程》，清华大学新闻网，2021-10-18。[官方·建设方自报口径]\n- [SD74] 《事故发生率下降60%！清华合肥院科技赋能城市生命线》，科技日报，2026-08-07。[官方·建设方口径]\n- [SD75] 《河南郑州等地特大暴雨洪涝灾害灾后恢复重建总体规划》（附国函〔2022〕11号批复），国家发展改革委，2022-01。[官方]\n- [SD76] 《关于对郑州夏季暴雨积水问题治理及智慧防汛体系建设提案的答复》，郑州市人民政府办公室，2026-06。[官方·自报口径]\n\n## 关联专题\n\n-：韧性城市理论的政策化应用。\n-：城市运行\"一网统管\"与基层治理平台的衔接。\n- [[D05]]：河南政策案例库内的关联专题。\n", "D09-兰考东坝头镇共富工坊.md": "\n## ⚡ 快速知识卡\n\n兰考县东坝头镇位于黄河\"最后一道弯\"，辖 15 个行政村。该镇以党建引领盘活闲置资产，把空心院、闲置校舍改造为\"共富工坊\"，通过\"总部＋加工点\"模式引进河南海熠工艺品有限公司，形成\"孵化基地＋支部联建＋群众增收＋集体经济＋积分赋能\"五位一体机制。目前全镇已建成 13 个共富工坊，提供 2000 余个就业岗位，带动群众增收 1600 余万元。考试要点：小工坊如何撬动\"家门口就业＋集体经济＋弱势群体帮扶\"三重目标，可迁移到产业帮扶、基层党建、共同富裕等申论主题。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n东坝头镇是焦裕禄治理风沙的发起地，地处兰考县城西北 12.5 公里的黄河岸边。脱贫攻坚战收官后，镇域面临三个共性难题：一是农村\"三留守\"人员和低收入群体就业渠道窄，务农收入不稳、外出务顾不上家；二是村庄存在大量空心院、闲置校舍、闲置厂房等\"沉睡资产\"，村集体经济薄弱；三是本地缺乏劳动密集型产业支撑，帮扶车间利用率不高。如何把闲置资产、富余劳动力和外部订单三者连接起来，是该镇发展共富工坊的直接动因。开封市（兰考县为其辖县）乡村振兴系统整体思路，是利用高标准农田建设释放的农村劳动力，通过共富工坊实现\"家门口\"就业，带动脱贫群众持续稳定增收。\n\n### 二、做法与机制\n\n1. **盘活资产建平台。** 将\"三资\"清查与闲置资源盘活结合，整合 6000 余平方米空心院、闲置校舍等资产，改造为标准化共富工坊加工点；张庄村率先建成孵化基地，带动各村实现\"村村有站点\"。\n2. **村企联动引产业。** 重点引进河南海熠工艺品有限公司设总部，以\"总部＋加工点\"模式辐射全镇：企业零成本扩张产能，村集体获得资产租赁收益，形成\"政府搭台、企业唱戏、集体受益\"的多赢格局。\n3. **五位一体定机制。** 推行\"孵化基地＋支部联建＋群众增收＋集体经济＋积分赋能\"机制。各村手工培训点由妇女主任管理，企业按订单量给负责人 7% 补助、村集体 3% 分成，把管理激励与集体收益绑定。\n4. **\"共富工坊＋N\"保长效。** 联合爱心超市实行积分激励（每完成 100 元订单得 10 积分兑换生活用品，累计发放 2.4 万积分）；推动养老、助残、提技三线并进：联动日间照料中心让老人\"做手工＋享午餐\"，为残疾人开发专属岗位并定制培训，配套电商实操、消防演练，形成\"培训—就业—增收\"闭环。\n5. **品牌化升级。** 依托海熠公司深挖本土文化与藤编融合点，打造中高端手工环保藤编品牌，用新媒体传播和展会对接现代市场。\n\n### 三、成效与数据（标注来源）\n\n- 全镇已建成 13 个各品类共富工坊，提供 2000 余个就业岗位，带动群众增收 1600 余万元；下一步目标为稳定吸纳 4000 人就业（来源 [SE02]，开封日报/兰考县委宣传部稿件，2026 年）。\n- 以河南海熠工艺品有限公司为例：已在 15 个村设藤编加工点，带动近千名妇女就业，累计发放薪资 150 余万元，人均增收 1580 元，村集体增收超 10 万元（来源 [SE02]）。\n- 全县层面：截至 2024 年 8 月，兰考县已盘活闲置厂房 44 座、空闲场所 36 座、空心院 29 座，共 109 座 83775 平方米；建成共富工坊 176 家（车间式 52、厂房式 78、居家式 46），涵盖 12 个品类；累计技能培训 152 个班次、4605 人次，实现就业 3000 余人；共富工坊直接带动就业 1.2 万人，其中脱贫户、监测户 2592 人，人均月增收 2500 元（来源 [SE01]，兰考县人民政府网站提案答复，2024-08-12）。\n\n### 四、局限与争议\n\n1. **产品附加值低、同质化。** 兰考县政协提案明确指出，全县共富工坊存在\"产品附加值低、缺乏品牌效应，技术创新能力不足、产品同质化严重，缺乏专业人才\"三大问题（来源 [SE01]）。东坝头镇藤编同样处于劳动密集型代工环节。\n2. **收入水平偏低、稳定性有限。** 人均增收 1580 元是年度增量而非总收入；手工订单受市场波动影响大，\"能就业\"与\"就好业\"之间仍有差距，镇政府自身也将其列为转型方向。\n3. **依赖单一企业。** \"总部＋加工点\"模式使镇域工坊高度绑定海熠公司，企业订单波动会直接传导为群众收入波动，风险分散机制尚待完善。\n4. **村集体分红比例小。** 村集体分成 3%、站点负责人补助 7%，集体经济增益幅度有限，长效运营仍依赖政策奖补。\n\n### 五、可考角度\n\n- **常识**：共富工坊的主要形式（厂房式、车间式、居家式）；兰考所在的黄河\"最后一道弯\"地理与焦裕禄精神的时代传承。\n- **案例分析**：给定共富工坊材料，答\"党建引领＋资源盘活＋村企联动＋精准赋能＋品牌建设\"五位分析框架，并指出局限与改进方向（人才培养、产业链延伸、风险分散）。\n- **材料写作**：以\"小工坊撬动大民生\"为题，论证共同富裕不是平均主义而是机会公平，落脚在家门口就业与集体经济壮大。\n\n### 六、金句/对策\n\n1. \"小工坊连着大市场，家门口装着大民生。\"——适用于共同富裕、就业帮扶主题。\n2. \"把'沉睡的资产'变成'生金的资本'，把'农闲'变成'农忙'，把'富余'变成'富裕'。\"——适用于资源盘活、乡村振兴主题。\n3. \"政府搭台、企业唱戏、村集体参与、农民主体，四方合力才能唱好共富这台戏。\"——适用于利益联结机制主题。\n4. 对策句：推动共富工坊从\"能就业\"向\"就好业\"转变，关键在品牌化提升附加值、培训链提升技能、多元订单分散风险。——适用于对策段落。\n\n## 来源与证据\n\n- [SE01] 兰考县人民政府网站《县政协第十一届第三次会议第 0240016 号提案：关于提升兰考县\"共富工坊\"品质，助力乡村振兴的提案和答复》，2024-08-12，http://www.lankao.gov.cn/kfslkxwz/c00487/pc/content/content_1976810475155263488.html （白名单官方·县级政府网）\n- [SE02] 开封日报（开封市人民政府网站转载，兰考县委宣传部供图）《兰考县：小工坊撬动乡村共富大梦想》，2026 年，https://www.163.com/dy/article/KN7A7UJP0556IRXW.html （转载版；原文见开封日报报业集团刊发）\n- [SE03] 中新网河南《兰考县东坝头镇：\"共富工坊\"拓宽强村富民新路径》，2025-08-05，https://www.ha.chinanews.com.cn/news/zx/2025/0805/62089.shtml （媒体）\n- [SE04] 开封市人民政府网站《张庄：昔日风口变景区》，2025-01，http://221.176.159.209:9001/kfsrmzfwz/hhfz/pc/content/content_1737108225479974912.html （白名单官方·省辖市政府网，背景）\n- [SE05] 新华网《兰考县：\"田村一体、片区组团\"共绘乡村美景图》，2025-12-28，http://www.news.cn/info/20251228/12bb46d7ebdc4dc593480808e9c434a9/c.html （新华社，背景）\n\n## 关联专题\n\n- [[D10]]\n", "D10-河南防返贫监测帮扶.md": "\n## ⚡ 快速知识卡\n\n防止返贫动态监测帮扶是脱贫攻坚过渡期（2021—2025）河南守牢底线的核心机制：以家庭为单位，通过农户自主申报、干部走访排查、部门筛查预警三条线识别存在返贫致贫风险的农户（参考线 2024 年为家庭年人均纯收入 8100 元），经村级评议、乡镇审核、县级确定后纳入监测，落实产业、就业、兜底、临时救助等针对性帮扶，风险稳定消除后退出并常态化监测。可考要点：监测识别\"三线\"来源、精准帮扶\"开发式为主＋保障性兜底\"、动态管理\"应纳尽纳、应扶尽扶、稳定消除\"。2025 年河南省委一号文件将其单列为\"确保不发生规模性返贫致贫\"专章。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n2020 年底脱贫攻坚战取得全面胜利后，部分农户发展基础仍然脆弱：因病、因残、因学、因务工就业不稳、因缺劳动力或因灾因意外，都可能导致基本生活出现严重困难并带来返贫致贫风险（来源 [SE09]）。2021 年 7 月河南特大洪涝灾害叠加疫情，进一步放大风险——当年全省因洪涝灾害新增监测对象 30.06 万人（来源 [SE07]）。河南是脱贫人口大省，守住不发生规模性返贫致贫底线，是过渡期\"三农\"工作的首要任务，也是中央对各省的硬约束。\n\n### 二、做法与机制\n\n1. **制度奠基。** 2020 年河南省脱贫攻坚领导小组印发《关于建立防止返贫监测和帮扶机制的实施意见》（豫脱贫组〔2020〕13 号），确立\"事前预防与事后帮扶结合、开发式帮扶与保障性措施结合、政府主导与社会参与结合、外部帮扶与群众主体结合\"四原则（来源 [SE08]）。\n2. **三线识别。** 农户自主申报（找干部、打 12345/12317、微信\"一码通\"扫码）、乡村干部走访排查、行业部门筛查预警（医保、民政、教育、住建、水利等部门数据比对）三线并行；多地依托大数据平台比对收入、医疗支出等信息，如通许县通过大数据阳光监测平台发现因病返贫风险线索（来源 [SE07][SE09]）。\n3. **规范程序。** 村级初选（民主评议、公示）→乡镇审核（谁核查、谁签字、谁负责）→县级确定（信息比对核准）→录入全国系统动态管理（来源 [SE08]）。\n4. **精准帮扶。** 对有劳动能力者以开发式帮扶为主：产业帮扶（\"短平快\"项目、小额信贷应贷尽贷）、就业帮扶（技能培训、公益性岗位、帮扶车间）；对无劳动能力者强化低保、医保、养老保险和特困供养等综合性兜底；对因病因灾家庭及时落实临时救助，实行低保\"渐退期\"（脱贫户人均收入超低保标准但在 1.5 倍以内可给 12 个月渐退期）（来源 [SE08][SE09]）。\n5. **动态退出与常态化。** 风险稳定消除须经入户核实、评议公示、县级审核批准；消除后停止针对性帮扶但保持常态化监测，出现新困难可再次申报（来源 [SE09]）。2025 年河南省委一号文件要求\"加快建设覆盖全体农户的防止返贫致贫促乡村振兴大数据平台，完善农村常态化防止返贫致贫机制\"，并对有劳动能力的农村低收入人口开展从教育培训到促进就业的全链条一体式帮扶（来源 [SE06]）。\n6. **灾后应急机制。** 2021 年洪涝灾害后，河南及时出台《防止因灾返贫致贫巩固拓展脱贫攻坚成果若干政策措施》18 条，发放受灾人口和监测对象生活补贴每人 700 元，新增省级衔接资金 7 亿元，安排 27 名省级领导、27 个厅局联系帮扶 27 个重灾县（来源 [SE07]）。\n\n### 三、成效与数据（标注来源）\n\n- 2021 年（受灾之年）全省识别认定监测对象 19.94 万户、63.16 万人，其中 7 月洪涝灾害后新增 30.06 万人；已消除风险人数占比 39.9%；有劳动能力的脱贫人口、监测对象 223.99 万人实现应就业尽就业；免费对 4.12 万名脱贫劳动力开展技能提升培训，对 14.49 万脱贫人口开展以工代训（来源 [SE07]，《光明日报》2021-12-01）。\n- 全国层面（用于对照底线成效）：截至 2025 年 9 月底，全国累计识别帮扶的防止返贫致贫监测对象中超过 700 万人稳定消除风险，其余均已落实针对性帮扶措施，守牢不发生规模性返贫致贫底线（来源 [SE11]，农业农村部计划财务司 2025-12）。脱贫县农村居民人均可支配收入从 2020 年 12588 元增至 2025 年 18627 元，年均增速 8.2%（来源 [SE10]，人民日报 2026-08-27 报道国务院报告）。\n- 河南 2024 年监测参考线为家庭年人均纯收入 8100 元，各省辖市据此动态调整（来源 [SE09]）。[存疑] 河南 2024—2025 年监测对象最新存量与风险消除率未查到省级统一公开数，引用时需核实省乡村振兴监测中心年度通报。\n\n### 四、局限与争议\n\n1. **收入参考线的局限。** 8100 元是\"参考依据\"而非硬门槛，实际操作中对\"刚性支出骤增但收入略高\"家庭的识别依赖干部走访和部门预警，存在漏识别风险。\n2. **风险消除认定偏严偏宽之争。** 帮扶后收入\"稳定超过监测范围\"方可消除风险，但务工收入波动大，部分地方为完成指标存在风险消除偏快、返岗不稳即出列的隐忧（学界普遍讨论，属推测性提示，[存疑]）。\n3. **政策断档预期。** 2025 年过渡期结束，过渡期后如何将防止返贫致贫对象和欠发达地区纳入常态化帮扶、衔接农村低收入人口分层分类帮扶制度，机制仍在构建中（来源 [SE10]）。\n4. **开发式帮扶与兜底的边界。** 对半弱劳动能力群体，产业就业帮扶见效慢、兜底保障成本高，基层在两者间的平衡难度大。\n\n### 五、可考角度\n\n- **常识**：监测对象识别\"三线\"渠道；过渡期为 2021—2025 年；\"四个不摘\"（摘帽不摘责任、不摘政策、不摘帮扶、不摘监管）。\n- **案例分析**：给定某县因病返贫案例，按\"监测识别—精准帮扶—动态消除\"链条作答，突出数据比对预警与分层分类帮扶。\n- **材料写作**：围绕\"守底线与促振兴相统一\"立意，论述从集中攻坚到常态化帮扶的机制转型。\n\n### 六、金句/对策\n\n1. \"脱贫摘帽不是终点，而是新生活、新奋斗的起点。\"——适用于巩固脱贫成果、乡村振兴主题（习近平总书记重要论述）。\n2. \"宁可十防九空，不可失防万一；监测要'早'，帮扶要'准'，退出要'稳'。\"——适用于防返贫机制对策段。\n3. \"对有劳动能力的，帮一把、扶一程靠开发；对无劳动能力的，兜住底、兜好底靠保障。\"——适用于分层分类帮扶主题。\n4. 对策句：以大数据平台贯通部门数据壁垒，让风险线索\"自动浮出\"，以开发式帮扶增强内生动力，以社会保障体系兜牢底线，实现政策供给长效化、措施方法常规化。（据国务院 2026 年报告表述化用，来源 [SE10]）\n\n## 来源与证据\n\n- [SE06] 河南省农业农村厅网站（转河南日报）《2025 年河南省委一号文件发布：关于进一步深化农村改革扎实推进乡村全面振兴的实施意见》，2025-05-20，https://nynct.henan.gov.cn/2025/05-20/3159597.html （白名单官方·省农业农村厅）\n- [SE07] 《光明日报》2021-12-01 第 04 版《河南：帮扶很重要，产业最长远》，https://news.gmw.cn/2021-12/01/content_35350348.htm （中央媒体）\n- [SE08] 河南省脱贫攻坚领导小组《关于建立防止返贫监测和帮扶机制的实施意见》（豫脱贫组〔2020〕13 号），2020-11，https://www.hnhx.gov.cn/_mediafile/hnhx/2020/11/09/2j3ru6gc0f.pdf （白名单官方·县级政府网披露的省级文件）\n- [SE09] 卢氏县农业农村局《河南省防止返贫监测对象申报政策\"明白纸\"》，2024-08-20，https://www.lushixian.gov.cn/3472/616977792/1890145.html （白名单官方·县级政府网）\n- [SE10] 人民日报《脱贫县农村居民人均可支配收入年均增速达 8.2%》（河南人大网转载，2026-08-27），https://henanrd.gov.cn/2026/08-27/245207.html （白名单官方·省人大网）\n- [SE11] 农业农村部计划财务司《前三季度农业农村经济运行总体平稳》，2025-12，https://jhs.moa.gov.cn/jjyx/202512/t20251203_6479428.htm （中央部委官网，全国对照数据）\n\n## 关联专题\n\n- [[D09]]\n", "D11-河南高标准农田.md": "\n## ⚡ 快速知识卡\n\n高标准农田是\"田成方、林成网、路相通、渠相连、旱能浇、涝能排\"的现代化良田，是河南扛稳粮食安全重任、落实\"藏粮于地、藏粮于技\"战略的核心抓手。河南的做法：2022 年起在已建成 8500 多万亩高标准农田基础上，按\"六化\"（建设标准化、装备现代化、应用智能化、经营规模化、管理规范化、环境生态化）标准启动 1500 万亩高标准农田示范区建设，亩均投资不低于 4000 元，实行\"地方融资、省级贴息\"和\"投建运管\"一体化机制；建后推行\"一长两员\"\"田长制\"等网格化管护。截至 2024 年底河南累计建成高标准农田 8808 万亩、约占全省耕地 78%，支撑粮食总产连续 9 年稳定在 1300 亿斤以上。可考要点：\"六化\"标准、示范区融资机制、三分建七分管、良田—良种—良机—良法\"五良\"集成。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n河南是全国粮食生产大省，粮食总产量常年居全国第二，小麦产量全国第一，扛稳国家粮食安全责任是河南的政治任务。但长期以来河南农田基础设施存在明显短板：一是地块零散、灌溉设施老化，抗旱防涝能力弱，\"望天田\"比重不小；二是 2021 年极端暴雨、2023 年麦收\"烂场雨\"、2024 年\"旱涝急转\"等极端天气频发，倒逼提升农田防灾减灾能力（来源 [SF03]）；三是早期建设标准偏低，部分项目重建设轻管护，机井、供电、沟渠损毁后维修责任不明。为此，国家层面出台《全国高标准农田建设规划（2021—2030 年）》和中办、国办《逐步把永久基本农田建成高标准农田实施方案》，河南以示范区建设为突破口推进农田\"升级换代\"。\n\n### 二、做法与机制\n\n1. **规划布局：\"省主导、市统筹、县实施\"。** 2022 年 9 月河南省政府办公厅印发《河南省高标准农田示范区建设实施方案》（豫政办〔2022〕92 号），确定 2022—2025 年建设 1500 万亩示范区、增加粮食产能 15 亿公斤以上；2022 年先在新乡\"中原农谷\"及周口国家农高区等地建 200 万亩，2023—2025 年在黄淮海平原和南阳盆地建 1300 万亩；以粮食生产核心区为重点集中连片布局，单个项目规模一般不低于 1 万亩（来源 [SF01]）。\n2. **建设标准：\"六化\"引领。** 依据《河南省高标准农田示范区建设指南》，实行田、土、水、路、林、电、技、管、气象综合配套；高效节水灌溉设施覆盖率 100%，排涝标准 10 年一遇，机耕路通达率 100%，测土配方施肥覆盖率 100%，配套区域服务中心和农田生产科技监测站，推行\"一个屏幕管理万亩良田\"的智慧农业管理平台（来源 [SF01]）。\n3. **资金投入：\"地方融资、省级贴息\"。** 示范区亩均总投资一般不低于 4000 元，主要通过发行政府专项债券和使用政策性贷款融资：农发行、国开行河南分行提供期限不低于 25 年、年化利率不高于 4% 的政策性贷款，建设期不还本、只付息，本金县级偿还、利息省财政贴息；新增耕地和产能指标交易资金封闭化管理、优先用于示范区建设（来源 [SF01]）。全国层面\"十四五\"期间中央累计投入超 7000 亿元（来源 [SF08]）。\n4. **投建运一体化。** 统筹推进示范区建设和运营管护，明晰工程设施产权、做好移交；推行政府购买服务委托管护、专职管护员网格化管护、引入专业化市场化管护主体等模式。\"十五五\"时期河南明确运用\"投建运管\"一体化机制高质量建设高标准农田（来源 [SF01][SF05]）。\n5. **建后管护：\"三分建、七分管\"。** 组建\"一长两员\"（井长和管护员、维修员）管护队伍；2020 年 3 月省政府出台方案厘清机井与供电设施管护责任——高压部分由国家电网投资管理，低压部分和机井交由村委会、农民用水合作组织管护（来源 [SF02]）。地方创新如漯河市召陵区\"一长三员\"网格化管理（村干部任网格长、老党员任监督员、村民任管护员、专家任技术服务员），邓州市设市乡村三级\"田长\"663 人、网格员 623 人，依托\"河南一网两长制\"APP 巡查管护（来源 [SF02]）。\n6. **配套利用：良田融合\"良种良机良法\"。** 示范区建成后推动土地适度规模经营占比达 90% 左右；依托高标准农田推广滴灌水肥一体化、密植等增产技术，配套全省 12.7 万个农业社会化服务组织、2.28 亿亩次托管服务（来源 [SF01][SF03]）。\n\n### 三、成效与数据（标注来源）\n\n- 截至 2024 年底，河南累计建成高标准农田 8808 万亩，约占全省耕地面积的 78%，现有灌溉机井 115 万多眼，粮食生产抗灾减灾能力大幅提升（来源 [SF03]，新华社 2025-12-25）。另据人民日报 2025 年 2 月报道\"已建成 9061 万亩\"（来源 [SF02]），两个口径统计时点不同，引用时注意区分。\n- 河南、江苏两省高标准农田面积占永久基本农田面积比重均已超过 80%（截至 2024 年底，来源 [SF04]，经济日报）。\n- 粮食产能支撑：河南粮食总产量连续 9 年稳定在 1300 亿斤以上，2025 年达 1350.98 亿斤、保持全国第二（来源 [SF03]）。省长王凯在国新办发布会算账：1500 万亩示范区全部建成后每亩可多打 220 斤粮、多收 330 元，合计增产 33 亿斤、增收 49 亿元（目标测算值，来源 [SF06]）。\n- 2026 年度任务（目标值）：在 66 个产粮大县和豫东平原 200 万亩区域整体推进高标准农田建设项目，全省新建和改造提升超过 400 万亩（来源 [SF07]，省政府门户网站）；\"十五五\"实施百亿斤粮食产能提升工程，力争到 2030 年粮食综合生产能力迈上 1400 亿斤台阶（来源 [SF05]）。\n\n### 四、局限与争议\n\n1. **投资与偿债压力。** 示范区亩均 4000 元投资远高于普通项目，主要靠专项债和政策性长期贷款，偿还本金的责任落在县级；对财政弱县构成持续性偿债压力，需警惕重融资轻绩效（机制公开见 [SF01]，风险评价属分析性提示）。\n2. **建后管护仍是薄弱环节。** 机井、供电等设施使用频繁易损，多部门权责此前长期不清；全国层面农业农村部 2025 年针对工程质量问题开展\"回头看\"和专项整治，对 2019 年以来近 5 万个项目大起底大排查（来源 [SF04] 及新华社 2025-12-22 相关报道），说明质量问题并非个案。\n3. **非粮化与非农化压力。** 建成良田后被违规占用、挖塘养鱼、种植非粮作物的风险客观存在，河南以\"一网两长\"制压实耕地保护责任，但基层监管力量有限（来源 [SF02]）。\n4. **目标完成口径待核。** 1500 万亩示范区是否已如期全部建成，未见省级统一公开的完成数公告，引用时需核实省农业农村厅年度通报 [存疑]。\n\n### 五、可考角度\n\n- **常识**：河南高标准农田示范区\"六化\"标准；豫政办〔2022〕92 号文件；\"三分建、七分管\"；\"藏粮于地、藏粮于技\"。\n- **案例分析**：给定某县高标准农田机井损毁无人管的案例，按\"明晰产权—明确管护主体—多元筹资—数字监管\"链条作答，突出\"一长两员\"\"田长制\"与政府购买服务管护模式。\n- **材料写作**：围绕\"良田、良种、良机、良法集成融合\"或\"把饭碗牢牢端在自己手中\"立意，论述从\"建起来\"到\"用得好\"的农田治理升级。\n\n### 六、金句/对策\n\n1. \"把靠天吃饭的'望天田'建成高产稳产的'吨粮田'。\"——适用于粮食安全、农田建设主题（化用自经济日报评论 [SF04]）。\n2. \"农田建设三分靠建、七分靠管，建好是基础，管好用好才是关键。\"——适用于建后管护对策段。\n3. \"一平、两通、三提升\"（田块平整，通水通路，提升地力、产出与防灾能力）——适用于高标准农田建设标准表述（来源 [SF04]）。\n4. 对策句：坚持数量、质量、生态并重，以\"六化\"标准集中连片建设，以专项债加政策性贷款破解投入瓶颈，以\"投建运管\"一体化明确全周期责任，以田长制网格化管护和数字化平台实现\"建一亩、成一亩、用好一亩\"。\n\n## 来源与证据\n\n- [SF01] 河南省人民政府办公厅《河南省高标准农田示范区建设实施方案》（豫政办〔2022〕92 号），2022-09-27（项城市人民政府网披露），http://www.xiangcheng.gov.cn/sitesources/xcs/page_pc/xxgk/jcxxgk/zcjd/articleb408b599b1b84d169d74d644babe7829.html （白名单官方·县级政府网）\n- [SF02] 人民日报《河南：建好高标准农田 打牢农业高质量发展\"地基\"》（吉林省政府发展研究中心网站转载），2025-02-07，https://fzzx.jl.gov.cn/tszs/202502/t20250214_9057142.html （中央媒体，转载页）\n- [SF03] 新华每日电讯《中原沃野启新程——河南推进农业大省向农业强省蝶变》，2025-12-25，http://www.news.cn/20251225/249c08d7300f41a4b01779c79cec50a2/c.html （新华社）\n- [SF04] 经济日报《高标准农田要建好更要管好》（农业农村部农田建设管理司网站转载），2025-08-22，https://ntjss.moa.gov.cn/gzdt/202508/t20250822_6476675.htm （中央部委官网，转载页）\n- [SF05] 人民网河南频道《冲刺 1400 亿斤产能 河南\"十五五\"加快建设农业强省》，2026-05-29，http://henan.people.cn/n2/2026/0529/c351638-41594689.html （人民日报报系）\n- [SF06] 证券时报网（据中国网国新办发布会）《河南：到 2025 年粮食产能新增 100 亿斤、达到 1400 亿斤是有把握的》，2024-05-09，https://www.stcn.com/article/detail/1199971.html （持牌媒体转官方发布会）\n- [SF07] 河南省人民政府门户网站（英文版，来源 dahe.cn）《Henan maps out its 2026 development goals》，2026-01-27，https://english.henan.gov.cn/2026/01-27/3314404.html （白名单官方·省政府门户网站）\n- [SF08] 新华社《年终话\"三农\"丨农田提质效 沃野焕新机——2025 年高标准农田建设扫描》，2025-12-23，http://www.news.cn/20251223/2f0e0f090e7c4522a7a28e1b7e9c2f9f/c.html （新华社）\n\n## 关联专题\n\n- [[D09]]\n- [[D10]]\n", "D12-河南粮食安全.md": "\n## ⚡ 快速知识卡\n\n河南是\"中原粮仓\"：粮食总产量常年居全国第二、小麦产量全国第一（约占全国四分之一），每年调出原粮及制成品 600 亿斤以上，扛稳保障国家粮食安全的政治责任。围绕\"藏粮于地、藏粮于技\"，河南的机制抓手是：粮食安全党政同责与责任制考核、耕地保护与占补平衡、以中原农谷为核心的种业创新平台（配套高标准农田建设，见 D11）、最低收购价收储与\"粮头食尾\"加工延链。2025 年河南粮食总产量 1350.98 亿斤，连续 9 年稳定在 1300 亿斤以上。可考要点：党政同责、中原农谷\"一方案一意见\"、每年供种 45 亿斤/冬小麦供种占全国 50%、从\"中原粮仓\"到\"国人厨房\"。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n河南用全国约 6% 的耕地生产了全国近 10% 的粮食，小麦产量占全国四分之一，不仅解决本省 1 亿人吃饭问题，每年还调出原粮及制成品 600 亿斤以上，是全国粮食安全的\"压舱石\"（来源 [SF10]）。但这份责任背后有三重压力：\n\n1. **耕地保护压力。** 河南耕地面积约 1.13 亿亩、永久基本农田 9915 万亩，城镇化推进中建设占用与保护红线的矛盾突出，还须防止耕地\"非粮化\"\"非农化\"（来源 [SF10]）。2021 年极端暴雨、2023 年麦收\"烂场雨\"、2024 年\"旱涝急转\"、2025 年持续旱情加秋收连阴雨，极端天气连年考验粮食生产的稳定性（来源 [SF11]）。\n2. **种粮比较效益偏低。** 农资价格和人工成本持续上涨而粮价涨幅有限，\"种粮不赚钱\"\"种地一年不如打工一月\"长期存在，农民种粮和地方抓粮\"两个积极性\"都受影响（媒体与学界调研共识，来源 [SF10] 报道及历史调研报道，具体亩均收益数因年景波动大，本文不取单一数值）。\n3. **结构性矛盾。** 河南是育种、繁种、用种、供种大省但长期\"不是种业强省\"；粮食生产存在品种结构与市场需求的错配，优质专用粮比重有待提高（来源 [SF09]）。\n\n### 二、做法与机制\n\n1. **党政同责与责任制考核。** 《中华人民共和国粮食安全保障法》（2023 年 12 月通过）明确\"国家建立粮食安全责任制，实行粮食安全党政同责\"，省对本行政区域耕地保护和粮食安全负总责，主要负责人是第一责任人（来源 [SF13]）。河南把防止耕地\"非粮化\"、粮食种植面积（不低于 1.6 亿亩）和产量（稳定在 650 亿公斤以上）纳入粮食安全责任制考核，提高面积、产量和高标准农田建设等指标权重，考核结果与支持政策和资金挂钩，对落实不力的通报约谈（来源 [SF14]）。2026 年河南省委一号文件部署\"实施粮食大面积单产提升行动\"，严格落实粮食安全党政同责，向科技要粮、向管护要粮、向防控要粮、向市场要粮（来源 [SF12]）。\n2. **耕地保护与占补平衡。** 落实最严格的耕地保护制度，永久基本农田重点保障小麦、玉米、稻谷三大谷物种植，严格耕地用途管控和占补平衡，多途径落实补充耕地任务（来源 [SF14]）。耕地\"非粮化\"治理纳入责任制考核，河南以\"一网两长\"（田长＋网格员监管网络）压实耕地保护责任（机制细节见 D11）。\n3. **中原农谷种业创新平台。** 2019 年国家生物育种产业创新中心落户新乡平原示范区；河南以此为基础规划 1612 平方公里建设中原农谷，形成\"一核三区\"格局。2022 年 4 月省政府出台《\"中原农谷\"建设方案》，2022 年 11 月省委、省政府出台《关于加快中原农谷建设打造国家现代农业科技创新高地的意见》，\"一方案一意见\"构成政策框架；成立以省长为组长的建设领导小组，推行\"管委会＋公司\"模式，聚焦\"四大中心、两个示范区\"，目标打造千亿级种业产业集群（来源 [SF09]）。目前中原农谷已聚集 67 家科研平台、16 位院士、420 多名专业人才和 50 万份农作物种质资源库；\"十四五\"以来河南实施省种业重大创新项目 54 项、投入省财政资金 1.8 亿元（来源 [SF09][SF10]）。\n4. **高标准农田与吨粮田。** 这是\"藏粮于地\"的核心抓手，河南已建成高标准农田 8808 万亩、约占全省耕地 78%，示范区\"六化\"建设和\"投建运管\"一体化等机制详见 D11，此处不再展开；中原农谷同步建设 100 万亩高标准农田，亩均粮食产能增加 10%—20%，探索良田良种良机良法融合的\"河南标准\"（来源 [SF09]）。\n5. **种粮补贴与产销协作。** 落实稻谷小麦最低收购价、耕地地力保护补贴等政策，全面推行三大粮食作物完全成本保险；用好粮食产销区省际横向利益补偿资金，支持产粮大县补充财力、发展粮食产业；引导农业企业在产粮大县统筹布局加工产能，发展订单农业和\"专种、专收、专储、专用\"产销一体化（延津模式）（来源 [SF12][SF14]）。\n6. **粮食收储与加工延链。** 严格执行小麦最低收购价执行预案（2025、2026 年每年全国限定收购总量 3700 万吨），当到库价持续 3 天低于最低收购价即启动托底收购，2025、2026 年河南均多批次公布收储库点、覆盖小麦主产县，兜住\"种粮卖得出\"底线（来源 [SF13]）。同时做\"粮头食尾\"\"农头工尾\"文章：河南生产全国 1/2 的火腿肠、1/3 的方便面、1/4 的馒头、3/5 的汤圆、7/10 的水饺、4/5 的酸辣粉，正从\"中原粮仓\"向\"国人厨房\"\"世界餐桌\"转型，打造万亿级绿色食品业支柱产业（来源 [SF11]）。\n\n### 三、成效与数据（标注来源）\n\n- **常年产量：** 2025 年河南粮食总产量 1350.98 亿斤，连续 9 年稳定在 1300 亿斤以上，保持全国第二（来源 [SF11]）。2024 年为 1344 亿斤、连续 8 年超 1300 亿斤（来源 [SF09]）。\n- **小麦产量占比：** 河南小麦产量居全国第一、约占全国四分之一；2024 年河南小麦播种面积 8513 万亩、平均亩产 445 公斤、总产量 757 亿斤（来源 [SF10]，转引国家统计局数据）。2026 年河南夏粮面积 8526.3 万亩、产量 3776.4 万吨，面积和产量均居全国首位、产量约占全国四分之一（来源 [SF10] 转引国家统计局 2026 年夏粮公告口径）。\n- **制种基地规模与供种能力：** 中原农谷带动河南每年为全国提供优质种子 45 亿斤，其中冬小麦供种占全国 50%，按种子产出比 1:40 计算，每年可支撑 1800 亿斤粮食产能；中原农谷已有上百个新品种通过国家审定，带动河南主要农作物良种覆盖率达 97%、良种对粮食增产贡献率超 45%（来源 [SF09][SF10]）。代表品种：\"郑麦379\"连续多年为全国种植面积最大的优质小麦品种；远缘杂交国审新品种\"普冰03\"以 666 万元完成中原农谷首单品种权转让（来源 [SF09][SF10]）。\n- **粮食产能目标（目标值，非已完成数据）：** 河南实施百亿斤粮食产能提升工程，力争到 2030 年粮食综合生产能力迈上 1400 亿斤台阶；2026 年建设 1500 万亩小麦、2000 万亩玉米等高产示范区，粮食产量稳定在 650 亿公斤以上（来源 [SF11][SF12]）。\n\n### 四、局限与争议\n\n1. **种粮收益偏低仍是根本约束。** 补贴、保险和最低收购价只起托底作用，\"一斤粮卖不过一瓶水\"的比价关系未根本改变；小农户靠种粮增收空间有限，\"谁来种地\"问题在河南同样突出（来源 [SF10] 相关讨论）。产销区省际横向利益补偿 2025 年才启动实施，覆盖面和资金规模能否支撑产粮大县财力，尚待观察（来源 [SF12]）。\n2. **产粮大县财政压力。** 历史调研显示河南产粮大县人均财政支出长期低于全省平均水平，\"产粮越多、财政越紧\"的怪圈虽有产粮大县奖励缓解，但未根本解决（历史媒体调研，来源 [SF10] 报道语境，最新县级财政数据 [存疑]，未查到 2025 年省级系统公开数）。\n3. **产量统计口径差异。** 全省年度总产量（1350.98 亿斤）与夏粮/小麦分季数据、省里\"650 亿公斤\"目标口径并存；高标准农田亩数亦有 8808 万亩与 9061 万亩两个不同统计时点口径（见 D11），引用时须注明统计时点与口径。\n4. **种业\"大省不强\"。** 中原农谷平台聚集效应初显，但全省种业企业规模小、散、弱，突破性品种和头部企业与国际巨头及江苏等省相比仍有差距，千亿级种业产业集群是 2035 年愿景目标而非现状（来源 [SF09]，属规划目标）。\n\n### 五、可考角度\n\n- **常识**：粮食安全党政同责（粮食安全保障法）；《\"中原农谷\"建设方案》（2022）；河南小麦产量占全国约 1/4；\"粮头食尾、农头工尾\"；每年调出原粮及制成品 600 亿斤以上。\n- **案例分析**：给定\"农民不愿种粮/耕地撂荒\"材料，按\"责任（党政同责考核）—地（耕地保护＋高标准农田）—技（种业创新＋良种良法）—利（补贴保险收储＋产销区横向补偿）\"四条线作答，落到健全种粮农民收益保障机制。\n- **材料写作**：围绕\"把中国人的饭碗牢牢端在自己手中\"\"粮食安全是'国之大者'\"立意，论述从\"中原粮仓\"到\"国人厨房\"的产业链升级与粮食安全、现代高效农业相统一。\n\n### 六、金句/对策\n\n1. \"粮食生产这个优势、这张王牌，任何时候都不能丢。\"——习近平总书记对河南的要求，适用于粮食安全主题开篇（来源 [SF09]）。\n2. \"中原熟，天下足。河南把'中原粮仓'建成'国人厨房'，让一粒小麦走完从田间到餐桌的金灿灿一生。\"——适用于粮食产业链延伸、三产融合主题（化用自 [SF09][SF11]）。\n3. \"藏粮于地、藏粮于技，既要良田保产能，更要良种增底气。\"——适用于\"地\"与\"技\"两条线结合的对策段（基于 [SF09][SF10] 材料提炼）。\n4. 对策句：坚持粮食安全党政同责，以责任制考核压实\"两个积极性\"；以占补平衡和高标准农田守住耕地数量质量；以中原农谷攻关种业\"芯片\"；以最低收购价、完全成本保险和产销区横向利益补偿健全种粮农民收益保障机制，实现粮食安全与现代高效农业相统一。\n\n## 来源与证据\n\n- [SF09] 河南省农业农村厅（种业商务网转载）《探秘\"中原农谷\"种业\"芯\"城》背景综述，2022—2023 年（另见国家发展改革委网站《河南省加快推进\"中原农谷\"建设打造千亿级种业和粮食产业集群》，2022-07-13，https://www.ndrc.gov.cn/fggz/nyncjj/xczx/202207/t20220713_1330449.html ；新华网《中原农谷育新种迎丰年》，2025-04-30，http://www.news.cn/20250430/ea930df770164808b8a937632fa3f7d1/c.html ）\n- [SF10] 新华社（新华网）《中原农谷育新种迎丰年——探访产粮大省河南的农业\"芯\"科技》，2025-04-30，http://www.news.cn/20250430/ea930df770164808b8a937632fa3f7d1/c.html （新华社）\n- [SF11] 新华每日电讯《中原沃野启新程——河南推进农业大省向农业强省蝶变》，2025-12-25，http://www.news.cn/20251225/249c08d7300f41a4b01779c79cec50a2/c.html （新华社；与 D11 的 SF03 为同一篇原文，此处按 line-b 号段独立建号引用同一 URL，合并时以 DSH 去重为准）\n- [SF12] 中共河南省委、河南省人民政府《2026 年河南省委一号文件》（全文经新浪财经等媒体转载），2026 年发布；粮食部分另见郑州市现代人才测评与考试研究院转载页 http://www.zzetaa.com/news/news.aspx?id=9077 （非官方转载，正式文号与省政府门户原文链接未查到 [存疑]）\n- [SF13] 国家发展改革委（转载国家粮食和物资储备局）《关于 2025—2026 年小麦最低收购价有关政策的通知》（国粮粮〔2024〕204 号），2024-09，https://www.ndrc.gov.cn/fzggw/jgsj/jgs/sjdt/202409/t20240924_1393234.html ；2026 年河南执行情况见国粮粮〔2026〕224 号通知及各省辖市收储库点公告（官方原文页未直接检索到 [存疑]）\n- [SF14] 河南省人民政府办公厅《关于防止耕地\"非粮化\"稳定粮食生产的实施意见》（许昌市自然资源和规划局网站披露），2021-04，https://zrzyhghj.xuchang.gov.cn/gdbhlsaqxxzl/016001/20230403/c39b160d-56b7-4fff-95e5-88b1dd2833f5.html （白名单官方·县级政府网）；《中华人民共和国粮食安全保障法》条文见国家粮食和物资储备局网站 https://www.lswz.gov.cn/html/zcfb/2023-12/30/content_278749.shtml （白名单官方·国家部委）\n\n## 关联专题\n\n- [[D10]]\n- [[D11]]\n- [[P02]]\n- [[D01]]\n", "D13-河南民营经济.md": "\n## ⚡ 快速知识卡\n\n民营经济是河南经济的\"主力军\"：全省实有民营经济主体超 1100 万户、占全部经营主体约 96%，吸纳就业占城镇就业八成以上，高新技术企业中民企占比超 95%。河南的做法围绕\"两个毫不动摇\"展开：省委省政府《关于促进民营经济发展壮大的实施意见》31 条、《河南省促进民营经济高质量发展行动计划》\"六个专项行动＋六个专项攻坚\"、\"万人助万企\"活动干部包联助企、\"三个一批\"项目建设稳投资、《河南省优化营商环境条例》修订护航。可考要点：民营经济促进法（2025-05-20 施行）、\"项目为王\"、\"高效办成一件事\"、清欠账款与涉企\"四乱\"整治。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n1. **总量大、占比高，但\"顶天立地\"的大企业少。** 河南民营经济主体数量庞大（2024 年 10 月底实有经营主体超 1100 万户，民企和个体工商户占 95.8%，来源 [SF18] 关联报道口径；2026 年 4 月底实有民营经济主体 1103.3 万户、占全部经营主体 95.9%，来源 [SF18]），但与中国民营企业 500 强数量同经济大省地位不匹配——《行动计划》把\"入榜企业数量与我省经济规模更加匹配\"列为 3 年目标，反衬出现状差距（来源 [SF17]）。\n2. **融资难、融资贵。** 民企特别是中小微企业可抵押物少、信用记录薄，金融机构放贷意愿不足；河南以\"科技贷\"、银企对接、金融要素服务发布会等方式纾困，但融资约束仍是企业反映最集中的堵点之一（来源 [SF16][SF17]）。\n3. **要素成本与市场准入壁垒。** 隐性门槛、地方保护、招投标中的所有制歧视、涉企\"四乱\"（乱收费、乱罚款、乱检查、乱查封）等问题长期存在，需要以负面清单和公平竞争审查破除（来源 [SF16][SF17][SF20]）。\n4. **企业家信心与预期。** 外部环境复杂多变，民企投资更趋谨慎；河南把\"进一步激发和提振民营企业发展的信心决心\"写入行动计划的总体要求，并把高规格民营企业座谈会、政企沟通闭环作为稳预期的制度化安排（来源 [SF17][SF19]）。\n\n### 二、做法与机制\n\n1. **\"两个毫不动摇\"与政策体系。** 中央层面，2023 年 7 月《中共中央 国务院关于促进民营经济发展壮大的意见》出台；2025 年 4 月 30 日十四届全国人大常委会表决通过《中华人民共和国民营经济促进法》，自 2025 年 5 月 20 日起施行，这是我国第一部专门关于民营经济发展的基础性法律（来源 [SF22]）。河南层面：2024 年 5 月省委、省政府印发《关于促进民营经济发展壮大的实施意见》，从优化市场、政策、法治\"三大环境\"、破除准入壁垒、解决融资难题等 7 个方面提出 31 条措施（来源 [SF16]）；2025 年 5 月省委办公厅、省政府办公厅印发《河南省促进民营经济高质量发展行动计划》，部署经营主体培育、骨干企业培育、市场平等准入、维护公平竞争、科技创新赋能、合法权益保护\"六个专项行动\"和解决拖欠账款、整治涉企\"四乱\"、强化法治保障、招投标专项整治与强化要素保障、信用诚信建设、民营企业培训\"六个专项攻坚\"（来源 [SF17]）。地方立法同步推进：《河南省民营经济促进条例》2025 年 7 月公开征求意见（草案征求意见稿，来源 [SF20] 关联公开信息，正式通过时间 [存疑]，未检索到省人大常委会表决通过报道）；修订后的《河南省优化营商环境条例》2025 年 12 月 4 日经省十四届人大常委会第二十一次会议表决通过、2026 年 3 月 1 日起施行，明确破除市场准入卡点、推行\"综合查一次\"和非现场监管、建立企业诉求快速响应机制（来源 [SF20]）。\n2. **\"万人助万企\"活动。** 2021 年 6 月起河南在全省开展\"万人助万企\"活动，选派干部进企业包联帮扶，聚焦企业反映的用地、用工、融资、审批等实际问题，省里派驻工作组到各地督导惠企政策落实，推动\"点对点\"解难与政策落地（来源 [SF21] 关联报道及公开研究综述；全省累计派驻干部与解决问题总数未查到权威汇总数 [存疑]）。\n3. **\"三个一批\"项目建设。** 2021 年 7 月 10 日省委、省政府发出\"项目为王\"动员令，建立\"签约一批、开工一批、投产一批\"滚动推进机制，2022 年 1 月省政府办公厅印发《河南省重大项目建设\"三个一批\"活动评价办法（试行）》和推进重大项目建设三项制度，以评促干、晾晒比拼（来源 [SF21]）。民间投资项目纳入重点民间投资项目库和推介平台，支持民企参与\"两重\"\"两新\"和省重大工程（来源 [SF17]）。\n4. **融资纾困与账款清欠。** 组织金融要素服务专题发布、深化银企合作、推广\"科技贷\"等模式；把\"解决拖欠账款攻坚\"列为专项攻坚，法院对拖欠民企账款案件实行\"快立快审快执\"，并开展清理拖欠民营企业中小企业账款专项审计（来源 [SF17][SF19] 及审计公开报道；河南最新清欠偿还额未查到省级权威汇总数 [存疑]）。\n5. **营商环境评价与\"一网通办\"。** 以\"高效办成一件事\"改革为抓手推进涉企事项\"一网通办\"、智能审批、证照联办：全省累计上线 33 项\"高效办成一件事\"、办理业务超 1300 万件次；清理违反市场准入政策文件 99 个、修改或废止不平等对待企业政策 161 件；实施政府投资工程招投标\"评定分离\"改革（来源 [SF20]，另见 D01）。同时以信用建设为基础，建立\"一网公示、一口受理、一并互认\"的信用修复协同机制（来源 [SF19]）。\n\n### 三、成效与数据（标注来源）\n\n- **主体规模：** 截至 2026 年 4 月底，全省实有民营经济主体 1103.3 万户，占全部经营主体 95.9%，同比增长 1.12%（来源 [SF18]）。2025 年经营主体总量 1160.5 万户（2026 年河南省政府工作报告口径，见 [SF15] 关联公开文本；民营细分口径以 [SF18] 为准）。\n- **投资与外贸：** 2026 年 1—5 月民间投资增速高于全国 6.7 个百分点，民营企业进出口 3247.6 亿元、同比增长 29.3%，民营外贸占全省进出口 75.0%（来源 [SF18]）；2025 年 1—11 月民企进出口 5594.4 亿元、占全省外贸 66.6%，居中部第一、全国第七（来源 [SF19]）；2025 年 1—10 月全省民间投资增长 7.3%、民企进出口总值 5083.4 亿元、增长 14.7%（来源 [SF20]）。\n- **创新与就业：** 截至 2025 年前三季度，全省民营企业中高新技术企业 12649 家、科技型中小企业 27796 家，两类主体中民企占比均超 95%；累计培育省级专精特新中小企业 5340 家、国家级\"小巨人\"414 家；2024 年全省 R&D 经费 85.2% 来自企业、高于全国平均 7.5 个百分点；民营经济吸纳就业占全省城镇就业 80% 以上、税收贡献超 70%（来源 [SF19]，智库测算口径，非官方统计公报数）；在高新技术企业、专精特新\"小巨人\"中民企占比超 95% 亦见 [SF18]。\n- **执法与信用：** 2025 年全省入企检查频次同比下降 30% 以上、累计减免罚款 2.31 亿元，纳入失信名单企业数量同比下降 33.5%，为超 1.4 万家民企修复信用；截至 2025 年 11 月底\"信用中国（河南）\"完成信用修复 26629 条（来源 [SF19][SF20]）。\n- **宏参考照：** 2025 年全省 GDP 66632.79 亿元、同比增长 5.6%（来源 [SF15] 关联省统计局发布口径），为民企数据的分母背景。\n\n### 四、局限与争议\n\n1. **政策落地\"温差\"。** 从中央\"意见\"到省\"实施意见\"\"行动计划\"，文件密集但企业获得感取决于执行：涉企\"四乱\"虽经整治仍时有反弹，招投标隐性壁垒、招商引资承诺不兑现等问题在媒体报道和政企座谈中被反复提及（来源 [SF16][SF17] 报道语境；系统性第三方评估数据缺乏 [存疑]）。\n2. **清欠执行难。** 拖欠账款问题成因复杂、涉及财政承受能力，\"边清边欠\"现象存在；专项审计披露部分地方存在\"零清欠\"、清偿计划落实不到位等问题（审计公开报道；河南全省最新清偿进度无权威公开汇总数 [存疑]）。\n3. **统计口径差异。** \"民营经济主体 1103.3 万户（2026 年 4 月底）\"与\"经营主体 1160.5 万户（2025 年报口径）\"是两个不同口径，勿混用；\"民企税收占比超 70%、就业占比超 80%\"出自智库报告（[SF19]），与官方统计公报口径不同，引用须注明出处。\n4. **大企业短板未根本扭转。** 民企 500 强数量与经济规模匹配是 3 年目标而非现状；民营龙头企业在全国影响力与粤苏浙相比仍有差距（来源 [SF17] 目标反推）。\n\n### 五、可考角度\n\n- **常识**：《中华人民共和国民营经济促进法》2025 年 5 月 20 日施行（首部民营经济基础性法律）；河南省\"31 条\"实施意见（2024）；《行动计划》\"六个专项行动＋六个专项攻坚\"；\"万人助万企\"（2021 年启动）；\"三个一批\"与\"项目为王\"；《河南省优化营商环境条例》2026 年 3 月 1 日施行。\n- **案例分析**：给定\"民企反映融资难、检查多、回款慢\"材料，按\"制度（两个毫不动摇＋公平竞争）—服务（万人助万企＋一网通办）—要素（融资纾困＋要素保障）—法治（条例＋清欠＋权益保护）\"四条线作答，落到构建亲清政商关系、提振企业家信心。\n- **材料写作**：围绕\"民营企业和民营企业家是我们自己人\"\"法治是最好的营商环境\"立意，论述以营商环境之\"优\"促民营经济之\"强\"、从\"营商\"到\"赢商\"。\n\n### 六、金句/对策\n\n1. \"我们始终把民营企业和民营企业家当作自己人。\"——习近平总书记重要论述，适用于民营经济、稳预期主题开篇（来源 [SF20] 引述）。\n2. \"法治是最好的营商环境。当条例从文本走向实践，它便升华为向经营主体作出的郑重承诺。\"——适用于法治化营商环境、权益保护主题（化用自 [SF20]）。\n3. \"从'营商'到'赢商'，一字之变，折射出以法治之力激发市场活力的坚定决心。\"——适用于营商环境、招商引资主题（化用自 [SF20]）。\n4. \"民营经济兴则全局兴，民营经济活则全盘活。\"——适用于民营经济地位论证（来源 [SF16] 报道语）。\n5. 对策句：坚持\"两个毫不动摇\"，以负面清单破准入壁垒、以公平竞争审查破所有制歧视；以\"万人助万企\"和诉求快速响应机制打通政策落地\"最后一公里\"；以清欠攻坚和\"综合查一次\"降制度性交易成本；以\"科技贷\"和要素保障机制纾融资之困，让民企敢投、敢闯、敢干。\n\n## 来源与证据\n\n- [SF15] 河南省统计局、国家统计局河南调查总队《2025 年河南省国民经济和社会发展统计公报》，2026-04-16，https://www.henan.gov.cn/2026/04-16/3343041.html （白名单官方·省政府门户；2025 年 GDP 66632.79 亿元见省政府新闻办 2025 年经济运行发布会，https://www.scio.gov.cn/xwfb/dfxwfb/gssfbh/hn_13841/202601/t20260127_947966.html ）\n- [SF16] 中共河南省委、河南省人民政府《关于促进民营经济发展壮大的实施意见》（2024-05-06）；解读见河南日报《河南三十一条举措促进民营经济发展壮大》，2024-06-19，郑州市发展改革委转载 https://fgw.zhengzhou.gov.cn/work/8488377.jhtml ；全文见郑州市商务局转载 https://swj.zhengzhou.gov.cn/zcfg/8511461.jhtml （白名单官方·省辖市政府部门转载）\n- [SF17] 河南日报《促进民营经济！河南最新发文》（省委办公厅、省政府办公厅印发《河南省促进民营经济高质量发展行动计划》），2025-05-19，济源产城融合示范区工业信息和科技局转载 http://gkj.jiyuan.gov.cn/xwdt/gzdt/t978355.html （白名单官方·县级政府网转载省级党报）\n- [SF18] 央视网《经营主体突破 1103 万户 上半年河南民营经济发展稳中有进》（河南省工商联十三届八次常委会议披露数据），2026-07-22，https://local.cctv.com/2026/07/22/ARTIgIHnMZmdSXmp1H4fW5Nh260722.shtml\n- [SF19] 黄河科技学院商学部、河南中原创新发展研究院课题组《展现强大韧性的河南民营经济——河南民营经济 2025 总体分析暨 2026 前景展望》，2025-12-30，https://cxyjy.hhstu.edu.cn/info/1051/2322.htm （智库报告，非官方，数据口径已标注）\n- [SF20] 河南日报《从\"营商\"到\"赢商\"，河南正厚植沃土》，2025-12-09，河南人大网转载 https://www.henanrd.gov.cn/2025/12-09/230395.html （白名单官方·省人大）；《河南省民营经济促进条例（草案征求意见稿）》见省行政审批和政务信息管理局网站 2025-07 公开 PDF，https://xcoss.henan.gov.cn/typtfile/20250714/f891d7d9416d47298f476b035efac680.pdf （正式通过与施行时间 [存疑]）\n- [SF21] 河南省人民政府办公厅《关于印发河南省重大项目建设\"三个一批\"活动评价办法（试行）和推进重大项目建设三项制度的通知》，2022-01-06，https://fgw.henan.gov.cn/2022/01-06/2378250.html （白名单官方·省发改委）；\"项目为王\"一年综述见中国网河南《\"项目为王\"动员令发出一年，河南项目建设成效如何？》，2022-07-18，http://henan.china.com.cn/m/2022-07/18/content_42038572.html\n- [SF22] 新华社《表决通过！促进民营经济发展有了专门法》（《中华人民共和国民营经济促进法》2025-04-30 通过、2025-05-20 施行），2025-04-30，https://www.gov.cn/yaowen/liebiao/202504/content_7021914.htm （白名单官方·中国政府网转新华社）\n\n## 关联专题\n\n- [[D01]]\n- [[D11]]\n- [[D12]]\n- [[P01]]\n-\n", "D14-河南统一大市场.md": "\n## ⚡ 快速知识卡\n\n\n建设全国统一大市场是构建新发展格局的基础支撑。河南作为经济大省和贯通南北、连接东西的战略枢纽，2025 年把融入服务全国统一大市场作为高质量发展战略性举措：召开“新春第一会”，出台实施方案、建立 150 项年度任务清单、开展 10 项重点事项攻坚，落实“五统一、一开放”。总抓手是打造“四枢纽”（物流通道、消费商贸、要素配置、产业链接）、建强“三支点”（共建“一带一路”融汇、对外贸易擢转、国际投资合作），目标是建成“全国统一大市场循环枢纽”和“国内国际市场双循环支点”。2026 年 5 月省人大常委会出台专项《决定》，在全国省级层面率先以法治方式保障。可考要点：四枢纽三支点、企业迁移“一件事”、中欧班列全国第二、“扫码入企”、招商“禁止事项清单”。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n1. **区位交通优势突出，但市场循环存在卡点堵点。** 河南承东启西、连南贯北，坐拥\"米\"字形高铁网、郑州航空港和庞大人口市场。但市场主体长期反映市场准入的\"隐性门槛\"、跨区经营的\"迁徙之痛\"、物流成本的\"居高不下\"等制度性堵点，制约着从\"经济大省\"迈向\"经济强省\"（来源 [SF24]）。\n2. **地方保护与市场分割仍未根除。** 部分政策文件含有地方保护、市场分割内容；招投标、政府采购中的隐性壁垒、招商引资\"内卷\"（违规税收优惠承诺、\"抽屉协议\"）扭曲竞争（来源 [SF23]）。\n3. **物流成本偏高。** 河南物流以公路为主、内河航运长期是短板，\"公转铁\"\"公转水\"和多式联运衔接不足；开封某酸辣粉企业反映物流成本占总成本约 20%（来源 [SF24]）。\n4. **要素流动壁垒。** 土地、劳动力、资本、技术、数据等要素跨区域配置不畅，企业跨省迁移、社保跨省接续、检查检验结果互认等\"软联通\"一度是痛点（来源 [SF24][SF28]）。\n\n### 二、做法与机制\n\n1. **顶层设计：\"实施方案＋任务清单＋重点攻坚＋人大决定\"。** 2025 年 2 月 6 日河南以\"新春第一会\"形式召开融入服务全国统一大市场大会；2025 年 5 月习近平总书记在河南考察时明确要求河南\"积极融入和服务全国统一大市场，持续扩大对内对外开放\"。河南出台融入服务全国统一大市场、助力做强国内大循环的实施方案，建立 150 项年度任务清单，开展 10 项重点事项集中攻坚（含\"企业便利迁移一件事\"等）（来源 [SF23][SF24]）。2026 年 5 月 28 日省十四届人大常委会第二十四次会议表决通过《河南省人民代表大会常务委员会关于纵深推进融入服务全国统一大市场的决定》，自公布之日起施行，聚焦\"1+2+4+N\"目标任务体系，是全国省级层面率先就融入服务全国统一大市场作出的决定（来源 [SF25]）。\n2. **总体框架：建设\"四枢纽\"、打造\"三支点\"。** 即建设连通南北、贯通东西、辐射内外的物流通道枢纽，市场繁荣活跃的消费商贸枢纽，功能完善、运行高效的要素配置枢纽，特色鲜明、安全韧性的产业链接枢纽；聚力打造高质量共建\"一带一路\"融汇支点、对外贸易擢转支点、国际投资合作支点（来源 [SF25][SF26]）。注：题目常见的\"三中心一枢纽一基地\"提法未在权威公开文件中检索到，河南现行权威表述为\"四枢纽、三支点\"，答题时建议采用后者 [存疑：另一种提法出处待考]。\n3. **破壁清障：制度规则统一与政府行为规范。** 出台《河南省公平竞争审查抽查办法》，健全\"智能审查＋人工复核\"机制；开展市场准入壁垒清理整治和妨碍统一大市场政策文件专项清理，2025 年修改或废止政策文件 160 件，完成首轮 6 个省辖市市场准入效能评估；全面推行政府投资工程招投标\"评定分离\"，排查 4562 个重点工程项目招标程序；落实招商引资鼓励和禁止事项清单，实施地方财政补贴负面清单管理，建立招商引资项目首报首谈机制，严肃处理\"抽屉协议\"等\"内卷\"行为；建立\"扫码入企\"执法检查机制，2025 年前 11 个月入企行政检查频次下降 34%（来源 [SF23][SF25][SF26]）。2025 年 6 月省政府印发《关于新时期推动招商引资高质量发展的指导意见》，从制度上规范招商引资行为、反对无序竞争（来源 [SF31]）。\n4. **要素市场化配置改革。** 2025 年 9 月国务院批复郑州为全国 10 个要素市场化配置综合改革试点之一；12 月 3 日河南印发《郑州市要素市场化配置综合改革试点工作方案》，从 7 个方面提出 70 条措施，实施\"1+7+N\"方案体系；河南获批建设国家数据要素综合试验区，建成产权交易\"全省一张网\"，支持郑商所优势再造、推动郑州数据交易中心争创国家级数据交易场所（来源 [SF23][SF26][SF30]）。此前 2022 年河南已确定洛阳等 6 个省级要素市场化配置改革试点（来源：省发展改革委公开信息，见 [SF28] 课题组文章综述）。\n5. **\"空铁公水\"立体交通与多式联运。** 补内河水运短板：实施沙颍河\"通港达园\"工程，构建\"一纵三横\"骨干航道网，周口港中心港区中心作业区开港，建设中部便捷出海水运通道；推进雄商高铁、平漯周高铁、焦济洛平高铁；深化多式联运\"一单制\"\"一箱制\"改革，推动\"一次委托、一口报价、一单到底、一票结算\"，常态化开行铁海联运班列；2025 年全省高速公路通车里程突破 1 万公里、内河航道通航里程 1825 公里（来源 [SF24][SF25][SF26]）。\n6. **跨区域信用与监管协作。** 统一兼容各领域信用修复规则，2025 年帮助企业完成信用修复 2.66 万条、增长 1.6 倍；实现企业省域内跨区域信用修复协同办理\"零跑腿\"；组建省级征信公司、整合一体化融资信用服务平台，累计新增撮合信用贷款 1668.8 亿元、增长 52.3%（来源 [SF23][SF24]）。\n\n### 三、成效与数据（标注来源）\n\n- **市场循环破壁（2025 年，省新闻发布会口径）：** 修改或废止妨碍统一大市场政策文件 160 件；查处不正当竞争案件 621 起；2730 家企业实现跨省便利迁入或迁出；社保服务跨省通办人次增长 15.5%；企业迁移登记由 4 个环节整合为 1 个环节、省域内办理时间压缩至 6 个工作日以内（来源 [SF23][SF26]）。\n- **枢纽能级（2025 年）：** 全省高速公路通车里程突破 1 万公里；内河航道通航里程 1825 公里，港口吞吐量 7162 万吨、增长 17.7%；郑州机场年货运量突破 100 万吨，成为中部首个国际货运\"万架次\"级航空口岸；全省集装箱航线累计达 48 条，前 11 个月铁海联运集装箱运量 53.1 万标箱、增长 9.8%（来源 [SF24][SF26]）。\n- **物流降本：** 2025 年前三季度河南社会物流总费用与地区生产总值比率为 13.4%，低于全国平均水平 0.6 个百分点（来源 [SF23][SF24]）。河南 2025 年全年社会物流总额未检索到省级权威发布数 [存疑]。\n- **开放通道（2025 年）：** 全省中欧（亚）班列开行 3735 列、居全国第二位，其中中欧班列（郑州）开行 3417 列、增长 36.7%，开行量连续两年全国第二；河南中欧班列累计开行超 1.7 万列（来源 [SF26][SF29]）。另据新华每日电讯 2026 年 1 月报道，2025 年全省中欧（亚）班列开行 3229 列（自然列）、增长 40.3%，两个口径统计时点/口径不同，引用注意区分（来源 [SF24]）。\n- **外贸与跨境电商：** 2025 年全省进出口总值 9356.7 亿元、创历史新高；对共建\"一带一路\"国家投资增长 43.5%；新开通 16 条国际货运航线，新乡、开封获批设立跨境电商综试区（来源 [SF26]）；前 10 个月全省跨境电商进出口额 551.96 亿元、增长 39%（来源 [SF23]）；郑州航空港 2025 年跨境电商进出口货值突破 347 亿元、跃居全省第一（来源 [SF32]）。\n- **要素市场：** 2025 年前 11 个月全省技术合同成交额 2309.6 亿元、增长 63.7%；郑州数据交易中心 2025 年数据资源交易额 51.3 亿元、居全国第一方阵（另一报道口径为 48.77 亿元，口径存在差异，引用注意出处）（来源 [SF23][SF26][SF30]）。\n- **经济背景：** 2025 年前三季度河南 GDP 48867.57 亿元、增长 5.6%，高于全国 0.4 个百分点；规上工业增加值、固定资产投资、社会消费品零售总额增速均居经济大省前 2、中部前 2（来源 [SF24]）。\n\n### 四、局限与争议\n\n1. **枢纽偏好与产业带动的落差。** \"过路经济\"特征仍存：货运流量大但不必然转化为本地产业增值，学界与官方均强调要推动\"流量\"变\"留量\"、以枢纽聚产业，临港偏好型、航空偏好型产业集群培育仍需时间（来源 [SF24][SF28]）。\n2. **政策落地\"温差\"。** 破壁垒类改革成效多以文件数量、环节压减衡量，企业对隐性壁垒的实际感受改善程度缺乏系统性第三方评估 [存疑]；招商引资\"内卷\"治理涉及地方财政利益，\"边规范边反弹\"风险存在（来源 [SF23][SF25] 部署语境反推）。\n3. **统计口径差异。** 中欧班列\"3735 列\"与\"3229 列（自然列）\"、郑州数据交易额\"51.3 亿元\"与\"48.77 亿元\"等数据存在口径或时点差异；\"社会物流总额\"省级数据未见权威发布，引用须核对出处，勿混用（来源 [SF23][SF24][SF26][SF29][SF30]）。\n4. **水运短板补齐的长期性。** 内河航道里程、港口吞吐量基数仍低，沙颍河等航道等级提升和临港产业集聚是中长期过程（来源 [SF24]）。\n\n### 五、可考角度\n\n- **常识**：河南建设\"全国统一大市场循环枢纽\"、打造\"国内国际市场双循环支点\"的定位；\"四枢纽、三支点\"；2025 年 2 月 6 日融入服务全国统一大市场大会（\"新春第一会\"）；150 项年度任务、10 项重点事项攻坚；2026 年 5 月 28 日省人大常委会《决定》；郑州入选全国要素市场化配置综合改革试点（2025 年 9 月，全国 10 个之一）；中欧班列开行量全国第二。\n- **案例分析**：给定\"企业跨省迁移难、物流成本高、招商恶性竞争\"材料，按\"制度破壁（负面清单＋公平竞争审查＋清理文件）—设施联通（空铁公水＋多式联运一单制）—要素畅通（要素市场化试点＋数据交易）—监管协同（扫码入企＋跨省通办＋信用修复）\"四条线作答，落脚到把区位交通优势转化为枢纽链接优势。\n- **材料写作**：围绕\"从'地理中心'到'经济循环枢纽'\"立意，论述河南以融入服务全国统一大市场实现\"优势再造\"；或以\"破\"\"立\"并举为线索，论述破地方保护之\"壁\"、立循环枢纽之\"势\"。\n\n### 六、金句/对策\n\n1. \"把国家所需、河南所能、经营主体所盼紧密结合起来，加快建设全国统一大市场循环枢纽和国内国际市场双循环支点。\"——适用于统一大市场、河南定位主题开篇（来源 [SF23][SF28]）。\n2. \"破壁清障铺设发展'快轨'，让'有效市场'与'有为政府'更好结合。\"——适用于政府与市场关系、营商环境主题（化用自 [SF24]）。\n3. \"以枢纽聚产业，以产业强枢纽，推动'流量'变'留量'，变交通区位优势为经济发展胜势。\"——适用于枢纽经济、产业转型主题（来源 [SF28]）。\n4. \"推动从'地理中心'向'经济循环枢纽'跃升。\"——适用于优势再造、区域协调发展主题（来源 [SF28]）。\n5. 对策句：以清单管理规范政府招商行为、遏制\"内卷式\"竞争；以\"一单制\"\"一箱制\"多式联运降物流成本；以要素市场化配置改革破流动壁垒；以\"扫码入企\"和跨省通办降低制度性交易成本，让商品要素在更大范围畅通循环。\n\n## 来源与证据\n\n- [SF23] 河南省委书记刘宁《积极融入和服务全国统一大市场》（《经济日报》刊发），求是网转载，2025-12-18，https://www.qstheory.cn/20251218/80989ae1880d4f4e96ee71444cae8799/c.html\n- [SF24] 新华社《破立之间 优势再造谱新篇——河南在融入和服务全国统一大市场建设中释放增长动力》（新华每日电讯），2026-01-14，https://www.news.cn/local/20260114/33d650fec8c042e78ca0985325e8f38c/c.html （白名单官方·新华社）\n- [SF25] 《河南省人民代表大会常务委员会关于纵深推进融入服务全国统一大市场的决定》（2026-05-28 通过、公布之日起施行），河南日报刊发，河南省人民政府门户网站 2026-05-29，https://www.henan.gov.cn/2026/05-29/3359563.html （白名单官方·省政府门户）\n- [SF26] 郑州日报《融入服务全国统一大市场 我省形成一批标志性成果》（河南省纵深推进融入服务全国统一大市场新闻发布会），郑州市人民政府网 2026-02-26，https://www.zhengzhou.gov.cn/news1/9908696.jhtml （白名单官方·省会市政府网）\n- [SF27] 人民日报《河南加快建设全国统一大市场循环枢纽》，2026-03-29，http://paper.people.com.cn/rmrb/pc/content/202603/29/content_30147949.html （白名单官方·人民日报）\n- [SF28] 河南日报社、河南省社会科学院联合课题组《纵深推进融入和服务全国统一大市场的河南实践》（河南日报），河南省政协网转载 2026-01-28，https://www.hnzx.gov.cn/2026/01-28/4363357.html （白名单官方·省政协门户转载省级党报）\n- [SF29] 河南日报《枢纽通万里 开放立潮头》，2026-03-04，https://www.henandaily.cn/news/2026/0304/1209057.html （白名单官方·河南日报）\n- [SF30] 经济日报《找准定位变身\"循环枢纽\"——郑州探索融入全国统一大市场建设调查》，郑州日报转发，郑州市人民政府网 2025-12-29，https://www.zhengzhou.gov.cn/news1/9814562.jhtml （白名单官方·省会市政府网转载）\n- [SF31] 河南省人民政府《关于新时期推动招商引资高质量发展的指导意见》（2025 年 6 月印发），载《河南省人民政府公报》2025 年第 13 号（总第 529 号），https://xcoss.henan.gov.cn/typtfile/20250715/65118c5c8ef94e6181b7507c162da8c8.pdf （白名单官方·省政府公报 PDF）\n- [SF32] 河南日报客户端《跃居全省第一！郑州航空港 2025 年跨境电商进出口货值破 347 亿元》，郑州航空港经济综合实验区官网转载，2026-01-13，https://www.zzhkgq.gov.cn/2026/01-13/3617816.html （白名单官方·区政府网转载省级党报）\n\n## 关联专题\n\n- [[D01]]\n- [[D13]]\n- [[P01]]\n-\n", "D15-河南新质生产力.md": "\n## ⚡ 快速知识卡\n\n新质生产力是河南从\"经济大省\"迈向\"经济强省\"的核心抓手。2021 年起河南把\"创新驱动、科教兴省、人才强省\"置于十大战略之首，产业上构建\"7+28+N\"产业链群体系（7 大先进制造业集群、28 条重点产业链、N 个细分领域），科创上形成中原科技城、中原医学科学城、中原农谷\"三足鼎立\"大格局，重建重振省科学院、组建省实验室体系，推动规上工业企业研发活动全覆盖，配套\"万人助万企\"和产学研对接。成效：2024 年高新技术企业 13290 家、技术合同成交额 1759.39 亿元，2025 年战略性新兴产业占规上工业增加值比重超 25%。可考要点：7+28+N、三足鼎立、两城一谷、研发活动全覆盖、科技副总。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n1. **产业结构\"重\"、创新底子\"弱\"。** 河南是传统的材料、装备、食品工业大省，产业体系完备但制造业结构偏重、链条偏短，长期处于价值链中低端。新华社报道明确指出，河南迫切需要破解制造业结构\"重\"、创新\"弱\"、链条\"短\"问题（来源 [SF39]）。2021 年《中国区域科技创新评价报告2020》显示，河南综合科技创新水平指数居全国第 17 位，科技活动投入强度、产出等指标均低于全国平均（来源 [SF39]）。\n2. **研发投入强度偏低、增速落后。** 2024 年河南 R&D 经费投入 1275.10 亿元、强度 2.01%，虽连续四年超千亿元并在上年首次\"破 2\"，但投入增速比全国平均低 3.7 个百分点；全国强度 2.69%，河南明显落后（来源 [SF37]，全国数据见科技部统计公报）。河南省科技厅副厅长徐彬此前亦坦承\"高层次创新平台较少，创新主体实力不强，高端创新人才团队匮乏，科技成果转化和产业化水平不高\"（来源 [SF39]）。\n3. **高端人才短缺、历史欠账多。** 2021 年以前十多年，河南省科学院退休 170 余人、流失 120 人，却很难招来高层次人才，\"院所机制僵化、人才大量流失\"（来源 [SF39]）。高端创新人才团队匮乏是制约新质生产力的第一瓶颈。\n\n### 二、做法与机制\n\n1. **顶层战略：创新置于逻辑起点。** 2021 年省第十一次党代会将\"创新驱动、科教兴省、人才强省\"置于全省十大发展战略之首；在全国率先成立省级科技创新委员会，省委书记、省长任双主任；颁布《河南省创新驱动高质量发展条例》等法规；财政科技支出连续突破 300 亿元、400 亿元大关（来源 [SF39]）。\n2. **\"7+28+N\"产业链群体系。** 2023 年 4 月省委、省政府出台《加快构建现代化产业体系、着力培育重点产业链工作推进方案》，提出培育壮大先进超硬材料等 28 个重点产业链，聚力打造新材料、新能源汽车、电子信息、先进装备、现代医药、现代食品、现代轻纺 7 大先进制造业集群，并建立\"N\"个专精特新细分领域产业链动态调整机制（首批 18 条细分领域产业链建设方案）（来源 [SF33] 综述、[SE14]）。注：该提法在权威文本中亦写作\"7+28+N\"产业链群/群链体系，本文以\"产业链群体系\"表述为准。据省工信厅口径，\"7+28\"群链曾汇聚全省 70% 以上重点创新平台、创造 80% 以上进出口总额、60% 以上规上工业产值（来源 [SF33] 综述）。\n3. **\"三足鼎立\"科创大格局。** 以中原科技城、中原医学科学城（重建河南省医学科学院）、中原农谷为支柱形成\"三足鼎立\"科技创新大格局（来源 [SF33][SF34]）。中原科技城以重建重振的省科学院为\"魂\"，实行\"以城托院、以院拓城、院城一体\"，省科学院组建数十家研究所、研发实体总数居全国省级科学院首位；中原农谷集全省之力推进种业科研资源集中布局，与神农种业实验室、国家生物育种产业创新中心一体化建设（来源 [SF33][SF39][SF41]）。\n4. **省实验室体系从无到有。** 2021 年起先后揭牌嵩山、神农种业、黄河、龙门等省实验室，均由院士任主任；截至 2024 年底累计揭牌 27 家省实验室及 6 家省产业技术研究院，布局 41 家省产业研究院、50 家省中试基地（来源 [SF34][SF39]）。2021 年以来安排 17.3 亿元支持省科学院重建重振、23.82 亿元保障省实验室建设，累计投入 50.2 亿元支持郑大、河大\"双一流\"建设（来源 [SF39]）。\n5. **规上工业企业研发活动全覆盖。** 高质量开展规上工业企业研发活动全覆盖，制定 14 项重点工作任务，明确研发机构、标志性研发成果、创新联合体和科技领军企业核定标准，指导全省 4000 余家营收 1 亿元以上规上企业开展有组织科研（来源 [SF36]）。此前 2022 年底覆盖率已超 50%（来源 [SF33]），2025 年提升至 77.76%（来源 [SF42]）。\n6. **\"万人助万企\"与产学研对接。** 纵深推进\"万人助万企\"活动，实现\"四上\"企业走访全覆盖、累计解决一批企业问题（来源 [SF42]）；企业家出题、科学家答题，引导规上工业企业与高校共建研发中心，组建企业牵头的创新联合体（三批次 39 家，后扩展至 51 家省级），实施\"揭榜挂帅\"；出台《河南省\"科技副总\"三年行动计划（2024—2026 年）》，首批 626 名\"科技副总\"入企、第二批 1500 余名跟进（来源 [SF36][SF42]）。人才政策上实施\"1+20\"一揽子人才政策，三年来累计引进顶尖人才 30 人、领军人才 387 人、博士及博士后 1.6 万人，全省人才总量超 1410 万人（来源 [SF39]）。\n7. **未来产业布局。** 2025 年 8 月河南印发《河南省培育壮大战略性新兴产业和前瞻布局未来产业行动计划》，目标到 2027 年战略性新兴产业增加值年均增长 11% 以上、占规上工业增加值比重超 27%（来源 [SF42]）；2026 年省政府工作报告把\"创建国家未来产业先导区\"、完善中原量子谷产业生态列为任务（目标值，来源 [SE14]）。\n\n### 三、成效与数据（标注来源）\n\n- **创新主体：** 2024 年全省高新技术企业 13290 家、科技型中小企业 29106 家，较三年前实现翻番式增长（来源 [SF35][SF39]）；2025 年 11 月发布会口径：高新技术企业 12649 家（民营企业占比超 95%）、当年入库科技型中小企业首次超 3 万家（来源 [SF36]）。2026 年省政府工作报告口径：国家高新技术企业 1.28 万家、科技型中小企业 3 万家，并提出 2026 年底高企达 1.5 万家（目标值，来源 [SE14]）。\n- **技术合同成交额：** 2023 年 1367 亿元、较三年前增长 256%（来源 [SF39]）；2024 年 1759.39 亿元、增长 28.7%，全年签订技术合同 3.05 万项（来源 [SF35]）；2025 年前 11 个月 2309.6 亿元、增长 63.7%（来源 [SF42]）。2026 年目标 3000 亿元（目标值，来源 [SE14]）。\n- **产业结构：** 2024 年全省高技术制造业、工业战略性新兴产业增加值分别增长 12.0%、9.2%，均快于规上工业（来源 [SF34]）；2025 年前三季度规上高新技术产业增加值增长 10.5%，高新技术产业增加值占规上工业增加值比重达 52%（来源 [SF36]）；2025 年战略性新兴产业占规上工业增加值比重超 25%，7 大产业集群对工业贡献率超 70%（来源 [SE14]）。\n- **研发投入：** 2024 年 R&D 经费 1275.10 亿元、强度 2.01%，财政科技支出 554.39 亿元、增长 17.9%；企业 R&D 经费占全省比重 85.2%、高于全国平均 7.5 个百分点（来源 [SF37][SF36]）。\n- **平台与转化：** 省实验室 27 家、省产业研究院 55 家（累计口径，来源 [SF34][SF42]）；科技成果赋权改革 18 家试点单位赋予科研人员职务科技成果所有权或长期使用权 3000 余项、成功转化 1600 余项（来源 [SF36]）；中原科技城综合评价在全国 348 个科技城中从 2022 年第 31 位升至第 15 位（来源 [SF41]）。\n\n### 四、局限与争议\n\n1. **研发强度与全国差距仍在拉大。** 2024 年河南 R&D 强度 2.01% 对比全国 2.69%，且投入增速低于全国平均 3.7 个百分点，\"双稳升\"背后是相对位次压力（来源 [SF37]）；基础研究经费占比低，原始创新能力不足 [存疑：省级基础研究占比未见权威公开数]。\n2. **成果本地转化率不高。** 平台数量快速增长与高能级成果产出之间存在时滞；省科技厅负责人也强调要\"更加注重科技成果的转化\"，把新技术\"在河南实地转化\"（来源 [SF38]）。赋权改革转化合同金额（6.75 亿元）与全省技术合同盘子相比仍属起步阶段（来源 [SF36]，此为笔者对比计算，非官方结论）。\n3. **人才留存压力。** 短期内高端人才引进靠政策资金驱动，能否\"近悦远来\"取决于产业承载力和科研生态；省科学院曾长期\"招不来、留不住\"的历史说明生态建设非一日之功（来源 [SF39]）。省内高端岗位供给与沿海差距导致人才外流现象仍存 [存疑：缺系统性公开数据]。\n4. **新兴产业能级待突破。** 研究机构指出河南在人工智能、量子信息等\"新赛道\"起步较晚，现有新兴产业规模偏小、链条偏短，与传统产业融合互动不足（来源 [SF42]，研究机构观点、非官方定论）。\n5. **统计口径差异需注意。** 高新技术企业数存在 13290 家（2024 年末，[SF35]）与 12649 家（2025 年 11 月发布会\"截至目前\"，[SF36]）两个口径，时点不同，引用须注明；\"高新技术企业超 1.2 万家\"为通用表述。\n\n### 五、可考角度\n\n- **常识**：\"7+28+N\"产业链群体系（7 大先进制造业集群、28 条重点产业链）；\"三足鼎立\"科创大格局＝中原科技城＋中原医学科学城＋中原农谷；省第十一次党代会把创新驱动置于十大战略之首（2021 年）；全国率先成立省级科技创新委员会（书记、省长双主任）；2024 年 R&D 强度首次\"破 2\"（2.01%）；2025 年战新产业占规上工业增加值超 25%。\n- **案例分析**：给定\"传统产业占比高、科技成果外流\"材料，按\"战略引领（十大战略之首＋科创委）—平台筑基（三足鼎立＋省实验室＋中试基地）—主体培育（研发活动全覆盖＋创新联合体＋科技副总）—机制改革（揭榜挂帅＋赋权改革＋万人助万企）\"四条线作答，落脚到把科技创新\"关键变量\"转化为高质量发展\"最大增量\"。\n- **材料写作**：围绕\"因地制宜发展新质生产力\"立意，论述河南不弃传统产业、以\"7+28+N\"推动新旧动能转换；或以\"从'创新洼地'到'创新高地'\"为线索，论述后发地区靠制度创新撬动要素集聚。\n\n### 六、金句/对策\n\n1. \"把科技创新这一'关键变量'，转化为高质量发展的'最大增量'\"（省工信厅负责人口径，适用主题：创新驱动、新质生产力）（来源 [SF39]）。\n2. \"不成创新高地，就成发展洼地；不进则退，慢进亦退，不创新必退\"（河南决策语境，适用主题：危机意识、改革创新）。\n3. \"企业家出题、科学家答题\"（适用主题：产学研融合、科技成果转化）。\n4. \"把最好的地块留给科研机构，把最好的政策留给科技人员，用最强的财力打造创新平台\"（适用主题：要素保障、人才生态）（来源 [SF39]）。\n5. 对策要点：以链群思维推动\"化点为珠、串珠成链、一群多链、聚链成群\"；坚持传统产业优势再造、新兴产业培育壮大、未来产业换道领跑\"三条路\"并进。\n\n## 来源与证据\n\n- [SF33] 河南省发展和改革委员会《\"创新驱动、科教兴省、人才强省\"战略实施报告》，2023-09-07，https://fgw.henan.gov.cn/2023/09-07/2810989.html （白名单官方·省政府部门网）\n- [SF34] 河南省统计局（转载河南日报）《一份写满\"新\"意的答卷》，2025-01-20，https://tjj.henan.gov.cn/2025/01-20/3114174.html （白名单官方·省统计局网）\n- [SF35] 河南日报《建设制造强省 塑造高质量发展新优势》，2025-09-12，https://newpaper.dahe.cn/hnrb/html/2025-09/12/content_20_1757489.htm （白名单官方·河南日报/大河网）\n- [SF36] 河南省人民政府新闻办\"2025 河南省民营经济高质量发展\"系列发布会（省科技厅发布），河南省科学技术厅网 2025-11-26，https://kjt.henan.gov.cn/2025/11-26/3267966.html （白名单官方·省政府部门网）\n- [SF37] 顶端新闻·河南商报《科创投入连续四年破千亿元 河南如何持续\"点燃\"创新力？》（据河南省统计局《2024 年河南省研究与试验发展（R&D）经费投入统计公报》），转载页 2025 年，https://m.henan100.com/news/2025/1232212.shtml （媒体转述，转载页非白名单域名，数据源为省统计局公报 [存疑：未取得省统计局原始链接]）\n- [SF38] 河南广电大象新闻《六省联动话崛起·创新篇》，河南省科学技术厅网转载 2024-03-28，https://kjt.henan.gov.cn/2024/03-28/2967153.html （白名单官方·省政府部门网转载河南广电）\n- [SF39] 新华社《河南：科创局面悄然嬗变》，2024-09-01，https://www.news.cn/20240901/4e0e9648647a470ebccbba955bbb7e2b/c.html （白名单官方·新华社）\n- [SF41] 郑东新区管理委员会《科技扬帆 助活力郑州破浪前行》，2025-12，https://www.zhengdong.gov.cn/bmdt/9853865.jhtml （白名单官方·区政府网）\n- [SF42] 河南中原创新发展研究院《推动科技创新和产业创新深度融合——河南产业体系建设 2025 回顾与 2026 前瞻》，黄河科技学院网站，2026 年，https://cxyjy.hhstu.edu.cn/info/1051/2320.htm （研究机构观点，非白名单，仅用于 2025 年数据旁证）\n\n## 关联专题\n\n- [[D12]]（中原农谷、种业创新）\n- [[D13]]（民企占高企 95%、科技助企）\n- [[D14]]（技术合同、要素市场）\n- [[P01]]\n-（揭榜挂帅、赋权改革）\n", "D16-河南文旅文创融合.md": "\n## ⚡ 快速知识卡\n\n文旅文创融合战略是河南省第十一次党代会（2021 年）提出的\"十大战略\"之一，目标是把河南丰富的历史文化资源转化为文旅产业优势，推动河南从\"文旅大省\"迈向\"文旅强省\"，把文旅产业培育成支柱产业。核心抓手：塑造\"行走河南·读懂中国\"品牌体系（2024 年 9 月正式发布品牌标识），依托博物馆群、国家考古遗址公园、沉浸式演艺和\"文旅+科技\"新业态激活文化遗产。成效：2024 年全省接待游客 10.65 亿人次、旅游收入 10304.13 亿元，双双首次突破\"10 亿人次、1 万亿元\"。可考要点：文旅文创融合战略、行走河南·读懂中国、殷墟甲骨文中华文化新地标、只有河南·戏剧幻城、博物馆群。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n1. **资源富集但转化率偏低。** 河南是中华文明重要发祥地、全国大遗址分布最为密集的省份，已有 17 处国家考古遗址公园（含立项）（来源 [SF47]），2023 年全省各类博物馆已达 402 家（来源 [SF46]）。但长期以来\"资源多、爆款少\"，文化资源优势未能充分转化为产业优势，\"捧着金饭碗要饭吃\"的困境在河南文旅讨论中反复被提及 [存疑：该说法为媒体评论表述，未见官方文件原文]。\n2. **门票经济依赖、消费链条短。** 传统景区收入以门票为主，二次消费、夜间消费占比偏低；学界与智库分析指出河南文旅存在产业融合深度不够、产品同质化、淡旺季失衡等问题（来源 [SF52]，省社科联智库成果；此类为研究观点，非官方定论）。\n3. **文创产品同质化、品牌带动不足。** 文创开发以复制文物造型为主，缺少能持续变现的文化 IP；新华社报道亦指出，国内\"不缺好 IP，缺的是从文化符号到商业产品的中间层\"（来源 [SF49]，行业观点）。\n4. **外部竞争压力。** 西安大唐不夜城等周边省市沉浸式文旅强势崛起，倒逼河南从\"守资源\"转向\"造场景\"。2021 年 10 月河南省第十一次党代会在这一背景下把文旅文创融合列入\"十大战略\"（来源 [SF45] 综述、[SF52]）。\n\n### 二、做法与机制\n\n1. **顶层部署：战略+规划+大会推进。** 2021 年省第十一次党代会提出实施文旅文创融合战略；省\"十四五\"文化旅游融合发展规划要求坚持前瞻性、全局性、系统性观念，实施文旅文创融合战略、力争文化和旅游发展\"弯道超车\"（来源 [SF45]）。2024 年 6 月，省委、省政府首次以申办制在郑州举办高规格全省旅游发展大会，明确建设旅游强省的\"路线图\"\"任务书\"，将 33 项重点工作细化并纳入全省督办平台；开封、安阳等市接续召开市级文旅大会（来源 [SF44]）。在省委\"1+2+4+N\"目标任务体系中，\"把文旅产业培育成支柱产业\"是举措、\"建设文旅强省\"是目标（来源 [SF50]，河南日报版面）。\n2. **品牌引领：\"行走河南·读懂中国\"。** 2024 年 9 月 13 日，\"行走河南·读懂中国\"文旅品牌标识在复旦大学正式发布，采用\"鼎\"的造型、\"中\"的内涵（\"鼎型中意\"），以甲骨文\"水\"字演化的青铜纹样入标，寓意\"鼎立中原、宅兹中国\"（来源 [SF48]）。配套开展\"引客入豫\"专项营销，走进山东、浙江及长三角高校推介，并赴 10 个国家的 18 个重点客源市场开展\"文化走出去、游客请进来\"推广（来源 [SF44]）。\n3. **文脉工程：探源、遗址走廊与新地标。** 河南依托中华文明探源工程持续发掘二里头、殷墟、双槐树等遗址，推进世界级大遗址走廊建设；探索\"生态保遗\"郑州模式和\"远离老城建新城\"的洛阳模式，把遗址保护与生态建设、城乡发展融合（来源 [SF47]）。2024 年 2 月 26 日殷墟博物馆新馆开馆，作为首个全景式展现商文明的国家重大考古专题博物馆，把\"殷墟甲骨文\"打造为中华文化新地标（来源 [SF47][SF49] 旁证；新地标提法见 [SF51]）。\n4. **博物馆群建设。** 河南以博物馆群活化历史：2024 年国家一级博物馆增至 14 家（来源 [SF46]）；截至 2025 年全省各类博物馆 411 家，全年举办展览近 2000 个、接待观众超 9700 万人次；大河村遗址博物馆新馆 2025 年 6 月开馆试运行，全省挂牌国家考古遗址公园增至 8 家（殷墟、隋唐洛阳城、汉魏洛阳故城、郑韩故城、郑州商城、偃师二里头、渑池仰韶村、郑州大河村）（来源 [SF47]）。2024 年国庆假期全省公共文化场馆进馆人次达 381.8 万，博物馆研学成热门（来源 [SF43]）。\n5. **夜经济与演艺新空间。** 以 9 个国家级、69 个省级夜间文旅消费集聚区为载体发展夜间文旅（来源 [SF50] 同口径见文旅部 2025 年发布，引自省文旅厅）。\"只有河南·戏剧幻城\"2021 年 6 月运营，以 21 个剧场、近 800 分钟不重复演出构建全域沉浸体验场；开封万岁山武侠城以上千名 NPC 互动把武侠 IP 变成\"可进入、可扮演、可复刷\"的在场体验；清明上河园把《清明上河图》变为可步入的宋代街巷（来源 [SF49]）。\n6. **\"文旅+科技\"沉浸式体验。** 全省文博场馆数字化改造推进，\"一机游河南\"平台运营，14 家省级文创试点落地，\"华服来潮\"等 3 个系列入选 2025 年中国文创海外推广名录；河南非遗数字人推出、河南非遗美学馆开放，467 家非遗工坊带动 5.7 万人就业（来源 [SF44]）。大河村遗址博物馆新馆以数字化陈展、沉浸式演绎对仰韶文化进行全景式展示（来源 [SF47]）。河南博物院以年轻化表达重构文化 IP，\"为一座馆赴一座城\"成为现象级表述（来源 [SF49]）。\n\n### 三、成效与数据（标注来源）\n\n- **总量指标（已完成数据）：** 2024 年全省接待游客 10.65 亿人次、旅游收入 10304.13 亿元（来源 [SF44]）；省政府新闻办口径：2024 年接待游客量首次突破 10 亿人次、旅游综合收入首次突破 1 万亿元（来源 [SF45]）。两个口径数值一致、表述略异。\n- **节假日样本：** 2024 年国庆假期全省接待游客 7991.6 万人次、旅游收入 565.9 亿元，同比分别增长 5.1%、15.5%；游客接待量前五景区为万岁山 59.67 万、清明上河园 55.33 万、银基 50.05 万、云台山 45.06 万、龙门石窟 42.81 万人次（来源 [SF43]）。2024 年\"五一\"假期接待国内游客 6168.1 万人次、增长 11.8%，旅游收入 354.2 亿元、增长 14.2%（来源 [SF45]）。\n- **新业态成绩单：** 截至 2025 年底，\"只有河南·戏剧幻城\"累计观剧人次超 5800 万，其中 80% 来自省外、85% 为 18—35 岁年轻人（来源 [SF49]）；万岁山武侠城综合营收从 2022 年的 8000 多万元跃升至 2025 年的 12.7 亿元，3 年约 15 倍增长（来源 [SF49]）。\n- **博物馆板块：** 2023 年全省博物馆 402 家、接待观众 7400 多万人次（来源 [SF46]）；2025 年达 411 家、接待观众超 9700 万人次（来源 [SF45]，2026 年国际博物馆日发布）；国家一级博物馆 14 家（2024 年，来源 [SF46]）；2024 年全国博物馆接待观众 14.9 亿人次（全国口径，国家文物局，来源 [SF45]）。殷墟博物馆新馆开馆一年累计接待观众 180 万人次（来源 [SF49]，媒体报道）。\n- **等级与品牌：** 2024 年太昊伏羲陵、宝泉获评国家 5A 级旅游景区，银基获评国家级旅游度假区；8 个文旅项目获国家超长期国债补助资金 2.26 亿元（来源 [SF44]）。\n\n### 四、局限与争议\n\n1. **\"重流量、轻内涵\"的质疑。** 沉浸式演艺、NPC 互动带火客流后，学界提醒沉浸式文旅最终\"比拼内容和运营\"，需以重游率、非门票收入占比等指标衡量可持续性（来源 [SF49]，行业观点）；省社科联智库亦指出融合发展深度不够、产品同质化等问题仍待破解（来源 [SF52]，研究观点、非官方定论）。\n2. **商业化与文物保护的张力。** 大遗址、考古遗址公园的商业开发边界、\"流量倒逼保护\"的矛盾在遗产型景区普遍存在 [存疑：河南省级层面的公开量化评估未见权威文本，仅能援引个案讨论]。河南省的做法是以\"生态保遗\"\"远离老城建新城\"等模式在空间上隔离开发与保护（来源 [SF47]），但 tension 仍在。\n3. **淡旺季与区域失衡。** 节假日数据高度集中（国庆 7 天近 8000 万人次）与平日市场平淡并存；县域旅游、乡村游虽受青睐，但基础配套与产品供给不均衡（来源 [SF43]，假期样本，全年结构数据缺公开细化）。\n4. **数据口径需注意。** \"接待游客 10.65 亿人次\"为文旅系统口径（[SF44]）；央广网报道表述为\"突破 10 亿人次\"（[SF45]）；博物馆观众\"超 9700 万人次\"为 2025 年口径（[SF45]）与 2023 年\"7400 多万\"（[SF46]）时点不同，引用须注明；假期同比基数为 2023 年同期。\n5. **门票经济转型未完成。** 头部项目（只有河南、万岁山）非门票收入占比尚在爬坡 [存疑：全省非门票收入占比无公开权威数据]，\"从门票到产业\"的转型仍是进行时。\n\n### 五、可考角度\n\n- **常识**：文旅文创融合战略出自 2021 年省第十一次党代会\"十大战略\"；\"行走河南·读懂中国\"品牌标识 2024 年 9 月发布（\"鼎型中意\"）；2024 年河南接待游客 10.65 亿人次、旅游收入 10304.13 亿元；河南国家考古遗址公园 8 家挂牌（2025 年）、国家一级博物馆 14 家；殷墟博物馆新馆 2024 年 2 月 26 日开馆。\n- **案例分析**：给定\"文化资源富集但产业转化不足\"材料，按\"战略定位（十大战略＋旅游强省目标）—品牌塑造（行走河南·读懂中国＋引客入豫）—产品创新（博物馆群＋遗址公园＋沉浸式演艺）—科技赋能（数字文博＋一机游河南＋文创试点）—消费场景（夜间集聚区＋新空间）\"五条线作答，落脚到\"以文塑旅、以旅彰文\"。\n- **材料写作**：围绕\"让收藏在博物馆里的文物、陈列在广阔大地上的遗产活起来\"立意，论述河南把文化存量变成发展增量；或以\"行走河南·读懂中国\"为线索，论述地方如何把文化自信转化为发展自信。\n\n### 六、金句/对策\n\n1. \"以文塑旅、以旅彰文，推动文化和旅游融合发展\"（习近平总书记重要论述，适用主题：文旅融合、文化强国）。\n2. \"行走河南·读懂中国\"——一部河南史，半部中国史（品牌语，适用主题：文化自信、地方形象）。\n3. \"把文旅产业培育成支柱产业，建设文旅强省\"（省委部署，适用主题：产业转型、支柱产业）（来源 [SF50]）。\n4. \"为一座馆赴一座城\"（适用主题：文博热、城市更新）（来源 [SF49]）。\n5. 对策要点：从\"卖门票\"转向\"卖场景、卖体验、卖 IP\"，用重游率和非门票收入占比检验转型成色；坚持创意驱动、科技赋能、项目支撑、跨界融合\"十六字\"路径（来源 [SF44]）。\n\n## 来源与证据\n\n- [SF43] 文化和旅游部网站（来源：河南省文化和旅游厅）《河南省 2024 年国庆假期文旅市场情况》，2024-10-08，https://www.mct.gov.cn/wlbphone/wlbydd/xxfb/qglb/hn/202410/t20241008_955581.html （白名单官方·文旅部网）\n- [SF44] 文化和旅游部网站（来源：中国文化报）《河南文旅\"政策包\"助力 33 项重点工作落地生根》，2025-02-11，https://www.mct.gov.cn/whzx/qgwhxxlb/hn/202502/t20250211_958342.htm （白名单官方·文旅部网）\n- [SF45] 央广网（据中新网）《2024 年河南接待游客量突破 10 亿人次》，2025-01-06，https://news.cnr.cn/native/gd/kx/20250106/t20250106_527032716.shtml （白名单官方·央广网）\n- [SF46] 中新网河南《河南省国家一级博物馆数量达 14 家》，2024-05-18，http://www.ha.chinanews.com.cn/news/dszx/2024/0518/53440.shtml （媒体，非白名单域名；数据源为河南省文物局发布会）\n- [SF47] 人民网河南频道《河南省挂牌国家考古遗址公园增至 8 家》，2025-06-15，http://henan.people.com.cn/n2/2025/0615/c351638-41260297.html （白名单官方·人民网/人民日报河南）\n- [SF48] 南京大学网站（来源：人民网）《\"鼎型中意\"！\"行走河南·读懂中国\"文旅品牌标识正式发布》，2024-09-14，https://www.nju.edu.cn/info/1056/377601.htm （转载页，非白名单域名，原源为人民网）\n- [SF49] 新华网/人民日报图文《中式主题乐园重塑文旅赛道》，2026-06-09，https://www.news.cn/politics/20260609/90c0619e0a4a4ab9a422e9e73c3c52a7/c.html （白名单官方·新华社）\n- [SF50] 河南日报 2026-05-22 第 13 版（文旅强省建设相关版面），https://newpaper.dahe.cn/hnrb/resfile/2026-05-22/13/hnrb2026052213.pdf （白名单官方·河南日报/大河网）\n- [SF51] 河南省社科联·中原人文社科网《李庚香：塑造\"行走河南·读懂中国\"国际知名文旅品牌，全力把殷墟甲骨文打造成中华文化新地标》，2025-06-25，http://www.hnskl.org/meitijujiao/20250625/17958.html （智库/专家观点，非白名单）\n- [SF52] 河南省社科联·中原人文社科网《河南省文化旅游融合发展存在的主要问题与对策建议》（智库成果），2025-06-25，http://www.hnskl.org/zhuanti/zyzklm/zhikuchengguo/20250625/17884.html （智库观点，非白名单）\n\n## 关联专题\n\n- [[D15]]（十大战略、文旅+科技）\n- [[D12]]（只有河南\"土地、粮食与传承\"主题呼应）\n- [[P01]]（\"1+2+4+N\"与支柱产业目标）\n", "D17-河南县域经济高质量发展.md": "\n## ⚡ 快速知识卡\n\n\n县域经济是河南的基本盘：县域面积约占全省 85%、常住人口约占 70%，县域 GDP 占全省六成以上。2021 年省第十一次党代会提出“中心城市起高峰、县域经济成高原”，同年印发《关于推进新发展格局下河南县域经济高质量发展的若干意见（试行）》，以放权赋能（赋予县市 255 项管理权限）、开发区体制（“管委会+公司”）、省与市县财政体制（财政直管县扩至 102 个县市）“三项改革”增动力，配套“一县一省级开发区”“一县一主导产业”和县城城镇化补短板。成效：2025 年赛迪中部百强县河南 30 席居中部首位，巩义成为全省首个 GDP 千亿县；但强县不强、产业同质化、要素外流与财政压力仍是短板。可考要点：成高原起高峰、三项改革、开发区“三化三制”。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n1. **总量大而不强，\"强县不强\"。** 河南县域面积约占全省的 85%，常住人口约占全省 70%，生产总值约占全省 60%（来源 [SF57]；另一口径为全省 GDP 总量的 70% 左右源自县域经济，见 [SF55]，两者统计口径不同，引用须注明）。县域总量可观但缺少\"头雁\"：2023 年中部百强县榜单中河南以 28 个上榜县（市）居中部六省最多，但中部六大千亿县河南未占一席（来源 [SF57] 综述，赛迪顾问数据）。\n2. **产业同质化、价值链偏低。** 传统县域产业普遍遵循要素驱动、规模扩张路径，部分县域脱离自身资源禀赋布局通用制造、低端化工、普通建材等通用型产业，研发设计、品牌运营等高附加值环节向中心城市集聚，县域长期面临\"增产不增收\"困境（来源 [SF60]，智库观点、非官方定论）。\n3. **要素外流。** 大城市凭借产业集聚与公共服务优势持续虹吸县域人才、资本等要素，县域普遍面临人才短缺、资本匮乏、创新动能不足的问题，并伴随乡村空心化（来源 [SF60]，研究观点）。\n4. **体制机制束缚。** 在改革前，县级管理权限不足、开发区\"多而散\"、市县财政关系不顺，是《若干意见》出台时点名的三类体制障碍（来源 [SF53]）。\n\n### 二、做法与机制\n\n1. **顶层部署：\"起高峰、成高原\"与县域治理\"三起来\"。** 2021 年 10 月省第十一次党代会报告明确提出推动中心城市\"起高峰\"、县域经济\"成高原\"（来源 [SF55]）；河南省域发展以习近平总书记在河南调研时提出的县域治理\"三起来\"（把强县和富民统一起来、把改革和发展结合起来、把城镇和乡村贯通起来）为根本遵循（来源 [SF53][SF60]）。\n2. **县域经济\"三项改革\"。** 2021 年 10 月，省委、省政府印发《关于推进新发展格局下河南县域经济高质量发展的若干意见（试行）》，以放权赋能改革增强活力、以开发区改革强化支撑、以财税体制改革增添动力（来源 [SF53]）：\n   - **放权赋能改革**：按照\"能放尽放\"原则赋予县（市）255 项经济社会管理权限，凡法律法规没有明确实施层级且基层有实际需求的权限原则上交由县（市）实施（来源 [SF53]）；\n   - **开发区体制改革**：将各类园区整合为国家级、省级两个层级，新设开发区不再赋予社会管理职能，逐步推行\"管委会+公司\"和\"扁平化\"\"大部门制\"管理（来源 [SF53]）；后续以\"三化三制\"（领导班子任期制、员工全员聘任制、工资绩效薪酬制等）为主线深化，《河南省开发区高质量发展促进条例》自 2024 年 3 月 1 日起施行，将改革举措上升为法规规范（来源 [SF59] 政府计划报告口径、[SF53]）；2025 年省计划报告进一步提出深化\"一县一省级开发区\"改革（来源 [SF59]）；\n   - **财税体制改革**：2021 年 9 月省政府印发《深化省与市县财政体制改革方案》，自 2022 年 1 月 1 日起将财政直管县范围由 24 个扩大至全部 102 个县（市），县财政收入除上划中央和省级外全部留归当地、市级不再参与分享，转移支付和债券资金由省财政直接下达到县（来源 [SF53][SF61]）。\n   [存疑：媒体与地方发布中有\"县域三项改革\"的概括提法，未见省级文件标题直接使用\"三项改革\"表述，系对上述三项改革的通行概括。]\n3. **\"一县一主导产业\"、特色集群培育。** 2025 年省计划报告提出着力培育壮大特色优势产业集群、实施开发区产业集群培育和提升行动（来源 [SF59]）；实践层面各县普遍确立特色主导产业：巩义以高精铝、新材料为主导（铝板带箔产量占全国近 30%），长垣的起重机械、医疗器械，新密的耐火材料，襄城由煤化工向千亿级硅碳新材料转型等（来源 [SF57]，专家评述、赛迪数据）。2026 年《新时代县域经济学》（新华社发布）亦把\"培育和壮大主导产业\"列为县域经济发展的关键（来源 [SF62] 旁证，全国层面）。\n4. **县城城镇化补短板与城乡融合。** 2025 年省政府工作报告提出深入推进以县城为重要载体的新型城镇化建设，培育一批全国县域经济百强县、经济总量千亿县、财政收入百亿县、城区人口超 50 万县，实施产粮大县公共服务能力提升工程（目标性部署，来源 [SF54]）；省计划报告要求加快补齐县域水电气热、数字信息、教育医疗、养老托育等公共设施短板（来源 [SF59]）。\n5. **飞地经济与结对帮扶。** 通过跨县域产业合作、园区共建引导产业向县域有序转移，是省级层面推动县域协调发展的方向之一 [存疑：河南省级\"飞地经济\"专项政策文件的权威公开文本暂未检索到，此条仅为方向性表述，引用需谨慎]。\n\n### 三、成效与数据（标注来源）\n\n- **百强县数量（已完成数据）**：2022 赛迪百强县河南 6 席——巩义（第 45 位）、新郑（第 56 位）、永城（第 60 位）、济源（第 71 位）、新密（第 74 位）、汝州（第 94 位）（来源 [SF55]）。2025 年度全国综合实力百强县市（中小城市经济发展委员会口径）河南 7 席：新郑（第 35 位）、巩义（第 49 位）、荥阳（第 60 位）、禹州（第 65 位）、长垣（第 78 位）、长葛（第 79 位）、永城（第 91 位）（来源 [SF56]）。2025 全国县域综合竞争力百强县市（中郡研究所口径）河南保持 5 席（来源 [SF58]）。同一\"百强县\"因评价机构不同席位各异，引用必须注明口径。\n- **中部榜首与千亿县突破**：2025 赛迪中部百强县河南 30 个县（市）入榜居中部六省首位、前 50 位占 15 席（来源 [SF57]）。巩义市成为河南首个 GDP 千亿县（2024 年），新郑市 2024 年 GDP 为 953.6 亿元、紧随其后（来源 [SF57]，赛迪数据经媒体披露）。\n- **县域 GDP 占比**：占全省 60%—70% 区间（口径不一，见 [SF55][SF57]；智库口径为 67.7%、规上工业增加值占比超 60%，来源 [SF60]）。\n- **对照目标（目标值、非已完成）**：《若干意见》提出到 2025 年力争 10 个县（市）进入全国百强县（市）行列、10 个县（市）GDP 超 1000 亿元、10 个县（市）一般公共预算收入超 50 亿元（来源 [SF53]）。以赛迪口径，2022 年全省百强县仅 6 席、千亿县仅巩义 1 个 [存疑：目标达成情况无官方逐项评估结论，不宜直接判定\"未完成\"或\"已完成\"]。\n\n### 四、局限与争议\n\n1. **财政压力加大。** 全国县域经济研究样本显示，2024 年河南样本县（市）地方一般公共预算收入由上年微降 0.37% 转为下降 7.68%，财政收入放缓与\"三保\"支出压力并存（来源 [SF58]，研究机构样本数据、非官方发布）。\n2. **人口与要素流出。** 智库分析指出县域普遍面临人才、资本外流与乡村空心化问题，城乡居民收入差距依然显著（来源 [SF60]，研究观点）。\n3. **强县不强、头部竞争乏力。** 与湖南长沙县、浏阳市等全国头部强县相比，河南百强县在全国排位偏后、缺乏\"领头雁\"，且多依赖传统产业和资源型基础，战略性新兴产业和区域创新生态仍待培育（来源 [SF57]，专家评述）。\n4. **改革配套争议。** 财税专家指出，财政\"省直管县\"与行政\"市管县\"体制存在张力，市级对县的支持意愿可能减弱，改革不宜简单\"一刀切\"推广（来源 [SF61]，专家观点）；开发区剥离社会管理职能过程中，管委会与属地政府的协调仍需磨合（来源 [SF59] 相关部署）。\n5. **数据口径复杂。** 县域 GDP 占比有 60%、67.7%、70% 等多口径；\"百强县\"有赛迪、中小城市、中郡三套榜单；千亿县数量有 60 个（中郡，2025 年发布）与 62 个（赛迪，2024 年）之别，引用时必须注明机构与年份（来源 [SF56][SF57][SF58]）。\n\n### 五、可考角度\n\n- **常识**：\"起高峰、成高原\"出自 2021 年省第十一次党代会；县域治理\"三起来\"是习近平总书记提出的根本遵循；《若干意见》赋予县（市）255 项管理权限；2022 年 1 月 1 日起财政直管县扩大至全部 102 个县（市）；巩义是河南首个 GDP 千亿县。\n- **案例分析**：给定\"县域大而不强\"材料，按\"战略定位（三起来＋成高原）—体制改革（放权赋能＋开发区改革＋财政直管）—产业路径（一县一主导产业＋特色集群）—载体支撑（以县城为载体的城镇化＋补短板）—结果检验（百强县、千亿县、财政与就业）\"五条线作答，落脚到\"强县和富民相统一\"。\n- **材料写作**：围绕\"县域强则省域强\"\"把强县和富民统一起来\"立意，论述河南如何以改革红利对冲要素约束、以特色集群重塑县域竞争格局。\n\n### 六、金句/对策\n\n1. \"把强县和富民统一起来，把改革和发展结合起来，把城镇和乡村贯通起来\"（习近平总书记关于县域治理\"三起来\"的重要要求，适用主题：县域经济、城乡融合）。\n2. \"推动中心城市'起高峰'、县域经济'成高原'\"（省委部署，适用主题：区域协调、多极支撑）（来源 [SF55]）。\n3. \"县域强则省域强，县域活则全盘活\"（评论语，适用主题：基础单元、底盘思维）。\n4. \"一县一业、一镇一品，因地制宜培育特色优势主导产业\"（对策表述，适用主题：产业同质化破解）（来源 [SF60][SF62] 语境）。\n5. 对策要点：以放权赋能激活县级自主性，以\"管委会+公司\"做实开发区主阵地，以财政直管县增强基层财力保障；检验标准看主导产业集群能级、财政自给率与人口就近就业率，防止\"翻烧饼\"式规划。\n\n## 来源与证据\n\n- [SF53] 人民网河南频道（来源：河南日报）《河南省 255 项经济社会管理权限赋予县（市）》，2021-10-13，http://henan.people.com.cn/n2/2021/1013/c351638-34953238.html （白名单官方·人民网/人民日报河南）\n- [SF54] 河南省人民政府门户网站《2025 年河南省政府工作报告全文》，2025-02-05，https://www.henan.gov.cn/2025/02-05/3119670.html （白名单官方·省政府门户）\n- [SF55] 人民网河南频道（来源：河南日报）《河南 6 地上榜全国百强县》，2022-07-22，http://henan.people.com.cn/n2/2022/0722/c351638-40048527.html （白名单官方·人民网/人民日报河南）\n- [SF56] 新浪河南（来源：大河财立方）《全国百强名单揭晓！河南这些县市、区上榜》，2025-09-22，https://henan.sina.com.cn/news/2025-09-22/detail-infrikpr4902911.shtml （转载页，非白名单域名，原源为大河财立方）\n- [SF57] 无限鹤壁（来源：转载赛迪顾问发布稿）《河南领跑！2025 中部百强县、百强区榜单发布》，2025-11-07，https://www2.hebitv.com/wap/news/775913 （媒体，非白名单域名；数据源为赛迪顾问）\n- [SF58] 中国日报网企业频道《2025 年全国县域综合竞争力百强县市等榜单发布》，2025-12-04，https://qiye.chinadaily.com.cn/a/202512/04/WS693125f1a310942cc4994e67.html （媒体，非白名单域名；数据源为中郡县域经济研究所年度报告）\n- [SF59] 河南省发展和改革委员会《关于河南省 2024 年国民经济和社会发展计划执行情况与 2025 年国民经济和社会发展计划草案的报告》，2025-03-17，https://fgw.henan.gov.cn/2025/03-17/3137607.html （白名单官方·省政府组成部门）\n- [SF60] 映象网·智库河南《以特色产业支撑县域经济高质量发展的理论逻辑与实践价值》，2025（刊期见原文），http://zkhn.hnr.cn/zkllzx/article/1/2092822192809938945 （智库观点，非白名单）\n- [SF61] 第一财经《明年起河南所有县不再向市上交财力，财政省直管县再掀高潮？》，2021-09-24，https://www.yicai.com/news/101182616.html （媒体，非白名单；含财税专家观点）\n- [SF62] 新浪财经（来源：市场星报）《2025 年全国百强县名单\"出炉\"！》，2025-07-24，https://finance.sina.cn/2025-07-24/detail-infhnutm3389585.d.html （转载页，非白名单域名，数据源为赛迪顾问）\n\n## 关联专题\n\n- [[D15]]（开发区对接链群、县域承接产业）\n- [[D13]]（县域经营主体与特色集群的微观基础）\n- [[D12]]（产粮大县公共服务能力提升工程）\n- [[P01]]（县域综合承载能力与千亿县培育部署）\n", "D18-河南人才引育与中原人才高地.md": "\n## ⚡ 快速知识卡\n\n人才是河南创新驱动、科教兴省、人才强省战略（\"十大战略\"之首）的核心支撑。河南的困局在于：人才总量偏少、高层次人才外流、产业结构与人才结构错配、薪酬竞争力弱。破题路径：以\"中原英才计划\"（2017 年起，中原学者、中原领军人才、中原青年拔尖人才三层次）育才，自 2018 年起连年举办中国·河南招才引智创新发展大会引才，出台\"1+20\"一揽子人才政策配套住房、补贴与青年人才驿站，依托省实验室、产业研究院聚才，辅以柔性引才和\"揭榜挂帅\"。成效：截至 2021 年底全省人才资源总量 1201.23 万人，招才引智大会累计签约人才超 23.9 万人。可考要点：人才强省战略、\"1+20\"政策、引才与留才并重。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n1. **人才总量不足、增长偏慢。** 截至 2021 年底，河南全省人才资源总量 1201.23 万人，较 2012 年的 940.74 万人增长 27.7%（来源 [SF63]）——总量虽过千万，但相对于河南近亿常住人口和建设国家创新高地的需求，人才密度与高层次人才占比仍偏低（来源 [SF66] 评论视角）。\n2. **高层次人才外流。** 郑州大学、河南大学曾长期面临高端领军人才短缺；河南官方通报中\"聘请中国科学院院士李蓬、张锁江分别担任郑州大学、河南大学校长\"被作为标志性举措，侧面反映此前省内顶尖人才存量不足（来源 [SF63]）。河南本土培养的名校毕业生向北上广深和武汉、西安等周边强市分流，是长期存在的结构性现象（来源 [SF66] 研究视角，具体流出规模无官方统计 [存疑：高层次人才净流出数量无权威公开口径]）。\n3. **产业结构与人才结构错配。** 河南产业以传统制造、农业深加工为主，电子信息、生物医药等新兴产业起步晚，对博士、工程师等研发型人才的岗位承载力有限，出现\"产业留不住人、人才下不去产业\"的双向错配（来源 [SF66][SF69] 研究与媒体观察）。\n4. **薪酬与平台竞争力弱。** 与东部发达地区相比，河南企事业单位薪酬水平偏低、高端平台少，引才长期受\"工资总额\"\"职称指标\"等体制约束；2026 年河南出台人才新政，明确\"国有企业全职引进的高层次人才，薪酬不受企业工资总额限制\"，正是对这一痛点的直接回应（来源 [SF64]）。\n\n### 二、做法与机制\n\n1. **顶层战略：把人才强省摆在\"十大战略\"之首。** 河南锚定\"两个确保\"、实施\"十大战略\"，把创新驱动、科教兴省、人才强省战略作为首位战略（来源 [SF66]）；2026 年进一步出台《关于加强人社部门人才工作服务现代化河南建设的若干措施》，打通人才\"引、育、评、用、服\"全链条（来源 [SF64]）。\n2. **\"中原英才计划\"分层育才。** 该计划是省委、省政府 2017 年开始实施的高层次人才特殊支持计划，含中原学者、中原领军人才、中原青年拔尖人才三个层次共 11 类人才，配套科研经费和待遇支持（来源 [SF65]）。\n3. **招才引智创新发展大会集中引才。** 2018 年起，欧美同学会与河南省委、省政府连续联合主办中国·河南招才引智创新发展大会，以\"人才（项目）对接洽谈会＋线上 VR 招聘＋高层次人才绿色通道\"为主要形式；第六届大会现场 1368 家单位提供 5 万余个岗位，线上 3107 家单位设展提供岗位 7 万余个，设\"一站式\"绿色通道现场办理编制、聘用、博士后进站等手续（来源 [SF66]）。\n4. **\"1+20\"一揽子人才政策与安居保障。** 河南以 1 个人才发展纲领性文件加 20 个配套办法构建\"1+20\"人才政策体系，覆盖编制、薪酬、住房、补贴等环节 [存疑：\"1+20\"为媒体通行概括提法，未见省级文件标题直接使用该表述，引用需注明口径]。落地层面以郑州为例：打造 29 家青年人才驿站、3455 个床位，来郑求职青年可 7 天免费住宿；连续 5 年为 14.5 万名青年人才发放生活、购房补贴；筹集 95 个人才公寓项目、已配租 7397 套（间）（来源 [SF66]，郑州市政策口径）。\n5. **平台聚才：省实验室与一流大学郑州研究院。** 依托重构重塑的省实验室体系（如郑州大学、河南科技大学牵头联合 18 家科研院所、国家重点实验室与龙头企业组建的龙门实验室）和哈工大郑州研究院等一流大学郑州研究院，以高能级平台承载人才团队（来源 [SF66][SF67]）。\n6. **柔性引才与\"揭榜挂帅\"。** 对不便全职引进的顶尖人才，河南通过院士聘请、项目合作、博士后工作站等柔性方式引智，并以\"揭榜挂帅\"机制把企业关键核心技术需求变成攻关课题、面向全国遴选团队 [存疑：河南省级\"揭榜挂帅\"专项文件文本未单独核验，此条为政策方向性表述，引用需谨慎]。\n\n### 三、成效与数据（标注来源）\n\n- **人才总量（已完成数据）**：截至 2021 年底全省人才资源总量 1201.23 万人，较 2012 年增加 170 万人、增长 27.7%（来源 [SF63]）。\n- **招才引智大会累计签约（已完成数据）**：截至 2022 年 9 月，2018 年以来连续举办四届，累计签约各类人才逾 20 万人，其中硕士、博士及副高以上职称人才 9.4 万人，落地人才合作项目 2289 个（来源 [SF63]）；截至 2023 年 10 月第六届大会，累计签约各类人才 23.9 万人、引进顶尖人才团队 1312 个、落地高质量人才合作项目超 2400 个（来源 [SF66]）。2022 年上半年引进\"两院\"院士、\"长江学者\"、国家杰出青年基金获得者等高层次人才 62 人（来源 [SF63]）。\n- **博士后目标与进度（注意区分目标与已完成）**：目标值——到 2025 年招收引进万名博士后等青年人才（来源 [SF70]）；已完成值——截至 2022 年 7 月累计招收博士后 7208 人（来源 [SF70]）。目标达成情况无官方逐项评估结论 [存疑：2025 年\"万名博士后\"目标完成情况未检索到权威通报]。\n- **\"十五五\"量化目标（目标值、非已完成）**：\"十五五\"末全省技能人才规模达到 2250 万人、其中高技能人才 800 万人以上；期间新增高级职称以上人才 30 万人以上、专业技术\"二级岗\"人才 1500 人以上；30 岁以下副高级、35 岁以下正高级、45 岁以下\"二级岗\"人才分别新增 500 人、300 人、300 人（来源 [SF64]）。\n- **个案佐证**：郑州大学\"90 后\"随权通过省优秀青年人才考核认定和职称\"绿色通道\"，2025 年从讲师直接晋升正高级研究员，成为郑大最年轻的正高之一（来源 [SF64]）。\n\n### 四、局限与争议\n\n1. **重引进、轻留存。** 各地政策资源集中于\"签约落地\"环节，对人才落地后的职业发展、子女教育、医疗服务等长期需求支撑不足；专家指出政策生命力在于落实，需压实用人单位主体责任、把政策兑现做实（来源 [SF64] 专家观点）。签约人数统计口径为\"签约\"，落地率与留任率无公开追踪数据 [存疑：签约人才实际留豫率无权威口径]。\n2. **政策同质化、区域竞争加剧。** 住房补贴、生活补贴、人才驿站等政策工具在武汉、合肥、长沙等中部城市高度雷同，河南薪酬与平台优势不明显，单靠补贴难以形成持续竞争力（来源 [SF69] 区域观察视角）。\n3. **数据口径需要辨析。** \"累计签约人才 20 万+\"是历届大会累计签约数，与实际到岗、留豫就业人数是不同口径；\"人才资源总量\"与\"高层次人才\"\"技能人才\"分属不同统计范围，引用必须注明口径与年份（来源 [SF63][SF64][SF66]）。\n4. **体制约束仍在破题途中。** 特设岗位、职称绿色通道、离岗创业等新政 2026 年才系统出台，事业单位岗位结构比例、国企工资总额等历史约束的消化仍需时间（来源 [SF64]）。\n\n### 五、可考角度\n\n- **常识**：创新驱动、科教兴省、人才强省战略是河南\"十大战略\"之首；\"中原英才计划\"2017 年起实施，分中原学者、中原领军人才、中原青年拔尖人才三层次；中国·河南招才引智创新发展大会 2018 年首次举办；截至 2021 年底全省人才资源总量 1201.23 万人。\n- **案例分析**：给定\"人才外流与产业升级\"材料，按\"战略定位（人才强省之首）—政策供给（1+20＋安居保障）—平台支撑（省实验室＋研究院＋大会引才）—机制创新（绿色通道＋柔性引才＋揭榜挂帅）—结果检验（总量、结构、留存）\"五条线作答，落脚到\"引才、育才、用才、留才全链条\"。\n- **材料写作**：围绕\"聚天下英才而用之\"\"让人才近悦远来\"立意，论述中部省份如何以体制机制改革对冲区位与薪酬劣势、以平台留人替代单纯待遇留人。\n\n### 六、金句/对策\n\n1. \"今日之河南，比以往任何时候都重视创新，比以往任何时候都渴求人才\"（招才引智创新发展大会语境，适用主题：人才强省、创新驱动）（来源 [SF66]）。\n2. \"万家灯火，总有一盏属于你\"（河南青年人才安居服务表述，适用主题：留才环境、青年友好）（来源 [SF66]）。\n3. \"以平台聚人才、以平台育人才\"（对策表述，适用主题：平台留人、产才融合）（来源 [SF66]）。\n4. \"评价标准从'看资历'转向'看实绩'\"（人才职称改革要点，适用主题：体制机制改革）（来源 [SF64]）。\n5. 对策要点：引才端保持大会与\"绿色通道\"机制化运作，育才端用好\"中原英才计划\"分层梯队，留才端把补贴一次性投入转向住房、教育、医疗等全周期服务；检验标准看高层次人才净流入、签约人才留豫率和产业人才匹配度，防止\"重签约、轻落地\"。\n\n## 来源与证据\n\n- [SF63] 中国网（来源：中国新闻网）《河南人才资源总量超1200万人》，2022-09-20，http://news.china.com.cn/2022-09/20/content_78428312.htm （转载页，原源为中新网，数据出自省委宣传部\"河南这十年\"新闻发布会）\n- [SF64] 河南日报网《为引才松绑 为英才搭台 为发展赋能 我省\"人才新政\"含金量有多高》，2026-08-04，https://www.henandaily.cn/news/2026/0804/1244123.html （白名单官方·河南日报）\n- [SF65] 河南大学校友会/黄河文明中心网页《我校22位专家学者入选\"中原英才计划\"(育才系列)》，https://xyh.henu.edu.cn/news/zhkd/show-5138.html （高校官网，非白名单域名；内容为\"中原英才计划\"制度介绍）\n- [SF66] 欧美同学会网站《搭建平台\"引才\" 诚意服务\"留才\"——河南正在加速形成近悦远来的人才生态》，2023-11-03，https://www.wrsa.net/1002154/2023/11-03/content_42534192.htm （主办机构官网，非白名单域名；含第六届大会与郑州市人才安居数据）\n- [SF67] 河南省人民政府门户网站《一流大学郑州研究院呈集聚之势——人才磁场引发创新\"聚变\"》，2024-12-05，https://www.henan.gov.cn/2024/12-05/3095185.html （白名单官方·省政府门户）\n- [SF69] 新华网评论《\"柔性引才\"推动发展向\"新\"而行》，2025-06-17，http://www.xinhuanet.com/comments/20250617/526a1481d35f4116a518396c03ffd282/c.html （白名单官方·新华网；全国层面柔性引才评论，作观点旁证）\n- [SF70] 河南工业大学人事处转载（来源：河南日报）《河南省到2025年将招引万名博士后等青年人才》，2022-07-05，https://hr.edu.cn/zwhzx/jiaoyuzx/202207/t20220705_2236003.shtml （高校转载页，原源为河南日报）\n\n## 关联专题\n\n- [[D15]]（产业人才需求端与链群承载平台）\n- [[D13]]（企业端引才用才主体）\n- [[D14]]（人力资源要素市场化配置）\n- [[D17]]（县域人才短缺与要素外流的另一面）\n", "P01-政策-河南2026政府工作报告.md": "\n# 2026年河南省政府工作报告摘要\n\n> 说明：本篇依据实际年份为 2026 的现行版本撰写——2026年1月26日河南省第十四届人民代表大会第四次会议上，省长王凯所作《政府工作报告》，全文由河南日报发布、河南人大网转载。数字与政策名均标注来源，未作推测。\n\n## ⚡ 快速知识卡\n\n2026年河南省政府工作报告是\"十五五\"开局之年的总部署。报告回顾\"十四五\"（GDP达6.66万亿元、粮食连续稳定高产）与2025年（GDP增长5.6%、粮食产量1350.97亿斤），提出2026年经济增长5%左右、粮食产量1300亿斤以上等预期目标，部署融入服务全国统一大市场、扩内需、现代化产业体系、乡村全面振兴、城乡区域协调、改革开放、文化、绿色转型、民生、防风险等十个方面重点工作。核心框架是\"1+2+4+N\"目标任务体系。选调考试中，本篇是时政常识题的直接题源，也是申论论述河南定位（粮食安全、统一大市场、新质生产力、黄河战略）时引用目标与数据的权威依据。\n\n## 📖 深度专题\n\n### 一、政策背景\n\n- 会议时间与主体：2026年1月26日，河南省十四届人大四次会议开幕，省长王凯作政府工作报告[SE12][SE13]。\n- 时间节点意义：2026年是\"十五五\"开局之年；报告同时审查《河南省国民经济和社会发展第十五个五年规划纲要（草案）》[SE13]。\n- 总纲：报告明确聚焦\"1+2+4+N\"目标任务体系，贯彻习近平总书记在河南考察时重要讲话精神和关于河南工作的重要论述，落实中部地区加快崛起、黄河流域生态保护和高质量发展等国家战略部署[SE13]。\n- \"十四五\"收官基础：生产总值6.66万亿元，财政总收入7019亿元，经营主体1160.5万户，常住人口城镇化率60%，\"米\"字形高铁网全面建成，高速公路通车里程突破1万公里[SE13]。\n\n### 二、核心目标与数字（2026年主要预期目标）[SE13]\n\n| 指标 | 目标 |\n|---|---|\n| 经济增长 | 5%左右，努力争取更好结果 |\n| 规上工业增加值 | 增长6.5%左右 |\n| 固定资产投资 | 增长5%左右 |\n| 社会消费品零售总额 | 增长5.5%左右 |\n| 一般公共预算收入 | 增长4%左右 |\n| 城镇调查失业率 | 5.5%左右 |\n| 城镇新增就业 | 110万人以上 |\n| 居民消费价格涨幅 | 2%左右 |\n| 粮食产量 | 1300亿斤以上，力争比去年更多增长 |\n| 居民收入 | 增长与经济增长同步 |\n\n2025年实际完成数（报告回顾部分）：GDP增长5.6%，规上工业增加值增长8.4%，工业投资增长13.3%，进出口总值增长14.1%，粮食产量1350.97亿斤，主要指标增速居全国前列[SE13]。注意区分：1350.97亿斤是2025年\"已完成数据\"，1300亿斤以上是2026年\"目标值\"。\n\n\"十五五\"展望：经济年均增长5%左右，农业强省、制造强省、科教强省、数智强省、交通强省、文旅强省建设取得实质性进展；如期实现2030年前碳达峰目标[SE13]。\n\n### 三、重点任务（2026年十个方面）[SE13]\n\n1. **纵深推进融入和服务全国统一大市场**：制定融入服务全国统一大市场建设行动方案；实施营商环境优化提升行动、规范涉企执法行动（\"扫码入企\"、\"一业一查\"）；建设物流、消费商贸、要素配置、产业链接四类枢纽；打造\"空中丝路\"融汇支点等三大支点。\n2. **大力拓展内需增长新空间**：提振消费专项行动、消费品以旧换新、推广胖东来经验；实施1000个以上省重点项目、年度完成投资1万亿元；推进平漯周、焦济洛平等高铁项目，开工建设南信合高铁。\n3. **加快建设现代化产业体系**：建强先进制造业、现代服务业、数智赋能、科技支撑四大体系；国家高新技术企业达到1.5万家、科技型中小企业3.2万家；数字经济规模2.5万亿元；技术合同成交额力争3000亿元；实施100项省级重大科技专项。\n4. **扎实推进乡村全面振兴**：实施百亿斤粮食产能提升工程，推进66个粮食产能提升重点县和豫东平原200万亩整区域高标准农田项目，新建改造高标准农田400万亩以上；壮大6大特色产业集群和18条乡村富民产业链；建成35个先导区、1000个和美乡村；新改建农村公路5000公里、村级寄递物流综合服务点3万个以上；守牢不发生规模性返贫致贫底线。\n5. **着力推动城乡区域协调发展**：\"一主两副\"（郑州国家中心城市，洛阳、南阳）；\"一圈两带\"（郑州都市圈、郑开同城化）；支持巩义、永城、林州等10个县（市）发展成为中等城市。\n6. **统筹推进深层次改革高水平开放**：启动新一轮国资国企改革行动；实施促进民营经济高质量发展行动计划；**全面开展第二轮土地承包到期后再延长30年整省试点**；常态化推进\"高效办成一件事\"；中欧（亚）班列开行4000班次；新增有进出口实绩企业1500家以上。\n7. **全面激发文化创新创造活力**：支持郑州、开封、洛阳、安阳创建国家文物保护利用示范区；擦亮\"行走河南·读懂中国\"品牌；建设黄河古都群文化旅游目的地。\n8. **加力促进经济社会全面绿色转型**：大气污染治理提质增效；深化幸福黄河三年行动；可再生能源发电装机突破1亿千瓦；新培育绿色工厂200个、绿色工业园区10个。\n9. **更大力度保障和改善民生**：新增农村劳动力转移就业40万人，职业技能培训200万人次；接续实施乡村振兴村级协理员、万名大学生助企服务专项计划；省属公办高校生均经费增加1000元；启动基本医疗保险省级统筹；完善三级养老服务网络。\n10. **有力有效防范化解重点领域风险**：安全生产治本攻坚三年行动收官；完善全口径地方债务监测，完成地方政府融资平台退出；加强党建引领基层高效能治理，扎实推进\"五基四化\"，坚持和发展新时代\"枫桥经验\"。\n\n### 四、与河南选调的关联\n\n- **面试/申论素材直接来源**：选调生到村任职、基层治理岗位的核心语境就是报告中的乡村全面振兴、和美乡村、\"五基四化\"、防止返贫等部署；引用报告原文（如\"守牢不发生规模性返贫致贫底线\"）能显著提升作答权威性。\n- **身份契合点**：报告明确\"接续实施乡村振兴村级协理员\"\"公务员招录计划向县乡基层机关倾斜\"（一号文件），选调生正是这批基层力量储备的组成部分，可在自我认知与岗位匹配题中引用。\n- **省情定位题**：\"1+2+4+N\"目标体系、\"一主两副\"\"一圈两带\"、六大强省（农业/制造/科教/数智/交通/文旅）是河南定位类题目的标准框架。\n- **热点呼应**：第二轮土地承包延包30年整省试点、全国统一大市场（河南行动方案）、\"空中丝路\"均为2026年度河南特有热点，中央政策+河南落地的组合最常考。\n\n### 五、可考角度\n\n- 常识：2026年河南粮食产量目标（1300亿斤以上）；\"十四五\"末河南GDP总量（6.66万亿元）；2025年GDP增速（5.6%）与粮食产量（1350.97亿斤）；\"米\"字形高铁网全面建成。\n- 案例分析：以\"1000个省重点项目、年度投资1万亿元\"分析扩大有效投资的路径；以\"四类枢纽+三大支点\"分析河南如何融入全国统一大市场。\n- 材料写作：围绕\"经济大省挑大梁\"\"现代化河南建设\"组织分论点——稳粮食基本盘、强产业集群、活县域经济、惠民生底线，每个分论点都可回扣报告数据。\n\n### 六、金句/对策\n\n1. \"扛起了经济大省挑大梁责任\"——适用于大作文论述河南担当、区域协调发展主题。[SE13]\n2. \"让民事无忧、企事有解、政事高效\"——适用于营商环境、数字政府、服务型政府主题。[SE13]\n3. \"守牢不发生规模性返贫致贫底线\"——适用于巩固脱贫成果、乡村振兴底线思维主题。[SE13]\n4. \"推动经济实现质的有效提升和量的合理增长，实现'十五五'良好开局，奋力谱写中原大地推进中国式现代化新篇章\"——适用于高质量发展、开局起步类结尾。[SE13]\n5. \"树立和践行正确政绩观，坚持为人民出政绩、以实干出政绩\"——适用于基层干部作风、政绩观主题。[SE13]\n\n## 来源与证据\n\n- [SE12] 河南省人民政府门户网站《海报丨快看！2026年河南省政府工作报告来了》，2026-01-26，https://www.henan.gov.cn/2026/01-26/3313941.html\n- [SE13] 河南日报《政府工作报告（全文）——2026年1月26日在河南省第十四届人民代表大会第四次会议上》，河南人大网转载，2026-02-03，https://henanrd.gov.cn/2026/02-03/233636.html\n- [SE14] 河南省人民政府门户网站《2026年河南省政府工作报告》，2026-02-03，https://www.henan.gov.cn/2026/02-03/3319596.html\n- [SE15] 河南省发展和改革委员会《政府工作报告》（2026年河南两会专题），2026-02，https://fgw.henan.gov.cn/2026/02-03/3319580.html\n- [SE16] 河南省人民政府门户网站《聚焦2026年河南两会》专题，2026-01，https://www.henan.gov.cn/zt/2026zt/jj2026nhnlh\n\n## 关联专题\n\n- [[P02]]\n- [[D10]]\n", "P02-政策-河南乡村振兴一号文件.md": "\n# 2026年河南省委一号文件摘要\n\n> 说明：本篇依据实际年份为 2026 的现行版本撰写——《中共河南省委 河南省人民政府关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》（2026年2月12日），2026年5月30日由河南日报受权发布、河南省政府网站群转载。所有数字与政策名均有来源，未作推测。\n\n## ⚡ 快速知识卡\n\n2026年河南省委一号文件是\"十五五\"开局之年指导全省\"三农\"工作的纲领性文件，以推进乡村全面振兴为总抓手、以学习运用\"千万工程\"经验为引领，部署六大板块：持续提升粮食综合生产能力（粮食面积稳定在1.6亿亩以上、产量稳定在650亿公斤以上）、把农业建成现代化大产业（6大产业集群、18条乡村富民产业链）、统筹建立常态化防止返贫致贫机制、宜居宜业和美乡村建设（2026年培育35个先导区）、农村重点领域改革（第二轮土地承包延包30年整省试点）与党建引领基层治理。它把中央一号文件精神河南化、具体化，是选调考试\"三农\"主题的最高优先级政策文本：粮食安全、防返贫、和美乡村、延包试点四条线都从这里出题。\n\n## 📖 深度专题\n\n### 一、政策背景\n\n- 文件全称与成文时间：《关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》，成文于2026年2月12日，2026年5月30日公开发布[SE17][SE18]。\n- 顶层语境：贯彻习近平总书记关于\"三农\"工作的重要论述和视察河南重要讲话精神，聚焦\"1+2+4+N\"目标任务体系，坚持农业农村优先发展、城乡融合发展，锚定农业农村现代化[SE17]。\n- 三个\"总牵引\"：以推进乡村全面振兴为总抓手，以学习运用\"千万工程\"经验为引领，以改革创新为根本动力；总目标是\"守牢粮食安全底线，持续巩固拓展脱贫攻坚成果，提升乡村产业发展水平、乡村建设水平、乡村治理水平\"[SE17]。\n- 时间节点意义：2026年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5年过渡期后转向常态化帮扶的第一年，文件专章部署常态化防止返贫致贫机制[SE19]。\n- 底盘数据（文件发布之际的河南\"三农\"基本面）：河南粮食总产量稳居全国第二，连续9年稳定在1300亿斤以上；\"十四五\"期间新建、改造提升高标准农田3167万亩；农业科技进步贡献率67%，主要农作物良种覆盖率超97%，耕种收综合机械化率90%，三项指标均高于全国平均水平[SE19]。\n\n### 二、核心目标与数字\n\n- 粮食硬指标：确保粮食播种面积稳定在**1.6亿亩以上**，粮食产量稳定在**650亿公斤以上**（即1300亿斤以上）[SE17]。\n- 百亿斤粮食产能提升工程：建设1500万亩小麦、100万亩水稻、2000万亩玉米、80万亩大豆高产示范区[SE17]。\n- 产业目标：打造粮食等**6大产业集群**、小麦等**18条乡村富民产业链**；发展设施种植业促进农民增收三年行动[SE17]。\n- 和美乡村：2026年培育**35个**宜居宜业和美乡村建设先导区，实施\"千村引领\"和美乡村建设行动；到2030年建成先导区120个，先导区内村庄率先具备现代生活条件，建设和美村5000个、辐射带动富美村1万个、洁美村1.5万个[SE17][SE19]。\n- 帮扶资金：将省级财政衔接推进乡村振兴补助资金调整为省级财政**常态化帮扶资金**，保持省市两级投入规模稳定[SE17]。\n- 延包试点：启动第二轮土地承包到期后再延长三十年**整省试点**，到**2028年**全省基本完成延包工作[SE17]。\n- 民生背景数据：2025年河南农村居民人均可支配收入22550元，增长5.7%，城乡收入比缩至1.95[SE19]。\n\n### 三、重点任务（六大板块二十六条）\n\n1. **持续提升粮食综合生产能力**（第一至五条）：粮食大面积单产提升行动（向科技、管护、防控、市场要粮）；严守耕地红线、严格占补平衡，整治\"大棚房\"、耕地\"非农化\"、永久基本农田\"非粮化\"，以\"投建运管\"一体化机制建高标准农田；强化农业科技与装备支撑——推动中原农谷、周口国家农高区协同发展，建强国家生物育种产业创新中心，推进神农种业实验室资源整合，建好洛阳现代农机装备国家先进制造业集群；增强防灾减灾能力；完善完全成本保险、最低收购价、产销区省际横向利益补偿等强农惠农政策[SE17]。\n2. **加快把农业建成现代化大产业**（第六至十条）：重要农产品稳产保供（生猪产能调控、奶业纾困）；发展乡村富民产业，实施农村电商高质量发展工程，培育\"小而美\"文旅业态；大力发展设施农业；打造\"豫农优品\"区域公用品牌；分类发展县域经济（大城市周边县、区域重点县、专业功能县、农业大县、重点生态功能区县五类施策）[SE17]。\n3. **统筹建立常态化防止返贫致贫机制**（第十一至十四条）：健全常态化帮扶政策体系，守牢不发生规模性返贫致贫底线；完善监测体系，做到早发现、早干预、早帮扶，建立动态调整机制；提升产业和就业帮扶质效（落实\"四个一批\"、帮扶项目资产全周期管理、以工代赈扩面）；确定一批省级乡村振兴重点帮扶县，开展\"组团式\"帮扶和科技特派团\"产业式\"帮扶[SE17]。\n4. **因地制宜推进宜居宜业和美乡村建设**（第十五至二十条）：片区化推进、组团式发展、先导区引领；城乡供水一体化、\"四好农村路\"、客货邮融合；县域普通高中振兴、医疗卫生强基工程、大学生乡村医生专项计划、县乡村三级养老服务网络；整治改厕、垃圾围村、污水；深化\"五基四化\"、持续深化\"五星\"党支部建设、公务员招录计划向县乡基层机关倾斜、不得从县乡借调工作人员；推进移风易俗、整治高额彩礼，坚持和发展新时代\"枫桥经验\"，深化\"党建+网格+大数据\"模式[SE17]。\n5. **推进农村重点领域和关键环节改革**（第二十一至二十六条）：延包三十年整省试点（2028年基本完成）；农村集体经营性建设用地入市（严禁建商品住房）、宅基地规范审批；发展新型农村集体经济、整治\"三资\"问题；建设现代农事综合服务中心（支持周口市整域先行先试）；\"政银担保投\"联动支农；推动城乡要素双向流动——实施\"三支一扶\"、乡村振兴村级协理员、大学生志愿服务乡村振兴等人才计划[SE17]。\n6. **加强党对\"三农\"工作的全面领导**：五级书记抓乡村振兴，省负总责、市县乡抓落实；用好乡镇履职事项清单、村（社区）工作事项准入制度，整治形式主义为基层减负；开展\"清廉河南\"基层建设行动[SE17]。\n\n### 四、与河南选调的关联\n\n- **高频出题区**：选调生岗位在乡村一线，文件中粮食安全党政同责、防返贫\"早发现早干预早帮扶\"、和美乡村先导区、\"五星\"支部建设、移风易俗都是案例分析与材料写作的直接命题语境。\n- **基层减负与人才政策可作答\"如何留住基层干部/人才\"**：文件明确公务员招录向县乡倾斜、不得从县乡借调工作人员、落实村干部基本报酬保障、实施村级协理员等计划——回答\"基层治理\"\"青年到村去\"类题目的现成对策。\n- **改革类考题**：延包整省试点是全国唯一的整省试点层次的政策（河南地位特殊），结合\"整体 CSP：稳面积、优结构、提单产\"理解河南作为粮食大省的政治责任。\n- **与政府工作报告互为印证**：报告（P01）中\"建成35个先导区、1000个和美乡村\"\"新建改造高标准农田400万亩以上\"与一号文件同口径，两文对照记忆可同时覆盖常识题两个出题源。\n\n### 五、可考角度\n\n- 常识：文件全称与印发时间（2026年2月12日）；粮食面积1.6亿亩、产量650亿公斤（1300亿斤）双底线；6大产业集群、18条乡村富民产业链；延包整省试点、2028年基本完成；2026年35个先导区。\n- 案例分析：给定某县高标准农田\"投建运管\"一体化或农事综合服务中心材料，考查分析\"谁来建、怎么管、如何长效\"；给定防返贫监测案例，考\"早发现、早干预、早帮扶\"机制设计。\n- 材料写作：以\"学习运用'千万工程'经验，建设宜居宜业和美乡村\"为主题，按\"产业富民—建设塑形—治理铸魂\"三分论点展开，各论点引文件原文支撑。\n\n### 六、金句/对策\n\n1. \"守牢粮食安全底线……把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好\"——适用于乡村振兴总论、农业强国主题开头。[SE17]\n2. \"向科技要粮、向管护要粮、向防控要粮、向市场要粮\"——适用于粮食安全、藏粮于技主题的分论点骨架。[SE17]\n3. \"做到早发现、早干预、早帮扶，守牢不发生规模性返贫致贫底线\"——适用于底线思维、民生保障主题。[SE17]\n4. \"摒弃'千村一面'的粗放建设模式，坚持片区化推进、组团式发展、先导区引领，打造各具特色的现代版'富春山居图'\"——适用于乡村建设、因地制宜方法论主题。[SE17][SE19]\n5. \"办好农村的事情，实现乡村振兴，关键在党\"——适用于基层党建、乡村治理主题的升华段。[SE17]\n\n## 来源与证据\n\n- [SE17] 河南日报《中共河南省委 河南省人民政府关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》，河南省发展和改革委员会网站转载，2026-05-30，https://fgw.henan.gov.cn/2026/05-30/3359969.html\n- [SE18] 河南省人民政府门户网站《中共河南省委 河南省人民政府关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》，2026-05-30，https://www.henan.gov.cn/2026/05-30/3359959.html\n- [SE19] 新华网河南频道（来源：河南日报）《沃野中原逐浪向新——写在2026年省委一号文件发布之际》，2026-05-30，http://ha.news.cn/20260530/ffeef9eb007c4622b8f680ac93f39dea/c.html\n- [SE20] 郑州市中原区人民政府网站（来源：河南日报）《重磅！2026年河南省委一号文件发布》，2026-05-30，https://www.zhongyuan.gov.cn/rdhy/10078595.jhtml\n- [SE21] 河南省人民政府国有资产监督管理委员会《2026年河南省委一号文件发布》，2026-05-30，https://gzw.henan.gov.cn/2026/05-30/3360021.html\n\n## 关联专题\n\n- [[P01]]\n- [[D09]]\n- [[D10]]\n", "W01-周报-2026-07-05.md": "\n# W01 · 河南时政周报（2026-06-29 — 2026-07-05）\n\n## ⚡ 快速知识卡\n\n本周河南时政主线有四：一是省级密集出台稳经济政策，6月30日省政府新闻办吹风《河南省交通运输结构调整专项行动方案（2026—2028年）》，7月6日印发促进民间投资高质量发展20条；二是7月1日庆祝建党105周年大会举行，全省深入学习习近平总书记重要讲话精神；三是开放通道扩容，7月1日郑州国际陆港新增3条中欧（亚）班列图定线路；四是民生领域，7月3日失业保险稳岗扩岗\"两延续一优化\"政策落地、7月8日高招录取启动。本周期内黄河调水调沙持续推进（6月22日启动），是水利与生态治理的标志性事件。考法以常识（政策名称、时间、目标数字）与案例分析（运输结构调整逻辑）为主。\n\n## 📖 本周要闻十条\n\n### 1. 《河南省交通运输结构调整专项行动方案（2026—2028年）》政策吹风\n6月30日16时，省政府新闻办召开政策例行吹风会，省交通运输厅厅长付磊介绍《方案》。《方案》于6月10日由省政府办公厅印发，明确\"油改电、公转铁、公转水、多式联运\"四大核心调整路径。背景数据：2025年全省货运量30.26亿吨，公路货运占比88.5%，较全国（73.7%）高14.8个百分点，铁路、水路占比仅4.5%和7%。目标：到2028年公路货运量占比降至86.1%左右，新能源运输量占比提升至25%以上，水路货运量占比升至9.1%左右，铁路货运量占比升至4.8%左右。（来源[SE22][SE23]）\n\n### 2. 电动重卡充换电站布局与新能源货车补贴\n吹风会披露：6月10日省政府办公厅印发《河南省电动重卡充换电站布局建设方案》，全省布局新能源重卡充换电站257座、打造24条零碳运输通道；2026年开工建设100座、建成60座以上。6月16日五部门印发老旧营运货车新能源替代补贴政策，2026年补贴新能源货车购车金额的15%且不超过8万元，叠加国家补贴每辆车最多可获22万元补贴；计划2027年新能源营运货车保有量达3.3万辆、2028年达3.8万辆。（来源[SE22]）\n\n### 3. 郑州国际陆港新增3条中欧（亚）班列图定线路\n7月1日，河南新增3条中欧（亚）班列图定线路，全部落地郑州国际陆港航空港片区新郑站：南向新增磨憨—新郑／圃田东盟回程图定线路（每周2列，全省首条东盟方向回程图定班列）；北向新增新郑／圃田—满洲里图定线路（全省首条经满洲里口岸出境的图定班列）；西向新增新郑／圃田—阿拉山口图定线路。2026年1至5月河南中欧（亚）班列累计开行1556列、同比增长25.7%。全省存量图定线路全部实现圃田、新郑双站点兼容作业。（来源[SE24]）\n\n### 4. 河南中欧班列累计开行突破1.9万列\n6月25日，一列满载机械零配件、新能源汽车的班列从郑州集结中心驶出，河南中欧班列累计开行总量突破19000列。已构建\"29个境外直达站点＋10个出入境口岸\"跨境物流网络；中豫港务集团累计投资101亿元建成郑州国际陆港西作业区、集结中心等项目；产业联动货源占比超30%，实现由\"过境流量\"向\"产业留量\"转型。（来源[SE25]）\n\n### 5. 河南省进一步促进民间投资高质量发展若干政策措施印发\n省政府办公厅印发《河南省进一步促进民间投资高质量发展若干政策措施》（豫政办〔2026〕25号，6月25日签发），7月6日起各单位公开转载。政策提出：对具备条件的项目民间资本持股比例可达10%以上；超过400万元的工程采购项目预留预算总额40%以上面向中小微企业（小微企业不低于60%）；支持民间资本投向城市基础设施、数字经济、低空经济、前沿科技等领域；省发展改革委后续解读为\"20条硬核举措\"。（来源[SE26][SE27]）\n\n### 6. 庆祝建党105周年，全省开展学习教育\n7月1日，庆祝中国共产党成立105周年大会在北京隆重举行，习近平总书记发表重要讲话。河南全省各级党组织组织收看学习，把学习贯彻总书记重要讲话精神与此前总书记在河南考察时重要讲话精神结合起来。此考点可与\"党建＋基层治理\"结合命题。（来源[SE28]）\n\n### 7. 失业保险稳岗扩岗\"两延续一优化\"政策\n7月2日获悉，人社部等四部门联合印发通知，\"两延续一优化\"：延续稳岗返还至2026年底（中小微企业按不超过上年度实际缴纳失业保险费60%返还、大型企业不超过30%）；延续一次性扩岗补助至2026年底（每吸纳1名毕业年度及离校两年内未就业高校毕业生、16—24岁登记失业青年，不超过1500元）；优化技能提升补贴（急需紧缺职业证书最多可申领3次）。河南日报网7月3日转发。上半年河南城镇新增就业71.5万人、完成年度目标65%。（来源[SE29][SE30]）\n\n### 8. 河南高招录取7月8日启动\n7月8日，2026年全国高校在豫招生工作进入录取阶段，持续至8月上旬。批次安排：普通本科提前批7月11日、普通本科批7月21—25日、专科批8月上旬；录取期间至少进行5次征集志愿（7月13日、17日、26日，8月3日、8日）。省教育考试院提醒防范招生诈骗，监督举报电话0371-55610639。（来源[SE31]）\n\n### 9. 河南省政府推进服务业扩能提质\n省政府印发《关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号），7月8日南阳等市政府网公开发布。文件落实国务院国发〔2026〕7号意见，围绕支撑型、赋能型、成长型服务业构建\"3×4\"发展新格局，目标到2030年全省服务业规模达4.6万亿元左右；提出推广郑州—卢森堡\"双枢纽\"经验、发展高铁物流与低空配送、推广胖东来经验培育品质零售企业等举措。（来源[SE32]）\n\n### 10. 黄河调水调沙持续推进（本周背景事件）\n6月22日9时小浪底闸门开启，2026年主汛期前黄河调水调沙启动，为2002年以来第33次；计划历时约21天、7月12日前后完成水库调度。本次首次提出\"洪水塑造试点\"。本周期（6月29日—7月5日）调水调沙处于中后段泄放阶段，下游工程与引水供水同步推进。详细复盘见下文深度案例。（来源[SE33]）\n\n## 📖 深度案例：黄河调水调沙——从\"控制洪水\"到\"利用洪水、塑造洪水\"\n\n**主体与事件**：水利部黄河水利委员会统一调度，核心枢纽为小浪底，联合万家寨、三门峡及支流陆浑、故县、河口村水库。6月22日9时启动2026年主汛期前调水调沙，系2002年机制建立以来第33次。\n\n**做法与机制**：一是联合调度，\"三库调控为主、支流水库相机配合\"，统筹冲沙、防汛、供水、生态多重目标。二是数字化支撑，依托数字孪生黄河，用异重流模拟系统、下游二维水沙动力学模型做多方案水沙预演，筛选最优泄流方案。三是本次最大亮点是首次提出\"洪水塑造试点\"：把去年秋汛蓄存的清水在主汛期前\"塑造\"为人工洪水过程冲沙入海，与\"洪水控制\"\"洪水利用\"衔接，实现\"三个洪水\"深度互馈。洪峰途中还为下游省份用水和黄河三角洲湿地补水创造条件。\n\n**成效数据（机制运行24年累计＋本轮安排）**：24年累计输沙入海36.9亿吨；下游主槽平均下切3.1米，河道最小过流能力从1800立方米每秒恢复到5000立方米每秒；2008年以来向黄河三角洲自然保护区生态补水17次、总补水16.5亿立方米。本轮计划历时约21天，预计7月12日前后完成水库调度（结束数据见W02周报）。\n\n**可迁移点与评价**：其一，\"从被动防灾到主动治沙\"体现了系统观念——把洪水当作资源而非单纯风险，是\"底线思维＋极限思维\"的生动素材。其二，数字孪生技术支撑决策，可作\"科技赋能治理\"案例。其三，多目标统筹（减淤、供水、生态、防汛）对应申论\"统筹发展与安全\"主题。\n\n**可考角度**：常识——调水调沙启动时间（2002年）、核心枢纽（小浪底）、本轮为第33次；案例分析——\"三个洪水\"如何体现系统治理；材料写作——人与自然和谐共生、治水兴水与粮食安全的关系。\n\n**金句（适用主题：生态文明、系统观念）**：\n1. 既要控得住洪水，也要用得上洪水，还要塑得好洪水。\n2. 从\"黄河之水天上来\"到\"水沙协调入海去\"，是人与河流关系的一次重写。\n3. 治黄之要在于治沙，治沙之要在在于系统——上拦、中调、下排，缺一不可。\n\n## 复盘与下周关注\n\n- 下周关注：调水调沙水库调度结束数据（预计7月10—12日）；长期护理保险制度实施方案公开情况[存疑：具体公开发布日待核]；暑期消费促进活动动态。\n\n## 来源与证据\n\n- [SE22] 河南省政府门户网《〈河南省交通运输结构调整专项行动方案（2026—2028年）〉省政府政策例行吹风会》直播实录，2026-06-30，https://www.henan.gov.cn/2026/06-30/3370406.html\n- [SE23] 交通运输部《河南启动三年行动专项攻坚运输结构调整》，2026-07-01，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202607/t20260701_4208565.html\n- [SE24] 交通运输部（转中国水运网）《郑州国际陆港新增三条中欧（亚）班列图定线路》，2026-07-03，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202607/t20260703_4208738.html\n- [SE25] 交通运输部（转中国水运网）《河南中欧班列累计开行量突破1.9万列》，2026-06-30，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202606/t20260630_4208488.html\n- [SE26] 投资项目在线审批监管平台《河南省人民政府办公厅关于印发河南省进一步促进民间投资高质量发展若干政策措施的通知》（豫政办〔2026〕25号），2026-07-06，https://new.tzxm.gov.cn/zckd/gfxwj/202607/t20260707_1406341.shtml\n- [SE27] 河南省商务厅转发豫政办〔2026〕25号，2026-07-06，https://hnsswt.henan.gov.cn/2026/07-06/3372610.html\n- [SE28] 中国政府网《庆祝中国共产党成立105周年大会在京隆重举行》，2026-07-01，https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm\n- [SE29] 河南日报网（转人民日报）《三项失业保险政策举措支持企业稳岗扩岗》，2026-07-03，https://www.henandaily.cn/news/2026/0703/1238165.html\n- [SE30] 新华网《失业保险稳岗扩岗政策举措延续实施》，2026-07-03，https://www.news.cn/government/20260703/c9330c9fb0b043868e4c4ff66571ed02/c.html\n- [SE31] 新华网河南频道（转郑州日报）《河南高招录取今起开始 今年至少进行5次征集志愿》，2026-07-08，http://www.ha.news.cn/20260708/e5542255862d43beb5436f239f0c126d/c.html\n- [SE32] 南阳市人民政府网《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号），2026-07-08，https://www.nanyang.gov.cn/2026/07-08/1418283.html\n- [SE33] 黄河网（转河南日报）《2026年黄河调水调沙正式启动》，2026-06-23，http://yrcc.gov.cn/xwdt/mtgz/2026-mtgz-qtmt/202606/t20260623_451518.html\n\n## 关联专题\n\n- [[D09]]\n- [[P01]]\n", "W02-周报-2026-07-12.md": "\n# W02 · 河南时政周报（2026-07-06 — 2026-07-12）\n\n## ⚡ 快速知识卡\n\n本周河南时政主线：一是民生保障重磅——省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号），用3年左右在全省全面建立长护险制度，大河网7月10日全文发布；二是政策落地周——促进民间投资20条（7月6日）、服务业扩能提质实施意见等继续公开发布；三是黄河调水调沙7月10日9时完成水库调度，排沙1.79亿吨创历年同期之最；四是招生录取季启动，7月8日高招录取开始。此外，省政府7月还出台适应气候变化提升粮食生产防灾减灾能力指导意见（具体印发日期[存疑]）。考法聚焦：长护险制度细节（费率、筹资、实施步骤）、调水调沙数据、稳投资政策工具。\n\n## 📖 本周要闻十条\n\n### 1. 河南建立长期护理保险制度实施方案印发\n省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号，6月18日签发），大河网7月10日全文发布。核心内容：长护险为独立险种，用3年左右时间在全省全面建立制度。参保对象覆盖单位职工、退休人员、灵活就业人员和未就业城乡居民，与基本医保同步缴费。实施步骤：2026年各统筹地区启动就业人员长护险；2027年洛阳、鹤壁、新乡、焦作、三门峡、南阳、商丘、济源8个统筹地区启动未就业城乡居民制度；2028年其他地区启动，开封2028年底前调整完善。费率：单位职工0.3%左右（单位个人各0.15%左右）；未就业城乡居民个人缴费与政府补助1∶1左右，费率从0.15%左右起步、5年过渡到0.3%左右。待遇：起步阶段保障重度失能人员，职工参保基金支付比例70%左右，城乡居民50%左右，年度最高支付限额不超过上年度城乡居民人均可支配收入的50%。特困人员全额资助、低保对象定额资助不低于50%。（来源[SE34][SE27]）\n\n### 2. 促进民间投资高质量发展20条公开发布\n省政府办公厅印发《河南省进一步促进民间投资高质量发展若干政策措施》（豫政办〔2026〕25号），本周起各单位公开转载（7月6日河南省商务厅转发）。要点：民间资本持股比例可达10%以上；工程采购预留40%以上面向中小微企业；支持民间资本投向城市基础设施、生产性服务业、数字经济、低空经济、前沿科技创新、重大科研平台等领域；常态化运行小微企业融资协调工作机制。省发改委在7月21日发布会中称其为\"20条硬核举措\"。（来源[SE27]）\n\n### 3. 2026年黄河调水调沙水库调度结束\n7月10日9时，黄委调度小浪底水库按600立方米每秒下泄，2026年主汛期前黄河调水调沙水库调度顺利结束。本次调水调沙自6月22日启动，历时19天。关键数据：小浪底最大下泄流量4990立方米每秒，下泄水量49.99亿立方米，最大出库含沙量787千克每立方米，排沙量1.79亿吨，库区净冲刷1.71亿吨——排沙量、净冲刷量均为历年同期调水调沙之最。成功塑造花园口站4800立方米每秒量级、利津站4000立方米每秒量级长历时洪水过程（利津站4000以上流量持续80小时）；水库腾出库容41.72亿立方米；下游河段累计引水6.09亿立方米；向黄河河口三角洲湿地生态补水1.65亿立方米。预计7月15日前后水沙过程全部平稳入海。（来源[SE35]）\n\n### 4. 2026年河南高招录取启动，今年至少5次征集志愿\n7月8日起，全国高校在豫招生进入录取阶段。普通本科提前批7月11日、普通本科批7月21—25日；艺术本科批7月15—16日；体育本科批7月11日。录取期间至少5次征集志愿：7月13日（本科提前批、体育本科批）、7月17日（艺术本科批）、7月26日（普通本科批）、8月3日、8月8日（专科批次）。考生可通过河南省普通高校招生考生服务平台查询电子档案状态。（来源[SE31]）\n\n### 5. 省政府部署适应气候变化提升粮食生产防灾减灾能力\n省政府办公厅出台《关于适应气候变化提升粮食生产防灾减灾救灾能力的指导意见》（豫政办〔2026〕27号；本周获媒体关注，原文公开发布时间[存疑：一处转载显示8月，待核对本轮实际发布日期]）。目标：到2030年永久基本农田排灌体系全面建成，初步建立与气候变化相适应的农业防灾减灾救灾体系。重点任务包括：聚焦66个粮食产能提升重点县升级气象观测装备；到2027年农村\"三沟四渠\"全部连通；到2027年培育区域农机社会化服务中心1000个以上；培育抗逆新品种（小麦抗倒春寒耐旱、玉米抗旱耐高温等）。（来源[SE36]）\n\n### 6. 失业保险稳岗扩岗政策在豫延续实施\n人社部等四部门\"两延续一优化\"政策本周在河南广泛传播落地：稳岗返还（中小微60%、大型30%上限）和一次性扩岗补助（每吸纳1名高校毕业生或青年失业人员不超过1500元）延续至2026年底；技能提升补贴放宽参保年限、急需紧缺工种证书最多可领3次。背景：上半年河南城镇新增就业71.5万人、完成年度目标65%。（来源[SE29][SE37]）\n\n### 7. 服务业扩能提质实施意见公开\n《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号）本周起在各地市政府网公开（南阳7月8日转发）。核心：构建支撑型、赋能型、成长型\"3×4\"服务业发展新格局，到2030年全省服务业规模达4.6万亿元左右；含现代物流降本增效（推广郑州—卢森堡\"双枢纽\"经验、发展高铁物流、低空配送）、供应链金融、科技服务、商贸流通（推广胖东来经验）等分业举措。（来源[SE32]）\n\n### 8. 郑州国际陆港图定线路扩容效应持续释放\n7月1日新增3条中欧（亚）班列图定线路（磨憨—新郑／圃田东盟回程、新郑—满洲里、新郑—阿拉山口）后，本周全省存量图定线路全面实现圃田、新郑双站点兼容作业；叠加即将投用的新郑站铁路联络线，郑州集结中心形成\"双站点联动\"格局。1—5月全省中欧（亚）班列开行1556列、同比增长25.7%，货重货值同步大幅增长。（来源[SE24]）\n\n### 9. 迎峰度夏能源保供与防汛备汛并行\n本周处于主汛期与高温叠加期，省政府在7月21日发布会（内容于此后公布）中系统部署：常态化开展重大工程、重要水系、重点区域排险除患，做实预警叫应响应联动，扎实做好迎峰度夏能源保供，常态化监测粮油肉蛋菜价格。汛期安全、防灾减灾为本周舆论重点。[存疑：本周内具体河南电力负荷数据未检索到白名单来源，暂不引数字]（来源[SE38]）\n\n### 10. 暑期文旅消费季持续推进\n2026\"行走河南·读懂中国\"暑期文化旅游消费季自5月下旬在安阳启幕后持续开展，本周进入暑期客流高峰期，全省推出300余项门票减免与特色活动，配套\"乐享河南\"暑期消费季。此条与省政府促消费部署相衔接。[存疑：本周内具体消费数据无官方口径]（来源[SE38]）\n\n## 📖 深度案例：河南长护险——人口大省的\"社保第六险\"破题\n\n**主体与事件**：河南省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号），回应国家《关于加快建立长期护理保险制度的意见》及8部门实施方案部署，是河南应对深度老龄化、补齐\"社保第六险\"空白的关键一步。\n\n**背景与问题**：河南是人口大省，失能半失能老人照护长期依赖家庭，\"一人失能、全家失衡\"。此前全国仅部分城市试点，河南尚无全省统一制度。痛点集中在三处：筹资无来源、失能评估无统一标准、照护服务市场不成熟。\n\n**做法与机制**：一是独立险种、市级统筹起步，逐步省级统筹。二是分类筹资：单位职工费率0.3%左右，单位个人各担一半；退休人员个人缴纳、可从医保个人账户代扣；未就业城乡居民个人与政府补助1∶1，费率0.15%起步、5年过渡至0.3%；困难人群分类资助（特困全额、低保定额不低于50%）。三是分步实施：2026年就业人员起步→2027年8个统筹地区覆盖城乡居民→2028年全省铺开。四是待遇差异化：职工70%左右、居民50%左右支付比例，不设起付线，鼓励居家和社区护理并给予支付倾斜；对断保再参保设6个月等待期等约束。五是全国统一失能评估标准和服务项目目录，基金原则上不发现金、只付服务。\n\n**成效与意义**：制度层面首次实现全省长护险从无到有的顶层设计，把9000多万人口的照护保障纳入制度化轨道；对积极应对人口老龄化、稳定照护服务就业（护理员队伍）、拉动养老产业均有牵引作用。量化成效数据尚待制度运行后发布[存疑]。\n\n**局限与争议**：起步阶段仅保障重度失能人员，中度失能与失智老人覆盖待扩围；城乡居民费率从0.15%起步，保障水平有限；各地照护机构能力不均衡，农村地区服务供给短板明显；基金长期精算平衡面临老龄化压力。\n\n**可考角度**：常识——文件名与实施步骤年份（2026就业人员/2027八地区居民/2028全覆盖）；案例分析——\"独立险种＋市级统筹起步\"体现的渐进式改革思路；材料写作——民生保障从\"有没有\"转向\"好不好\"。\n\n**金句（适用主题：民生保障、积极应对老龄化）**：\n1. 长护险一头连着失能老人的尊严，一头连着千万家庭的喘息空间。\n2. 从\"养\"到\"护\"，一字之改，是民生保障体系从生存型向品质型跃升的注脚。\n3. 用3年时间织密一张网，让\"老有所护\"从愿景变为制度。\n\n## 复盘与下周关注\n\n- 下周关注：普通本科批投档（7月21—25日）；2026年河南经济\"半年报\"（省统计局7月17日公布，见后续周报）；暑期促消费活动数据。\n\n## 来源与证据\n\n- [SE34] 大河网（河南省人民政府办公厅）《关于印发河南省建立长期护理保险制度实施方案的通知》（豫政办〔2026〕24号），2026-07-10，https://view.inews.qq.com/a/20260710A0AIPY00 （大河网官方账号全文转载；省政府网原文链接[存疑]）\n- [SE27] 河南省商务厅转发《河南省进一步促进民间投资高质量发展若干政策措施》（豫政办〔2026〕25号），2026-07-06，https://hnsswt.henan.gov.cn/2026/07-06/3372610.html\n- [SE35] 新华网河南频道（转河南日报）《2026年主汛期前黄河调水调沙水库调度结束》，2026-07-12，http://www.ha.xinhuanet.com/20260712/6cd07cebf1504287b1cb15a773293a87/c.html\n- [SE31] 新华网河南频道（转郑州日报）《河南高招录取今起开始 今年至少进行5次征集志愿》，2026-07-08，http://www.ha.news.cn/20260708/e5542255862d43beb5436f239f0c126d/c.html\n- [SE36] 农小蜂政策库（转河南省人民政府办公厅）《关于适应气候变化提升粮食生产防灾减灾救灾能力的指导意见》（豫政办〔2026〕27号），https://www.abeedata.com/home/article/detail/id/32124 （转载页，原始发布时间[存疑]）\n- [SE29] 河南日报网（转人民日报）《三项失业保险政策举措支持企业稳岗扩岗》，2026-07-03，https://www.henandaily.cn/news/2026/0703/1238165.html\n- [SE37] 河南省政府驻广州办事处《继续补贴！河南延续实施失业保险支持企业稳岗扩岗政策》，2026-07-28，https://zgb.henan.gov.cn/2026/07-28/3379967.html\n- [SE32] 南阳市人民政府网《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号），2026-07-08，https://www.nanyang.gov.cn/2026/07-08/1418283.html\n- [SE24] 交通运输部（转中国水运网）《郑州国际陆港新增三条中欧（亚）班列图定线路》，2026-07-03，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202607/t20260703_4208738.html\n- [SE38] 河南省政府门户网《河南省推动2026年下半年进一步巩固拓展经济稳中向好势头新闻发布会》直播实录，2026-07-21，https://www.henan.gov.cn/2026/07-21/3377621.html\n\n## 关联专题\n\n- [[W01]]\n- [[D10]]\n", "W03-周报-2026-07-19.md": "\n# W03 · 河南时政周报（2026-07-13 — 2026-07-19）\n\n## ⚡ 快速知识卡\n\n本周（7月13日—19日）河南时政主线有三：一是7月17日省统计局公布2026年上半年经济运行情况，全省GDP 33521.58亿元、同比增长5.0%，进出口总值历史同期首次突破5000亿元，\"半年报\"是本期最重的可考素材；二是7月16日起我国进入\"七下八上\"防汛关键期，河南省防指当日14时30分启动防汛四级应急响应，防汛与高温伏旱叠加成为本周治理主线；三是粮食流通领域，7月9日小麦产销合作洽谈会签约200万吨、金额50亿元，\"郑州价格\"建设推进。此外，郑州国际陆港包件库投用首月入库破万吨，1—6月全省中欧（亚）班列开行1859列、同比增长22%；高招普通本科批7月21日正式投档。考法以常识（GDP总量与增速、应急响应时间、班列数据）与案例分析（经济大省挑大梁、粮食产销衔接）为主。\n\n## 📖 本周要闻十条\n\n### 1. 2026年河南经济\"半年报\"出炉：GDP 33521.58亿元、增长5.0%\n7月17日，河南省统计局公布2026年上半年全省经济运行情况。上半年全省地区生产总值（GDP）33521.58亿元，按不变价格计算同比增长5.0%。分产业看：第一产业增加值2279.18亿元、增长4.0%；第二产业增加值13006.22亿元、增长5.4%；第三产业增加值18236.18亿元、增长4.9%。省统计局分析称，上半年全省经济顶住压力运行在合理区间，呈现农业生产总体向好、工业生产保持较快增长、服务业运行总体平稳、市场销售稳步扩容、投资规模继续扩大、外贸稳量提质、价格温和上涨、居民收支平稳增长的态势。（来源[SE39][SE40][SE41]）\n\n### 2. 上半年河南进出口总值历史同期首次突破5000亿元\n上半年全省进出口总值5203.6亿元、同比增长26%，历史同期首次超5000亿元；其中出口3194.8亿元、增长14.6%，进口2008.8亿元、增长49.8%，进口规模历史同期首次突破2000亿元。有进出口记录的企业1.59万家、同比增加4170家；民营企业进出口
