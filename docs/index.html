<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>砺行集 · 2027 河南普选备考库</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#EDEAE4;--side:#E6E1D8;--card:#F7F5F1;--fg:#3A3A38;--muted:#8A8880;
  --acc:#5C7A99;--acc2:#A8736B;--accbg:#E3EAF0;--acc2bg:#F0E6E3;
  /* 扩展色：用于卡片与各区块区分 */
  --c-green:#7C9A82;--c-green-bg:#E8EFE9;
  --c-gold:#B8935A;--c-gold-bg:#F5EDE0;
  --c-plum:#8E6E8E;--c-plum-bg:#EFE8EF;
  --c-teal:#6E9298;--c-teal-bg:#E5EDEE;
  --bd:#D8D2C8;--hov:#E2DCD2;
  --code:#E8E3DA;--shadow:0 1px 2px rgba(90,82,70,.05),0 2px 10px rgba(90,82,70,.06);
  --shadow-lg:0 4px 12px rgba(90,82,70,.08),0 12px 32px rgba(90,82,70,.08);
  --topbar-h:60px;--side-w:260px;--toc-w:212px;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#25272B;--side:#1E2024;--card:#2D3034;--fg:#DDD9D2;--muted:#93908A;
  --acc:#8FA9C4;--acc2:#C49188;--accbg:#313A44;--acc2bg:#3A2E2C;
  --c-green:#8FB096;--c-green-bg:#2B332C;
  --c-gold:#D0AC72;--c-gold-bg:#332D22;
  --c-plum:#B394B3;--c-plum-bg:#302A30;
  --c-teal:#8AAFB5;--c-teal-bg:#283133;
  --bd:#3A3D42;--hov:#34373B;
  --code:#34373B;--shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);line-height:1.8;font-size:16px;-webkit-font-smoothing:antialiased}
body.splash-lock{overflow:hidden;position:fixed;width:100%;height:100%;touch-action:none}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
svg{display:block}

/* ---------- 学习进度 ---------- */
/* 阅读页工具条 */
.readbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;
  padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow)}
.readbar .rb-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
  border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--muted);
  font-size:13px;cursor:pointer;transition:all .16s;font-family:inherit}
.readbar .rb-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
.readbar .rb-btn.fav-on{background:var(--c-gold-bg);border-color:var(--c-gold);color:var(--c-gold)}
.readbar .rb-sep{flex:1}
.readbar .rb-stat{font-size:12px;color:var(--muted)}
/* 已读/收藏标记（列表） */
.trow .tidwrap{display:flex;align-items:center;gap:6px}
.trow .rddot{width:7px;height:7px;border-radius:50%;background:var(--c-green);flex:none;display:none}
.trow.isread .rddot{display:block}
.trow.isread .t1{opacity:.62}
.trow .favmark{color:var(--c-gold);font-size:13px;display:none;margin-left:4px}
.trow.isfav .favmark{display:inline}
.topiccard.isread .row1 h3{opacity:.62}
/* 进度面板（首页） */
.progpanel{background:var(--card);border:1px solid var(--bd);border-radius:12px;
  padding:20px 24px;margin-bottom:38px;box-shadow:var(--shadow)}
.progpanel .phead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.progpanel .phead h3{margin:0;font-size:16px;font-family:var(--serif)}
.progpanel .phead .pcurl{margin-left:auto;font-size:13px;color:var(--acc);cursor:pointer}
.progbar{height:8px;background:var(--hov);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progbar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--c-teal));transition:width .5s}
.progstats{display:flex;gap:26px;flex-wrap:wrap}
.progstats .ps{display:flex;flex-direction:column;gap:2px;cursor:pointer}
.progstats .ps b{font-family:var(--serif);font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.progstats .ps span{font-size:12px;color:var(--muted)}
.progstats .ps:nth-child(1) b{color:var(--acc)}
.progstats .ps:nth-child(2) b{color:var(--c-gold)}
.progstats .ps:nth-child(3) b{color:var(--c-plum)}
.progstats .ps:nth-child(4) b{color:var(--c-green)}
.progempty{font-size:13.5px;color:var(--muted);line-height:1.8}
#resume-tip{position:fixed;right:16px;bottom:20px;transform:translateY(90px);z-index:290;
  display:flex;flex-direction:column;gap:8px;padding:12px;
  background:var(--card);border:1px solid var(--bd);border-radius:14px;
  box-shadow:var(--shadow-lg);opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}
#resume-tip.show{transform:translateY(0);opacity:1;pointer-events:auto}
#resume-tip button{border:0;border-radius:9px;padding:11px 22px;font-size:13.5px;
  cursor:pointer;font-family:var(--serif);letter-spacing:.06em;
  transition:opacity .15s,background .15s;white-space:nowrap}
#resume-tip button.ok{background:var(--acc);color:#fff}
#resume-tip button.no{background:var(--hov);color:var(--muted)}
#resume-tip button:hover{opacity:.86}
/* 阅读进度条：极简，贴右侧边缘 */
#readtrack{position:fixed;right:3px;top:50%;transform:translateY(-50%);
  width:3px;height:38vh;background:rgba(138,136,128,.16);border-radius:99px;
  z-index:120;opacity:0;transition:opacity .3s;pointer-events:none}
#readtrack.on{opacity:1}
#readtrack i{display:block;width:100%;height:0;border-radius:99px;
  background:linear-gradient(180deg,var(--acc),var(--c-teal));transition:height .12s linear}
#readpct{position:fixed;right:10px;top:50%;transform:translateY(-50%);
  z-index:121;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .3s;pointer-events:none;
  background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:1px 5px}
#readpct.on{opacity:1}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:400;
  padding:14px 26px;background:rgba(58,58,56,.94);color:#F7F5F1;border-radius:10px;
  font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  box-shadow:0 10px 32px rgba(0,0,0,.3);max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:520px){
  .progstats{gap:18px}
  .progstats .ps b{font-size:18px}
  #resume-tip{right:12px;bottom:14px;padding:10px}
  #resume-tip button{padding:9px 18px;font-size:13px}
}

/* ---------- 欢迎界面 ---------- */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:var(--bg);overflow:hidden;transition:opacity .6s ease,visibility .6s;padding:20px;
  height:100vh;height:100dvh;width:100vw;width:100dvw;touch-action:none;overscroll-behavior:contain}
#splash::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 50% 40%,rgba(92,122,153,.07),transparent 62%),
    repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(138,136,128,.045) 39px);}
#splash.hide{opacity:0;visibility:hidden}
.splash-inner{position:relative;text-align:center;padding:0 28px;max-width:600px;width:100%;box-sizing:border-box;
  animation:splashIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes splashIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.splash-seal{width:66px;height:66px;margin:0 auto 26px;border-radius:12px;
  background:linear-gradient(140deg,var(--acc2),#8E5A52);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:34px;font-weight:700;
  box-shadow:0 6px 22px rgba(168,115,107,.34);
  animation:sealIn .9s .15s cubic-bezier(.34,1.56,.64,1) both}
@keyframes sealIn{from{opacity:0;transform:scale(.72) rotate(-7deg)}to{opacity:1;transform:none}}
.splash-title{font-family:var(--serif);font-size:46px;font-weight:700;letter-spacing:.12em;
  margin:0 0 10px;color:var(--fg);text-indent:.12em}
.splash-sub{font-size:14px;color:var(--muted);letter-spacing:.22em;margin:0;text-indent:.22em}
.splash-rule{width:52px;height:1px;background:var(--bd);margin:26px auto;position:relative}
.splash-rule::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:5px;height:5px;background:var(--acc2);border-radius:50%;opacity:.55}
.splash-quote{font-family:var(--serif);font-size:17px;color:var(--fg);opacity:.86;
  line-height:1.9;margin:0 0 18px;letter-spacing:.03em}
.splash-quote .q{color:var(--acc2);opacity:.62;font-size:20px;margin:0 2px}
.splash-desc{font-size:13.5px;color:var(--muted);line-height:2;margin:0 0 34px}
.splash-enter{display:inline-flex;align-items:center;gap:9px;
  padding:13px 30px;border:1px solid var(--acc);border-radius:10px;
  background:transparent;color:var(--acc);font-size:14.5px;font-family:var(--serif);
  letter-spacing:.1em;cursor:pointer;transition:background .22s,color .22s,transform .22s,box-shadow .22s}
.splash-enter:hover{background:var(--acc);color:var(--card);transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(92,122,153,.28);text-decoration:none}
.splash-enter svg{transition:transform .22s}
.splash-enter:hover svg{transform:translateX(3px)}
.splash-foot{margin-top:44px;font-size:11.5px;color:var(--muted);letter-spacing:.14em;opacity:.75}
.splash-foot .dot{margin:0 8px;opacity:.5}
/* 安装到桌面按钮 */
.splash-install{display:inline-flex;align-items:center;gap:8px;margin-top:22px;
  padding:10px 22px;border:1px dashed var(--bd);border-radius:9px;
  background:transparent;color:var(--muted);font-size:13px;cursor:pointer;
  transition:border-color .2s,color .2s,background .2s;font-family:inherit}
.splash-install:hover{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
html[data-theme="dark"] .splash-seal{background:linear-gradient(140deg,var(--acc2),#7A4A43)}
@media (max-width:520px){
  .splash-title{font-size:38px}
  .splash-seal{width:58px;height:58px;font-size:30px;margin-bottom:22px}
  .splash-quote{font-size:15.5px}
  .splash-desc{font-size:13px;margin-bottom:28px}
  .splash-foot{margin-top:34px}
}

/* ---------- 顶部导航 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;display:flex;align-items:center;gap:12px;
  padding:0 24px;background:rgba(255,253,250,.92);backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--bd)}
html[data-theme="dark"] #topbar{background:rgba(22,27,34,.92)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;user-select:none;font-family:var(--serif);letter-spacing:.02em}
#topbar .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc2),#8B2A20);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;font-family:var(--serif);box-shadow:0 2px 6px rgba(176,58,46,.3)}
#topbar .brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:2px}
#topbar .spacer{flex:1}
#topbar .tstat{color:var(--muted);font-size:12.5px;margin-right:6px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);
  background:var(--card);color:var(--fg);cursor:pointer;transition:background .15s,border-color .15s;padding:0}
.iconbtn:hover{background:var(--hov)}
#hamburger{display:none}

/* ---------- 布局骨架 ---------- */
#layout{display:flex;padding-top:var(--topbar-h);min-height:100vh}
#sidebar{width:var(--side-w);flex:none;background:var(--side);border-right:1px solid var(--bd);
  position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto;padding:14px 12px 32px}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
#sidebar::-webkit-scrollbar-thumb:hover{background:var(--muted)}
#main{flex:1;min-width:0}
#content{max-width:1280px;margin:0 auto;padding:28px 40px 80px;width:100%;box-sizing:border-box}
.page-article{display:flex;gap:36px;max-width:1160px;margin:0 auto;width:100%}
#articlecol{flex:1;min-width:0;max-width:800px;width:100%}
#toccol{width:var(--toc-w);flex:none;position:sticky;top:calc(var(--topbar-h) + 28px);align-self:flex-start;max-height:calc(100vh - var(--topbar-h) - 56px);overflow-y:auto}

/* ---------- 侧边导航（Starlight 风格） ---------- */
.navgroup{margin-bottom:4px}
.navgroup-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;
  color:var(--fg);font-weight:600;font-size:13.5px;border-radius:8px;cursor:pointer;transition:background .15s}
.navgroup-head:hover{background:var(--hov)}
.navgroup-head .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:11.5px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:0 8px;line-height:1.7}
.navgroup-head .chev{transition:transform .15s;color:var(--muted);flex:none;display:inline-flex}
.navgroup.closed .chev svg{transform:rotate(-90deg)}
.navgroup ul{list-style:none;margin:2px 0 10px;padding:0}
.navgroup.closed ul{display:none}
.navgroup li a{display:block;padding:6px 10px 6px 26px;margin:1px 0;border-radius:8px;color:var(--muted);font-size:13px;line-height:1.5;cursor:pointer;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navgroup li a:hover{background:var(--hov);color:var(--fg);text-decoration:none}
.navgroup li a.active{background:var(--accbg);color:var(--acc);font-weight:600;border-left:2px solid var(--acc)}
#sidebar .sidecap{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:6px 10px 10px;font-weight:600}
/* 二级分组（周报按月） */
.navsub{list-style:none;margin:0}
.navsub-head{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 22px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:6px;user-select:none;font-weight:600;letter-spacing:.03em}
.navsub-head:hover{background:var(--hov);color:var(--fg)}
.navsub-head .subchev{display:inline-flex;transition:transform .15s;flex:none}
.navsub-head .subcnt{margin-left:auto;font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.navsub.closed .subchev{transform:rotate(-90deg)}
.navsub.closed .navsub-list{display:none}
.navsub-list{list-style:none;margin:0 0 4px;padding:0}
.navsub-list li a{padding-left:38px;font-size:12.5px}
#sidebar ul>li.navsub{padding:0}
#sidebar .sidefoot{margin-top:20px;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:12px;color:var(--muted);line-height:1.7}
#sidebar .sidefoot b{color:var(--fg);display:block;font-size:12.5px;margin-bottom:2px}

/* ---------- 首页（Knowledge Library 风格） ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:40px 0 26px;border-bottom:1px solid var(--bd);margin-bottom:24px;position:relative}
.hero::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:3px;background:linear-gradient(90deg,var(--acc2),transparent);border-radius:2px}
.hero .kicker{display:inline-flex;align-items:center;gap:6px;color:var(--acc2);background:var(--acc2bg);font-size:12.5px;font-weight:600;letter-spacing:.04em;padding:4px 13px;border-radius:99px;margin-bottom:14px}
.hero h1{font-family:var(--serif);font-size:42px;line-height:1.15;margin:0 0 8px;letter-spacing:.04em;font-weight:700}
.hero .sub{font-size:16.5px;color:var(--fg);opacity:.75;margin:0 0 10px;font-family:var(--serif)}
.hero .desc{font-size:14px;color:var(--muted);max-width:620px;margin:0;line-height:1.9}
.statrow{display:flex;gap:12px;flex:none}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 20px;min-width:104px;text-align:center;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent)}
.stat .n{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--acc);line-height:1.25;font-variant-numeric:tabular-nums}
.stat:nth-child(2) .n{color:var(--c-teal)}
.stat:nth-child(2)::before{background:linear-gradient(90deg,var(--c-teal),transparent)}
.stat:nth-child(3) .n{color:var(--c-plum)}
.stat:nth-child(3)::before{background:linear-gradient(90deg,var(--c-plum),transparent)}
.stat:nth-child(4) .n{color:var(--acc2)}
.stat:nth-child(4)::before{background:linear-gradient(90deg,var(--acc2),transparent)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}

.searchwrap{position:relative;margin:22px 0 26px}
.searchbox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;
  padding:0 18px;height:56px;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s}
.searchbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg),var(--shadow-lg)}
.searchbox svg{flex:none;color:var(--muted)}
.searchbox input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--fg);height:100%}
.searchbox .sclear{border:0;background:var(--hov);color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0;font-size:12px}
.searchbox.hasval .sclear{display:inline-flex}
.searchbox kbd{font-family:inherit;font-size:11px;color:var(--muted);border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:var(--bg);flex:none}
#searchresults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--bd);
  border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow-y:auto;z-index:40;display:none}
#searchresults .sr-cap{padding:8px 16px 4px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
#searchresults .sr-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--bd)}
#searchresults .sr-item:last-child{border-bottom:0}
#searchresults .sr-item:hover,#searchresults .sr-item.sel{background:var(--accbg)}
#searchresults .sr-item .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline}
#searchresults .sr-item .t .badge{font-size:11px;color:var(--acc);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
#searchresults .sr-item .d{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
#searchresults .sr-empty{padding:18px 16px;color:var(--muted);font-size:14px}

.secthead{display:flex;align-items:baseline;gap:12px;margin:14px 0 16px}
.secthead h2{font-size:20px;margin:0;font-family:var(--serif);letter-spacing:.03em;position:relative;padding-left:14px}
.secthead h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:18px;background:var(--acc2);border-radius:2px}
.secthead .more{margin-left:auto;font-size:13px;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:38px}
/* 本周推荐 */
.reccard{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:38px}
.recitem{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.recitem:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--shadow-lg);text-decoration:none}
.recitem.remain{background:linear-gradient(135deg,var(--accbg),var(--card) 75%);border-color:rgba(92,122,153,.25)}
.recbadge{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acc);background:var(--accbg);border-radius:6px;padding:3px 9px}

const DATA={"generated": "2026-10-20", "topics": [{"id": "D01", "title": "河南\"高效办成一件事\"改革：从多头跑到集成办理的政务服务重塑", "category": "D", "tags": ["高效办成一件事", "政务服务", "一网通办", "营商环境", "数字政府"], "related": ["D05"], "evidence_level": "官方", "sources": ["SD01", "SD02", "SD03", "SD04", "SD05", "SD06", "SD07", "SD08", "SD09"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D01-河南高效办成一件事改革.md", "card": "\"高效办成一件事\"是国务院2024年部署的政务服务改革抓手（国发〔2024〕3号），针对群众企业办事\"多头跑、反复交、耗时长\"的流程碎片化问题，把关联性强、办理量大的多个事项打包集成：一次告知、一表申请、一套材料、一窗（端）受理、一网办理 [SD01]。河南以豫政〔2024〕18号实施意见落实，提出2024年申请材料压减60%以上、办理时限压缩70%以上、办理环节压缩80%以上的量化目标（文件措辞为\"力争\"，属目标值而非已完成数据），并按要求在2024年内落地国务院部署的13个\"一件事\" [SD02]。用途：案例分析题（跨部门协同、整体性治理）、对策题（优化营商环境）、面试综合分析（从\"部门本位\"到\"用户本位\"）。深入阅读见\"📖 深度专题\"。"}, {"id": "D02", "title": "河南紧密型县域医共体改革：从试点到全省推开的政策与证据", "category": "D", "tags": ["县域医共体", "分级诊疗", "医保支付改革", "河南医改", "基层医疗"], "related": ["D05"], "evidence_level": "官方", "sources": ["SD10", "SD11", "SD12", "SD13", "SD14", "SD15", "SD16", "SD17"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D02-河南紧密型县域医共体改革.md", "card": "紧密型县域医共体是把县级医院、乡镇卫生院、村卫生室整合为\"责任、管理、服务、利益共同体\"，核心是\"人财物统一管理＋医保总额付费、结余留用、合理超支分担\"。国家层面：2019 年启动 828 个试点县，2023 年国卫基层发〔2023〕41 号文要求 2024 年 6 月底前以省为单位全面推开 [SD10][SD12]。河南 2021 年已实现 103 县（市）组建 190 个医共体全覆盖，并以\"13710\"督办机制推进 [SD11]；2025 年省政府办公厅再出高质量发展若干措施，力推去行政化、一体化管理 [SD13]。实际用途：申论中作为\"资源整合型公共服务改革\"典型案例，可对应政策工具、执行机制、医保杠杆三条线。适用题型：案例分析（政策落地）、对策题（基层能力建设）、面试综合分析。深入阅读见\"📖 深度专题\"。"}, {"id": "D03", "title": "河南基层矛盾纠纷多元化解：综治中心规范化、调解联动与网格化治理", "category": "D", "tags": ["矛盾纠纷多元化解", "综治中心", "新时代枫桥经验", "人民调解", "网格化治理"], "related": [], "evidence_level": "官方", "sources": ["SD20", "SD21", "SD22", "SD23", "SD24", "SD25", "SD26", "SD27", "SD28"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D03-河南基层矛盾纠纷多元化解.md", "card": "河南把矛盾纠纷多元化解作为基层高效能治理的关键环节，以\"预防在前、调解优先、法治化解决\"为主线 [SD25][SD20]。核心机制有四：①综治中心规范化建设——\"只进一扇门、最多跑一地\"，统一受理、分类流转、依法办理、闭环管理；②人民调解、行政调解、司法调解联动——司法所建强调解队伍 赋能.md", "card": "网格化治理按标准把城乡划分为单元网格、配备网格员，依托统一数字平台形成\"上报—受理—分派—处置—反馈\"的事件流转闭环；河南近年主推\"党建+网格+大数据\"，郑州提出\"十个一\"党建引领网格化高效能治理体系，把综治中心规范化建设作为实体枢纽 [SD51][SD52][SD53]。数字赋能在主动发现问题、闭环处置上有真实作用，但同样存在被考核指标异化的风险——过多政务 App、工作群、打卡留痕催生\"指尖上的形式主义\"，中央已从 2023 年若干意见、2024 年若干规定到 2026 年政务 App 管理办法持续纠治 [SD54][SD55]。实际用途：案例分析、对策题、面试综合分析的河南本土素材。适用条件与局限见\"📖 深度专题\"。"}, {"id": "D07", "title": "河南南阳基层减负与乡镇（街道）履职事项清单实践", "category": "D", "tags": ["基层减负", "履职事项清单", "小马拉大车", "形式主义治理", "南阳"], "related": [], "evidence_level": "官方", "sources": ["SD60", "SD61", "SD62", "SD63"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D07-河南南阳基层减负与履职事项清单实践.md", "card": "基层减负的政策脉络是从\"减少文山会海\"深化到\"厘清权责边界\"：2024 年 2 月起全国 3.8 万个乡镇（街道）编制履职事项清单，2025 年 6 月底全部完成，平均每地 340 项，分基本履职、配合履职、上级部门收回\"三张清单\" [SD61]；2026 年 5 月中办国办再出《具体措施》，把清单定为考核基本依据、严禁\"条条干预\" [SD62]。河南南阳的做法是\"减负＋赋能\"双向发力：下放处罚权的同时建承接机制 [SD60]；郑州完成 193 个乡镇（街道）清单编制并清理工作群、标牌 [SD63]。核心考点是清单制的机制逻辑（以事定责、以责定考核）与局限（清单外变相摊派、减负反弹）。适用题型：案例分析、对策题、面试综合分析。"}, {"id": "D08", "title": "全国韧性城市与城市生命线安全工程：合肥模式与河南实践", "category": "D", "tags": ["韧性城市", "城市生命线安全工程", "合肥模式", "郑州暴雨", "城市安全监测"], "related": ["D05"], "evidence_level": "官方", "sources": ["SD70", "SD71", "SD72", "SD73", "SD74", "SD75", "SD76"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D08-全国韧性城市与城市生命线安全工程.md", "card": "韧性城市指承受适应能力强、恢复速度快的城市。2024 年 12 月中办国办《关于推进新型城市基础设施建设打造韧性城市的意见》确定目标：2027 年新型城市基础设施建设取得明显进展、2030 年建成一批高水平韧性城市，并以 CIM 平台与城市运行管理服务\"一网统管\"为技术骨架 [SD70]。城市生命线安全工程是其安全侧的先行实践：合肥 2017 年起对燃气、桥梁、管网布设物联感知设备实时监测预警，\"合肥模式\"经国务院安委办发文推广并写入国家部署 [SD73][SD74]；河南 2023 年印发三年行动方案（豫政办〔2023〕43 号），2025 年底前实现所有县（市）建成区\"三高\"区域六类监测 [SD71]；郑州\"7·20\"特大暴雨后的防洪排涝重建是河南韧性建设最直接的案例 [SD75][SD76]。考点：目标与效果的区分、监测预警的适用与局限。"}, {"id": "D09", "title": "兰考县东坝头镇\"共富工坊\"案例", "category": "D", "tags": ["河南", "乡村振兴", "共同富裕", "案例", "兰考"], "related": ["D10", "D01"], "evidence_level": "官方", "sources": ["SE01", "SE02", "SE03", "SE04", "SE05"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "D09-兰考东坝头镇共富工坊.md", "card": "兰考县东坝头镇位于黄河\"最后一道弯\"，辖 15 个行政村。该镇以党建引领盘活闲置资产，把空心院、闲置校舍改造为\"共富工坊\"，通过\"总部＋加工点\"模式引进河南海熠工艺品有限公司，形成\"孵化基地＋支部联建＋群众增收＋集体经济＋积分赋能\"五位一体机制。目前全镇已建成 13 个共富工坊，提供 2000 余个就业岗位，带动群众增收 1600 余万元。考试要点：小工坊如何撬动\"家门口就业＋集体经济＋弱势群体帮扶\"三重目标，可迁移到产业帮扶、基层党建、共同富裕等申论主题。"}, {"id": "D10", "title": "河南防止返贫动态监测帮扶", "category": "D", "tags": ["河南", "防返贫", "乡村振兴", "案例"], "related": ["D09", "D01"], "evidence_level": "官方", "sources": ["SE06", "SE07", "SE08", "SE09", "SE10", "SE11"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "D10-河南防返贫监测帮扶.md", "card": "防止返贫动态监测帮扶是脱贫攻坚过渡期（2021—2025）河南守牢底线的核心机制：以家庭为单位，通过农户自主申报、干部走访排查、部门筛查预警三条线识别存在返贫致贫风险的农户（参考线 2024 年为家庭年人均纯收入 8100 元），经村级评议、乡镇审核、县级确定后纳入监测，落实产业、就业、兜底、临时救助等针对性帮扶，风险稳定消除后退出并常态化监测。可考要点：监测识别\"三线\"来源、精准帮扶\"开发式为主＋保障性兜底\"、动态管理\"应纳尽纳、应扶尽扶、稳定消除\"。2025 年河南省委一号文件将其单列为\"确保不发生规模性返贫致贫\"专章。"}, {"id": "D11", "title": "河南高标准农田建设", "category": "D", "tags": ["河南", "高标准农田", "粮食安全", "乡村振兴", "案例"], "related": ["D09", "D10", "D12"], "evidence_level": "官方", "sources": ["SF01", "SF02", "SF03", "SF04", "SF05", "SF06", "SF07", "SF08"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "D11-河南高标准农田.md", "card": "高标准农田是\"田成方、林成网、路相通、渠相连、旱能浇、涝能排\"的现代化良田，是河南扛稳粮食安全重任、落实\"藏粮于地、藏粮于技\"战略的核心抓手。河南的做法：2022 年起在已建成 8500 多万亩高标准农田基础上，按\"六化\"（建设标准化、装备现代化、应用智能化、经营规模化、管理规范化、环境生态化）标准启动 1500 万亩高标准农田示范区建设，亩均投资不低于 4000 元，实行\"地方融资、省级贴息\"和\"投建运管\"一体化机制；建后推行\"一长两员\"\"田长制\"等网格化管护。截至 2024 年底河南累计建成高标准农田 8808 万亩、约占全省耕地 78%，支撑粮食总产连续 9 年稳定在 1300 亿斤以上。可考要点：\"六化\"标准、示范区融资机制、三分建七分管、良田—良种—良机—良法\"五良\"集成。"}, {"id": "D12", "title": "河南粮食安全与中原农谷", "category": "D", "tags": ["河南", "粮食安全", "中原农谷", "种业创新", "案例"], "related": ["D10", "D11", "P02", "D01"], "evidence_level": "官方", "sources": ["SF09", "SF10", "SF11", "SF12", "SF13", "SF14"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "D12-河南粮食安全.md", "card": "河南是\"中原粮仓\"：粮食总产量常年居全国第二、小麦产量全国第一（约占全国四分之一），每年调出原粮及制成品 600 亿斤以上，扛稳保障国家粮食安全的政治责任。围绕\"藏粮于地、藏粮于技\"，河南的机制抓手是：粮食安全党政同责与责任制考核、耕地保护与占补平衡、以中原农谷为核心的种业创新平台（配套高标准农田建设，见 D11）、最低收购价收储与\"粮头食尾\"加工延链。2025 年河南粮食总产量 1350.98 亿斤，连续 9 年稳定在 1300 亿斤以上。可考要点：党政同责、中原农谷\"一方案一意见\"、每年供种 45 亿斤/冬小麦供种占全国 50%、从\"中原粮仓\"到\"国人厨房\"。"}, {"id": "D13", "title": "河南民营经济高质量发展", "category": "D", "tags": ["河南", "民营经济", "营商环境", "万人助万企", "案例"], "related": ["D01", "D11", "D12", "P01"], "evidence_level": "官方", "sources": ["SF15", "SF16", "SF17", "SF18", "SF19", "SF20", "SF21", "SF22"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "D13-河南民营经济.md", "card": "民营经济是河南经济的\"主力军\"：全省实有民营经济主体超 1100 万户、占全部经营主体约 96%，吸纳就业占城镇就业八成以上，高新技术企业中民企占比超 95%。河南的做法围绕\"两个毫不动摇\"展开：省委省政府《关于促进民营经济发展壮大的实施意见》31 条、《河南省促进民营经济高质量发展行动计划》\"六个专项行动＋六个专项攻坚\"、\"万人助万企\"活动干部包联助企、\"三个一批\"项目建设稳投资、《河南省优化营商环境条例》修订护航。可考要点：民营经济促进法（2025-05-20 施行）、\"项目为王\"、\"高效办成一件事\"、清欠账款与涉企\"四乱\"整治。"}, {"id": "D14", "title": "河南建设全国统一大市场循环枢纽", "category": "D", "tags": ["河南", "统一大市场", "枢纽经济", "物流", "营商环境", "案例"], "related": ["D01", "D13", "P01"], "evidence_level": "官方", "sources": ["SF23", "SF24", "SF25", "SF26", "SF27", "SF28", "SF29", "SF30", "SF31", "SF32"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "D14-河南统一大市场.md", "card": "建设全国统一大市场是构建新发展格局的基础支撑。河南作为经济大省和贯通南北、连接东西的战略枢纽，2025 年把融入服务全国统一大市场作为高质量发展战略性举措：召开“新春第一会”，出台实施方案、建立 150 项年度任务清单、开展 10 项重点事项攻坚，落实“五统一、一开放”。总抓手是打造“四枢纽”（物流通道、消费商贸、要素配置、产业链接）、建强“三支点”（共建“一带一路”融汇、对外贸易擢转、国际投资合作），目标是建成“全国统一大市场循环枢纽”和“国内国际市场双循环支点”。2026 年 5 月省人大常委会出台专项《决定》，在全国省级层面率先以法治方式保障。可考要点：四枢纽三支点、企业迁移“一件事”、中欧班列全国第二、“扫码入企”、招商“禁止事项清单”。"}, {"id": "D15", "title": "河南新质生产力与\"7+28+N\"产业链群", "category": "D", "tags": ["河南", "新质生产力", "产业链群", "科技创新", "制造业", "案例"], "related": ["D12", "D13", "D14", "P01"], "evidence_level": "官方", "sources": ["SF33", "SF34", "SF35", "SF36", "SF37", "SF38", "SF39", "SE14", "SF41", "SF42"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "D15-河南新质生产力.md", "card": "新质生产力是河南从\"经济大省\"迈向\"经济强省\"的核心抓手。2021 年起河南把\"创新驱动、科教兴省、人才强省\"置于十大战略之首，产业上构建\"7+28+N\"产业链群体系（7 大先进制造业集群、28 条重点产业链、N 个细分领域），科创上形成中原科技城、中原医学科学城、中原农谷\"三足鼎立\"大格局，重建重振省科学院、组建省实验室体系，推动规上工业企业研发活动全覆盖，配套\"万人助万企\"和产学研对接。成效：2024 年高新技术企业 13290 家、技术合同成交额 1759.39 亿元，2025 年战略性新兴产业占规上工业增加值比重超 25%。可考要点：7+28+N、三足鼎立、两城一谷、研发活动全覆盖、科技副总。"}, {"id": "D16", "title": "河南文旅文创融合战略", "category": "D", "tags": ["河南", "文旅文创", "行走河南读懂中国", "博物馆", "沉浸式体验", "案例"], "related": ["D15", "D12", "P01"], "evidence_level": "官方", "sources": ["SF43", "SF44", "SF45", "SF46", "SF47", "SF48", "SF49", "SF50", "SF51", "SF52"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "D16-河南文旅文创融合.md", "card": "文旅文创融合战略是河南省第十一次党代会（2021 年）提出的\"十大战略\"之一，目标是把河南丰富的历史文化资源转化为文旅产业优势，推动河南从\"文旅大省\"迈向\"文旅强省\"，把文旅产业培育成支柱产业。核心抓手：塑造\"行走河南·读懂中国\"品牌体系（2024 年 9 月正式发布品牌标识），依托博物馆群、国家考古遗址公园、沉浸式演艺和\"文旅+科技\"新业态激活文化遗产。成效：2024 年全省接待游客 10.65 亿人次、旅游收入 10304.13 亿元，双双首次突破\"10 亿人次、1 万亿元\"。可考要点：文旅文创融合战略、行走河南·读懂中国、殷墟甲骨文中华文化新地标、只有河南·戏剧幻城、博物馆群。"}, {"id": "D17", "title": "河南县域经济高质量发展", "category": "D", "tags": ["河南", "县域经济", "成高原起高峰", "三项改革", "开发区", "案例"], "related": ["D15", "D13", "D12", "P01"], "evidence_level": "官方", "sources": ["SF53", "SF54", "SF55", "SF56", "SF57", "SF58", "SF59", "SF60", "SF61", "SF62"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "D17-河南县域经济高质量发展.md", "card": "县域经济是河南的基本盘：县域面积约占全省 85%、常住人口约占 70%，县域 GDP 占全省六成以上。2021 年省第十一次党代会提出“中心城市起高峰、县域经济成高原”，同年印发《关于推进新发展格局下河南县域经济高质量发展的若干意见（试行）》，以放权赋能（赋予县市 255 项管理权限）、开发区体制（“管委会+公司”）、省与市县财政体制（财政直管县扩至 102 个县市）“三项改革”增动力，配套“一县一省级开发区”“一县一主导产业”和县城城镇化补短板。成效：2025 年赛迪中部百强县河南 30 席居中部首位，巩义成为全省首个 GDP 千亿县；但强县不强、产业同质化、要素外流与财政压力仍是短板。可考要点：成高原起高峰、三项改革、开发区“三化三制”。"}, {"id": "D18", "title": "河南人才引育与中原人才高地建设", "category": "D", "tags": ["河南", "人才引育", "中原英才计划", "招才引智创新发展大会", "1+20人才政策", "案例"], "related": ["D15", "D13", "D14", "D17"], "evidence_level": "官方", "sources": ["SF63", "SF64", "SF65", "SF66", "SF67", "SF69", "SF70"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "D18-河南人才引育与中原人才高地.md", "card": "人才是河南创新驱动、科教兴省、人才强省战略（\"十大战略\"之首）的核心支撑。河南的困局在于：人才总量偏少、高层次人才外流、产业结构与人才结构错配、薪酬竞争力弱。破题路径：以\"中原英才计划\"（2017 年起，中原学者、中原领军人才、中原青年拔尖人才三层次）育才，自 2018 年起连年举办中国·河南招才引智创新发展大会引才，出台\"1+20\"一揽子人才政策配套住房、补贴与青年人才驿站，依托省实验室、产业研究院聚才，辅以柔性引才和\"揭榜挂帅\"。成效：截至 2021 年底全省人才资源总量 1201.23 万人，招才引智大会累计签约人才超 23.9 万人。可考要点：人才强省战略、\"1+20\"政策、引才与留才并重。"}, {"id": "P01", "title": "2026年河南省政府工作报告摘要", "category": "P", "tags": ["河南", "政策", "政府工作报告", "十五五", "时政"], "related": ["P02", "D10"], "evidence_level": "官方", "sources": ["SE12", "SE13", "SE14", "SE15", "SE16"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "P01-政策-河南2026政府工作报告.md", "card": "2026年河南省政府工作报告是\"十五五\"开局之年的总部署。报告回顾\"十四五\"（GDP达6.66万亿元、粮食连续稳定高产）与2025年（GDP增长5.6%、粮食产量1350.97亿斤），提出2026年经济增长5%左右、粮食产量1300亿斤以上等预期目标，部署融入服务全国统一大市场、扩内需、现代化产业体系、乡村全面振兴、城乡区域协调、改革开放、文化、绿色转型、民生、防风险等十个方面重点工作。核心框架是\"1+2+4+N\"目标任务体系。选调考试中，本篇是时政常识题的直接题源，也是申论论述河南定位（粮食安全、统一大市场、新质生产力、黄河战略）时引用目标与数据的权威依据。"}, {"id": "P02", "title": "2026年河南省委一号文件摘要", "category": "P", "tags": ["河南", "政策", "一号文件", "乡村振兴", "粮食安全"], "related": ["P01", "D09", "D10"], "evidence_level": "官方", "sources": ["SE17", "SE18", "SE19", "SE20", "SE21"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "P02-政策-河南乡村振兴一号文件.md", "card": "2026年河南省委一号文件是\"十五五\"开局之年指导全省\"三农\"工作的纲领性文件，以推进乡村全面振兴为总抓手、以学习运用\"千万工程\"经验为引领，部署六大板块：持续提升粮食综合生产能力（粮食面积稳定在1.6亿亩以上、产量稳定在650亿公斤以上）、把农业建成现代化大产业（6大产业集群、18条乡村富民产业链）、统筹建立常态化防止返贫致贫机制、宜居宜业和美乡村建设（2026年培育35个先导区）、农村重点领域改革（第二轮土地承包延包30年整省试点）与党建引领基层治理。它把中央一号文件精神河南化、具体化，是选调考试\"三农\"主题的最高优先级政策文本：粮食安全、防返贫、和美乡村、延包试点四条线都从这里出题。"}, {"id": "W01", "title": "河南时政周报 2026-06-29 至 2026-07-05", "category": "W", "tags": ["河南", "时政周报", "交通运输", "民间投资", "中欧班列", "建党105周年"], "related": ["D09", "P01"], "evidence_level": "官方", "sources": ["SE22", "SE23", "SE24", "SE25", "SE26", "SE27", "SE28", "SE29", "SE30"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "W01-周报-2026-07-05.md", "card": "本周河南时政主线有四：一是省级密集出台稳经济政策，6月30日省政府新闻办吹风《河南省交通运输结构调整专项行动方案（2026—2028年）》，7月6日印发促进民间投资高质量发展20条；二是7月1日庆祝建党105周年大会举行，全省深入学习习近平总书记重要讲话精神；三是开放通道扩容，7月1日郑州国际陆港新增3条中欧（亚）班列图定线路；四是民生领域，7月3日失业保险稳岗扩岗\"两延续一优化\"政策落地、7月8日高招录取启动。本周期内黄河调水调沙持续推进（6月22日启动），是水利与生态治理的标志性事件。考法以常识（政策名称、时间、目标数字）与案例分析（运输结构调整逻辑）为主。"}, {"id": "W02", "title": "河南时政周报 2026-07-06 至 2026-07-12", "category": "W", "tags": ["河南", "时政周报", "民间投资", "长期护理保险", "高招录取", "粮食安全"], "related": ["W01", "D10", "P02"], "evidence_level": "官方", "sources": ["SE34", "SE27", "SE35", "SE31", "SE36", "SE29", "SE37", "SE32", "SE24", "SE38"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "W02-周报-2026-07-12.md", "card": "本周河南时政主线：一是民生保障重磅——省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号），用3年左右在全省全面建立长护险制度，大河网7月10日全文发布；二是政策落地周——促进民间投资20条（7月6日）、服务业扩能提质实施意见等继续公开发布；三是黄河调水调沙7月10日9时完成水库调度，排沙1.79亿吨创历年同期之最；四是招生录取季启动，7月8日高招录取开始。此外，省政府7月还出台适应气候变化提升粮食生产防灾减灾能力指导意见（具体印发日期[存疑]）。考法聚焦：长护险制度细节（费率、筹资、实施步骤）、调水调沙数据、稳投资政策工具。"}, {"id": "W03", "title": "河南时政周报 2026-07-13 至 2026-07-19", "category": "W", "tags": ["河南", "时政周报", "经济半年报", "外贸", "防汛", "粮食产销"], "related": ["W02", "W01", "P01"], "evidence_level": "官方", "sources": ["SE39", "SE40", "SE41", "SE42", "SE43", "SE44", "SE45", "SE46", "SE47", "SE48", "SE49"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "W03-周报-2026-07-19.md", "card": "本周（7月13日—19日）河南时政主线有三：一是7月17日省统计局公布2026年上半年经济运行情况，全省GDP 33521.58亿元、同比增长5.0%，进出口总值历史同期首次突破5000亿元，\"半年报\"是本期最重的可考素材；二是7月16日起我国进入\"七下八上\"防汛关键期，河南省防指当日14时30分启动防汛四级应急响应，防汛与高温伏旱叠加成为本周治理主线；三是粮食流通领域，7月9日小麦产销合作洽谈会签约200万吨、金额50亿元，\"郑州价格\"建设推进。此外，郑州国际陆港包件库投用首月入库破万吨，1—6月全省中欧（亚）班列开行1859列、同比增长22%；高招普通本科批7月21日正式投档。考法以常识（GDP总量与增速、应急响应时间、班列数据）与案例分析（经济大省挑大梁、粮食产销衔接）为主。"}, {"id": "W04", "title": "河南时政周报 2026-07-20 至 2026-07-26", "category": "W", "tags": ["河南", "时政周报", "下半年经济部署", "促消费", "高招投档", "抗旱保秋"], "related": ["W03", "W02", "P01"], "evidence_level": "官方", "sources": ["SE38", "SE50", "SE51", "SE52", "SE53", "SE54", "SE55", "SE46", "SE47", "SE49"], "created": "2026-10-19", "updated": "2 政周报 2026-10-05 至 2026-10-11", "category": "W", "tags": ["河南", "时政周报", "南水北调", "国庆文旅", "秋粮收获", "麦播", "复工复产"], "related": ["W13", "W12", "P01", "D10", "D11", "D12", "D16"], "evidence_level": "官方", "sources": ["SE171", "SE172", "SE173", "SE174", "SE175", "SE176", "SE177"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "W15-周报-2026-10-11.md", "card": "本周（10月5日—11日）横跨国庆假期收尾与节后复工，河南时政主线是\"新班子首调研+假日经济收官+三秋收尾\"。人事与治理线：10月6日省委书记周祖翼、代省长王陆进履新后首次共同外出调研，赴南阳淅川检查南水北调中线工程，强调\"扛稳一泓清水永续北上政治责任\"。经济线：省文旅厅数据显示全省4A级及以上重点景区国庆假期接待游客1833.3万人次、营业收入11.6亿元；雄商高铁开通后首个假期，商丘站发送旅客36.9万人次、同比增长25.2%。农业线：截至10月1日全省已收粮食作物4895万亩，全国秋粮收获10月8日过四成、10日过半，麦播在豫北陆续展开，专家建议播期较往年推迟7—10天。此周是\"省级新班子施政方向+假日消费数据+粮食安全韧性\"三条考线的交汇点。"}, {"id": "W16", "title": "河南时政周报 2026-10-12 至 2026-10-18", "category": "W", "tags": ["河南", "时政周报", "信阳调研", "大别山精神", "四季度经济", "菊花文化节", "郑州马拉松", "秋收"], "related": ["W15", "W13", "P01", "D10", "D12", "D16", "D18"], "evidence_level": "官方", "sources": ["SE181", "SE182", "SE183", "SE184", "SE185", "SE186", "SE187", "SE188", "SE189", "SE190"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "W16-周报-2026-10-18.md", "card": "本周（10月12日—18日）河南时政主线是\"调研定调+经济冲刺+秋收扫尾+节会开跑\"。治理线：10月14日至15日省委书记周祖翼、代省长王陆进赴信阳新县、光山县调研，瞻仰鄂豫皖苏区首府烈士陵园，强调弘扬大别山精神、落实\"两个更好\"；14日两人还走访中央驻豫新闻单位。经济线：10月18日四季度全省经济运行工作推进会在郑州召开，部署促消费扩投资、强创新兴产业等六个\"精准发力\"。农业线：截至10月12日全省已收秋作物10920万亩、占93.3%，至10月14日达11159万亩、粮食7267万亩，秋收基本结束、麦播接续。文旅线：开封第44届菊花文化节10月17日晚启幕、全城布菊330万盆；10月18日约2.5万名跑者参加2026郑州马拉松。"}, {"id": "W17", "title": "河南时政周报 2026-10-19 至 2026-10-25", "category": "W", "tags": ["河南", "时政周报", "省第十二次党代会", "前三季度GDP", "菊花文化节", "秋播麦播", "降温"], "related": ["W15", "W13", "W12", "P01", "D12", "D16", "D18"], "evidence_level": "官方", "sources": ["SE191", "SE192", "SE193", "SE194", "SE195", "SE196", "SE197", "SE198", "SE199", "SE200"], "created": "2026-10-20", "updated": "2026-10-20", "status": "draft", "file": "W17-周报-2026-10-25.md", "card": "本周（10月19日—25日）河南时政头条是省第十二次党代会：10月18日十一届省委十二次全会决定大会20日在郑州召开，19日举行预备会议（应到代表919名、出席888名）并产生110人主席团，20日大会开幕。这是\"十五五\"开局之年、河南\"扬长补短、全面崛起\"关键阶段的一次换届大会。经济面：国家统计局10月19日公布前三季度全国GDP同比增长4.6%。农业面：秋收基本结束（已收7267万亩），全省进入麦播高峰，《2026年小麦秋播生产技术明白纸》给出门经纬度分区播期。文旅面：开封第44届菊花文化节开幕，全城布展菊花330万盆。此周是\"换届政治+宏观数据+秋冬种衔接\"三线交汇。"}], "sources": [{"id": "SD01", "title": "国务院关于进一步优化政务服务提升行政效能推动\"高效办成一件事\"的指导意见（国发〔2024〕3号）", "type": "official", "url": "https://www.gov.cn/zhengce/zhengceku/202401/content_6926256.htm", "publisher": "中国政府网", "year": 2024, "checked_date": "2026-10-18", "note": "已抓取全文核实：2024-01-16发布，成文2024-01-09；两阶段目标（2024/2027）、五方面任务（渠道建设/模式创新/数字赋能/扩面增效/工作基础）、\"四办\"模式（集成办、承诺办、跨域办、免申办）原文在案。"}, {"id": "SD02", "title": "河南省人民政府关于进一步优化政务服务提升行政效能推动\"高效办成一件事\"的实施意见（豫政〔2024〕18号）", "type": "official", "url": "https://www.weidong.gov.cn/contents/32763/26360.html", "publisher": "河南省人民政府（平顶山市卫东区政府网转载全文）", "year": 2024, "checked_date": "2026-10-18", "note": "已抓取全文核实（2024-07-17印发）。含2024年量化目标：表单信息自动生成50%以上、申请材料压减60%以上、办理时限压缩70%以上、办理环节压缩80%以上；国务院部署13个\"一件事\"2024年10月底前落地；\"五端一体\"、负面清单管理、牵头部门第一责任人等条款原文在案。"}, {"id": "SD03", "title": "国务院办公厅关于健全\"高效办成一件事\"重点事项常态化推进机制的意见（国办发〔2025〕24号）", "type": "official", "url": "https://www.gov.cn/gongbao/2025/issue_12166/202507/content_7032503.html", "publisher": "中国政府网（国务院公报2025年第20号）", "year": 2025, "checked_date": "2026-10-18", "note": "已抓取全文核实（2025-07-03印发）：两个全生命周期总体清单、2027年底前总体清单内重点事项全面落地、防止\"数字形式主义\"、\"人工智能+政务服务\"、基层报表\"只报一次\"等条款。"}, {"id": "SD04", "title": "【新华解读】集成创新、重点突破，以\"高效办成一件事\"为重要抓手优服务提效能（作者：河南省行政审批和政务信息管理局党组书记、局长李明东）", "type": "official", "url": "https://www.hnzwfw.gov.cn/2024/01-18/41000194.html", "publisher": "河南政务服务网", "year": 2024, "checked_date": "2026-10-18", "note": "已抓取全文核实。河南实施数据：95.1%事项全程网办、7195项掌上办、省级统筹45个\"一件事一次办\"、省级事项71.5%与省统一受理系统实质性联通、1391项事项\"跨省通办\"、比亚迪郑州航空港项目签约到开工37天、濮阳不动产登记秒办秒结等。"}, {"id": "SD05", "title": "让\"高效办成一件事\"办成一件件民生实事（新华社）", "type": "web", "url": "https://www.gov.cn/yaowen/liebiao/202603/content_7063650.htm", "publisher": "新华社（中国政府网转载）", "year": 2026, "checked_date": "2026-10-18", "note": "已抓取全文核实（2026-03-24）：国家层面重点事项清单已推出五批共55项；河南省实施建设项目联合验收\"一件事\"，全省统一受理条件、申请材料、办理流程和时限标准，省市县三级联动，实现\"一次告知、一表申请、一套材料、一窗（端）受理、一网办理\"。"}, {"id": "SD06", "title": "\"劲儿往一处使\"——2025\"高效办成一件事\"的鲜活样本（新华社）", "type": "web", "url": "https://www.news.cn/20251230/29808e41d6074046ade72dd9fe2586a0/c.html", "publisher": "新华社", "year": 2025, "checked_date": "2026-10-18", "note": "已抓取全文核实（2025-12-30）：截至2025年底累计推出四批重点事项清单；张定安、孟庆国等学者关于\"从碎片化管理到整体性治理\"\"三层面再造\"的评述原文在案。"}, {"id": "SD07", "title": "河南基本实现让企业群众办事只进一门、只跑一次（大河报，人民网河南频道转载）", "type": "web", "url": "http://henan.people.com.cn/n2/2022/0829/c351638-40100593.html", "publisher": "人民网河南频道", "year": 2022, "checked_date": "2026-10-18", "note": "已抓取全文核实：2022年河南省政务服务事项办理时限压缩70%以上、90%以上事项不见面审批、175个市县政务服务中心、省政务大厅进驻39个部门2335项事项——改革背景层面证据。"}, {"id": "SD08", "title": "西华：把群众\"上心事\"办成\"放心事\"（周口日报）", "type": "web", "url": "https://www.zhoukou.gov.cn/page_pc/xwzx/xqdt/xqdt/article2fe1f62f72d94952b62fc8820b9bdd50.html", "publisher": "周口市人民政府网", "year": 2026, "checked_date": "2026-10-18", "note": "已抓取全文核实（2026-08-21）：西华县按省市部署推动41项\"高效办成一件事\"重点事项上线，累计办理24269件；企业开办压至1个工作日内、工程建设项目总审批时限压至60个工作日内。县级落地证据。"}, {"id": "SD09", "title": "河南省安阳县：\"一二三四\"工作法提质增效 构建惠企政务服务新模式", "type": "web", "url": "http://business.china.com.cn/2026-08/20/content_43479561.shtml", "publisher": "中国网商务频道", "year": 2026, "checked_date": "2026-10-18", "note": "已抓取全文核实（2026-08-20）：安阳县上线51个\"一件事\"、48项重点事项全部即来即办（即来即办率94%）、企业办事跑动频次下降82%、联办事项办理时限压缩81%、累计办理15323件、满意率100%（注意：满意率100%为自报口径，媒体宣传性质，引用需谨慎）。"}, {"id": "SD10", "title": "关于全面推进紧密型县域医疗卫生共同体建设的指导意见（国卫基层发〔2023〕41号）", "type": "official", "url": "https://www.gov.cn/zhengce/zhengceku/202312/content_6923447.htm", "publisher": "国家卫生健康委等10部门（中国政府网刊发）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。规定2024年6月底前以省为单位全面推开、2025年底90%以上县基本建成、2027年底基本全覆盖；'七统一'管理、医保总额付费、结余留用、合理超支分担等核心机制原文。"}, {"id": "SD11", "title": "河南：'13710'建设紧密型医共体", "type": "official", "url": "http://www.news.cn/health/20211117/608d7a6ad43f45fd8b2a7c4d06ae19d1/c.html", "publisher": "新华网", "year": 2021, "checked_date": "2026-10-18", "note": "已核实全文。河南省委深改办数据：103县(市)组建190个医共体、覆盖365个县级公立机构与1755个乡镇卫生院；102县设管委会、89县由县委书记兼任主任；33县实行医保总额付费；'13710'督办制度；县级医院升级与乡镇卫生院达标数据；县域就诊率90%、基层就诊率65%目标。"}, {"id": "SD12", "title": "让百姓在'家门口'获得更好医疗服务——聚焦紧密型县域医共体建设（新华社政策解读）", "type": "official", "url": "https://www.gov.cn/zhengce/202401/content_6925713.htm", "publisher": "新华社（中国政府网）", "year": 2024, "checked_date": "2026-10-18", "note": "已核实全文。国家卫健委发布会：2019年起828个试点县、3个试点省份；国家医保局'总额付费、加强监督考核、结余留用、合理超支分担'要求；2022年基层住院报销比例比二三级医院分别高约10%和17%。"}, {"id": "SD13", "title": "河南省人民政府办公厅关于印发河南省推进紧密型县域医疗卫生共同体高质量发展若干措施的通知（豫政办〔2025〕23号）", "type": "official", "url": "https://m.hnzx.gov.cn/2025/05-28/4352171.html", "publisher": "河南省人民政府办公厅（河南省政协网站转载全文）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文（2025-04-29成文、05-27发布）。总院长负责制、支持取消县域内公立医疗机构行政级别、2025年底前落实'七统一'、派驻帮扶至少半年、严防虹吸基层资源与滞留挪用基层资金等条款原文。"}, {"id": "SD14", "title": "关于印发紧密型县域医疗卫生共同体监测指标体系的通知（国卫办基层发〔2024〕22号）", "type": "official", "url": "https://www.nhc.gov.cn/jws/c100073/202411/85be7c1072b342ada194530590291833.shtml", "publisher": "国家卫生健康委办公厅、国家医保局办公室、国家中医药局综合司、国家疾控局综合司", "year": 2024, "checked_date": "2026-10-18", "note": "已核实全文。2024版监测指标体系，供县级自评、省市监测评价、国家动态监测。"}, {"id": "SD15", "title": "医保支持基层，河南有实招！", "type": "official", "url": "https://www.nhsa.gov.cn/art/2026/5/24/art_14_20683.html", "publisher": "国家医疗保障局官网", "year": 2026, "checked_date": "2026-10-18", "note": "已核实全文。安阳市医共体结余资金按县乡村5:3:2分配；河南2023年起基层病种'同病同付'；2025年信阳市一级医院DIP基层病种诊治占比67.7%；中医按疗效价值付费等。数据为医保部门自报。"}, {"id": "SD16", "title": "潮涌千帆竞，'豫见'健康新图景（健康报）", "type": "official", "url": "https://www.nhc.gov.cn/xcs/jkzglszb/202512/05fa97214b404f8a8c47a9d841da831d.shtml", "publisher": "健康报（国家卫生健康委官网转载）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文。河南省卫健委主任黄红霞专访：'十四五'以来102家县级医院达到推荐标准、119家乡镇卫生院达到二级医院能力水平等数据，属官方自报进展。"}, {"id": "SD17", "title": "Comprehensive evaluation of the implementation of close-type county medical alliance in Shandong Province using entropy weight TOPSIS method and non-integer rank sum ratio method", "type": "paper", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11459849/", "publisher": "BMC Health Services Research", "year": 2024, "checked_date": "2026-10-18", "note": "已核实摘要与部分全文（PubMed Central）。同行评审实证研究，熵权TOPSIS+非整数秩和比法评价山东省紧密型县域医共体实施情况；研究针对山东，不可直接外推河南。未检索到针对河南医共体的独立因果评估研究。"}, {"id": "SD20", "title": "河南省以综治中心规范化促基层治理高效能 进一扇门 解千千结", "type": "official", "url": "http://www.hnswxcb.com/2025/05-30/417874.html", "publisher": "河南日报（中共河南省委宣传部党建网转载）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文。含2024年全省依托综治中心化解矛盾纠纷75.25万件、化解率98.6%，61个县（市、区）综治中心完成规范化建设，郑州金水区24个窗口37项业务等数据。"}, {"id": "SD21", "title": "【综治中心规范化建设】河南省信阳市光山县：让为民解忧之光照耀每个角落", "type": "official", "url": "http://www.chinapeace.gov.cn/chinapeace/c100052/2025-12/17/content_12815959.shtml", "publisher": "中国长安网（来源：中原盾、河南法治报）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文。含光山县'四项机制'、派单流转、一案一码、驻交警大队调解工作室（调处交通事故纠纷1000余起、促成赔偿超1200万元）、七星湖社区'网格排查+源头预防+就地化解'等做法。"}, {"id": "SD22", "title": "一站式调处，为群众高效解纠纷（河南省新乡市建成统一平台）", "type": "official", "url": "http://henan.people.com.cn/n2/2024/0521/c351638-40850808.html", "publisher": "人民网河南频道（人民日报记者调研报道）", "year": 2024, "checked_date": "2026-10-18", "note": "已核实全文。含新乡市三级社会治理综合服务中心、1.5万个基础网格、四级网格化体系、网格员预警培训机构退费纠纷并推动全市116家培训机构入资金监管平台等做法。"}, {"id": "SD23", "title": "河南司法行政系统充分发挥职能作用赋能平安河南建设", "type": "official", "url": "http://legalinfo.moj.gov.cn/pub/sfbzhfx/zhfxyfzl/yfzldfyfzl/202607/t20260714_537452.html", "publisher": "司法部微信公众号（智慧普法平台转载）", "year": 2026, "checked_date": "2026-10-18", "note": "已核实全文。2026年上半年全省累计化解各类矛盾纠纷30.21万件；人民调解委员会优化调整、退休法官任调解员、商事调解、矛盾纠纷多元化解专项小组等机制。"}, {"id": "SD24", "title": "让老百姓有地方'找个说法'，河南去年诉前调解分流案件43万件，调解成功近一半", "type": "web", "url": "https://www.shangbw.com/news/show-32006.html", "publisher": "河南商报", "year": 2021, "checked_date": "2026-10-18", "note": "已核实全文。2020年全省法院诉前调解分流案件43万件、成功20.1万件（46.7%）；139家中基层法院设248个人民调解工作室、入驻调解员1576人；民事一审案件同比下降11.49%。数据源自省高院副院长宋海萍介绍。"}, {"id": "SD25", "title": "全面推进综治中心规范化建设 不断夯实更高水平平安中国建设根基", "type": "web", "url": "https://xcb.just.edu.cn/2025/0915/c11681a366167/page.htm", "publisher": "江苏警官学院宣传部转载（理论文章）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文。系统阐述场所设置、部门入驻、运行机制、督办落实、信息化建设'五个规范化'，及统一受理—分类流转—依法办理—闭环管理流程；引用2019年《中国共产党政法工作条例》、2023年中办国办《关于坚持和发展新时代'枫桥经验'提升社会矛盾纠纷预防化解能力的意见》等文件脉络。"}, {"id": "SD26", "title": "党建引领网格化高效能治理", "type": "official", "url": "http://dangjian.people.com.cn/n1/2025/1229/c117092-40634221.html", "publisher": "中国共产党新闻网·党建（作者系郑州市委相关负责同志）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文。郑州'十个一'党建引领网格化高效能治理体系、'一格管全面''一键全处理'闭环流程、河南省委'五基四化'部署等。"}, {"id": "SD27", "title": "《郑州市高效能社会治理网格化服务管理条例》新闻发布会", "type": "official", "url": "https://www.zhengzhou.gov.cn/conference3/9997732.jhtml", "publisher": "郑州市人民政府门户网站", "year": 2026, "checked_date": "2026-10-18", "note": "已核实发布稿全文。地方立法将网格化服务管理纳入法治化轨道，是网格化管理机制的制度化样本。"}, {"id": "SD28", "title": "综治中心规范化建设专栏（河南长安网）", "type": "web", "url": "http://www.henanpeace.org.cn/column.html?cid=1335", "publisher": "河南长安网（河南省委政法委主管）", "year": 2026, "checked_date": "2026-10-18", "note": "栏目聚合页，核实存在并持续更新（如2026-05-28平顶山湛河区'一站兜底全量纠纷、多元联动闭环化解'条目）；未逐条抓取全文，仅作省级政法系统专栏入口与佐证线索。"}, {"id": "SD30", "title": "中共中央 国务院关于学习运用\"千村示范、万村整治\"工程经验有力有效推进乡村全面振兴的意见（2024年中央一号文件）", "type": "official", "url": "https://www.gov.cn/zhengce/202402/content_6929934.htm", "publisher": "中共中央、国务院（中国政府网刊发，新华社受权发布）", "year": 2024, "checked_date": "2026-10-18", "note": "已核实全文。肯定'千万工程'为推进乡村全面振兴的成功经验和实践范例，要求学习运用其发展理念、工作方法和推进机制，把乡村全面振兴作为'三农'工作总抓手。"}, {"id": "SD31", "title": "造就万千美丽乡村 造福万千农民群众——\"千万工程\"二十年启示录", "type": "official", "url": "https://www.news.cn/politics/2023-06/25/c_1129715698.htm", "publisher": "新华社（新华网）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。含阶段划分（2003-2010示范引领、2011-2020深化提升、2021起迭代升级）；整治范围从约1万个行政村推广到全省所有行政村；农村居民人均可支配收入连续38年居全国省区第一；城乡收入比2003年2.43→2022年1.90。"}, {"id": "SD32", "title": "学习浙江\"千万工程\"经验案例", "type": "official", "url": "https://www.12371.cn/2023/06/20/ARTI1687250290285397.shtml", "publisher": "共产党员网（《同学》工作室）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实页面（正文含【详细】折叠，概况部分完整）：2003年6月启动背景，从近4万个村庄中选择约1万个行政村全面整治、约1000个中心村建成全面小康示范村；六条主要做法。"}, {"id": "SD33", "title": "造就万千美丽乡村 造福万千农民群众——中央财办、中央农办负责人就《关于有力有序有效推广浙江\"千万工程\"经验的指导意见》答记者问", "type": "official", "url": "https://www.12371.cn/2023/07/05/ARTI1688546116657744.shtml", "publisher": "新华社（共产党员网转载）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。六大科学方法（含'一把手'亲自抓的领导体制、因地制宜结合财政承受能力）；推广'三不'底线：不超越发展阶段、不搞形象工程、不搞强迫命令——复制推广条件的官方边界。"}, {"id": "SD34", "title": "中共浙江省委：在深入践行\"千万工程\"上走前列作示范", "type": "official", "url": "https://www.12371.cn/2023/06/16/ARTI1686882539201876.shtml", "publisher": "共产党员网（转载中共浙江省委署名文章）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。2022年城乡居民人均可支配收入71268元/37565元；规划保留村生活污水治理覆盖率100%、卫生厕所全覆盖、垃圾'零增长''零填埋'、90%以上村庄建成新时代美丽乡村；村级集体总资产8800亿元、年经营性收入50万以上行政村占比51.2%；2018年获联合国'地球卫士奖'。均为省级官方自报数据。"}, {"id": "SD35", "title": "农业农村部召开全国乡村建设工作推进会：以学习运用\"千万工程\"经验为引领，扎实有力推进宜居宜业和美乡村建设", "type": "official", "url": "https://www.gov.cn/lianbo/bumen/202411/content_6985268.htm", "publisher": "农业农村部（中国政府网）", "year": 2024, "checked_date": "2026-10-18", "note": "已核实全文。明确'省级党委政府负责、市县两级抓落实'推进机制、自下而上农民参与实施机制、不搞强迫命令与形象工程等要求。"}, {"id": "SD36", "title": "刘国中强调：学习运用\"千万工程\"经验 扎实稳步全面推进乡村振兴（全国现场推进会）", "type": "official", "url": "https://www.gov.cn/yaowen/liebiao/202310/content_6909042.htm", "publisher": "新华社（中国政府网）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。2023-10-13全国学习运用'千万工程'经验现场推进会在杭州召开；提出规划引领、梯次推进、逐步扩容、迭代升级的工作格局。"}, {"id": "SD37", "title": "中央农村工作会议关键提法之三：\"千万工程\"经验", "type": "official", "url": "https://www.news.cn/politics/20260104/ff4b57a492f741aea822b49239652125/c.html", "publisher": "新华网", "year": 2026, "checked_date": "2026-10-18", "note": "已核实全文。梳理2025年底中央农村工作会议提法：乡村全面振兴总抓手是学习运用'千万工程'经验；三阶段演进与2024年一号文件定位（据《习近平经济思想概论》）。"}, {"id": "SD38", "title": "中共中央 国务院关于做好2023年全面推进乡村振兴重点工作的意 const MDS={"D01-河南高效办成一件事改革.md": "\n# D01 河南\"高效办成一件事\"改革：从多头跑到集成办理的政务服务重塑\n\n## ⚡ 快速知识卡\n\n\"高效办成一件事\"是国务院2024年部署的政务服务改革抓手（国发〔2024〕3号），针对群众企业办事\"多头跑、反复交、耗时长\"的流程碎片化问题，把关联性强、办理量大的多个事项打包集成：一次告知、一表申请、一套材料、一窗（端）受理、一网办理 [SD01]。河南以豫政〔2024〕18号实施意见落实，提出2024年申请材料压减60%以上、办理时限压缩70%以上、办理环节压缩80%以上的量化目标（文件措辞为\"力争\"，属目标值而非已完成数据），并按要求在2024年内落地国务院部署的13个\"一件事\" [SD02]。用途：案例分析题（跨部门协同、整体性治理）、对策题（优化营商环境）、面试综合分析（从\"部门本位\"到\"用户本位\"）。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 一、背景与问题定义：办事多头跑与流程碎片化\n\n企业和群众眼中\"一件事\"（如新生儿出生、开办餐饮店、建设项目验收），在政府侧往往被拆成多个部门的多张许可证、多套材料、多次跑动。国务院《指导意见》开篇即点明其针对的问题：**业务不协同、系统不互通、标准不统一、服务不便捷** [SD01][SD04]。这是典型的\"流程碎片化\"：政府按部门分工组织服务，而用户按需求场景寻求服务——结构与需求错配，产生大量制度性交易成本。新华社报道举例：员工录用一件事，改革前企业要跑7个部门、交20余份材料、耗时近10个工作日 [SD05]。\n\n河南的改革背景有其自身积累：2022年河南已推行\"一件事一次办\"，政务服务事项办理时限压缩70%以上、90%以上事项实现不见面审批，建成175个市县政务服务中心 [SD07]。2024年的\"高效办成一件事\"是在\"一网通办\"\"一件事一次办\"基础上的提档升级——从\"可办\"转向\"好办、易办\"，从单事项优化转向跨部门场景集成 [SD04][SD06]。\n\n### 二、核心机制\n\n**1. 国家层面的顶层设计。** 国务院文件（国发〔2024〕3号，2024年1月印发）确立2024年（实现第一批高频\"一件事\"高效办理）和2027年（形成泛在可及、智慧便捷、公平普惠的高效政务服务体系）两阶段目标，部署五方面16项任务；核心模式为\"四办\"：关联事项**集成办**、容缺事项**承诺办**、异地事项**跨域办**、政策服务**免申办** [SD01]。2025年国办发〔2025〕24号进一步建立**常态化推进机制**：围绕经营主体\"开办到注销\"、个人\"出生到身后\"两个全生命周期建立总体清单，\"成熟一批、发布一批\"，明确2027年底前总体清单内重点事项全面落地，并要求防止\"数字形式主义\"、探索\"人工智能+政务服务\" [SD03]。\n\n**2. 河南的实施方案。** 豫政〔2024〕18号（2024年7月17日印发）结合省情提出：依托省一体化政务服务平台统一申报入口，推行\"一次告知、一表申请、一套材料、一本指南、一窗（端）受理、一网办理、限时办结、统一出件\"；通过数据共享力争表单信息自动生成50%以上、**申请材料压减60%以上、办理时限压缩70%以上、办理环节压缩80%以上（以上均为文件设定的目标值，\"力争做到\"）**；国务院部署的13个\"一件事\"按要求于2024年10月底前全面落地 [SD02]。机制要点包括：\n\n- **渠道整合**：线下\"只进一门\"（进驻事项负面清单管理，严禁\"明进暗不进\"\"体外循环\"），线上\"五端一体\"（电脑端、移动端、大厅端、自助端、热线端）融合，以省统一受理系统为全省网上办理统一入口；诉求\"一线应答\"（12345热线\"总客服\"）[SD02]。\n- **流程重构**：以**并联审批**为基础重构跨部门业务流程，申请表单多表合一、材料一次提交；明确\"没有法律法规依据不得增加申请材料、不得增设办理条件和环节\"的负面约束 [SD02]。\n- **重点事项清单与责任机制**：逐项明确省级牵头部门、联办部门；牵头部门主要负责人为第一责任人，组建工作专班 [SD02]。\n- **数字底座**：存量审批业务系统与省平台以接口实质性联通，\"四电\"（电子证照、电子材料、电子印章、电子签名）应用，省市县三级同一事项32个要素全省统一 [SD02][SD04]。\n\n**3. 典型场景——建设项目联合验收\"一件事\"。** 针对竣工验收环节多头跑、重复交、耗时长问题，河南制定全省统一推进路线，形成省市县三级联动体系，全省统一受理条件、申请材料、办理流程和时限标准，叠加智能审批，实现\"一次告知、一表申请、一套材料、一窗（端）受理、一网办理\" [SD05]。\n\n### 三、真实实施证据（可溯源数据）\n\n- **省级平台与网办能力**（省行政审批政务信息管理局负责人署名文章，2024年1月）：河南95.1%的事项实现全程网办，7195项事项掌上办；省级统筹推进45个全省\"一件事一次办\"事项落地；71.5%的省级政务服务事项与省统一受理系统实质性联通；与25个省份108个县（市、区）协作，累计实现1391项事项\"跨省通办\" [SD04]。\n- **国家级清单规模**：截至2026年3月，国家层面重点事项清单已推出五批共55项（2024年两批21项，2025年第一批12项）[SD05][SD06]；截至2025年底累计四批 [SD06]。\n- **县级落地**：西华县（周口）按省市部署推动41项重点事项上线，累计办理\"高效办成一件事\"重点事项24269件；企业开办压缩至1个工作日内，工程建设项目总审批时限压缩至60个工作日内 [SD08]。安阳县（安阳）上线51个\"一件事\"，48项重点事项全部即来即办，累计办理15323件，自报企业办事跑动频次下降82%、联办时限压缩81%、满意率100%（注意：满意率100%系该县自报宣传口径）[SD09]。\n- **项目落地例证**：郑州航空港比亚迪整车制造项目因\"标准地+承诺制\"等改革，从签约到开工建设仅用37天 [SD04]。\n\n### 四、政策目标与实际效果的区分\n\n必须区分两类表述：**目标值**（如\"材料压减60%、时限压缩70%、环节压缩80%\"）是豫政〔2024〕18号设定的努力方向，措辞为\"力争做到\" [SD02]；**已核实的效果数据**是上文第三节所列各来源的具体数字。目前公开渠道**未见**河南全省层面经独立第三方评估的、针对\"高效办成一件事\"专项的系统性成效评估报告；县级办件量与压缩比例均为地方政府自报（政务信息/媒体报道），媒体如新华社报道属于典型经验宣传性质。备考引用时建议：引目标值时注明\"文件要求/力争\"；引效果数据时注明具体出处与行政层级；避免将宣传性表述（如\"满意率100%\"）当作独立评估结论。\n\n### 五、局限与争议\n\n- **协同成本与\"数字形式主义\"风险**：国办2025年文件专门要求\"避免重复建设，防止'数字形式主义'\"、避免\"面子工程\" [SD03]，说明中央层面已意识到平台重复建设、指标化追求形式的风险。\n- **数据壁垒仍存**：国家文件多次强调国务院部门垂管系统与地方平台对接、数据回流基层 [SD01][SD03]，侧面反映垂管数据不下沉是地方办事的长期堵点；河南也把\"存量系统实质性联通\"列为推进中的任务（2024年1月时为71.5%）[SD04]。\n- **线下渠道与数字鸿沟**：改革强调保留人工窗口、帮办代办，为老年人等特殊群体兜底 [SD03][SD05]，说明\"一网通办\"并不能替代所有场景。\n- **评估缺口**：缺乏可核验的第三方评估或用户体验调查公开发布，各地成效数据自报成分高，横向可比性有限 [SD09]。\n\n### 六、与考试能力的关联\n\n- **案例分析**：本专题是\"跨部门协同/整体性治理\"的鲜活案例——从\"碎片化管理\"到\"整体性治理\"、以\"办事场景\"为基本单元重构组织逻辑（张定安），以及流程—系统—标准三个层面的再造（孟庆国）[SD06]，可作案例分析题的理论落点。\n- **对策题**：优化营商环境、政务服务类对策可组合使用：清单管理+并联审批+数据共享+告知承诺+免申即享+帮办代办 [SD02][SD03]。\n- **面试综合分析**：可从\"部门本位→用户本位\"切入，辩证展开：既要数字赋能，也要防止数字形式主义、保留线下兜底。\n- 大作文立意参考：\"改革清单\"变\"便利清单\" [SD05]，以群众获得感为标尺。\n\n### 原创·思考题\n\n1. 对比豫政〔2024〕18号的量化目标与西华县、安阳县的自报数据，分析\"政策目标—执行落实—效果自评\"链条中可能的信息失真环节，并设计你若作为督查人员的核验思路。\n2. \"一件事\"集成办理为什么必须以数据共享为前提？若垂管系统数据不回流，\"一次告知、一表申请\"会在哪个环节失效？\n3. 结合国办发〔2025〕24号\"防止数字形式主义\"的要求，论述\"高效办成一件事\"考核应设计哪些**反指标**（如线下渠道保留率、老年人办件成功率）。\n\n### 来源说明\n\n本专题数据均可溯源至下列官方文件或权威媒体报道；县级数据为地方政府自报口径，已在正文标注；未发现独立的第三方评估报告，相关缺口如实说明，未引用任何无法核验的数字。\n\n## 来源与证据\n\n- [SD01] 《国务院关于进一步优化政务服务提升行政效能推动\"高效办成一件事\"的指导意见》（国发〔2024〕3号，2024-01-16发布）。已核实全文。[官方]\n- [SD02] 《河南省人民政府关于进一步优化政务服务提升行政效能推动\"高效办成一件事\"的实施意见》（豫政〔2024〕18号，2024-07-17）。已核实全文（卫东区政府网转载）。[官方]\n- [SD03] 《国务院办公厅关于健全\"高效办成一件事\"重点事项常态化推进机制的意见》（国办发〔2025〕24号，2025-07-03）。已核实全文。[官方]\n- [SD04] 李明东（河南省行政审批和政务信息管理局局长）：《集成创新、重点突破，以\"高效办成一件事\"为重要抓手优服务提效能》，河南政务服务网，2024。已核实全文。[官方]\n- [SD05] 新华社：《让\"高效办成一件事\"办成一件件民生实事》，中国政府网转载，2026-03-24。已核实全文。[权威媒体]\n- [SD06] 新华社：《\"劲儿往一处使\"——2025\"高效办成一件事\"的鲜活样本》，2025-12-30。已核实全文。[权威媒体]\n- [SD07] 大河报（人民网河南频道转载）：《河南基本实现让企业群众办事只进一门、只跑一次》，2022-08-29。已核实全文。[权威媒体]\n- [SD08] 周口日报：《西华：把群众\"上心事\"办成\"放心事\"》，周口市政府网，2026-08-21。已核实全文。[官方媒体]\n- [SD09] 中国网商务频道：《河南省安阳县：\"一二三四\"工作法提质增效 构建惠企政务服务新模式》，2026-08-20。已核实全文；数据为县级自报，谨慎引用。[媒体]\n\n## 关联专题\n\n-\n-\n- [D05-待建](../index/topics.json)\n", "D02-河南紧密型县域医共体改革.md": "\n# D02 河南紧密型县域医共体改革：从试点到全省推开的政策与证据\n\n## ⚡ 快速知识卡\n\n紧密型县域医共体是把县级医院、乡镇卫生院、村卫生室整合为\"责任、管理、服务、利益共同体\"，核心是\"人财物统一管理＋医保总额付费、结余留用、合理超支分担\"。国家层面：2019 年启动 828 个试点县，2023 年国卫基层发〔2023〕41 号文要求 2024 年 6 月底前以省为单位全面推开 [SD10][SD12]。河南 2021 年已实现 103 县（市）组建 190 个医共体全覆盖，并以\"13710\"督办机制推进 [SD11]；2025 年省政府办公厅再出高质量发展若干措施，力推去行政化、一体化管理 [SD13]。实际用途：申论中作为\"资源整合型公共服务改革\"典型案例，可对应政策工具、执行机制、医保杠杆三条线。适用题型：案例分析（政策落地）、对策题（基层能力建设）、面试综合分析。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n县域是我国最基本的社会管理单元，也是城乡医疗资源差距最集中的层级：优质资源向城市大医院集中，县级医院能力不足、乡镇卫生院服务萎缩、\"虹吸\"现象叠加，导致群众\"大病出县、小病也出县\"，医保基金外流、基层就诊率偏低。2019 年国家卫健委启动紧密型县域医共体建设试点，先后确定山西、浙江、新疆 3 个试点省份及其他省份共 828 个试点县 [SD12]。改革的政策定位是\"对县域医疗卫生体系的系统重塑\"：从单个机构发展转向县域内所有成员单位协同联动，实现\"县级强、乡级活、村级稳、上下联、信息通\"。\n\n### 核心机制\n\n**国家政策框架。** 2023 年 12 月，国家卫健委等 10 部门印发《关于全面推进紧密型县域医疗卫生共同体建设的指导意见》（国卫基层发〔2023〕41 号），明确三个时间节点：2024 年 6 月底前以省为单位全面推开；2025 年底力争 90% 以上县基本建成布局合理、人财物统一管理、权责清晰的医共体；2027 年底基本实现全覆盖 [SD10]。机制要点包括：①县级党委领导、政府主导的推进机制；②以二级及以上非营利性综合/中医医院牵头组建，成员单位法人资格原则上保持不变；③逐步实现行政、人事、财务、业务、用药、信息、后勤\"七统一\"管理；④每个乡镇卫生院至少有 1 名牵头医院主治医师以上人员常年服务；⑤城市三级医院对每个医共体至少派驻 3 名以上专家常年驻守。2024 年 11 月，国家卫健委等四部门印发监测指标体系（2024 版），供县级自评、省市监测、国家动态监测，突出基层诊疗量占比与基层服务能力的结果导向 [SD14]。医保端按\"总额付费、加强监督考核、结余留用、合理超支分担\"落实，对基层实行差别化报销（2022 年基层医疗机构政策范围内平均住院报销比例比二三级医院分别高约 10% 和 17%）[SD12]。\n\n**河南推进情况。** 河南是县域医共体推进较快的省份：据新华网 2021 年报道，全省 103 个县（市）共组建 190 个医共体，覆盖 365 个县级公立医疗机构、1755 个乡镇卫生院；102 个县（市）成立医共体管理委员会，89 个由县委书记兼任主任；33 个县（市）对医共体实行医保基金总额付费并建立结余留用、合理超支分担机制；配套\"13710\"工作制度（当天部署、3 天反馈、7 天落实、1 月内解决复杂问题、销号清零）督办推进 [SD11]。同期通报的能力结果：19 所县级综合医院达到三级医院水平，61% 的乡镇卫生院达到国家基本标准，225 所达到推荐标准 [SD11]。2025 年 4 月，省政府办公厅印发《河南省推进紧密型县域医疗卫生共同体高质量发展若干措施》（豫政办〔2025〕23 号），进一步要求健全医共体党委领导下的总院长负责制、支持有条件地方取消县域内公立医疗机构行政级别、2025 年底前全面落实\"七统一\"一体化管理，并强调严防弱化基层功能、\"虹吸\"基层资源、滞留挪用基层医保基金等不良倾向 [SD13]。医保配套上，河南对医共体实行总额付费，安阳市按县乡村 5:3:2 分配结余资金；2023 年起遴选基层病种开展\"同病同付\"，一级/二级/三级医院按同一标准付费，2025 年信阳市一级医院 DIP 基层病种诊治占比达 67.7% [SD15]。\n\n### 实施证据（官方通报与独立研究分列）\n\n- **官方通报数据**：上述河南 2021 年覆盖情况与能力提升数据 [SD11]、2026 年国家医保局刊文列举的河南医保支持基层做法与个案 [SD15]、2024/2025 年河南 102 家县级医院达到推荐标准、119 家乡镇卫生院达到二级医院能力水平等 [SD16]，均属政府部门自报进展。\n- **独立研究证据**：同行评审文献中，一项发表于 BMC Health Services Research（2024）的研究用熵权 TOPSIS 与非整数秩和比法对山东省紧密型县域医共体实施情况进行综合评价，指出该模式自 2019 年起全国推行、旨在深度整合县域医疗资源，但国外尚无\"紧密型县域医共体\"对应概念、县域层面研究缺乏 [SD17]。该研究的方法与结论针对山东，不能直接外推河南，但说明：(1) 医共体效果评价已进入量化研究阶段；(2) 各省实施强度与排名差异明显，\"建成\"不等于\"建好\"。总体上，针对河南医共体的独立因果评估（如基于试点安排的双重差分研究）在本专题写作时未检索到可核验的公开成果，相关成效判断暂以官方通报为准，须谨慎引用。\n\n### 政策目标与实际效果的区分\n\n- **目标**（规范性表述）：县域就诊率 90% 以上、基层就诊率 65% 左右（河南目标）[SD11]；2027 年全国基本全覆盖 [SD10]。\n- **官方通报进展**：医共体组织架构基本建成、\"七统一\"管理推进、部分能力指标改善 [SD11][SD13][SD16]。\n- **尚不明确的部分**：基层诊疗量占比、县域外流率等结果指标的趋势性变化缺乏可核验的独立数据；\"人财物统一管理\"与法人资格保留之间的张力如何解决，各地做法不一 [SD10][SD13]。\n\n### 局限与争议\n\n- **内部治理**：成员单位法人资格保留与\"一家人\"一体化管理并存，总院长负责制下牵头医院与卫生院的利益分配（如结余留用资金分成）易生矛盾；河南文件明确要求考核向资源下沉、巡诊派驻倾斜，正是对\"重县级、轻乡村\"倾向的纠偏 [SD10][SD13]。\n- **激励机制**：总额付费＋结余留用把激励从\"挣治病的钱\"转向\"挣健康的钱\"（安阳牵头医院负责人语，官方刊文）[SD15]，但也可能诱发推诿高成本患者、服务不足（under-provision）风险，需靠监督考核对冲 [SD12]。\n- **能力提升实效**：派驻专家帮扶周期至少半年 [SD13]，短期轮换能否形成本土人才梯队存疑；\"同病同付\"等支付创新的效果数据目前以医保部门自报为主 [SD15]。\n- **\"虹吸\"风险**：文件特别警示医共体\"虹吸\"基层资源、滞留挪用基层资金的可能 [SD13]，说明改革自身存在逆向激励，需以监测指标体系持续盯防 [SD14]。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：医共体改革是\"跨部门协同（卫健、医保、编办、财政）＋资源整合＋支付杠杆\"的综合案例，可用 [A05 跨部门协同] 与 [A04 政策工具] 框架拆解；\"13710\"督办机制是河南本土的执行保障工具，可直接引用 [SD11]。\n- **对策题**：问\"如何提升基层医疗服务能力\"，可答\"管理一体化（七统一）＋医保支付激励（总额付费、结余留用、同病同付）＋人才下沉（派驻帮扶、计入职称晋升）\"三层对策。\n- **面试综合分析**：给\"县医院人满为患、卫生院门可罗雀\"现象，用\"资源整合＋利益共同体＋防虹吸\"逻辑归因作答；注意区分政策目标与已证实的成效，体现证据意识（参见 [A06 公共政策评估与因果分析]）。\n\n**原创练习（思考题）**\n1. 医共体\"总额付费、结余留用\"与单机构按项目付费的激励差异何在？可能产生哪些新的执行偏差？\n2. 成员单位法人资格保留与\"七统一\"管理之间存在何种张力？豫政办〔2025〕23 号试图如何化解？\n3. 若要科学评估河南医共体对基层就诊率的影响，应如何设计因果识别策略（提示：试点县与非试点县、改革时点）？\n\n### 来源说明\n\n本专题来源均经 2026-10-18 逐条抓取核实：国家文件为原文页（中国政府网/国家卫健委），河南省级文件取河南省政协网站转载的省政府办公厅原文全文（www.hnzx.gov.cn 镜像，原发为河南省人民政府办公厅），医保成效为国家医保局官网刊文，学术证据为 BMC Health Services Research 同行评审论文（PubMed Central 全文）。未检索到针对河南医共体的独立因果评估研究，相关空白已在正文如实注明，不作推断。\n\n## 来源与证据\n\n- [SD10] 《关于全面推进紧密型县域医疗卫生共同体建设的指导意见》（国卫基层发〔2023〕41 号），国家卫健委等 10 部门，2023-12，中国政府网。[官方]\n- [SD11] 《河南：\"13710\"建设紧密型医共体》，新华网，2021-11-17。[官方]\n- [SD12] 《让百姓在\"家门口\"获得更好医疗服务——聚焦紧密型县域医共体建设》，新华社（中国政府网政策解读），2024-01-12。[官方]\n- [SD13] 《河南省人民政府办公厅关于印发河南省推进紧密型县域医疗卫生共同体高质量发展若干措施的通知》（豫政办〔2025〕23 号），2025-04-29 印发、05-27 公开。[官方]\n- [SD14] 《关于印发紧密型县域医疗卫生共同体监测指标体系的通知》（国卫办基层发〔2024〕22 号），国家卫健委等四部门，2024-10-30。[官方]\n- [SD15] 《医保支持基层，河南有实招！》，国家医疗保障局官网，2026-05-24。[官方]\n- [SD16] 《潮涌千帆竞，\"豫见\"健康新图景》，健康报（国家卫健委官网转载），2025-12，河南省卫健委主任黄红霞专访数据。[官方]\n- [SD17] Comprehensive evaluation of the implementation of close-type county medical alliance in Shandong Province using entropy weight TOPSIS method and non-integer rank sum ratio method, BMC Health Services Research, 2024。[研究]\n\n## 关联专题\n\n-：医共体成效评估是政策评估方法的应用场景。\n-：县域医疗资源整合是公共服务供给侧改革的典型样本。\n- [[D05]]：河南政策案例库内的关联专题。\n", "D03-河南基层矛盾纠纷多元化解.md": "\n# D03 河南基层矛盾纠纷多元化解：综治中心规范化、调解联动与网格化治理\n\n## ⚡ 快速知识卡\n\n河南把矛盾纠纷多元化解作为基层高效能治理的关键环节，以\"预防在前、调解优先、法治化解决\"为主线 [SD25][SD20]。核心机制有四：①综治中心规范化建设——\"只进一扇门、最多跑一地\"，统一受理、分类流转、依法办理、闭环管理；②人民调解、行政调解、司法调解联动——司法所建强调解队伍，法院设人民调解工作室开展诉前调解；③网格化管理——网格员排查预警，把矛盾化解在萌芽；④新时代\"枫桥经验\"河南实践，与\"三零\"创建、党建引领基层高效能治理结合 [SD20][SD26]。实际用途：为案例分析题提供\"排查—受理—分流—化解—回访\"完整链条素材，为申论对策题提供\"一站式平台+三调联动+源头预防\"框架。适用题型：选调案例分析、申论对策与材料写作。深入阅读见下方\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n河南是人口过亿的大省，基层矛盾纠纷总量大、类型多，涉及婚恋家庭、邻里、劳资欠薪、征地拆迁、教育培训退费等领域 [SD22][SD23]。传统解纷格局的突出问题是\"多头跑、反复跑\"：政法机关和数十个行业部门都有纠纷化解职能，但各管一段、场所分散，群众搞不清该进哪个门 [SD25]。为此，中央层面逐步部署：2019 年《中国共产党政法工作条例》规定设立省、市、县、乡镇（街道）综治中心；2023 年 10 月中办、国办印发《关于坚持和发展新时代\"枫桥经验\"提升社会矛盾纠纷预防化解能力的意见》，部署强化县、乡两级综治中心的矛盾纠纷多元化解功能；2024 年 12 月《中共中央关于加强新时代政法工作的意见》提出以县级为重点加强综治中心建设，让群众\"最多跑一地\"化解矛盾纠纷 [SD25]。河南省委政法委按照中央政法委部署推动全省综治中心规范化建设，将其作为提升矛盾纠纷预防化解法治化水平的平台窗口 [SD20]。\n\n### 核心机制\n\n1. **综治中心规范化建设（解纷枢纽）**。要求推进场所设置、部门入驻、运行机制、督办落实、信息化建设\"五个规范化\"：统一受理群众诉求后发放受理告知单、\"一案一码\"全程可追溯；以派单模式分类流转导入调解、仲裁、行政裁决、行政复议、诉讼、法律监督的法治化\"路线图\"；综治中心负责程序性推进、办理部门负责实质性解决，并全周期跟踪督办 [SD25]。河南实践如郑州金水区综治中心一楼 24 个窗口提供 37 项业务\"挂号分诊\"、二楼心理疏导区等 15 个功能室\"深度问诊\"；截至 2025 年报道时全省已有 61 个县（市、区）综治中心完成规范化建设，实现\"一站式受理、多部门联动、全链条解决\" [SD20]。\n2. **人民调解、行政调解、司法调解联动（三调联动）**。司法行政系统强化人民调解基础性作用：结合村（社区）\"两委\"换届优化调整人民调解委员会，健全退休法官担任人民调解员机制，常态化排查化解邻里、婚恋、劳资等民生纠纷；同时牵头矛盾纠纷多元化解专项小组，建立跨部门定期会商机制，稳步发展商事调解 [SD23]。司法与调解的衔接上，2019 年 6 月河南省高院、省司法厅联合发文，在全省基层法院诉讼服务中心和具备条件的人民法庭设立人民调解工作室，开展诉前调解，调解成功需司法确认或出具调解书的由诉调对接中心法官直接办理 [SD24]。光山县把人民调解中心调解工作室设进县交警大队，交通事故责任认定在一楼完成、当事人上楼即进入调解，并配值班律师驻点 [SD21]。\n3. **网格化管理与源头预防**。新乡市按\"区域合理、便民利民\"划分 1.5 万个基础网格，建立县、乡、村、组（片）四级网格化体系，网格员日常巡访发现培训机构经营困难引发退费风险后逐级上报，多部门联动处置，并推动全市 116 家培训机构录入资金监管平台，实现\"预警跑在纠纷前\" [SD22]。郑州以地方立法（《郑州市高效能社会治理网格化服务管理条例》，2026 年 4 月新闻发布会）将网格化服务管理纳入法治化轨道，构建\"一格管全面\"\"一键全处理\"的\"发现—上报—分派—处置—反馈—评价\"闭环 [SD26][SD27]。\n4. **新时代\"枫桥经验\"河南实践**。以\"发动和依靠群众、矛盾不上交、就地解决\"为核心，河南将其与\"三零\"创建（零上访、零事故、零案件）、党建引领基层高效能治理、省委\"五基四化\"部署结合推进 [SD20][SD26]。\n\n### 有出处的地方实践\n\n- **郑州市金水区**：综治中心\"全科医院\"式分区受理与服务承诺，是省级报道列举的规范化样板 [SD20]。\n- **信阳光山县**：2025 年 7 月综治中心升级运行，建立\"人员管理、诉求受理、矛盾化解、督导落实\"四项机制，平台派单分类流转、\"码上反映\"线上调解；驻交警大队调解工作室累计调处道路交通事故纠纷 1000 余起、促成赔偿金额超 1200 万元（县司法局介绍）；劳动仲裁院入驻后与劳动监察、信访构建\"三位一体\"维权格局，推行\"仲裁+监察\"联合调解；弦山街道七星湖社区形成\"网格排查+源头预防+就地化解\"闭环，当年摸排 24 起纠纷全部化解（社区干部介绍）[SD21]。\n- **新乡市**：三级社会治理综合服务机构 + 四级网格 + 11 个工作专班、21 个部门风险联席研判联动处置，突出\"预防抓在前\" [SD22]。\n\n### 实施证据与数据（均注明官方出处）\n\n- 2024 年全省各地依托综治中心化解矛盾纠纷 75.25 万件，化解率 98.6%（河南日报报道，省委政法委口径）[SD20]。\n- 2026 年上半年河南司法行政系统累计化解各类矛盾纠纷 30.21 万件（司法部微信公众号发布）[SD23]。\n- 2020 年全省法院诉前调解分流案件 43 万件、调解成功 20.1 万件（成功率 46.7%）；139 家中、基层法院设 248 个人民调解工作室、入驻人民调解员 1576 人；全省民事一审案件同比下降 11.49%（省高院副院长宋海萍介绍，媒体转述）[SD24]。\n\n### 政策目标与实际效果：需要区分的地方\n\n上述数字均为官方口径的\"化解件数/化解率\"，反映的是平台运行量与部门自报成效，属于**政策目标与官方通报进展**；其与群众获得感的实际关系，目前缺乏可核验的第三方评估或独立研究数据。几点保留：①\"化解率 98.6%\"的统计口径（含哪些方式、是否含信访分流）未在公开报道中说明 [存疑]；②诉前调解成功 46.7% 意味着仍有约半数分流案件进入诉讼程序，\"多元化解\"并不等于诉讼量整体下降的长期趋势已被证实（2020 年民事一审下降 11.49% 是单年数据）[SD24]；③网格预警、平台派单等机制的成效多为典型案例报道，缺乏跨地区系统比较。答题时应表述为\"官方通报/机制设计\"，不要当作独立评估结论。\n\n### 局限与争议\n\n- **部门协同的形式化风险**：多部门\"入驻\"\"联动\"若缺乏督办刚性，可能退化为挂牌了事；中央层面正是因此把\"督办落实规范化\"单列为五项规范化之一，侧面反映该问题的普遍性 [SD25]。\n- **地区差异**：规范化建设强调\"因地制宜、实事求是，充分考虑东中西部地区发展差异\" [SD25]；河南县域财力、编制差异大，欠发达县综治中心实体化运行质量难以假定与郑州等同 [存疑]。\n- **调解优先的边界**：调解适合多数民间纠纷，但当事人诉权保障、调解协议效力与\"以调压诉\"的争议在学理上长期存在；河南公开材料未系统讨论此问题 [存疑]。\n\n### 与考试能力的关联（案例分析、申论素材）\n\n- **案例分析**：给定\"群众多头跑、矛盾升级\"情境，可按本专题链条作答——网格排查预警（源头上）→ 综治中心一站式受理（渠道上）→ 分类流转、三调联动（手段上）→ 督办回访闭环（机制上）→ 法治化路线图（底线），每一步都有河南实例可引 [SD20][SD21][SD22]。\n- **申论对策**：\"整合资源建平台、下沉力量进网格、部门联动强调解、数据赋能促闭环\"四个分论点分别对应 SD20–SD27 的证据。\n- **面试/政治理论**：准确复述\"坚持和发展新时代'枫桥经验'\"\"矛盾纠纷一站式、多元化解决机制\"\"完善网格化管理、精细化服务、信息化支撑的基层治理平台\"等规范表述 [SD25][SD26]。\n\n### 原创练习（思考题）\n\n1. 结合光山县案例，分析\"综治中心程序性推进 + 办理部门实质性解决\"的分工如何解决\"多头跑\"问题？其前提条件是什么？[SD21][SD25]\n2. 某县计划用一年实现\"万人成讼率下降\"，请运用本专题材料说明该指标受哪些因素干扰，官方数据之外还需补充哪些证据？\n3. 对比新乡网格预警与金水区窗口受理两种入口，说明\"源头预防\"与\"集中化解\"在矛盾化解链条中的不同功能。\n\n### 来源说明\n\n本专题 9 条来源中，SD20–SD23、SD26、SD27 为官方媒体或政府网站原文页（全文已抓取核实），SD24 为都市报对省高院数据的转述，SD25 为转载理论文章，SD28 为省级政法系统专栏聚合页（未逐条抓取）。所有数据均标注原始出处与口径性质；无独立第三方评估数据，相关判断已标 [存疑]。\n\n## 来源与证据\n\n- [SD20] 《河南省以综治中心规范化促基层治理高效能 进一扇门 解千千结》，河南日报（省委宣传部党建网转载），2025-05-30。[官方]\n- [SD21] 《【综治中心规范化建设】河南省信阳市光山县：让为民解忧之光照耀每个角落》，中国长安网（来源：中原盾、河南法治报），2025-12-17。[官方]\n- [SD22] 《一站式调处，为群众高效解纠纷》（新乡市调研），人民网河南频道，2024-05-21。[官方]\n- [SD23] 《河南司法行政系统充分发挥职能作用赋能平安河南建设》，司法部微信公众号（智慧普法平台），2026-07-14。[官方]\n- [SD24] 《让老百姓有地方\"找个说法\"，河南去年诉前调解分流案件43万件》，河南商报（转述省高院数据），约2021。[综合]\n- [SD25] 《全面推进综治中心规范化建设 不断夯实更高水平平安中国建设根基》，理论文章（江苏警官学院宣传部转载），2025-09-15。[官方]\n- [SD26] 《党建引领网格化高效能治理》，中国共产党新闻网·党建，2025-12-29。[官方]\n- [SD27] 《〈郑州市高效能社会治理网格化服务管理条例〉新闻发布会》，郑州市人民政府门户网站，2026-04-13。[官方]\n- [SD28] 河南长安网\"综治中心规范化建设\"专栏，河南省委政法委主管。[官方]\n\n## 关联专题\n\n-：本专题的\"排查—受理—分流—化解—回访\"链条可直接作为案例诊断框架。\n-：新时代\"枫桥经验\"与三治融合的理论框架，是本专题案例的理论底座。\n-：公共服务与治理资源下沉视角的补充。\n", "D04-浙江千万工程实践.md": "\n# D04 浙江\"千万工程\"实践：二十年持续迭代与政策经验的复制推广\n\n## ⚡ 快速知识卡\n\n\"千万工程\"（千村示范、万村整治）是习近平同志 2003 年 6 月在浙江工作时亲自谋划推动的重大决策：从全省近 4 万个村庄中选择约 1 万个行政村全面整治、把其中约 1000 个中心村建成全面小康示范村，从农村人居环境整治入手，由点及面、迭代升级 [SD32][SD37]。二十年演进分三阶段：2003–2010\"千村示范、万村整治\"示范引领，2011–2020\"千村精品、万村美丽\"深化提升，2021 年起\"千村未来、万村共富\"迭代升级 [SD31]。核心支撑是\"一把手亲自抓、层层抓落实\"的领导体制与\"一张蓝图绘到底、一任接着一任干\"的延续机制 [SD33][SD34]。2024 年中央一号文件以学习运用\"千万工程\"经验为主题 [SD30]。适用于乡村振兴、政策延续性、复制推广条件类题目。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n21 世纪初的浙江，民营经济高速增长的同时城乡差距、农村环境问题突出，民间有\"走过一村又一村，村村都是垃圾村\"之说。刚到浙江工作的习近平同志用 118 天跑遍 11 个市，在深入调研基础上于 2003 年 6 月启动\"千万工程\"，提出从全省近 4 万个村庄中选择约 1 万个行政村进行全面整治、把其中约 1000 个中心村建成全面小康示范村 [SD31][SD32][SD34]。工程的定位是\"生态工程\"\"龙头工程\"\"基础性工程\"：以农村人居环境整治为切入点，牵住城乡一体化建设的\"牛鼻子\" [SD34]。这一问题定义的关键在于\"由表及里\"——从脏乱差整治起步，逐步扩展到产业、治理、公共服务，而非一开始就铺开全部目标。\n\n### 核心机制\n\n**① 党政\"一把手\"负责与部门协同。** 习近平同志亲自出席 2003 年启动会和连续 3 年的现场会并发表重要讲话；浙江形成\"一把手亲自抓、分管领导直接抓、一级抓一级、层层抓落实\"的领导体制和\"领导挂帅、部门协同、分级负责\"的工作格局，每年召开现场推进会 [SD33][SD34]。\n\n**② 农民主体与共建共享。** 中央财办、中央农办在总结经验时强调，把群众满意度作为工作成效的最高评判标准，尊重农民意愿和主体地位，厘清\"政府干\"和\"农民干\"的边界 [SD33]。\n\n**③ 阶段演进与迭代升级。** 二十年分三步走：2003–2010 年\"千村示范、万村整治\"示范引领，综合整治村庄环境；2011–2020 年\"千村精品、万村美丽\"深化提升，推动美丽宜居；2021 年起\"千村未来、万村共富\"迭代升级，强化数字赋能 [SD31][SD37]。每一阶段目标递进但主线不变——这是长期政策执行中\"循序渐进、久久为功\"的典型设计 [SD30]。\n\n**④ 规划先行与多元投入。** 浙江坚持城乡一体化规划引导，推进\"三革命\"（垃圾、污水、厕所）与城乡基础设施互联互通；同时以\"两进两回\"（科技、资金进乡村，青年、乡贤回农村）、\"三变\"改革（资源变资产、资金变股金、农民变股东）引导多元投入，全省累计建成 82 条产值超 10 亿元的农业全产业链 [SD34]。\n\n### 长期政策执行的支撑条件\n\n长期政策最怕\"换届就变\"。千万工程二十余年不辍，靠的是三个支撑：一是**一张蓝图绘到底、一任接着一任干**的政治承诺与考核延续，浙江历届省委、省政府按同一战略擘画持续深化 [SD32][SD34]；二是**规划先行**，先编规划再干建设，避免\"一任领导一个思路\" [SD34]；三是**以现场会等制度化载体反复校准**，把每年推进情况摆到面上比拼 [SD33][SD34]。这与 [A02 政策执行与执行偏差] 中\"执行是再决策过程\"的判断相印证：二十年间执行内涵多次再定义（整治→美丽→未来共富），但顶层目标从未漂移。\n\n### 实施证据（官方统计，均为政府或官方媒体自报口径）\n\n- **收入与城乡差距**：2022 年浙江城乡居民人均可支配收入分别为 71268 元、37565 元，城乡收入倍差由 2003 年的 2.43 缩小到 2022 年的 1.90；浙江农村居民人均可支配收入连续 38 年居全国省区第一 [SD31][SD34]。\n- **人居环境**：规划保留村生活污水治理覆盖率 100%，农村卫生厕所全覆盖，农村生活垃圾基本实现\"零增长\"\"零填埋\"，全省 90% 以上村庄建成新时代美丽乡村 [SD34]。\n- **乡村经济与治理**：2022 年全省村级集体总资产 8800 亿元（约占全国 1/10），集体经济年经营性收入 50 万元以上的行政村占比 51.2%；县级以上民主法治村占比 90% 以上 [SD34]。2018 年 9 月获联合国\"地球卫士奖\" [SD34]。\n- **全国推开**：2023 年 10 月全国学习运用\"千万工程\"经验现场推进会在杭州召开 [SD36]；2024 年中央一号文件以\"学习运用'千万工程'经验……推进乡村全面振兴\"为题 [SD30]；农业农村部 2024 年全国乡村建设工作推进会明确以学习运用\"千万工程\"经验为引领推进宜居宜业和美乡村建设，并要求\"自下而上、农民参与\"的实施机制 [SD35]；2025 年底中央农村工作会议继续把\"千万工程\"经验作为乡村全面振兴的总抓手性提法 [SD37]。\n\n### 政策目标与实际效果的区分\n\n- **目标**（规范性表述）：改善农村生产生活条件、推进城乡一体化、建设宜居宜业和美乡村 [SD30][SD32]。\n- **官方通报成效**：上述收入、环境、集体经济数据 [SD31][SD34]。\n- **尚需区分的部分**：这些数据证明浙江乡村整体进步，但\"千万工程\"对各项指标的独立贡献未做因果剥离——浙江本就处于全国发展前列，收入倍差缩小有多重原因；联合国奖项与\"最受农民欢迎的实事\"属官方叙事口径 [SD33][SD34]。引用时应表述为\"官方通报的成效数据\"，不宜写成\"经评估证明的因果效应\"。\n- **复制推广条件的讨论**：官方文件本身划出了条件边界——《关于有力有序有效推广浙江\"千万工程\"经验的指导意见》提出\"三不\"底线：**不超越发展阶段**（把握好整治力度、建设深度、推进速度与财力承受度、农民接受度的关系），**不搞形象工程**，**不搞强迫命令**，并要求区分发达地区和欠发达地区、结合地方财政承受能力推进 [SD33]。这实际上承认了推广受财政能力与发展阶段约束。[存疑] 学界对复制推广的实证讨论（如各地财政差异下推广效果的量化评估）本次未检索到可核验的公开研究成果，本知识库不作具体引用；答题时可稳妥使用官方\"三不\"表述。2023 年中央一号文件关于农村人居环境整治提升的部署（厕所革命、污水垃圾治理）即为学习运用该经验的全国化安排 [SD38]。\n\n### 可迁移经验与不可迁移部分\n\n**可迁移**：①问题导向的小切口启动（从环境整治切入）；②\"一把手\"负责＋部门协同＋分级落实的领导体制；③一张蓝图绘到底、分阶段迭代的规划方法；④农民主体、群众满意度评判的标准设定；⑤试点示范、由点及面的推广路径 [SD31][SD32][SD33]。\n\n**不可简单照搬**：①浙江的财政能力、民营经济基础与城乡差距水平全国领先，资金投入强度不可比；②\"千万工程\"启动于习近平总书记亲自谋划的特殊政治势能，各地难以复制同等力度的一把手持续推动，需转化为制度化机制而非个人依赖；③浙江先发地经历了二十年的经济积累，后发地区不能跳过发展阶段追求\"未来乡村\"形态——这正是官方\"不超越发展阶段\"底线所警示的 [SD33][SD34]。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：材料常给\"某地学千万工程搞大拆大建、负债造景\"，可用 [A02] 的执行偏差框架归因：违反\"因地制宜、分类施策\"与\"不超越发展阶段\"底线 [SD33]，对策答\"规划先行、量力而行、农民主体\"。\n- **申论/面试**：\"千万工程\"是乡村振兴类题目的最高频案例库，记住\"三个阶段名称＋三个机制（一把手抓、农民主体、久久为功）＋一组数据（城乡倍差 2.43→1.90）\"即可支撑作答 [SD31][SD33]。\n- **对比题**：可与 [D02 河南紧密型县域医共体] 对比——两者同为\"由点及面、迭代升级\"的长期工程，但医共体靠医保支付杠杆驱动，千万工程靠党政考核与财政投入驱动，政策工具差异明显。\n\n**原创练习（思考题）**\n1. \"千万工程\"二十年三阶段的目标话语（示范引领→深化提升→迭代升级）体现了长期政策执行中的什么机制？若换成每届政府另立目标会有什么后果？\n2. 中央推广指导意见为何要划\"三不\"底线？结合财政能力与发展阶段差异，说明\"经验\"与\"样板\"的区别。\n3. 若你所在县财政紧张但被要求学习\"千万工程\"，你会如何设计本地的\"小切口、可持续\"方案？\n\n### 来源说明\n\n本专题 9 条来源均于 2026-10-18 逐条抓取核实全文：中央文件取中国政府网原文页，权威报道取新华网/共产党员网原文页（共产党员网转载新华社与中共浙江省委署名文章）。所有数据均为官方或官方媒体自报口径，正文已注明；学界实证研究空白如实标注 [存疑]，未作推断。\n\n## 来源与证据\n\n- [SD30] 《中共中央 国务院关于学习运用\"千村示范、万村整治\"工程经验有力有效推进乡村全面振兴的意见》（2024 年中央一号文件），2024-02-03，中国政府网。[官方]\n- [SD31] 《造就万千美丽乡村 造福万千农民群众——\"千万工程\"二十年启示录》，新华社，2023-06-25。[官方]\n- [SD32] 《学习浙江\"千万工程\"经验案例》，共产党员网（《同学》工作室），2023-06-20。[官方]\n- [SD33] 《造就万千美丽乡村 造福万千农民群众——中央财办、中央农办负责人就〈关于有力有序有效推广浙江\"千万工程\"经验的指导意见〉答记者问》，新华社（共产党员网转载），2023-07-05。[官方]\n- [SD34] 中共浙江省委：《在深入践行\"千万工程\"上走前列作示范》，共产党员网转载，2023-06-16。[官方]\n- [SD35] 《农业农村部召开全国乡村建设工作推进会强调 以学习运用\"千万工程\"经验为引领 扎实有力推进宜居宜业和美乡村建设》，农业农村部网站（中国政府网），2024-11-07。[官方]\n- [SD36] 《刘国中强调：学习运用\"千万工程\"经验 扎实稳步全面推进乡村振兴》，新华社（中国政府网），2023-10-13。[官方]\n- [SD37] 《中央农村工作会议关键提法之三：\"千万工程\"经验》，新华网，2026-01-04。[官方]\n- [SD38] 《中共中央 国务院关于做好 2023 年全面推进乡村振兴重点工作的意见》（2023 年中央一号文件），2023-02-13，中国政府网。[官方]\n\n## 关联专题\n\n-：千万工程是\"长期执行不走样\"的正面对照案例，其阶段化执行即\"执行是再决策过程\"的体现。\n-：工程后半程的\"善治乡村\"\"三治融合\"是基层治理的乡村场景。\n- [[D02]]：同为多阶段长期工程，政策工具与驱动机制可对比。\n", "D05-城市社区嵌入式公共服务.md": "\n# D05 城市社区嵌入式公共服务：设施建设工程、运营模式与可持续性\n\n## ⚡ 快速知识卡\n\n城市社区嵌入式服务设施，指利用社区（小区）公共空间、房屋和场地，面向居民提供养老托育、社区助餐、家政便民、健康服务、体育健身、文化休闲、儿童游憩等一种或多种服务的设施，特点是小型灵活、公益普惠、集成便捷 [SD40]。政策主线：2023年11月国办转发发改委《城市社区嵌入式服务设施建设工程实施方案》（国办函〔2023〕121号），规划\"50个左右试点城市×每市100个左右社区\"，到2027年向更多城市推开 [SD40]；2024年9月三部门将56个城市纳入建设范围 [SD42]。核心机制：\"补改一批、转型一批、划转一批、配建一批\"盘活存量空间 + 公建民营、民办公助等普惠化运营 [SD40]。适用于申论\"社区服务/一老一小/民生实事\"类对策题与面试综合分析题。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 一、背景与问题定义\n\n中国有65%以上的人口生活在城市，居民主要生活在社区，能否在\"家门口\"享受优质普惠公共服务，被国家发改委社会发展司司长刘明称为\"既是'关键小事'，更是'民生大事'\" [SD43]。问题压力主要来自三方面：\n\n1. **老龄化加速**。截至2023年末，全国60周岁及以上老年人口29697万人、占总人口21.1%，65岁及以上21676万人、占15.4%，65岁及以上老年人口抚养比22.5% [SD45]；我国已进入中度老龄化社会。约九成老年人居家养老，助餐、助浴、日间照料等居家社区服务需求集中爆发。\n2. **托育缺口**。\"十四五\"规划《纲要》将\"每千人口拥有3岁以下婴幼儿托位数\"设为主要指标之一；超过三成的婴幼儿家庭存在强烈入托需求，就近托育供给不足 [SD46 附注：该需求判断出自发改委刊文转述]。2025年全国千人口托位数达4.73个、托位666万个，供给仍处于补缺口阶段 [SD46]。\n3. **社区服务设施不足**。老旧小区普遍缺乏养老、托育、助餐空间；官方明确要求落实\"每百户居民拥有社区综合服务设施面积平均不少于30平方米，有条件的城市不少于80平方米\"，并强调\"避免以行政办公功能替代为民服务功能\" [SD40]——说明此前社区空间被行政占用、服务功能缺位是普遍痛点。\n\n### 二、核心机制：政策框架与设施布局运营\n\n**（1）顶层政策框架。** 2023年11月19日，国务院办公厅转发国家发改委《城市社区嵌入式服务设施建设工程实施方案》（国办函〔2023〕121号）[SD40]；2024年1月，发改委、住建部、自然资源部印发《城市社区嵌入式服务设施建设导则（试行）》（发改社会〔2024〕5号）作为技术规范 [SD41]；2024年9月，三部门印发《关于扎实推进城市社区嵌入式服务设施建设工程的通知》，将江苏省苏州市等56个城市纳入工程建设范围，要求聚焦\"一老一小\" [SD42]。配套层面，民政部等11部门2023年10月印发《积极发展老年助餐服务行动方案》（民发〔2023〕58号），将老年助餐设施纳入一刻钟居家养老服务圈、便民生活圈建设 [SD44]。\n\n**（2）试点布局。** 实施方案要求优先在城区常住人口超过100万人的大城市推进，选择50个左右城市试点、每个试点城市选择100个左右社区先行试点；到2027年总结经验后向更多城市稳妥推开 [SD40]。试点城市原则上应为城区常住人口超百万的大城市，以党委政府重视、建设运营方案可行等为遴选条件；先行试点社区由城市自主确定，优先选\"一老一小\"需求集中、具备持续运营条件的社区 [SD43]。2024年9月公布的56城名单为工程实际建设范围（完整名单未在公开报道中逐项列出，本文不作转述）[SD42]。\n\n**（3）空间从哪来：\"四个一批\"。** 按\"补改一批、转型一批、划转一批、配建一批\"原则开展场地空间拓展攻坚：拆除腾退老旧小区空间、整合社区用房、产权置换、征收改建补建设施；引导产权人将闲置房屋转型为服务设施；经国有资产管理程序将国有房产划转社区使用；新建社区严格落实\"同步规划、同步建设、同步验收、同步交付\"配建 [SD40]。用好城市\"金角银边\"，盘活闲置厂房、仓库、商业设施等存量资源 [SD40]。用地支持包括：政府建设的设施作为非营利性公共服务设施5年内不变更土地用途；存量建筑改造享受5年内不改变用地主体和规划条件 [SD40]。\n\n**（4）运营模式：普惠化而非免费化。** 官方定调是\"精准化服务、普惠化运营\"：通过市场化择优、委托经营向运营主体提供低成本场地，运营主体按服务成本加合理利润提供价格普惠服务及其他公益性服务；探索专业机构连锁化、托管式运营，构建\"街道—社区—小区\"服务体系；鼓励事业单位、社会组织、志愿团队、社区物业、家政公司多元参与 [SD40]。发改委负责人明确提出要避免\"建设轰轰烈烈，服务冷冷清清\"，用市场竞争机制实现服务进退，\"根据老百姓满意度决定谁来服务\" [SD43]。资金上统筹中央预算内投资（含积极应对人口老龄化工程和托育建设专项）、地方财政、地方政府专项债券等多渠道 [SD40]。\n\n**（5）供需匹配机制。** 服务项目选择坚持需求导向：试点前开展城市体检，把小区、社区列为体检单元，查找养老服务、婴幼儿照护、公共活动场地等设施短板，建立问题台账，再\"按需精准嵌入\"，避免\"一刀切\" [SD40][SD43]。优先保障婴幼儿托位和护理型养老床位的必要空间 [SD40]。\n\n### 三、实施证据（官方通报与地方实践）\n\n- **国家层面**：2024年9月56城纳入建设范围 [SD42]；托育方面，2025年全国千人口托位数4.73个，新增普惠托位89万个，托育机构12.6万家、托位666万个，\"十四五\"以来托位增幅132% [SD46]。\n- **河南郑州**：2025年郑州市政府工作报告载明，郑州\"入选全国首批城市社区嵌入式服务设施建设工程建设范围\"，城市\"15分钟养老生活圈\"基本建成，运营老年助餐场所645家、累计服务200万人次，普惠托育每千人托位达4.8个 [SD47]。这是河南城市进入该工程首批建设范围的直接官方证据（56城完整名单未逐项公开转述，以政府工作报告表述为准）。\n- **河南老年助餐（嵌入式服务的重要场景）**：2024年老年助餐列入河南省十项重点民生实事，年度目标是建成7300个以上老年助餐场所、覆盖40%的城镇社区和10%的行政村；截至2024年9月已布局6818个、下达补助资金2.24亿元（省级补助额70%以上）[SD48]。各地探索了济源\"供销社+老年助餐\"、安阳\"中央厨房+移动餐车\"、濮阳\"物业+助餐\"、信阳\"幸福大巴\"、鹤壁\"养老机构+食堂\"\"餐饮企业+食堂\"等模式 [SD48]。2025年12月，河南省人大常委会通过《河南省发展老年助餐服务规定》（19条\"小快灵\"立法，2026年1月1日施行），以地方立法固化助餐服务的场所布局、多元运营和补贴机制；截至2024年底河南60岁及以上人口已达2038万人，全省建成老年助餐服务设施8367个（城市3592个、农村4775个）[SD49]。\n\n### 四、政策目标与实际效果：须区分的几个层面\n\n- **目标 vs 已实现**：官方目标是2027年总结试点经验后推开 [SD40]；56城名单公布（2024年9月）只是建设范围的确定，尚不等于设施建成、更不等于服务可持续。郑州报告中的助餐、托位数据 [SD47] 属官方自报的地方进展，全国层面的工程整体进度评估未见系统性第三方公开报告——**如实说明：目前缺乏独立的第三方评估数据，效果判断应保留余地**。\n- **运营可持续性是公认难题**：河南日报报道直言老年助餐\"利润率低，服务经营压力大、可持续性不足\"，洛阳涧西区某社区养老服务中心仅\"初步实现微利经营\"，常有顾客担忧\"这么便宜，够本吗\" [SD48]；省人大监督调研也承认\"可持续运营难度较大、服务监管有待加强\" [SD49]。老年助餐依赖\"个人出一点、企业让一点、政府补一点、集体添一点、社会捐一点\"的多元筹资 [SD44]，本质上是财政与社会资源持续输血下的准公共品。\n- **政府自评与真实满意度之间有距离**：各地通报多为设施数量、覆盖率等投入型指标（建成多少个、覆盖多少社区），居民使用率、服务质量和满意度等结果型指标披露较少；答题时引用数据应注明\"官方通报口径\"。\n\n### 五、现实治理难题\n\n1. **资金**：中央预算内投资只能\"引导支持\"，大头靠地方财政与专项债 [SD40]；在地方财政承压背景下，运营补贴能否持续是最大变量（河南2.24亿元补助属省级全力投入，但8367个设施的长期运营费用远大于建设补助）[SD48][SD49]。\n2. **物业空间**：老旧小区空间稀缺，\"四个一批\"腾挪空间依赖产权协调、消防安全验收等环节，方案为此给了5年土地用途不变等过渡政策 [SD40]，但落地周期长。\n3. **专业人才**：养老护理、托育从业人员缺口大、待遇低、流失率高；养老服务人才培养近年才加强（2023年全国高校新增护理学、养老服务管理等专业点34个）[SD45]。\n4. **普惠与盈利的平衡**：价格高了居民不来、价格低了机构活不下去；官方解法是\"低成本场地+微利经营+多元业态反哺\"（如允许设置公益便利店、助餐等微利业态），并要求避免把设施做成纯商业或行政空间 [SD40][SD43]。河南做法是按等级和服务人次精准补贴（洛阳对A级至5A级机构分别给予年1万—5万元运营补贴，并按服务人次给激励）[SD48]。\n\n### 六、与考试能力的关联\n\n- **申论对策题**：社区\"一老一小\"服务、民生实事类题目可直接套用\"空间从哪来（四个一批/存量盘活）—钱从哪来（中央预算内投资+专项债+多元筹资）—谁来运营（公建民营、市场化择优、连锁化托管）—如何可持续（微利经营+业态反哺+精准补贴）\"四段框架，且每段都有可引用的官方机制表述 [SD40][SD43]。\n- **面试综合分析**：对\"社区食堂关门潮\"\"普惠托育贵\"等现象，可用\"政策目标—运营现实\"的区分框架归因，避免一味颂扬或唱衰；\"金角银边\"\"离家不离社区\"\"最后一米/最后一公里\"等官方表述可作亮点引用 [SD43][SD45]。\n- **数据引用注意**：老年人口、托位等数字均有官方出处 [SD45][SD46]，可放心引用；郑州地方数据引用时注明\"2025年郑州市政府工作报告\" [SD47]。\n\n### 七、原创练习（思考题）\n\n1. 某市社区食堂开业时老人排队，一年后因客流量不足关闭，网络上出现\"惠民工程成摆设\"的质疑。请运用\"目标—效果\"区分框架，分析其可能的运营成因并提出两条可持续对策。（提示：多元筹资机制、业态复合反哺、按人次精准补贴）\n2. 结合河南\"供销社+老年助餐\"\"物业+助餐\"等模式 [SD48]，谈谈嵌入式服务中政府、市场、社会多元主体各自的功能边界与协同机制。\n3. 对比\"新建独立养老机构\"与\"社区嵌入式养老托育设施\"两种供给路径的优劣，说明国家为何选择\"嵌入式\"作为主打方向 [SD40][SD43]。\n\n### 来源说明\n\n本专题优先引用国办、发改委、民政部原文文件与新华社、政府工作报告等官方文本，全部来源经 2026-10-18 实际抓取核验（详见\"来源与证据\"）。56城完整名单未在抓取到的公开报道中逐项列出，故不作转述；工程整体效果缺乏独立第三方评估，相关判断均标注为官方自报口径或存疑事项。\n\n## 来源与证据\n\n- [SD40] 《国务院办公厅关于转发国家发展改革委〈城市社区嵌入式服务设施建设工程实施方案〉的通知》（国办函〔2023〕121号），2023-11-19。[官方]\n- [SD41] 《城市社区嵌入式服务设施建设导则（试行）》印发通知（发改社会〔2024〕5号），国家发展改革委、住房城乡建设部、自然资源部，2024-01-03。[官方]\n- [SD42] 《扎实推进城市社区嵌入式服务设施建设工程》，国家发展改革委网站（政研室），2024-09-27：56个城市纳入建设范围。[官方]\n- [SD43] 《让群众在\"家门口\"享受优质服务——相关部门解读城市社区嵌入式服务设施建设》，新华社（中国政府网转载），2023-11-27。[官方]\n- [SD44] 《民政部等11部门：计划到2025年底老年助餐服务网络形成一定规模》（《积极发展老年助餐服务行动方案》，民发〔2023〕58号），新华社/新华网，2023-10-24。[官方]\n- [SD45] 《2023年度国家老龄事业发展公报》，民政部、全国老龄办，2024-10（中国政府网PDF）。[官方]\n- [SD46] 《2025年全国千人口托位数达到了4.73个》，中宏网（转述国家卫健委新闻发布会），2025-12-26。[综合]\n- [SD47] 《2025年郑州市政府工作报告》，郑州市人民政府（郑州市城乡建设局网站转载），2025-02-13。[官方]\n- [SD48] 《社区食堂：让老人从舌尖暖到心尖》，河南日报（新华网转载），2024-09-26。[综合]\n- [SD49] 《河南省人大常委会以小切口监督\"小快灵\"立法托起老年人幸福\"食\"光》，中国人大网（北京人大网转载），2025-12-11。[官方]\n\n## 关联专题\n\n-：政策工具组合在社区服务中的应用——嵌入式工程是\"供给型工具（设施建设）+环境型工具（用地、税费）+需求型工具（消费补贴）\"组合的典型样本。\n-：公共服务重心下移、公建民营等供给方式改革与本工程互为表里。\n- [[D01]]：同为官方工程类专题，其\"目标—效果区分\"\"自报数据须标注口径\"的处理方式与本专题一致。\n", "D06-河南基层网格化治理与数字赋能.md": "\n# D06 河南基层网格化治理与数字赋能：机制、证据与\"指尖上的形式主义\"风险\n\n## ⚡ 快速知识卡\n\n网格化治理按标准把城乡划分为单元网格、配备网格员，依托统一数字平台形成\"上报—受理—分派—处置—反馈\"的事件流转闭环；河南近年主推\"党建+网格+大数据\"，郑州提出\"十个一\"党建引领网格化高效能治理体系，把综治中心规范化建设作为实体枢纽 [SD51][SD52][SD53]。数字赋能在主动发现问题、闭环处置上有真实作用，但同样存在被考核指标异化的风险——过多政务 App、工作群、打卡留痕催生\"指尖上的形式主义\"，中央已从 2023 年若干意见、2024 年若干规定到 2026 年政务 App 管理办法持续纠治 [SD54][SD55]。实际用途：案例分析、对策题、面试综合分析的河南本土素材。适用条件与局限见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n传统基层治理以\"条线\"为主：部门各管一摊，基层\"看得见的管不着、管得着的看不见\"，问题发现靠群众投诉和运动式排查。网格化管理起源于城市综治与城管实践，国家推荐性标准《城乡社区网格化服务管理规范》（GB/T 34300-2017）将其界定为：依托统一数字化平台，把辖区划分为若干单元网格，每格配备网格员，负责民情收集、事项代办、矛盾劝调等，实现\"同一套网格、同一支队伍、管多种事情\"。其理论意义在于以\"网格\"为最小治理单元重新组合人、地、事、物、组织五要素，是 [A01 基层治理现代化] 中\"精细化治理\"的技术载体。2025 年 5 月习近平总书记在河南考察提出加强社会治理、推动高效能治理后，河南把\"党建+网格+大数据\"作为全省性治理模式推进 [SD52]。\n\n### 核心机制\n\n**网格划分与队伍。** 城市一般以居民小组或住宅小区、农村以自然村为基本单元划分综合网格，人流密集、风险集中的区域另设专属网格；网格内配备专职或兼职网格员，形成\"社区党组织—网格党支部—党员中心户\"的组织架构 [SD51]。\n\n**事件流转闭环。** 以郑州\"十个一\"体系为例：党建网、政务网、视联网、物联网等\"多网融合\"实现\"一屏观全域\"，网格化平台作为城市运行智能中枢，对法定职责清晰的事项实行\"基层（群众）发现—一键上报—智能分派—联动处置—结果反馈—综合评价\"的全过程在线闭环；群众侧通过\"郑好拍\"等渠道接诉即办 [SD51]。政法条线的对应枢纽是综治中心：河南推动县级综治中心规范化建设、群众\"最多跑一地\"，基层形成\"网格排查+源头预防+就地化解\"的闭环机制 [SD53]。事件闭环的关键设计是\"分级响应、协同治理\"——网格解决不了的按事项类型自动上升分派到街道、区、市，避免层层截访式转办。\n\n**数字平台。** 河南的实践特点是以党建为轴整合多个平台：省级层面推动\"党建+网格+大数据\"，市级依托\"城市大脑\"、政务云建设防洪排涝、城市运行等专项感知与调度平台（郑州\"一网统管\"），把网格上报、12345 诉求、物联感知数据汇聚到统一中枢 [SD51][SD52]。\n\n### 实施证据（官方自报与独立评估分列）\n\n- **官方自报**：郑州\"十个一\"体系及闭环流程来自郑州市委书记在《人民日报》的署名文章 [SD51]；河南省委书记在《求是》撰文称\"党建+网格+大数据\"取得明显成效，但同文自陈\"先进技术赋能社会治理有待加强、群众参与积极性调动不够\" [SD52]。光山县七星湖社区个案称年内摸排矛盾纠纷 24 起并全部化解 [SD53]——这是单一社区自报数据，不能外推为全省普遍规律。\n- **独立评估**：针对河南网格化治理的严格独立实证研究（如基于试点差异的因果评估）在写作时未检索到可公开核验的成果；有以郑州为案例的研究指出当前存在党建与网格融合度不足、体制机制待优化、网格员队伍建设薄弱等挑战（相关研究见知网等学术平台，具体评估数据未获权威公开全文，此处仅作方向性提示，不引用具体数字）。因此对本专题成效的判断应以机制描述为主、慎引自报统计。\n\n### 数字赋能的实际效果与\"指尖上的形式主义\"负担风险\n\n数字平台确实改进了问题发现（传感器和网格巡查替代被动等待）与责任追踪（留痕可查）。但同一套技术也极易异化为负担来源：强制下载推广、打卡签到、积分排名、过度留痕、以群代干（\"从群里来、到群里去\"）等。2020 年起中央即开展\"指尖上的形式主义\"专项整治；2023 年 12 月中央网信委印发《关于防治\"指尖上的形式主义\"的若干意见》，2024 年 7 月中央政治局会议再次强调，2024 年 8 月中办国办《整治形式主义为基层减负若干规定》专章规范政务应用程序管理，2026 年国办印发《政务移动互联网应用程序规范化管理办法》，建立备案、抽查、撤销备案与暂停经费的监管闭环 [SD54][SD55]。典型案例显示基层曾\"每天辗转近 30 个工作群、约三分之一工作时间处理群消息\"，整治后精简合并 [SD54]。这说明：数字赋能的净效果取决于配套的准入审查与考核改革，不是\"上了平台\"就自动增效。\n\n### 政策目标与实际结果、适用条件\n\n- **目标**：全域覆盖的网格体系＋一网统管平台＋闭环处置（规范性目标）[SD51][SD52]。\n- **可核验结果**：平台建成与机制运转有公开报道支撑；处置时效、矛盾化解率等结果指标目前以地方自报为主，缺乏独立口径。\n- **适用条件**：网格化＋数字平台更适用于人口密集、事项量大、财政可负担平台建设运维的地区；对财政薄弱、网格员待遇与稳定性差的地区，易出现\"有格无人\"\"有平台无数据\"。闭环有效的前提是\"吹哨\"之后部门真报到——这依赖 [A09 基层权责匹配] 的清单制度兜底，否则网格只是新增一层上报负担。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：给\"网格员沦为填表员\"\"App 打卡泛滥\"类材料，用\"技术工具—考核激励—权责配置\"三层归因（对应 [A02 政策执行与执行偏差]），对策写\"准入备案＋清单定责＋考核改革\"而非\"再建一个平台\"。\n- **对策题**：提升基层治理效能＝党建引领（组织嵌入网格）＋数字赋能（一网统管）＋减负增效（整治指尖形式主义）三位一体。\n- **面试**：辩证分析数字治理，引用中央从\"若干意见\"到\"管理办法\"的制度演进体现政策敏感度 [SD55]。\n\n**原创练习（思考题）**\n1. \"网格发现—一键上报—智能分派—联动处置—反馈评价\"闭环中，最容易出现执行偏差的环节是哪个？为什么？\n2. 数字平台在什么条件下是治理赋能、什么条件下异化为\"指尖上的形式主义\"？试给出判别标准。\n3. 若评估某市网格化治理对矛盾纠纷化解率的影响，官方自报数据有何局限？如何改进评估设计？\n\n### 来源说明\n\n本专题来源均经 2026-10-18 抓取核实。任务给定的起始线索 https://hrss.henan.gov.cn/2025/02-13/3123157.html 抓取失败（http_error），未能核实内容，已在来源登记中如实注明并替换为人民日报、《求是》、中国长安网、中央纪委国家监委网站等可核验来源；河南官方原文页占比达标。未检索到针对河南网格化治理的独立因果评估，正文已如实说明。\n\n## 来源与证据\n\n- [SD50] 河南省人社厅网站文章（起始线索），2025。抓取失败未核实，未引用内容。[存疑]\n- [SD51] 安伟《党建引领网格化高效能治理》，人民日报 2025-12-29（中国共产党新闻网转载）。[官方·自述口径]\n- [SD52] 刘宁《坚定信心推动高质量发展高效能治理》，《求是》2025 年第 16 期。[官方·自述口径]\n- [SD53] 《河南省信阳市光山县：让为民解忧之光照耀每个角落》，中国长安网，2025-12-17。[官方]\n- [SD54] 《卸下\"指尖\"负担 树立实干新风》，中央纪委国家监委网站，2025-11。[官方]\n- [SD55] 国家网信办就《政务移动互联网应用程序规范化管理办法》答记者问，共产党员网，2026-01-29。[官方]\n\n## 关联专题\n\n-：网格化治理中居民、网格员、下沉部门的角色与利益分析。\n-：网格化是精细化治理的机制载体。\n-：河南本土治理案例的作答转化。\n", "D07-河南南阳基层减负与履职事项清单实践.md": "\n# D07 河南南阳基层减负与乡镇（街道）履职事项清单实践\n\n## ⚡ 快速知识卡\n\n基层减负的政策脉络是从\"减少文山会海\"深化到\"厘清权责边界\"：2024 年 2 月起全国 3.8 万个乡镇（街道）编制履职事项清单，2025 年 6 月底全部完成，平均每地 340 项，分基本履职、配合履职、上级部门收回\"三张清单\" [SD61]；2026 年 5 月中办国办再出《具体措施》，把清单定为考核基本依据、严禁\"条条干预\" [SD62]。河南南阳的做法是\"减负＋赋能\"双向发力：下放处罚权的同时建承接机制 [SD60]；郑州完成 193 个乡镇（街道）清单编制并清理工作群、标牌 [SD63]。核心考点是清单制的机制逻辑（以事定责、以责定考核）与局限（清单外变相摊派、减负反弹）。适用题型：案例分析、对策题、面试综合分析。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n乡镇（街道）是国家治理\"神经末梢\"，但长期处于\"权小责大\"状态：上级部门以属地管理名义把任务、考核、问责层层下压，基层\"接不住、管不了、管不好\"，出现\"小马拉大车\"问题。党的二十届三中全会明确提出\"制定乡镇（街道）履行职责事项清单，健全为基层减负长效机制\"；2024 年 8 月中办国办《整治形式主义为基层减负若干规定》把减负从作风建设提升为制度安排。清单制的思路不是简单减数量，而是重划县乡权责：把上级转嫁的事项\"物归原主\"，把基层必须干的\"列细列明\"，把需要配合的\"分清主次\"——这是 [A09 基层权责匹配] 的制度化落地。\n\n### 核心机制：三张清单\n\n按中央编办部署（2024 年 2 月起，试点—先行—全面推开三阶段），由乡镇（街道）自下而上编制三张清单 [SD61]：\n\n1. **基本履职事项清单**：乡镇（街道）职责范围内必须全面承担的事项，覆盖党的建设、经济发展、民生服务、平安法治等主责主业，重点抓\"保民生、保安全、保底线\"（中央明确 53 项兜底事项）。\n2. **配合履职事项清单**：县直部门牵头、乡镇配合的事项，目的在分清县乡主次责任、理顺责任链条——部门必须提供培训、人员、资金、装备等保障。\n3. **上级部门收回事项清单**：把基层接不住、管不了、管不好的事项（如特种设备监管、建设项目环评审批）收回上级部门，中央编办会同有关部门明确 965 项收回事项参考目录。\n\n程序上采取\"三上三下\"听取意见（清单初稿在乡镇、县直部门、县级党委政府间三轮往返征询）、研究论证审定发布。2026 年 5 月《具体措施》补上\"用\"的环节：考核以基本履职清单为基本依据，不得以上级收回事项考核基层；配合事项失职由上级部门承担主责，乡镇已正确履行配合职责的不追责；除党中央国务院及省级统一部署外，上级不得把清单外职责擅自或变相下放；机构编制部门畅通\"12310\"举报 [SD62]。\n\n### 河南/南阳实践\n\n- **南阳**：中央社会工作部网站刊文介绍，南阳聚焦破解\"小马拉大车\"、注重减负赋能双向发力：按\"依法下放、宜放则放\"原则深化乡镇（街道）管理体制机制改革，赋予乡镇 61 项、街道 45 项行政处罚权，同时建权力下放承接机制、加强培训指导，各乡镇（街道）设综合行政执法大队，破解\"看得见的管不着、管得着的看不见\"，并推动资源服务下沉、加强社区工作者队伍建设 [SD60]。注意：该文由南阳市委社会工作部提供内容，属官方自述，未附第三方评估。\n- **郑州**：《人民日报》年终报道，郑州完成全市 193 个乡镇（街道）履职事项清单编制，厘清县乡职责边界；依托\"城市大脑\"实现非接触考核，考核指标精简率 73.89%；西大街街道上级收回 14 类 86 项事项，同步清理 30 多块标牌、30 多个工作群，干部从\"围着材料转\"转向\"围着群众干\" [SD63]。数据均为地方自报口径。\n- 河南省级层面在 2026 年省政府工作报告中确认\"全面建立和执行乡镇（街道）履职事项清单，持续整治形式主义为基层减负\"，表述为全省性制度安排已建立，但报告未公布分市执行数据。\n\n### 政策目标、官方自报与实际结果的区分\n\n- **目标**：2024—2025 年完成全国清单编制（已实现，属程序性目标）[SD61]；实质目标是县乡权责重塑与减负长效化。\n- **官方自报**：清单平均 340 项（基本 117、配合 99、收回 124），配合与收回事项占 65.6%，取消一批无实质意义的信息报送、创建示范、评比考核，解决 60 多项县乡扯皮的\"老大难\"问题 [SD61]——口径为中央编办汇总各地上报，无独立核查。\n- **尚不明确**：减负是否可持续（反弹风险）、基层实际时间分配是否改善、收回事项后上级是否真\"接得住\"，均缺乏独立跟踪评估。南阳文中\"106 项行政处罚权整体运行良好\"亦为自评表述 [SD60]。\n\n### 清单制的机制逻辑与局限\n\n**逻辑**：把\"属地管理\"从无限责任改造为\"按事项定责\"的有限责任；用清单锚定考核与问责，从源头切断\"责任甩锅\"——这与运动式减负（发文件减少文件）的本质区别在于改变的是权责结构而非数量指标 [SD62]。\n\n**局限**：①清单外变相摊派——通过\"创建\"\"试点\"\"属地配合\"等名义规避清单约束，《具体措施》禁止\"条条干预\"恰说明该问题普遍；②清单静态与任务动态的矛盾，故设\"大稳定、小调整\"的动态调整机制；③收回事项的承接能力——上级部门收回后若力量不匹配，可能出现管理空白，文件专门要求做好衔接；④考核惯性——清单能否真正改变考核指标取决于县级党委政府执行，目前缺乏刚性外部监督；⑤配合事项的责任划分在具体事故中仍可能争议（\"配合职责范围内\"的边界认定）。\n\n### 与形式主义治理的关联\n\n清单制是形式主义治理的\"供给侧\"改革：形式主义（过度留痕、多头报表、重复考核）多数源于上级任务超载与责任下移，只整治表现形式而不改权责结构，必然反弹。政策链是：三张清单定责（源头）→《整治形式主义为基层减负若干规定》规范督查考核（过程）→\"12310\"举报与巡视巡察（监督）[SD61][SD62]。备考时注意与 D06\"指尖上的形式主义\"联动：政务 App 治理是清单逻辑在数字空间的延伸。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：材料给\"乡镇干部一年签百余份责任书/迎检台账\"，归因用\"权责错配＋考核异化\"，对策用\"三张清单＋考核绑定＋条条干预禁止\"三步作答。\n- **对策题**：\"如何破解基层小马拉大车\"标准答案结构：明责（清单）→赋能（下放＋承接保障，引南阳 [SD60]）→减负（清理事项与考核改革，引郑州 [SD63]）→问责矫正（主责划分）。\n- **面试**：谈\"减负与担当\"辩证关系——减的是无谓负担，不是减责任；可引《具体措施》\"减负不是减责任\"的制度设计。\n\n**原创练习（思考题）**\n1. 三张清单分别对应怎样的县乡权责再分配？为什么收回事项不得用于考核乡镇？\n2. 清单制为何可能陷入\"边减边增\"循环？哪些制度设计在对抗这一循环？\n3. 南阳\"放权\"与\"减负\"是什么关系？放权不当会带来什么新问题？\n\n### 来源说明\n\n来源均经 2026-10-18 逐条抓取核实：起始线索（中共中央社会工作部网站南阳报道）核实成功；全国性文件与数据取中
