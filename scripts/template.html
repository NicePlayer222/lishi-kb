<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>砺行集 · 2027 河南普选备考库</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#EDEAE4;--side:#E6E1D8;--card:#F7F5F1;--fg:#3A3A38;--muted:#8A8880;
  --acc:#5C7A99;--acc2:#A8736B;--accbg:#E3EAF0;--acc2bg:#F0E6E3;
  /* 扩展色：用于卡片与各区块区分 */
  --c-green:#7C9A82;--c-green-bg:#E8EFE9;
  --c-gold:#B8935A;--c-gold-bg:#F5EDE0;
  --c-plum:#8E6E8E;--c-plum-bg:#EFE8EF;
  --c-teal:#6E9298;--c-teal-bg:#E5EDEE;
  --bd:#D8D2C8;--hov:#E2DCD2;
  --code:#E8E3DA;--shadow:0 1px 2px rgba(90,82,70,.05),0 2px 10px rgba(90,82,70,.06);
  --shadow-lg:0 4px 12px rgba(90,82,70,.08),0 12px 32px rgba(90,82,70,.08);
  --topbar-h:60px;--side-w:260px;--toc-w:212px;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#25272B;--side:#1E2024;--card:#2D3034;--fg:#DDD9D2;--muted:#93908A;
  --acc:#8FA9C4;--acc2:#C49188;--accbg:#313A44;--acc2bg:#3A2E2C;
  --c-green:#8FB096;--c-green-bg:#2B332C;
  --c-gold:#D0AC72;--c-gold-bg:#332D22;
  --c-plum:#B394B3;--c-plum-bg:#302A30;
  --c-teal:#8AAFB5;--c-teal-bg:#283133;
  --bd:#3A3D42;--hov:#34373B;
  --code:#34373B;--shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);line-height:1.8;font-size:16px;-webkit-font-smoothing:antialiased}
body.splash-lock{overflow:hidden}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
svg{display:block}

/* ---------- 欢迎界面 ---------- */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:var(--bg);overflow:hidden;transition:opacity .6s ease,visibility .6s;padding:20px;
  height:100vh;height:100dvh;width:100vw;width:100dvw}
#splash::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 50% 40%,rgba(92,122,153,.07),transparent 62%),
    repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(138,136,128,.045) 39px);}
#splash.hide{opacity:0;visibility:hidden}
.splash-inner{position:relative;text-align:center;padding:0 28px;max-width:600px;width:100%;box-sizing:border-box;
  animation:splashIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes splashIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.splash-seal{width:66px;height:66px;margin:0 auto 26px;border-radius:12px;
  background:linear-gradient(140deg,var(--acc2),#8E5A52);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:34px;font-weight:700;
  box-shadow:0 6px 22px rgba(168,115,107,.34);
  animation:sealIn .9s .15s cubic-bezier(.34,1.56,.64,1) both}
@keyframes sealIn{from{opacity:0;transform:scale(.72) rotate(-7deg)}to{opacity:1;transform:none}}
.splash-title{font-family:var(--serif);font-size:46px;font-weight:700;letter-spacing:.12em;
  margin:0 0 10px;color:var(--fg);text-indent:.12em}
.splash-sub{font-size:14px;color:var(--muted);letter-spacing:.22em;margin:0;text-indent:.22em}
.splash-rule{width:52px;height:1px;background:var(--bd);margin:26px auto;position:relative}
.splash-rule::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:5px;height:5px;background:var(--acc2);border-radius:50%;opacity:.55}
.splash-quote{font-family:var(--serif);font-size:17px;color:var(--fg);opacity:.86;
  line-height:1.9;margin:0 0 18px;letter-spacing:.03em}
.splash-quote .q{color:var(--acc2);opacity:.62;font-size:20px;margin:0 2px}
.splash-desc{font-size:13.5px;color:var(--muted);line-height:2;margin:0 0 34px}
.splash-enter{display:inline-flex;align-items:center;gap:9px;
  padding:13px 30px;border:1px solid var(--acc);border-radius:10px;
  background:transparent;color:var(--acc);font-size:14.5px;font-family:var(--serif);
  letter-spacing:.1em;cursor:pointer;transition:background .22s,color .22s,transform .22s,box-shadow .22s}
.splash-enter:hover{background:var(--acc);color:var(--card);transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(92,122,153,.28);text-decoration:none}
.splash-enter svg{transition:transform .22s}
.splash-enter:hover svg{transform:translateX(3px)}
.splash-foot{margin-top:44px;font-size:11.5px;color:var(--muted);letter-spacing:.14em;opacity:.75}
.splash-foot .dot{margin:0 8px;opacity:.5}
html[data-theme="dark"] .splash-seal{background:linear-gradient(140deg,var(--acc2),#7A4A43)}
@media (max-width:520px){
  .splash-title{font-size:38px}
  .splash-seal{width:58px;height:58px;font-size:30px;margin-bottom:22px}
  .splash-quote{font-size:15.5px}
  .splash-desc{font-size:13px;margin-bottom:28px}
  .splash-foot{margin-top:34px}
}

/* ---------- 顶部导航 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;display:flex;align-items:center;gap:12px;
  padding:0 24px;background:rgba(255,253,250,.92);backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--bd)}
html[data-theme="dark"] #topbar{background:rgba(22,27,34,.92)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;user-select:none;font-family:var(--serif);letter-spacing:.02em}
#topbar .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc2),#8B2A20);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;font-family:var(--serif);box-shadow:0 2px 6px rgba(176,58,46,.3)}
#topbar .brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:2px}
#topbar .spacer{flex:1}
#topbar .tstat{color:var(--muted);font-size:12.5px;margin-right:6px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);
  background:var(--card);color:var(--fg);cursor:pointer;transition:background .15s,border-color .15s;padding:0}
.iconbtn:hover{background:var(--hov)}
#hamburger{display:none}

/* ---------- 布局骨架 ---------- */
#layout{display:flex;padding-top:var(--topbar-h);min-height:100vh}
#sidebar{width:var(--side-w);flex:none;background:var(--side);border-right:1px solid var(--bd);
  position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto;padding:14px 12px 32px}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
#sidebar::-webkit-scrollbar-thumb:hover{background:var(--muted)}
#main{flex:1;min-width:0}
#content{max-width:1280px;margin:0 auto;padding:28px 40px 80px;width:100%;box-sizing:border-box}
.page-article{display:flex;gap:36px;max-width:1160px;margin:0 auto;width:100%}
#articlecol{flex:1;min-width:0;max-width:800px;width:100%}
#toccol{width:var(--toc-w);flex:none;position:sticky;top:calc(var(--topbar-h) + 28px);align-self:flex-start;max-height:calc(100vh - var(--topbar-h) - 56px);overflow-y:auto}

/* ---------- 侧边导航（Starlight 风格） ---------- */
.navgroup{margin-bottom:4px}
.navgroup-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;
  color:var(--fg);font-weight:600;font-size:13.5px;border-radius:8px;cursor:pointer;transition:background .15s}
.navgroup-head:hover{background:var(--hov)}
.navgroup-head .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:11.5px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:0 8px;line-height:1.7}
.navgroup-head .chev{transition:transform .15s;color:var(--muted);flex:none;display:inline-flex}
.navgroup.closed .chev svg{transform:rotate(-90deg)}
.navgroup ul{list-style:none;margin:2px 0 10px;padding:0}
.navgroup.closed ul{display:none}
.navgroup li a{display:block;padding:6px 10px 6px 26px;margin:1px 0;border-radius:8px;color:var(--muted);font-size:13px;line-height:1.5;cursor:pointer;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navgroup li a:hover{background:var(--hov);color:var(--fg);text-decoration:none}
.navgroup li a.active{background:var(--accbg);color:var(--acc);font-weight:600;border-left:2px solid var(--acc)}
#sidebar .sidecap{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:6px 10px 10px;font-weight:600}
/* 二级分组（周报按月） */
.navsub{list-style:none;margin:0}
.navsub-head{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 22px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:6px;user-select:none;font-weight:600;letter-spacing:.03em}
.navsub-head:hover{background:var(--hov);color:var(--fg)}
.navsub-head .subchev{display:inline-flex;transition:transform .15s;flex:none}
.navsub-head .subcnt{margin-left:auto;font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.navsub.closed .subchev{transform:rotate(-90deg)}
.navsub.closed .navsub-list{display:none}
.navsub-list{list-style:none;margin:0 0 4px;padding:0}
.navsub-list li a{padding-left:38px;font-size:12.5px}
#sidebar ul>li.navsub{padding:0}
#sidebar .sidefoot{margin-top:20px;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:12px;color:var(--muted);line-height:1.7}
#sidebar .sidefoot b{color:var(--fg);display:block;font-size:12.5px;margin-bottom:2px}

/* ---------- 首页（Knowledge Library 风格） ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:40px 0 26px;border-bottom:1px solid var(--bd);margin-bottom:24px;position:relative}
.hero::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:3px;background:linear-gradient(90deg,var(--acc2),transparent);border-radius:2px}
.hero .kicker{display:inline-flex;align-items:center;gap:6px;color:var(--acc2);background:var(--acc2bg);font-size:12.5px;font-weight:600;letter-spacing:.04em;padding:4px 13px;border-radius:99px;margin-bottom:14px}
.hero h1{font-family:var(--serif);font-size:42px;line-height:1.15;margin:0 0 8px;letter-spacing:.04em;font-weight:700}
.hero .sub{font-size:16.5px;color:var(--fg);opacity:.75;margin:0 0 10px;font-family:var(--serif)}
.hero .desc{font-size:14px;color:var(--muted);max-width:620px;margin:0;line-height:1.9}
.statrow{display:flex;gap:12px;flex:none}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 20px;min-width:104px;text-align:center;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent)}
.stat .n{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--acc);line-height:1.25;font-variant-numeric:tabular-nums}
.stat:nth-child(2) .n{color:var(--c-teal)}
.stat:nth-child(2)::before{background:linear-gradient(90deg,var(--c-teal),transparent)}
.stat:nth-child(3) .n{color:var(--c-plum)}
.stat:nth-child(3)::before{background:linear-gradient(90deg,var(--c-plum),transparent)}
.stat:nth-child(4) .n{color:var(--acc2)}
.stat:nth-child(4)::before{background:linear-gradient(90deg,var(--acc2),transparent)}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}

.searchwrap{position:relative;margin:22px 0 26px}
.searchbox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;
  padding:0 18px;height:56px;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s}
.searchbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg),var(--shadow-lg)}
.searchbox svg{flex:none;color:var(--muted)}
.searchbox input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--fg);height:100%}
.searchbox .sclear{border:0;background:var(--hov);color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0;font-size:12px}
.searchbox.hasval .sclear{display:inline-flex}
.searchbox kbd{font-family:inherit;font-size:11px;color:var(--muted);border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:var(--bg);flex:none}
#searchresults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--bd);
  border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow-y:auto;z-index:40;display:none}
#searchresults .sr-cap{padding:8px 16px 4px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
#searchresults .sr-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--bd)}
#searchresults .sr-item:last-child{border-bottom:0}
#searchresults .sr-item:hover,#searchresults .sr-item.sel{background:var(--accbg)}
#searchresults .sr-item .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline}
#searchresults .sr-item .t .badge{font-size:11px;color:var(--acc);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
#searchresults .sr-item .d{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
#searchresults .sr-empty{padding:18px 16px;color:var(--muted);font-size:14px}

.secthead{display:flex;align-items:baseline;gap:12px;margin:14px 0 16px}
.secthead h2{font-size:20px;margin:0;font-family:var(--serif);letter-spacing:.03em;position:relative;padding-left:14px}
.secthead h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:18px;background:var(--acc2);border-radius:2px}
.secthead .more{margin-left:auto;font-size:13px;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:38px}
/* 本周推荐 */
.reccard{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:38px}
.recitem{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.recitem:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--shadow-lg);text-decoration:none}
.recitem.remain{background:linear-gradient(135deg,var(--accbg),var(--card) 75%);border-color:rgba(92,122,153,.25)}
.recbadge{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acc);background:var(--accbg);border-radius:6px;padding:3px 9px}
.recitem.remain .recbadge{color:#fff;background:var(--acc2)}
.recbody{min-width:0;flex:1;overflow:hidden}
.rectitle{font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.recitem.remain .rectitle{font-size:15px}
.recmeta{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.recarr{flex:none;color:var(--bd);transition:color .15s,transform .15s}
.recitem:hover .recarr{color:var(--acc);transform:translateX(2px)}
@media (max-width:1100px){.reccard{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:600px){.reccard{grid-template-columns:1fr}}
.catcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;cursor:pointer;
  box-shadow:var(--shadow);transition:border-color .18s,transform .18s,box-shadow .18s;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.catcard:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.catcard .cchead{display:flex;align-items:center;gap:12px}
.catcard .letter{width:42px;height:42px;border-radius:10px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(30,75,143,.12)}
.catcard .ccmeta{min-width:0}
.catcard .cchead .cat{font-size:11px;color:var(--muted);letter-spacing:.08em}
.catcard h3{margin:0;font-size:16px;line-height:1.4;font-family:var(--serif);letter-spacing:.02em}
.catcard .cntb{margin-left:auto;font-size:12px;color:var(--acc2);font-weight:700;background:var(--acc2bg);border-radius:99px;padding:2px 11px;flex:none;font-variant-numeric:tabular-nums}
.catcard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.7;flex:1}
.catcard .mini{display:flex;flex-direction:column;gap:3px;margin:2px 0;min-width:0}
.catcard .mini a{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;color:var(--muted);padding:3px 0;overflow:hidden;cursor:pointer;line-height:1.5;word-break:break-word}
.catcard .mini a:hover{color:var(--acc)}.catcard .foot{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--acc);font-weight:600;margin-top:auto}

/* 全部专题：表格式列表 */
.topicpanel{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:38px}
.topicpanel .tp-head{display:grid;grid-template-columns:72px 1fr 240px 32px;gap:16px;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--hov);font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.trow{display:grid;grid-template-columns:72px 1fr 240px 32px;gap:16px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .12s}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--accbg)}
.trow .tid{font-weight:700;color:var(--acc);font-size:12.5px;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.trow .tt{min-width:0}
.trow .tt .t1{font-weight:600;font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif);letter-spacing:.01em}
.trow .tt .t2{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.trow .tm .tags{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm .pillrow{display:flex;gap:6px}
.pill{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:6px;padding:0 8px;font-size:11px;font-weight:600;line-height:1.8}
.pill.dim{background:var(--hov);color:var(--muted);font-weight:500}
.trow .arr{color:var(--bd);transition:color .12s,transform .12s}
.trow:hover .arr{color:var(--acc);transform:translateX(2px)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--acc2);border-radius:8px;padding:13px 18px;font-size:13.5px;color:var(--fg);margin:0 0 26px;box-shadow:var(--shadow)}
.warn svg{flex:none;color:var(--acc2);margin-top:3px}
.srcindex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 24px;margin-bottom:20px;box-shadow:var(--shadow);font-size:13px}
.srcindex summary{cursor:pointer;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;list-style:none}
.srcindex summary::-webkit-details-marker{display:none}
.srcindex summary .chev{transition:transform .15s;color:var(--muted);display:inline-flex}
.srcindex[open] summary .chev svg{transform:rotate(90deg)}
.srcindex .src{font-size:13px;color:var(--muted);word-break:break-all;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.homefoot{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0 6px}

/* ---------- 分类视图 ---------- */
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:26px 0 0}
.crumb a{cursor:pointer}

<script>
const DATA=/*DATA*/null;
const MDS=/*MDS*/null;
const ICONS={
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  alert:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  arrow:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  zap:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  link:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>'
};
const CATS={
 D:{name:"河南案例库",desc:"可引用、可分析的河南真实政策案例与实施证据。",icon:"case"},
 W:{name:"时政周报",desc:"每周河南时政要点回溯，含深度案例与可考角度。",icon:"news"},
 P:{name:"政策摘要",desc:"河南重要政策文件的要点摘录与可考角度。",icon:"doc"}
};

// 分类展示顺序：按 DATA 里实际存在的分类推导
const CATORDER=Object.keys(CATS).filter(k=>DATA.topics.some(t=>t.category===k));
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
let HEADING_IDS=[],TOC_IDS=[];

/* ---------- Markdown 渲染 ---------- */
function md(src){
  let lines=esc(src).split("\n"),out=[],inCode=false,inList=false,listType=null,inQuote=false,tableBuf=[];
  const inline=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[\[([^\]]+)\]\]/g,(m,id)=>{const t=DATA.topics.find(t=>t.id===id);return t?`<a href="javascript:void(0)" onclick="openTopic('${id}');return false">${t.id} ${t.title}</a>`:id})
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushTable=()=>{if(!tableBuf.length)return;
    let rows=tableBuf.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)&&r.trim());
    if(!rows.length){tableBuf=[];return}
    let h=`<table><thead><tr>${rows[0].replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<th>"+inline(c.trim())+"</th>").join("")}</tr></thead><tbody>`;
    for(const r of rows.slice(1))h+="<tr>"+r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>";
    out.push(h+"</tbody></table>");tableBuf=[]};
  const closeAll=()=>{if(tableBuf.length)flushTable();if(inList){out.push(listType==="ul"?"</ul>":"</ol>");inList=false}if(inQuote){out.push("</blockquote>");inQuote=false}};
  for(let ln of lines){
    if(/^```/.test(ln)){closeAll();out.push(inCode?"</pre>":"<pre>");inCode=!inCode;continue}
    if(inCode){out.push(ln);continue}
    let m;
    if(/^\s*\|/.test(ln)){tableBuf.push(ln);continue}
    closeAll();
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){
      const lv=m[1].length;
      if(lv<=3){const hid="h"+HEADING_IDS.length;HEADING_IDS.push({id:hid,level:lv,text:inline(m[2])});
        out.push(`<h${lv} id="${hid}">`+inline(m[2])+`</h${lv}>`)}
      else out.push("<h4>"+inline(m[2])+"</h4>");
    }
    else if(/^\s*[-*]\s/.test(ln)){
      if(!inList){out.push("<ul>");inList=true;listType="ul"}
      out.push("<li>"+inline(ln.replace(/^\s*[-*]\s/,""))+"</li>");
    }
    else if(/^\s*\d+[.、)]\s/.test(ln)){
      if(!inList){out.push("<ol>");inList=true;listType="ol"}
      out.push("<li>"+inline(ln.replace(/^\s*\d+[.、)]\s/,""))+"</li>");
    }
    else if(/^>\s?/.test(ln)){
      if(!inQuote){out.push("<blockquote>");inQuote=true}
      out.push(inline(ln.replace(/^>\s?/,"")));
    }
    else{
      if(/^\s*$/.test(ln))out.push("");
      else out.push("<p>"+inline(ln)+"</p>");
    }
  }
  closeAll();
  return out.join("\n");
}

/* ---------- 主题 ---------- */
const SUN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);
  document.getElementById("themebtn").innerHTML=t==="dark"?SUN:MOON;
  try{localStorage.setItem("lishi-theme",t)}catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark")}
(function(){let t="light";try{const s=localStorage.getItem("lishi-theme");if(s==="dark"||s==="light")t=s}catch(e){}applyTheme(t)})();

/* ---------- 侧边导航树 ---------- */
function buildNav(){
  let h="";
  for(const c of CATORDER){
    const ts=DATA.topics.filter(t=>t.category===c);
    if(!ts.length)continue;
    let body="";
    // 周报类按月二级分组，避免一长串数字墙
    if(c==='W'){
      const groups=new Map();
      ts.forEach(t=>{
        const m=(t.title||'').match(/20\d{2}-(\d{2})/);
        const key=m?`${m[1]}月`:'其他';
        if(!groups.has(key))groups.set(key,[]);
        groups.get(key).push(t);
      });
      const order=[...groups.keys()].sort();
      body=order.map(k=>{
        const arr=groups.get(k);
        return `<li class="navsub"><div class="navsub-head" onclick="event.stopPropagation();this.parentElement.classList.toggle('closed')">
          <span class="subchev">${ICONS.chev}</span><span>${k}</span><span class="subcnt">${arr.length}</span></div>
          <ul class="navsub-list">${arr.map(t=>`<li><a data-nav="${t.id}" tabindex="0" role="button" title="${esc(t.title)}" onclick="openTopic('${t.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTopic('${t.id}')}">${esc(shortWeek(t.title))}</a></li>`).join("")}</ul></li>`;
      }).join("");
    }else{
      body=ts.map(t=>`<li><a data-nav="${t.id}" tabindex="0" role="button" title="${esc(t.title)}" onclick="openTopic('${t.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTopic('${t.id}')}">${esc(t.title)}</a></li>`).join("");
    }
    h+=`<div class="navgroup closed" id="ng${c}"><button class="navgroup-head" onclick="toggleGroup('${c}')" aria-expanded="false">
      <span class="chev">${ICONS.chev}</span><span>${CATS[c].name}</span><span class="cnt">${ts.length}</span></button>
      <ul>${body}</ul></div>`;
  }
  document.getElementById("navtree").innerHTML=h;
}
// 本周推荐：取最新 5 篇（周报优先 + 最新案例）
function renderRec(){
  const box=document.getElementById('recbox');
  if(!box)return;
  // 只推最新时政周报，按开始日期倒序
  const startDate=t=>{
    const m=(t.title||'').match(/(20\d{2}-\d{2}-\d{2})/);
    return m?m[1]:'0000-00-00';
  };
  const ws=DATA.topics.filter(t=>t.category==='W')
    .sort((a,b)=>startDate(b).localeCompare(startDate(a))).slice(0,3);
  if(!ws.length)return;
  box.innerHTML=ws.map(t=>{
    const d=startDate(t);
    return `<a class="recitem" onclick="openTopic('${t.id}')" title="${esc(t.title)}">
      <div class="recbadge">时政</div>
      <div class="recbody">
        <div class="rectitle">${esc(shortWeek(t.title))}</div>
        <div class="recmeta"><span>${t.id}</span>${d!=='0000-00-00'?`<span>${d}</span>`:''}${t.sources.length?`<span>${t.sources.length} 源</span>`:''}</div>
      </div>
    </a>`;
  }).join("");
} 
// 周报标题精简：去掉“河南时政周报”前缀
function shortWeek(t){
  return (t||'').replace(/^河南时政周报\s*/, '');
}
function toggleGroup(c){const g=document.getElementById("ng"+c);g.classList.toggle("closed");
  g.querySelector(".navgroup-head").setAttribute("aria-expanded",g.classList.contains("closed")?"false":"true")}
function highlightNav(id){
  document.querySelectorAll("#navtree a").forEach(a=>a.classList.toggle("active",a.dataset.nav===id));
  if(id){const a=document.querySelector(`#navtree a[data-nav="${id}"]`);
    if(a){const g=a.closest(".navgroup");if(g&&g.classList.contains("closed"))toggleGroup(g.id.slice(2))}}

/* ---------- 路由 ---------- */
function go(v){document.body.classList.remove('sideopen');v==="home"?home():catView(v)}
function openTopic(id){document.body.classList.remove('sideopen');topicView(id)}

/* 将“可考角度”“金句/对策”两节包成彩色卡片 */
function wrapSpecialSections(html){
  const wrapOne=(src,titleRe,cls)=>{
    // 找到标题位置
    const re=new RegExp('<h[23][^>]*>([^<]*(?:'+titleRe+')[^<]*)</h[23]>','i');
    const m=src.match(re);
    if(!m)return src;
    const start=m.index;
    const afterStart=start+m[0].length;
    // 找下一个同级或更高级标题
    const rest=src.slice(afterStart);
    const nextM=rest.match(/<h[23][\s>]/i);
    const end=nextM?afterStart+nextM.index:src.length;
    const header=src.slice(start,afterStart);
    const body=src.slice(afterStart,end);
    return src.slice(0,start)+`<div class="${cls}">${header}<div class="cardbody">${body}</div></div>`+src.slice(end);
  };
  html=wrapOne(html,'可考角度','sec-card sec-exam');
  html=wrapOne(html,'金句','sec-card sec-quote');
  return html;
}

/* ---------- 搜索 ---------- */
let SITEMS=null,SR_HITS=[];
function searchItems(){
  return DATA.topics.map(t=>{
    const mdtext=(MDS[t.file]||"").replace(/[#*`>|[\]()]/g," ");
    return {t,text:(t.id+" "+t.title+" "+t.tags.join(" ")+" "+((CATS[t.category]||{}).name||"")+" "+(t.card||"")+" "+mdtext).toLowerCase()};
  });
}
function doSearch(q){
  const box=document.getElementById("searchresults");
  if(!box)return;
  if(!SITEMS)SITEMS=searchItems();
  q=q.trim().toLowerCase();
  const sb=box.parentNode.querySelector(".searchbox");
  if(sb)sb.classList.toggle("hasval",!!q);
  if(!q){box.style.display="none";box.innerHTML="";SR_HITS=[];return}
  const words=q.split(/\s+/);
  SR_HITS=SITEMS.filter(it=>words.every(w=>it.text.includes(w))).slice(0,10);
  box.innerHTML=`<div class="sr-cap">搜索结果 · ${SR_HITS.length} 条</div>`+(SR_HITS.length?SR_HITS.map((it,i)=>{
    const t=it.t;
    return `<div class="sr-item${i===0?" sel":""}" data-id="${t.id}" onclick="event.stopPropagation();srOpen('${t.id}')">
      <div class="t"><span class="badge">${t.id}</span><span>${esc(t.title)}</span></div>
      <div class="d">${esc((t.card||t.tags.join(" · ")).slice(0,90))}</div></div>`}).join("")
    :`<div class="sr-empty">未找到与「${esc(q)}」相关的专题</div>`);
  box.style.display="block";
}
/* 修复：等当前点击事件结束（rAF）再销毁首页 DOM，避免访问已销毁节点导致 JS 异常 */
function srOpen(id){hideSearch();requestAnimationFrame(()=>openTopic(id))}
function hideSearch(){const b=document.getElementById("searchresults");if(!b)return;b.style.display="none";b.innerHTML="";SR_HITS=[]}
function clearSearch(){const i=document.getElementById("searchinput");if(i){i.value="";i.focus()}doSearch("")}
function srKey(e){
  const box=document.getElementById("searchresults");
  if(!box||box.style.display==="none")return;
  const items=[...box.querySelectorAll(".sr-item")];
  if(!items.length){if(e.key==="Escape")box.style.display="none";return}
  let i=items.findIndex(x=>x.classList.contains("sel"));
  if(e.key==="ArrowDown"){e.preventDefault();i=(i+1)%items.length}
  else if(e.key==="ArrowUp"){e.preventDefault();i=(i-1+items.length)%items.length}
  else if(e.key==="Enter"){e.preventDefault();const id=items[Math.max(i,0)].dataset.id;hideSearch();openTopic(id);return}
  else if(e.key==="Escape"){hideSearch();return}
  else return;
  items.forEach((x,j)=>x.classList.toggle("sel",j===i));
  items[i].scrollIntoView({block:"nearest"});
}

/* ---------- 文章视图 ---------- */
/* 修复：从正文中剥离"快速知识卡"小节单独前置渲染，深度正文不再重复显示 */
function splitCard(src){
  const m=src.match(/^#{2,3}\s*⚡\s*快速知识卡\s*\n([\s\S]*?)(?=\n#{1,3}\s|\s*$)/m);
  if(!m)return {card:"",body:src};
  return {card:m[1].trim(),body:src.replace(m[0],"").replace(/^\s*\n/,"").trim()};
}
function buildTOC(){
  return HEADING_IDS.map(x=>`<a class="${x.level===3?"lvl3":""}" id="toclink-${x.id}" onclick="jumpTo('${x.id}')">${x.text}</a>`).join("");
}
function jumpTo(id){const el=document.getElementById(id);if(!el)return;
  const y=el.getBoundingClientRect().top+window.scrollY-80;window.scrollTo({top:y,behavior:"smooth"})}
function topicView(id){
  const t=DATA.topics.find(t=>t.id===id);if(!t){home();return}
  const mdtext=MDS[t.file]||"（未找到正文）";
  const sp=splitCard(mdtext);
  HEADING_IDS=[];TOC_IDS=[];
  const rendered=wrapSpecialSections(md(sp.body));
  TOC_IDS=HEADING_IDS.map(x=>x.id);
  const srcs=t.sources.map(sid=>{const s=DATA.sources.find(s=>s.id===sid);
    return s?`<div class="srcitem">[${s.id}] ${esc(s.title)} — <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>（${s.type}，核实 ${s.checked_date}）</div>`:""}).join("");
  const rel=t.related.map(r=>{const rt=DATA.topics.find(x=>x.id===r);
    return rt?`<button onclick="openTopic('${r}')"><span class="rid">${r}</span><span class="rt">${esc(rt.title)}</span></button>`:""}).join("");
  let h=`<div class="page-article">
  <div id="articlecol">
    <button class="backtop" onclick="go('${t.category}')">← 返回${(CATS[t.category]||{}).name||"列表"}</button>
    <div class="artmeta"><span class="pill">${t.id}</span><span class="pill dim">证据等级：${t.evidence_level}</span><span class="pill dim">${t.status}</span><span>更新 ${t.updated}</span></div>
    ${sp.card?`<div class="kcard"><div class="kcap">${ICONS.zap} 快速知识卡</div><div class="md">${md(sp.card)}</div></div>`:""}
    <article class="md">${rendered}</article>
    ${srcs?`<div class="srcbox"><b>本专题来源（${t.sources.length} 条）</b>${srcs}</div>`:""}
    ${rel?`<div class="relbox"><h3>${ICONS.link} 关联专题</h3><div class="relbtns">${rel}</div></div>`:""}
    <button class="backtop" onclick="go('home')">← 返回首页</button>
  </div>
  <div id="toccol"><div class="toccap">本页目录</div><nav id="toc">${buildTOC()}</nav></div>
  </div>`;
  document.getElementById("content").innerHTML=h;
  highlightNav(id);window.scrollTo(0,0);
  setupTOCSpy();
}
function setupTOCSpy(){
  const links=TOC_IDS.map(i=>({id:i,el:document.getElementById(i),a:document.getElementById("toclink-"+i)})).filter(x=>x.el);
  if(!links.length)return;
  const onScroll=()=>{
    let cur=links[0].id;
    for(const l of links){if(l.el.getBoundingClientRect().top<100)cur=l.id}
    links.forEach(l=>l.a.classList.toggle("active",l.id===cur));
  };
  window.removeEventListener("scroll",window.__tocspy||(()=>{}));
  window.__tocspy=onScroll;window.addEventListener("scroll",onScroll,{passive:true});onScroll();
}

function enterSite(){

  if(!sp)return;
  sp.classList.add('hide');
  document.body.classList.remove('splash-lock');
  setTimeout(()=>{ if(sp&&sp.parentNode) sp.style.display='none'; },700);
}
