达到二级医院能力水平等 [SD16]，均属政府部门自报进展。\n- **独立研究证据**：同行评审文献中，一项发表于 BMC Health Services Research（2024）的研究用熵权 TOPSIS 与非整数秩和比法对山东省紧密型县域医共体实施情况进行综合评价，指出该模式自 2019 年起全国推行、旨在深度整合县域医疗资源，但国外尚无\"紧密型县域医共体\"对应概念、县域层面研究缺乏 [SD17]。该研究的方法与结论针对山东，不能直接外推河南，但说明：(1) 医共体效果评价已进入量化研究阶段；(2) 各省实施强度与排名差异明显，\"建成\"不等于\"建好\"。总体上，针对河南医共体的独立因果评估（如基于试点安排的双重差分研究）在本专题写作时未检索到可核验的公开成果，相关成效判断暂以官方通报为准，须谨慎引用。\n\n### 政策目标与实际效果的区分\n\n- **目标**（规范性表述）：县域就诊率 90% 以上、基层就诊率 65% 左右（河南目标）[SD11]；2027 年全国基本全覆盖 [SD10]。\n- **官方通报进展**：医共体组织架构基本建成、\"七统一\"管理推进、部分能力指标改善 [SD11][SD13][SD16]。\n- **尚不明确的部分**：基层诊疗量占比、县域外流率等结果指标的趋势性变化缺乏可核验的独立数据；\"人财物统一管理\"与法人资格保留之间的张力如何解决，各地做法不一 [SD10][SD13]。\n\n### 局限与争议\n\n- **内部治理**：成员单位法人资格保留与\"一家人\"一体化管理并存，总院长负责制下牵头医院与卫生院的利益分配（如结余留用资金分成）易生矛盾；河南文件明确要求考核向资源下沉、巡诊派驻倾斜，正是对\"重县级、轻乡村\"倾向的纠偏 [SD10][SD13]。\n- **激励机制**：总额付费＋结余留用把激励从\"挣治病的钱\"转向\"挣健康的钱\"（安阳牵头医院负责人语，官方刊文）[SD15]，但也可能诱发推诿高成本患者、服务不足（under-provision）风险，需靠监督考核对冲 [SD12]。\n- **能力提升实效**：派驻专家帮扶周期至少半年 [SD13]，短期轮换能否形成本土人才梯队存疑；\"同病同付\"等支付创新的效果数据目前以医保部门自报为主 [SD15]。\n- **\"虹吸\"风险**：文件特别警示医共体\"虹吸\"基层资源、滞留挪用基层资金的可能 [SD13]，说明改革自身存在逆向激励，需以监测指标体系持续盯防 [SD14]。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：医共体改革是\"跨部门协同（卫健、医保、编办、财政）＋资源整合＋支付杠杆\"的综合案例，可用 [A05 跨部门协同] 与 [A04 政策工具] 框架拆解；\"13710\"督办机制是河南本土的执行保障工具，可直接引用 [SD11]。\n- **对策题**：问\"如何提升基层医疗服务能力\"，可答\"管理一体化（七统一）＋医保支付激励（总额付费、结余留用、同病同付）＋人才下沉（派驻帮扶、计入职称晋升）\"三层对策。\n- **面试综合分析**：给\"县医院人满为患、卫生院门可罗雀\"现象，用\"资源整合＋利益共同体＋防虹吸\"逻辑归因作答；注意区分政策目标与已证实的成效，体现证据意识（参见 [A06 公共政策评估与因果分析]）。\n\n**原创练习（思考题）**\n1. 医共体\"总额付费、结余留用\"与单机构按项目付费的激励差异何在？可能产生哪些新的执行偏差？\n2. 成员单位法人资格保留与\"七统一\"管理之间存在何种张力？豫政办〔2025〕23 号试图如何化解？\n3. 若要科学评估河南医共体对基层就诊率的影响，应如何设计因果识别策略（提示：试点县与非试点县、改革时点）？\n\n### 来源说明\n\n本专题来源均经 2026-10-18 逐条抓取核实：国家文件为原文页（中国政府网/国家卫健委），河南省级文件取河南省政协网站转载的省政府办公厅原文全文（www.hnzx.gov.cn 镜像，原发为河南省人民政府办公厅），医保成效为国家医保局官网刊文，学术证据为 BMC Health Services Research 同行评审论文（PubMed Central 全文）。未检索到针对河南医共体的独立因果评估研究，相关空白已在正文如实注明，不作推断。\n\n## 来源与证据\n\n- [SD10] 《关于全面推进紧密型县域医疗卫生共同体建设的指导意见》（国卫基层发〔2023〕41 号），国家卫健委等 10 部门，2023-12，中国政府网。[官方]\n- [SD11] 《河南：\"13710\"建设紧密型医共体》，新华网，2021-11-17。[官方]\n- [SD12] 《让百姓在\"家门口\"获得更好医疗服务——聚焦紧密型县域医共体建设》，新华社（中国政府网政策解读），2024-01-12。[官方]\n- [SD13] 《河南省人民政府办公厅关于印发河南省推进紧密型县域医疗卫生共同体高质量发展若干措施的通知》（豫政办〔2025〕23 号），2025-04-29 印发、05-27 公开。[官方]\n- [SD14] 《关于印发紧密型县域医疗卫生共同体监测指标体系的通知》（国卫办基层发〔2024〕22 号），国家卫健委等四部门，2024-10-30。[官方]\n- [SD15] 《医保支持基层，河南有实招！》，国家医疗保障局官网，2026-05-24。[官方]\n- [SD16] 《潮涌千帆竞，\"豫见\"健康新图景》，健康报（国家卫健委官网转载），2025-12，河南省卫健委主任黄红霞专访数据。[官方]\n- [SD17] Comprehensive evaluation of the implementation of close-type county medical alliance in Shandong Province using entropy weight TOPSIS method and non-integer rank sum ratio method, BMC Health Services Research, 2024。[研究]\n\n## 关联专题\n\n- [[A06]]：医共体成效评估是政策评估方法的应用场景。\n- [[A03]]：县域医疗资源整合是公共服务供给侧改革的典型样本。\n- [[D05]]：河南政策案例库内的关联专题。\n", "D03-河南基层矛盾纠纷多元化解.md": "\n# D03 河南基层矛盾纠纷多元化解：综治中心规范化、调解联动与网格化治理\n\n## ⚡ 快速知识卡\n\n河南把矛盾纠纷多元化解作为基层高效能治理的关键环节，以\"预防在前、调解优先、法治化解决\"为主线 [SD25][SD20]。核心机制有四：①综治中心规范化建设——\"只进一扇门、最多跑一地\"，统一受理、分类流转、依法办理、闭环管理；②人民调解、行政调解、司法调解联动——司法所建强调解队伍，法院设人民调解工作室开展诉前调解；③网格化管理——网格员排查预警，把矛盾化解在萌芽；④新时代\"枫桥经验\"河南实践，与\"三零\"创建、党建引领基层高效能治理结合 [SD20][SD26]。实际用途：为案例分析题提供\"排查—受理—分流—化解—回访\"完整链条素材，为申论对策题提供\"一站式平台+三调联动+源头预防\"框架。适用题型：选调案例分析、申论对策与材料写作。深入阅读见下方\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n河南是人口过亿的大省，基层矛盾纠纷总量大、类型多，涉及婚恋家庭、邻里、劳资欠薪、征地拆迁、教育培训退费等领域 [SD22][SD23]。传统解纷格局的突出问题是\"多头跑、反复跑\"：政法机关和数十个行业部门都有纠纷化解职能，但各管一段、场所分散，群众搞不清该进哪个门 [SD25]。为此，中央层面逐步部署：2019 年《中国共产党政法工作条例》规定设立省、市、县、乡镇（街道）综治中心；2023 年 10 月中办、国办印发《关于坚持和发展新时代\"枫桥经验\"提升社会矛盾纠纷预防化解能力的意见》，部署强化县、乡两级综治中心的矛盾纠纷多元化解功能；2024 年 12 月《中共中央关于加强新时代政法工作的意见》提出以县级为重点加强综治中心建设，让群众\"最多跑一地\"化解矛盾纠纷 [SD25]。河南省委政法委按照中央政法委部署推动全省综治中心规范化建设，将其作为提升矛盾纠纷预防化解法治化水平的平台窗口 [SD20]。\n\n### 核心机制\n\n1. **综治中心规范化建设（解纷枢纽）**。要求推进场所设置、部门入驻、运行机制、督办落实、信息化建设\"五个规范化\"：统一受理群众诉求后发放受理告知单、\"一案一码\"全程可追溯；以派单模式分类流转导入调解、仲裁、行政裁决、行政复议、诉讼、法律监督的法治化\"路线图\"；综治中心负责程序性推进、办理部门负责实质性解决，并全周期跟踪督办 [SD25]。河南实践如郑州金水区综治中心一楼 24 个窗口提供 37 项业务\"挂号分诊\"、二楼心理疏导区等 15 个功能室\"深度问诊\"；截至 2025 年报道时全省已有 61 个县（市、区）综治中心完成规范化建设，实现\"一站式受理、多部门联动、全链条解决\" [SD20]。\n2. **人民调解、行政调解、司法调解联动（三调联动）**。司法行政系统强化人民调解基础性作用：结合村（社区）\"两委\"换届优化调整人民调解委员会，健全退休法官担任人民调解员机制，常态化排查化解邻里、婚恋、劳资等民生纠纷；同时牵头矛盾纠纷多元化解专项小组，建立跨部门定期会商机制，稳步发展商事调解 [SD23]。司法与调解的衔接上，2019 年 6 月河南省高院、省司法厅联合发文，在全省基层法院诉讼服务中心和具备条件的人民法庭设立人民调解工作室，开展诉前调解，调解成功需司法确认或出具调解书的由诉调对接中心法官直接办理 [SD24]。光山县把人民调解中心调解工作室设进县交警大队，交通事故责任认定在一楼完成、当事人上楼即进入调解，并配值班律师驻点 [SD21]。\n3. **网格化管理与源头预防**。新乡市按\"区域合理、便民利民\"划分 1.5 万个基础网格，建立县、乡、村、组（片）四级网格化体系，网格员日常巡访发现培训机构经营困难引发退费风险后逐级上报，多部门联动处置，并推动全市 116 家培训机构录入资金监管平台，实现\"预警跑在纠纷前\" [SD22]。郑州以地方立法（《郑州市高效能社会治理网格化服务管理条例》，2026 年 4 月新闻发布会）将网格化服务管理纳入法治化轨道，构建\"一格管全面\"\"一键全处理\"的\"发现—上报—分派—处置—反馈—评价\"闭环 [SD26][SD27]。\n4. **新时代\"枫桥经验\"河南实践**。以\"发动和依靠群众、矛盾不上交、就地解决\"为核心，河南将其与\"三零\"创建（零上访、零事故、零案件）、党建引领基层高效能治理、省委\"五基四化\"部署结合推进 [SD20][SD26]。\n\n### 有出处的地方实践\n\n- **郑州市金水区**：综治中心\"全科医院\"式分区受理与服务承诺，是省级报道列举的规范化样板 [SD20]。\n- **信阳光山县**：2025 年 7 月综治中心升级运行，建立\"人员管理、诉求受理、矛盾化解、督导落实\"四项机制，平台派单分类流转、\"码上反映\"线上调解；驻交警大队调解工作室累计调处道路交通事故纠纷 1000 余起、促成赔偿金额超 1200 万元（县司法局介绍）；劳动仲裁院入驻后与劳动监察、信访构建\"三位一体\"维权格局，推行\"仲裁+监察\"联合调解；弦山街道七星湖社区形成\"网格排查+源头预防+就地化解\"闭环，当年摸排 24 起纠纷全部化解（社区干部介绍）[SD21]。\n- **新乡市**：三级社会治理综合服务机构 + 四级网格 + 11 个工作专班、21 个部门风险联席研判联动处置，突出\"预防抓在前\" [SD22]。\n\n### 实施证据与数据（均注明官方出处）\n\n- 2024 年全省各地依托综治中心化解矛盾纠纷 75.25 万件，化解率 98.6%（河南日报报道，省委政法委口径）[SD20]。\n- 2026 年上半年河南司法行政系统累计化解各类矛盾纠纷 30.21 万件（司法部微信公众号发布）[SD23]。\n- 2020 年全省法院诉前调解分流案件 43 万件、调解成功 20.1 万件（成功率 46.7%）；139 家中、基层法院设 248 个人民调解工作室、入驻人民调解员 1576 人；全省民事一审案件同比下降 11.49%（省高院副院长宋海萍介绍，媒体转述）[SD24]。\n\n### 政策目标与实际效果：需要区分的地方\n\n上述数字均为官方口径的\"化解件数/化解率\"，反映的是平台运行量与部门自报成效，属于**政策目标与官方通报进展**；其与群众获得感的实际关系，目前缺乏可核验的第三方评估或独立研究数据。几点保留：①\"化解率 98.6%\"的统计口径（含哪些方式、是否含信访分流）未在公开报道中说明 [存疑]；②诉前调解成功 46.7% 意味着仍有约半数分流案件进入诉讼程序，\"多元化解\"并不等于诉讼量整体下降的长期趋势已被证实（2020 年民事一审下降 11.49% 是单年数据）[SD24]；③网格预警、平台派单等机制的成效多为典型案例报道，缺乏跨地区系统比较。答题时应表述为\"官方通报/机制设计\"，不要当作独立评估结论。\n\n### 局限与争议\n\n- **部门协同的形式化风险**：多部门\"入驻\"\"联动\"若缺乏督办刚性，可能退化为挂牌了事；中央层面正是因此把\"督办落实规范化\"单列为五项规范化之一，侧面反映该问题的普遍性 [SD25]。\n- **地区差异**：规范化建设强调\"因地制宜、实事求是，充分考虑东中西部地区发展差异\" [SD25]；河南县域财力、编制差异大，欠发达县综治中心实体化运行质量难以假定与郑州等同 [存疑]。\n- **调解优先的边界**：调解适合多数民间纠纷，但当事人诉权保障、调解协议效力与\"以调压诉\"的争议在学理上长期存在；河南公开材料未系统讨论此问题 [存疑]。\n\n### 与考试能力的关联（案例分析、申论素材）\n\n- **案例分析**：给定\"群众多头跑、矛盾升级\"情境，可按本专题链条作答——网格排查预警（源头上）→ 综治中心一站式受理（渠道上）→ 分类流转、三调联动（手段上）→ 督办回访闭环（机制上）→ 法治化路线图（底线），每一步都有河南实例可引 [SD20][SD21][SD22]。\n- **申论对策**：\"整合资源建平台、下沉力量进网格、部门联动强调解、数据赋能促闭环\"四个分论点分别对应 SD20–SD27 的证据。\n- **面试/政治理论**：准确复述\"坚持和发展新时代'枫桥经验'\"\"矛盾纠纷一站式、多元化解决机制\"\"完善网格化管理、精细化服务、信息化支撑的基层治理平台\"等规范表述 [SD25][SD26]。\n\n### 原创练习（思考题）\n\n1. 结合光山县案例，分析\"综治中心程序性推进 + 办理部门实质性解决\"的分工如何解决\"多头跑\"问题？其前提条件是什么？[SD21][SD25]\n2. 某县计划用一年实现\"万人成讼率下降\"，请运用本专题材料说明该指标受哪些因素干扰，官方数据之外还需补充哪些证据？\n3. 对比新乡网格预警与金水区窗口受理两种入口，说明\"源头预防\"与\"集中化解\"在矛盾化解链条中的不同功能。\n\n### 来源说明\n\n本专题 9 条来源中，SD20–SD23、SD26、SD27 为官方媒体或政府网站原文页（全文已抓取核实），SD24 为都市报对省高院数据的转述，SD25 为转载理论文章，SD28 为省级政法系统专栏聚合页（未逐条抓取）。所有数据均标注原始出处与口径性质；无独立第三方评估数据，相关判断已标 [存疑]。\n\n## 来源与证据\n\n- [SD20] 《河南省以综治中心规范化促基层治理高效能 进一扇门 解千千结》，河南日报（省委宣传部党建网转载），2025-05-30。[官方]\n- [SD21] 《【综治中心规范化建设】河南省信阳市光山县：让为民解忧之光照耀每个角落》，中国长安网（来源：中原盾、河南法治报），2025-12-17。[官方]\n- [SD22] 《一站式调处，为群众高效解纠纷》（新乡市调研），人民网河南频道，2024-05-21。[官方]\n- [SD23] 《河南司法行政系统充分发挥职能作用赋能平安河南建设》，司法部微信公众号（智慧普法平台），2026-07-14。[官方]\n- [SD24] 《让老百姓有地方\"找个说法\"，河南去年诉前调解分流案件43万件》，河南商报（转述省高院数据），约2021。[综合]\n- [SD25] 《全面推进综治中心规范化建设 不断夯实更高水平平安中国建设根基》，理论文章（江苏警官学院宣传部转载），2025-09-15。[官方]\n- [SD26] 《党建引领网格化高效能治理》，中国共产党新闻网·党建，2025-12-29。[官方]\n- [SD27] 《〈郑州市高效能社会治理网格化服务管理条例〉新闻发布会》，郑州市人民政府门户网站，2026-04-13。[官方]\n- [SD28] 河南长安网\"综治中心规范化建设\"专栏，河南省委政法委主管。[官方]\n\n## 关联专题\n\n- [[C04]]：本专题的\"排查—受理—分流—化解—回访\"链条可直接作为案例诊断框架。\n- [[A01]]：新时代\"枫桥经验\"与三治融合的理论框架，是本专题案例的理论底座。\n- [[A05]]：公共服务与治理资源下沉视角的补充。\n", "D04-浙江千万工程实践.md": "\n# D04 浙江\"千万工程\"实践：二十年持续迭代与政策经验的复制推广\n\n## ⚡ 快速知识卡\n\n\"千万工程\"（千村示范、万村整治）是习近平同志 2003 年 6 月在浙江工作时亲自谋划推动的重大决策：从全省近 4 万个村庄中选择约 1 万个行政村全面整治、把其中约 1000 个中心村建成全面小康示范村，从农村人居环境整治入手，由点及面、迭代升级 [SD32][SD37]。二十年演进分三阶段：2003–2010\"千村示范、万村整治\"示范引领，2011–2020\"千村精品、万村美丽\"深化提升，2021 年起\"千村未来、万村共富\"迭代升级 [SD31]。核心支撑是\"一把手亲自抓、层层抓落实\"的领导体制与\"一张蓝图绘到底、一任接着一任干\"的延续机制 [SD33][SD34]。2024 年中央一号文件以学习运用\"千万工程\"经验为主题 [SD30]。适用于乡村振兴、政策延续性、复制推广条件类题目。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n21 世纪初的浙江，民营经济高速增长的同时城乡差距、农村环境问题突出，民间有\"走过一村又一村，村村都是垃圾村\"之说。刚到浙江工作的习近平同志用 118 天跑遍 11 个市，在深入调研基础上于 2003 年 6 月启动\"千万工程\"，提出从全省近 4 万个村庄中选择约 1 万个行政村进行全面整治、把其中约 1000 个中心村建成全面小康示范村 [SD31][SD32][SD34]。工程的定位是\"生态工程\"\"龙头工程\"\"基础性工程\"：以农村人居环境整治为切入点，牵住城乡一体化建设的\"牛鼻子\" [SD34]。这一问题定义的关键在于\"由表及里\"——从脏乱差整治起步，逐步扩展到产业、治理、公共服务，而非一开始就铺开全部目标。\n\n### 核心机制\n\n**① 党政\"一把手\"负责与部门协同。** 习近平同志亲自出席 2003 年启动会和连续 3 年的现场会并发表重要讲话；浙江形成\"一把手亲自抓、分管领导直接抓、一级抓一级、层层抓落实\"的领导体制和\"领导挂帅、部门协同、分级负责\"的工作格局，每年召开现场推进会 [SD33][SD34]。\n\n**② 农民主体与共建共享。** 中央财办、中央农办在总结经验时强调，把群众满意度作为工作成效的最高评判标准，尊重农民意愿和主体地位，厘清\"政府干\"和\"农民干\"的边界 [SD33]。\n\n**③ 阶段演进与迭代升级。** 二十年分三步走：2003–2010 年\"千村示范、万村整治\"示范引领，综合整治村庄环境；2011–2020 年\"千村精品、万村美丽\"深化提升，推动美丽宜居；2021 年起\"千村未来、万村共富\"迭代升级，强化数字赋能 [SD31][SD37]。每一阶段目标递进但主线不变——这是长期政策执行中\"循序渐进、久久为功\"的典型设计 [SD30]。\n\n**④ 规划先行与多元投入。** 浙江坚持城乡一体化规划引导，推进\"三革命\"（垃圾、污水、厕所）与城乡基础设施互联互通；同时以\"两进两回\"（科技、资金进乡村，青年、乡贤回农村）、\"三变\"改革（资源变资产、资金变股金、农民变股东）引导多元投入，全省累计建成 82 条产值超 10 亿元的农业全产业链 [SD34]。\n\n### 长期政策执行的支撑条件\n\n长期政策最怕\"换届就变\"。千万工程二十余年不辍，靠的是三个支撑：一是**一张蓝图绘到底、一任接着一任干**的政治承诺与考核延续，浙江历届省委、省政府按同一战略擘画持续深化 [SD32][SD34]；二是**规划先行**，先编规划再干建设，避免\"一任领导一个思路\" [SD34]；三是**以现场会等制度化载体反复校准**，把每年推进情况摆到面上比拼 [SD33][SD34]。这与 [A02 政策执行与执行偏差] 中\"执行是再决策过程\"的判断相印证：二十年间执行内涵多次再定义（整治→美丽→未来共富），但顶层目标从未漂移。\n\n### 实施证据（官方统计，均为政府或官方媒体自报口径）\n\n- **收入与城乡差距**：2022 年浙江城乡居民人均可支配收入分别为 71268 元、37565 元，城乡收入倍差由 2003 年的 2.43 缩小到 2022 年的 1.90；浙江农村居民人均可支配收入连续 38 年居全国省区第一 [SD31][SD34]。\n- **人居环境**：规划保留村生活污水治理覆盖率 100%，农村卫生厕所全覆盖，农村生活垃圾基本实现\"零增长\"\"零填埋\"，全省 90% 以上村庄建成新时代美丽乡村 [SD34]。\n- **乡村经济与治理**：2022 年全省村级集体总资产 8800 亿元（约占全国 1/10），集体经济年经营性收入 50 万元以上的行政村占比 51.2%；县级以上民主法治村占比 90% 以上 [SD34]。2018 年 9 月获联合国\"地球卫士奖\" [SD34]。\n- **全国推开**：2023 年 10 月全国学习运用\"千万工程\"经验现场推进会在杭州召开 [SD36]；2024 年中央一号文件以\"学习运用'千万工程'经验……推进乡村全面振兴\"为题 [SD30]；农业农村部 2024 年全国乡村建设工作推进会明确以学习运用\"千万工程\"经验为引领推进宜居宜业和美乡村建设，并要求\"自下而上、农民参与\"的实施机制 [SD35]；2025 年底中央农村工作会议继续把\"千万工程\"经验作为乡村全面振兴的总抓手性提法 [SD37]。\n\n### 政策目标与实际效果的区分\n\n- **目标**（规范性表述）：改善农村生产生活条件、推进城乡一体化、建设宜居宜业和美乡村 [SD30][SD32]。\n- **官方通报成效**：上述收入、环境、集体经济数据 [SD31][SD34]。\n- **尚需区分的部分**：这些数据证明浙江乡村整体进步，但\"千万工程\"对各项指标的独立贡献未做因果剥离——浙江本就处于全国发展前列，收入倍差缩小有多重原因；联合国奖项与\"最受农民欢迎的实事\"属官方叙事口径 [SD33][SD34]。引用时应表述为\"官方通报的成效数据\"，不宜写成\"经评估证明的因果效应\"。\n- **复制推广条件的讨论**：官方文件本身划出了条件边界——《关于有力有序有效推广浙江\"千万工程\"经验的指导意见》提出\"三不\"底线：**不超越发展阶段**（把握好整治力度、建设深度、推进速度与财力承受度、农民接受度的关系），**不搞形象工程**，**不搞强迫命令**，并要求区分发达地区和欠发达地区、结合地方财政承受能力推进 [SD33]。这实际上承认了推广受财政能力与发展阶段约束。[存疑] 学界对复制推广的实证讨论（如各地财政差异下推广效果的量化评估）本次未检索到可核验的公开研究成果，本知识库不作具体引用；答题时可稳妥使用官方\"三不\"表述。2023 年中央一号文件关于农村人居环境整治提升的部署（厕所革命、污水垃圾治理）即为学习运用该经验的全国化安排 [SD38]。\n\n### 可迁移经验与不可迁移部分\n\n**可迁移**：①问题导向的小切口启动（从环境整治切入）；②\"一把手\"负责＋部门协同＋分级落实的领导体制；③一张蓝图绘到底、分阶段迭代的规划方法；④农民主体、群众满意度评判的标准设定；⑤试点示范、由点及面的推广路径 [SD31][SD32][SD33]。\n\n**不可简单照搬**：①浙江的财政能力、民营经济基础与城乡差距水平全国领先，资金投入强度不可比；②\"千万工程\"启动于习近平总书记亲自谋划的特殊政治势能，各地难以复制同等力度的一把手持续推动，需转化为制度化机制而非个人依赖；③浙江先发地经历了二十年的经济积累，后发地区不能跳过发展阶段追求\"未来乡村\"形态——这正是官方\"不超越发展阶段\"底线所警示的 [SD33][SD34]。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：材料常给\"某地学千万工程搞大拆大建、负债造景\"，可用 [A02] 的执行偏差框架归因：违反\"因地制宜、分类施策\"与\"不超越发展阶段\"底线 [SD33]，对策答\"规划先行、量力而行、农民主体\"。\n- **申论/面试**：\"千万工程\"是乡村振兴类题目的最高频案例库，记住\"三个阶段名称＋三个机制（一把手抓、农民主体、久久为功）＋一组数据（城乡倍差 2.43→1.90）\"即可支撑作答 [SD31][SD33]。\n- **对比题**：可与 [D02 河南紧密型县域医共体] 对比——两者同为\"由点及面、迭代升级\"的长期工程，但医共体靠医保支付杠杆驱动，千万工程靠党政考核与财政投入驱动，政策工具差异明显。\n\n**原创练习（思考题）**\n1. \"千万工程\"二十年三阶段的目标话语（示范引领→深化提升→迭代升级）体现了长期政策执行中的什么机制？若换成每届政府另立目标会有什么后果？\n2. 中央推广指导意见为何要划\"三不\"底线？结合财政能力与发展阶段差异，说明\"经验\"与\"样板\"的区别。\n3. 若你所在县财政紧张但被要求学习\"千万工程\"，你会如何设计本地的\"小切口、可持续\"方案？\n\n### 来源说明\n\n本专题 9 条来源均于 2026-10-18 逐条抓取核实全文：中央文件取中国政府网原文页，权威报道取新华网/共产党员网原文页（共产党员网转载新华社与中共浙江省委署名文章）。所有数据均为官方或官方媒体自报口径，正文已注明；学界实证研究空白如实标注 [存疑]，未作推断。\n\n## 来源与证据\n\n- [SD30] 《中共中央 国务院关于学习运用\"千村示范、万村整治\"工程经验有力有效推进乡村全面振兴的意见》（2024 年中央一号文件），2024-02-03，中国政府网。[官方]\n- [SD31] 《造就万千美丽乡村 造福万千农民群众——\"千万工程\"二十年启示录》，新华社，2023-06-25。[官方]\n- [SD32] 《学习浙江\"千万工程\"经验案例》，共产党员网（《同学》工作室），2023-06-20。[官方]\n- [SD33] 《造就万千美丽乡村 造福万千农民群众——中央财办、中央农办负责人就〈关于有力有序有效推广浙江\"千万工程\"经验的指导意见〉答记者问》，新华社（共产党员网转载），2023-07-05。[官方]\n- [SD34] 中共浙江省委：《在深入践行\"千万工程\"上走前列作示范》，共产党员网转载，2023-06-16。[官方]\n- [SD35] 《农业农村部召开全国乡村建设工作推进会强调 以学习运用\"千万工程\"经验为引领 扎实有力推进宜居宜业和美乡村建设》，农业农村部网站（中国政府网），2024-11-07。[官方]\n- [SD36] 《刘国中强调：学习运用\"千万工程\"经验 扎实稳步全面推进乡村振兴》，新华社（中国政府网），2023-10-13。[官方]\n- [SD37] 《中央农村工作会议关键提法之三：\"千万工程\"经验》，新华网，2026-01-04。[官方]\n- [SD38] 《中共中央 国务院关于做好 2023 年全面推进乡村振兴重点工作的意见》（2023 年中央一号文件），2023-02-13，中国政府网。[官方]\n\n## 关联专题\n\n- [[A02]]：千万工程是\"长期执行不走样\"的正面对照案例，其阶段化执行即\"执行是再决策过程\"的体现。\n- [[A01]]：工程后半程的\"善治乡村\"\"三治融合\"是基层治理的乡村场景。\n- [[D02]]：同为多阶段长期工程，政策工具与驱动机制可对比。\n", "D05-城市社区嵌入式公共服务.md": "\n# D05 城市社区嵌入式公共服务：设施建设工程、运营模式与可持续性\n\n## ⚡ 快速知识卡\n\n城市社区嵌入式服务设施，指利用社区（小区）公共空间、房屋和场地，面向居民提供养老托育、社区助餐、家政便民、健康服务、体育健身、文化休闲、儿童游憩等一种或多种服务的设施，特点是小型灵活、公益普惠、集成便捷 [SD40]。政策主线：2023年11月国办转发发改委《城市社区嵌入式服务设施建设工程实施方案》（国办函〔2023〕121号），规划\"50个左右试点城市×每市100个左右社区\"，到2027年向更多城市推开 [SD40]；2024年9月三部门将56个城市纳入建设范围 [SD42]。核心机制：\"补改一批、转型一批、划转一批、配建一批\"盘活存量空间 + 公建民营、民办公助等普惠化运营 [SD40]。适用于申论\"社区服务/一老一小/民生实事\"类对策题与面试综合分析题。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 一、背景与问题定义\n\n中国有65%以上的人口生活在城市，居民主要生活在社区，能否在\"家门口\"享受优质普惠公共服务，被国家发改委社会发展司司长刘明称为\"既是'关键小事'，更是'民生大事'\" [SD43]。问题压力主要来自三方面：\n\n1. **老龄化加速**。截至2023年末，全国60周岁及以上老年人口29697万人、占总人口21.1%，65岁及以上21676万人、占15.4%，65岁及以上老年人口抚养比22.5% [SD45]；我国已进入中度老龄化社会。约九成老年人居家养老，助餐、助浴、日间照料等居家社区服务需求集中爆发。\n2. **托育缺口**。\"十四五\"规划《纲要》将\"每千人口拥有3岁以下婴幼儿托位数\"设为主要指标之一；超过三成的婴幼儿家庭存在强烈入托需求，就近托育供给不足 [SD46 附注：该需求判断出自发改委刊文转述]。2025年全国千人口托位数达4.73个、托位666万个，供给仍处于补缺口阶段 [SD46]。\n3. **社区服务设施不足**。老旧小区普遍缺乏养老、托育、助餐空间；官方明确要求落实\"每百户居民拥有社区综合服务设施面积平均不少于30平方米，有条件的城市不少于80平方米\"，并强调\"避免以行政办公功能替代为民服务功能\" [SD40]——说明此前社区空间被行政占用、服务功能缺位是普遍痛点。\n\n### 二、核心机制：政策框架与设施布局运营\n\n**（1）顶层政策框架。** 2023年11月19日，国务院办公厅转发国家发改委《城市社区嵌入式服务设施建设工程实施方案》（国办函〔2023〕121号）[SD40]；2024年1月，发改委、住建部、自然资源部印发《城市社区嵌入式服务设施建设导则（试行）》（发改社会〔2024〕5号）作为技术规范 [SD41]；2024年9月，三部门印发《关于扎实推进城市社区嵌入式服务设施建设工程的通知》，将江苏省苏州市等56个城市纳入工程建设范围，要求聚焦\"一老一小\" [SD42]。配套层面，民政部等11部门2023年10月印发《积极发展老年助餐服务行动方案》（民发〔2023〕58号），将老年助餐设施纳入一刻钟居家养老服务圈、便民生活圈建设 [SD44]。\n\n**（2）试点布局。** 实施方案要求优先在城区常住人口超过100万人的大城市推进，选择50个左右城市试点、每个试点城市选择100个左右社区先行试点；到2027年总结经验后向更多城市稳妥推开 [SD40]。试点城市原则上应为城区常住人口超百万的大城市，以党委政府重视、建设运营方案可行等为遴选条件；先行试点社区由城市自主确定，优先选\"一老一小\"需求集中、具备持续运营条件的社区 [SD43]。2024年9月公布的56城名单为工程实际建设范围（完整名单未在公开报道中逐项列出，本文不作转述）[SD42]。\n\n**（3）空间从哪来：\"四个一批\"。** 按\"补改一批、转型一批、划转一批、配建一批\"原则开展场地空间拓展攻坚：拆除腾退老旧小区空间、整合社区用房、产权置换、征收改建补建设施；引导产权人将闲置房屋转型为服务设施；经国有资产管理程序将国有房产划转社区使用；新建社区严格落实\"同步规划、同步建设、同步验收、同步交付\"配建 [SD40]。用好城市\"金角银边\"，盘活闲置厂房、仓库、商业设施等存量资源 [SD40]。用地支持包括：政府建设的设施作为非营利性公共服务设施5年内不变更土地用途；存量建筑改造享受5年内不改变用地主体和规划条件 [SD40]。\n\n**（4）运营模式：普惠化而非免费化。** 官方定调是\"精准化服务、普惠化运营\"：通过市场化择优、委托经营向运营主体提供低成本场地，运营主体按服务成本加合理利润提供价格普惠服务及其他公益性服务；探索专业机构连锁化、托管式运营，构建\"街道—社区—小区\"服务体系；鼓励事业单位、社会组织、志愿团队、社区物业、家政公司多元参与 [SD40]。发改委负责人明确提出要避免\"建设轰轰烈烈，服务冷冷清清\"，用市场竞争机制实现服务进退，\"根据老百姓满意度决定谁来服务\" [SD43]。资金上统筹中央预算内投资（含积极应对人口老龄化工程和托育建设专项）、地方财政、地方政府专项债券等多渠道 [SD40]。\n\n**（5）供需匹配机制。** 服务项目选择坚持需求导向：试点前开展城市体检，把小区、社区列为体检单元，查找养老服务、婴幼儿照护、公共活动场地等设施短板，建立问题台账，再\"按需精准嵌入\"，避免\"一刀切\" [SD40][SD43]。优先保障婴幼儿托位和护理型养老床位的必要空间 [SD40]。\n\n### 三、实施证据（官方通报与地方实践）\n\n- **国家层面**：2024年9月56城纳入建设范围 [SD42]；托育方面，2025年全国千人口托位数4.73个，新增普惠托位89万个，托育机构12.6万家、托位666万个，\"十四五\"以来托位增幅132% [SD46]。\n- **河南郑州**：2025年郑州市政府工作报告载明，郑州\"入选全国首批城市社区嵌入式服务设施建设工程建设范围\"，城市\"15分钟养老生活圈\"基本建成，运营老年助餐场所645家、累计服务200万人次，普惠托育每千人托位达4.8个 [SD47]。这是河南城市进入该工程首批建设范围的直接官方证据（56城完整名单未逐项公开转述，以政府工作报告表述为准）。\n- **河南老年助餐（嵌入式服务的重要场景）**：2024年老年助餐列入河南省十项重点民生实事，年度目标是建成7300个以上老年助餐场所、覆盖40%的城镇社区和10%的行政村；截至2024年9月已布局6818个、下达补助资金2.24亿元（省级补助额70%以上）[SD48]。各地探索了济源\"供销社+老年助餐\"、安阳\"中央厨房+移动餐车\"、濮阳\"物业+助餐\"、信阳\"幸福大巴\"、鹤壁\"养老机构+食堂\"\"餐饮企业+食堂\"等模式 [SD48]。2025年12月，河南省人大常委会通过《河南省发展老年助餐服务规定》（19条\"小快灵\"立法，2026年1月1日施行），以地方立法固化助餐服务的场所布局、多元运营和补贴机制；截至2024年底河南60岁及以上人口已达2038万人，全省建成老年助餐服务设施8367个（城市3592个、农村4775个）[SD49]。\n\n### 四、政策目标与实际效果：须区分的几个层面\n\n- **目标 vs 已实现**：官方目标是2027年总结试点经验后推开 [SD40]；56城名单公布（2024年9月）只是建设范围的确定，尚不等于设施建成、更不等于服务可持续。郑州报告中的助餐、托位数据 [SD47] 属官方自报的地方进展，全国层面的工程整体进度评估未见系统性第三方公开报告——**如实说明：目前缺乏独立的第三方评估数据，效果判断应保留余地**。\n- **运营可持续性是公认难题**：河南日报报道直言老年助餐\"利润率低，服务经营压力大、可持续性不足\"，洛阳涧西区某社区养老服务中心仅\"初步实现微利经营\"，常有顾客担忧\"这么便宜，够本吗\" [SD48]；省人大监督调研也承认\"可持续运营难度较大、服务监管有待加强\" [SD49]。老年助餐依赖\"个人出一点、企业让一点、政府补一点、集体添一点、社会捐一点\"的多元筹资 [SD44]，本质上是财政与社会资源持续输血下的准公共品。\n- **政府自评与真实满意度之间有距离**：各地通报多为设施数量、覆盖率等投入型指标（建成多少个、覆盖多少社区），居民使用率、服务质量和满意度等结果型指标披露较少；答题时引用数据应注明\"官方通报口径\"。\n\n### 五、现实治理难题\n\n1. **资金**：中央预算内投资只能\"引导支持\"，大头靠地方财政与专项债 [SD40]；在地方财政承压背景下，运营补贴能否持续是最大变量（河南2.24亿元补助属省级全力投入，但8367个设施的长期运营费用远大于建设补助）[SD48][SD49]。\n2. **物业空间**：老旧小区空间稀缺，\"四个一批\"腾挪空间依赖产权协调、消防安全验收等环节，方案为此给了5年土地用途不变等过渡政策 [SD40]，但落地周期长。\n3. **专业人才**：养老护理、托育从业人员缺口大、待遇低、流失率高；养老服务人才培养近年才加强（2023年全国高校新增护理学、养老服务管理等专业点34个）[SD45]。\n4. **普惠与盈利的平衡**：价格高了居民不来、价格低了机构活不下去；官方解法是\"低成本场地+微利经营+多元业态反哺\"（如允许设置公益便利店、助餐等微利业态），并要求避免把设施做成纯商业或行政空间 [SD40][SD43]。河南做法是按等级和服务人次精准补贴（洛阳对A级至5A级机构分别给予年1万—5万元运营补贴，并按服务人次给激励）[SD48]。\n\n### 六、与考试能力的关联\n\n- **申论对策题**：社区\"一老一小\"服务、民生实事类题目可直接套用\"空间从哪来（四个一批/存量盘活）—钱从哪来（中央预算内投资+专项债+多元筹资）—谁来运营（公建民营、市场化择优、连锁化托管）—如何可持续（微利经营+业态反哺+精准补贴）\"四段框架，且每段都有可引用的官方机制表述 [SD40][SD43]。\n- **面试综合分析**：对\"社区食堂关门潮\"\"普惠托育贵\"等现象，可用\"政策目标—运营现实\"的区分框架归因，避免一味颂扬或唱衰；\"金角银边\"\"离家不离社区\"\"最后一米/最后一公里\"等官方表述可作亮点引用 [SD43][SD45]。\n- **数据引用注意**：老年人口、托位等数字均有官方出处 [SD45][SD46]，可放心引用；郑州地方数据引用时注明\"2025年郑州市政府工作报告\" [SD47]。\n\n### 七、原创练习（思考题）\n\n1. 某市社区食堂开业时老人排队，一年后因客流量不足关闭，网络上出现\"惠民工程成摆设\"的质疑。请运用\"目标—效果\"区分框架，分析其可能的运营成因并提出两条可持续对策。（提示：多元筹资机制、业态复合反哺、按人次精准补贴）\n2. 结合河南\"供销社+老年助餐\"\"物业+助餐\"等模式 [SD48]，谈谈嵌入式服务中政府、市场、社会多元主体各自的功能边界与协同机制。\n3. 对比\"新建独立养老机构\"与\"社区嵌入式养老托育设施\"两种供给路径的优劣，说明国家为何选择\"嵌入式\"作为主打方向 [SD40][SD43]。\n\n### 来源说明\n\n本专题优先引用国办、发改委、民政部原文文件与新华社、政府工作报告等官方文本，全部来源经 2026-10-18 实际抓取核验（详见\"来源与证据\"）。56城完整名单未在抓取到的公开报道中逐项列出，故不作转述；工程整体效果缺乏独立第三方评估，相关判断均标注为官方自报口径或存疑事项。\n\n## 来源与证据\n\n- [SD40] 《国务院办公厅关于转发国家发展改革委〈城市社区嵌入式服务设施建设工程实施方案〉的通知》（国办函〔2023〕121号），2023-11-19。[官方]\n- [SD41] 《城市社区嵌入式服务设施建设导则（试行）》印发通知（发改社会〔2024〕5号），国家发展改革委、住房城乡建设部、自然资源部，2024-01-03。[官方]\n- [SD42] 《扎实推进城市社区嵌入式服务设施建设工程》，国家发展改革委网站（政研室），2024-09-27：56个城市纳入建设范围。[官方]\n- [SD43] 《让群众在\"家门口\"享受优质服务——相关部门解读城市社区嵌入式服务设施建设》，新华社（中国政府网转载），2023-11-27。[官方]\n- [SD44] 《民政部等11部门：计划到2025年底老年助餐服务网络形成一定规模》（《积极发展老年助餐服务行动方案》，民发〔2023〕58号），新华社/新华网，2023-10-24。[官方]\n- [SD45] 《2023年度国家老龄事业发展公报》，民政部、全国老龄办，2024-10（中国政府网PDF）。[官方]\n- [SD46] 《2025年全国千人口托位数达到了4.73个》，中宏网（转述国家卫健委新闻发布会），2025-12-26。[综合]\n- [SD47] 《2025年郑州市政府工作报告》，郑州市人民政府（郑州市城乡建设局网站转载），2025-02-13。[官方]\n- [SD48] 《社区食堂：让老人从舌尖暖到心尖》，河南日报（新华网转载），2024-09-26。[综合]\n- [SD49] 《河南省人大常委会以小切口监督\"小快灵\"立法托起老年人幸福\"食\"光》，中国人大网（北京人大网转载），2025-12-11。[官方]\n\n## 关联专题\n\n- [[A04]]：政策工具组合在社区服务中的应用——嵌入式工程是\"供给型工具（设施建设）+环境型工具（用地、税费）+需求型工具（消费补贴）\"组合的典型样本。\n- [[A03]]：公共服务重心下移、公建民营等供给方式改革与本工程互为表里。\n- [[D01]]：同为官方工程类专题，其\"目标—效果区分\"\"自报数据须标注口径\"的处理方式与本专题一致。\n", "D06-河南基层网格化治理与数字赋能.md": "\n# D06 河南基层网格化治理与数字赋能：机制、证据与\"指尖上的形式主义\"风险\n\n## ⚡ 快速知识卡\n\n网格化治理按标准把城乡划分为单元网格、配备网格员，依托统一数字平台形成\"上报—受理—分派—处置—反馈\"的事件流转闭环；河南近年主推\"党建+网格+大数据\"，郑州提出\"十个一\"党建引领网格化高效能治理体系，把综治中心规范化建设作为实体枢纽 [SD51][SD52][SD53]。数字赋能在主动发现问题、闭环处置上有真实作用，但同样存在被考核指标异化的风险——过多政务 App、工作群、打卡留痕催生\"指尖上的形式主义\"，中央已从 2023 年若干意见、2024 年若干规定到 2026 年政务 App 管理办法持续纠治 [SD54][SD55]。实际用途：案例分析、对策题、面试综合分析的河南本土素材。适用条件与局限见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n传统基层治理以\"条线\"为主：部门各管一摊，基层\"看得见的管不着、管得着的看不见\"，问题发现靠群众投诉和运动式排查。网格化管理起源于城市综治与城管实践，国家推荐性标准《城乡社区网格化服务管理规范》（GB/T 34300-2017）将其界定为：依托统一数字化平台，把辖区划分为若干单元网格，每格配备网格员，负责民情收集、事项代办、矛盾劝调等，实现\"同一套网格、同一支队伍、管多种事情\"。其理论意义在于以\"网格\"为最小治理单元重新组合人、地、事、物、组织五要素，是 [A01 基层治理现代化] 中\"精细化治理\"的技术载体。2025 年 5 月习近平总书记在河南考察提出加强社会治理、推动高效能治理后，河南把\"党建+网格+大数据\"作为全省性治理模式推进 [SD52]。\n\n### 核心机制\n\n**网格划分与队伍。** 城市一般以居民小组或住宅小区、农村以自然村为基本单元划分综合网格，人流密集、风险集中的区域另设专属网格；网格内配备专职或兼职网格员，形成\"社区党组织—网格党支部—党员中心户\"的组织架构 [SD51]。\n\n**事件流转闭环。** 以郑州\"十个一\"体系为例：党建网、政务网、视联网、物联网等\"多网融合\"实现\"一屏观全域\"，网格化平台作为城市运行智能中枢，对法定职责清晰的事项实行\"基层（群众）发现—一键上报—智能分派—联动处置—结果反馈—综合评价\"的全过程在线闭环；群众侧通过\"郑好拍\"等渠道接诉即办 [SD51]。政法条线的对应枢纽是综治中心：河南推动县级综治中心规范化建设、群众\"最多跑一地\"，基层形成\"网格排查+源头预防+就地化解\"的闭环机制 [SD53]。事件闭环的关键设计是\"分级响应、协同治理\"——网格解决不了的按事项类型自动上升分派到街道、区、市，避免层层截访式转办。\n\n**数字平台。** 河南的实践特点是以党建为轴整合多个平台：省级层面推动\"党建+网格+大数据\"，市级依托\"城市大脑\"、政务云建设防洪排涝、城市运行等专项感知与调度平台（郑州\"一网统管\"），把网格上报、12345 诉求、物联感知数据汇聚到统一中枢 [SD51][SD52]。\n\n### 实施证据（官方自报与独立评估分列）\n\n- **官方自报**：郑州\"十个一\"体系及闭环流程来自郑州市委书记在《人民日报》的署名文章 [SD51]；河南省委书记在《求是》撰文称\"党建+网格+大数据\"取得明显成效，但同文自陈\"先进技术赋能社会治理有待加强、群众参与积极性调动不够\" [SD52]。光山县七星湖社区个案称年内摸排矛盾纠纷 24 起并全部化解 [SD53]——这是单一社区自报数据，不能外推为全省普遍规律。\n- **独立评估**：针对河南网格化治理的严格独立实证研究（如基于试点差异的因果评估）在写作时未检索到可公开核验的成果；有以郑州为案例的研究指出当前存在党建与网格融合度不足、体制机制待优化、网格员队伍建设薄弱等挑战（相关研究见知网等学术平台，具体评估数据未获权威公开全文，此处仅作方向性提示，不引用具体数字）。因此对本专题成效的判断应以机制描述为主、慎引自报统计。\n\n### 数字赋能的实际效果与\"指尖上的形式主义\"负担风险\n\n数字平台确实改进了问题发现（传感器和网格巡查替代被动等待）与责任追踪（留痕可查）。但同一套技术也极易异化为负担来源：强制下载推广、打卡签到、积分排名、过度留痕、以群代干（\"从群里来、到群里去\"）等。2020 年起中央即开展\"指尖上的形式主义\"专项整治；2023 年 12 月中央网信委印发《关于防治\"指尖上的形式主义\"的若干意见》，2024 年 7 月中央政治局会议再次强调，2024 年 8 月中办国办《整治形式主义为基层减负若干规定》专章规范政务应用程序管理，2026 年国办印发《政务移动互联网应用程序规范化管理办法》，建立备案、抽查、撤销备案与暂停经费的监管闭环 [SD54][SD55]。典型案例显示基层曾\"每天辗转近 30 个工作群、约三分之一工作时间处理群消息\"，整治后精简合并 [SD54]。这说明：数字赋能的净效果取决于配套的准入审查与考核改革，不是\"上了平台\"就自动增效。\n\n### 政策目标与实际结果、适用条件\n\n- **目标**：全域覆盖的网格体系＋一网统管平台＋闭环处置（规范性目标）[SD51][SD52]。\n- **可核验结果**：平台建成与机制运转有公开报道支撑；处置时效、矛盾化解率等结果指标目前以地方自报为主，缺乏独立口径。\n- **适用条件**：网格化＋数字平台更适用于人口密集、事项量大、财政可负担平台建设运维的地区；对财政薄弱、网格员待遇与稳定性差的地区，易出现\"有格无人\"\"有平台无数据\"。闭环有效的前提是\"吹哨\"之后部门真报到——这依赖 [A09 基层权责匹配] 的清单制度兜底，否则网格只是新增一层上报负担。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：给\"网格员沦为填表员\"\"App 打卡泛滥\"类材料，用\"技术工具—考核激励—权责配置\"三层归因（对应 [A02 政策执行与执行偏差]），对策写\"准入备案＋清单定责＋考核改革\"而非\"再建一个平台\"。\n- **对策题**：提升基层治理效能＝党建引领（组织嵌入网格）＋数字赋能（一网统管）＋减负增效（整治指尖形式主义）三位一体。\n- **面试**：辩证分析数字治理，引用中央从\"若干意见\"到\"管理办法\"的制度演进体现政策敏感度 [SD55]。\n\n**原创练习（思考题）**\n1. \"网格发现—一键上报—智能分派—联动处置—反馈评价\"闭环中，最容易出现执行偏差的环节是哪个？为什么？\n2. 数字平台在什么条件下是治理赋能、什么条件下异化为\"指尖上的形式主义\"？试给出判别标准。\n3. 若评估某市网格化治理对矛盾纠纷化解率的影响，官方自报数据有何局限？如何改进评估设计？\n\n### 来源说明\n\n本专题来源均经 2026-10-18 抓取核实。任务给定的起始线索 https://hrss.henan.gov.cn/2025/02-13/3123157.html 抓取失败（http_error），未能核实内容，已在来源登记中如实注明并替换为人民日报、《求是》、中国长安网、中央纪委国家监委网站等可核验来源；河南官方原文页占比达标。未检索到针对河南网格化治理的独立因果评估，正文已如实说明。\n\n## 来源与证据\n\n- [SD50] 河南省人社厅网站文章（起始线索），2025。抓取失败未核实，未引用内容。[存疑]\n- [SD51] 安伟《党建引领网格化高效能治理》，人民日报 2025-12-29（中国共产党新闻网转载）。[官方·自述口径]\n- [SD52] 刘宁《坚定信心推动高质量发展高效能治理》，《求是》2025 年第 16 期。[官方·自述口径]\n- [SD53] 《河南省信阳市光山县：让为民解忧之光照耀每个角落》，中国长安网，2025-12-17。[官方]\n- [SD54] 《卸下\"指尖\"负担 树立实干新风》，中央纪委国家监委网站，2025-11。[官方]\n- [SD55] 国家网信办就《政务移动互联网应用程序规范化管理办法》答记者问，共产党员网，2026-01-29。[官方]\n\n## 关联专题\n\n- [[A07]]：网格化治理中居民、网格员、下沉部门的角色与利益分析。\n- [[A01]]：网格化是精细化治理的机制载体。\n- [[C07]]：河南本土治理案例的作答转化。\n", "D07-河南南阳基层减负与履职事项清单实践.md": "\n# D07 河南南阳基层减负与乡镇（街道）履职事项清单实践\n\n## ⚡ 快速知识卡\n\n基层减负的政策脉络是从\"减少文山会海\"深化到\"厘清权责边界\"：2024 年 2 月起全国 3.8 万个乡镇（街道）编制履职事项清单，2025 年 6 月底全部完成，平均每地 340 项，分基本履职、配合履职、上级部门收回\"三张清单\" [SD61]；2026 年 5 月中办国办再出《具体措施》，把清单定为考核基本依据、严禁\"条条干预\" [SD62]。河南南阳的做法是\"减负＋赋能\"双向发力：下放处罚权的同时建承接机制 [SD60]；郑州完成 193 个乡镇（街道）清单编制并清理工作群、标牌 [SD63]。核心考点是清单制的机制逻辑（以事定责、以责定考核）与局限（清单外变相摊派、减负反弹）。适用题型：案例分析、对策题、面试综合分析。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n乡镇（街道）是国家治理\"神经末梢\"，但长期处于\"权小责大\"状态：上级部门以属地管理名义把任务、考核、问责层层下压，基层\"接不住、管不了、管不好\"，出现\"小马拉大车\"问题。党的二十届三中全会明确提出\"制定乡镇（街道）履行职责事项清单，健全为基层减负长效机制\"；2024 年 8 月中办国办《整治形式主义为基层减负若干规定》把减负从作风建设提升为制度安排。清单制的思路不是简单减数量，而是重划县乡权责：把上级转嫁的事项\"物归原主\"，把基层必须干的\"列细列明\"，把需要配合的\"分清主次\"——这是 [A09 基层权责匹配] 的制度化落地。\n\n### 核心机制：三张清单\n\n按中央编办部署（2024 年 2 月起，试点—先行—全面推开三阶段），由乡镇（街道）自下而上编制三张清单 [SD61]：\n\n1. **基本履职事项清单**：乡镇（街道）职责范围内必须全面承担的事项，覆盖党的建设、经济发展、民生服务、平安法治等主责主业，重点抓\"保民生、保安全、保底线\"（中央明确 53 项兜底事项）。\n2. **配合履职事项清单**：县直部门牵头、乡镇配合的事项，目的在分清县乡主次责任、理顺责任链条——部门必须提供培训、人员、资金、装备等保障。\n3. **上级部门收回事项清单**：把基层接不住、管不了、管不好的事项（如特种设备监管、建设项目环评审批）收回上级部门，中央编办会同有关部门明确 965 项收回事项参考目录。\n\n程序上采取\"三上三下\"听取意见（清单初稿在乡镇、县直部门、县级党委政府间三轮往返征询）、研究论证审定发布。2026 年 5 月《具体措施》补上\"用\"的环节：考核以基本履职清单为基本依据，不得以上级收回事项考核基层；配合事项失职由上级部门承担主责，乡镇已正确履行配合职责的不追责；除党中央国务院及省级统一部署外，上级不得把清单外职责擅自或变相下放；机构编制部门畅通\"12310\"举报 [SD62]。\n\n### 河南/南阳实践\n\n- **南阳**：中央社会工作部网站刊文介绍，南阳聚焦破解\"小马拉大车\"、注重减负赋能双向发力：按\"依法下放、宜放则放\"原则深化乡镇（街道）管理体制机制改革，赋予乡镇 61 项、街道 45 项行政处罚权，同时建权力下放承接机制、加强培训指导，各乡镇（街道）设综合行政执法大队，破解\"看得见的管不着、管得着的看不见\"，并推动资源服务下沉、加强社区工作者队伍建设 [SD60]。注意：该文由南阳市委社会工作部提供内容，属官方自述，未附第三方评估。\n- **郑州**：《人民日报》年终报道，郑州完成全市 193 个乡镇（街道）履职事项清单编制，厘清县乡职责边界；依托\"城市大脑\"实现非接触考核，考核指标精简率 73.89%；西大街街道上级收回 14 类 86 项事项，同步清理 30 多块标牌、30 多个工作群，干部从\"围着材料转\"转向\"围着群众干\" [SD63]。数据均为地方自报口径。\n- 河南省级层面在 2026 年省政府工作报告中确认\"全面建立和执行乡镇（街道）履职事项清单，持续整治形式主义为基层减负\"，表述为全省性制度安排已建立，但报告未公布分市执行数据。\n\n### 政策目标、官方自报与实际结果的区分\n\n- **目标**：2024—2025 年完成全国清单编制（已实现，属程序性目标）[SD61]；实质目标是县乡权责重塑与减负长效化。\n- **官方自报**：清单平均 340 项（基本 117、配合 99、收回 124），配合与收回事项占 65.6%，取消一批无实质意义的信息报送、创建示范、评比考核，解决 60 多项县乡扯皮的\"老大难\"问题 [SD61]——口径为中央编办汇总各地上报，无独立核查。\n- **尚不明确**：减负是否可持续（反弹风险）、基层实际时间分配是否改善、收回事项后上级是否真\"接得住\"，均缺乏独立跟踪评估。南阳文中\"106 项行政处罚权整体运行良好\"亦为自评表述 [SD60]。\n\n### 清单制的机制逻辑与局限\n\n**逻辑**：把\"属地管理\"从无限责任改造为\"按事项定责\"的有限责任；用清单锚定考核与问责，从源头切断\"责任甩锅\"——这与运动式减负（发文件减少文件）的本质区别在于改变的是权责结构而非数量指标 [SD62]。\n\n**局限**：①清单外变相摊派——通过\"创建\"\"试点\"\"属地配合\"等名义规避清单约束，《具体措施》禁止\"条条干预\"恰说明该问题普遍；②清单静态与任务动态的矛盾，故设\"大稳定、小调整\"的动态调整机制；③收回事项的承接能力——上级部门收回后若力量不匹配，可能出现管理空白，文件专门要求做好衔接；④考核惯性——清单能否真正改变考核指标取决于县级党委政府执行，目前缺乏刚性外部监督；⑤配合事项的责任划分在具体事故中仍可能争议（\"配合职责范围内\"的边界认定）。\n\n### 与形式主义治理的关联\n\n清单制是形式主义治理的\"供给侧\"改革：形式主义（过度留痕、多头报表、重复考核）多数源于上级任务超载与责任下移，只整治表现形式而不改权责结构，必然反弹。政策链是：三张清单定责（源头）→《整治形式主义为基层减负若干规定》规范督查考核（过程）→\"12310\"举报与巡视巡察（监督）[SD61][SD62]。备考时注意与 D06\"指尖上的形式主义\"联动：政务 App 治理是清单逻辑在数字空间的延伸。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：材料给\"乡镇干部一年签百余份责任书/迎检台账\"，归因用\"权责错配＋考核异化\"，对策用\"三张清单＋考核绑定＋条条干预禁止\"三步作答。\n- **对策题**：\"如何破解基层小马拉大车\"标准答案结构：明责（清单）→赋能（下放＋承接保障，引南阳 [SD60]）→减负（清理事项与考核改革，引郑州 [SD63]）→问责矫正（主责划分）。\n- **面试**：谈\"减负与担当\"辩证关系——减的是无谓负担，不是减责任；可引《具体措施》\"减负不是减责任\"的制度设计。\n\n**原创练习（思考题）**\n1. 三张清单分别对应怎样的县乡权责再分配？为什么收回事项不得用于考核乡镇？\n2. 清单制为何可能陷入\"边减边增\"循环？哪些制度设计在对抗这一循环？\n3. 南阳\"放权\"与\"减负\"是什么关系？放权不当会带来什么新问题？\n\n### 来源说明\n\n来源均经 2026-10-18 逐条抓取核实：起始线索（中共中央社会工作部网站南阳报道）核实成功；全国性文件与数据取中国政府网新华社原文；郑州实践取人民日报中原网转载。南阳、郑州成效数据均为官方自报口径，已在正文注明；未检索到针对河南清单实践的独立第三方评估，如实说明，不作推断。\n\n## 来源与证据\n\n- [SD60] 《河南南阳：紧盯关键环节 精准破解难题》，中共中央社会工作部网站，2025-04-14。[官方·自述口径]\n- [SD61] 《全国乡镇（街道）履职事项清单全部编制完成》，新华社（中国政府网），2025-07-30。[官方]\n- [SD62] 中办国办印发《关于用好乡镇（街道）履行职责事项清单的具体措施》，新华社（中国政府网），2026-05-19。[官方]\n- [SD63] 《在基层淬炼 以实干作答》，人民日报（中原网转载），2025-12-30。[官方·自报口径]\n\n## 关联专题\n\n- [[A09]]：清单制是权责匹配的核心制度安排。\n- [[A02]]：清单外摊派、\"条条干预\"是典型的政策执行偏差。\n- [[C07]]：基层减负类案例的作答框架。\n", "D08-全国韧性城市与城市生命线安全工程.md": "\n# D08 全国韧性城市与城市生命线安全工程：合肥模式与河南实践\n\n## ⚡ 快速知识卡\n\n韧性城市指承受适应能力强、恢复速度快的城市。2024 年 12 月中办国办《关于推进新型城市基础设施建设打造韧性城市的意见》确定目标：2027 年新型城市基础设施建设取得明显进展、2030 年建成一批高水平韧性城市，并以 CIM 平台与城市运行管理服务\"一网统管\"为技术骨架 [SD70]。城市生命线安全工程是其安全侧的先行实践：合肥 2017 年起对燃气、桥梁、管网布设物联感知设备实时监测预警，\"合肥模式\"经国务院安委办发文推广并写入国家部署 [SD73][SD74]；河南 2023 年印发三年行动方案（豫政办〔2023〕43 号），2025 年底前实现所有县（市）建成区\"三高\"区域六类监测 [SD71]；郑州\"7·20\"特大暴雨后的防洪排涝重建是河南韧性建设最直接的案例 [SD75][SD76]。考点：目标与效果的区分、监测预警的适用与局限。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n城市燃气爆炸、桥梁垮塌、管网泄漏、内涝等事故的共性是风险隐蔽在地下面与结构内部，传统\"巡查＋事故后追责\"模式看不见、防不住。2021 年郑州\"7·20\"特大暴雨暴露的正是城市生命线的脆弱性：大面积淹水断电断讯，国务院随后批复《河南郑州等地特大暴雨洪涝灾害灾后恢复重建总体规划》（规划期 2021—2024，覆盖 40 个极重和重灾县市区），明确要求按海绵城市、韧性城市要求源头减排、整治易涝点、在易涝点布设智能化感知终端 [SD75]。韧性城市理论（[A10 风险治理与韧性城市理论]）把城市能力分解为抵御、适应、恢复三重，政策上对应\"设施韧性、管理韧性、空间韧性\" [SD70]。\n\n### 核心机制\n\n**国家政策框架。** 2024 年 11 月 26 日中办国办印发《关于推进新型城市基础设施建设打造韧性城市的意见》（12 月 5 日公开发布）：到 2027 年形成一批可复制可推广经验，2030 年建成一批高水平韧性城市；重点任务包括完善城市信息模型（CIM）平台、搭建城市运行管理服务平台实现\"一网统管\"（构建国家、省、城市三级平台体系）、创新投融资机制（专项债、REITs）等 11 项；同时明确要求防止数据壁垒与重复建设、力戒形式主义 [SD70]。\n\n**城市生命线安全工程（合肥模式）。** 清华大学合肥公共安全研究院（清华、安徽省、合肥市三方共建，2016 年运行）首创\"城市生命线工程安全运行监测\"：以\"三高\"（高风险、高敏感、高后果）区域为重点布设前端感知设备，建设城市级监测中心 7×24 小时值守，联动住建、交通、应急、消防等部门形成\"精细前端感知—精准风险定位—预警协同联动\"处置流程。据建设方介绍，系统 2017 年运行以来成功预警燃气泄漏燃爆、爆管、路面塌陷、桥梁险情 6000 多起，地下管网事故发生率下降 60%、风险排查效率提高 70%；2021 年安徽省委省政府印发皖办发〔2021〕22 号在全省推广\"合肥模式\"，同年国务院安委办发文推广其经验做法 [SD73]。到 2026 年，安徽全省布设 23.6 万套感知设备、覆盖 17 万公里地下管网和 325 座桥梁，累计处置三级以上险情 3700 余起；技术已推广至全国 140 多个城市 [SD74]。\n\n**河南实施。** 2023 年 8 月省政府办公厅印发《河南省城市基础设施生命线安全工程建设三年行动方案（2023—2025年）》（豫政办〔2023〕43 号）：2023 年底前摸清风险底数、建成省市两级城市运行管理服务平台，郑州、开封、洛阳实现对中心城区\"三高\"区域燃气、排水、桥梁、热力、供水、综合管廊六类监测（其他省辖市先覆盖燃气、排水两类）；2024 年底各省辖市六类全覆盖、三分之一以上县（市）覆盖；2025 年底前所有县（市）实现对城市建成区\"三高\"区域的监测。机制上是\"市、县一体化\"，工程纳入城市运行管理服务平台同步建设，成立省长任组长的省级领导小组，并依托省属国企设立燃气、供排水桥梁供热等研究院，培育智能传感器产业链 [SD71]。\n\n**郑州暴雨后韧性建设。** 依据国函〔2022〕11 号批复的重建总体规划，郑州推进\"上拦、中蓄、下排\"防洪体系，主城区防洪标准提至 200 年一遇、金水河综合整治后防洪标准提升至 100 年一遇；建成\"郑州市防洪排涝监测预警系统一期\"（2022 年投运），汛中每分钟采集易涝点水深、流速数据，构建\"监测—预警—调度—处置—复盘\"闭环；2021 年以来实施 24 个排水管网改造项目、累计改造管网约 47.26 公里，并逐点治理 198 处易涝点 [SD75][SD76]。\n\n### 实施证据（目标／自报／独立评估分列）\n\n- **政策目标**（规范表述）：2027/2030 国家目标 [SD70]；河南 2023/2024/2025 三阶段覆盖目标 [SD71]。\n- **官方自报成效**：合肥\"预警 6000 多起、事故率降 60%\"来自清华合肥院及官方媒体，无第三方审计口径 [SD73][SD74]；郑州管网改造公里数、监测系统投运来自市政府提案答复，属自报 [SD76]。\n- **独立评估**：写作时未检索到对城市生命线工程降低事故率的严格独立因果评估（如对照城市研究）；\"地下管网事故发生率下降 60%\"为系统覆盖范围的前后对比，未排除同期其他治理投入的混杂贡献，引用时应注明口径。\n- **反面案例即原始证据**：郑州\"7·20\"灾害本身证明了\"重建设、轻韧性\"的代价，国务院灾害调查报告与重建规划构成了对原发展模式的官方反思 [SD75]。\n\n### 目标与效果的区分、数字化监测的适用与局限\n\n- **目标≠效果**：文件目标的\"显著增强风险管控能力\"尚无独立指标验证；河南方案的目标是\"监测覆盖\"，覆盖不等于预警准确、预警不等于处置闭环——监测系统若无联动处置机制与专业值守队伍，会退化为\"大屏工程\"。\n- **适用**：感知监测适用于高后果、可传感的风险（燃气泄漏、桥梁应变、管网压力、积水水位）；合肥模式有效性依赖三条件——产学研技术支撑（清华合肥院）、市政府事业单位化的监测中心（明确责任主体）、省市联动推广机制。\n- **局限**：①传感器覆盖是\"三高\"区域重点布设而非全域，非重点区域风险仍靠人工；②极端超标准事件（如\"7·20\"级别小时雨量）超过工程设防标准，监测只能提前预警、不能替代防洪工程与应急体系；③建设和运维成本高，财政弱市县可持续性存疑；④数据分散在燃气、供水等企业与部门，整合依赖打破壁垒，中央文件专门警示重复建设与数据壁垒 [SD70]。\n\n### 与河南选调/省考的关联\n\n- **案例分析**：\"某市燃气爆炸/道路塌陷\"材料，归因用\"隐蔽风险＋被动响应＋部门数据壁垒\"，对策按\"摸清底数（风险清单）→布网监测（一张网）→联动处置（闭环机制）→产业与资金保障\"四层作答，引豫政办〔2023〕43 号 [SD71]。\n- **对策题**：\"提升城市韧性\"＝工程韧性（管网提标、行泄通道）＋管理韧性（一网统管、监测预警）＋空间韧性（留白增绿、避难场所）＋制度韧性（预案与演练）。\n- **面试**：谈\"智慧城市大屏与实效\"辩证关系——数字化是手段，\"力戒形式主义\"已写入中央文件 [SD70]；可引合肥模式说明技术＋机制＋责任主体缺一不可。\n\n**原创练习（思考题）**\n1. \"监测覆盖率\"作为生命线工程的考核指标有何失真风险？你会补充哪些结果性指标？\n2. 对比合肥模式与河南三年行动方案：政府主导推广与产学研共建各有什么优劣？\n3. \"7·20\"之后郑州的韧性建设哪些属于\"恢复\"、哪些属于\"适应与学习\"？用韧性理论分层说明。\n\n### 来源说明\n\n来源均经 2026-10-18 逐条抓取核实：起始线索（中国政府网韧性城市意见）核实成功为全文原文页；河南方案采用济源示范区官网转载的省政府办公厅全文（另经中新网河南报道交叉印证，其页面正文抓取不完整已在登记注明）；合肥数据取清华大学新闻网与科技日报，均注明为建设方/官方口径；郑州数据取国家发改委规划 PDF 与市政府提案答复原文。未检索到独立第三方效果评估，正文如实说明。\n\n## 来源与证据\n\n- [SD70] 中办国办《关于推进新型城市基础设施建设打造韧性城市的意见》，新华社（中国政府网），2024-12-05。[官方]\n- [SD71] 《河南省城市基础设施生命线安全工程建设三年行动方案（2023—2025年）》（豫政办〔2023〕43号），河南省政府办公厅（济源示范区网站全文），2023-08-20。[官方]\n- [SD72] 《河南印发城市基础设施生命线安全工程建设三年行动方案》，中国新闻网河南，2023-09-04。URL 可访问，页面正文抓取不完整，仅作交叉印证。[官方]\n- [SD73] 《清华大学合肥公共安全研究院建设全国首个城市生命线安全工程》，清华大学新闻网，2021-10-18。[官方·建设方自报口径]\n- [SD74] 《事故发生率下降60%！清华合肥院科技赋能城市生命线》，科技日报，2026-08-07。[官方·建设方口径]\n- [SD75] 《河南郑州等地特大暴雨洪涝灾害灾后恢复重建总体规划》（附国函〔2022〕11号批复），国家发展改革委，2022-01。[官方]\n- [SD76] 《关于对郑州夏季暴雨积水问题治理及智慧防汛体系建设提案的答复》，郑州市人民政府办公室，2026-06。[官方·自报口径]\n\n## 关联专题\n\n- [[A10]]：韧性城市理论的政策化应用。\n- [[A01]]：城市运行\"一网统管\"与基层治理平台的衔接。\n- [[D05]]：河南政策案例库内的关联专题。\n", "D09-兰考东坝头镇共富工坊.md": "\n## ⚡ 快速知识卡\n\n兰考县东坝头镇位于黄河\"最后一道弯\"，辖 15 个行政村。该镇以党建引领盘活闲置资产，把空心院、闲置校舍改造为\"共富工坊\"，通过\"总部＋加工点\"模式引进河南海熠工艺品有限公司，形成\"孵化基地＋支部联建＋群众增收＋集体经济＋积分赋能\"五位一体机制。目前全镇已建成 13 个共富工坊，提供 2000 余个就业岗位，带动群众增收 1600 余万元。考试要点：小工坊如何撬动\"家门口就业＋集体经济＋弱势群体帮扶\"三重目标，可迁移到产业帮扶、基层党建、共同富裕等申论主题。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n东坝头镇是焦裕禄治理风沙的发起地，地处兰考县城西北 12.5 公里的黄河岸边。脱贫攻坚战收官后，镇域面临三个共性难题：一是农村\"三留守\"人员和低收入群体就业渠道窄，务农收入不稳、外出务顾不上家；二是村庄存在大量空心院、闲置校舍、闲置厂房等\"沉睡资产\"，村集体经济薄弱；三是本地缺乏劳动密集型产业支撑，帮扶车间利用率不高。如何把闲置资产、富余劳动力和外部订单三者连接起来，是该镇发展共富工坊的直接动因。开封市（兰考县为其辖县）乡村振兴系统整体思路，是利用高标准农田建设释放的农村劳动力，通过共富工坊实现\"家门口\"就业，带动脱贫群众持续稳定增收。\n\n### 二、做法与机制\n\n1. **盘活资产建平台。** 将\"三资\"清查与闲置资源盘活结合，整合 6000 余平方米空心院、闲置校舍等资产，改造为标准化共富工坊加工点；张庄村率先建成孵化基地，带动各村实现\"村村有站点\"。\n2. **村企联动引产业。** 重点引进河南海熠工艺品有限公司设总部，以\"总部＋加工点\"模式辐射全镇：企业零成本扩张产能，村集体获得资产租赁收益，形成\"政府搭台、企业唱戏、集体受益\"的多赢格局。\n3. **五位一体定机制。** 推行\"孵化基地＋支部联建＋群众增收＋集体经济＋积分赋能\"机制。各村手工培训点由妇女主任管理，企业按订单量给负责人 7% 补助、村集体 3% 分成，把管理激励与集体收益绑定。\n4. **\"共富工坊＋N\"保长效。** 联合爱心超市实行积分激励（每完成 100 元订单得 10 积分兑换生活用品，累计发放 2.4 万积分）；推动养老、助残、提技三线并进：联动日间照料中心让老人\"做手工＋享午餐\"，为残疾人开发专属岗位并定制培训，配套电商实操、消防演练，形成\"培训—就业—增收\"闭环。\n5. **品牌化升级。** 依托海熠公司深挖本土文化与藤编融合点，打造中高端手工环保藤编品牌，用新媒体传播和展会对接现代市场。\n\n### 三、成效与数据（标注来源）\n\n- 全镇已建成 13 个各品类共富工坊，提供 2000 余个就业岗位，带动群众增收 1600 余万元；下一步目标为稳定吸纳 4000 人就业（来源 [SE02]，开封日报/兰考县委宣传部稿件，2026 年）。\n- 以河南海熠工艺品有限公司为例：已在 15 个村设藤编加工点，带动近千名妇女就业，累计发放薪资 150 余万元，人均增收 1580 元，村集体增收超 10 万元（来源 [SE02]）。\n- 全县层面：截至 2024 年 8 月，兰考县已盘活闲置厂房 44 座、空闲场所 36 座、空心院 29 座，共 109 座 83775 平方米；建成共富工坊 176 家（车间式 52、厂房式 78、居家式 46），涵盖 12 个品类；累计技能培训 152 个班次、4605 人次，实现就业 3000 余人；共富工坊直接带动就业 1.2 万人，其中脱贫户、监测户 2592 人，人均月增收 2500 元（来源 [SE01]，兰考县人民政府网站提案答复，2024-08-12）。\n\n### 四、局限与争议\n\n1. **产品附加值低、同质化。** 兰考县政协提案明确指出，全县共富工坊存在\"产品附加值低、缺乏品牌效应，技术创新能力不足、产品同质化严重，缺乏专业人才\"三大问题（来源 [SE01]）。东坝头镇藤编同样处于劳动密集型代工环节。\n2. **收入水平偏低、稳定性有限。** 人均增收 1580 元是年度增量而非总收入；手工订单受市场波动影响大，\"能就业\"与\"就好业\"之间仍有差距，镇政府自身也将其列为转型方向。\n3. **依赖单一企业。** \"总部＋加工点\"模式使镇域工坊高度绑定海熠公司，企业订单波动会直接传导为群众收入波动，风险分散机制尚待完善。\n4. **村集体分红比例小。** 村集体分成 3%、站点负责人补助 7%，集体经济增益幅度有限，长效运营仍依赖政策奖补。\n\n### 五、可考角度\n\n- **常识**：共富工坊的主要形式（厂房式、车间式、居家式）；兰考所在的黄河\"最后一道弯\"地理与焦裕禄精神的时代传承。\n- **案例分析**：给定共富工坊材料，答\"党建引领＋资源盘活＋村企联动＋精准赋能＋品牌建设\"五位分析框架，并指出局限与改进方向（人才培养、产业链延伸、风险分散）。\n- **材料写作**：以\"小工坊撬动大民生\"为题，论证共同富裕不是平均主义而是机会公平，落脚在家门口就业与集体经济壮大。\n\n### 六、金句/对策\n\n1. \"小工坊连着大市场，家门口装着大民生。\"——适用于共同富裕、就业帮扶主题。\n2. \"把'沉睡的资产'变成'生金的资本'，把'农闲'变成'农忙'，把'富余'变成'富裕'。\"——适用于资源盘活、乡村振兴主题。\n3. \"政府搭台、企业唱戏、村集体参与、农民主体，四方合力才能唱好共富这台戏。\"——适用于利益联结机制主题。\n4. 对策句：推动共富工坊从\"能就业\"向\"就好业\"转变，关键在品牌化提升附加值、培训链提升技能、多元订单分散风险。——适用于对策段落。\n\n## 来源与证据\n\n- [SE01] 兰考县人民政府网站《县政协第十一届第三次会议第 0240016 号提案：关于提升兰考县\"共富工坊\"品质，助力乡村振兴的提案和答复》，2024-08-12，http://www.lankao.gov.cn/kfslkxwz/c00487/pc/content/content_1976810475155263488.html （白名单官方·县级政府网）\n- [SE02] 开封日报（开封市人民政府网站转载，兰考县委宣传部供图）《兰考县：小工坊撬动乡村共富大梦想》，2026 年，https://www.163.com/dy/article/KN7A7UJP0556IRXW.html （转载版；原文见开封日报报业集团刊发）\n- [SE03] 中新网河南《兰考县东坝头镇：\"共富工坊\"拓宽强村富民新路径》，2025-08-05，https://www.ha.chinanews.com.cn/news/zx/2025/0805/62089.shtml （媒体）\n- [SE04] 开封市人民政府网站《张庄：昔日风口变景区》，2025-01，http://221.176.159.209:9001/kfsrmzfwz/hhfz/pc/content/content_1737108225479974912.html （白名单官方·省辖市政府网，背景）\n- [SE05] 新华网《兰考县：\"田村一体、片区组团\"共绘乡村美景图》，2025-12-28，http://www.news.cn/info/20251228/12bb46d7ebdc4dc593480808e9c434a9/c.html （新华社，背景）\n\n## 关联专题\n\n- [[D10]]\n", "D10-河南防返贫监测帮扶.md": "\n## ⚡ 快速知识卡\n\n防止返贫动态监测帮扶是脱贫攻坚过渡期（2021—2025）河南守牢底线的核心机制：以家庭为单位，通过农户自主申报、干部走访排查、部门筛查预警三条线识别存在返贫致贫风险的农户（参考线 2024 年为家庭年人均纯收入 8100 元），经村级评议、乡镇审核、县级确定后纳入监测，落实产业、就业、兜底、临时救助等针对性帮扶，风险稳定消除后退出并常态化监测。可考要点：监测识别\"三线\"来源、精准帮扶\"开发式为主＋保障性兜底\"、动态管理\"应纳尽纳、应扶尽扶、稳定消除\"。2025 年河南省委一号文件将其单列为\"确保不发生规模性返贫致贫\"专章。\n\n## 📖 深度专题\n\n### 一、背景与问题\n\n2020 年底脱贫攻坚战取得全面胜利后，部分农户发展基础仍然脆弱：因病、因残、因学、因务工就业不稳、因缺劳动力或因灾因意外，都可能导致基本生活出现严重困难并带来返贫致贫风险（来源 [SE09]）。2021 年 7 月河南特大洪涝灾害叠加疫情，进一步放大风险——当年全省因洪涝灾害新增监测对象 30.06 万人（来源 [SE07]）。河南是脱贫人口大省，守住不发生规模性返贫致贫底线，是过渡期\"三农\"工作的首要任务，也是中央对各省的硬约束。\n\n### 二、做法与机制\n\n1. **制度奠基。** 2020 年河南省脱贫攻坚领导小组印发《关于建立防止返贫监测和帮扶机制的实施意见》（豫脱贫组〔2020〕13 号），确立\"事前预防与事后帮扶结合、开发式帮扶与保障性措施结合、政府主导与社会参与结合、外部帮扶与群众主体结合\"四原则（来源 [SE08]）。\n2. **三线识别。** 农户自主申报（找干部、打 12345/12317、微信\"一码通\"扫码）、乡村干部走访排查、行业部门筛查预警（医保、民政、教育、住建、水利等部门数据比对）三线并行；多地依托大数据平台比对收入、医疗支出等信息，如通许县通过大数据阳光监测平台发现因病返贫风险线索（来源 [SE07][SE09]）。\n3. **规范程序。** 村级初选（民主评议、公示）→乡镇审核（谁核查、谁签字、谁负责）→县级确定（信息比对核准）→录入全国系统动态管理（来源 [SE08]）。\n4. **精准帮扶。** 对有劳动能力者以开发式帮扶为主：产业帮扶（\"短平快\"项目、小额信贷应贷尽贷）、就业帮扶（技能培训、公益性岗位、帮扶车间）；对无劳动能力者强化低保、医保、养老保险和特困供养等综合性兜底；对因病因灾家庭及时落实临时救助，实行低保\"渐退期\"（脱贫户人均收入超低保标准但在 1.5 倍以内可给 12 个月渐退期）（来源 [SE08][SE09]）。\n5. **动态退出与常态化。** 风险稳定消除须经入户核实、评议公示、县级审核批准；消除后停止针对性帮扶但保持常态化监测，出现新困难可再次申报（来源 [SE09]）。2025 年河南省委一号文件要求\"加快建设覆盖全体农户的防止返贫致贫促乡村振兴大数据平台，完善农村常态化防止返贫致贫机制\"，并对有劳动能力的农村低收入人口开展从教育培训到促进就业的全链条一体式帮扶（来源 [SE06]）。\n6. **灾后应急机制。** 2021 年洪涝灾害后，河南及时出台《防止因灾返贫致贫巩固拓展脱贫攻坚成果若干政策措施》18 条，发放受灾人口和监测对象生活补贴每人 700 元，新增省级衔接资金 7 亿元，安排 27 名省级领导、27 个厅局联系帮扶 27 个重灾县（来源 [SE07]）。\n\n### 三、成效与数据（标注来源）\n\n- 2021 年（受灾之年）全省识别认定监测对象 19.94 万户、63.16 万人，其中 7 月洪涝灾害后新增 30.06 万人；已消除风险人数占比 39.9%；有劳动能力的脱贫人口、监测对象 223.99 万人实现应就业尽就业；免费对 4.12 万名脱贫劳动力开展技能提升培训，对 14.49 万脱贫人口开展以工代训（来源 [SE07]，《光明日报》2021-12-01）。\n- 全国层面（用于对照底线成效）：截至 2025 年 9 月底，全国累计识别帮扶的防止返贫致贫监测对象中超过 700 万人稳定消除风险，其余均已落实针对性帮扶措施，守牢不发生规模性返贫致贫底线（来源 [SE11]，农业农村部计划财务司 2025-12）。脱贫县农村居民人均可支配收入从 2020 年 12588 元增至 2025 年 18627 元，年均增速 8.2%（来源 [SE10]，人民日报 2026-08-27 报道国务院报告）。\n- 河南 2024 年监测参考线为家庭年人均纯收入 8100 元，各省辖市据此动态调整（来源 [SE09]）。[存疑] 河南 2024—2025 年监测对象最新存量与风险消除率未查到省级统一公开数，引用时需核实省乡村振兴监测中心年度通报。\n\n### 四、局限与争议\n\n1. **收入参考线的局限。** 8100 元是\"参考依据\"而非硬门槛，实际操作中对\"刚性支出骤增但收入略高\"家庭的识别依赖干部走访和部门预警，存在漏识别风险。\n2. **风险消除认定偏严偏宽之争。** 帮扶后收入\"稳定超过监测范围\"方可消除风险，但务工收入波动大，部分地方为完成指标存在风险消除偏快、返岗不稳即出列的隐忧（学界普遍讨论，属推测性提示，[存疑]）。\n3. **政策断档预期。** 2025 年过渡期结束，过渡期后如何将防止返贫致贫对象和欠发达地区纳入常态化帮扶、衔接农村低收入人口分层分类帮扶制度，机制仍在构建中（来源 [SE10]）。\n4. **开发式帮扶与兜底的边界。** 对半弱劳动能力群体，产业就业帮扶见效慢、兜底保障成本高，基层在两者间的平衡难度大。\n\n### 五、可考角度\n\n- **常识**：监测对象识别\"三线\"渠道；过渡期为 2021—2025 年；\"四个不摘\"（摘帽不摘责任、不摘政策、不摘帮扶、不摘监管）。\n- **案例分析**：给定某县因病返贫案例，按\"监测识别—精准帮扶—动态消除\"链条作答，突出数据比对预警与分层分类帮扶。\n- **材料写作**：围绕\"守底线与促振兴相统一\"立意，论述从集中攻坚到常态化帮扶的机制转型。\n\n### 六、金句/对策\n\n1. \"脱贫摘帽不是终点，而是新生活、新奋斗的起点。\"——适用于巩固脱贫成果、乡村振兴主题（习近平总书记重要论述）。\n2. \"宁可十防九空，不可失防万一；监测要'早'，帮扶要'准'，退出要'稳'。\"——适用于防返贫机制对策段。\n3. \"对有劳动能力的，帮一把、扶一程靠开发；对无劳动能力的，兜住底、兜好底靠保障。\"——适用于分层分类帮扶主题。\n4. 对策句：以大数据平台贯通部门数据壁垒，让风险线索\"自动浮出\"，以开发式帮扶增强内生动力，以社会保障体系兜牢底线，实现政策供给长效化、措施方法常规化。（据国务院 2026 年报告表述化用，来源 [SE10]）\n\n## 来源与证据\n\n- [SE06] 河南省农业农村厅网站（转河南日报）《2025 年河南省委一号文件发布：关于进一步深化农村改革扎实推进乡村全面振兴的实施意见》，2025-05-20，https://nynct.henan.gov.cn/2025/05-20/3159597.html （白名单官方·省农业农村厅）\n- [SE07] 《光明日报》2021-12-01 第 04 版《河南：帮扶很重要，产业最长远》，https://news.gmw.cn/2021-12/01/content_35350348.htm （中央媒体）\n- [SE08] 河南省脱贫攻坚领导小组《关于建立防止返贫监测和帮扶机制的实施意见》（豫脱贫组〔2020〕13 号），2020-11，https://www.hnhx.gov.cn/_mediafile/hnhx/2020/11/09/2j3ru6gc0f.pdf （白名单官方·县级政府网披露的省级文件）\n- [SE09] 卢氏县农业农村局《河南省防止返贫监测对象申报政策\"明白纸\"》，2024-08-20，https://www.lushixian.gov.cn/3472/616977792/1890145.html （白名单官方·县级政府网）\n- [SE10] 人民日报《脱贫县农村居民人均可支配收入年均增速达 8.2%》（河南人大网转载，2026-08-27），https://henanrd.gov.cn/2026/08-27/245207.html （白名单官方·省人大网）\n- [SE11] 农业农村部计划财务司《前三季度农业农村经济运行总体平稳》，2025-12，https://jhs.moa.gov.cn/jjyx/202512/t20251203_6479428.htm （中央部委官网，全国对照数据）\n\n## 关联专题\n\n- [[D09]]\n", "P01-政策-河南2026政府工作报告.md": "\n# 2026年河南省政府工作报告摘要\n\n> 说明：本篇依据实际年份为 2026 的现行版本撰写——2026年1月26日河南省第十四届人民代表大会第四次会议上，省长王凯所作《政府工作报告》，全文由河南日报发布、河南人大网转载。数字与政策名均标注来源，未作推测。\n\n## ⚡ 快速知识卡\n\n2026年河南省政府工作报告是\"十五五\"开局之年的总部署。报告回顾\"十四五\"（GDP达6.66万亿元、粮食连续稳定高产）与2025年（GDP增长5.6%、粮食产量1350.97亿斤），提出2026年经济增长5%左右、粮食产量1300亿斤以上等预期目标，部署融入服务全国统一大市场、扩内需、现代化产业体系、乡村全面振兴、城乡区域协调、改革开放、文化、绿色转型、民生、防风险等十个方面重点工作。核心框架是\"1+2+4+N\"目标任务体系。选调考试中，本篇是时政常识题的直接题源，也是申论论述河南定位（粮食安全、统一大市场、新质生产力、黄河战略）时引用目标与数据的权威依据。\n\n## 📖 深度专题\n\n### 一、政策背景\n\n- 会议时间与主体：2026年1月26日，河南省十四届人大四次会议开幕，省长王凯作政府工作报告[SE12][SE13]。\n- 时间节点意义：2026年是\"十五五\"开局之年；报告同时审查《河南省国民经济和社会发展第十五个五年规划纲要（草案）》[SE13]。\n- 总纲：报告明确聚焦\"1+2+4+N\"目标任务体系，贯彻习近平总书记在河南考察时重要讲话精神和关于河南工作的重要论述，落实中部地区加快崛起、黄河流域生态保护和高质量发展等国家战略部署[SE13]。\n- \"十四五\"收官基础：生产总值6.66万亿元，财政总收入7019亿元，经营主体1160.5万户，常住人口城镇化率60%，\"米\"字形高铁网全面建成，高速公路通车里程突破1万公里[SE13]。\n\n### 二、核心目标与数字（2026年主要预期目标）[SE13]\n\n| 指标 | 目标 |\n|---|---|\n| 经济增长 | 5%左右，努力争取更好结果 |\n| 规上工业增加值 | 增长6.5%左右 |\n| 固定资产投资 | 增长5%左右 |\n| 社会消费品零售总额 | 增长5.5%左右 |\n| 一般公共预算收入 | 增长4%左右 |\n| 城镇调查失业率 | 5.5%左右 |\n| 城镇新增就业 | 110万人以上 |\n| 居民消费价格涨幅 | 2%左右 |\n| 粮食产量 | 1300亿斤以上，力争比去年更多增长 |\n| 居民收入 | 增长与经济增长同步 |\n\n2025年实际完成数（报告回顾部分）：GDP增长5.6%，规上工业增加值增长8.4%，工业投资增长13.3%，进出口总值增长14.1%，粮食产量1350.97亿斤，主要指标增速居全国前列[SE13]。注意区分：1350.97亿斤是2025年\"已完成数据\"，1300亿斤以上是2026年\"目标值\"。\n\n\"十五五\"展望：经济年均增长5%左右，农业强省、制造强省、科教强省、数智强省、交通强省、文旅强省建设取得实质性进展；如期实现2030年前碳达峰目标[SE13]。\n\n### 三、重点任务（2026年十个方面）[SE13]\n\n1. **纵深推进融入和服务全国统一大市场**：制定融入服务全国统一大市场建设行动方案；实施营商环境优化提升行动、规范涉企执法行动（\"扫码入企\"、\"一业一查\"）；建设物流、消费商贸、要素配置、产业链接四类枢纽；打造\"空中丝路\"融汇支点等三大支点。\n2. **大力拓展内需增长新空间**：提振消费专项行动、消费品以旧换新、推广胖东来经验；实施1000个以上省重点项目、年度完成投资1万亿元；推进平漯周、焦济洛平等高铁项目，开工建设南信合高铁。\n3. **加快建设现代化产业体系**：建强先进制造业、现代服务业、数智赋能、科技支撑四大体系；国家高新技术企业达到1.5万家、科技型中小企业3.2万家；数字经济规模2.5万亿元；技术合同成交额力争3000亿元；实施100项省级重大科技专项。\n4. **扎实推进乡村全面振兴**：实施百亿斤粮食产能提升工程，推进66个粮食产能提升重点县和豫东平原200万亩整区域高标准农田项目，新建改造高标准农田400万亩以上；壮大6大特色产业集群和18条乡村富民产业链；建成35个先导区、1000个和美乡村；新改建农村公路5000公里、村级寄递物流综合服务点3万个以上；守牢不发生规模性返贫致贫底线。\n5. **着力推动城乡区域协调发展**：\"一主两副\"（郑州国家中心城市，洛阳、南阳）；\"一圈两带\"（郑州都市圈、郑开同城化）；支持巩义、永城、林州等10个县（市）发展成为中等城市。\n6. **统筹推进深层次改革高水平开放**：启动新一轮国资国企改革行动；实施促进民营经济高质量发展行动计划；**全面开展第二轮土地承包到期后再延长30年整省试点**；常态化推进\"高效办成一件事\"；中欧（亚）班列开行4000班次；新增有进出口实绩企业1500家以上。\n7. **全面激发文化创新创造活力**：支持郑州、开封、洛阳、安阳创建国家文物保护利用示范区；擦亮\"行走河南·读懂中国\"品牌；建设黄河古都群文化旅游目的地。\n8. **加力促进经济社会全面绿色转型**：大气污染治理提质增效；深化幸福黄河三年行动；可再生能源发电装机突破1亿千瓦；新培育绿色工厂200个、绿色工业园区10个。\n9. **更大力度保障和改善民生**：新增农村劳动力转移就业40万人，职业技能培训200万人次；接续实施乡村振兴村级协理员、万名大学生助企服务专项计划；省属公办高校生均经费增加1000元；启动基本医疗保险省级统筹；完善三级养老服务网络。\n10. **有力有效防范化解重点领域风险**：安全生产治本攻坚三年行动收官；完善全口径地方债务监测，完成地方政府融资平台退出；加强党建引领基层高效能治理，扎实推进\"五基四化\"，坚持和发展新时代\"枫桥经验\"。\n\n### 四、与河南选调的关联\n\n- **面试/申论素材直接来源**：选调生到村任职、基层治理岗位的核心语境就是报告中的乡村全面振兴、和美乡村、\"五基四化\"、防止返贫等部署；引用报告原文（如\"守牢不发生规模性返贫致贫底线\"）能显著提升作答权威性。\n- **身份契合点**：报告明确\"接续实施乡村振兴村级协理员\"\"公务员招录计划向县乡基层机关倾斜\"（一号文件），选调生正是这批基层力量储备的组成部分，可在自我认知与岗位匹配题中引用。\n- **省情定位题**：\"1+2+4+N\"目标体系、\"一主两副\"\"一圈两带\"、六大强省（农业/制造/科教/数智/交通/文旅）是河南定位类题目的标准框架。\n- **热点呼应**：第二轮土地承包延包30年整省试点、全国统一大市场（河南行动方案）、\"空中丝路\"均为2026年度河南特有热点，中央政策+河南落地的组合最常考。\n\n### 五、可考角度\n\n- 常识：2026年河南粮食产量目标（1300亿斤以上）；\"十四五\"末河南GDP总量（6.66万亿元）；2025年GDP增速（5.6%）与粮食产量（1350.97亿斤）；\"米\"字形高铁网全面建成。\n- 案例分析：以\"1000个省重点项目、年度投资1万亿元\"分析扩大有效投资的路径；以\"四类枢纽+三大支点\"分析河南如何融入全国统一大市场。\n- 材料写作：围绕\"经济大省挑大梁\"\"现代化河南建设\"组织分论点——稳粮食基本盘、强产业集群、活县域经济、惠民生底线，每个分论点都可回扣报告数据。\n\n### 六、金句/对策\n\n1. \"扛起了经济大省挑大梁责任\"——适用于大作文论述河南担当、区域协调发展主题。[SE13]\n2. \"让民事无忧、企事有解、政事高效\"——适用于营商环境、数字政府、服务型政府主题。[SE13]\n3. \"守牢不发生规模性返贫致贫底线\"——适用于巩固脱贫成果、乡村振兴底线思维主题。[SE13]\n4. \"推动经济实现质的有效提升和量的合理增长，实现'十五五'良好开局，奋力谱写中原大地推进中国式现代化新篇章\"——适用于高质量发展、开局起步类结尾。[SE13]\n5. \"树立和践行正确政绩观，坚持为人民出政绩、以实干出政绩\"——适用于基层干部作风、政绩观主题。[SE13]\n\n## 来源与证据\n\n- [SE12] 河南省人民政府门户网站《海报丨快看！2026年河南省政府工作报告来了》，2026-01-26，https://www.henan.gov.cn/2026/01-26/3313941.html\n- [SE13] 河南日报《政府工作报告（全文）——2026年1月26日在河南省第十四届人民代表大会第四次会议上》，河南人大网转载，2026-02-03，https://henanrd.gov.cn/2026/02-03/233636.html\n- [SE14] 河南省人民政府门户网站《2026年河南省政府工作报告》，2026-02-03，https://www.henan.gov.cn/2026/02-03/3319596.html\n- [SE15] 河南省发展和改革委员会《政府工作报告》（2026年河南两会专题），2026-02，https://fgw.henan.gov.cn/2026/02-03/3319580.html\n- [SE16] 河南省人民政府门户网站《聚焦2026年河南两会》专题，2026-01，https://www.henan.gov.cn/zt/2026zt/jj2026nhnlh\n\n## 关联专题\n\n- [[P02]]\n- [[D10]]\n", "P02-政策-河南乡村振兴一号文件.md": "\n# 2026年河南省委一号文件摘要\n\n> 说明：本篇依据实际年份为 2026 的现行版本撰写——《中共河南省委 河南省人民政府关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》（2026年2月12日），2026年5月30日由河南日报受权发布、河南省政府网站群转载。所有数字与政策名均有来源，未作推测。\n\n## ⚡ 快速知识卡\n\n2026年河南省委一号文件是\"十五五\"开局之年指导全省\"三农\"工作的纲领性文件，以推进乡村全面振兴为总抓手、以学习运用\"千万工程\"经验为引领，部署六大板块：持续提升粮食综合生产能力（粮食面积稳定在1.6亿亩以上、产量稳定在650亿公斤以上）、把农业建成现代化大产业（6大产业集群、18条乡村富民产业链）、统筹建立常态化防止返贫致贫机制、宜居宜业和美乡村建设（2026年培育35个先导区）、农村重点领域改革（第二轮土地承包延包30年整省试点）与党建引领基层治理。它把中央一号文件精神河南化、具体化，是选调考试\"三农\"主题的最高优先级政策文本：粮食安全、防返贫、和美乡村、延包试点四条线都从这里出题。\n\n## 📖 深度专题\n\n### 一、政策背景\n\n- 文件全称与成文时间：《关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》，成文于2026年2月12日，2026年5月30日公开发布[SE17][SE18]。\n- 顶层语境：贯彻习近平总书记关于\"三农\"工作的重要论述和视察河南重要讲话精神，聚焦\"1+2+4+N\"目标任务体系，坚持农业农村优先发展、城乡融合发展，锚定农业农村现代化[SE17]。\n- 三个\"总牵引\"：以推进乡村全面振兴为总抓手，以学习运用\"千万工程\"经验为引领，以改革创新为根本动力；总目标是\"守牢粮食安全底线，持续巩固拓展脱贫攻坚成果，提升乡村产业发展水平、乡村建设水平、乡村治理水平\"[SE17]。\n- 时间节点意义：2026年是巩固拓展脱贫攻坚成果同乡村振兴有效衔接5年过渡期后转向常态化帮扶的第一年，文件专章部署常态化防止返贫致贫机制[SE19]。\n- 底盘数据（文件发布之际的河南\"三农\"基本面）：河南粮食总产量稳居全国第二，连续9年稳定在1300亿斤以上；\"十四五\"期间新建、改造提升高标准农田3167万亩；农业科技进步贡献率67%，主要农作物良种覆盖率超97%，耕种收综合机械化率90%，三项指标均高于全国平均水平[SE19]。\n\n### 二、核心目标与数字\n\n- 粮食硬指标：确保粮食播种面积稳定在**1.6亿亩以上**，粮食产量稳定在**650亿公斤以上**（即1300亿斤以上）[SE17]。\n- 百亿斤粮食产能提升工程：建设1500万亩小麦、100万亩水稻、2000万亩玉米、80万亩大豆高产示范区[SE17]。\n- 产业目标：打造粮食等**6大产业集群**、小麦等**18条乡村富民产业链**；发展设施种植业促进农民增收三年行动[SE17]。\n- 和美乡村：2026年培育**35个**宜居宜业和美乡村建设先导区，实施\"千村引领\"和美乡村建设行动；到2030年建成先导区120个，先导区内村庄率先具备现代生活条件，建设和美村5000个、辐射带动富美村1万个、洁美村1.5万个[SE17][SE19]。\n- 帮扶资金：将省级财政衔接推进乡村振兴补助资金调整为省级财政**常态化帮扶资金**，保持省市两级投入规模稳定[SE17]。\n- 延包试点：启动第二轮土地承包到期后再延长三十年**整省试点**，到**2028年**全省基本完成延包工作[SE17]。\n- 民生背景数据：2025年河南农村居民人均可支配收入22550元，增长5.7%，城乡收入比缩至1.95[SE19]。\n\n### 三、重点任务（六大板块二十六条）\n\n1. **持续提升粮食综合生产能力**（第一至五条）：粮食大面积单产提升行动（向科技、管护、防控、市场要粮）；严守耕地红线、严格占补平衡，整治\"大棚房\"、耕地\"非农化\"、永久基本农田\"非粮化\"，以\"投建运管\"一体化机制建高标准农田；强化农业科技与装备支撑——推动中原农谷、周口国家农高区协同发展，建强国家生物育种产业创新中心，推进神农种业实验室资源整合，建好洛阳现代农机装备国家先进制造业集群；增强防灾减灾能力；完善完全成本保险、最低收购价、产销区省际横向利益补偿等强农惠农政策[SE17]。\n2. **加快把农业建成现代化大产业**（第六至十条）：重要农产品稳产保供（生猪产能调控、奶业纾困）；发展乡村富民产业，实施农村电商高质量发展工程，培育\"小而美\"文旅业态；大力发展设施农业；打造\"豫农优品\"区域公用品牌；分类发展县域经济（大城市周边县、区域重点县、专业功能县、农业大县、重点生态功能区县五类施策）[SE17]。\n3. **统筹建立常态化防止返贫致贫机制**（第十一至十四条）：健全常态化帮扶政策体系，守牢不发生规模性返贫致贫底线；完善监测体系，做到早发现、早干预、早帮扶，建立动态调整机制；提升产业和就业帮扶质效（落实\"四个一批\"、帮扶项目资产全周期管理、以工代赈扩面）；确定一批省级乡村振兴重点帮扶县，开展\"组团式\"帮扶和科技特派团\"产业式\"帮扶[SE17]。\n4. **因地制宜推进宜居宜业和美乡村建设**（第十五至二十条）：片区化推进、组团式发展、先导区引领；城乡供水一体化、\"四好农村路\"、客货邮融合；县域普通高中振兴、医疗卫生强基工程、大学生乡村医生专项计划、县乡村三级养老服务网络；整治改厕、垃圾围村、污水；深化\"五基四化\"、持续深化\"五星\"党支部建设、公务员招录计划向县乡基层机关倾斜、不得从县乡借调工作人员；推进移风易俗、整治高额彩礼，坚持和发展新时代\"枫桥经验\"，深化\"党建+网格+大数据\"模式[SE17]。\n5. **推进农村重点领域和关键环节改革**（第二十一至二十六条）：延包三十年整省试点（2028年基本完成）；农村集体经营性建设用地入市（严禁建商品住房）、宅基地规范审批；发展新型农村集体经济、整治\"三资\"问题；建设现代农事综合服务中心（支持周口市整域先行先试）；\"政银担保投\"联动支农；推动城乡要素双向流动——实施\"三支一扶\"、乡村振兴村级协理员、大学生志愿服务乡村振兴等人才计划[SE17]。\n6. **加强党对\"三农\"工作的全面领导**：五级书记抓乡村振兴，省负总责、市县乡抓落实；用好乡镇履职事项清单、村（社区）工作事项准入制度，整治形式主义为基层减负；开展\"清廉河南\"基层建设行动[SE17]。\n\n### 四、与河南选调的关联\n\n- **高频出题区**：选调生岗位在乡村一线，文件中粮食安全党政同责、防返贫\"早发现早干预早帮扶\"、和美乡村先导区、\"五星\"支部建设、移风易俗都是案例分析与材料写作的直接命题语境。\n- **基层减负与人才政策可作答\"如何留住基层干部/人才\"**：文件明确公务员招录向县乡倾斜、不得从县乡借调工作人员、落实村干部基本报酬保障、实施村级协理员等计划——回答\"基层治理\"\"青年到村去\"类题目的现成对策。\n- **改革类考题**：延包整省试点是全国唯一的整省试点层次的政策（河南地位特殊），结合\"整体 CSP：稳面积、优结构、提单产\"理解河南作为粮食大省的政治责任。\n- **与政府工作报告互为印证**：报告（P01）中\"建成35个先导区、1000个和美乡村\"\"新建改造高标准农田400万亩以上\"与一号文件同口径，两文对照记忆可同时覆盖常识题两个出题源。\n\n### 五、可考角度\n\n- 常识：文件全称与印发时间（2026年2月12日）；粮食面积1.6亿亩、产量650亿公斤（1300亿斤）双底线；6大产业集群、18条乡村富民产业链；延包整省试点、2028年基本完成；2026年35个先导区。\n- 案例分析：给定某县高标准农田\"投建运管\"一体化或农事综合服务中心材料，考查分析\"谁来建、怎么管、如何长效\"；给定防返贫监测案例，考\"早发现、早干预、早帮扶\"机制设计。\n- 材料写作：以\"学习运用'千万工程'经验，建设宜居宜业和美乡村\"为主题，按\"产业富民—建设塑形—治理铸魂\"三分论点展开，各论点引文件原文支撑。\n\n### 六、金句/对策\n\n1. \"守牢粮食安全底线……把农业建成现代化大产业、使农村基本具备现代生活条件、让农民生活更加富裕美好\"——适用于乡村振兴总论、农业强国主题开头。[SE17]\n2. \"向科技要粮、向管护要粮、向防控要粮、向市场要粮\"——适用于粮食安全、藏粮于技主题的分论点骨架。[SE17]\n3. \"做到早发现、早干预、早帮扶，守牢不发生规模性返贫致贫底线\"——适用于底线思维、民生保障主题。[SE17]\n4. \"摒弃'千村一面'的粗放建设模式，坚持片区化推进、组团式发展、先导区引领，打造各具特色的现代版'富春山居图'\"——适用于乡村建设、因地制宜方法论主题。[SE17][SE19]\n5. \"办好农村的事情，实现乡村振兴，关键在党\"——适用于基层党建、乡村治理主题的升华段。[SE17]\n\n## 来源与证据\n\n- [SE17] 河南日报《中共河南省委 河南省人民政府关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》，河南省发展和改革委员会网站转载，2026-05-30，https://fgw.henan.gov.cn/2026/05-30/3359969.html\n- [SE18] 河南省人民政府门户网站《中共河南省委 河南省人民政府关于锚定农业农村现代化 扎实推进乡村全面振兴的实施意见》，2026-05-30，https://www.henan.gov.cn/2026/05-30/3359959.html\n- [SE19] 新华网河南频道（来源：河南日报）《沃野中原逐浪向新——写在2026年省委一号文件发布之际》，2026-05-30，http://ha.news.cn/20260530/ffeef9eb007c4622b8f680ac93f39dea/c.html\n- [SE20] 郑州市中原区人民政府网站（来源：河南日报）《重磅！2026年河南省委一号文件发布》，2026-05-30，https://www.zhongyuan.gov.cn/rdhy/10078595.jhtml\n- [SE21] 河南省人民政府国有资产监督管理委员会《2026年河南省委一号文件发布》，2026-05-30，https://gzw.henan.gov.cn/2026/05-30/3360021.html\n\n## 关联专题\n\n- [[P01]]\n- [[D09]]\n- [[D10]]\n", "W01-周报-2026-07-05.md": "\n# W01 · 河南时政周报（2026-06-29 — 2026-07-05）\n\n## ⚡ 快速知识卡\n\n本周河南时政主线有四：一是省级密集出台稳经济政策，6月30日省政府新闻办吹风《河南省交通运输结构调整专项行动方案（2026—2028年）》，7月6日印发促进民间投资高质量发展20条；二是7月1日庆祝建党105周年大会举行，全省深入学习习近平总书记重要讲话精神；三是开放通道扩容，7月1日郑州国际陆港新增3条中欧（亚）班列图定线路；四是民生领域，7月3日失业保险稳岗扩岗\"两延续一优化\"政策落地、7月8日高招录取启动。本周期内黄河调水调沙持续推进（6月22日启动），是水利与生态治理的标志性事件。考法以常识（政策名称、时间、目标数字）与案例分析（运输结构调整逻辑）为主。\n\n## 📖 本周要闻十条\n\n### 1. 《河南省交通运输结构调整专项行动方案（2026—2028年）》政策吹风\n6月30日16时，省政府新闻办召开政策例行吹风会，省交通运输厅厅长付磊介绍《方案》。《方案》于6月10日由省政府办公厅印发，明确\"油改电、公转铁、公转水、多式联运\"四大核心调整路径。背景数据：2025年全省货运量30.26亿吨，公路货运占比88.5%，较全国（73.7%）高14.8个百分点，铁路、水路占比仅4.5%和7%。目标：到2028年公路货运量占比降至86.1%左右，新能源运输量占比提升至25%以上，水路货运量占比升至9.1%左右，铁路货运量占比升至4.8%左右。（来源[SE22][SE23]）\n\n### 2. 电动重卡充换电站布局与新能源货车补贴\n吹风会披露：6月10日省政府办公厅印发《河南省电动重卡充换电站布局建设方案》，全省布局新能源重卡充换电站257座、打造24条零碳运输通道；2026年开工建设100座、建成60座以上。6月16日五部门印发老旧营运货车新能源替代补贴政策，2026年补贴新能源货车购车金额的15%且不超过8万元，叠加国家补贴每辆车最多可获22万元补贴；计划2027年新能源营运货车保有量达3.3万辆、2028年达3.8万辆。（来源[SE22]）\n\n### 3. 郑州国际陆港新增3条中欧（亚）班列图定线路\n7月1日，河南新增3条中欧（亚）班列图定线路，全部落地郑州国际陆港航空港片区新郑站：南向新增磨憨—新郑／圃田东盟回程图定线路（每周2列，全省首条东盟方向回程图定班列）；北向新增新郑／圃田—满洲里图定线路（全省首条经满洲里口岸出境的图定班列）；西向新增新郑／圃田—阿拉山口图定线路。2026年1至5月河南中欧（亚）班列累计开行1556列、同比增长25.7%。全省存量图定线路全部实现圃田、新郑双站点兼容作业。（来源[SE24]）\n\n### 4. 河南中欧班列累计开行突破1.9万列\n6月25日，一列满载机械零配件、新能源汽车的班列从郑州集结中心驶出，河南中欧班列累计开行总量突破19000列。已构建\"29个境外直达站点＋10个出入境口岸\"跨境物流网络；中豫港务集团累计投资101亿元建成郑州国际陆港西作业区、集结中心等项目；产业联动货源占比超30%，实现由\"过境流量\"向\"产业留量\"转型。（来源[SE25]）\n\n### 5. 河南省进一步促进民间投资高质量发展若干政策措施印发\n省政府办公厅印发《河南省进一步促进民间投资高质量发展若干政策措施》（豫政办〔2026〕25号，6月25日签发），7月6日起各单位公开转载。政策提出：对具备条件的项目民间资本持股比例可达10%以上；超过400万元的工程采购项目预留预算总额40%以上面向中小微企业（小微企业不低于60%）；支持民间资本投向城市基础设施、数字经济、低空经济、前沿科技等领域；省发展改革委后续解读为\"20条硬核举措\"。（来源[SE26][SE27]）\n\n### 6. 庆祝建党105周年，全省开展学习教育\n7月1日，庆祝中国共产党成立105周年大会在北京隆重举行，习近平总书记发表重要讲话。河南全省各级党组织组织收看学习，把学习贯彻总书记重要讲话精神与此前总书记在河南考察时重要讲话精神结合起来。此考点可与\"党建＋基层治理\"结合命题。（来源[SE28]）\n\n### 7. 失业保险稳岗扩岗\"两延续一优化\"政策\n7月2日获悉，人社部等四部门联合印发通知，\"两延续一优化\"：延续稳岗返还至2026年底（中小微企业按不超过上年度实际缴纳失业保险费60%返还、大型企业不超过30%）；延续一次性扩岗补助至2026年底（每吸纳1名毕业年度及离校两年内未就业高校毕业生、16—24岁登记失业青年，不超过1500元）；优化技能提升补贴（急需紧缺职业证书最多可申领3次）。河南日报网7月3日转发。上半年河南城镇新增就业71.5万人、完成年度目标65%。（来源[SE29][SE30]）\n\n### 8. 河南高招录取7月8日启动\n7月8日，2026年全国高校在豫招生工作进入录取阶段，持续至8月上旬。批次安排：普通本科提前批7月11日、普通本科批7月21—25日、专科批8月上旬；录取期间至少进行5次征集志愿（7月13日、17日、26日，8月3日、8日）。省教育考试院提醒防范招生诈骗，监督举报电话0371-55610639。（来源[SE31]）\n\n### 9. 河南省政府推进服务业扩能提质\n省政府印发《关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号），7月8日南阳等市政府网公开发布。文件落实国务院国发〔2026〕7号意见，围绕支撑型、赋能型、成长型服务业构建\"3×4\"发展新格局，目标到2030年全省服务业规模达4.6万亿元左右；提出推广郑州—卢森堡\"双枢纽\"经验、发展高铁物流与低空配送、推广胖东来经验培育品质零售企业等举措。（来源[SE32]）\n\n### 10. 黄河调水调沙持续推进（本周背景事件）\n6月22日9时小浪底闸门开启，2026年主汛期前黄河调水调沙启动，为2002年以来第33次；计划历时约21天、7月12日前后完成水库调度。本次首次提出\"洪水塑造试点\"。本周期（6月29日—7月5日）调水调沙处于中后段泄放阶段，下游工程与引水供水同步推进。详细复盘见下文深度案例。（来源[SE33]）\n\n## 📖 深度案例：黄河调水调沙——从\"控制洪水\"到\"利用洪水、塑造洪水\"\n\n**主体与事件**：水利部黄河水利委员会统一调度，核心枢纽为小浪底，联合万家寨、三门峡及支流陆浑、故县、河口村水库。6月22日9时启动2026年主汛期前调水调沙，系2002年机制建立以来第33次。\n\n**做法与机制**：一是联合调度，\"三库调控为主、支流水库相机配合\"，统筹冲沙、防汛、供水、生态多重目标。二是数字化支撑，依托数字孪生黄河，用异重流模拟系统、下游二维水沙动力学模型做多方案水沙预演，筛选最优泄流方案。三是本次最大亮点是首次提出\"洪水塑造试点\"：把去年秋汛蓄存的清水在主汛期前\"塑造\"为人工洪水过程冲沙入海，与\"洪水控制\"\"洪水利用\"衔接，实现\"三个洪水\"深度互馈。洪峰途中还为下游省份用水和黄河三角洲湿地补水创造条件。\n\n**成效数据（机制运行24年累计＋本轮安排）**：24年累计输沙入海36.9亿吨；下游主槽平均下切3.1米，河道最小过流能力从1800立方米每秒恢复到5000立方米每秒；2008年以来向黄河三角洲自然保护区生态补水17次、总补水16.5亿立方米。本轮计划历时约21天，预计7月12日前后完成水库调度（结束数据见W02周报）。\n\n**可迁移点与评价**：其一，\"从被动防灾到主动治沙\"体现了系统观念——把洪水当作资源而非单纯风险，是\"底线思维＋极限思维\"的生动素材。其二，数字孪生技术支撑决策，可作\"科技赋能治理\"案例。其三，多目标统筹（减淤、供水、生态、防汛）对应申论\"统筹发展与安全\"主题。\n\n**可考角度**：常识——调水调沙启动时间（2002年）、核心枢纽（小浪底）、本轮为第33次；案例分析——\"三个洪水\"如何体现系统治理；材料写作——人与自然和谐共生、治水兴水与粮食安全的关系。\n\n**金句（适用主题：生态文明、系统观念）**：\n1. 既要控得住洪水，也要用得上洪水，还要塑得好洪水。\n2. 从\"黄河之水天上来\"到\"水沙协调入海去\"，是人与河流关系的一次重写。\n3. 治黄之要在于治沙，治沙之要在在于系统——上拦、中调、下排，缺一不可。\n\n## 复盘与下周关注\n\n- 下周关注：调水调沙水库调度结束数据（预计7月10—12日）；长期护理保险制度实施方案公开情况[存疑：具体公开发布日待核]；暑期消费促进活动动态。\n\n## 来源与证据\n\n- [SE22] 河南省政府门户网《〈河南省交通运输结构调整专项行动方案（2026—2028年）〉省政府政策例行吹风会》直播实录，2026-06-30，https://www.henan.gov.cn/2026/06-30/3370406.html\n- [SE23] 交通运输部《河南启动三年行动专项攻坚运输结构调整》，2026-07-01，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202607/t20260701_4208565.html\n- [SE24] 交通运输部（转中国水运网）《郑州国际陆港新增三条中欧（亚）班列图定线路》，2026-07-03，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202607/t20260703_4208738.html\n- [SE25] 交通运输部（转中国水运网）《河南中欧班列累计开行量突破1.9万列》，2026-06-30，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202606/t20260630_4208488.html\n- [SE26] 投资项目在线审批监管平台《河南省人民政府办公厅关于印发河南省进一步促进民间投资高质量发展若干政策措施的通知》（豫政办〔2026〕25号），2026-07-06，https://new.tzxm.gov.cn/zckd/gfxwj/202607/t20260707_1406341.shtml\n- [SE27] 河南省商务厅转发豫政办〔2026〕25号，2026-07-06，https://hnsswt.henan.gov.cn/2026/07-06/3372610.html\n- [SE28] 中国政府网《庆祝中国共产党成立105周年大会在京隆重举行》，2026-07-01，https://www.gov.cn/yaowen/liebiao/202607/content_7073947.htm\n- [SE29] 河南日报网（转人民日报）《三项失业保险政策举措支持企业稳岗扩岗》，2026-07-03，https://www.henandaily.cn/news/2026/0703/1238165.html\n- [SE30] 新华网《失业保险稳岗扩岗政策举措延续实施》，2026-07-03，https://www.news.cn/government/20260703/c9330c9fb0b043868e4c4ff66571ed02/c.html\n- [SE31] 新华网河南频道（转郑州日报）《河南高招录取今起开始 今年至少进行5次征集志愿》，2026-07-08，http://www.ha.news.cn/20260708/e5542255862d43beb5436f239f0c126d/c.html\n- [SE32] 南阳市人民政府网《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号），2026-07-08，https://www.nanyang.gov.cn/2026/07-08/1418283.html\n- [SE33] 黄河网（转河南日报）《2026年黄河调水调沙正式启动》，2026-06-23，http://yrcc.gov.cn/xwdt/mtgz/2026-mtgz-qtmt/202606/t20260623_451518.html\n\n## 关联专题\n\n- [[D09]]\n- [[P01]]\n", "W02-周报-2026-07-12.md": "\n# W02 · 河南时政周报（2026-07-06 — 2026-07-12）\n\n## ⚡ 快速知识卡\n\n本周河南时政主线：一是民生保障重磅——省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号），用3年左右在全省全面建立长护险制度，大河网7月10日全文发布；二是政策落地周——促进民间投资20条（7月6日）、服务业扩能提质实施意见等继续公开发布；三是黄河调水调沙7月10日9时完成水库调度，排沙1.79亿吨创历年同期之最；四是招生录取季启动，7月8日高招录取开始。此外，省政府7月还出台适应气候变化提升粮食生产防灾减灾能力指导意见（具体印发日期[存疑]）。考法聚焦：长护险制度细节（费率、筹资、实施步骤）、调水调沙数据、稳投资政策工具。\n\n## 📖 本周要闻十条\n\n### 1. 河南建立长期护理保险制度实施方案印发\n省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号，6月18日签发），大河网7月10日全文发布。核心内容：长护险为独立险种，用3年左右时间在全省全面建立制度。参保对象覆盖单位职工、退休人员、灵活就业人员和未就业城乡居民，与基本医保同步缴费。实施步骤：2026年各统筹地区启动就业人员长护险；2027年洛阳、鹤壁、新乡、焦作、三门峡、南阳、商丘、济源8个统筹地区启动未就业城乡居民制度；2028年其他地区启动，开封2028年底前调整完善。费率：单位职工0.3%左右（单位个人各0.15%左右）；未就业城乡居民个人缴费与政府补助1∶1左右，费率从0.15%左右起步、5年过渡到0.3%左右。待遇：起步阶段保障重度失能人员，职工参保基金支付比例70%左右，城乡居民50%左右，年度最高支付限额不超过上年度城乡居民人均可支配收入的50%。特困人员全额资助、低保对象定额资助不低于50%。（来源[SE34][SE27]）\n\n### 2. 促进民间投资高质量发展20条公开发布\n省政府办公厅印发《河南省进一步促进民间投资高质量发展若干政策措施》（豫政办〔2026〕25号），本周起各单位公开转载（7月6日河南省商务厅转发）。要点：民间资本持股比例可达10%以上；工程采购预留40%以上面向中小微企业；支持民间资本投向城市基础设施、生产性服务业、数字经济、低空经济、前沿科技创新、重大科研平台等领域；常态化运行小微企业融资协调工作机制。省发改委在7月21日发布会中称其为\"20条硬核举措\"。（来源[SE27]）\n\n### 3. 2026年黄河调水调沙水库调度结束\n7月10日9时，黄委调度小浪底水库按600立方米每秒下泄，2026年主汛期前黄河调水调沙水库调度顺利结束。本次调水调沙自6月22日启动，历时19天。关键数据：小浪底最大下泄流量4990立方米每秒，下泄水量49.99亿立方米，最大出库含沙量787千克每立方米，排沙量1.79亿吨，库区净冲刷1.71亿吨——排沙量、净冲刷量均为历年同期调水调沙之最。成功塑造花园口站4800立方米每秒量级、利津站4000立方米每秒量级长历时洪水过程（利津站4000以上流量持续80小时）；水库腾出库容41.72亿立方米；下游河段累计引水6.09亿立方米；向黄河河口三角洲湿地生态补水1.65亿立方米。预计7月15日前后水沙过程全部平稳入海。（来源[SE35]）\n\n### 4. 2026年河南高招录取启动，今年至少5次征集志愿\n7月8日起，全国高校在豫招生进入录取阶段。普通本科提前批7月11日、普通本科批7月21—25日；艺术本科批7月15—16日；体育本科批7月11日。录取期间至少5次征集志愿：7月13日（本科提前批、体育本科批）、7月17日（艺术本科批）、7月26日（普通本科批）、8月3日、8月8日（专科批次）。考生可通过河南省普通高校招生考生服务平台查询电子档案状态。（来源[SE31]）\n\n### 5. 省政府部署适应气候变化提升粮食生产防灾减灾能力\n省政府办公厅出台《关于适应气候变化提升粮食生产防灾减灾救灾能力的指导意见》（豫政办〔2026〕27号；本周获媒体关注，原文公开发布时间[存疑：一处转载显示8月，待核对本轮实际发布日期]）。目标：到2030年永久基本农田排灌体系全面建成，初步建立与气候变化相适应的农业防灾减灾救灾体系。重点任务包括：聚焦66个粮食产能提升重点县升级气象观测装备；到2027年农村\"三沟四渠\"全部连通；到2027年培育区域农机社会化服务中心1000个以上；培育抗逆新品种（小麦抗倒春寒耐旱、玉米抗旱耐高温等）。（来源[SE36]）\n\n### 6. 失业保险稳岗扩岗政策在豫延续实施\n人社部等四部门\"两延续一优化\"政策本周在河南广泛传播落地：稳岗返还（中小微60%、大型30%上限）和一次性扩岗补助（每吸纳1名高校毕业生或青年失业人员不超过1500元）延续至2026年底；技能提升补贴放宽参保年限、急需紧缺工种证书最多可领3次。背景：上半年河南城镇新增就业71.5万人、完成年度目标65%。（来源[SE29][SE37]）\n\n### 7. 服务业扩能提质实施意见公开\n《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号）本周起在各地市政府网公开（南阳7月8日转发）。核心：构建支撑型、赋能型、成长型\"3×4\"服务业发展新格局，到2030年全省服务业规模达4.6万亿元左右；含现代物流降本增效（推广郑州—卢森堡\"双枢纽\"经验、发展高铁物流、低空配送）、供应链金融、科技服务、商贸流通（推广胖东来经验）等分业举措。（来源[SE32]）\n\n### 8. 郑州国际陆港图定线路扩容效应持续释放\n7月1日新增3条中欧（亚）班列图定线路（磨憨—新郑／圃田东盟回程、新郑—满洲里、新郑—阿拉山口）后，本周全省存量图定线路全面实现圃田、新郑双站点兼容作业；叠加即将投用的新郑站铁路联络线，郑州集结中心形成\"双站点联动\"格局。1—5月全省中欧（亚）班列开行1556列、同比增长25.7%，货重货值同步大幅增长。（来源[SE24]）\n\n### 9. 迎峰度夏能源保供与防汛备汛并行\n本周处于主汛期与高温叠加期，省政府在7月21日发布会（内容于此后公布）中系统部署：常态化开展重大工程、重要水系、重点区域排险除患，做实预警叫应响应联动，扎实做好迎峰度夏能源保供，常态化监测粮油肉蛋菜价格。汛期安全、防灾减灾为本周舆论重点。[存疑：本周内具体河南电力负荷数据未检索到白名单来源，暂不引数字]（来源[SE38]）\n\n### 10. 暑期文旅消费季持续推进\n2026\"行走河南·读懂中国\"暑期文化旅游消费季自5月下旬在安阳启幕后持续开展，本周进入暑期客流高峰期，全省推出300余项门票减免与特色活动，配套\"乐享河南\"暑期消费季。此条与省政府促消费部署相衔接。[存疑：本周内具体消费数据无官方口径]（来源[SE38]）\n\n## 📖 深度案例：河南长护险——人口大省的\"社保第六险\"破题\n\n**主体与事件**：河南省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号），回应国家《关于加快建立长期护理保险制度的意见》及8部门实施方案部署，是河南应对深度老龄化、补齐\"社保第六险\"空白的关键一步。\n\n**背景与问题**：河南是人口大省，失能半失能老人照护长期依赖家庭，\"一人失能、全家失衡\"。此前全国仅部分城市试点，河南尚无全省统一制度。痛点集中在三处：筹资无来源、失能评估无统一标准、照护服务市场不成熟。\n\n**做法与机制**：一是独立险种、市级统筹起步，逐步省级统筹。二是分类筹资：单位职工费率0.3%左右，单位个人各担一半；退休人员个人缴纳、可从医保个人账户代扣；未就业城乡居民个人与政府补助1∶1，费率0.15%起步、5年过渡至0.3%；困难人群分类资助（特困全额、低保定额不低于50%）。三是分步实施：2026年就业人员起步→2027年8个统筹地区覆盖城乡居民→2028年全省铺开。四是待遇差异化：职工70%左右、居民50%左右支付比例，不设起付线，鼓励居家和社区护理并给予支付倾斜；对断保再参保设6个月等待期等约束。五是全国统一失能评估标准和服务项目目录，基金原则上不发现金、只付服务。\n\n**成效与意义**：制度层面首次实现全省长护险从无到有的顶层设计，把9000多万人口的照护保障纳入制度化轨道；对积极应对人口老龄化、稳定照护服务就业（护理员队伍）、拉动养老产业均有牵引作用。量化成效数据尚待制度运行后发布[存疑]。\n\n**局限与争议**：起步阶段仅保障重度失能人员，中度失能与失智老人覆盖待扩围；城乡居民费率从0.15%起步，保障水平有限；各地照护机构能力不均衡，农村地区服务供给短板明显；基金长期精算平衡面临老龄化压力。\n\n**可考角度**：常识——文件名与实施步骤年份（2026就业人员/2027八地区居民/2028全覆盖）；案例分析——\"独立险种＋市级统筹起步\"体现的渐进式改革思路；材料写作——民生保障从\"有没有\"转向\"好不好\"。\n\n**金句（适用主题：民生保障、积极应对老龄化）**：\n1. 长护险一头连着失能老人的尊严，一头连着千万家庭的喘息空间。\n2. 从\"养\"到\"护\"，一字之改，是民生保障体系从生存型向品质型跃升的注脚。\n3. 用3年时间织密一张网，让\"老有所护\"从愿景变为制度。\n\n## 复盘与下周关注\n\n- 下周关注：普通本科批投档（7月21—25日）；2026年河南经济\"半年报\"（省统计局7月17日公布，见后续周报）；暑期促消费活动数据。\n\n## 来源与证据\n\n- [SE34] 大河网（河南省人民政府办公厅）《关于印发河南省建立长期护理保险制度实施方案的通知》（豫政办〔2026〕24号），2026-07-10，https://view.inews.qq.com/a/20260710A0AIPY00 （大河网官方账号全文转载；省政府网原文链接[存疑]）\n- [SE27] 河南省商务厅转发《河南省进一步促进民间投资高质量发展若干政策措施》（豫政办〔2026〕25号），2026-07-06，https://hnsswt.henan.gov.cn/2026/07-06/3372610.html\n- [SE35] 新华网河南频道（转河南日报）《2026年主汛期前黄河调水调沙水库调度结束》，2026-07-12，http://www.ha.xinhuanet.com/20260712/6cd07cebf1504287b1cb15a773293a87/c.html\n- [SE31] 新华网河南频道（转郑州日报）《河南高招录取今起开始 今年至少进行5次征集志愿》，2026-07-08，http://www.ha.news.cn/20260708/e5542255862d43beb5436f239f0c126d/c.html\n- [SE36] 农小蜂政策库（转河南省人民政府办公厅）《关于适应气候变化提升粮食生产防灾减灾救灾能力的指导意见》（豫政办〔2026〕27号），https://www.abeedata.com/home/article/detail/id/32124 （转载页，原始发布时间[存疑]）\n- [SE29] 河南日报网（转人民日报）《三项失业保险政策举措支持企业稳岗扩岗》，2026-07-03，https://www.henandaily.cn/news/2026/0703/1238165.html\n- [SE37] 河南省政府驻广州办事处《继续补贴！河南延续实施失业保险支持企业稳岗扩岗政策》，2026-07-28，https://zgb.henan.gov.cn/2026/07-28/3379967.html\n- [SE32] 南阳市人民政府网《河南省人民政府关于推进服务业扩能提质的实施意见》（豫政〔2026〕10号），2026-07-08，https://www.nanyang.gov.cn/2026/07-08/1418283.html\n- [SE24] 交通运输部（转中国水运网）《郑州国际陆港新增三条中欧（亚）班列图定线路》，2026-07-03，https://www.mot.gov.cn/xinwen/jiaotongyaowen/202607/t20260703_4208738.html\n- [SE38] 河南省政府门户网《河南省推动2026年下半年进一步巩固拓展经济稳中向好势头新闻发布会》直播实录，2   let lines=esc(src).split("\n"),out=[],inCode=false,inList=false,listType=null,inQuote=false,tableBuf=[];
  const inline=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[\[([^\]]+)\]\]/g,(m,id)=>{const t=DATA.topics.find(t=>t.id===id);return t?`<a href="javascript:void(0)" onclick="openTopic('${id}');return false">${t.id} ${t.title}</a>`:id})
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushTable=()=>{if(!tableBuf.length)return;
    let rows=tableBuf.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)&&r.trim());
    if(!rows.length){tableBuf=[];return}
    let h=`<table><thead><tr>${rows[0].replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<th>"+inline(c.trim())+"</th>").join("")}</tr></thead><tbody>`;
    for(const r of rows.slice(1))h+="<tr>"+r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>";
    out.push(h+"</tbody></table>");tableBuf=[]};
  const closeAll=()=>{if(tableBuf.length)flushTable();if(inList){out.push(listType==="ul"?"</ul>":"</ol>");inList=false}if(inQuote){out.push("</blockquote>");inQuote=false}};
  for(let ln of lines){
    if(/^```/.test(ln)){closeAll();out.push(inCode?"</pre>":"<pre>");inCode=!inCode;continue}
    if(inCode){out.push(ln);continue}
    let m;
    if(/^\s*\|/.test(ln)){tableBuf.push(ln);continue}
    closeAll();
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){
      const lv=m[1].length;
      if(lv<=3){const hid="h"+HEADING_IDS.length;HEADING_IDS.push({id:hid,level:lv,text:inline(m[2])});
        out.push(`<h${lv} id="${hid}">`+inline(m[2])+`</h${lv}>`)}
      else out.push("<h4>"+inline(m[2])+"</h4>");
    }
    else if(/^\s*[-*]\s/.test(ln)){
      if(!inList){out.push("<ul>");inList=true;listType="ul"}
      out.push("<li>"+inline(ln.replace(/^\s*[-*]\s/,""))+"</li>");
    }
    else if(/^\s*\d+[.、)]\s/.test(ln)){
      if(!inList){out.push("<ol>");inList=true;listType="ol"}
      out.push("<li>"+inline(ln.replace(/^\s*\d+[.、)]\s/,""))+"</li>");
    }
    else if(/^>\s?/.test(ln)){
      if(!inQuote){out.push("<blockquote>");inQuote=true}
      out.push(inline(ln.replace(/^>\s?/,"")));
    }
    else{
      if(/^\s*$/.test(ln))out.push("");
      else out.push("<p>"+inline(ln)+"</p>");
    }
  }
  closeAll();
  return out.join("\n");
}

/* ---------- 搜索 ---------- */
let SITEMS=null,SR_HITS=[];
function searchItems(){
  return DATA.topics.map(t=>{
    const mdtext=(MDS[t.file]||"").replace(/[#*`>|[\]()]/g," ");
    return {t,text:(t.id+" "+t.title+" "+t.tags.join(" ")+" "+CATS[t.category].name+" "+(t.card||"")+" "+mdtext).toLowerCase()};
  });
}
function doSearch(q){
  const box=document.getElementById("searchresults");
  if(!box)return;
  if(!SITEMS)SITEMS=searchItems();
  q=q.trim().toLowerCase();
  const sb=box.parentNode.querySelector(".searchbox");
  if(sb)sb.classList.toggle("hasval",!!q);
  if(!q){box.style.display="none";box.innerHTML="";SR_HITS=[];return}
  const words=q.split(/\s+/);
  SR_HITS=SITEMS.filter(it=>words.every(w=>it.text.includes(w))).slice(0,10);
  box.innerHTML=`<div class="sr-cap">搜索结果 · ${SR_HITS.length} 条</div>`+(SR_HITS.length?SR_HITS.map((it,i)=>{
    const t=it.t;
    return `<div class="sr-item${i===0?" sel":""}" data-id="${t.id}" onclick="event.stopPropagation();srOpen('${t.id}')">
      <div class="t"><span class="badge">${t.id}</span><span>${esc(t.title)}</span></div>
      <div class="d">${esc((t.card||t.tags.join(" · ")).slice(0,90))}</div></div>`}).join("")
    :`<div class="sr-empty">未找到与「${esc(q)}」相关的专题</div>`);
  box.style.display="block";
}
/* 修复：等当前点击事件结束（rAF）再销毁首页 DOM，避免访问已销毁节点导致 JS 异常 */
function srOpen(id){hideSearch();requestAnimationFrame(()=>openTopic(id))}
function hideSearch(){const b=document.getElementById("searchresults");if(!b)return;b.style.display="none";b.innerHTML="";SR_HITS=[]}
function clearSearch(){const i=document.getElementById("searchinput");if(i){i.value="";i.focus()}doSearch("")}
function srKey(e){
  const box=document.getElementById("searchresults");
  if(!box||box.style.display==="none")return;
  const items=[...box.querySelectorAll(".sr-item")];
  if(!items.length){if(e.key==="Escape")box.style.display="none";return}
  let i=items.findIndex(x=>x.classList.contains("sel"));
  if(e.key==="ArrowDown"){e.preventDefault();i=(i+1)%items.length}
  else if(e.key==="ArrowUp"){e.preventDefault();i=(i-1+items.length)%items.length}
  else if(e.key==="Enter"){e.preventDefault();const id=items[Math.max(i,0)].dataset.id;hideSearch();openTopic(id);return}
  else if(e.key==="Escape"){hideSearch();return}
  else return;
  items.forEach((x,j)=>x.classList.toggle("sel",j===i));
  items[i].scrollIntoView({block:"nearest"});
}

/* ---------- 文章视图 ---------- */
/* 修复：从正文中剥离"快速知识卡"小节单独前置渲染，深度正文不再重复显示 */
function splitCard(src){
  const m=src.match(/^#{2,3}\s*⚡\s*快速知识卡\s*\n([\s\S]*?)(?=\n#{1,3}\s|\s*$)/m);
  if(!m)return {card:"",body:src};
  return {card:m[1].trim(),body:src.replace(m[0],"").replace(/^\s*\n/,"").trim()};
}
function buildTOC(){
  return HEADING_IDS.map(x=>`<a class="${x.level===3?"lvl3":""}" id="toclink-${x.id}" onclick="jumpTo('${x.id}')">${x.text}</a>`).join("");
}
function jumpTo(id){const el=document.getElementById(id);if(!el)return;
  const y=el.getBoundingClientRect().top+window.scrollY-80;window.scrollTo({top:y,behavior:"smooth"})}
function topicView(id){
  const t=DATA.topics.find(t=>t.id===id);if(!t){home();return}
  const mdtext=MDS[t.file]||"（未找到正文）";
  const sp=splitCard(mdtext);
  HEADING_IDS=[];TOC_IDS=[];
  const rendered=md(sp.body);
  TOC_IDS=HEADING_IDS.map(x=>x.id);
  const srcs=t.sources.map(sid=>{const s=DATA.sources.find(s=>s.id===sid);
    return s?`<div class="srcitem">[${s.id}] ${esc(s.title)} — <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>（${s.type}，核实 ${s.checked_date}）</div>`:""}).join("");
  const rel=t.related.map(r=>{const rt=DATA.topics.find(x=>x.id===r);
    return rt?`<button onclick="openTopic('${r}')"><span class="rid">${r}</span><span class="rt">${esc(rt.title)}</span></button>`:""}).join("");
  let h=`<div class="page-article">
  <div id="articlecol">
    <button class="backtop" onclick="go('${t.category}')">← 返回 ${t.category} 类列表</button>
    <div class="artmeta"><span class="pill">${t.id}</span><span class="pill dim">证据等级：${t.evidence_level}</span><span class="pill dim">${t.status}</span><span>更新 ${t.updated}</span></div>
    ${sp.card?`<div class="kcard"><div class="kcap">${ICONS.zap} 快速知识卡</div><div class="md">${md(sp.card)}</div></div>`:""}
    <article class="md">${rendered}</article>
    ${srcs?`<div class="srcbox"><b>本专题来源（${t.sources.length} 条）</b>${srcs}</div>`:""}
    ${rel?`<div class="relbox"><h3>${ICONS.link} 关联专题</h3><div class="relbtns">${rel}</div></div>`:""}
    <button class="backtop" onclick="go('home')">← 返回首页</button>
  </div>
  <div id="toccol"><div class="toccap">本页目录</div><nav id="toc">${buildTOC()}</nav></div>
  </div>`;
  document.getElementById("content").innerHTML=h;
  highlightNav(id);window.scrollTo(0,0);
  setupTOCSpy();
}
function setupTOCSpy(){
  const links=TOC_IDS.map(i=>({id:i,el:document.getElementById(i),a:document.getElementById("toclink-"+i)})).filter(x=>x.el);
  if(!links.length)return;
  const onScroll=()=>{
    let cur=links[0].id;
    for(const l of links){if(l.el.getBoundingClientRect().top<100)cur=l.id}
    links.forEach(l=>l.a.classList.toggle("active",l.id===cur));
  };
  window.removeEventListener("scroll",window.__tocspy||(()=>{}));
  window.__tocspy=onScroll;window.addEventListener("scroll",onScroll,{passive:true});onScroll();
}
