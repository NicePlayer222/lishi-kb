<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>砺行备考知识库</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#FAF8F5;--side:#F7F4EF;--card:#FFFFFF;--fg:#1F2937;--muted:#64748B;
  --acc:#2563EB;--accbg:#EFF6FF;--bd:#E8E3DC;--hov:#F3F0EB;
  --code:#F3F0EB;--shadow:0 1px 2px rgba(31,41,55,.05),0 2px 8px rgba(31,41,55,.05);
  --topbar-h:60px;--side-w:260px;--toc-w:212px;
}
html[data-theme="dark"]{
  --bg:#0B1220;--side:#0E1626;--card:#111C2E;--fg:#F1F5F9;--muted:#94A3B8;
  --acc:#60A5FA;--accbg:#16283F;--bd:#293548;--hov:#1A2536;
  --code:#1A2536;--shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--fg);background:var(--bg);line-height:1.8;font-size:16px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
svg{display:block}

/* ---------- 顶部导航 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;display:flex;align-items:center;gap:12px;
  padding:0 24px;background:var(--card);border-bottom:1px solid var(--bd)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;cursor:pointer;user-select:none}
#topbar .brand .logo{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
#topbar .brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:2px}
#topbar .spacer{flex:1}
#topbar .tstat{color:var(--muted);font-size:12.5px;margin-right:6px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);
  background:var(--card);color:var(--fg);cursor:pointer;transition:background .15s,border-color .15s;padding:0}
.iconbtn:hover{background:var(--hov)}
#hamburger{display:none}

/* ---------- 布局骨架 ---------- */
#layout{display:flex;padding-top:var(--topbar-h);min-height:100vh}
#sidebar{width:var(--side-w);flex:none;background:var(--side);border-right:1px solid var(--bd);
  position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto;padding:14px 12px 32px}
#main{flex:1;min-width:0}
#content{max-width:1280px;margin:0 auto;padding:28px 40px 80px;width:100%}
.page-article{display:flex;gap:36px;max-width:1160px;margin:0 auto}
#articlecol{flex:1;min-width:0;max-width:800px}
#toccol{width:var(--toc-w);flex:none;position:sticky;top:calc(var(--topbar-h) + 28px);align-self:flex-start;max-height:calc(100vh - var(--topbar-h) - 56px);overflow-y:auto}

/* ---------- 侧边导航（Starlight 风格） ---------- */
.navgroup{margin-bottom:4px}
.navgroup-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;
  color:var(--fg);font-weight:600;font-size:13.5px;border-radius:8px;cursor:pointer;transition:background .15s}
.navgroup-head:hover{background:var(--hov)}
.navgroup-head .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:11.5px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:0 8px;line-height:1.7}
.navgroup-head .chev{transition:transform .15s;color:var(--muted);flex:none;display:inline-flex}
.navgroup.closed .chev svg{transform:rotate(-90deg)}
.navgroup ul{list-style:none;margin:2px 0 10px;padding:0}
.navgroup.closed ul{display:none}
.navgroup li a{display:block;padding:6px 10px 6px 26px;margin:1px 0;border-radius:8px;color:var(--muted);font-size:13px;line-height:1.5;cursor:pointer;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navgroup li a:hover{background:var(--hov);color:var(--fg);text-decoration:none}
.navgroup li a.active{background:var(--accbg);color:var(--acc);font-weight:600;border-left:2px solid var(--acc)}
#sidebar .sidecap{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:6px 10px 10px;font-weight:600}
#sidebar .sidefoot{margin-top:20px;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:12px;color:var(--muted);line-height:1.7}
#sidebar .sidefoot b{color:var(--fg);display:block;font-size:12.5px;margin-bottom:2px}

/* ---------- 首页（Knowledge Library 风格） ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:32px 0 22px;border-bottom:1px solid var(--bd);margin-bottom:22px}
.hero .kicker{display:inline-flex;align-items:center;gap:6px;color:var(--acc);background:var(--accbg);font-size:12.5px;font-weight:600;letter-spacing:.04em;padding:3px 12px;border-radius:99px;margin-bottom:12px}
.hero h1{font-size:33px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.hero .sub{font-size:16.5px;color:var(--muted);margin:0 0 8px}
.hero .desc{font-size:14px;color:var(--muted);max-width:620px;margin:0;line-height:1.8}
.statrow{display:flex;gap:12px;flex:none}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 18px;min-width:100px;text-align:center}
.stat .n{font-size:23px;font-weight:700;color:var(--acc);line-height:1.3;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}

.searchwrap{position:relative;margin:22px 0 26px}
.searchbox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;
  padding:0 16px;height:54px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.searchbox svg{flex:none;color:var(--muted)}
.searchbox input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--fg);height:100%}
.searchbox .sclear{border:0;background:var(--hov);color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0;font-size:12px}
.searchbox.hasval .sclear{display:inline-flex}
.searchbox kbd{font-family:inherit;font-size:11px;color:var(--muted);border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:var(--bg);flex:none}
#searchresults{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--bd);
  border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow-y:auto;z-index:40;display:none}
#searchresults .sr-cap{padding:8px 16px 4px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
#searchresults .sr-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--bd)}
#searchresults .sr-item:last-child{border-bottom:0}
#searchresults .sr-item:hover,#searchresults .sr-item.sel{background:var(--accbg)}
#searchresults .sr-item .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline}
#searchresults .sr-item .t .badge{font-size:11px;color:var(--acc);font-weight:700;flex:none;font-variant-numeric:tabular-nums}
#searchresults .sr-item .d{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
#searchresults .sr-empty{padding:18px 16px;color:var(--muted);font-size:14px}

.secthead{display:flex;align-items:baseline;gap:12px;margin:8px 0 14px}
.secthead h2{font-size:19px;margin:0}
.secthead .more{margin-left:auto;font-size:13px;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:34px}
.catcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;
  box-shadow:var(--shadow);transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:10px}
.catcard:hover{border-color:var(--acc);transform:translateY(-2px)}
.catcard .cchead{display:flex;align-items:center;gap:12px}
.catcard .letter{width:40px;height:40px;border-radius:11px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.catcard .ccmeta{min-width:0}
.catcard .cchead .cat{font-size:11px;color:var(--muted);letter-spacing:.08em}
.catcard h3{margin:0;font-size:15.5px;line-height:1.4}
.catcard .cntb{margin-left:auto;font-size:12px;color:var(--acc);font-weight:700;background:var(--accbg);border-radius:99px;padding:2px 10px;flex:none}
.catcard p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.7;flex:1}
.catcard .mini{display:flex;flex-direction:column;gap:2px;margin:2px 0}
.catcard .mini a{display:block;font-size:12.5px;color:var(--muted);padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.catcard .mini a:hover{color:var(--acc)}.catcard .foot{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--acc);font-weight:600;margin-top:auto}

/* 全部专题：表格式列表 */
.topicpanel{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:36px}
.topicpanel .tp-head{display:grid;grid-template-columns:72px 1fr 240px 32px;gap:16px;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--hov);font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.trow{display:grid;grid-template-columns:72px 1fr 240px 32px;gap:16px;align-items:center;padding:13px 24px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .12s}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--accbg)}
.trow .tid{font-weight:700;color:var(--acc);font-size:13px;font-variant-numeric:tabular-nums}
.trow .tt{min-width:0}
.trow .tt .t1{font-weight:600;font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .tt .t2{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.trow .tm .tags{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm .pillrow{display:flex;gap:6px}
.pill{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:6px;padding:0 8px;font-size:11px;font-weight:600;line-height:1.8}
.pill.dim{background:var(--hov);color:var(--muted);font-weight:500}
.trow .arr{color:var(--bd);transition:color .12s,transform .12s}
.trow:hover .arr{color:var(--acc);transform:translateX(2px)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--accbg);border:1px solid var(--bd);border-radius:12px;padding:12px 18px;font-size:13.5px;color:var(--fg);margin:0 0 26px}
.warn svg{flex:none;color:var(--acc);margin-top:3px}
.srcindex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 24px;margin-bottom:20px;box-shadow:var(--shadow);font-size:13px}
.srcindex summary{cursor:pointer;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;list-style:none}
.srcindex summary::-webkit-details-marker{display:none}
.srcindex summary .chev{transition:transform .15s;color:var(--muted);display:inline-flex}
.srcindex[open] summary .chev svg{transform:rotate(90deg)}
.srcindex .src{font-size:13px;color:var(--muted);word-break:break-all;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.homefoot{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0 6px}

/* ---------- 分类视图 ---------- */
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:26px 0 0}
.crumb a{cursor:pointer}
.catview-head{padding:18px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--bd);margin-bottom:22px}
.catview-head h1{font-size:26px;margin:0 0 6px}
.catview-head .sub{color:var(--muted);font-size:14px;margin:0;max-width:640px}
.topiclist{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.topiccard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 20px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:8px}
.topiccard:hover{border-color:var(--acc);transform:translateY(-2px)}
.topiccard .row1{display:flex;align-items:flex-start;gap:10px}
.topiccard .tid{color:var(--acc);font-weight:700;font-size:12.5px;flex:none;background:var(--accbg);border-radius:6px;padding:1px 8px;margin-top:2px}
.topiccard h3{margin:0;font-size:14.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topiccard .tags{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topiccard .meta2{display:flex;gap:12px;color:var(--muted);font-size:11.5px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--bd)}

/* ---------- 文章阅读（Fumadocs 风格） ---------- */
.backtop{display:inline-flex;align-items:center;gap:6px;margin:24px 0 10px;padding:6px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;transition:background .15s}
.backtop:hover{background:var(--hov);color:var(--fg)}
#toccol .toccap{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;font-weight:600}
#toc a{display:block;padding:4px 0 4px 12px;border-left:2px solid var(--bd);color:var(--muted);font-size:12.5px;line-height:1.5;cursor:pointer}
#toc a:hover{color:var(--fg);text-decoration:none}
#toc a.lvl3{padding-left:26px;font-size:12px}
#toc a.active{border-left-color:var(--acc);color:var(--acc);font-weight:600}
.kcard{background:var(--accbg);border:1px solid var(--bd);border-radius:14px;padding:18px 22px;margin:6px 0 28px;box-shadow:var(--shadow)}
.kcard .kcap{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.08em;color:var(--acc);font-weight:700;margin-bottom:8px}
.kcard .md p:last-child{margin-bottom:0}
article.md{line-height:1.8}
article.md h1{font-size:29px;line-height:1.35;margin:8px 0 18px;letter-spacing:-.01em}
article.md h2{font-size:23px;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
article.md h3{font-size:19px;margin:26px 0 10px}
article.md h4{font-size:16px;margin:20px 0 8px}
article.md p{margin:0 0 14px}
article.md ul,article.md ol{margin:0 0 14px;padding-left:24px}
article.md li{margin-bottom:4px}
article.md blockquote{margin:0 0 14px;padding:10px 18px;border-left:3px solid var(--acc);background:var(--hov);border-radius:0 8px 8px 0;color:var(--muted)}
article.md blockquote p{margin:0 0 6px}
article.md table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14px;display:block;overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
article.md th,article.md td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:7px 12px;text-align:left;vertical-align:top}
article.md th{background:var(--hov);font-weight:600;white-space:nowrap}
article.md code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
article.md pre{background:var(--code);padding:14px 16px;overflow:auto;border-radius:10px;font-size:13px;border:1px solid var(--bd)}
article.md pre code{background:none;padding:0}
.srcbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 22px;margin:26px 0;font-size:13.5px;word-break:break-all;box-shadow:var(--shadow)}
.srcbox b{font-size:14.5px}
.srcbox .srcitem{padding:7px 0;border-bottom:1px dashed var(--bd)}
.srcbox .srcitem:last-child{border-bottom:0}
.relbox h3{font-size:17px;margin:28px 0 12px}
.relbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.relbtns button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;font-size:13.5px;color:var(--fg);transition:border-color .15s,background .15s}
.relbtns button:hover{border-color:var(--acc);background:var(--accbg)}
.relbtns button .rid{color:var(--acc);font-weight:700;font-size:12.5px;flex:none}
.relbtns button .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12.5px;margin:0 0 14px}
.artmeta .pill{line-height:1.9}

/* 侧栏抽屉遮罩 */
#mask{display:none;position:fixed;inset:0;top:var(--topbar-h);background:rgba(15,23,42,.45);z-index:40}

/* ---------- 响应式 ---------- */
@media (max-width:1200px){
  .catgrid{grid-template-columns:repeat(2,1fr)}
  .trow,.topicpanel .tp-head{grid-template-columns:64px 1fr 200px 28px}
}
@media (max-width:1120px){
  #toccol{display:none}
  .page-article{max-width:none}
}
@media (max-width:900px){
  .trow,.topicpanel .tp-head{grid-template-columns:56px 1fr 28px}
  .trow .tm,.topicpanel .tp-head .h-meta{display:none}
}
@media (max-width:840px){
  #sidebar{position:fixed;left:0;top:var(--topbar-h);bottom:0;z-index:45;transform:translateX(-100%);transition:transform .2s;height:auto;width:280px}
  body.sideopen #sidebar{transform:translateX(0)}
  body.sideopen #mask{display:block}
  #hamburger{display:inline-flex}
  #content{padding:20px 18px 60px}
  .hero{flex-direction:column;align-items:flex-start;padding:26px 0 20px}
  .statrow{width:100%}
  .stat{flex:1;min-width:0;padding:10px 12px}
  .catgrid{grid-template-columns:1fr;gap:12px;margin-bottom:28px}
  .topiclist{grid-template-columns:1fr}
  .hero h1{font-size:28px}
  .page-article{display:block}
  #articlecol{max-width:none}
  .searchbox{height:48px}
  .searchbox kbd{display:none}
  .warn{max-width:none}
  .srcindex .src{grid-template-columns:1fr}
  .relbtns{grid-template-columns:1fr}
  #topbar .tstat{display:none}
  #topbar .brand small{display:none}
}
</style></head><body>
<div id="topbar">
  <button id="hamburger" class="iconbtn" onclick="document.body.classList.add('sideopen')" aria-label="打开导航"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand" onclick="go('home')"><span class="logo">砺</span><span>《砺行》知识库 <small id="verline"></small></span></div>
  <div class="spacer"></div>
  <span class="tstat" id="tstat"></span>
  <button class="iconbtn" onclick="toggleTheme()" id="themebtn" aria-label="切换深浅主题"></button>
</div>
<div id="layout">
  <nav id="sidebar" aria-label="知识导航"><div class="sidecap">知识分类</div><div id="navtree"></div>
    <div class="sidefoot"><b>备考知识库</b>面向 2027 河南选调生与省考的拓展阅读。新增专题后运行 build.py 即自动收录。</div>
  </nav>
  <div id="mask" onclick="document.body.classList.remove('sideopen')"></div>
  <div id="main"><div id="content"></div></div>
</div>
<script>
const DATA={"generated": "2026-10-19", "topics": [{"id": "A01", "title": "基层治理现代化：新时代\"枫桥经验\"、多元共治与自治法治德治结合", "category": "A", "tags": ["基层治理", "枫桥经验", "三治融合", "多元共治", "社会治理共同体"], "related": ["A02", "A03"], "evidence_level": "综合", "sources": ["SA01", "SA02", "SA03", "SA04"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A01-基层治理现代化.md", "card": "基层治理是国家治理的基石 [SA04]。新时代\"枫桥经验\"的核心是发动和依靠群众、矛盾不上交、就地化解，已从乡村治安经验扩展为涵盖自治、法治、德治（部分提法加入智治）相结合的基层治理体系，成为国家治理现代化的基本经验之一 [SA03]。其机制要点：党建引领、群众主体、预防在前、调解优先、多元主体协同共治。实际用途：为申论对策题提供\"谁来治（多元主体）—怎么治（三治融合+智治）—治什么（矛盾化解、服务供给）\"的完整框架；面试综合分析题中可从历史传承、制度优势、时代价值三层展开。适用于申论对策题、大作文分论点、面试综合分析题。深入阅读见下方\"📖 深度专题\"。"}, {"id": "A02", "title": "政策执行与执行偏差：经典视角与案例分析应用", "category": "A", "tags": ["政策执行", "执行偏差", "街头官僚", "自上而下", "自下而上"], "related": ["A01", "A03"], "evidence_level": "综合", "sources": ["SA05", "SA06", "SA04", "SA01"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A02-政策执行与执行偏差.md", "card": "\"三分政策、七分执行\"。政策执行研究两大经典视角：①自上而下：以中央决策为起点，关注上级如何控制与激励下级，偏差常被解释为目标模糊、资源不足、监督缺位；②自下而上：从基层实际操作出发，强调执行是再决策过程。Lipsky《街头官僚》（1980）指出：教师、警察等一线人员因工作量大、目标模糊、资源紧张而握有实际裁量权，其日常处理方式事实上在\"制定\"政策 [SA05][SA06]。用途：分析执行偏差题时按\"政策—执行主体—目标群体—环境\"四要素归因，对应对策。适用于案例分析题、面试对策题。深入阅读见\"📖 深度专题\"。"}, {"id": "A03", "title": "公共服务供给改革：\"放管服\"、标准化均等化与从管理到服务", "category": "A", "tags": ["放管服", "基本公共服务", "标准化", "均等化", "服务型政府"], "related": ["A01", "A02"], "evidence_level": "综合", "sources": ["SA07", "SA08", "SA10", "SA11", "SA09", "SA04", "SA01"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A03-公共服务供给改革.md", "card": "公共服务改革三条主线：①\"放管服\"——简政放权、放管结合、优化服务，处理政府与市场关系 [SA09]；②基本公共服务标准化、均等化——国家先后出台\"十三五\"均等化规划、\"十四五\"公共服务规划、《国家基本公共服务标准（2023 年版）》，基本公共服务由政府主导兜底，核心是机会均等而非简单平均，各地实施标准不得低于国家标准 [SA07][SA08]；③从\"管理\"到\"服务\"的理念转变——以人民为中心，政府转向服务供给与兜底保障。用途：大作文立意可落\"以服务换民心\"\"标准是底线、温度是追求\"；对策题可引用标准清单、购买服务、重心下沉。适用于申论大作文、对策题、面试综合分析题。深入阅读见\"📖 深度专题\"。"}, {"id": "A04", "title": "政策工具选择与激励机制：规制型、激励型、服务型工具的匹配逻辑", "category": "A", "tags": ["政策工具", "激励机制", "规制与激励", "工具组合", "政策设计"], "related": ["A02", "D05", "A05"], "evidence_level": "综合", "sources": ["SA40", "SA41", "SA42", "SA43", "SA44"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A04-政策工具选择与激励机制.md", "card": "政策工具是政府把政策目标转化为实际行动的手段 [SA41]，按强制程度分为自愿性、混合性、强制性三类 [SA41][SA44]；国内另一常用分法是供给型、环境型、需求型 [SA42][SA43]。核心观点：没有\"万能工具\"，工具选择必须与目标群体、执行条件相匹配，研究证据显示单一工具很少奏效、工具组合与协同才是关键 [SA42]。为什么值得了解：申论对策题的对策\"质感\"取决于所用工具是否具体、分层——只会写\"加强监管、加大宣传\"就是工具箱里只有一把锤子。与河南选调/省考关联：案例分析题要求\"提出解决问题的措施\"，本质是现场做一次工具选择与组合；面试也可用\"规制—激励—服务—赋能\"框架展开。适用题型：申论对策题、案例分析题、面试对策与综合分析题。深度入口见\"📖 深度专题\"。"}, {"id": "A05", "title": "跨部门协同与整体性治理：碎片化治理的破解、\"一支队伍管执法\"与\"高效办成一件事\"", "category": "A", "tags": ["跨部门协同", "整体性治理", "条块关系", "综合行政执法", "高效办成一件事"], "related": ["A02", "D01", "A01"], "evidence_level": "综合", "sources": ["SA50", "SA51", "SA52", "SA53", "SA54", "SA55"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A05-跨部门协同与整体性治理.md", "card": "核心观点：专业化分工带来的部门分割（\"九龙治水\"、条块分割）是公共治理的顽疾；整体性治理理论主张以公民需求为导向，通过协调、整合与责任机制把碎片化的部门重新\"缝合\"起来 [SA51]。中国语境下对应三套实践机制：跨部门协调机构（领导小组、联席会议、议事协调机构）、综合行政执法改革（\"一支队伍管执法\"）[SA52][SA53]，以及政务服务集成改革（\"一件事一次办\"、\"高效办成一件事\"）[SA54]。为什么值得了解：材料题最常见的归因对象就是\"多头管理、推诿扯皮、群众来回跑\"，本专题提供完整的\"问题—理论—对策\"链条。与河南关联：河南已出台实施意见落实国发〔2024〕3号文件。适用题型：申论对策题、案例分析题、面试综合分析。深入阅读见\"📖 深度专题\"。"}, {"id": "A06", "title": "公共政策评估与因果分析：从\"有没有效果\"到\"是不是政策带来的效果\"", "category": "A", "tags": ["政策评估", "因果推断", "双重差分", "反事实", "证据思维"], "related": ["A02", "D02", "A04"], "evidence_level": "研究", "sources": ["SA60", "SA61", "SA62", "SA63", "SA64", "SA65", "SA66"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A06-公共政策评估与因果分析.md", "card": "核心观点：政策\"有效\"必须回答因果问题——与没有这项政策相比结果是否更好，即\"反事实\"比较。评估分过程评估（政策是否按设计执行，衔接 [A02](A02-政策执行与执行偏差.md)）与结果评估（政策是否真的改变了目标结果）。现代因果推断的方法谱系：随机实验→准实验（双重差分 DID、断点回归 RDD、工具变量）→相关分析的谨慎使用 [SA61]。为什么值得了解：申论材料常把\"政策出台后指标变好\"直接归功于政策，能识别\"时间趋势、其他政策、选择偏差\"的干扰，是分析题的加分能力。与河南选调/省考关联：案例分析\"评价某政策成效\"、面试\"如何检验政策是否落地见效\"，可直接化用\"目标—反事实—归属\"框架。适用题型：案例分析、归纳概括、面试对策题。深度入口见\"📖 深度专题\"。"}, {"id": "A07", "title": "公共参与与利益相关者分析：从参与阶梯到精英俘获", "category": "A", "tags": ["公共参与", "利益相关者", "参与阶梯", "精英俘获", "参与式治理"], "related": ["A01", "D06", "A05"], "evidence_level": "综合", "sources": ["SA70", "SA71", "SA72", "SA73"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A07-公共参与与利益相关者分析.md", "card": "公共参与不是简单的\"开听证会\"：阿恩斯坦（Arnstein）把参与定义为\"权力的再分配\"，并提出从操纵到公民控制的八级参与阶梯，真正的参与只发生在梯子上部的\"伙伴关系—授权—公民控制\"三级 [SA70]。利益相关者分析则回答\"该让谁参与、按什么标准动员\"——通常从影响力与利益（受影响程度）两个维度对相关方定位 [综合]。参与式治理在基层有真实应用（如温岭参与式预算 [SA72]），但也有明确风险：动员起来的参与可能被地方精英俘获 [SA71]。适用题型：案例分析中\"如何让群众参与\"的对策题、面试综合分析题。深入阅读见\"📖 深度专题\"。"}, {"id": "A08", "title": "公共财政、预算绩效与资源配置：从全过程预算绩效管理到绩效信息的使用难题", "category": "A", "tags": ["预算绩效", "财政资源配置", "省以下财政体制", "绩效信息", "指标博弈"], "related": ["A04", "A03", "D02"], "evidence_level": "综合", "sources": ["SA80", "SA81", "SA82", "SA83"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A08-公共财政、预算绩效与资源配置.md", "card": "2018 年《中共中央 国务院关于全面实施预算绩效管理的意见》要求用 3—5 年基本建成\"全方位、全过程、全覆盖\"的预算绩效管理体系，直指\"重投入轻管理、重支出轻绩效\"\"绩效结果与预算安排挂钩机制未建立\"等问题 [SA80]。核心机制：把\"花钱必问效、无效必问责\"嵌入预算编制（事前绩效评估与目标设定）—执行监控—事后评价—结果应用全链条。但改革存在真实难题：绩效信息透明度不高、结果有效性偏低、过程导向偏重 [SA83]；基层层面则是财力与事权匹配问题，国办 2022 年文件明确要求委托事权须足额安排转移支付、不得向下转嫁支出责任 [SA81][SA82]。适用题型：申论对策题、案例分析题。详见\"📖 深度专题\"。"}, {"id": "A09", "title": "基层权责匹配与形式主义治理：属地管理、痕迹管理与减负政策脉络", "category": "A", "tags": ["基层减负", "权责错配", "属地管理", "痕迹管理", "职责准入"], "related": ["A02", "D07", "A05"], "evidence_level": "综合", "sources": ["SA90", "SA91", "SA92", "SA93", "SA94"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A09-基层权责匹配与形式主义治理.md", "card": "形式主义不只是作风问题，更是权责结构的产物：上级部门以\"属地管理\"之名把责任层层下压（\"属地管理是个筐，什么都可以往里装\"），基层出现\"能力有限、责任无限\"的错位 [SA92]；考核过频、过度留痕又催生\"痕迹管理\"异化，干部精力被报表台账占用。政策脉络：2019 年中办通知确立\"基层减负年\"，剑指文山会海、督查检查考核过多过频 [SA90]；2024 年中办国办《整治形式主义为基层减负若干规定》以党内法规形式作出硬约束（如部门面向基层的政务应用程序原则上最多 1 个、填表报数功能一般不延伸到县级）[SA91]。出路是职责清单与职责准入：厘清层级与部门职责边界，防止层层向基层转嫁责任 [SA92]。详见\"📖 深度专题\"。"}, {"id": "A10", "title": "风险治理与韧性城市理论：从风险社会到城市生命线安全工程", "category": "A", "tags": ["风险治理", "韧性城市", "城市生命线", "应急管理", "风险沟通"], "related": ["A01", "D08", "A02"], "evidence_level": "综合", "sources": ["SA100", "SA101", "SA102", "SA103"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "A10-风险治理与韧性城市理论.md", "card": "风险社会理论（贝克）指出：现代社会的风险由人类决策与技术系统本身制造，具有高度不确定性与跨边界扩散性 [SA103]。\"韧性\"是应对思路的核心概念，通行理解为城市系统抵御冲击、吸收扰动、快速恢复并适应学习的能力 [综合]；2024 年中办国办《关于推进新型城市基础设施建设打造韧性城市的意见》把韧性具体化为设施韧性、管理韧性、空间韧性，并部署城市基础设施生命线工程（燃气、供水、排水、桥梁等的实时监测预警）[SA100]。城市生命线的安全风险高度集中于地下管网：燃气泄漏爆炸、管道破裂塌陷直接威胁生命财产安全 [SA101]。适用题型：申论\"城市安全/应急管理\"主题、面试应急应变与综合分析题。详见\"📖 深度专题\"。"}, {"id": "B01", "title": "提取练习与间隔重复——测试效应与间隔效应的实证证据及公考刷题改造", "category": "B", "tags": ["提取练习", "testing-effect", "spacing-effect", "刷题方法", "学习风格迷思"], "related": ["B02", "B03"], "evidence_level": "研究", "sources": ["SB01", "SB02", "SB03", "SB04", "SB05"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "B01-提取练习与间隔重复.md", "card": "核心观点：主动从记忆中提取（自测）比反复重读更能提升长期记忆，即\"测试效应\"[研究]；把学习分散在多天进行（间隔重复）优于集中突击（集中学习）[研究]。两者是学习科学中证据最强的两项技术，Dunlosky 等人 2013 年对十种学习技术的综述中，只有练习测试与分散练习获得最高效用评级 [SB04]。实际用途：刷题先合卷自测再对答案；错题按\"当天→3 天→7 天→半月\"间隔重做，而非一次性集中刷同章题。适用：常识/言语积累、判断推理方法保持、申论素材复述。深入阅读见 [SB01][SB02]。"}, {"id": "B02", "title": "刻意练习与错题管理——deliberate practice 要素与公考错题本的科学用法", "category": "B", "tags": ["刻意练习", "deliberate-practice", "错题本", "反馈", "变式练习"], "related": ["B01", "B03"], "evidence_level": "研究", "sources": ["SB06", "SB07", "SB04"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "B02-刻意练习与错题管理.md", "card": "核心观点：高水平表现来自\"刻意练习\"——有明确目标、即时反馈、专注重复、持续走出舒适区的练习，而非单纯的时间堆积[研究]；对备考而言，错题本是刻意练习的载体：关键是错因分类与变式重练，而不是抄写与重读 [SB06][综合]。实际用途：每天刷题形成\"诊断—归因—定向重练\"闭环；错题本记错因不记题面。适用：行测提速与准确率攻坚、申论小题训练。注意：其对成绩差异的解释力近年受元分析质疑，不宜夸大（见\"争议与局限\"）[SB07]。深入阅读见 [SB04]。"}, {"id": "B03", "title": "认知负荷与知识迁移——工作记忆限制、样例效应与行测方法归类学习", "category": "B", "tags": ["认知负荷", "工作记忆", "样例效应", "组块", "迁移", "行测归类"], "related": ["B01", "B02"], "evidence_level": "研究", "sources": ["SB08", "SB09", "SB10"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "B03-认知负荷与知识迁移.md", "card": "核心观点：人的工作记忆容量极为有限，新手首次解题时把大量认知资源耗在盲目试错上，反而妨碍\"解题原理（图式）\"的习得——Sweller 的认知负荷理论据此提出，学习带完整解答的样例（worked examples）往往比直接埋头解题更利于新手构建图式[研究][SB08][SB09]；熟练化依赖组块与自动化，把多步骤压缩为单一单元以释放工作记忆 [SB08]。实际用途：行测按\"解题原理\"归类（非按题面），先精读样例再练变式；区分近迁移（同类题换数字）与远迁移（用于全新情境）并据此安排练习。深入阅读见 [SB10]。"}, {"id": "B04", "title": "元认知与学习效果校准——监测你的\"知道感\"，避免学习错觉误导备考分配", "category": "B", "tags": ["元认知", "学习效果校准", "学习错觉", "自我评估偏差", "自测"], "related": ["B01", "B02", "B03"], "evidence_level": "研究", "sources": ["SB40", "SB41", "SB42", "SB43", "SB44", "SB45", "SB46"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "B04-元认知与学习效果校准.md", "card": "核心观点：学习效果不仅取决于\"学了什么\"，还取决于你能否准确判断\"学会了没有\"——即元认知监测能力[研究][SB40][SB41]。人对自己掌握度的判断常系统性偏差：重读、看讲解产生的\"流畅感\"会被误读为掌握（学习错觉）[研究][SB42]；技能越弱的人越难察觉自己的不足，自评反而越偏高（Dunning 等的严谨表述）[研究][SB43][SB44]。校准的目标是让\"自觉会\"与\"真会\"对齐：判断有校准（总体不夸大）与分辨率（区分强弱项目）两个维度[研究][SB46]。延迟自测（隔一阵再问自己\"还能想起来吗\"）比学完立刻自评准确得多[研究][SB45]。用途：用限时盲测+延迟自评校准行测各模块掌握度，把时间投给\"自以为会其实不会\"的模块。深入阅读见 [SB41][SB46]。"}, {"id": "B05", "title": "长时间学习中的注意力、休息与记忆巩固——资源衰减、间断提取与睡眠依赖巩固的实证证据", "category": "B", "tags": ["持续注意", "警觉衰减", "休息与微休息", "睡眠与记忆巩固", "番茄工作法"], "related": ["B01", "B03", "B04"], "evidence_level": "研究", "sources": ["SB50", "SB51", "SB52", "SB53", "SB54", "SB55"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "B05-长时间学习中的注意力休息与记忆巩固.md", "card": "持续注意力任务中的表现衰减（vigilance decrement）是有大量实验支持的稳健现象：在高需求任务中，衰减可在 20–30 分钟内出现，休息能部分但不能完全恢复 [研究/SB50]。间隔重复配合含睡眠的间隔可促进长期保持：一项 Swahili 词对实验显示，包含睡眠的 12 小时间隔与 24 小时间隔的长期记忆效果相当 [研究/SB51]。白天小睡对陈述性记忆有巩固作用，且\"学习间小睡\"在 1 周后的保持优于\"学习间塞入更多内容\"（cramming）[研究/SB52]。与考试关联：为每天 8～8.5 小时课程设计节律——课后先用 10–15 分钟做提取式复习再休息、午间利用小睡或低强度休息、把高难度模块放在注意资源较充足的时段。注意：具体时长安排是经验性推断 [综合]，不是研究证明的统一最优方案，应以自身状态校准。深入阅读见下文。"}, {"id": "C01", "title": "河南选调与省考的考试结构与命题特点（备考参考）", "category": "C", "tags": ["河南选调", "河南省考", "考试结构", "命题特点", "分级分类"], "related": ["C02", "C03"], "evidence_level": "官方", "sources": ["SC01", "SC02", "SC03", "SC04", "SC05", "SC06"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C01-河南选调与省考考试结构.md", "card": "2025 年河南普通类选调笔试为一张试卷，含案例分析、行政能力测试、材料写作，满分 100 分，面试结构化 [官方/SC01]。河南省考 2025 届招 10993 人并新增\"政治理论\"模块、实行县级以上/县级以下分卷 [官方+SC04]；2026 届公告确认招 10429 人，公共科目为行测+申论各 100 分、分级分类命题，面试为结构化或结构化小组 [官方/SC02]。选调一张综合卷与省考分科考的差别决定了备考策略：前者要在单卷时间内切换三种题型，后者可分科训练。2027 年两类公告均未发布，上述结构可能调整，一切以 2027 年官方公告为准。深入阅读见下文与 C02、C03。"}, {"id": "C02", "title": "申论归纳概括与材料写作：从材料结构到答案生成的原理", "category": "C", "tags": ["申论", "归纳概括", "材料写作", "河南选调", "阅读理解"], "related": ["C01", "C03", "A01"], "evidence_level": "综合", "sources": ["SC01", "SC06"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C02-申论归纳概括与材料写作.md", "card": "归纳概括的底层是\"从给定材料中还原信息结构\"：材料通常由背景、争议、案例、数据、观点五类信息块组织而成，答案的分类轴常可从材料的组织方式中还原 [综合，经验归纳]。答题的关键动作只有两个——合并同类项（识别同属一个要点的散落信息）与逻辑排序（按材料既有逻辑或\"总—分\"关系排列）。河南选调\"材料写作\"与省考申论大作文同源：前者更接近依据材料成文的综合写作，后者要求在材料基础上展开论证；官方大纲把能力定义为阅读理解、综合分析、解决问题、文字表达四项 [官方/SC06]。适用题型：申论全部小题、选调材料写作。深入阅读见下文。"}, {"id": "C03", "title": "行测命题逻辑：资料分析与判断推理的思维模型", "category": "C", "tags": ["行测", "资料分析", "判断推理", "命题逻辑", "陷阱识别"], "related": ["C01", "C02"], "evidence_level": "综合", "sources": ["SC01", "SC02", "SC05", "SC06", "SC07"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C03-行测命题逻辑.md", "card": "资料分析的本质不是计算，而是\"信息定位 + 近似估算 + 陷阱识别\"三步：先在复合材料中定位目标数据的表、行、列与统计口径，再用数量级估算排除明显错误选项，最后核对单位、时间、口径三类陷阱。判断推理各子题型各有命题逻辑：图形推理是有限规律库的穷举匹配；定义判断是\"要件拆解—逐一对照\"；逻辑判断的核心是论证结构分析（前提→结论的跳跃处即削弱/加强的落点）。官方大纲将行测分为政治理论、常识、言语、数量、判断推理、资料分析六部分 [官方/SC06]。口诀只有短期价值，理解\"为什么这样出题\"才能应对没见过的变形。深入阅读见下文。"}, {"id": "C04", "title": "案例分析的问题诊断方法：从识别症状到构建解决路径", "category": "C", "tags": ["案例分析", "问题诊断", "根因分析", "申论对策题", "河南选调"], "related": ["C02", "D03", "A02"], "evidence_level": "综合", "sources": ["SC40", "SC41", "SC42", "SC43", "SC44", "SC45", "SC46", "SC47"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C04-案例分析的问题诊断方法.md", "card": "案例分析题考的表面是\"解决问题\"，底层是**问题诊断**：先判断材料里什么是症状、什么是机制、什么是根因，再决定答什么 [综合]。核心流程四步：**识别问题**（从数据、对话、后果中提炼\"不对劲\"）→ **区分症状与机制**（同一表象可有多种成因）→ **原因链分析**（用问题树、\"五个为什么\"分层）→ **按因果对应构建解决路径**（对策必须挂在已确诊的原因上）。国际组织与教育部门的根因分析规范均强调：治根因优于治症状，每条原因须有证据支撑 [官方/SC43, SC44]。河南选调笔试明确含\"案例分析\"[官方/SC42]；省考申论大纲要求\"提出和解决问题能力\"[官方/SC40, SC41]。适用题型：选调案例分析、申论对策与应急处理题、面试案例分析。深度入口见下文\"原因链分析\"一节。"}, {"id": "C05", "title": "行测论证逻辑与反例思维：从论证结构到削弱落点", "category": "C", "tags": ["行测", "判断推理", "论证逻辑", "批判性思维", "反例检验"], "related": ["C03", "B03", "C02"], "evidence_level": "综合", "sources": ["SC50", "SC51", "SC52", "SC53", "SC54"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C05-行测论证逻辑与反例思维.md", "card": "论证逻辑题的底层是批判性思维中的\"论证分析\"：论证由**前提**、**隐含假设**和**结论**构成，前提到结论的\"跳跃处\"就是削弱/加强/前提题的落点 [研究/SC51]。反例思维是检验论证的通用武器：构造一个满足前提却使结论失效的情形，就能证明论证无效——这正是\"削弱\"选项的本质。常见逻辑漏洞（样本偏差、偷换概念、以偏概全、诉诸权威等）在非形式逻辑中有系统分类 [研究/SC52]。官方大纲将判断推理定位为\"对各种事物关系的分析推理能力\"的测查 [官方/SC54]，但未公布论证题命题规律——本文是方法论综合，不是官方命题规则。适用：逻辑判断的削弱、加强、前提假设、解释题。深入阅读见下文。"}, {"id": "C06", "title": "资料分析的数量推理与误差控制", "category": "C", "tags": ["资料分析", "数量估算", "有效数字", "误差传播", "认知偏差"], "related": ["C03", "C05", "B03"], "evidence_level": "综合", "sources": ["SC60", "SC61", "SC62", "SC63", "SC64", "SC65"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C06-资料分析的数量推理与误差控制.md", "card": "资料分析不是\"算得快\"，而是\"在正确精度上停止计算\"。核心原理有三：①所需精度由选项间距决定——间距大时可粗估、间距小时须精算（\"算到首位即可\"的经验换算仅供参考，不是固定阈值，最终以当题选项为准）；②基期量=现期量/(1+r)，r 较小时可用\"基期≈现期×(1−r)\"近似，r 大时该近似失真须警惕；③误差传播有方向性——分子分母误差相近时按比例估算部分抵消，结果比单独截断任一数更准。心理学研究（Tversky & Kahneman 锚定效应、代表性启发等）解释了常见失分：被第一个算出的数锚定、把比重当增长率、忽视基础比率。所有估算技巧的边界都是当题的选项，脱离选项谈精度没有意义。深入阅读见下文。"}, {"id": "C07", "title": "申论论证结构与材料写作：从主张到回应的分析框架", "category": "C", "tags": ["申论", "大作文", "论证结构", "材料写作", "公文写作"], "related": ["C02", "D06", "D07"], "evidence_level": "综合", "sources": ["SC70", "SC71", "SC72", "SC73", "SC74"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C07-申论论证结构与材料写作.md", "card": "议论文的底层是论证结构，经典模型由图尔敏（Toulmin）在《论证的运用》（1958）中给出：**主张（claim）、证据/根据（ground）、担保（warrant）、支撑（backing）、限定（qualifier）、反驳（rebuttal）**六要件 [研究/SC71]。申论大作文\"五段三分式\"等常见框架，本质是这个模型的分段落地版：开头亮主张，分论点是理由，例证与数据是证据，段内\"例后分析\"承担担保功能。关键的操作能力是把给定材料当作**证据池**而非答案库：取舍、抽象、重组，让材料为论证服务，而不是把论证降格为材料堆砌。议论文重\"说服\"，公文重\"规范传达\"，两者结构逻辑不同 [官方/SC72]。本文是方法论综合，不是官方命题规律 [综合]。"}, {"id": "C08", "title": "言语理解的语境约束与主旨判断：从共现约束到篇章结构", "category": "C", "tags": ["行测", "言语理解", "语境分析", "主旨题", "篇章结构"], "related": ["C03", "C05", "B03"], "evidence_level": "综合", "sources": ["SC80", "SC81", "SC82", "SC83", "SC84", "SC85"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C08-言语理解的语境约束与主旨判断.md", "card": "言语理解题的底层是文本理解的认知机制。Kintsch 的\"建构—整合\"（Construction-Integration）模型指出：读者先自下而上激活词义、形成命题，再通过约束满足把激活的内容整合为连贯结构 [研究/SC80]——正确答案是被上下文约束\"筛剩\"的那个，而非直觉上\"最漂亮\"的那个。三个约束通道：**共现约束**（搭配，语料库语言学定义为其共现频率显著高于随机 [研究/SC81]）、**感情倾向约束**、**语义搭配约束**。主旨题则依赖篇章结构：总分、转折、因果三种结构各有标志词，主旨句落在结构重心。意图推断的边界是\"作者必然想的\"而非\"我顺着想的\"——过度推断是最大失分点 [综合]。本文是方法论综合，不是官方命题规律。"}, {"id": "C09", "title": "数量关系的数学建模与策略选择：从量—关系—约束到时间分配", "category": "C", "tags": ["行测", "数量关系", "数学建模", "策略选择", "代入检验"], "related": ["C03", "C06", "B02"], "evidence_level": "综合", "sources": ["SC90", "SC91", "SC92", "SC93"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C09-数量关系的数学建模与策略选择.md", "card": "数量关系应用题的本质是**数学建模**：把文字情境翻译为\"量—关系—约束\"三元组，再求解 [研究/SC91]。波利亚《怎样解题》的四阶段（理解问题—拟定计划—执行—回顾）是这一过程的经典框架 [研究/SC90]。行测特有的是两个\"考场变量\"：①**选项结构**——四选一的封闭集合使\"代入检验、排除\"成为与建模并列的合法路径，选项精度决定计算精度；②**时间约束**——每题平均不足 1 分钟（河南省考行测 120 题限 120 分钟 [综合/SC92]），于是\"放弃\"也是理性策略，时间分配本身是策略选择问题。数量关系与资料分析的思维差异：前者是从情境**正向**建模，后者是从既有数据**反向**定位与估算。本文是方法论综合，不是官方命题规律。"}, {"id": "C10", "title": "判断推理中的定义识别与类比边界：要件拆解与结构映射", "category": "C", "tags": ["行测", "判断推理", "定义判断", "类比推理", "结构映射"], "related": ["C05", "C03", "C08"], "evidence_level": "综合", "sources": ["SC100", "SC101", "SC102", "SC103"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "C10-判断推理中的定义识别与类比边界.md", "card": "定义判断与类比推理是判断推理中\"最不像逻辑学\"的两个子题型，但各有可靠的分析原理。定义判断的核心是**要件拆解**：把定义分解为主体、客体、行为、条件、结果等要件，与选项逐一对照排除 [综合/SC100]；抽象专业术语类题目则须退回概念实质（内涵），不能硬套要件 [综合/SC101]。类比推理的底层是 Gentner 的结构映射理论：类比的本体不是属性相似而是**关系结构相似**——\"原子像太阳系\"映射的是环绕关系而非颜色大小 [研究/SC102]。类比失效的典型情形：表面相似但关系不同向、关系成立但映射对象错位。官方大纲将判断推理定位为\"对各种事物关系的分析推理能力\"，含定义判断与类比推理两种常考题型 [官方/SC103]，但未公布任何命题规律——本文为方法论综合。"}, {"id": "D01", "title": "河南\"高效办成一件事\"改革：从多头跑到集成办理的政务服务重塑", "category": "D", "tags": ["高效办成一件事", "政务服务", "一网通办", "营商环境", "数字政府"], "related": ["A05", "A02", "D05"], "evidence_level": "官方", "sources": ["SD01", "SD02", "SD03", "SD04", "SD05", "SD06", "SD07", "SD08", "SD09"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D01-河南高效办成一件事改革.md", "card": "\"高效办成一件事\"是国务院2024年部署的政务服务改革抓手（国发〔2024〕3号），针对群众企业办事\"多头跑、反复交、耗时长\"的流程碎片化问题，把关联性强、办理量大的多个事项打包集成：一次告知、一表申请、一套材料、一窗（端）受理、一网办理 [SD01]。河南以豫政〔2024〕18号实施意见落实，提出2024年申请材料压减60%以上、办理时限压缩70%以上、办理环节压缩80%以上的量化目标（文件措辞为\"力争\"，属目标值而非已完成数据），并按要求在2024年内落地国务院部署的13个\"一件事\" [SD02]。用途：案例分析题（跨部门协同、整体性治理）、对策题（优化营商环境）、面试综合分析（从\"部门本位\"到\"用户本位\"）。深入阅读见\"📖 深度专题\"。"}, {"id": "D02", "title": "河南紧密型县域医共体改革：从试点到全省推开的政策与证据", "category": "D", "tags": ["县域医共体", "分级诊疗", "医保支付改革", "河南医改", "基层医疗"], "related": ["A06", "A03", "D05"], "evidence_level": "官方", "sources": ["SD10", "SD11", "SD12", "SD13", "SD14", "SD15", "SD16", "SD17"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D02-河南紧密型县域医共体改革.md", "card": "紧密型县域医共体是把县级医院、乡镇卫生院、村卫生室整合为\"责任、管理、服务、利益共同体\"，核心是\"人财物统一管理＋医保总额付费、结余留用、合理超支分担\"。国家层面：2019 年启动 828 个试点县，2023 年国卫基层发〔2023〕41 号文要求 2024 年 6 月底前以省为单位全面推开 [SD10][SD12]。河南 2021 年已实现 103 县（市）组建 190 个医共体全覆盖，并以\"13710\"督办机制推进 [SD11]；2025 年省政府办公厅再出高质量发展若干措施，力推去行政化、一体化管理 [SD13]。实际用途：申论中作为\"资源整合型公共服务改革\"典型案例，可对应政策工具、执行机制、医保杠杆三条线。适用题型：案例分析（政策落地）、对策题（基层能力建设）、面试综合分析。深入阅读见\"📖 深度专题\"。"}, {"id": "D03", "title": "河南基层矛盾纠纷多元化解：综治中心规范化、调解联动与网格化治理", "category": "D", "tags": ["矛盾纠纷多元化解", "综治中心", "新时代枫桥经验", "人民调解", "网格化治理"], "related": ["C04", "A01", "A05"], "evidence_level": "官方", "sources": ["SD20", "SD21", "SD22", "SD23", "SD24", "SD25", "SD26", "SD27", "SD28"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D03-河南基层矛盾纠纷多元化解.md", "card": "河南把矛盾纠纷多元化解作为基层高效能治理的关键环节，以\"预防在前、调解优先、法治化解决\"为主线 [SD25][SD20]。核心机制有四：①综治中心规范化建设——\"只进一扇门、最多跑一地\"，统一受理、分类流转、依法办理、闭环管理；②人民调解、行政调解、司法调解联动——司法所建强调解队伍，法院设人民调解工作室开展诉前调解；③网格化管理——网格员排查预警，把矛盾化解在萌芽；④新时代\"枫桥经验\"河南实践，与\"三零\"创建、党建引领基层高效能治理结合 [SD20][SD26]。实际用途：为案例分析题提供\"排查—受理—分流—化解—回访\"完整链条素材，为申论对策题提供\"一站式平台+三调联动+源头预防\"框架。适用题型：选调案例分析、申论对策与材料写作。深入阅读见下方\"📖 深度专题\"。"}, {"id": "D04", "title": "浙江\"千万工程\"实践：二十年持续迭代与政策经验的复制推广", "category": "D", "tags": ["千万工程", "乡村振兴", "农村人居环境", "政策延续性", "复制推广"], "related": ["A02", "A01", "D02"], "evidence_level": "官方", "sources": ["SD30", "SD31", "SD32", "SD33", "SD34", "SD35", "SD36", "SD37", "SD38"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D04-浙江千万工程实践.md", "card": "\"千万工程\"（千村示范、万村整治）是习近平同志 2003 年 6 月在浙江工作时亲自谋划推动的重大决策：从全省近 4 万个村庄中选择约 1 万个行政村全面整治、把其中约 1000 个中心村建成全面小康示范村，从农村人居环境整治入手，由点及面、迭代升级 [SD32][SD37]。二十年演进分三阶段：2003–2010\"千村示范、万村整治\"示范引领，2011–2020\"千村精品、万村美丽\"深化提升，2021 年起\"千村未来、万村共富\"迭代升级 [SD31]。核心支撑是\"一把手亲自抓、层层抓落实\"的领导体制与\"一张蓝图绘到底、一任接着一任干\"的延续机制 [SD33][SD34]。2024 年中央一号文件以学习运用\"千万工程\"经验为主题 [SD30]。适用于乡村振兴、政策延续性、复制推广条件类题目。"}, {"id": "D05", "title": "城市社区嵌入式公共服务：设施建设工程、运营模式与可持续性", "category": "D", "tags": ["社区嵌入式服务", "一老一小", "老年助餐", "普惠托育", "试点工程"], "related": ["A04", "A03", "D01"], "evidence_level": "官方", "sources": ["SD40", "SD41", "SD42", "SD43", "SD44", "SD45", "SD46", "SD47", "SD48", "SD49"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D05-城市社区嵌入式公共服务.md", "card": "城市社区嵌入式服务设施，指利用社区（小区）公共空间、房屋和场地，面向居民提供养老托育、社区助餐、家政便民、健康服务、体育健身、文化休闲、儿童游憩等一种或多种服务的设施，特点是小型灵活、公益普惠、集成便捷 [SD40]。政策主线：2023年11月国办转发发改委《城市社区嵌入式服务设施建设工程实施方案》（国办函〔2023〕121号），规划\"50个左右试点城市×每市100个左右社区\"，到2027年向更多城市推开 [SD40]；2024年9月三部门将56个城市纳入建设范围 [SD42]。核心机制：\"补改一批、转型一批、划转一批、配建一批\"盘活存量空间 + 公建民营、民办公助等普惠化运营 [SD40]。适用于申论\"社区服务/一老一小/民生实事\"类对策题与面试综合分析题。深入阅读见\"📖 深度专题\"。"}, {"id": "D06", "title": "河南基层网格化治理与数字赋能：机制、证据与\"指尖上的形式主义\"风险", "category": "D", "tags": ["网格化治理", "数字赋能", "基层治理平台", "指尖上的形式主义", "河南基层治理"], "related": ["A07", "A01", "C07"], "evidence_level": "官方", "sources": ["SD50", "SD51", "SD52", "SD53", "SD54", "SD55"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D06-河南基层网格化治理与数字赋能.md", "card": "网格化治理按标准把城乡划分为单元网格、配备网格员，依托统一数字平台形成\"上报—受理—分派—处置—反馈\"的事件流转闭环；河南近年主推\"党建+网格+大数据\"，郑州提出\"十个一\"党建引领网格化高效能治理体系，把综治中心规范化建设作为实体枢纽 [SD51][SD52][SD53]。数字赋能在主动发现问题、闭环处置上有真实作用，但同样存在被考核指标异化的风险——过多政务 App、工作群、打卡留痕催生\"指尖上的形式主义\"，中央已从 2023 年若干意见、2024 年若干规定到 2026 年政务 App 管理办法持续纠治 [SD54][SD55]。实际用途：案例分析、对策题、面试综合分析的河南本土素材。适用条件与局限见\"📖 深度专题\"。"}, {"id": "D07", "title": "河南南阳基层减负与乡镇（街道）履职事项清单实践", "category": "D", "tags": ["基层减负", "履职事项清单", "小马拉大车", "形式主义治理", "南阳"], "related": ["A09", "A02", "C07"], "evidence_level": "官方", "sources": ["SD60", "SD61", "SD62", "SD63"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D07-河南南阳基层减负与履职事项清单实践.md", "card": "基层减负的政策脉络是从\"减少文山会海\"深化到\"厘清权责边界\"：2024 年 2 月起全国 3.8 万个乡镇（街道）编制履职事项清单，2025 年 6 月底全部完成，平均每地 340 项，分基本履职、配合履职、上级部门收回\"三张清单\" [SD61]；2026 年 5 月中办国办再出《具体措施》，把清单定为考核基本依据、严禁\"条条干预\" [SD62]。河南南阳的做法是\"减负＋赋能\"双向发力：下放处罚权的同时建承接机制 [SD60]；郑州完成 193 个乡镇（街道）清单编制并清理工作群、标牌 [SD63]。核心考点是清单制的机制逻辑（以事定责、以责定考核）与局限（清单外变相摊派、减负反弹）。适用题型：案例分析、对策题、面试综合分析。"}, {"id": "D08", "title": "全国韧性城市与城市生命线安全工程：合肥模式与河南实践", "category": "D", "tags": ["韧性城市", "城市生命线安全工程", "合肥模式", "郑州暴雨", "城市安全监测"], "related": ["A10", "A01", "D05"], "evidence_level": "官方", "sources": ["SD70", "SD71", "SD72", "SD73", "SD74", "SD75", "SD76"], "created": "2026-10-18", "updated": "2026-10-18", "status": "draft", "file": "D08-全国韧性城市与城市生命线安全工程.md", "card": "韧性城市指承受适应能力强、恢复速度快的城市。2024 年 12 月中办国办《关于推进新型城市基础设施建设打造韧性城市的意见》确定目标：2027 年新型城市基础设施建设取得明显进展、2030 年建成一批高水平韧性城市，并以 CIM 平台与城市运行管理服务\"一网统管\"为技术骨架 [SD70]。城市生命线安全工程是其安全侧的先行实践：合肥 2017 年起对燃气、桥梁、管网布设物联感知设备实时监测预警，\"合肥模式\"经国务院安委办发文推广并写入国家部署 [SD73][SD74]；河南 2023 年印发三年行动方案（豫政办〔2023〕43 号），2025 年底前实现所有县（市）建成区\"三高\"区域六类监测 [SD71]；郑州\"7·20\"特大暴雨后的防洪排涝重建是河南韧性建设最直接的案例 [SD75][SD76]。考点：目标与效果的区分、监测预警的适用与局限。"}, {"id": "D09", "title": "兰考县东坝头镇\"共富工坊\"案例", "category": "D", "tags": ["河南", "乡村振兴", "共同富裕", "案例", "兰考"], "related": ["D10", "D01"], "evidence_level": "官方", "sources": ["SE01", "SE02", "SE03", "SE04", "SE05"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "D09-兰考东坝头镇共富工坊.md", "card": "兰考县东坝头镇位于黄河\"最后一道弯\"，辖 15 个行政村。该镇以党建引领盘活闲置资产，把空心院、闲置校舍改造为\"共富工坊\"，通过\"总部＋加工点\"模式引进河南海熠工艺品有限公司，形成\"孵化基地＋支部联建＋群众增收＋集体经济＋积分赋能\"五位一体机制。目前全镇已建成 13 个共富工坊，提供 2000 余个就业岗位，带动群众增收 1600 余万元。考试要点：小工坊如何撬动\"家门口就业＋集体经济＋弱势群体帮扶\"三重目标，可迁移到产业帮扶、基层党建、共同富裕等申论主题。"}, {"id": "D10", "title": "河南防止返贫动态监测帮扶", "category": "D", "tags": ["河南", "防返贫", "乡村振兴", "案例"], "related": ["D09", "D01"], "evidence_level": "官方", "sources": ["SE06", "SE07", "SE08", "SE09", "SE10", "SE11"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "D10-河南防返贫监测帮扶.md", "card": "防止返贫动态监测帮扶是脱贫攻坚过渡期（2021—2025）河南守牢底线的核心机制：以家庭为单位，通过农户自主申报、干部走访排查、部门筛查预警三条线识别存在返贫致贫风险的农户（参考线 2024 年为家庭年人均纯收入 8100 元），经村级评议、乡镇审核、县级确定后纳入监测，落实产业、就业、兜底、临时救助等针对性帮扶，风险稳定消除后退出并常态化监测。可考要点：监测识别\"三线\"来源、精准帮扶\"开发式为主＋保障性兜底\"、动态管理\"应纳尽纳、应扶尽扶、稳定消除\"。2025 年河南省委一号文件将其单列为\"确保不发生规模性返贫致贫\"专章。"}, {"id": "P01", "title": "2026年河南省政府工作报告摘要", "category": "D", "tags": ["河南", "政策", "政府工作报告", "十五五", "时政"], "related": ["P02", "D10"], "evidence_level": "官方", "sources": ["SE12", "SE13", "SE14", "SE15", "SE16"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "P01-政策-河南2026政府工作报告.md", "card": "2026年河南省政府工作报告是\"十五五\"开局之年的总部署。报告回顾\"十四五\"（GDP达6.66万亿元、粮食连续稳定高产）与2025年（GDP增长5.6%、粮食产量1350.97亿斤），提出2026年经济增长5%左右、粮食产量1300亿斤以上等预期目标，部署融入服务全国统一大市场、扩内需、现代化产业体系、乡村全面振兴、城乡区域协调、改革开放、文化、绿色转型、民生、防风险等十个方面重点工作。核心框架是\"1+2+4+N\"目标任务体系。选调考试中，本篇是时政常识题的直接题源，也是申论论述河南定位（粮食安全、统一大市场、新质生产力、黄河战略）时引用目标与数据的权威依据。"}, {"id": "P02", "title": "2026年河南省委一号文件摘要", "category": "D", "tags": ["河南", "政策", "一号文件", "乡村振兴", "粮食安全"], "related": ["P01", "D09", "D10"], "evidence_level": "官方", "sources": ["SE17", "SE18", "SE19", "SE20", "SE21"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "P02-政策-河南乡村振兴一号文件.md", "card": "2026年河南省委一号文件是\"十五五\"开局之年指导全省\"三农\"工作的纲领性文件，以推进乡村全面振兴为总抓手、以学习运用\"千万工程\"经验为引领，部署六大板块：持续提升粮食综合生产能力（粮食面积稳定在1.6亿亩以上、产量稳定在650亿公斤以上）、把农业建成现代化大产业（6大产业集群、18条乡村富民产业链）、统筹建立常态化防止返贫致贫机制、宜居宜业和美乡村建设（2026年培育35个先导区）、农村重点领域改革（第二轮土地承包延包30年整省试点）与党建引领基层治理。它把中央一号文件精神河南化、具体化，是选调考试\"三农\"主题的最高优先级政策文本：粮食安全、防返贫、和美乡村、延包试点四条线都从这里出题。"}, {"id": "W01", "title": "河南时政周报 2026-06-29 至 2026-07-05", "category": "A", "tags": ["河南", "时政周报", "交通运输", "民间投资", "中欧班列", "建党105周年"], "related": ["D09", "P01"], "evidence_level": "官方", "sources": ["SE22", "SE23", "SE24", "SE25", "SE26", "SE27", "SE28", "SE29", "SE30"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "W01-周报-2026-07-05.md", "card": "本周河南时政主线有四：一是省级密集出台稳经济政策，6月30日省政府新闻办吹风《河南省交通运输结构调整专项行动方案（2026—2028年）》，7月6日印发促进民间投资高质量发展20条；二是7月1日庆祝建党105周年大会举行，全省深入学习习近平总书记重要讲话精神；三是开放通道扩容，7月1日郑州国际陆港新增3条中欧（亚）班列图定线路；四是民生领域，7月3日失业保险稳岗扩岗\"两延续一优化\"政策落地、7月8日高招录取启动。本周期内黄河调水调沙持续推进（6月22日启动），是水利与生态治理的标志性事件。考法以常识（政策名称、时间、目标数字）与案例分析（运输结构调整逻辑）为主。"}, {"id": "W02", "title": "河南时政周报 2026-07-06 至 2026-07-12", "category": "A", "tags": ["河南", "时政周报", "民间投资", "长期护理保险", "高招录取", "粮食安全"], "related": ["W01", "D10", "P02"], "evidence_level": "官方", "sources": ["SE34", "SE27", "SE35", "SE31", "SE36", "SE29", "SE37", "SE32", "SE24", "SE38"], "created": "2026-10-19", "updated": "2026-10-19", "status": "draft", "file": "W02-周报-2026-07-12.md", "card": "本周河南时政主线：一是民生保障重磅——省政府办公厅印发《河南省建立长期护理保险制度实施方案》（豫政办〔2026〕24号），用3年左右在全省全面建立长护险制度，大河网7月10日全文发布；二是政策落地周——促进民间投资20条（7月6日）、服务业扩能提质实施意见等继续公开发布；三是黄河调水调沙7月10日9时完成水库调度，排沙1.79亿吨创历年同期之最；四是招生录取季启动，7月8日高招录取开始。此外，省政府7月还出台适应气候变化提升粮食生产防灾减灾能力指导意见（具 '是否有数据支撑、是否有证据证明它导致问题'。"}, {"id": "SC45", "title": "What is ROMA? — Diagnose a problem", "type": "web", "url": "https://odi.org/en/about/features/what-is-roma/", "publisher": "ODI (Overseas Development Institute)", "year": 2024, "checked_date": "2026-10-18", "note": "经web_extract核验：ROMA方法把'诊断问题'置于政策工作的核心环节，强调必须诊断到根因而非症状；先以'五个为什么'做近似诊断，再以鱼骨图做详细诊断。"}, {"id": "SC46", "title": "Rittel, H. W. J. & Webber, M. M. (1973). Dilemmas in a general theory of planning. Policy Sciences 4(2): 155-169", "type": "paper", "url": "https://link.springer.com/content/pdf/10.1007/s42532-022-00106-w.pdf", "publisher": "Policy Sciences（转述见 Xiang 2022, Socio-Ecological Practice Research 综述）", "year": 1973, "checked_date": "2026-10-18", "note": "'抗解问题'（wicked problems）原始论文；经综述PDF核验其十属性表（无最终界定的表述、无停止规则、解只有好坏之分、每个问题都可能是另一问题的症状、解释方式的选择决定解的性质等）。原文为付费文献，此处核验的是带完整属性表的开放综述。"}, {"id": "SC47", "title": "鱼骨图（特性要因图/石川图）百科条目", "type": "web", "url": "https://wiki.mbalib.com/wiki/%E9%B1%BC%E9%AA%A8%E5%9B%BE", "publisher": "MBA智库百科", "year": 2024, "checked_date": "2026-10-18", "note": "经web_extract与网页抓取核验：鱼骨图由石川馨于20世纪60年代提出，用于质量管理；画法要点（大要因中性描述、中小要因用价值判断、小要因须分析到可直接下对策、防止原因/现象/对策混淆）。开放百科条目，非同行评审来源。"}, {"id": "SC50", "title": "谷振诣《批判性思维与思维基本功》（光明日报讲演，中国青年政治学院）", "type": "paper", "url": "https://epaper.gmw.cn/gmrb/html/2011-05/16/nw.D110000gmrb_20110516_1-05.htm", "publisher": "光明日报（光明网转载）", "year": 2011, "checked_date": "2026-10-18", "note": "已核实可访问。提出批判性思维的宽容原则与中立原则、恩尼斯'反省思维'定义；作者为《批判性思维教程》（北京大学出版社2006）作者。用于论证评估的态度与标准部分。"}, {"id": "SC51", "title": "Matthew Van Cleave, Introduction to Logic and Critical Thinking (v1.4)", "type": "book", "url": "https://open.umn.edu/opentextbooks/textbooks/457", "publisher": "Open Textbook Library / Lansing Community College", "year": 2016, "checked_date": "2026-10-18", "note": "已核实可访问（CC BY 开放教材）。第1章含论证的识别与重构、标准形式、隐含前提（arguments with missing premises）等内容，是论证结构分析框架的主要依据。"}, {"id": "SC52", "title": "翟锦程、刘怡含《非形式逻辑在中国的传播与发展》", "type": "paper", "url": "http://www.southacademic.com/q 员预警培训机构退费纠纷并推动全市116家培训机构入资金监管平台等做法。"}, {"id": "SD23", "title": "河南司法行政系统充分发挥职能作用赋能平安河南建设", "type": "official", "url": "http://legalinfo.moj.gov.cn/pub/sfbzhfx/zhfxyfzl/yfzldfyfzl/202607/t20260714_537452.html", "publisher": "司法部微信公众号（智慧普法平台转载）", "year": 2026, "checked_date": "2026-10-18", "note": "已核实全文。2026年上半年全省累计化解各类矛盾纠纷30.21万件；人民调解委员会优化调整、退休法官任调解员、商事调解、矛盾纠纷多元化解专项小组等机制。"}, {"id": "SD24", "title": "让老百姓有地方'找个说法'，河南去年诉前调解分流案件43万件，调解成功近一半", "type": "web", "url": "https://www.shangbw.com/news/show-32006.html", "publisher": "河南商报", "year": 2021, "checked_date": "2026-10-18", "note": "已核实全文。2020年全省法院诉前调解分流案件43万件、成功20.1万件（46.7%）；139家中基层法院设248个人民调解工作室、入驻调解员1576人；民事一审案件同比下降11.49%。数据源自省高院副院长宋海萍介绍。"}, {"id": "SD25", "title": "全面推进综治中心规范化建设 不断夯实更高水平平安中国建设根基", "type": "web", "url": "https://xcb.just.edu.cn/2025/0915/c11681a366167/page.htm", "publisher": "江苏警官学院宣传部转载（理论文章）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文。系统阐述场所设置、部门入驻、运行机制、督办落实、信息化建设'五个规范化'，及统一受理—分类流转—依法办理—闭环管理流程；引用2019年《中国共产党政法工作条例》、2023年中办国办《关于坚持和发展新时代'枫桥经验'提升社会矛盾纠纷预防化解能力的意见》等文件脉络。"}, {"id": "SD26", "title": "党建引领网格化高效能治理", "type": "official", "url": "http://dangjian.people.com.cn/n1/2025/1229/c117092-40634221.html", "publisher": "中国共产党新闻网·党建（作者系郑州市委相关负责同志）", "year": 2025, "checked_date": "2026-10-18", "note": "已核实全文。郑州'十个一'党建引领网格化高效能治理体系、'一格管全面''一键全处理'闭环流程、河南省委'五基四化'部署等。"}, {"id": "SD27", "title": "《郑州市高效能社会治理网格化服务管理条例》新闻发布会", "type": "official", "url": "https://www.zhengzhou.gov.cn/conference3/9997732.jhtml", "publisher": "郑州市人民政府门户网站", "year": 2026, "checked_date": "2026-10-18", "note": "已核实发布稿全文。地方立法将网格化服务管理纳入法治化轨道，是网格化管理机制的制度化样本。"}, {"id": "SD28", "title": "综治中心规范化建设专栏（河南长安网）", "type": "web", "url": "http://www.henanpeace.org.cn/column.html?cid=1335", "publisher": "河南长安网（河南省委政法委主管）", "year": 2026, "checked_date": "2026-10-18", "note": "栏目聚合页，核实存在并持续更新（如2026-05-28平顶山湛河区'一站兜底全量纠纷、多元联动闭环化解'条目）；未逐条抓取全文，仅作省级政法系统专栏入口与佐证线索。"}, {"id": "SD30", "title": "中共中央 国务院关于学习运用\"千村示范、万村整治\"工程经验有力有效推进乡村全面振兴的意见（2024年中央一号文件）", "type": "official", "url": "https://www.gov.cn/zhengce/202402/content_6929934.htm", "publisher": "中共中央、国务院（中国政府网刊发，新华社受权发布）", "year": 2024, "checked_date": "2026-10-18", "note": "已核实全文。肯定'千万工程'为推进乡村全面振兴的成功经验和实践范例，要求学习运用其发展理念、工作方法和推进机制，把乡村全面振兴作为'三农'工作总抓手。"}, {"id": "SD31", "title": "造就万千美丽乡村 造福万千农民群众——\"千万工程\"二十年启示录", "type": "official", "url": "https://www.news.cn/politics/2023-06/25/c_1129715698.htm", "publisher": "新华社（新华网）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。含阶段划分（2003-2010示范引领、2011-2020深化提升、2021起迭代升级）；整治范围从约1万个行政村推广到全省所有行政村；农村居民人均可支配收入连续38年居全国省区第一；城乡收入比2003年2.43→2022年1.90。"}, {"id": "SD32", "title": "学习浙江\"千万工程\"经验案例", "type": "official", "url": "https://www.12371.cn/2023/06/20/ARTI1687250290285397.shtml", "publisher": "共产党员网（《同学》工作室）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实页面（正文含【详细】折叠，概况部分完整）：2003年6月启动背景，从近4万个村庄中选择约1万个行政村全面整治、约1000个中心村建成全面小康示范村；六条主要做法。"}, {"id": "SD33", "title": "造就万千美丽乡村 造福万千农民群众——中央财办、中央农办负责人就《关于有力有序有效推广浙江\"千万工程\"经验的指导意见》答记者问", "type": "official", "url": "https://www.12371.cn/2023/07/05/ARTI1688546116657744.shtml", "publisher": "新华社（共产党员网转载）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。六大科学方法（含'一把手'亲自抓的领导体制、因地制宜结合财政承受能力）；推广'三不'底线：不超越发展阶段、不搞形象工程、不搞强迫命令——复制推广条件的官方边界。"}, {"id": "SD34", "title": "中共浙江省委：在深入践行\"千万工程\"上走前列作示范", "type": "official", "url": "https://www.12371.cn/2023/06/16/ARTI1686882539201876.shtml", "publisher": "共产党员网（转载中共浙江省委署名文章）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。2022年城乡居民人均可支配收入71268元/37565元；规划保留村生活污水治理覆盖率100%、卫生厕所全覆盖、垃圾'零增长''零填埋'、90%以上村庄建成新时代美丽乡村；村级集体总资产8800亿元、年经营性收入50万以上行政村占比51.2%；2018年获联合国'地球卫士奖'。均为省级官方自报数据。"}, {"id": "SD35", "title": "农业农村部召开全国乡村建设工作推进会：以学习运用\"千万工程\"经验为引领，扎实有力推进宜居宜业和美乡村建设", "type": "official", "url": "https://www.gov.cn/lianbo/bumen/202411/content_6985268.htm", "publisher": "农业农村部（中国政府网）", "year": 2024, "checked_date": "2026-10-18", "note": "已核实全文。明确'省级党委政府负责、市县两级抓落实'推进机制、自下而上农民参与实施机制、不搞强迫命令与形象工程等要求。"}, {"id": "SD36", "title": "刘国中强调：学习运用\"千万工程\"经验 扎实稳步全面推进乡村振兴（全国现场推进会）", "type": "official", "url": "https://www.gov.cn/yaowen/liebiao/202310/content_6909042.htm", "publisher": "新华社（中国政府网）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。2023-10-13全国学习运用'千万工程'经验现场推进会在杭州召开；提出规划引领、梯次推进、逐步扩容、迭代升级的工作格局。"}, {"id": "SD37", "title": "中央农村工作会议关键提法之三：\"千万工程\"经验", "type": "official", "url": "https://www.news.cn/politics/20260104/ff4b57a492f741aea822b49239652125/c.html", "publisher": "新华网", "year": 2026, "checked_date": "2026-10-18", "note": "已核实全文。梳理2025年底中央农村工作会议提法：乡村全面振兴总抓手是学习运用'千万工程'经验；三阶段演进与2024年一号文件定位（据《习近平经济思想概论》）。"}, {"id": "SD38", "title": "中共中央 国务院关于做好2023年全面推进乡村振兴重点工作的意见（2023年中央一号文件）", "type": "official", "url": "https://www.gov.cn/zhengce/2023-02/13/content_5741370.htm", "publisher": "中共中央、国务院（中国政府网，新华社受权发布）", "year": 2023, "checked_date": "2026-10-18", "note": "已核实全文。第二十五、二十六条部署农村人居环境整治提升（厕所革命、污水垃圾治理）与乡村基础设施建设，为学习运用'千万工程'经验的全国化安排。"}, {"id": "SD40", "title": "国务院办公厅关于转发国家发展改革委《城市社区嵌入式服务设施建设工程实施方案》的通知（国办函〔2023〕121号）", "type": "official", "url": "https://www.gov.cn/zhengce/zhengceku/202311/content_6917191.htm", "publisher": "中国政府网（另见生态环境部转载页 mee.gov.cn/zcwj/gwywj/202312/t20231206_1058332.shtml，已抓取全文）", "year": 2023, "checked_date": "2026-10-18", "note": "已抓取全文核实（经mee.gov.cn转载页全文抓取，gov.cn原文页同文）：成文2023-11-19；七类服务、50个左右试点城市×每市100个左右社区、2027年推开、'四个一批'空间拓展、公建民营/民办公助运营模式、5年土地用途不变等支持政策原文在案。"}, {"id": "SD41", "title": "国家发展改革委 住房城乡建设部 自然资源部关于印发《城市社区嵌入式服务设施建设导则（试行）》的通知（发改社会〔2024〕5号）", "type": "official", "url": "https://www.ndrc.gov.cn/xxgk/zcfb/tz/202401/t20240117_1363400_ext.html", "publisher": "国家发展改革委", "year": 2024, "checked_date": "2026-10-18", "note": "已抓取全文核实：2024-01-03印发，为121号文的配套技术规范，附导则PDF/OFD。"}, {"id": "SD42", "title": "扎实推进城市社区嵌入式服务设施建设工程", "type": "official", "url": "https://www.ndrc.gov.cn/fggz/202409/t20240927_1393383.html", "publisher": "国家发展改革委（政研室）", "year": 2024, "checked_date": "2026-10-18", "note": "已抓取全文核实：三部门印发《关于扎实推进城市社区嵌入式服务设施建设工程的通知》，将江苏省苏州市等56个城市纳入工程建设范围；要求聚焦'一老一小'。56城完整名单未在该页逐项列出。"}, {"id": "SD43", "title": "让群众在'家门口'享受优质服务——相关部门解读城市社区嵌入式服务设施建设", "type": "official", "url": "https://www.gov.cn/zhengce/202311/content_6917403.htm", "publisher": "新华社（中国政府网转载）", "year": 2023, "checked_date": "2026-10-18", "note": "抓取经搜索结果页核验内容（发布会实录要点）：发改委刘明'关键小事/民生大事'、试点城市与社区遴选条件、避免'建设轰轰烈烈，服务冷冷清清'、普惠化运营等表述在案。该页正文经搜索摘录核对，未整页抓取，引用以转述为准。"}, {"id": "SD44", "title": "民政部等11部门《积极发展老年助餐服务行动方案》（民发〔2023〕58号）印发——计划到2025年底老年助餐服务网络形成一定规模", "type": "official", "url": "https://www.news.cn/politics/2023-10/24/c_1129933524.htm", "publisher": "新华社/新华网", "year": 2023, "checked_date": "2026-10-18", "note": "已抓取全文核实：11部门联合印发，2025/2026两阶段目标、纳入一刻钟居家养老服务圈、多元筹资机制（个人出一点、企业让一点、政府补一点等）在案。"}, {"id": "SD45", "title": "2023年度国家老龄事业发展公报", "type": "data", "url": "https://www.gov.cn/lianbo/bumen/202410/P020241012307602653540.pdf", "publisher": "民政部、全国老龄办（中国政府网PDF；解读见 gov.cn/lianbo/bumen/202410/content_6979486.htm）", "year": 2024, "checked_date": "2026-10-18", "note": "已抓取核实：截至2023年末60周岁及以上29697万人占21.1%，65岁及以上21676万人占15.4%，抚养比22.5%；解读页另载养老机构设施40.4万个、床位823万张等数据。"}, {"id": "SD46", "title": "2025年全国千人口托位数达到了4.73个", "type": "web", "url": "https://zhonghongwang.com/show-258-448761-1.html", "publisher": "中宏网（转述国家卫生健康委2025-12-26新闻发布会，人口家庭司司长王海东介绍）", "year": 2025, "checked_date": "2026-10-18", "note": "已抓取全文核实：千人口托位数4.73个、新增普惠托位89万个、托育机构12.6万家/托位666万个、'十四五'以来托位增幅132%。属官方发布会内容的媒体转述，标[综合]。"}, {"id": "SD47", "title": "2025年郑州市政府工作报告", "type": "official", "url": "https://zzjsj.zhengzhou.gov.cn/gzdt/9068453.jhtml", "publisher": "郑州市人民政府（郑州市城乡建设局网站转载，来源郑州日报）", "year": 2025, "checked_date": "2026-10-18", "note": "已抓取全文核实：2025-02-08市长何雄作报告；'入选全国首批城市社区嵌入式服务设施建设工程建设范围'、运营老年助餐场所645家/累计服务200万人次、普惠托育每千人托位4.8个等表述原文在案。"}, {"id": "SD48", "title": "社区食堂：让老人从舌尖暖到心尖", "type": "web", "url": "http://www.news.cn/caipiao/20240926/176c70fa87d34eb69727ebe8e78e9f44/c.html", "publisher": "河南日报（新华网转载）", "year": 2024, "checked_date": "2026-10-18", "note": "已抓取全文核实：老年助餐列入河南2024年十项重点民生实事；年度目标7300个 year": 2019, "checked_date": "2026-10-18", "note": "已核实摘要：80分钟无休息持续注意任务，衰减约30分钟内快速发生后趋稳；60分钟处金钱激励短暂提升表现但不能恢复初始水平——动机不能完全抵消衰减。"}, {"id": "SB54", "title": "Warm et al. (2015). Sustained attention in auditory and visual monitoring tasks: rest break countermeasure（PMID: 26276365）", "type": "paper", "url": "https://pubmed.ncbi.nlm.nih.gov/26276365", "publisher": "Human Factors（PubMed 收录）", "year": 2015, "checked_date": "2026-10-18", "note": "已核实摘要：40分钟监视任务中第30分钟插入5分钟休息改善后段成绩但不完全恢复；文中综述更短至1分钟微休息亦有恢复作用、衰减多在前20-30分钟。"}, {"id": "SB55", "title": "'I need a break': the effect of choice of rest break duration on vigilance（PMID: 34328396）", "type": "paper", "url": "https://pubmed.ncbi.nlm.nih.gov/34328396", "publisher": "Taylor & Francis（PubMed 收录）", "year": 2021, "checked_date": "2026-10-18", "note": "已核实摘要：30秒-150秒微休息总体不足以抵消警觉衰减与压力负荷；120秒休息显著优于30秒（检出率与敏感度），150秒未见显著优势；资源论与单调论解释并存。"}, {"id": "SB56", "title": "The effect of daytime napping and full-night sleep on the consolidation of declarative and procedural information（多中心研究，PMC6378597）", "type": "paper", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6378597", "publisher": "Nature and Science of Sleep（PMC 全文）", "year": 2019, "checked_date": "2026-10-18", "note": "已核实全文页：多中心研究未发现白天小睡对陈述性/程序性任务的显著行为学益处——作为小睡效果的反例证据登记，用于说明个体与任务差异，防止把小睡收益绝对化。"}, {"id": "SA70", "title": "A Ladder of Citizen Participation (Arnstein, 1969, JAIP 35(4))", "type": "paper", "url": "https://doi.org/10.1080/01944366908977225", "publisher": "Taylor & Francis (Journal of the American Institute of Planners)", "year": 1969, "checked_date": "2026-10-18", "note": "已抓取摘要与核心段落（参与=权力再分配、empty ritual 表述已核对），全文未逐页核读。"}, {"id": "SA71", "title": "Mobilization, Participatory Planning Institutions, and Elite Capture: Evidence from a Field Experiment in Rural Kenya", "type": "paper", "url": "https://www.sciencedirect.com/science/article/abs/pii/S0305750X14003362", "publisher": "World Development", "year": 2014, "checked_date": "2026-10-18", "note": "已抓取摘要与 highlights：动 const MDS={"A01-基层治理现代化.md": "\n# A01 基层治理现代化：新时代\"枫桥经验\"、多元共治与自治法治德治结合\n\n## ⚡ 快速知识卡\n\n基层治理是国家治理的基石 [SA04]。新时代\"枫桥经验\"的核心是发动和依靠群众、矛盾不上交、就地化解，已从乡村治安经验扩展为涵盖自治、法治、德治（部分提法加入智治）相结合的基层治理体系，成为国家治理现代化的基本经验之一 [SA03]。其机制要点：党建引领、群众主体、预防在前、调解优先、多元主体协同共治。实际用途：为申论对策题提供\"谁来治（多元主体）—怎么治（三治融合+智治）—治什么（矛盾化解、服务供给）\"的完整框架；面试综合分析题中可从历史传承、制度优势、时代价值三层展开。适用于申论对策题、大作文分论点、面试综合分析题。深入阅读见下方\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 理论背景\n\n\"枫桥经验\"诞生于 20 世纪 60 年代浙江诸暨枫桥，最初概括为\"发动和依靠群众，坚持矛盾不上交，就地解决\" [SA03]。经过数十年发展，特别是党的十八大以来，习近平总书记多次就坚持和发展新时代\"枫桥经验\"作出重要指示，\"枫桥经验\"已被写入党的十九届四中全会《决定》等中央文件，成为党领导人民推进国家治理体系和治理能力现代化的基本经验之一 [SA03]。2021 年《中共中央 国务院关于加强基层治理体系和治理能力现代化建设的意见》明确提出\"基层治理是国家治理的基石\"，目标是建立\"党组织统一领导、政府依法履责、各类组织积极协同、群众广泛参与，自治、法治、德治相结合的基层治理体系\" [SA04]。\n\n### 核心机制与关键概念\n\n1. **党建引领**：基层党组织对基层各类组织和各项工作统一领导，是多元共治的\"主心骨\" [SA04]。\n2. **多元共治/社会治理共同体**：政府治理同社会调节、居民自治良性互动；建设人人有责、人人尽责、人人享有的社会治理共同体，社会组织、志愿者、乡贤等都是治理主体 [SA03][SA04]。\n3. **自治、法治、德治\"三治融合\"**：自治激发活力（村规民约、民主议事），法治定分止争（法治思维、公共法律服务），德治春风化雨（公序良俗、道德教化）；官方论述中还强调与智治（科技支撑）结合，实现\"自律和他律、刚性和柔性\"相统一 [SA03][SA04]。\n4. **矛盾化解机制**：预防在前、调解优先、就地解决；健全矛盾纠纷一站式、多元化解决机制 [SA04]。\n5. **资源下沉**：网格化管理、精细化服务、信息化支撑，推动人财物向基层倾斜 [SA04]。\n\n### 案例与证据\n\n- 官方总结的新时代实践包括：北京\"接诉即办\"以一条热线统筹民生诉求、多地\"海上枫桥\"\"侨乡枫桥\"等，说明枫桥经验已从乡村拓展到社区、网络等新空间，从治安领域扩展到经济、社会、生态等多领域 [SA03]。\n- 中央文件层面：2021 年中央基层治理意见将\"坚持和发展新时代'枫桥经验'\"\"矛盾纠纷一站式、多元化解决机制\"直接写入乡镇（街道）平安建设能力要求 [SA04]。\n- [综合] 上述均为中央层面对经验的提炼与推广要求，属于规范性表述；对具体做法在河南本地落地的成效评估，缺乏可核验的公开研究数据，需 [存疑] 对待，答题时以政策导向而非\"成效数据\"为主。\n\n### 分歧与局限\n\n- **提法差异**：有\"三治融合\"与\"三治融合+智治（四治）\"两种表述并行，官方文件以\"自治、法治、德治相结合\"为主基调 [SA04]，答题建议以中央文件表述为准。\n- **[存疑]** 学术界对\"枫桥经验\"可复制性存在讨论：枫桥的做法依托较强的地方组织资源与经济基础，在财政薄弱地区推广效果是否等同，缺乏系统实证研究；答题时可作\"因地制宜\"的辩证点，但不要断言。\n- **局限**：多元共治实践中易出现\"政府强、社会弱\"、社会组织参与形式化的问题 [存疑]；对策题中可用\"赋权增能、培育社会组织、购买服务\"回应。\n\n### 与河南选调/省考的关联\n\n- 河南普通类选调笔试为一张试卷，含案例分析、行政能力测试、材料写作（2025 届官方通知载明，备考参考，以 2027 年官方公告为准）[SA01]；材料写作与案例分析常涉及基层矛盾化解、乡村治理情境，本专题框架可直接迁移。\n- 河南省考 2025 年起新增\"政治理论\"模块，行测 120 题/120 分钟（媒体转述，备考参考，以 2027 年官方公告为准）[SA02]；政治理论模块对\"枫桥经验\"\"社会治理共同体\"等表述的准确复述是基础功。\n- 面试综合分析题若给出\"基层干部忙于留痕\"\"群众诉求多头跑\"等现象，可用本专题的\"多元共治+三治融合+资源下沉\"框架归因并提出对策。\n\n## 来源与证据\n\n- [SA01] 《关于2025年选调应届优秀大学毕业生到基层工作的通知》，河南省委组织部等，2024-12-20。[官方]\n- [SA02] 大象新闻报道：2025 河南省考新增政治理论模块、行测 120 题/120 分钟，2025-01-07（媒体转述）。[综合]\n- [SA03] 《坚持和发展好新时代\"枫桥经验\"》，中国共产党新闻网（理论频道），2023-11-27。[官方]\n- [SA04] 《中共中央 国务院关于加强基层治理体系和治理能力现代化建设的意见》，2021-04-28。[官方]\n\n## 关联专题\n\n- [[A02]]：政策在基层落地正是执行研究的场域。\n- [[A03]]：服务重心向基层下沉与治理现代化互为表里。\n", "A02-政策执行与执行偏差.md": "\n# A02 政策执行与执行偏差：经典视角与案例分析应用\n\n## ⚡ 快速知识卡\n\n\"三分政策、七分执行\"。政策执行研究两大经典视角：①自上而下：以中央决策为起点，关注上级如何控制与激励下级，偏差常被解释为目标模糊、资源不足、监督缺位；②自下而上：从基层实际操作出发，强调执行是再决策过程。Lipsky《街头官僚》（1980）指出：教师、警察等一线人员因工作量大、目标模糊、资源紧张而握有实际裁量权，其日常处理方式事实上在\"制定\"政策 [SA05][SA06]。用途：分析执行偏差题时按\"政策—执行主体—目标群体—环境\"四要素归因，对应对策。适用于案例分析题、面试对策题。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 理论背景\n\n早期政策科学（如 Pressman & Wildavsky 对执行问题的经典研究）使\"执行\"成为独立研究领域 [存疑：具体著作版本与出版信息未经本次核实，只记观点脉络]。学界常将研究路径粗分为自上而下与自下而上两大传统：前者把执行视为高层决策的贯彻链条，后者认为政策在基层互动中形成 [综合]。Lipsky（1980）的街头官僚理论是其中最具影响力的贡献之一：一线公共服务人员在资源相对不足、需求超载、绩效难量化的条件下，会发展出简化惯例（routines）与对服务对象的分类简化，这些个体选择的累积会实质改变政策的走向 [SA05][SA06]。\n\n### 核心机制与关键概念\n\n1. **执行偏差的常见形态**[综合]：象征式执行、选择性执行、附加式执行、替代式执行、观望式执行——这是国内教科书的常见归纳，具体出处版本不一，[存疑] 仅作分析框架使用。\n2. **偏差成因四要素**[综合]：政策本身（目标模糊、标准冲突）、执行主体（能力、激励、裁量）、目标群体（配合度、利益）、执行环境（资源、体制、监督）。\n3. **街头官僚的裁量**：裁量权不可能被行政设计完全消除，管理改进应改变工作的结构与条件，而非仅加码指标控制 [SA05][SA06]。\n4. **对街头官僚的两种误读**：Lipsky 本人在三十周年版前言中澄清，街头官僚并非完全不可管理，公共服务也并非注定令人沮丧 [SA06]。\n\n### 案例与证据\n\n- 中央文件侧印证：2021 年中央基层治理意见要求\"依法赋予乡镇（街道）综合管理权、统筹协调权和应急处置权\"\"将直接面向群众、乡镇（街道）能够承接的服务事项依法下放\"，并强调规范面向基层的考核，为基层减负——这正是针对\"权责不对等、考核过载\"这类执行困境的制度回应 [SA04]。\n- Lipsky 的论证基于对美国公共服务一线（教师、警察、社会工作者等）的研究，原始情境是美国语境；中国基层（乡镇干部、社区工作者、网格员）与之有类似的结构性处境（任务多、资源紧、考核重），但制度环境不同，移植时须说明，避免生搬硬套 [综合]。\n- [存疑] 对中国街头官僚行为的本土实证研究数量多但结论分散，本知识库暂不引用具体论文，答题时用理论逻辑而非\"某研究显示\"。\n\n### 分歧与局限\n\n- 自上而下视角被批评忽视基层能动性，自下而上视角被批评弱化中央权威与政策统一性；后续研究走向整合（如\"混合路径\"），[存疑] 具体代表人物与文献未逐一核实，仅记趋势。\n- 街头官僚理论的局限：以西方公共服务体系为背景，裁量权的边界、问责机制在中国情境下差异较大；对中国\"基层干部\"不能简单等同街头官僚 [综合]。\n\n### 与河南选调/省考的关联\n\n- 河南普通类选调笔试含案例分析（2025 届官方通知，备考参考，以 2027 年官方公告为准）[SA01]。案例分析常给出\"好政策落不了地\"\"基层干部两头受挤\"等材料，本专题提供标准归因框架：先分层找原因（政策—执行者—群众—环境），再一一对应对策，避免只骂基层。\n- 面试应急应变/对策题中，可化用街头官僚观点：要理解一线的难处、通过改善工作结构与资源条件促其规范执行，而不是简单地\"加强问责\"一问了之 [SA05][SA06]。\n\n## 来源与证据\n\n- [SA05] Lipsky, M. *Street-Level Bureaucracy: Dilemmas of the Individual in Public Services*. Russell Sage Foundation, 1980。[研究]\n- [SA06] Russell Sage Foundation 对该书的介绍页及三十周年纪念版前言（2010）。[研究]\n- [SA04] 《中共中央 国务院关于加强基层治理体系和治理能力现代化建设的意见》，2021-04-28。[官方]\n- [SA01] 《关于2025年选调应届优秀大学毕业生到基层工作的通知》，河南省委组织部等，2024-12-20。[官方]\n\n## 关联专题\n\n- [[A01]]：基层是执行链条的末梢与治理创新的前沿。\n- [[A03]]：\"放管服\"落地本身是检验执行力的场景。\n", "A03-公共服务供给改革.md": "\n# A03 公共服务供给改革：\"放管服\"、标准化均等化与从管理到服务\n\n## ⚡ 快速知识卡\n\n公共服务改革三条主线：①\"放管服\"——简政放权、放管结合、优化服务，处理政府与市场关系 [SA09]；②基本公共服务标准化、均等化——国家先后出台\"十三五\"均等化规划、\"十四五\"公共服务规划、《国家基本公共服务标准（2023 年版）》，基本公共服务由政府主导兜底，核心是机会均等而非简单平均，各地实施标准不得低于国家标准 [SA07][SA08]；③从\"管理\"到\"服务\"的理念转变——以人民为中心，政府转向服务供给与兜底保障。用途：大作文立意可落\"以服务换民心\"\"标准是底线、温度是追求\"；对策题可引用标准清单、购买服务、重心下沉。适用于申论大作文、对策题、面试综合分析题。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 理论背景\n\n基本公共服务是\"由政府主导、保障全体公民生存和发展基本需要、与经济社会发展水平相适应的公共服务\"；均等化的\"核心是促进机会均等，重点是保障人民群众得到基本公共服务的机会，而不是简单的平均化\" [SA07]。新公共服务思潮（Denhardt 夫妇\"服务而非掌舵\"）[存疑：文献版本未逐条核实，仅记观点] 推动了\"服务型政府\"理念在国内的传播。我国的制度化路径以规划与国家标准为主：2017 年印发\"十三五\"均等化规划 [SA07]，2021 年印发《\"十四五\"公共服务规划》 [SA08]，2021 年首次出台国家基本公共服务标准，2023 年更新为《国家基本公共服务标准（2023 年版）》，覆盖幼有所育、学有所教、病有所医、老有所养等九大领域，2023 年版对服务事项作\"增、提、调\"共 48 项调整 [SA11]。\n\n### 核心机制与关键概念\n\n1. **\"放管服\"**：简政放权（降低准入门槛）、放管结合（事中事后监管）、优化服务（便民利企）；官方政策文件库集中收录相关文件 [SA09]。\n2. **标准化**：国家基本公共服务标准划出\"底线范围\"，为政府履职和公民享有权利提供依据；各地实施标准不得低于国家标准，超标事项须做财政承受能力评估 [SA08]。\n3. **均等化**：资源向农村、基层、边远地区和困难群众倾斜；\"十五五\"规划纲要进一步提出全面推进常住地提供基本公共服务，国务院已印发《关于推行常住地提供基本公共服务的实施意见》（2026 年）[SA10]。\n4. **供给方式多元化**：政府购买服务、PPP、公建民营、社会组织与志愿服务参与；原则上能通过政府购买提供的，不再直接举办事业单位提供 [SA07][SA08]。\n5. **重心下沉**：强化街道、乡镇和社区的基本公共服务职能，推动审批权限和公共服务事项向基层延伸 [SA08][SA04]。\n\n### 案例与证据\n\n- 《国家基本公共服务标准（2023 年版）》要求各地 2023 年底前印发不低于国家标准的地方实施标准，并对超标事项向国家发展改革委等报备——体现\"标准可上、不可虚\"的约束机制 [SA11]。\n- \"十三五\"均等化规划系统列出政府购买服务、PPP、志愿与慈善服务、\"互联网+\"益民服务等多元供给方式 [SA07]。\n- 国务院印发《关于推行常住地提供基本公共服务的实施意见》（2026 年），将其与农业转移人口市民化挂钩；国家发展改革委发布系列解读 [SA10]。\n- [综合] 以上为规划文本与官方解读层面的内容；各领域均等化的实际成效评价（如城乡差距缩小的量化评估）未逐一核实数据，答题时不引用具体百分比。\n\n### 分歧与局限\n\n- **均等化 ≠ 平均化**：官方明确反对简单平均，强调尽力而为、量力而行，防止\"不吊高胃口、过度承诺\" [SA07][SA08]——这是大作文中可以展开的辩证点。\n- **政府与市场的边界**：扩大社会力量参与的同时，政府兜底责任不可让渡 [SA08]；若一味强调市场化，可能损害基本服务的普惠性 [综合]。\n- **[存疑]** 基层在承接下沉服务事项时存在\"事下权不下、钱下人不下\"的讨论，缺乏可核验的系统研究，作现象分析时宜用\"需要关注\"而非断言。\n\n### 与河南选调/省考的关联\n\n- 河南普通类选调笔试含材料写作（2025 届官方通知，备考参考，以 2027 年官方公告为准）[SA01]。大作文若考民生服务、营商环境、城乡融合类主题，可直接用\"标准化兜底线—均等化促公平—多元化增活力—下沉式强基层\"四段式立意。\n- 河南是农业与人口大省，常住地提供基本公共服务、县域公共服务补短板等政策与河南场景高度相关 [SA10]，答题时结合河南乡村、县城素材更具说服力。\n- 面试综合分析题对\"证明多、跑腿多\"等现象，可用\"放管服\"框架回答：不仅放权，更要优化服务与监管协同 [SA09]。\n\n## 来源与证据\n\n- [SA07] 《国务院关于印发\"十三五\"推进基本公共服务均等化规划的通知》（国发〔2017〕9 号），2017-01-23。[官方]\n- [SA08] 《\"十四五\"公共服务规划》（发改社会〔2021〕1946 号，2021-12-28，国家发展改革委等 21 部门）。[官方]\n- [SA11] 《国家基本公共服务标准（2023 年版）》通知（发改社会〔2023〕1072 号，2023-07-30，国家发展改革委等 11 部门）。[官方]\n- [SA10] 国务院《关于推行常住地提供基本公共服务的实施意见》（2026-05）及国家发展改革委系列解读。[官方]\n- [SA09] 中国政府网\"放管服\"改革政策文件库专题。[官方]\n- [SA04] 《中共中央 国务院关于加强基层治理体系和治理能力现代化建设的意见》，2021-04-28。[官方]\n- [SA01] 《关于2025年选调应届优秀大学毕业生到基层工作的通知》，河南省委组织部等，2024-12-20。[官方]\n\n## 关联专题\n\n- [[A01]]：服务下沉与治理下沉是一体两面。\n- [[A02]]：改革措施能否落地取决于执行环节。\n", "A04-政策工具选择与激励机制.md": "\n# A04 政策工具选择与激励机制：规制型、激励型、服务型工具的匹配逻辑\n\n## ⚡ 快速知识卡\n\n政策工具是政府把政策目标转化为实际行动的手段 [SA41]，按强制程度分为自愿性、混合性、强制性三类 [SA41][SA44]；国内另一常用分法是供给型、环境型、需求型 [SA42][SA43]。核心观点：没有\"万能工具\"，工具选择必须与目标群体、执行条件相匹配，研究证据显示单一工具很少奏效、工具组合与协同才是关键 [SA42]。为什么值得了解：申论对策题的对策\"质感\"取决于所用工具是否具体、分层——只会写\"加强监管、加大宣传\"就是工具箱里只有一把锤子。与河南选调/省考关联：案例分析题要求\"提出解决问题的措施\"，本质是现场做一次工具选择与组合；面试也可用\"规制—激励—服务—赋能\"框架展开。适用题型：申论对策题、案例分析题、面试对策与综合分析题。深度入口见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n任何公共政策都要回答\"用什么手段让人做（或不做）某事\"。施耐德与英格拉姆的经典表述是：政策工具总是试图让人们做他们在其他情况下不会做的事情 [SA41]。政府手里的手段早已不限于命令——萨拉蒙在《政府工具》中指出，当代公共行动大量依赖贷款、贷款担保、补贴、合同、社会规制、税收支出、券（voucher）、保险等间接工具，政府越来越多地通过商业银行、医院、社会组织、企业等\"第三方\"递送公共服务，形成\"第三方政府\"格局；每一种工具都有自己的运行程序、技能要求和\"政治经济学\"，会给项目打上自己的烙印 [SA44]。因此\"选什么工具\"不是技术细节，而是决定政策成败与治理形态的关键问题。\n\n### 核心理论与关键概念\n\n1. **按强制程度的三分法**：豪利特等把工具分为自愿型（家庭社区、志愿者组织、市场，政府几乎不干预）、强制型（直接管制、公共企业、直接提供）和混合型（信息与劝诫、补贴、税收优惠、产权拍卖等，介于其间）[SA41][SA43]。麦克唐纳一系则按功能把工具分为：**管制工具**（迫使服从）、**激励工具**（以经济回报换取特定行动）、**能力建设工具**（投入资金物质与智力资源以培育能力）、**系统变迁工具**（通过权威再分配改变公共产品供给系统）[SA41]。萨拉蒙进一步强调，每种工具在有效性、效率、公平性、可管理性、合法性等维度上表现不同，没有全面占优的工具 [SA41][SA44]。\n2. **供给侧常用分类**：罗思韦尔与泽格维尔德按作用层面分为供给面（推动力：人才、资金、基础设施）、需求面（拉动力：政府采购、外包、贸易管制、消费端补贴）、环境面（间接影响：目标规划、金融税收、法规管制、知识产权）[SA43]。对 28 个省份基础研究政策的 fsQCA 分析显示：供给型工具使用频率最高（占编码总量约 51%），环境型约 36.7%，需求型仅约 12.2%；且单一政策工具并非高绩效的必要条件，提升机制呈现\"供给—环境协同\"\"供给—需求协同\"等多元组合路径 [SA42]。对央地人工智能产业政策的文本分析同样发现央地都以供给面和环境面为主、需求面使用很少（中央 8.11%、地方 9.41%），提示政策工具结构存在系统性偏科 [SA43]。\n3. **实施条件与效果差异**：强制型工具见效快、确定性高，但需要充分的监测执行能力，成本高且易引发抵触，执行不力时恰恰是 A02 所述\"执行偏差\"的高发区；激励型工具尊重目标群体自利，弹性大，但存在\"挤出内在动机\"与寻租风险，且补贴一旦形成利益结构便难以退出（工具拥护者现象 [SA41]）；服务型/赋能型工具（信息服务、能力建设、系统变迁）长效但见效慢，依赖政府与社会之间的信任与协作 [SA41][SA44]。工具选择还反哺政治：萨拉蒙指出工具选择会反过来塑造未来政策议程与利益格局 [SA44]。\n4. **中国语境下的工具组合**：国发〔2022〕5 号《关于加快推进政务服务标准化规范化便利化的指导意见》同时运用了多类工具——规范化（清单化管理、审管衔接，属规制型）、便利化（告知承诺制与容缺受理，是\"放松事前规制+信用约束\"的混合工具）、服务型（\"一网通办\"\"免证办\"\"就近办、网上办、掌上办\"）与赋能型（数据共享、平台公共支撑、政府购买服务并提供窗口人员）[SA40]。\"揭榜挂帅\"等科技项目机制则是以国家认证和示范效应降低社会主体不确定性、拉动长期投入的需求型/激励型工具 [SA42]。\n\n### 关键案例与证据\n\n- [研究] 28 省基础研究政策量化研究（2025 年发表）表明工具组合优于单打独斗，供给型工具是普遍有效的\"基本盘\"，需求型工具长期被低估 [SA42]。\n- [研究] 央地 AI 产业政策对比（2022 年发表）显示需求面工具占比不足一成，且地方工具更多样、更贴近本地禀赋，说明央地在工具选择上有分工空间 [SA43]。\n- [官方] 2022 年国务院政务服务文件展示了一项改革如何同时动用规制、激励（信用承诺）、服务、赋能四类工具并规定 2022/2025 两阶段目标 [SA40]。\n- [综合] 民生领域常见的\"强制分类+积分奖励+志愿者劝导+末端设施建设\"组合（如生活垃圾分类），可视为规制、激励、服务工具并用的例证；具体城市成效缺乏可核验的公开系统评估，[存疑] 对待，答题以工具逻辑而非具体数据为主。\n\n### 不同观点与局限\n\n- **工具乐观主义 vs 情境论**：技术论学派倾向\"找最优工具\"，过程论学派则强调工具非中性、嵌入价值与制度环境，围绕工具会形成\"工具拥护者\"利益团体，使工具选择政治化 [SA41]。答题时宜取中间立场：先诊断问题与对象，再匹配工具，并预留组合与调适空间。\n- **[存疑]** 中国研究中\"供给型工具占比高=偏科\"多基于政策文本计数，文本多不等于执行好、效果好；文本分析与实际效果的落差需要谨慎。\n- **激励机制的两面性**：激励可塑造行为，但过度依赖物质激励可能削弱公共服务的内在动机（这一点在公共管理文献中常被讨论，本文未核实针对中国基层的专门实证，故标注[存疑]），对策题中宜写\"物质激励+荣誉激励+容错纠错+职业发展\"的组合而非单纯发钱。\n\n### 与河南选调/省考的关联\n\n- 河南普通类选调笔试含案例分析、材料写作（2025 届官方通知载明，备考参考，以 2027 年官方公告为准），案例分析\"提对策\"环节可直接套用\"规制—激励—服务—赋能\"四层工具框架，使对策分层、可落地。\n- 申论大作文谈\"优化营商环境\"\"基层减负\"\"人才引留\"等主题时，可用\"没有万能工具、组合协同才有效\"作为分论点，并引用政务服务改革（告知承诺制、一网通办）作为正面素材 [SA40]。\n- 面试中若被问\"政策推不动怎么办\"，先归因工具错配（该激励的用了强制、该赋能的只发了文件），再给组合方案，比笼统喊\"加强落实\"高一个层次；与 A02 的执行偏差归因框架互补。\n\n### 原创练习\n\n**（原创练习）** 某县推行农村人居环境整治，初期靠干部上门督查通报（强制型），三个月后农户参与率停滞且抵触情绪上升。请用政策工具框架给出组合改进方案（提示：从激励——积分兑换、以奖代补；服务——统一收运设施与第三方运维；赋能——村规民约与红黑榜的自治功能；规制——保留对违规排放的底线约束四个层面各写一条，并说明每种工具的适用条件）。\n\n### 来源说明\n\n本文官方依据为国发〔2022〕5 号文件原文（已全文核对）[SA40]；理论框架转述自东北大学学报综述与萨拉蒙《政府工具》第一章 [SA41][SA44]（萨氏原文为 PDF，已确认可获取，要点经摘要核对、未逐页核读）；实证证据来自两项政策文本量化研究 [SA42][SA43]。无编造数据；未经核实的判断均已标注[综合]或[存疑]。\n\n## 来源与证据\n\n- [SA40] 《国务院关于加快推进政务服务标准化规范化便利化的指导意见》（国发〔2022〕5号），中国政府网，2022-03-01。https://www.gov.cn/zhengce/content/2022-03/01/content_5676259.htm [官方]\n- [SA41] 文宏：《政策工具研究的过程论视角：优势、逻辑与框架》，《东北大学学报（社会科学版）》2017年第3期，2017。https://xuebao.neu.edu.cn/social/article/html/2017-3-270.htm [研究]\n- [SA42] 《政策工具驱动科学竞争力提升的组态分析与路径选择——基于28个省份案例的fsQCA分析》，《科技进步与对策》2025年第42卷第2期，2025。https://www.kjjb.org/article/2025/1001-7348/2025-42-2-014.htm [研究]\n- [SA43] 《政策\"工具-功能\"视角下人工智能产业央地政策研究》，《科学学与科学技术管理》2022年第1期，2022。https://html.rhhz.net/KXYSH/html/ecdc238d-370b-4402-b65c-b5c9d4da8bc4.htm [研究]\n- [SA44] Lester M. Salamon, \"The Tools of Government: A Guide to the New Governance\"（Chapter 1），Oxford University Press，2002。https://spia.uga.edu/faculty_pages/tyler.scott/teaching/PADP6950_Spring2017/Readings/Salamon.2002.Ch1.pdf [研究]\n\n## 关联专题\n\n- [[A02]]：工具选错常是执行偏差的源头；本专题回答\"用什么推\"，A02 回答\"为什么推不动\"。\n- [[A05]]：本文讨论对目标群体的激励，A05 聚焦部门间协同与体制内协调机制。\n- [[D05]]：嵌入式服务是典型的服务型+赋能型工具在社区场景的落地。\n", "A05-跨部门协同与整体性治理.md": "\n# A05 跨部门协同与整体性治理：碎片化治理的破解、\"一支队伍管执法\"与\"高效办成一件事\"\n\n## ⚡ 快速知识卡\n\n核心观点：专业化分工带来的部门分割（\"九龙治水\"、条块分割）是公共治理的顽疾；整体性治理理论主张以公民需求为导向，通过协调、整合与责任机制把碎片化的部门重新\"缝合\"起来 [SA51]。中国语境下对应三套实践机制：跨部门协调机构（领导小组、联席会议、议事协调机构）、综合行政执法改革（\"一支队伍管执法\"）[SA52][SA53]，以及政务服务集成改革（\"一件事一次办\"、\"高效办成一件事\"）[SA54]。为什么值得了解：材料题最常见的归因对象就是\"多头管理、推诿扯皮、群众来回跑\"，本专题提供完整的\"问题—理论—对策\"链条。与河南关联：河南已出台实施意见落实国发〔2024〕3号文件。适用题型：申论对策题、案例分析题、面试综合分析。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 理论背景与问题定义\n\n现代政府按职能专业化分工设置部门（交通、环保、市场监管……），这本是提高专业效率的制度设计，但社会问题本身是整体性的：一条黑臭水体涉及环保、水利、住建、农业多个部门；一个流动摊贩的执法涉及城管、市场监管、卫生等\"七八个大盖帽\"。分工越细，边界越多，\"部门墙\"越高。其典型症状是：**横向**上部门间职责交叉与真空并存，出现\"有利抢着管、无利互相推\"；**纵向**上条块关系不顺，\"条\"（上级部门）的权力与\"块\"（属地政府）的责任不对等，基层概括为乡镇\"看得见管不着\"、部门\"管得着看不见\" [SA53]。\n\n学术上对这一问题的回应先后有整体性治理（Holistic Governance）与协同治理两条路径。整体性治理由英国学者希克斯（Perri 6）和邓利维（Patrick Dunleavy）等提出，是对新公共管理改革造成的碎片化（机构分散化、过度竞争、部门对立）的反思与修正，主张以公民需求和结果为导向，借助信息技术实现层级间、机构间、功能间的整合，提供\"一站式\"服务 [SA51]。竺乾威在《中国行政管理》上系统引介该理论，成为国内公共管理教学的高频概念 [SA51]。协同治理则更强调多元主体（政府、市场、社会组织）间的协作，核心问题是目标一致性、信任与信息共享 [综合]。\n\n### 核心机制与关键概念\n\n1. **跨部门协调机制**：中国体制内最常用的是议事协调机构——领导小组（党委层面如深化党和国家机构改革后组建的各类委员会）、联席会议、专项行动指挥部。周志忍、蒋敏娟对中国政府跨部门协同机制作了系统梳理，指出其运行高度依赖高层权威推动，制度化程度有待提高 [SA55]（该文观点经二手转述，见来源注）。特点：见效快，但易\"人走政息\"，且协调机构本身过多会加重基层负担。\n2. **机构整合**：2018年党和国家机构改革以\"大部制\"思路整合职责相近的部门，从组织源头上减少推诿空间。\n3. **综合行政执法改革**：整合执法队伍、相对集中行政处罚权，减少\"多头执法、重复执法\"。\n4. **条块关系调整与资源下沉**：2019年中办国办《关于推进基层整合审批服务执法力量的实施意见》要求按照依法下放、宜放则放原则向乡镇和街道赋权，实行\"权随事转、人随事转、钱随事转\"，县直部门设在乡镇的机构原则上实行属地管理，并明确上级不得以\"责任状\"\"一票否决\"向基层转嫁责任 [SA52]。这是\"条块协同\"的标志性政策。\n5. **政务数据共享与业务协同**：打破\"信息孤岛\"是跨部门协同的技术底座，\"高效办成一件事\"要求\"跨部门政策、业务、系统协同和数据共享\"[SA54]。\n\n### 关键研究证据与基层案例\n\n- **乡镇\"一支队伍管执法\"**：2019年中央实施意见明确提出\"逐步实现基层一支队伍管执法\"[SA52]。浙江省湖州市吴兴区的实践研究显示，当地将25个领域、22个执法部门共1599项行政处罚事项交由综合执法局统一行使，按照\"不低于80%比例锁定编制数\"下沉执法人员（277名，占85.23%），并配套法制审核、数字化指挥平台等机制 [SA53]。同一研究也坦承问题：下沉人员\"区属乡用\"的管理制度有待优化，乡镇执法队伍融合停留在联合检查层面，\"深度融合还有待加强\"，部分乡镇存在统筹协调力度不够、法制审核力量薄弱等问题 [SA53]。山西沁源县亦报道了\"乡镇吹哨、部门报到\"机制、执法事项清单（34项）、联席会议制度等做法 [官方/媒体转述，见来源表附注]。\n- **学术评估**：有研究将\"基层一支队伍管执法\"的制度逻辑概括为行政执法权力集中与重心下移的双重逻辑，指出浙江\"大综合一体化\"改革需妥善解决\"形（队伍）、权（赋权）、人（人员）、能（能力）\"四大问题，并建议借助新《行政处罚法》第24条厘定乡镇执法权配置的基本条件与事项标准 [SA55]。\n- **政务服务集成**：《国务院关于进一步优化政务服务提升行政效能推动\"高效办成一件事\"的指导意见》（国发〔2024〕3号）要求从企业和群众视角出发，将需多部门、跨层级办理的关联事项集成办理，明确每个\"一件事\"的牵头部门和配合部门职责，重构跨部门业务流程，推动\"申请表单多表合一、线上一网申请、材料一次提交\"，目标到2027年基本形成高效政务服务体系 [SA54]。这一\"从找部门到找政府\"的需求导向，与2018年审批服务便民化文件中\"按照整体政府理念、以一窗受理倒逼部门协同\"的表述一脉相承 [SA50][综合]。河南省政府亦已印发实施意见（豫政〔2024〕18号，经地方政策解读文件转述核实存在）。\n\n### 不同观点与适用局限\n\n- **\"合\"是否一定优于\"分\"**：整体性治理是对碎片化的纠偏，但并非所有领域都宜综合——专业执法（如生态环境监测执法）过度综合可能弱化专业性；吴兴研究反映的\"两套文书、两个系统\"困境说明整合的技术配套成本很高 [SA53]。答题时切忌把\"综合\"当万能对策，可补充\"宜统则统、宜分则分、依法赋权\"的限定语。\n- **协同的形式化风险**：联席会议开了、文件发了，但信息不共享、责任仍不明的\"伪协同\"普遍存在 [存疑]；协同的成败更取决于信息共享机制与责任分配，而非机构形式本身。\n- **赋权的承接能力**：中央文件强调\"放得下、接得住、管得好、有监督\"[SA52]；乡镇人员编制与专业能力不足时，一味下放事项反而制造新的执行偏差（与 A02 执行偏差直接相关）。\n\n### 与河南选调/省考的关联\n\n- 材料题高频情境：\"群众办一件事跑五个部门\"\"七八个大盖帽管不住一个摊\"\"乡镇看得见管不着\"——归因分析可用\"部门分割/条块失衡/信息壁垒\"三层框架，对策对应\"机制协同（联席会议、吹哨报到）/权力下沉（一支队伍管执法）/数据打通（一网通办）\"。\n- \"高效办成一件事\"是2024年以来的官方新表述，面试复述务必准确 [SA54]；河南实施意见（豫政〔2024〕18号）可作为省情加分素材。\n- 河南普通类选调笔试含案例分析、材料写作（2025届官方通知载明，备考参考，以2027年官方公告为准）；基层综合执法、政务服务改革是河南乡镇（街道）工作的日常场景，案例作答可直接迁移本专题框架。\n\n### 原创练习（思考题）\n\n1. 某县河道采砂监管涉及水利、自然资源、公安三部门，多年\"都管都不管\"。请用跨部门协同理论分析成因，并给出至少三条制度性对策（提示：不要只写\"加强领导\"）。\n2. 比较整体性治理与协同治理两种理论视角在分析\"乡镇一支队伍管执法\"改革时各自的侧重点。\n3. 面试题：\"有群众反映办理不动产过户需在多个部门之间往返五次\"。请作答并说明你会援引哪份中央文件、使用哪些关键表述。\n\n### 来源说明与关联\n\n本专题核心论断均标注来源编号；吴兴案例来自浙江大学公共政策研究院发布的地方改革研究报告 [SA53]，属地方性、非同行评审证据，使用时标注 [综合]。理论部分依托公开可核验的期刊文献 [SA51]。练习题答案可结合 A02（执行偏差）与 A01（基层治理）交叉作答。\n\n## 来源与证据\n\n- [SA50] 《关于深入推进审批服务便民化的指导意见》，中共中央办公厅、国务院办公厅，2018年。URL: https://ycklcz.com/html/art2018524art_27332_88498.html （镜像转载全文，含\"整体政府\"\"一窗受理\"表述；官方原始发布渠道为新华网/中国政府网，未能直接核验官方原页）。[官方]\n- [SA51] 竺乾威：《从新公共管理到整体性治理》，《中国行政管理》2008年第10期。URL: http://www.swg.zju.edu.cn/_upload/article/files/35/a1/40ba575044858e54c6abf6a1cdd5/74a5ee1b-46eb-4fce-a0fd-44bb78c37ab3.pdf （浙江大学机构页存档PDF，已核验可访问；本专题经由《整体性治理视阈中的\"最多跑一次\"改革》一文的引注核实其出处，未逐字复读原文）。[研究]\n- [SA52] 《关于推进基层整合审批服务执法力量的实施意见》，中共中央办公厅、国务院办公厅，2019-01-31。URL: https://www.xinhuanet.com/politics/2019-01/31/c_1124071769.htm （新华社受权发布，已核验全文可访问）。[官方]\n- [SA53] 《【研究】大综合一体化背景下吴兴区\"乡镇（街道）一支队伍管执法\"研究》，浙江大学公共政策研究院（ggzc.zju.edu.cn），2023-01-04。URL: http://www.ggzc.zju.edu.cn/2023/0104/c54184a2706186/page.htm （已核验全文可访问）。[研究/综合]\n- [SA54] 《国务院关于进一步优化政务服务提升行政效能推动\"高效办成一件事\"的指导意见》（国发〔2024〕3号），国务院，2024-01。URL: https://www.mee.gov.cn/zcwj/gwywj/202401/t20240116_1063866.shtml （生态环境部转载官方全文，已核验可访问；原文发布于中国政府网）。[官方]\n- [SA55] 《\"基层一支队伍管执法\"：制度逻辑、实践探索与规范路径》，期刊官网摘要页（journal08.magtech.org.cn，期刊名见该页），URL: http://journal08.magtech.org.cn/Jwk3_zlyj/CN/abstract/abstract2700.shtml （已核验摘要页可访问，全文需订阅；作者与期刊卷期未能免费核验，引用仅限摘要已载明的观点）。[研究]\n\n（辅助材料：山西沁源县\"一支队伍管执法\"报道 https://changzhi.gov.cn/xxgkml/czsrmzf/MTJD/202211/t20221124_2676700.shtml ，长治市政府网媒体转载，已核验可访问；因 SA 编号限于 50–59 且已用满核心来源，该条仅作案例旁证，未列入正式来源编号。）\n\n## 关联专题\n\n- [[A02]]：协同机制失灵与执行偏差互为因果。\n- [[A01]]：基层治理体系是条块关系调整的落点。\n- [[D01]]：国发〔2024〕3号在河南的落地案例。\n", "A06-公共政策评估与因果分析.md": "\n# A06 公共政策评估与因果分析：从\"有没有效果\"到\"是不是政策带来的效果\"\n\n## ⚡ 快速知识卡\n\n核心观点：政策\"有效\"必须回答因果问题——与没有这项政策相比结果是否更好，即\"反事实\"比较。评估分过程评估（政策是否按设计执行，衔接 [[A02]]）与结果评估（政策是否真的改变了目标结果）。现代因果推断的方法谱系：随机实验→准实验（双重差分 DID、断点回归 RDD、工具变量）→相关分析的谨慎使用 [SA61]。为什么值得了解：申论材料常把\"政策出台后指标变好\"直接归功于政策，能识别\"时间趋势、其他政策、选择偏差\"的干扰，是分析题的加分能力。与河南选调/省考关联：案例分析\"评价某政策成效\"、面试\"如何检验政策是否落地见效\"，可直接化用\"目标—反事实—归属\"框架。适用题型：案例分析、归纳概括、面试对策题。深度入口见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n政策评估要回答的问题不是\"政策实施后结果好不好\"，而是\"结果变好是不是政策带来的\"。前者只需看时间序列，后者需要构建\"反事实\"——如果没有这项政策，同样的对象会是什么样。反事实无法直接观测（同一批人不可能既受政策影响又不受影响），因此评估的核心是想办法\"构造\"一个可信的对照组 [SA61]。《重大行政决策程序暂行条例》第三十六条从制度上承认了评估的必要性：决策实施后明显未达预期效果、公民法人提出较多意见或决策机关认为有必要的，应当组织\"决策后评估\" [官方][SA60]。这意味着评估不只是学术活动，也是中国行政程序中的法定环节。\n\n### 核心理论：评估类型与因果推断基础\n\n**政策评估的基本类型**[综合]：①过程评估——考察政策是否按设计执行、执行中有无偏差（衔接 [[A02]] 的街头官僚与执行偏差分析）；②结果评估（影响评估）——考察政策对目标结果的因果影响；③效率评估——将结果与成本比较（如成本收益分析）。考试中\"评价政策成效\"类材料，通常需要三层都点到：执行是否到位→结果是否变化→变化能否归因于政策。\n\n**相关≠因果与常见谬误**[综合]：\n1. 时间趋势混淆：政策出台前指标已在下降/上升，事后变好可能只是延续原有趋势。\n2. 选择偏差：参加项目的群体本身就不一样（如自愿参加培训的人本来更有动力），简单比较\"参加者 vs 不参加者\"会高估效果。\n3. 同时期干扰：同一时期还有其他政策、宏观冲击在起作用，\"功劳\"归属错误。\n4. 幸存者偏差与统计口径变化：只看到达成的案例、指标定义中途调整。\n\n**因果推断的方法阶梯**[研究][SA61]：\n- **随机实验（RCT）**：把对象随机分为处理组与对照组，随机性保证两组在可观测与不可观测特征上类似，是因果识别的黄金标准。成本高、伦理与政治约束大。\n- **准实验（Quasi-experiment）**：利用现实中的\"类随机\"政策安排构造反事实，是政策评估的主力：\n  - **双重差分（DID）**：比较\"政策覆盖组前后变化\"与\"未覆盖组前后变化\"之差，用对照组的变化差分掉共同趋势。适用于分批铺开的政策（试点）。\n  - **断点回归（RDD）**：政策按某条门槛/边界规则执行（如分数线、地理分界），门槛两侧个体近似随机，比较门槛两侧差异。\n  - **工具变量（IV）**：找一个只通过政策影响结果的外生变量，处理\"自选择\"问题。\n- 方法论主干的教科书表述见 Angrist & Pischke《Mostly Harmless Econometrics》：回归控制、工具变量（自然实验）与双重差分（利用政策变化）构成应用计量的核心工具箱，用以回答\"小班教学能否提高成绩、教育提高多少工资\"这类明确因果问题 [SA61]。\n\n### 关键研究证据\n\n- **印尼大规模建校计划（DID 思路的经典应用）**：Duflo（2001, *American Economic Review*）利用 1973-1978 年印尼建校计划在地区间铺开数量不同、不同出生队列受影响时间不同这一\"天然差异\"，估计每千名儿童增建 1 所小学使平均受教育年限提高 0.12-0.19 年、工资提高 1.5-2.7% [SA62]。这是\"用政策的时空间差异做因果识别\"的教科书级示范。\n- **中国淮河供暖政策（断点回归）**：Chen, Ebenstein, Greenstone & Li（2013, *PNAS*）利用计划经济时期以淮河—秦岭为界的免费冬季供暖政策（以北供煤、以南不供），做断点回归估计：北方 TSP 污染物浓度高约 55%，北方居民预期寿命低约 5.5 年 [SA63]。政策规则本身任意性（以河为界）成为识别因果的来源，是\"用中国真实政策场景做准实验\"的代表作。\n- **哥伦比亚教育券（随机自然实验）**：Angrist 等（2001, NBER WP 8343）利用 PACES 项目按抽签分配教育券，比较中签与未中签学生：中签者就读私立学校比例高 15 个百分点、8 年级完成率高约 10 个百分点、标准化测试成绩高 0.2 个标准差 [SA64]。\n- **美国 HOPE 奖学金（DID 评估与政策的分配效应）**：Dynarski（2000, NBER WP 7756）以邻近州为对照做双重差分，估计佐治亚 HOPE 奖学金使 18-19 岁青年上大学率提高 7.0-7.9 个百分点，但同时指出该政策主要惠及中高收入家庭、扩大了种族与收入群体间的入学差距 [SA65]——评估不仅要看总量效果，还要看效果的分配。\n- **美国福利改革与健康（DID 与三重差分）**：Bitler, Gelbach & Hoynes（2004, NBER WP 10549）用 DID 与三重差分（以已婚女性、无子女单身女性为对照）发现福利改革与医保覆盖下降、就医减少相关，但对健康自评无显著影响 [SA66]，示范了对照选择与分群体效应分析。\n\n### 方法适用条件与局限\n\n- **DID 的关键假设**是\"平行趋势\"：若无政策，处理组与对照组应遵循相同趋势；需用政策前多期数据检验。试点选择非随机（常挑条件好的地方）时该假设受损 [综合]。\n- **RDD 的局限**：结论只在断点附近成立（局部效应），且政策边界越\"任意\"识别越可信，但现实中边界常伴随配套资源差异。\n- **RCT 的成本与外部效度**：实验结果能否推广到更大范围、更长时间（规模效应、一般均衡效应），是评估结论外推的主要风险 [综合]。\n- **数据要求**：政策前后的面板数据、可比对照地区，是所有准实验方法的前提；这也解释了为什么\"决策后评估\"在实践中常常乏力——不是缺方法，而是缺基线数据 [综合]。\n- **政治与伦理约束**：把部分人群留作对照组存在公平性质疑；评估结论触及部门利益时可能被弱化，故条例要求评估情形由决策机关确定并承担调整责任 [SA60][综合]。\n\n### 与考试能力的关联\n\n- 案例分析（河南选调含案例分析，备考参考，以 2027 年官方公告为准）：材料若写\"政策实施后 X 指标明显改善\"，可按\"目标—反事实—归属\"三步回应：先明确政策目标，再指出与谁比较才能下结论（基线/对照地区/未受益群体），最后讨论是否存在趋势、其他政策、选择偏差等替代解释。这比简单复述材料数据更能体现分析深度。\n- 面试对策题：回答\"如何检验政策是否落地见效\"时，可答三层——过程（督查考核、群众满意度）、结果（前后对比+试点 vs 非试点对照）、成本效率（投入产出），并强调建立评估前的基线数据制度 [SA60]。\n- 申论写作：用\"不能把相关当因果\"\"要看清趋势与对照\"的证据思维组织论证，避免\"政策一出台、指标就变好\"式的单线因果叙事。\n\n### 原创练习（思考题）\n\n1. 某县 2023 年出台返乡创业补贴，2024 年返乡创业企业数增长 30%。请列出至少三种可能使\"增长 30%\"不能归因于补贴的原因，并说明各需要什么数据来排除。\n2. 河南某医共体改革 2021 年在 5 个县试点、2023 年全省推开。如果你想评估试点对县域就诊率的影响，可用什么方法？需要哪些前置条件（提示：平行趋势、试点县选择是否随机）？关联 [[D02]]。\n3. 领导干部考核引入\"政策成效第三方评估\"，评估机构既要向政府负责又要保证独立。从评估方法与激励两个角度（关联 [[A04]]）分析这一安排的可行风险。\n\n### 来源说明\n\n本专题方法论主干取自已核实的应用计量教材页面 [SA61]；实证证据取自已核实摘要的四项真实评估研究 [SA62][SA63][SA64][SA65][SA66]；中国官方制度依据为已核实的《重大行政决策程序暂行条例》发布报道 [SA60]。标注 [综合] 的段落为知识库基于已核实材料的分析归纳，未引用未核实文献；政策评估类型的教科书划分在中国学界表述不一，故未给出具体出处，[存疑] 之处以方法逻辑而非\"某研究显示\"作答。\n\n## 来源与证据\n\n- [SA60] 《重大行政决策程序暂行条例》（国务院令第713号），2019年9月1日施行；新华社发布稿已核实，含第三十六条决策后评估启动情形。[官方]\n- [SA61] Angrist, J. & Pischke, J.-S. *Mostly Harmless Econometrics*. Princeton University Press, 2009。出版社页面已核实。[研究]\n- [SA62] Duflo, E. \"Schooling and Labor Market Consequences of School Construction in Indonesia\", *American Economic Review* 91(4), 2001。AEA 页面及摘要已核实。[研究]\n- [SA63] Chen, Y., Ebenstein, A., Greenstone, M. & Li, H. \"Evidence on the impact of sustained exposure to air pollution on life expectancy from China's Huai River policy\", *PNAS* 110(32), 2013。摘要已核实。[研究]\n- [SA64] Angrist, J. et al. \"Vouchers for Private Schooling in Colombia: Evidence from a Randomized Natural Experiment\", NBER WP 8343, 2001。摘要已核实。[研究]\n- [SA65] Dynarski, S. \"Hope for Whom? Financial Aid for the Middle Class and Its Impact on College Attendance\", NBER WP 7756, 2000。摘要已核实。[研究]\n- [SA66] Bitler, M., Gelbach, J. & Hoynes, H. \"Welfare Reform and Health\", NBER WP 10549, 2004。摘要已核实。[研究]\n\n## 关联专题\n\n- [[A02]]：过程评估的对象——政策如何被执行、偏差如何产生。\n- [[A04]]：评估结论反过来指导工具选择与激励设计。\n- [[D02]]：试点—推开模式的典型场景，是练习 DID 评估设计的本地素材。\n", "A07-公共参与与利益相关者分析.md": "\n# A07 公共参与与利益相关者分析：从参与阶梯到精英俘获\n\n## ⚡ 快速知识卡\n\n公共参与不是简单的\"开听证会\"：阿恩斯坦（Arnstein）把参与定义为\"权力的再分配\"，并提出从操纵到公民控制的八级参与阶梯，真正的参与只发生在梯子上部的\"伙伴关系—授权—公民控制\"三级 [SA70]。利益相关者分析则回答\"该让谁参与、按什么标准动员\"——通常从影响力与利益（受影响程度）两个维度对相关方定位 [综合]。参与式治理在基层有真实应用（如温岭参与式预算 [SA72]），但也有明确风险：动员起来的参与可能被地方精英俘获 [SA71]。适用题型：案例分析中\"如何让群众参与\"的对策题、面试综合分析题。深入阅读见\"📖 深度专题\"。\n\n## 📖 深度专题\n\n### 背景与问题定义\n\n几乎所有基层治理议题——老旧小区改造、人居环境整治、公共设施选址——都要回答\"群众要不要参与、参与多少\"。如果只把参与理解为\"政策宣布后的知情\"，就退化为象征性参与；
