name: 河南时政候选采集

# 每天北京时间 06:30 跑一次（UTC 22:30 前一天），也可手动触发。
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '回溯天数'
        required: false
        default: '7'

permissions:
  contents: write       # 需要把采集结果提交回仓库

concurrency:
  group: collect-hotnews
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集候选
        id: collect
        # 脚本设计为失败也退出 0（把错误记入 errors），
        # 所以这里不会因为某个源挂掉而让整个任务标红。
        run: |
          python scripts/collect_hotnews.py --days "${{ github.event.inputs.days || '7' }}"

      - name: 检查产物
        id: check
        run: |
          TODAY=$(date -u -d '+8 hours' +%F)
          MD="data/hotnews/${TODAY}.md"
          if [ -f "$MD" ]; then
            COUNT=$(grep -c '^- ' "$MD" || true)
            echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
            echo "md=${MD}" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "md=" >> "$GITHUB_OUTPUT"
          fi
          echo "今日候选：${COUNT:-0} 条"

      - name: 提交结果
        # 没有新条目时不产生空提交
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotnews/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(hotnews): 自动采集 ${{ steps.check.outputs.md }}"
          # 本地也通过 Contents API 往同一个仓库推送，可能刚好错开；
          # 失败就 rebase 后重试，最多 3 次。
          for i in 1 2 3; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送冲突，rebase 后重试 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          echo "::error::连续 3 次推送失败"
          exit 1

      - name: 写入任务摘要
        if: always()
        run: |
          MD="${{ steps.check.outputs.md }}"
          {
            echo "## 河南时政候选采集"
            echo ""
            echo "- 新增条目：**${{ steps.check.outputs.count || '0' }}** 条"
            if [ -n "$MD" ] && [ -f "$MD" ]; then
              echo ""
              echo "### 今日清单"
              echo ""
              sed -n '/^# /,$p' "$MD" | head -40
            fi
          } >> "$GITHUB_STEP_SUMMARY"
