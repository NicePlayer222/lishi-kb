name: 河南时政候选采集

# 每天北京时间 06:30 跑一次（UTC 22:30 前一天），也可手动触发。
#
# ⚠️ 已知限制（2026-10-21 实测）：
#   GitHub Actions 机房 IP 访问 henan.gov.cn / dahe.cn 均返回 403 Forbidden。
#   这是站点按网段封禁云厂商 IP，改 UA / 请求头无效（已试过，仍 403）。
#   本地家宽 IP 抓取正常（5 条/天）。所以本工作流目前跑得出结果但拿不到数据。
#   在换用不被封的来源或代理之前，保留它作为「可运行骨架」，不会产生空提交。
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '回溯天数'
        required: false
        default: '7'

permissions:
  contents: write       # 需要把采集结果提交回仓库

concurrency:
  group: collect-hotnews
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集候选
        id: collect
        # 脚本设计为失败也退出 0（把错误记入 errors），
        # 所以这里不会因为某个源挂掉而让整个任务标红。
        run: |
          python scripts/collect_hotnews.py --days "${{ github.event.inputs.days || '7' }}"

      - name: 检查产物
        id: check
        run: |
          TODAY=$(date -u -d '+8 hours' +%F)
          MD="data/hotnews/${TODAY}.md"
          COUNT=0
          if [ -f "$MD" ]; then
            # 只数「候选条目」区段（出现在「## 采集失败」之前），
            # 避免把失败源的列表项也算成候选。
            COUNT=$(sed '/^## 采集失败/,$d' "$MD" | grep -c '^- ' || true)
          fi
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "md=${MD}" >> "$GITHUB_OUTPUT"
          echo "今日候选：${COUNT} 条"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::本次采集 0 条。若两源都 403，是云厂商 IP 被封（已知限制）。"
          fi

      - name: 提交结果
        # 没有新条目时不产生空提交
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotnews/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(hotnews): 自动采集 ${{ steps.check.outputs.md }}"
          # 本地也通过 Contents API 往同一个仓库推送，可能刚好错开；
          # 失败就 rebase 后重试，最多 3 次。
          for i in 1 2 3; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送冲突，rebase 后重试 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          echo "::error::连续 3 次推送失败"
          exit 1

      - name: 写入任务摘要
        if: always()
        run: |
          MD="${{ steps.check.outputs.md }}"
          {
            echo "## 河南时政候选采集"
            echo ""
            echo "- 新增条目：**${{ steps.check.outputs.count || '0' }}** 条"
            echo ""
            echo "> 提示：GitHub Actions 机房 IP 访问政务/新闻源常被 403 拦截，"
            echo "> 若长期为 0 条，属已知限制，详情见工作流文件顶部说明。"
            if [ -n "$MD" ] && [ -f "$MD" ]; then
              echo ""
              echo "### 今日清单"
              echo ""
              sed -n '/^# /,$p' "$MD" | head -40
            fi
          } >> "$GITHUB_STEP_SUMMARY"
